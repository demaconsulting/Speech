      - "docs/verification/speech/diagnostics.md"                         # subsystem + inline unit verification
      - "src/DemaConsulting.Speech/Diagnostics/**/*.cs"                   # subsystem source
      - "test/DemaConsulting.Speech.Tests/Diagnostics/**/*.cs"            # subsystem tests

