      - "docs/reqstream/speech-text-en.yaml"
    paths:
      - "data/text-en/regression.tsv"                               # regression overlay
      - "data/text-en/generalization.tsv"                           # blind generalization set
      - "data/text-en/audit/generalization-review.tsv"              # blind label review of the generalization set
      - "data/text-en/prompts/generalization.md"                    # prompt of the blind generalization writer
      - "data/text-en/audit/regression-review.tsv"                  # blind ambiguity screen of the regression overlay
      - "data/text-en/prompts/review-regression.md"                 # prompt of the blind ambiguity screen

