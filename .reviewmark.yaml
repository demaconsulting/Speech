  # SpeechTextEn-TrainingDataProvenance Review (one per system data set)
  # The large tables of data/text-en are not review files (see the needs-review note above); the reviewed
  # MANIFEST.tsv pins every one of them, so a change to any data file changes this review set's fingerprint.
  - id: SpeechTextEn-TrainingDataProvenance
    title: Review that SpeechTextEn Training Data Provenance and Licensing are Complete and Accurate
    context:
      - "docs/design/speech-text-en.md"
      - "docs/reqstream/speech-text-en.yaml"
    paths:
      - "data/text-en/README.md"                                    # data folder overview, rules, provenance and CC0 dedication
      - "data/text-en/ATTRIBUTION.md"                               # attribution for the MASC-derived sentences
      - "data/text-en/MANIFEST.tsv"                                 # hash, size and row count of every data file
      - "data/text-en/leakage-report.tsv"                           # recorded external leakage result
      - "data/text-en/audit/audit-summary.md"                       # blind audit summary
      - "data/text-en/prompts/*.md"                                 # prompts that produced the generated and labeled data
      - "data/text-en/cluster-sources.tsv"                          # public-domain corpus: books, license basis and body pins
      - "data/text-en/cluster-removals.tsv"                         # public-domain corpus leakage-audit removals

