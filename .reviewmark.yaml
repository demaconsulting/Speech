---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"  # Verification documentation files
  - "docs/user_guide/**/*.md"    # User guide documentation
  - "docs/technical_overview/**/*.md"  # Technical overview documentation
  - "docs/sysml2/**/*.sysml"     # SysML2 architecture model
  - "src/DemaConsulting.Speech.Onnx.Kokoro/PACKAGE-LICENSE.md"      # Kokoro package license file
  - "src/DemaConsulting.Speech.Onnx.Kokoro/THIRD-PARTY-NOTICES.md"  # Kokoro third-party notices
  - "src/DemaConsulting.Speech.Text.En/PACKAGE-LICENSE.md"          # Text.En package license file
  - "src/DemaConsulting.Speech.Text.En/THIRD-PARTY-NOTICES.md"      # Text.En third-party notices
  - "src/DemaConsulting.Speech.Text.En/Resources/*.tsv"             # Text.En embedded lexicon tables
  - "test/DemaConsulting.Speech.Text.En.Tests/TestData/*.tsv"       # Text.En golden test data
  - "data/text-en/**/*.md"                                          # Text.En training data documents, audit summary and prompts
  - "data/text-en/MANIFEST.tsv"                                     # Text.En training data manifest (pins every data file)
  - "data/text-en/readings.tsv"                                     # Text.En reading inventory
  - "data/text-en/forms.tsv"                                        # Text.En reading forms
  - "data/text-en/whd-mapping.tsv"                                  # Text.En evaluation id mapping (ids only)
  - "data/text-en/bench-mapping.tsv"                                # Text.En external benchmark key to reading id mapping (ids only)
  - "data/text-en/extension-decisions.tsv"                          # Text.En inventory extension decisions
  - "data/text-en/leakage-report.tsv"                               # Text.En recorded external leakage result
  - "data/text-en/regression.tsv"                                   # Text.En regression overlay (references to flagged, golden and existing sentences)
  - "data/text-en/generalization.tsv"                               # Text.En blind generalization test set
  - "data/text-en/audit/generalization-review.tsv"                  # Text.En blind label review of the generalization set
  - "data/text-en/audit/regression-review.tsv"                      # Text.En blind ambiguity screen of the regression overlay
  - "data/text-en/cluster-sources.tsv"                              # Text.En public-domain corpus pins and license record
  - "data/text-en/cluster-removals.tsv"                             # Text.En public-domain corpus leakage-audit removals (ids and hashes only)
  - "tools/DemaConsulting.Speech.Text.En.Trainer/README.md"         # Text.En trainer commands and determinism contract
  - "tools/DemaConsulting.Speech.Text.En.Trainer/RUN-LOG.md"        # Text.En heteronym model protocol, dev exploration and gate runs
  - "tools/DemaConsulting.Speech.Text.En.Trainer/training.json"     # Text.En heteronym model training record (pins the model image hash)
  - "tools/DemaConsulting.Speech.Text.En.Trainer/external-sources.json"  # Text.En external evaluation dataset pins (revision, address, listing hash)
  - "tools/DemaConsulting.Speech.Text.En.Trainer/external-files.tsv"     # Text.En external evaluation per-file pins (path, SHA-256, size)
  - "docs/evaluation/**/*.md"                                       # Text.En heteronym model evaluation record documents (and the Phonemes.En evaluation record)
  - "docs/evaluation/**/*.tsv"                                      # Text.En heteronym model evaluation record tables (and the Phonemes.En evaluation record)
  - "src/DemaConsulting.Speech.Phonemes.En/PACKAGE-LICENSE.md"      # Phonemes.En package license file
  - "src/DemaConsulting.Speech.Phonemes.En/THIRD-PARTY-NOTICES.md"  # Phonemes.En third-party notices (CMU Pronouncing Dictionary)
  - "test/DemaConsulting.Speech.Phonemes.En.Tests/TestData/*.tsv"   # Phonemes.En golden test data
  - "data/phonemes-en/**/*.md"                                      # Phonemes.En data README (provenance, pins and rules)
  - "data/phonemes-en/*.tsv"                                        # Phonemes.En data manifest, reading tables, gap list and renderer corpora
  - "tools/DemaConsulting.Speech.Phonemes.En.Tools/README.md"       # Phonemes.En tools commands, gates and the local-only oracle rule
  - "src/DemaConsulting.Speech.Onnx.Piper/PACKAGE-LICENSE.md"       # Piper package license file
  - "src/DemaConsulting.Speech.Onnx.Piper/THIRD-PARTY-NOTICES.md"   # Piper third-party notices (voice attribution)
  - "test/DemaConsulting.Speech.Onnx.Piper.Tests/TestData/*.tsv"    # Piper golden test data
  - "test/DemaConsulting.Speech.Onnx.Piper.Tests/TestData/*.json"   # Piper voice configuration test data (trimmed real configuration)
  - "test/DemaConsulting.Speech.Onnx.Kokoro.Tests/TestData/*.tsv"   # Kokoro golden test data
  - "test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/TestData/*.tsv"  # NemotronStt golden feature values (NeMo-formula reference)
  - "test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/TestData/*.md"   # NemotronStt golden data recipe and provenance
  - "data/stt-en/**/*.md"                                           # STT evaluation data README and attribution (LibriSpeech CC BY 4.0, CC0 poem)
  - "data/stt-en/MANIFEST.tsv"                                      # STT evaluation data manifest (SHA-256 pins and reference transcripts)
  - "tools/DemaConsulting.Speech.SttEvaluation/README.md"           # STT evaluation tool commands, gates and the no-third-party-output rule
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!**/generated/**"            # Exclude generated output
  - "!node_modules/**"           # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment
  - "!tools/KokoroOnnxBenchmark/**"  # Exclude dev-only benchmark spike (not part of the public surface)
  - "!tools/ModelDownloader/**"      # Exclude dev-only model downloader (not part of the public surface)
  - "!tools/ModelBundler/**"         # Exclude the maintainer-only model bundling tool (not part of the public surface; modeled in SysML2)
  - "!test/DemaConsulting.Speech.ModelBundler.Tests/**"  # Exclude the maintainer-only model bundling tool's tests
  - "!tools/DemaConsulting.Speech.Proofreader/**"       # Exclude dev-only TTS proofreading tool (not part of the public surface)
  - "!test/DemaConsulting.Speech.Proofreader.Tests/**"  # Exclude the dev-only proofreading tool's tests
  - "!data/text-en/external/**"      # Exclude local evaluation caches (never committed)
  - "!data/text-en/work/**"          # Exclude local scratch (never committed)
  - "!data/phonemes-en/external/**"  # Exclude the local CMU Pronouncing Dictionary download (never committed)
  - "!data/phonemes-en/work/**"      # Exclude local scratch (never committed)
  # The embedded images of the Phonemes.En package (src/DemaConsulting.Speech.Phonemes.En/Resources/cmudict-en.bin.gz and
  # lts-en.bin.gz) are binaries that a person cannot review. They are pinned by the reviewed data/phonemes-en/MANIFEST.tsv
  # (the SHA-256 of each uncompressed image) and verified by the tools commands build-lexicon --check and train-lts --check,
  # as the Phonemes.En design documents explain. The Phonemes.En tools project (tools/DemaConsulting.Speech.Phonemes.En.Tools)
  # is NOT excluded: it is reviewed in the SpeechPhonemesEn-DataTools review sets.
  # The Text.En trainer (tools/DemaConsulting.Speech.Text.En.Trainer) is NOT excluded: it is reviewed.
  # The trained heteronym model (src/DemaConsulting.Speech.Text.En/Resources/heteronyms.bin) is deliberately not a
  # review file: it is a binary that a person cannot review. It is pinned by the reviewed training.json (the SHA-256
  # of its uncompressed image, the hash of its inputs and its settings) and verified by the trainer's train --check
  # command, which retrains it, as the design documents explain.
  # The large data tables of data/text-en (train, dev, holdout-*, both provenance tables, exclusions, gaps,
  # extension candidates, audit/*.tsv except the generalization and regression reviews, check-output.txt) are deliberately
  # not review files: they are pinned by the reviewed MANIFEST.tsv and verified by the trainer's check-data command, as
  # the design documents explain.

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/Speech/reviews/index.json

# Global context shown to every reviewer for orientation (not fingerprinted).
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"                              # exclude design intro from user-facing review
    paths:
      - "README.md"                                                 # project readme
      - "docs/user_guide/**/*.md"                                   # user guide

  # Technical Overview Review (the informational theory-of-operation document)
  - id: TechnicalOverview
    title: Review that the Technical Overview is Accurate and Consistent with the Evaluation Records
    context:
      - "README.md"
      - "docs/evaluation/text-en/README.md"
      - "docs/evaluation/text-en/external/README.md"
      - "docs/evaluation/phonemes-en/summary.md"
      - "tools/DemaConsulting.Speech.Proofreader/README.md"
    paths:
      - "docs/technical_overview/**/*.md"                           # technical overview chapters

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that Speech Decomposition Addresses the Stated Purpose
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "requirements.yaml"                                         # root requirements file
      - "docs/reqstream/quality.yaml"                               # root quality/process requirements grouping
      - "docs/design/introduction.md"                               # design introduction
      - "docs/sysml2/**/*.sysml"                                    # SysML2 model (authoritative structure)

  # Speech-Architecture Review (one per system)
  - id: Speech-Architecture
    title: Review that Speech Architecture Satisfies Requirements
    context:
      - "README.md"
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/speech.yaml"                      # system requirements
      - "docs/design/introduction.md"                                           # design introduction
      - "docs/design/speech.md"                               # system design
      - "docs/verification/introduction.md"                                    # verification introduction
      - "docs/verification/speech.md"                        # system verification
      - "test/DemaConsulting.Speech.Tests/SpeechTests.cs"  # integration tests
      - "test/DemaConsulting.Speech.Tests/PlatformSupportTests.cs"  # per-platform and per-runtime evidence tests
  # Speech-Design Review (one per system)
  - id: Speech-Design
    title: Review that Speech Design is Consistent and Complete
    context:
      - "docs/reqstream/speech.yaml"
    paths:
      - "docs/reqstream/speech/platform-requirements.yaml"  # platform requirements
      - "docs/design/introduction.md"                                       # design introduction
      - "docs/design/speech.md"                           # system design
      - "docs/design/speech/**/*.md"                      # all system design documents
      - "docs/design/ots.md"                                                # OTS overview

  # Speech-Verification Review (one per system)
  - id: Speech-Verification
    title: Review that Speech Verification is Consistent and Complete
    context:
      - "docs/reqstream/speech.yaml"
    paths:
      - "docs/verification/introduction.md"                                 # verification introduction
      - "docs/verification/speech.md"                     # system verification
      - "docs/verification/speech/**/*.md"               # all verification documents
      - "docs/verification/ots.md"                                          # OTS overview

  # Speech-AllRequirements Review (one per system)
  - id: Speech-AllRequirements
    title: Review that All Speech Requirements are Complete
    context:
      - "docs/design/speech.md"
      - "docs/reqstream/speech.yaml"
    paths:
      - "docs/reqstream/speech/**/*.yaml"                                   # Speech subsystem/unit requirements files

  # Speech-Diagnostics Review (one per subsystem)
  - id: Speech-Diagnostics
    title: Review that Speech Diagnostics Satisfies Subsystem Requirements
    context:
      - "docs/design/speech.md"
      - "docs/reqstream/speech.yaml"
    paths:
      - "docs/reqstream/speech/diagnostics.yaml"                          # subsystem requirements
      - "docs/reqstream/speech/diagnostics/*.yaml"                        # unit requirements
      - "docs/design/speech/diagnostics.md"                               # subsystem design
      - "docs/design/speech/diagnostics/*.md"                             # unit design
      - "docs/verification/speech/diagnostics.md"                         # subsystem + inline unit verification
      - "src/DemaConsulting.Speech/Diagnostics/**/*.cs"                   # subsystem source
      - "test/DemaConsulting.Speech.Tests/Diagnostics/**/*.cs"            # subsystem tests

  # Speech-AudioSubsystem Review (one per subsystem)
  - id: Speech-AudioSubsystem
    title: Review that Speech AudioSubsystem Satisfies Subsystem Requirements
    context:
