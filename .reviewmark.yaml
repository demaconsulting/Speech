  # SpeechOnnxNemotronStt-EvaluationTools Review (the non-shipped evaluation tool and its data)
  # The STT evaluation tool (tools/DemaConsulting.Speech.SttEvaluation) measures the ONNX Nemotron model on the
  # segregated, license-tracked data in data/stt-en; its WER calculator, data set, transcriber and gates are compiled
  # into the NemotronStt tests. Neither the tool nor the data is shipped; they are reviewed here so that the accuracy
  # gates and the evaluated defaults have a reviewed origin.
  - id: SpeechOnnxNemotronStt-EvaluationTools
    title: Review that the SpeechOnnxNemotronStt Evaluation Tool and Test Data are Correct
    context:
      - "docs/design/speech-onnx-nemotron-stt.md"
      - "docs/reqstream/speech-onnx-nemotron-stt.yaml"
    paths:
      - "data/stt-en/README.md"                                      # data rules, selection rule and archive pin
      - "data/stt-en/ATTRIBUTION.md"                                 # LibriSpeech CC BY 4.0 and CC0 poem attribution
      - "data/stt-en/MANIFEST.tsv"                                   # SHA-256 pins and reference transcripts
      - "docs/evaluation/nemotron-stt/README.md"                     # measured record and the blank-penalty decision
      - "tools/DemaConsulting.Speech.SttEvaluation/README.md"        # commands, gates and the no-third-party-output rule
      - "tools/DemaConsulting.Speech.SttEvaluation/**/*.cs"          # tool and shared evaluation sources
      - "test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/Evaluation/*.cs"  # tests of the shared evaluation sources

