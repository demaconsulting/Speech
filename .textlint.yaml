---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - NEVER add a misspelled word - fix the typo in the source instead
# - NEVER add a British-English spelling - correct to US-English in the source
# - PROPOSE only genuine technical terms/names as needed
#
# Run from the repository root (the pinned tool is restored by 'dotnet tool restore'):
#   dotnet textlint
#
# WHERE AN EXCEPTION BELONGS:
# - Never ours (vendored, generated, build output): 'ignorePaths'. It always wins and cannot use '!'.
# - What is permanently in scope: 'files', with '!' excludes. Patterns apply in order and the last match wins.
# - Ours, but skipped for a stated reason: an override with 'enabled: false' and a comment giving the reason.
# - Different rules for some files (fixtures, test data, a folder in another dialect): an override with settings.
#
# OVERRIDES (examples; add real entries under 'overrides:' at the end of this file):
# - List settings ('words', 'ignoreWords', 'flagWords', 'ignoreRegExpList', 'patterns') add to the top-level
#   values; single values ('language', 'minWordLength', 'ignoreRandomStrings', 'minRandomLength', 'enabled')
#   replace them. Matching entries apply in the order written, so put general entries first.
# - An 'enabled: false' entry must not hold other settings.
#
# overrides:
#   # Test fixtures contain ticket numbers that are not words
#   - filename: test/**/Fixtures/**
#     ignoreRegExpList:
#       - /\bticket-\d+\b/
#   # Skipped: the sample transcripts are captured from a third-party service in another language
#   - filename: docs/samples/transcripts/**
#     enabled: false
version: '0.2'
language: en

# Also check hidden paths such as .github/ and .*.yaml
enableGlobDot: true

# The files lint.ps1 spell-checks
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"

# Genuine technical terms and tool names used across the repository (one lowercase entry per word)
words:
  - Dema
  - demaconsulting
  - fileshare
  - SARIF
  - slnx
  - thirdparty
  - venv
  - yamlfix
  # Project-specific technical terms and tool names
  - adpcm
  - alsa
  - aoede
  - argmax
  # The ARPAbet phoneme notation (a pronunciation scheme of the Text.En overrides)
  - arpabet
  - autoregressive
  - autoregressively
  - axaml
  # Azerbaijani, the language whose current culture the Text.En case-folding tests run under
  - azeri
  - bountless
  - cdecl
  - cconj
  - chatterboxturbo
  - chokepoint
  - chunker
  - cmudict
  - cmusphinx
  - conv
  - convs
  - crost
  - cuda
  - damerau
  - decorrelate
  - decorrelation
  - demaspeech
  - denoise
  # The Deseret alphabet (supplementary-plane letters used to test case folding of overrides)
  - deseret
  - disableable
  # The dotless Turkish i (U+0131), which never folds into the ASCII letters
  - dotless
  - downmix
  - downmixed
  - downmixes
  - downmixing
  - downsamples
  - dwyl
  - endoftext
  - endpointing
  - espeak
  - fakeable
  - fffc
  # U+FEFF, the byte-order mark that normalization drops (named by its code point in sources and tests)
  - feff
  - fftbins
  - filterbank
  - hann
  # The magic bytes (HETW) of the heteronym model file format
  - hetw
  - hexgrad
  - huggingface
  - ieth
  - interruptible
  - intj
  - jieba
  - kaldi
  - kokoro
  - kore
  - ksdataformat
  - libonnxruntime
  - libri
  - librispeech
  - libritts
  - librosa
  - libsndfile
  - linearizability
  - lintmark
  - livelock
  - logit
  - logits
  - lstm
  - mancha
  # Plural of meridiem (am and pm), as in "the meridiems of glued times"
  - meridiems
  - middleboxes
  - misaki
  - misroute
  - misrouting
  - mvvm
  - ncipollo
  - nemotron
  - netstandard
  - nonsilence
  - ntlm
  - nupkgs
  - nyquist
  - onnx
  - onnxruntime
  - ordinally
  - overwritable
  - phonemization
  - phonemize
  - phonemized
  - phonemizer
  - phonemizes
  - polyphase
  - portaudio
  - precheck
  # Unicode precomposed characters (a letter with its accent as one code point), as opposed to decomposed text
  - precomposed
  - preemphasis
  - propn
  - provisionals
  - punct
  - realtek
  - reentrantly
  - resampler
  - resamplers
  - rnnt
  - scipy
  - scriptable
  - sconj
  - sinc
  - slaney
  - snupkg
  # The normalized exponential that calibrates the confidence of the heteronym classifier
  - softmax
  - sonarscanner
  - sonatype
  - soundfile
  - ssml
  - streaminfo
  - subframe
  - subframes
  - syncsafe
  - tvjf
  - tyme
  - udict
  - uncancelable
  - undiscarded
  - unlistable
  - unpenalized
  - unprobed
  - unpunctuated
  - unrequested
  - unreset
  - unsubscription
  - updown
  - upmix
  - upmixed
  - upmixes
  - upmixing
  # Variable-length integers (the bucket gaps of the heteronym model file)
  - varint
  - varints
  - vers
  - vits
  - wasapi
  - wavs
  - writability
  - zengwei
  - zipf
  - zipformer
  # Terms used by the template-provided standards in .github/standards
  - nestings
  - shopt
  - unidirectionality
  # The Phonemes.En word pronouncer (a unit name that appears in file names, requirement ids and configuration)
  # and the golden corpora it regenerates (the regenerate-goldens command of the Phonemes.En tools)
  - goldens
  - pronouncer
  # SI units read by the Text.En numeric normalization, and the combining form and initialisms the Phonemes.En word
  # pronouncer documents as examples (initialisms of the text corpora that the dictionary lacks)
  - gbps
  - haarp
  - hectopascal
  - hectopascals
  - immuno
  - mbps
  - megastructure
  - milliwatt
  - milliwatts
  - nber
  - usgs
  # The Text.En word-cluster corpus: the component that clusters words, the official mirror host of the public-domain
  # e-book archive (gutenberg.pglaf.org) and the POSIX archive format of the reproducible corpus snapshot
  - clusterer
  - pglaf
  - ustar

ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/generated/**'
  # Embedded tokenizer data (phoneme symbol tables, not prose)
  - '**/kokoro-v1.0-tokenizer.json'
  - tools/KokoroSpike/models/**
  - tools/NemotronSpike/**
  # Chatterbox Turbo spike scratch area and embedded/golden tokenizer data (token tables, not prose)
  - tools/ChatterboxTurboSpike/**
  - '**/chatterbox-turbo-tokenizer-golden.json'
  - '**/chatterbox-turbo-tokenizer.json.gz'
  # Local cache of the evaluation-only external datasets (git-ignored third-party text, never part of the repository)
  - data/text-en/external/**

overrides:
  # The Kokoro synthesis engine tests use a deliberately unknown word to prove that a word absent from the dictionary is still spoken
  - filename: '**/{OnnxKokoroSynthesisEngineTests.cs,.textlint.yaml}'
    words:
      - notarealenglishwordxyz
  # The uppercase transcript restorer maps apostrophe-less recognizer tokens (for example 'THATS') to contractions
  - filename: >-
      **/{UppercaseTranscriptRestorer.cs,UppercaseTranscriptRestorerTests.cs,uppercase-transcript-restorer.md,recognizing-speech.md,.textlint.yaml}
    words:
      - arent
      - couldnt
      - didnt
      - hadnt
      - hasnt
      - havent
      - isnt
      - shouldnt
      - thats
      - theyll
      - theyre
      - theyve
      - wasnt
      - werent
      - weve
      - whos
      - wouldnt
      - youll
      - youre
      - youve
  # Terms that only appear in tests and their test data (fixture names, ONNX attribute names, shell commands, etc.)
  - filename: '{test/**,.textlint.yaml}'
    words:
      - coreml
      - efmt
      - flink
      - freesound
      - keepdims
      - matmul
      - misrecognitions
      - mklink
      - nolicense
      - numpy
      - reassignable
      - tensorrt
      - unawaited
      - unconfigured
      - ustar
      - vorbis
      - voxserv
      # Test data of the Text.En acronym tests: Roman-numeral and consonant-only capitals that are deliberately not initialisms
      - bcdfgh
      - bcdfghj
      - cdxl
      - xlvii
  # The Text.En tests use an invented spelling that the tagger's lexicon cannot know, to prove the known-word flag
  - filename: '**/{EnglishTextAnalyzerTests.cs,PartOfSpeechAdapterTests.cs,PartOfSpeechTests.cs,part-of-speech.md,.textlint.yaml}'
    words:
      - qzxvbnk
  # The Text.En override tests and fixtures use invented words, sentinel strings and fragments of escaped
  # text (the parts of a word on either side of an escaped non-ASCII letter) to prove matching and that no
  # dictionary content reaches a diagnostics sink or an exception message
  - filename: '{test/DemaConsulting.Speech.Text.En.Tests/**,.textlint.yaml}'
    words:
      - aaabbb
      - aelvin
      - arpa
      - blax
      - brien
      - defg
      - fffcsql
      - frob
      - frobnicate
      - frobnikeit
      - frobsentinel
      - nginxes
      - pronme
      - quuxsentinel
      - sayme
      - sentinelx
      - skipme
      - stanbul
      - stra
      - strasse
      - tarpabet
      - txsampa
      - wxyz
      - wxyzsentinel
      - xsampa
      - zmir
      - zorblax
      - zorblaxsentinel
  # The Text.En training data checks (non-shipped trainer): the environment variable and column names, a corpus
  # source name, the regular expressions of the license checker (code, not prose) and the n-gram helper's test names
  - filename: '{docs/**/training-data-subsystem.md,docs/**/training-data-subsystem/*.md,docs/**/training-data-subsystem/*.yaml,tools/DemaConsulting.Speech.Text.En.Trainer/README.md,.textlint.yaml}'
    words:
      - ngrams
    ignoreRegExpList:
      - /\S*TEXTEN_EVAL_SETS\S*/
      - /\S*whd_wordid\S*/
      - /\S*tech-deverbal\S*/
      - /`[^`\n]*\|[^`\n]*`/
  # IPA phoneme strings (letters of the International Phonetic Alphabet are not words) in the override examples
  - filename: '**/{PronunciationOverrideEntry.cs,speech-text-en.md,usage.md,text-analysis.md,.textlint.yaml}'
    ignoreRegExpList:
      - /\S*[\u0250-\u02FF]\S*/
  # Names and terms of the attribution notices that the licenses of the tagger package's data require verbatim
  - filename: '**/{THIRD-PARTY-NOTICES.md,.textlint.yaml}'
    words:
      - christiane
      - crae
      - fellbaum
      - lrec
      - moby
      - oanc
      - passonneau
      - treebank
      - wndb
  # The Text.En training data folder: attribution names, corpus and column names, linguistic terms, data ids and
  # IPA written by the reviewing models (not prose); no misspelled or British word is added
  - filename: '{data/text-en/**,.textlint.yaml}'
    words:
      # MASC attribution (names of the authors and the corpus family)
      - christiane
      - fellbaum
      - lrec
      - oanc
      - passonneau
      - treebank
      # The Tatoeba sentence corpus
      - tatoeba
      # The column name of the WikipediaHomographData ids in the id-only mapping
      - wordid
      - wordids
      # A linguistics term (a noun derived from a verb) in the audit notes
      - deverbal
      # The id prefix of the candidate rows of the inventory extension
      - cand
      # The reading expose.noun is the noun exposé
      - exposé
    ignoreRegExpList:
      # IPA transcriptions written by the reviewing models
      - /\S*[\u0250-\u02FF]\S*/
      # An immutable reading id (the lemma of the plural form analyses), not prose
      - /\S*analyse\S*verb\S*/
      # The environment variable that names the optional evaluation-set folder of check-data
      - /\S*TEXTEN_EVAL_SETS\S*/
  # The prompts are the verbatim task prompts of the generation, labeling and audit runs
  - filename: '{data/text-en/prompts/**,.textlint.yaml}'
    words:
      - arpa
      - partofspeech
      - readset
      - unpushed
  # The Text.En trainer source and tests: column names, license-term fragments, evaluation corpus names, the
  # environment variable and the synthetic strings of the span and leakage tests (identifiers, not prose)
  - filename: '{tools/DemaConsulting.Speech.Text.En.Trainer/**/*.cs,test/DemaConsulting.Speech.Text.En.Trainer.Tests/**/*.cs,.textlint.yaml}'
    words:
      - conllu
      - blankcells
      - cand
      - cands
      - creativecommons
      - derivat
      - deverbal
      - disjointness
      - dlead
      - heteronymbench
      - isalnum
      - leadx
      - leadé
      - ngram
      - ngrams
      - oclockcaf
      - readingid
      - readset
      - semcor
      - titlecase
      - wordid
      - xlead
      - élead
    ignoreRegExpList:
      - /\S*TEXTEN_EVAL_SETS\S*/
      - /\S*TEXTEN\S*/
      - /\S*texten\S*/
  # The Tatoeba sentence corpus, named in the license file and the notices of the Text.En package because the
  # embedded heteronym model was trained in part on its CC0 sentences
  - filename: '{src/DemaConsulting.Speech.Text.En/PACKAGE-LICENSE.md,src/DemaConsulting.Speech.Text.En/THIRD-PARTY-NOTICES.md,.textlint.yaml}'
    words:
      - tatoeba
  # The Piper package, its tests and its documents: the voice's project and speaker names (the Rhasspy project's
  # voice repository and the Lessac voice the libritts_r voice was fine-tuned from) and an invented word that proves
  # an out-of-dictionary word is still spoken
  - filename: >-
      {src/DemaConsulting.Speech.Onnx.Piper/**,test/DemaConsulting.Speech.Onnx.Piper.Tests/**,docs/design/speech-onnx-piper.md,docs/design/speech-onnx-piper/**,docs/verification/speech-onnx-piper.md,docs/verification/speech-onnx-piper/**,docs/reqstream/speech-onnx-piper.yaml,docs/reqstream/speech-onnx-piper/**,.textlint.yaml}
    words:
      - lessac
      - rhasspy
      - zorblax
  # The authors of the LibriTTS-R corpus, named in the Piper package notices because the voice's license (CC BY 4.0)
  # requires the attribution and the corpus maintainers ask that the dataset paper is cited
  - filename: '{src/DemaConsulting.Speech.Onnx.Piper/THIRD-PARTY-NOTICES.md,.textlint.yaml}'
    words:
      - ankur
      - bacchiani
      - bapna
      - heiga
      - karita
      - kohei
      - michiel
      - morioka
      - nobuyuki
      - shigeki
      - yatabe
      - yifan
      - zhang
  # The Phonemes.En package, its tests and tools, its documents and its data: terms of the pronunciation domain,
  # word-ending fragments of the sound rules (the suffix of a stem change, not prose), the magic number of the
  # lexicon image, invented and out-of-dictionary test words (a name, a brand, a spelling that proves the
  # letter-to-sound fallback) and the local-only oracle packages named in the tools README. IPA written in
  # the goldens, the sound-rule tests and the documents is not prose either; no misspelled or British word is added
  - filename: >-
      {src/DemaConsulting.Speech.Phonemes.En/**,test/DemaConsulting.Speech.Phonemes.En.Tests/**,tools/DemaConsulting.Speech.Phonemes.En.Tools/**,docs/design/speech-phonemes-en.md,docs/design/speech-phonemes-en/**,docs/verification/speech-phonemes-en.md,docs/verification/speech-phonemes-en/**,docs/reqstream/speech-phonemes-en.yaml,docs/reqstream/speech-phonemes-en/**,docs/evaluation/phonemes-en/**,data/phonemes-en/**,.textlint.yaml}
    words:
      - aeiouaeiouaeiou
      - bokeh
      - cmul
      - djembe
      - espeakng
      - fluffernutter
      - iest
      - ization
      - kombucha
      - phonemizers
      - phonemizing
      - qwrtp
      - qwxzs
      - saoirse
      - spacy
      - stopp
      - straße
      - undoubling
      - unstresses
      - xiomara
      - xyzzy
      - ying
      - zorblax
      - zzxqvk
    ignoreRegExpList:
      # IPA and misaki phoneme strings
      - /\S*[\u0250-\u02FF\u1D00-\u1DBF]\S*/
  # The British-spelling fallback of the Phonemes.En word pronouncer: the British spellings are its input and its
  # subject (the rule turns them into the US dictionary word), not prose to correct; the word-ending fragments and the
  # consonant class of its patterns; and the place names and surnames of its rules and measurements. No misspelled
  # word is added, and prose elsewhere stays US English
  - filename: >-
      {src/DemaConsulting.Speech.Phonemes.En/PhonemizerSubsystem/WordPronouncer.cs,test/DemaConsulting.Speech.Phonemes.En.Tests/PhonemizerSubsystemTests.cs,docs/design/speech-phonemes-en/phonemizer-subsystem.md,docs/design/speech-phonemes-en/phonemizer-subsystem/word-pronouncer.md,docs/verification/speech-phonemes-en/phonemizer-subsystem/word-pronouncer.md,docs/reqstream/speech-phonemes-en/phonemizer-subsystem/word-pronouncer.yaml,docs/evaluation/phonemes-en/renderers.md,.textlint.yaml}
    words:
      # British spellings, the input of the rule
      - anaemia
      - analyse
      - calibre
      - civilisation
      - labours
      - lettres
      - manoeuvre
      - manoeuvres
      - manoeuvring
      - oesophagus
      - paediatric
      - quarrelling
      - travelled
      - unrivalled
      # Word-ending fragments and the consonant class of the patterns
      - alled
      - amme
      - ations
      - bcdfghjklmnpqrstvwxz
      - cence
      - elled
      - ense
      - ered
      - ering
      - fense
      - ogue
      - rhoea
      - respellings
      # Place names and surnames of the rules and the measurements
      - kraemer
      - kremer
      - oehler
      - piccola
      - rhinemouth
      - tynemouth  # A lemma that the CMU Pronouncing Dictionary lacks is named in the data README as the reading table has it,
  # and the spelling of a reading id is immutable
  - filename: '{data/phonemes-en/README.md,.textlint.yaml}'
    ignoreRegExpList:
      - /`analyse`/
  # The hexadecimal constant of the float network of the letter-to-sound trainer
  - filename: '{tools/DemaConsulting.Speech.Phonemes.En.Tools/LetterToSoundSubsystem/FloatNetwork.cs,.textlint.yaml}'
    ignoreRegExpList:
      - /\S*EBUL\S*/
  # Skipped: the letter-to-sound rules baseline (the classic text-to-speech rules of the Naval Research Laboratory
  # style) is a table of letter patterns written in capitals and of word-ending fragments, not prose
  - filename: tools/DemaConsulting.Speech.Phonemes.En.Tools/LetterToSoundSubsystem/NrlRules.cs
    enabled: false
