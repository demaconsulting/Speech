      - id: SpeechCli-TextToSpeech
        title: >-
          The tool shall synthesize speech from operator-supplied text through a downloaded
          synthesis model and play it back on a real audio device when invoked with the `speak`
          subcommand.
        tags: [system]
        justification: |
          Text-to-speech is one of this library's two core capabilities; an operator or script
          must be able to exercise it directly from the command line without writing any code.
        children:
          - SpeechCli-SynthesisCommands-Speak
