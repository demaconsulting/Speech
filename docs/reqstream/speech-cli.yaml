          The tool shall let an operator interrupt a long-running subcommand with Ctrl+C,
          cancelling its work and ending the command cleanly.
        tags: [system]
        justification: |
          Downloads, playback and listening can run for a long time; an operator must be able
          to stop them without killing the terminal or leaving a stack trace.
        children:
          - SpeechCli-ConsoleCancellation-RegisterCancels
          - SpeechCli-ConsoleCancellation-ArgumentValidation
          - SpeechCli-ConsoleCancellation-ObserveCallbackOnly
          - SpeechCli-ConsoleCancellation-DisposeIdempotent
          - SpeechCli-ConsoleCancellation-RegisterCallbackAfterCancel
          - SpeechCli-ConsoleCancellation-RegisterSuppressesTermination
          - SpeechCli-ConsoleCancellation-DisposeDetaches
        tests:
          - ConsoleCancellation_Register_Raise_CancelsSourceRunsCallbackAndSuppressesTermination

      - id: SpeechCli-Cli-PathContainment
        title: >-
          The tool shall reject any file path it builds from a component that resolves outside
          its intended base folder or that passes through a symbolic link or reparse point.
        tags: [system]
        justification: |
          Paths built from identifiers and file names must never be steered outside the folder
          the tool intends to write to.
        children:
          - SpeechCli-PathHelpers-NullRejected
          - SpeechCli-PathHelpers-EscapeRejected
          - SpeechCli-PathHelpers-RootedRejected
          - SpeechCli-PathHelpers-AbsoluteResult
          - SpeechCli-PathHelpers-LinkRejected
        tests:
          - PathHelpers_SafePathCombine_EscapingRelativePath_ThrowsArgumentException
