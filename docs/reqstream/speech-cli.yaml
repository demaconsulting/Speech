---
# Software System Requirements for SpeechCli
#
# These requirements describe the externally visible behavior of the Speech CLI application
# from the perspective of a person running it, without specifying implementation details.
# SpeechCli is a sibling system to Speech: it consumes the Speech library's public API and
# ships as a separately packaged .NET global tool (`speech-cli`).
#
# The thirteen subcommands (list-models, model-info, download, uninstall, clean,
# list-voices, voices, list-devices, devices, doctor, speak, recognize, ask) are dispatched to
# by name and listed in --help. Requirements for the
# seven model-management and reference-voice subcommands' functional behavior are decomposed into
# docs/reqstream/speech-cli/model-commands-subsystem.yaml;
# requirements for the three device-related subcommands' functional behavior are decomposed into
# docs/reqstream/speech-cli/device-commands-subsystem.yaml; requirements for the speak
# subcommand's functional behavior are decomposed into
# docs/reqstream/speech-cli/synthesis-command-subsystem.yaml; requirements for the recognize
# subcommand's functional behavior are decomposed into
# docs/reqstream/speech-cli/recognition-command-subsystem.yaml; requirements for the ask
# subcommand's functional behavior are decomposed into
# docs/reqstream/speech-cli/conversation-command-subsystem.yaml.

sections:
  - title: SpeechCli Requirements
    requirements:
      - id: SpeechCli-Cli-SubcommandDispatch
        title: >-
          The tool shall dispatch a command-line invocation to a named subcommand chosen from a
          fixed, recognized set, rejecting any unrecognized subcommand name with a clear error
          message and a non-zero exit code rather than a stack trace or silent no-op.
        tags: [system]
        justification: |
          A CLI with multiple subcommands must fail predictably and legibly on operator typos or
          unsupported commands, both for interactive use and for scripting, where a non-zero
          exit code is how a calling script detects failure.
        tests:
          - Program_Main_WithUnknownCommand_ReturnsNonZeroExitCodeAndReportsCommand
          - SpeechCli_UnknownCommand_Provided_ReturnsCleanError

      - id: SpeechCli-Cli-GlobalOptions
        title: >-
          The tool shall recognize its global options - `--models-dir`, `--voices-dir`, `--mirror-url`,
          `--mirror-user`, `--mirror-password`, `--mirror-bearer-token`, `--no-emotions`,
          `--verbose`/`--diagnostics`, `--silent`, `--log <file>`, `--results <file>`,
          `--depth <#>` - regardless of whether they appear before
          or after the subcommand name on the command line.
        tags: [system]
        justification: |
          Every subcommand needs the same cross-cutting configuration (where models are stored,
          how verbose to be, whether to write a log). Requiring a fixed option order relative to
          the subcommand name would be a usability trap; recognizing global options anywhere
          keeps every subcommand's own invocation syntax uncluttered by an artificial ordering
          rule.
        tests:
          - Context_Create_ModelsDirAfterCommand_IsRecognizedAsGlobalOption
          - Context_Create_WithExistingVoicesDir_ParsesOntoContext
          - Context_Create_WithMirrorOptions_ParsesOntoContext
          - Context_Create_DepthWithinRange_ParsesOntoContext
          - Context_Create_DepthOutOfRangeOrNonNumeric_ThrowsArgumentException
          - Context_Create_DepthWithoutValue_ThrowsArgumentException
          - Context_Create_VerboseOrDiagnosticsFlag_SetsDiagnostics
          - Context_Create_VerboseAfterCommand_IsRecognizedAsGlobalOption
          - Context_Create_NoEmotionsOnNonVoicesCommand_IsRecognizedAsGlobalOption
          - Context_Create_ResultsOption_ParsesPathAndRejectsMissingValue
          - SpeechCli_SilentFlag_Provided_SuppressesOutput
          - SpeechCli_LogFlag_Provided_WritesOutputToFile

      - id: SpeechCli-Cli-VoicesDir
        title: >-
          The tool shall accept a global `--voices-dir <path>` option naming an extra folder of
          `.wav`/`.flac` reference voices, and shall reject a path that is not an existing
          directory, or the option without a value, with a clear error before running any
          command.
        tags: [system]
        justification: |
          A mistyped voices folder would otherwise silently yield no voices; failing fast names
          the problem.
        tests:
          - Context_Create_WithExistingVoicesDir_ParsesOntoContext
          - Context_Create_WithBadVoicesDir_ThrowsArgumentException

      - id: SpeechCli-Cli-VoicesHelp
        title: >-
          The tool shall document the `--voices-dir` option, the voice commands, voice selection
          with `--tts-param voice=<id>`, and the consent note that only voices the operator has
          permission to use may be cloned, in its `--help` output.
        tags: [system]
        justification: |
          Help is the primary place an operator learns the option and the consent expectation.
        tests:
          - Program_Run_Help_DocumentsVoicesOptionsAndConsentNote

      - id: SpeechCli-Cli-DownloadMirror
        title: >-
          The tool shall redirect every model download to the internal mirror base URL supplied
          via `--mirror-url`, and shall use the model's own download location when no mirror is
          configured.
        tags: [system]
        justification: |
          A model's public download host (for example `huggingface.co`) may be blocked by
          network policy on a given machine; without a mirror option, such a machine could never
          download a model through the tool at all.
        children:
          - SpeechCli-ModelCommands-DownloadMirrorComposition
        tests:
          - Context_CreateMirror_NoMirrorUrl_ReturnsNull
          - Context_CreateMirror_ValidCredentialedMirror_ReturnsConfiguredMirror

      - id: SpeechCli-Cli-DownloadMirrorUrlValidation
        title: >-
          The tool shall reject a `--mirror-url` that is not an absolute `http`/`https` URL, or
          that carries a query string, fragment, or user-info component, with a clear error
          message and a non-zero exit code rather than a stack trace.
        tags: [system]
        justification: |
          Validating the mirror configuration eagerly, with a clean error, avoids a confusing
          failure deep inside the download transport.
        tests:
          - Context_CreateMirror_InvalidMirrorUrl_ThrowsArgumentException
          - Context_CreateMirror_UnsupportedMirrorUrlShape_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCredentials
        title: >-
          The tool shall authenticate to the mirror with HTTP Basic credentials
          (`--mirror-user`/`--mirror-password`, both required together) or a bearer token
          (`--mirror-bearer-token`, not empty or whitespace-only and mutually exclusive with the
          Basic credential pair), and shall reject an incomplete or conflicting credential
          combination with a clear error message and a non-zero exit code.
        tags: [system]
        justification: |
          A mirror inside a network commonly requires authentication; an incomplete or
          ambiguous credential combination must fail eagerly rather than send a half-formed
          request.
        tests:
          - Context_CreateMirror_ValidCredentialedMirror_ReturnsConfiguredMirror
          - Context_CreateMirror_BearerTokenMirror_ReturnsConfiguredMirror
          - Context_CreateMirror_MirrorUserWithoutPassword_ThrowsArgumentException
          - Context_CreateMirror_BasicCredentialsAndBearerTokenTogether_ThrowsArgumentException
          - Context_CreateMirror_WhitespaceBearerToken_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCredentialRequiresUrl
        title: >-
          The tool shall reject any mirror credential option supplied without `--mirror-url`
          with a clear error message and a non-zero exit code.
        tags: [system]
        justification: |
          Rejecting a credential supplied without `--mirror-url` catches a likely typo (a
          missing or misspelled `--mirror-url`) rather than silently discarding the credential
          and downloading from each model's public URI unauthenticated.
        tests:
          - Context_CreateMirror_CredentialsWithoutMirrorUrl_ThrowsArgumentException
          - Context_CreateMirror_BearerTokenWithoutMirrorUrl_ThrowsArgumentException
          - Context_Create_MirrorCredentialWithoutUrlAndHelp_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCleartextProtection
        title: >-
          The tool shall reject either mirror credential form combined with a plain `http`
          mirror whose host is not a loopback address, with a clear error message and a
          non-zero exit code.
        tags: [system]
        justification: |
          Both credential forms are sent preemptively, so a fat-fingered scheme would otherwise
          silently transmit a secret in cleartext.
        tests:
          - Context_CreateMirror_CredentialOverPlainHttp_RejectedUnlessLoopback

      - id: SpeechCli-Cli-VersionDisplay
        title: >-
          The tool shall display its version string, and nothing else, when invoked with `-v` or
          `--version`.
        tags: [system]
        justification: |
          Operators and support scripts need a machine-parseable way to confirm which build of
          the tool is installed; printing the banner or other output alongside the version would
          make that output harder to parse reliably.
        tests:
          - Program_Run_WithVersionFlag_DisplaysVersionOnly
          - Program_Run_WithShortVersionFlag_DisplaysVersion
          - SpeechCli_VersionFlag_Provided_OutputsVersion

      - id: SpeechCli-Cli-HelpDisplay
        title: >-
          The tool shall display usage information listing every recognized global option, every
          recognized subcommand, and each subcommand's expected flags, when invoked with `-h`,
          `-?`, or `--help`, or when invoked with no subcommand at all.
        tags: [system]
        justification: |
          A first-time user must be able to discover every available subcommand and its expected
          flags without consulting external documentation. Treating "no subcommand given" the
          same as `--help` (rather than as an error) is friendlier for a CLI whose main purpose
          is a menu of subcommands, since a bare invocation is a natural way to ask "what can this
          tool do?"
        tests:
          - Program_Run_WithHelpFlag_DisplaysUsageInformation
          - Program_Run_WithShortHelpFlag_DisplaysUsage
          - Program_Run_WithQuestionMarkFlag_DisplaysUsage
          - Program_Run_NoArguments_DisplaysBannerAndUsage
          - SpeechCli_HelpFlag_Provided_ListsAllSubcommands
          - SpeechCli_NoArguments_Invoked_DisplaysBannerAndUsage

      - id: SpeechCli-Cli-SelfValidation
        title: >-
          The tool shall run a self-validation, when invoked with `--validate`, that exercises
          version display, help display, whether the subcommand dispatch table is well formed,
          audio-backend probe composition, and whether the model-store root can be written to,
          without requiring a downloaded speech model or real audio hardware to be present.
        tags: [system]
        justification: |
          A CI-safe self-test lets an operator or CI pipeline confirm the tool is installed and
          functioning correctly on a target machine before relying on it, consistent with the
          reference `TemplateDotNetTool`'s self-validation precedent. Every check must remain
          CI-safe: none may depend on a real, multi-hundred-megabyte model download or physical
          audio hardware, since both are unavailable in an ordinary CI runner.
        tests:
          - Program_Run_WithValidateFlag_RunsValidation
          - SpeechCli_ValidateFlag_Provided_RunsValidation

      - id: SpeechCli-Cli-SelfValidationResults
        title: >-
          The tool shall write the self-validation results to the `.trx` or `.xml` file named by
          `--results` (alias `--result`), and shall report an unsupported extension or an
          unwritable path as an error with a non-zero exit code.
        tags: [system]
        justification: |
          A CI pipeline consumes the self-validation outcome as a test-result file; silently
          skipping the file, or exiting zero when it could not be written, would let a pipeline
          pass without any recorded evidence.
        tests:
          - SpeechCli_ValidateWithTrxResults_Requested_GeneratesTrxFile
          - SpeechCli_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel
          - Context_Create_ResultsOption_ParsesPathAndRejectsMissingValue
          - Program_Main_ValidateWithXmlResults_WritesJUnitFile
          - Program_Main_ValidateWithUnsupportedResultsExtension_ReturnsNonZeroExitCode
          - Program_Main_ValidateWithUnwritableResultsPath_ReturnsNonZeroExitCode

      - id: SpeechCli-ModelManagement
        title: >-
          The tool shall let an operator list every known speech model, inspect a single
          model's details, download a model, and remove a downloaded or partially downloaded
          model, when invoked with the `list-models`, `model-info`, `download`, `uninstall`, and
          `clean` subcommands respectively.
        tags: [system]
        justification: |
          An operator cannot use any speech capability without first knowing which models exist,
          whether they are downloaded, and having a way to download or remove them; this is the
          minimum model-lifecycle surface a command-line tool over this library must expose.
        children:
          - SpeechCli-ModelCommands-ListModels
          - SpeechCli-ModelCommands-ModelInfo
          - SpeechCli-ModelCommands-Download
          - SpeechCli-ModelCommands-DownloadContinueOnFailure
          - SpeechCli-ModelCommands-DownloadForce
          - SpeechCli-ModelCommands-DownloadArgumentValidation
          - SpeechCli-ModelCommands-DownloadCancellation
          - SpeechCli-ModelCommands-Uninstall
          - SpeechCli-ModelCommands-Clean
          - SpeechCli-ModelCommands-LibraryDelegation
          - SpeechCli-ModelCommands-SynthesisSeamExtension
          - SpeechCli-ModelCommands-RecognitionSeamExtension
        tests:
          - SpeechCli_ListModelsCommand_Invoked_ListsKnownModelsAsTable
          - SpeechCli_ListModelsCommandWithJsonFormat_Invoked_EmitsJsonArray
          - SpeechCli_ModelInfoCommandWithUnknownId_Invoked_ReturnsCleanError
          - SpeechCli_DownloadCommandWithUnknownId_Invoked_ReturnsNonZeroExitCode
          - SpeechCli_UninstallCommand_Invoked_NeverInstalledModel_ExitsCleanly
          - SpeechCli_CleanCommand_Invoked_NothingToCleanUp_ExitsCleanly

      - id: SpeechCli-ReferenceVoices
        title: >-
          The tool shall let an operator discover, install, remove, and supply reference voices
          for voice-cloning models, through the `list-voices` and `voices` subcommands and the
          `--voices-dir` option, with the Chatterbox Turbo model composed into the catalog.
        tags: [system]
        justification: |
          A voice-cloning model can speak only with a reference voice, so an operator needs a
          command-line way to see which voices exist, install a voice pack, and point the tool at
          their own voices.
        children:
          - SpeechCli-ModelCommands-ChatterboxComposition
          - SpeechCli-ModelCommands-ListVoices
          - SpeechCli-ModelCommands-ListVoicesUsageHints
          - SpeechCli-ModelCommands-ListVoicesConsentNote
          - SpeechCli-ModelCommands-ListVoicesArgumentValidation
          - SpeechCli-ModelCommands-VoicePacks
          - SpeechCli-ModelCommands-VoicePackInstall
          - SpeechCli-ModelCommands-VoicePackInstallFailure
          - SpeechCli-ModelCommands-VoicePackConsentNote
          - SpeechCli-ModelCommands-VoicePackUninstall
          - SpeechCli-ModelCommands-VoicePackArgumentValidation
          - SpeechCli-ModelCommands-VoiceEmotions
          - SpeechCli-ModelCommands-VoiceEmotionsOptOut
          - SpeechCli-ModelCommands-VoiceEmotionsSizes
          - SpeechCli-ModelCommands-VoiceEmotionsUpgradeNotice
          - SpeechCli-ModelCommands-VoiceEmotionsListing
        tests:
          - CommandDispatch_Find_VoiceCommands_AreRegistered
          - Program_Run_Help_DocumentsVoicesOptionsAndConsentNote
          - SpeechCli_ListVoicesCommand_Invoked_PrintsConsentNote
          - SpeechCli_ListVoicesCommandWithJsonFormat_Invoked_EmitsJsonArray
          - SpeechCli_VoicesPacksCommand_Invoked_ListsPacksAndConsentNote
      - id: SpeechCli-DeviceInspection
        title: >-
          The tool shall let an operator list available audio devices, test a device with a
          generated tone, and run a combined diagnostic check of the audio and model subsystems,
          when invoked with the `list-devices`, `devices test`, and `doctor` subcommands
          respectively.
        tags: [system]
        justification: |
          An operator troubleshooting a failed `speak`/`recognize` invocation needs a way to
          confirm which audio devices this machine actually exposes, and to positively verify
          one works, without reasoning about the library's internal audio subsystem.
        children:
          - SpeechCli-DeviceCommands-ListDevices
          - SpeechCli-DeviceCommands-DevicesTest
          - SpeechCli-DeviceCommands-ToneGeneration
          - SpeechCli-DeviceCommands-Doctor
          - SpeechCli-DeviceCommands-DoctorNativeRuntimes
          - SpeechCli-DeviceCommands-DoctorAudioDevices
          - SpeechCli-DeviceCommands-DoctorModelCounts
          - SpeechCli-DeviceCommands-DoctorExitCode
          - SpeechCli-DeviceCommands-LibraryDelegation
        tests:
          - SpeechCli_ListDevicesCommand_Invoked_ExitsCleanly
          - SpeechCli_DoctorCommand_Invoked_ReportsHealthChecklist

      - id: SpeechCli-TextToSpeech
        title: >-
          The tool shall synthesize speech from operator-supplied text through a downloaded
          synthesis model, either playing it back on a real audio device or writing it to a WAV
          file, when invoked with the `speak` subcommand.
        tags: [system]
        justification: |
          Text-to-speech is one of this library's two core capabilities; an operator or script
          must be able to exercise it directly from the command line without writing any code.
        children:
          - SpeechCli-SynthesisCommands-Speak
          - SpeechCli-SynthesisCommands-ParamValidation
          - SpeechCli-SynthesisCommands-NoTags
          - SpeechCli-SynthesisCommands-OutputDispatch
          - SpeechCli-SynthesisCommands-CancellationAndDisposal
          - SpeechCli-SynthesisCommands-NullGuards
        tests:
          - SpeechCli_SpeakCommandWithUnknownModel_Invoked_ReturnsCleanError
          - SpeechCli_SpeakCommandWithNotDownloadedModel_Invoked_ReturnsCleanErrorWithDownloadHint

      - id: SpeechCli-SpeechToText
        title: >-
          The tool shall recognize speech from a WAV file or from a real microphone through a
          downloaded recognition model, printing the recognized transcript, when invoked with
          the `recognize` subcommand.
        tags: [system]
        justification: |
          Speech-to-text is this library's other core capability; an operator or script must be
          able to exercise it directly from the command line, including a silence-timeout-driven
          microphone session, without writing any code.
        children:
          - SpeechCli-RecognitionCommands-Recognize
          - SpeechCli-RecognitionCommands-ParamValidation
          - SpeechCli-RecognitionCommands-InputFileValidation
          - SpeechCli-RecognitionCommands-FileInputEofDrivenStop
          - SpeechCli-RecognitionCommands-SilenceTimeout
          - SpeechCli-RecognitionCommands-StartTimeout
          - SpeechCli-RecognitionCommands-VerbosityAndOutput
          - SpeechCli-RecognitionCommands-InterimOnly
          - SpeechCli-RecognitionCommands-FinalOnly
          - SpeechCli-RecognitionCommands-VerbosityConflict
          - SpeechCli-RecognitionCommands-OutputText
          - SpeechCli-RecognitionCommands-DeviceDispatch
          - SpeechCli-RecognitionCommands-NullGuards
        tests:
          - SpeechCli_RecognizeCommandWithUnknownModel_Invoked_ReturnsCleanError
          - SpeechCli_RecognizeCommandWithNotDownloadedModel_Invoked_ReturnsCleanErrorWithDownloadHint

      - id: SpeechCli-VoiceConversation
        title: >-
          The tool shall speak an operator-supplied prompt through a downloaded synthesis model
          and then, once playback finishes, listen for a reply through a downloaded recognition
          model, printing (or writing to a file) the recognized reply text, when invoked with the
          `ask` subcommand.
        tags: [system]
        justification: |
          A voice conversation - an agent speaking a prompt and then listening for a person's
          spoken reply - is a natural combination of this tool's two core capabilities; an
          operator or an AI agent scripting this tool must be able to run a full question/answer
          turn as a single command rather than manually sequencing separate `speak` and
          `recognize` invocations.
        children:
          - SpeechCli-ConversationCommands-Ask
          - SpeechCli-ConversationCommands-AskModelValidation
          - SpeechCli-ConversationCommands-AskTextSource
          - SpeechCli-ConversationCommands-AskUnsupportedOptions
          - SpeechCli-ConversationCommands-ParamValidation
          - SpeechCli-ConversationCommands-ListenTermination
          - SpeechCli-ConversationCommands-OutputDispatch
          - SpeechCli-ConversationCommands-DeviceDispatch
          - SpeechCli-ConversationCommands-CancellationAndDisposal
          - SpeechCli-ConversationCommands-PrewarmRecognizer
          - SpeechCli-ConversationCommands-NullGuards
        tests:
          - Program_Run_WithAskCommandAndNoModel_ThrowsArgumentException
          - SpeechCli_AskCommandWithoutModels_Invoked_ReturnsCleanError
          - SpeechCli_AskCommandWithUnknownModel_Invoked_ReturnsCleanError
          - SpeechCli_AskCommandWithConflictingTextSources_Invoked_ReturnsCleanError

      - id: SpeechCli-Packaging-GlobalTool
        title: >-
          The tool shall be distributable as a .NET global tool, installable with
          `dotnet tool install -g DemaConsulting.Speech.Cli`, exposing its command-line entry
          point as `speech-cli`.
        tags: [system]
        justification: |
          Packaging as a .NET global tool is how an operator installs and invokes this CLI in
          practice; the `ToolCommandName` and `PackageId` are the tool's externally visible
          installation and invocation identity, distinct from its internal assembly name.
        tests:
          - SpeechCli_VersionFlag_Provided_OutputsVersion
          - SpeechCli_HelpFlag_Provided_ListsAllSubcommands
