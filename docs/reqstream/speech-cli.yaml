      - id: SpeechCli-VoiceConversation
        title: >-
          The tool shall speak an operator-supplied prompt through a downloaded synthesis model
          and then, once playback finishes, listen for a reply through a downloaded recognition
          model, printing the recognized reply text, when invoked with the `ask` subcommand.
        tags: [system]
        justification: |
          A voice conversation - an agent speaking a prompt and then listening for a person's
          spoken reply - is a natural combination of this tool's two core capabilities; an
          operator or an AI agent scripting this tool must be able to run a full question/answer
          turn as a single command rather than manually sequencing separate `speak` and
          `recognize` invocations.
