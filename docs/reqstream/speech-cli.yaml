---
# Software System Requirements for SpeechCli
#
# These requirements describe the externally visible behavior of the Speech CLI application
# from the perspective of a person running it, without specifying implementation details.
# SpeechCli is a sibling system to Speech: it consumes the Speech library's public API and
# ships as a separately packaged .NET global tool (`speech-cli`).
#
# The thirteen subcommands (list-models, model-info, download, uninstall, clean,
# list-voices, voices, list-devices, devices, doctor, speak, recognize, ask) are dispatched to
# by name and listed in --help. Requirements for the
# seven model-management and reference-voice subcommands' functional behavior are decomposed into
# docs/reqstream/speech-cli/model-commands-subsystem.yaml;
# requirements for the three device-related subcommands' functional behavior are decomposed into
# docs/reqstream/speech-cli/device-commands-subsystem.yaml; requirements for the speak
# subcommand's functional behavior are decomposed into
# docs/reqstream/speech-cli/synthesis-command-subsystem.yaml; requirements for the recognize
# subcommand's functional behavior are decomposed into
# docs/reqstream/speech-cli/recognition-command-subsystem.yaml; requirements for the ask
# subcommand's functional behavior are decomposed into
# docs/reqstream/speech-cli/conversation-command-subsystem.yaml.

sections:
  - title: SpeechCli Requirements
    requirements:
      - id: SpeechCli-Cli-SubcommandDispatch
        title: >-
          The tool shall dispatch a command-line invocation to a named subcommand chosen from a
          fixed, recognized set.
        tags: [system]
        justification: |
          A CLI with multiple subcommands must run the subcommand the operator names, both for
          interactive use and for scripting.
        tests:
          - Program_Run_WithListModelsCommand_ListsModelsAndSucceeds
          - CommandDispatch_Handlers_ReturnNonNullTasks

      - id: SpeechCli-Cli-UnknownSubcommandRejection
        title: >-
          The tool shall reject any unrecognized subcommand name with a clear error message and
          a non-zero exit code rather than a stack trace or silent no-op.
        tags: [system]
        justification: |
          A CLI must fail predictably and legibly on operator typos or unsupported commands,
          both for interactive use and for scripting, where a non-zero exit code is how a
          calling script detects failure.
        tests:
          - Program_Main_WithUnknownCommand_ReturnsNonZeroExitCodeAndReportsCommand
          - SpeechCli_UnknownCommand_Provided_ReturnsCleanError

      - id: SpeechCli-Cli-GlobalOptions
        title: >-
          The tool shall recognize its path, mirror and depth global options - `--models-dir`,
          `--voices-dir`, `--mirror-url`, `--mirror-user`, `--mirror-password`,
          `--mirror-bearer-token`, `--no-emotions`, `--results <file>`, `--depth <#>` - regardless
          of whether they appear before or after the subcommand name on the command line.
        tags: [system]
        justification: |
          Every subcommand needs the same cross-cutting configuration (where models are stored,
          which mirror to use). Requiring a fixed option order relative to the subcommand name
          would be a usability trap; recognizing global options anywhere keeps every
          subcommand's own invocation syntax uncluttered by an artificial ordering rule.
        tests:
          - Context_Create_ModelsDirAfterCommand_IsRecognizedAsGlobalOption
          - Context_Create_WithExistingVoicesDir_ParsesOntoContext
          - Context_Create_WithMirrorOptions_ParsesOntoContext
          - Context_Create_DepthWithinRange_ParsesOntoContext
          - Context_Create_DepthOutOfRangeOrNonNumeric_ThrowsArgumentException
          - Context_Create_DepthWithoutValue_ThrowsArgumentException
          - Context_Create_NoEmotionsOnNonVoicesCommand_IsRecognizedAsGlobalOption
          - Context_Create_ResultsOption_ParsesPathAndRejectsMissingValue

      - id: SpeechCli-Cli-VerboseOption
        title: >-
          The tool shall recognize the `--verbose`/`--diagnostics` global option before or after
          the subcommand name and enable diagnostic output.
        tags: [system]
        justification: |
          Operators need the same diagnostics switch wherever they type it.
        tests:
          - Context_Create_VerboseOrDiagnosticsFlag_SetsDiagnostics
          - Context_Create_VerboseAfterCommand_IsRecognizedAsGlobalOption

      - id: SpeechCli-Cli-SilentOption
        title: >-
          The tool shall suppress console output, but not the exit code, when the `--silent`
          global option is given.
        tags: [system]
        justification: |
          Scripts that only inspect the exit code need quiet runs.
        tests:
          - SpeechCli_SilentFlag_Provided_SuppressesOutput

      - id: SpeechCli-Cli-LogOption
        title: >-
          The tool shall also write all output to the file named by the `--log <file>` global
          option.
        tags: [system]
        justification: |
          Operators need a persistent record of a run without redirecting the console.
        tests:
          - SpeechCli_LogFlag_Provided_WritesOutputToFile

      - id: SpeechCli-Cli-VoicesDir
        title: >-
          The tool shall accept a global `--voices-dir <path>` option naming an extra folder of
          `.wav`/`.flac` reference voices.
        tags: [system]
        justification: |
          An operator needs to point the tool at their own reference voices.
        tests:
          - Context_Create_WithExistingVoicesDir_ParsesOntoContext

      - id: SpeechCli-Cli-VoicesDirValidation
        title: >-
          The tool shall reject a `--voices-dir` path that is not an existing directory, or the
          option without a value, with a clear error before running any command.
        tags: [system]
        justification: |
          A mistyped voices folder would otherwise silently yield no voices; failing fast names
          the problem.
        tests:
          - Context_Create_WithBadVoicesDir_ThrowsArgumentException

      - id: SpeechCli-Cli-VoicesHelp
        title: >-
          The tool shall document the `--voices-dir` option, the voice commands, voice selection
          with `--tts-param voice=<id>`, and the consent note that only voices the operator has
          permission to use may be cloned, in its `--help` output.
        tags: [system]
        justification: |
          Help is the primary place an operator learns the option and the consent expectation.
        tests:
          - Program_Run_Help_DocumentsVoicesOptionsAndConsentNote

      - id: SpeechCli-Cli-DownloadMirror
        title: >-
          The tool shall redirect every model download to the internal mirror base URL supplied
          via `--mirror-url`.
        tags: [system]
        justification: |
          A model's public download host (for example `huggingface.co`) may be blocked by
          network policy on a given machine; without a mirror option, such a machine could never
          download a model through the tool at all.
        children:
          - SpeechCli-ModelCommands-DownloadMirrorComposition
        tests:
          - Context_CreateMirror_ValidCredentialedMirror_ReturnsConfiguredMirror

      - id: SpeechCli-Cli-DownloadMirrorDefault
        title: >-
          The tool shall use each model's own download location when no `--mirror-url` is
          configured.
        tags: [system]
        justification: |
          Without a mirror configured, the tool must behave exactly as it does by default.
        tests:
          - Context_CreateMirror_NoMirrorUrl_ReturnsNull

      - id: SpeechCli-Cli-DownloadMirrorUrlValidation
        title: >-
          The tool shall reject a `--mirror-url` that is not an absolute `http`/`https` URL, or
          that carries a query string, fragment, or user-info component, with a clear error
          message and a non-zero exit code rather than a stack trace.
        tags: [system]
        justification: |
          Validating the mirror configuration eagerly, with a clean error, avoids a confusing
          failure deep inside the download transport.
        tests:
          - Context_CreateMirror_InvalidMirrorUrl_ThrowsArgumentException
          - Context_CreateMirror_UnsupportedMirrorUrlShape_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCredentials
        title: >-
          The tool shall authenticate to the mirror with HTTP Basic credentials
          (`--mirror-user`/`--mirror-password`) when both are supplied.
        tags: [system]
        justification: |
          A mirror inside a network commonly requires authentication.
        tests:
          - Context_CreateMirror_ValidCredentialedMirror_ReturnsConfiguredMirror

      - id: SpeechCli-Cli-DownloadMirrorBearerToken
        title: >-
          The tool shall authenticate to the mirror with a bearer token
          (`--mirror-bearer-token`) when one is supplied.
        tags: [system]
        justification: |
          A mirror inside a network may require token authentication instead of a user name and
          password.
        tests:
          - Context_CreateMirror_BearerTokenMirror_ReturnsConfiguredMirror

      - id: SpeechCli-Cli-DownloadMirrorCredentialValidation
        title: >-
          The tool shall reject a mirror user supplied without a mirror password with a clear
          error message and a non-zero exit code.
        tags: [system]
        justification: |
          An incomplete credential pair must fail eagerly rather than send a half-formed request.
        tests:
          - Context_CreateMirror_MirrorUserWithoutPassword_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCredentialConflict
        title: >-
          The tool shall reject a Basic credential pair supplied together with a bearer token
          with a clear error message and a non-zero exit code.
        tags: [system]
        justification: |
          An ambiguous credential combination must fail eagerly rather than send a request whose
          authentication scheme is a guess.
        tests:
          - Context_CreateMirror_BasicCredentialsAndBearerTokenTogether_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorBearerTokenValidation
        title: >-
          The tool shall reject an empty or whitespace-only mirror bearer token with a clear
          error message and a non-zero exit code.
        tags: [system]
        justification: |
          A blank token would send an unauthenticated request while appearing to be configured.
        tests:
          - Context_CreateMirror_WhitespaceBearerToken_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCredentialRequiresUrl
        title: >-
          The tool shall reject any mirror credential option supplied without `--mirror-url`
          with a clear error message and a non-zero exit code.
        tags: [system]
        justification: |
          Rejecting a credential supplied without `--mirror-url` catches a likely typo (a
          missing or misspelled `--mirror-url`) rather than silently discarding the credential
          and downloading from each model's public URI unauthenticated.
        tests:
          - Context_CreateMirror_CredentialsWithoutMirrorUrl_ThrowsArgumentException
          - Context_CreateMirror_BearerTokenWithoutMirrorUrl_ThrowsArgumentException
          - Context_Create_MirrorCredentialWithoutUrlAndHelp_ThrowsArgumentException

      - id: SpeechCli-Cli-DownloadMirrorCleartextProtection
        title: >-
          The tool shall reject either mirror credential form combined with a plain `http`
          mirror whose host is not a loopback address, with a clear error message and a
          non-zero exit code.
        tags: [system]
        justification: |
          Both credential forms are sent preemptively, so a fat-fingered scheme would otherwise
          silently transmit a secret in cleartext.
        tests:
          - Context_CreateMirror_CredentialOverPlainHttp_RejectedUnlessLoopback

      - id: SpeechCli-Cli-MirrorUrlEnvironment
        title: >-
          The tool shall take the mirror base URL from the `DEMASPEECH_MIRROR_URL` environment
          variable when `--mirror-url` is not supplied.
        tags: [system]
        justification: |
          Scripts and CI jobs configure the mirror once in the environment instead of repeating
          it on every command line.
        tests:
          - Context_Create_EnvironmentMirrorUrl_UsedWhenOptionAbsent

      - id: SpeechCli-Cli-MirrorUrlOptionPrecedence
        title: >-
          The tool shall prefer an explicit `--mirror-url` option over the
          `DEMASPEECH_MIRROR_URL` environment variable.
        tags: [system]
        justification: |
          An explicit command-line option is the most specific statement of intent and must
          override ambient configuration.
        tests:
          - Context_Create_MirrorUrlOption_OverridesEnvironment

      - id: SpeechCli-Cli-MirrorBasicCredentialsEnvironment
        title: >-
          The tool shall authenticate to the mirror with HTTP Basic credentials taken from the
          `DEMASPEECH_MIRROR_USER` and `DEMASPEECH_MIRROR_PASSWORD` environment variables when no
          mirror credential option is supplied.
        tags: [system]
        justification: |
          Environment variables keep a secret out of the process command line, where other local
          users and shell history can read it.
        tests:
          - Context_Create_EnvironmentBasicCredentials_UsedWhenOptionsAbsent

      - id: SpeechCli-Cli-MirrorBearerTokenEnvironment
        title: >-
          The tool shall authenticate to the mirror with the bearer token in the
          `DEMASPEECH_MIRROR_BEARER_TOKEN` environment variable when no mirror credential option
          is supplied.
        tags: [system]
        justification: |
          Environment variables keep a token out of the process command line, where other local
          users and shell history can read it.
        tests:
          - Context_Create_EnvironmentBearerToken_UsedWhenOptionsAbsent

      - id: SpeechCli-Cli-MirrorCredentialOptionPrecedence
        title: >-
          The tool shall ignore every mirror credential environment variable when any mirror
          credential option is supplied.
        tags: [system]
        justification: |
          Taking credentials from one source only prevents an explicit option from being silently
          combined with an ambient credential of the other kind.
        tests:
          - Context_Create_CredentialOption_DisablesEnvironmentCredentials

      - id: SpeechCli-Cli-MirrorEnvironmentEmptyIgnored
        title: >-
          The tool shall treat an empty mirror environment variable as unset.
        tags: [system]
        justification: |
          Shells and CI systems commonly export empty variables, which must not enable a mirror
          or a credential.
        tests:
          - Context_Create_EmptyEnvironmentVariables_TreatedAsUnset

      - id: SpeechCli-Cli-MirrorEnvironmentCredentialRequiresUrl
        title: >-
          The tool shall reject a mirror credential environment variable supplied without a
          mirror URL with a clear error message and a non-zero exit code.
        tags: [system]
        justification: |
          A credential with no mirror to apply to would otherwise be silently dropped.
        tests:
          - Context_Create_EnvironmentCredentialWithoutUrl_ThrowsWithoutEchoingSecret

      - id: SpeechCli-Cli-MirrorSecretsNotInErrors
        title: >-
          The tool shall not include a mirror credential or an invalid mirror URL value in any
          configuration error message.
        tags: [system]
        justification: |
          Error text is routinely copied into logs and tickets; a pasted secret must not leak
          through it.
        tests:
          - Context_Create_EnvironmentCredentialWithoutUrl_ThrowsWithoutEchoingSecret
          - Context_Create_InvalidMirrorUrl_ErrorDoesNotEchoValue

      - id: SpeechCli-Cli-MirrorSecretsNotInHelp
        title: >-
          The tool shall not print any mirror environment variable value in its help output.
        tags: [system]
        justification: |
          Help output is routinely pasted into logs and tickets.
        tests:
          - Program_Run_Help_DoesNotPrintEnvironmentSecretValues

      - id: SpeechCli-Cli-MirrorEnvironmentHelp
        title: >-
          The tool shall name the four `DEMASPEECH_MIRROR_*` environment variables in its help
          output.
        tags: [system]
        justification: |
          Users discover the environment alternative from `--help`.
        tests:
          - Program_Run_Help_DocumentsMirrorEnvironmentVariables

      - id: SpeechCli-Cli-VersionDisplay
        title: >-
          The tool shall display its version string, and nothing else, when invoked with `-v` or
          `--version`.
        tags: [system]
        justification: |
          Operators and support scripts need a machine-parseable way to confirm which build of
          the tool is installed; printing the banner or other output alongside the version would
          make that output harder to parse reliably.
        tests:
          - Program_Run_WithVersionFlag_DisplaysVersionOnly
          - Program_Run_WithShortVersionFlag_DisplaysVersion
          - SpeechCli_VersionFlag_Provided_OutputsVersion

      - id: SpeechCli-Cli-TopLevelActionPriority
        title: >-
          The tool shall, when more than one of `--version`, `--help` and `--validate` is given,
          perform only the highest-priority action in the order version, then help, then
          validation.
        tags: [system]
        justification: |
          A deterministic precedence keeps scripted invocations predictable when flags are
          combined.
        tests:
          - Program_Run_VersionHelpValidateTogether_HonorsPriorityOrder

      - id: SpeechCli-Cli-HelpDisplay
        title: >-
          The tool shall display usage information listing every recognized global option, every
          recognized subcommand, and each subcommand's expected flags, when invoked with `-h`,
          `-?`, or `--help`, or when invoked with no subcommand at all.
        tags: [system]
        justification: |
          A first-time user must be able to discover every available subcommand and its expected
          flags without consulting external documentation. Treating "no subcommand given" the
          same as `--help` (rather than as an error) is friendlier for a CLI whose main purpose
          is a menu of subcommands, since a bare invocation is a natural way to ask "what can this
          tool do?"
        tests:
          - Program_Run_WithHelpFlag_DisplaysUsageInformation
          - Program_Run_WithShortHelpFlag_DisplaysUsage
          - Program_Run_WithQuestionMarkFlag_DisplaysUsage
          - Program_Run_NoArguments_DisplaysBannerAndUsage
          - SpeechCli_HelpFlag_Provided_ListsAllSubcommands
          - SpeechCli_NoArguments_Invoked_DisplaysBannerAndUsage

      - id: SpeechCli-Cli-SelfValidation
        title: >-
          The tool shall run a self-validation, when invoked with `--validate`, that exercises
          version display, help display, whether the subcommand dispatch table is well formed,
          audio-backend probe composition, and whether the model-store root can be written to.
        tags: [system]
        justification: |
          A CI-safe self-test lets an operator or CI pipeline confirm the tool is installed and
          functioning correctly on a target machine before relying on it, consistent with the
          reference `TemplateDotNetTool`'s self-validation precedent.
        tests:
          - Program_Run_WithValidateFlag_RunsValidation

      - id: SpeechCli-Cli-SelfValidationHardwareIndependence
        title: >-
          The tool shall complete its `--validate` self-validation without requiring a
          downloaded speech model or real audio hardware to be present.
        tags: [system]
        justification: |
          Every check must remain CI-safe: none may depend on a real, multi-hundred-megabyte
          model download or physical audio hardware, since both are unavailable in an ordinary
          CI runner.
        tests:
          - SpeechCli_ValidateFlag_Provided_RunsValidation

      - id: SpeechCli-Cli-SelfValidationResults
        title: >-
          The tool shall write the self-validation results to the `.trx` or `.xml` file named by
          `--results` (alias `--result`).
        tags: [system]
        justification: |
          A CI pipeline consumes the self-validation outcome as a test-result file; silently
          skipping the file would let a pipeline pass without any recorded evidence.
        tests:
          - SpeechCli_ValidateWithTrxResults_Requested_GeneratesTrxFile
          - SpeechCli_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel
          - Program_Main_ValidateWithXmlResults_WritesJUnitFile

      - id: SpeechCli-Cli-SelfValidationResultsErrors
        title: >-
          The tool shall report a `--results` file with an unsupported extension, an unwritable
          path, or no value as an error with a non-zero exit code.
        tags: [system]
        justification: |
          Exiting zero when the result file could not be written would let a pipeline pass
          without any recorded evidence.
        tests:
          - Context_Create_ResultsOption_ParsesPathAndRejectsMissingValue
          - Program_Main_ValidateWithUnsupportedResultsExtension_ReturnsNonZeroExitCode
          - Program_Main_ValidateWithUnwritableResultsPath_ReturnsNonZeroExitCode

      - id: SpeechCli-ModelManagement
        title: >-
          The tool shall let an operator list every known speech model when invoked with the
          `list-models` subcommand.
        tags: [system]
        justification: |
          An operator cannot use any speech capability without first knowing which models exist
          and whether they are downloaded.
        children:
          - SpeechCli-ModelCommands-ListModels
          - SpeechCli-ModelCommands-ListModelsFilters
          - SpeechCli-ModelCommands-ListModelsJsonFormat
          - SpeechCli-ModelCommands-ListModelsArgumentValidation
          - SpeechCli-ModelCommands-LibraryDelegation
          - SpeechCli-ModelCommands-SynthesisSeamExtension
          - SpeechCli-ModelCommands-SynthesisSeamAudioFormat
          - SpeechCli-ModelCommands-SynthesisSeamRoleValidation
          - SpeechCli-ModelCommands-RecognitionSeamExtension
          - SpeechCli-ModelCommands-RecognitionSeamRoleValidation
        tests:
          - SpeechCli_ListModelsCommand_Invoked_ListsKnownModelsAsTable
          - SpeechCli_ListModelsCommandWithJsonFormat_Invoked_EmitsJsonArray

      - id: SpeechCli-ModelInspection
        title: >-
          The tool shall let an operator inspect a single model's details when invoked with the
          `model-info` subcommand.
        tags: [system]
        justification: |
          An operator needs a model's size, location, and install state before downloading or
          using it.
        children:
          - SpeechCli-ModelCommands-ModelInfo
          - SpeechCli-ModelCommands-ModelInfoParameters
          - SpeechCli-ModelCommands-ModelInfoInvariantFormatting
          - SpeechCli-ModelCommands-ModelInfoUnknownId
        tests:
          - SpeechCli_ModelInfoCommandWithUnknownId_Invoked_ReturnsCleanError
          - SpeechCli_ModelInfoCommandWithMissingArgument_Invoked_ReturnsCleanError

      - id: SpeechCli-ModelDownload
        title: >-
          The tool shall let an operator download a model when invoked with the `download`
          subcommand.
        tags: [system]
        justification: |
          A model must be on disk before any speech capability can use it.
        children:
          - SpeechCli-ModelCommands-Download
          - SpeechCli-ModelCommands-DownloadProgress
          - SpeechCli-ModelCommands-DownloadContinueOnFailure
          - SpeechCli-ModelCommands-DownloadFailureExitCode
          - SpeechCli-ModelCommands-DownloadForce
          - SpeechCli-ModelCommands-DownloadForceNotDownloaded
          - SpeechCli-ModelCommands-DownloadArgumentValidation
          - SpeechCli-ModelCommands-DownloadCancellation
          - SpeechCli-ModelCommands-DownloadMirrorComposition
        tests:
          - SpeechCli_DownloadCommandWithUnknownId_Invoked_ReturnsNonZeroExitCode
          - SpeechCli_DownloadCommandWithMissingArgument_Invoked_ReturnsCleanError

      - id: SpeechCli-ModelUninstall
        title: >-
          The tool shall let an operator remove a downloaded model when invoked with the
          `uninstall` subcommand.
        tags: [system]
        justification: |
          An operator must be able to reclaim disk space used by a model that is no longer needed.
        children:
          - SpeechCli-ModelCommands-Uninstall
          - SpeechCli-ModelCommands-UninstallNeverInstalled
        tests:
          - SpeechCli_UninstallCommand_Invoked_NeverInstalledModel_ExitsCleanly

      - id: SpeechCli-ModelClean
        title: >-
          The tool shall let an operator remove partially downloaded model files when invoked
          with the `clean` subcommand.
        tags: [system]
        justification: |
          An interrupted download leaves partial files that an operator must be able to discard.
        children:
          - SpeechCli-ModelCommands-Clean
          - SpeechCli-ModelCommands-CleanNothingToClean
          - SpeechCli-ModelCommands-IdArgumentValidation
          - SpeechCli-ModelCommands-UninstallCancellation
          - SpeechCli-ModelCommands-CleanCancellation
          - SpeechCli-ModelCommands-VoicePackUninstallCancellation
        tests:
          - SpeechCli_CleanCommand_Invoked_NothingToCleanUp_ExitsCleanly

      - id: SpeechCli-ReferenceVoices
        title: >-
          The tool shall let an operator discover the available reference voices for
          voice-cloning models when invoked with the `list-voices` subcommand.
        tags: [system]
        justification: |
          A voice-cloning model can speak only with a reference voice, so an operator needs a
          command-line way to see which voices exist.
        children:
          - SpeechCli-ModelCommands-ListVoices
          - SpeechCli-ModelCommands-ListVoicesJsonFormat
          - SpeechCli-ModelCommands-ListVoicesUsageHints
          - SpeechCli-ModelCommands-ListVoicesEmptyHint
          - SpeechCli-ModelCommands-ListVoicesConsentNote
          - SpeechCli-ModelCommands-ListVoicesArgumentValidation
        tests:
          - SpeechCli_ListVoicesCommand_Invoked_PrintsConsentNote
          - SpeechCli_ListVoicesCommandWithJsonFormat_Invoked_EmitsJsonArray

      - id: SpeechCli-ReferenceVoicePacks
        title: >-
          The tool shall let an operator list the available reference voice packs and their
          install state when invoked with the `voices packs` subcommand.
        tags: [system]
        justification: |
          An operator must see which voice packs can be installed before choosing one.
        children:
          - SpeechCli-ModelCommands-VoicePacks
          - SpeechCli-ModelCommands-VoicePackConsentNote
          - SpeechCli-ModelCommands-VoicePacksConsentNote
          - SpeechCli-ModelCommands-VoicePackArgumentValidation
        tests:
          - SpeechCli_VoicesPacksCommand_Invoked_ListsPacksAndConsentNote
          - CommandDispatch_Find_VoiceCommands_AreRegistered

      - id: SpeechCli-ReferenceVoicePackInstall
        title: >-
          The tool shall let an operator install a reference voice pack when invoked with the
          `voices install` subcommand.
        tags: [system]
        justification: |
          A voice-cloning model can speak only with a reference voice, so an operator needs a
          command-line way to install a voice pack.
        children:
          - SpeechCli-ModelCommands-VoicePackInstall
          - SpeechCli-ModelCommands-VoicePackInstallProgress
          - SpeechCli-ModelCommands-VoicePackInstallFailure
        tests:
          - VoicesCommand_RunAsync_Install_ReportsProgressAndConsentNote

      - id: SpeechCli-ReferenceVoicePackUninstall
        title: >-
          The tool shall let an operator remove an installed reference voice pack when invoked
          with the `voices uninstall` subcommand.
        tags: [system]
        justification: |
          An operator must be able to reclaim disk space used by a voice pack.
        children:
          - SpeechCli-ModelCommands-VoicePackUninstall
          - SpeechCli-ModelCommands-VoicePackUninstallNeverInstalled
        tests:
          - VoicesCommand_RunAsync_Uninstall_ForwardsAndReports

      - id: SpeechCli-ReferenceVoiceEmotions
        title: >-
          The tool shall include the emotion voice variants when installing a reference voice
          pack, unless the operator opts out.
        tags: [system]
        justification: |
          Emotion variants let a voice-cloning model speak in different emotional styles, but
          they enlarge the download, so the operator must be able to decline them.
        children:
          - SpeechCli-ModelCommands-VoiceEmotions
          - SpeechCli-ModelCommands-VoiceEmotionsOptOut
          - SpeechCli-ModelCommands-VoiceEmotionsSizes
          - SpeechCli-ModelCommands-VoiceEmotionsUpgradeNotice
          - SpeechCli-ModelCommands-VoiceEmotionsListing
        tests:
          - VoicesCommand_RunAsync_Install_DefaultIncludesEmotions

      - id: SpeechCli-ChatterboxModelCatalog
        title: >-
          The tool shall list the Chatterbox Turbo voice-cloning model among the known models.
        tags: [system]
        justification: |
          The Chatterbox Turbo model must be discoverable and downloadable through the same
          model commands as every other model.
        children:
          - SpeechCli-ModelCommands-ChatterboxComposition
          - SpeechCli-ModelCommands-ChatterboxVoiceSupply
          - SpeechCli-ModelCommands-ChatterboxDamagedVoiceFile
        tests:
          - SpeechModelCatalogAdapter_Enumerate_ReturnsCompiledInKnownModels

      - id: SpeechCli-DeviceInspection
        title: >-
          The tool shall let an operator list available audio devices when invoked with the
          `list-devices` subcommand.
        tags: [system]
        justification: |
          An operator troubleshooting a failed `speak`/`recognize` invocation needs a way to
          confirm which audio devices this machine actually exposes.
        children:
          - SpeechCli-DeviceCommands-ListDevices
          - SpeechCli-DeviceCommands-ListDevicesDirectionFilter
          - SpeechCli-DeviceCommands-ListDevicesNoDevices
          - SpeechCli-DeviceCommands-ListDevicesArgumentValidation
          - SpeechCli-DeviceCommands-LibraryDelegation
        tests:
          - SpeechCli_ListDevicesCommand_Invoked_ExitsCleanly
          - SpeechCli_ListDevicesCommandWithInvalidDirection_Invoked_ReturnsCleanError

      - id: SpeechCli-DeviceTest
        title: >-
          The tool shall let an operator test an audio device with a generated tone when invoked
          with the `devices test` subcommand.
        tags: [system]
        justification: |
          An operator needs to positively verify that a device works, without reasoning about
          the library's internal audio subsystem.
