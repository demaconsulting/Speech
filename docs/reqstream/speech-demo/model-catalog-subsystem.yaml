---
# Software Subsystem Requirements for the SpeechDemo ModelCatalogSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's model catalog and
# download panel, decomposing the system-level model requirements in
# docs/reqstream/speech-demo.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-demo/
# model-catalog-subsystem/ - one per independently testable unit:
# model-catalog-service.yaml (IModelCatalogService/ModelCatalogService, treated as one unit
# because the interface has no independently observable behavior of its own),
# model-catalog-view-model.yaml (ModelCatalogViewModel),
# model-list-item-view-model.yaml (ModelListItemViewModel), and
# reference-voice-pack-list-item-view-model.yaml (ReferenceVoicePackListItemViewModel).
#
# The requirements below are the subsystem's own behavior, verified through the panel view
# model and the catalog service working together. Each requirement states one criterion:
# browsing, downloading and mirror redirection are separate requirements, as are the voice-pack
# change notification and the two voice-pack safety behaviors. Each rebuild/notification pair is
# evidenced differently: the rebuild requirement by the adapter rebuild plus the panel showing the
# result, the notification requirement by the adapter raising the event plus the synthesis panel
# reacting to it.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelCatalogSubsystem Requirements
        requirements:
          - id: SpeechDemo-ModelCatalog-PanelOperation
            title: >-
              The ModelCatalogSubsystem shall show the catalog's models to a user, one row per
              model with its installation state.
            justification: |
              The demo's evidence value is that a host can build a complete model-management
              page against the library's catalog contract alone. Browsing is the entry point
              to every other panel operation.
            tests:
              - ModelCatalogViewModel_Constructor_PopulatedCatalog_BuildsOneRowPerModel

          - id: SpeechDemo-ModelCatalog-PanelRefresh
            title: >-
              The ModelCatalogSubsystem shall refresh the list of models on demand so that it
              shows the catalog's current state.
            justification: |
              A refresh must adopt the catalog's current state so a user is never shown a
              stale list.
            tests:
              - ModelCatalogViewModel_RefreshAsync_StateChanged_RebuildsRowsAndKeepsSelection

          - id: SpeechDemo-ModelCatalog-ModelDownload
            title: >-
              The ModelCatalogSubsystem shall download a model the user chooses and show it as
              installed once the download completes.
            justification: |
              Downloading a model into the per-user store is the panel's purpose; the user must
              see from the row that the model is ready to use.
            tests:
              - ModelCatalogViewModel_DownloadAsync_Installed_MarksModelDownloaded

          - id: SpeechDemo-ModelCatalog-MirrorRedirection
            title: >-
              The ModelCatalogSubsystem shall let a user redirect model downloads to a mirror
              they configure in the panel.
            justification: |
              A user whose network blocks a model's public download host must be able to
              redirect downloads from the running application.
            tests:
              - ModelCatalogViewModel_ApplyMirrorAsync_ValidMirror_ForwardsConfiguredMirror

          - id: SpeechDemo-ModelCatalog-MirrorApplyConfirmation
            title: >-
              The ModelCatalogSubsystem shall confirm to the user that a mirror they applied
              in the panel took effect.
            justification: |
              Confirming the applied mirror tells the user the redirection took effect before
              they start a large download.
            tests:
              - ModelCatalogViewModel_ApplyMirrorAsync_ValidMirror_ReportsSuccess

          - id: SpeechDemo-ModelCatalog-VoicePackChangeRebuild
            title: >-
              The ModelCatalogSubsystem shall rebuild its catalog and reference voice library
              after a voice pack install attempt.
            justification: |
              The Chatterbox voice list is fixed when the model is constructed, so a stale
              catalog would keep offering the old voices.
            tests:
              - ModelCatalogService_InstallReferenceVoicePackAsync_Success_RebuildsAndRaises
              - ModelCatalogService_InstallReferenceVoicePackAsync_Failure_StillRebuildsAndRaises
              - ModelCatalogViewModel_InstallVoicePackAsync_Installed_RefreshesRows

          - id: SpeechDemo-ModelCatalog-VoicePackChangeNotification
            title: >-
              The ModelCatalogSubsystem shall raise a voices-changed notification after a voice
              pack install attempt, so that other panels can refresh.
            justification: |
              The notification is how the synthesis panel learns that its voice choices
              changed.
            tests:
              - ModelCatalogService_InstallReferenceVoicePackAsync_Success_RebuildsAndRaises
              - ModelCatalogService_InstallReferenceVoicePackAsync_Failure_StillRebuildsAndRaises
              - SynthesisPanelViewModel_ReferenceVoicesChanged_RefreshesAndKeepsChosenVoice

          - id: SpeechDemo-ModelCatalog-VoicePackRemovedRebuild
            title: >-
              The ModelCatalogSubsystem shall rebuild its catalog and reference voice library
              after a voice pack is removed.
            justification: |
              A removed voice is only withdrawn once the catalog is rebuilt.
            tests:
              - ModelCatalogService_UninstallReferenceVoicePack_RebuildsCatalogAndRaisesEvent
              - ModelCatalogViewModel_RemoveVoicePackAsync_Installed_UninstallsAndRefreshesRows

          - id: SpeechDemo-ModelCatalog-VoicePackRemovedNotification
            title: >-
              The ModelCatalogSubsystem shall raise a voices-changed notification after a voice
              pack is removed, so that other panels can refresh.
            justification: |
              The notification lets the synthesis panel stop offering the removed voices.
            tests:
              - ModelCatalogService_UninstallReferenceVoicePack_RebuildsCatalogAndRaisesEvent
              - SynthesisPanelViewModel_ReferenceVoicesChanged_RefreshesAndKeepsChosenVoice

          - id: SpeechDemo-ModelCatalog-MirrorChangedRebuild
            title: >-
              The ModelCatalogSubsystem shall rebuild its catalog and reference voice library
              when the mirror is changed.
            justification: |
              Voice packs download through the same mirror as models, so a mirror change
              produces a freshly configured catalog and library.
            tests:
              - ModelCatalogService_ApplyMirror_Composed_RebuildsPairAndRaisesEvent

          - id: SpeechDemo-ModelCatalog-MirrorChangedRowsShown
            title: >-
              The ModelCatalogSubsystem shall show the rebuilt catalog's models after the mirror
              is changed.
            justification: |
              The rebuilt catalog may report different install states, so the panel must not
              keep showing the old rows.
            tests:
              - ModelCatalogViewModel_ApplyMirrorAsync_ValidMirror_ReReadsCatalog

          - id: SpeechDemo-ModelCatalog-MirrorChangedNotification
            title: >-
              The ModelCatalogSubsystem shall raise a voices-changed notification when the
              mirror is changed, so that other panels can refresh.
            justification: |
              Dependent panels must pick up the freshly configured catalog and library.
            tests:
              - ModelCatalogService_ApplyMirror_Composed_RebuildsPairAndRaisesEvent
              - SynthesisPanelViewModel_ReferenceVoicesChanged_RefreshesAndKeepsChosenVoice

          - id: SpeechDemo-ModelCatalog-VoicePackRollbackStaysRemovable
            title: >-
              The ModelCatalogSubsystem shall keep a voice pack that remains installed after a
              failed install or upgrade shown as installed and removable.
            justification: |
              A failed "Add emotions" upgrade leaves the previous voices-only install in place.
              Showing such a pack as broken would hide a working install and block its removal,
              so the panel must report what is really installed.
            tests:
              - ModelCatalogViewModel_InstallVoicePackAsync_UpgradeFailsAndRollsBack_KeepsPackInstalledWithMessage

          - id: SpeechDemo-ModelCatalog-VoicePackRollbackFailureExplained
            title: >-
              The ModelCatalogSubsystem shall keep showing the failure explanation on the row of
              a voice pack whose install or upgrade failed, even when the pack remains installed.
            justification: |
              Reporting the real install state must not hide the failure from the user.
            tests:
              - ModelCatalogViewModel_InstallVoicePackAsync_UpgradeFailsAndRollsBack_KeepsPackInstalledWithMessage

          - id: SpeechDemo-ModelCatalog-VoicePackRemovalWaitsForInstall
            title: >-
              The ModelCatalogSubsystem shall wait, without blocking its caller, for an
              in-progress install of a voice pack to finish before removing that pack.
            justification: |
              Removing a pack that is being (re)installed would corrupt the install, so the
              removal serializes with it.
            tests:
              - ModelCatalogService_UninstallReferenceVoicePackAsync_InstallInFlight_WaitsThenUninstalls

          - id: SpeechDemo-ModelCatalog-VoicePackRemovalFailureExplained
            title: >-
              The ModelCatalogSubsystem shall explain on the pack's row, without failing, a
              voice pack removal that cannot complete.
            justification: |
              Reporting a failure on the row keeps the user informed and the application
              running.
            tests:
              - ModelCatalogViewModel_RemoveVoicePackAsync_StoreException_ShowsMessageAndKeepsPack

          - id: SpeechDemo-ModelCatalog-VoicePackRemovalCanceledExplained
            title: >-
              The ModelCatalogSubsystem shall explain on the pack's row, without failing, a
              voice pack removal that was canceled.
            justification: |
              A canceled removal must tell the user nothing was removed instead of failing
              silently.
            tests:
              - ModelCatalogViewModel_RemoveVoicePackAsync_Canceled_ShowsCanceledMessage

          - id: SpeechDemo-ModelCatalog-VoicePackRemovalFailureNoRebuild
            title: >-
              The ModelCatalogSubsystem shall neither rebuild its catalog nor raise a
              voices-changed notification when a voice pack removal fails.
            justification: |
              Nothing changed, so rebuilding or announcing would make other panels refresh for
              no reason and could mask the failure.
            tests:
              - ModelCatalogService_UninstallReferenceVoicePackAsync_Fails_DoesNotRebuildOrRaise

          - id: SpeechDemo-ModelCatalog-MirrorBlockedDuringTransfer
            title: >-
              The ModelCatalogSubsystem shall refuse a mirror change while a model download or a
              voice pack install is in flight, reporting an explanation to the user.
            justification: |
              A mirror change replaces the catalog and would abort the transfer in flight, so
              the panel refuses it rather than let the user abort their own transfer.
            tests:
              - ModelCatalogViewModel_ApplyMirrorAsync_DownloadInProgress_RefusesAndReportsError
              - ModelCatalogViewModel_ApplyMirrorAsync_PackInstalling_IsRefused

          - id: SpeechDemo-ModelCatalog-DownloadOutcomeOnRow
            title: >-
              The ModelCatalogSubsystem shall report a failed, checksum-mismatched or canceled
              model download on that model's row as a state, not as an application error.
            justification: |
              Download failures are ordinary outcomes; the user needs the row to show what
              happened and offer a retry.
            tests:
              - ModelCatalogViewModel_DownloadAsync_Failed_ReportsLibraryErrorMessage
              - ModelCatalogViewModel_DownloadAsync_ChecksumMismatch_ReportsExplainedFailure
              - ModelCatalogViewModel_DownloadAsync_Canceled_ReportsNotDownloaded

          - id: SpeechDemo-ModelCatalog-PanelRefreshFaultContained
            title: >-
              The ModelCatalogSubsystem shall report a fault while re-reading the catalog as an
              explained panel error, leaving the rows it already shows in place.
            justification: |
              A refresh is a fault-isolation boundary; an unexpected fault must neither crash
              the demo nor leave the list cleared.
            tests:
              - ModelCatalogViewModel_RefreshAsync_SeamFault_ReportedAndRowsKept

          - id: SpeechDemo-ModelCatalog-VoicePackSectionHidden
            title: >-
              The ModelCatalogSubsystem shall hide the reference voices section when its
              catalog service has no voice library.
            justification: |
              Hosts built without voice support must not show an empty, confusing section.
            tests:
              - ModelCatalogViewModel_Constructor_NoVoicePacks_HidesSection
