---
# Software Subsystem Requirements for the SpeechDemo ShellSubsystem
#
# These requirements describe the subsystem-level behavior of the demo application's shell,
# decomposing the system-level shell requirements in docs/reqstream/speech-demo.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-demo/shell-subsystem/ -
# one per independently testable unit:
# main-window-view-model.yaml (MainWindowViewModel) and
# demo-panel-view-model.yaml (DemoPanelViewModel).
#
# The requirement below is the subsystem's own behavior: the shell composed together with the
# four panel view models it hosts, verified over an environment that reports nothing at all.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ShellSubsystem Requirements
        requirements:
          - id: SpeechDemo-Shell-EmptyEnvironmentComposition
            title: >-
              The ShellSubsystem shall compose successfully on a machine that reports no audio
              devices and no known models, with each panel reporting its own empty state.
            justification: |
              A developer evaluating the library frequently runs the demo on a machine with no
              audio backend and nothing installed. That must produce a working window that
              explains the situation, not a start-up failure. The behavior spans the shell and
              all four panels, so it is verified by composing them together.
            tests:
              - MainWindowViewModel_Constructor_EmptyEnvironment_PanelsReportHonestEmptyState
