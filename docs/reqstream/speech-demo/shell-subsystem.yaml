---
# Software Subsystem Requirements for the SpeechDemo ShellSubsystem
#
# These requirements describe the subsystem-level behavior of the demo application's shell,
# decomposing the system-level shell requirements in docs/reqstream/speech-demo.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-demo/shell-subsystem/ -
# one per independently testable unit:
# main-window-view-model.yaml (MainWindowViewModel) and
# demo-panel-view-model.yaml (DemoPanelViewModel).
#
# The requirement below is the subsystem's own behavior: the shell composed together with the
# four panel view models it hosts, verified over an environment that reports nothing at all.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ShellSubsystem Requirements
        requirements:
          - id: SpeechDemo-Shell-EmptyEnvironmentComposition
            title: >-
              The ShellSubsystem shall compose successfully on a machine that reports no audio
              devices and no known models, with each panel reporting its own empty state.
            justification: |
              A developer evaluating the library frequently runs the demo on a machine with no
              audio backend and nothing installed. That must produce a working window that
              explains the situation, not a start-up failure. The behavior spans the shell and
              all four panels, so it is verified by composing them together.
            children:
              - SpeechDemo-Shell-CompositionRoot
            tests:
              - MainWindowViewModel_Constructor_EmptyEnvironment_PanelsReportHonestEmptyState

          - id: SpeechDemo-Shell-CapabilityNavigation-ShellSubsystem
            title: >-
              The ShellSubsystem shall present each demonstrated library capability as a
              separately selectable, titled panel.
            justification: |
              Subsystem-level grouping of the ShellSubsystem unit requirements that implement
              SpeechDemo-Shell-CapabilityNavigation.
            children:
              - SpeechDemo-Shell-PanelCatalog
              - SpeechDemo-Shell-DefaultPanel
              - SpeechDemo-Shell-PanelTitles
              - SpeechDemo-Shell-PanelEntryTitles
              - SpeechDemo-Shell-PanelHosting
              - SpeechDemo-Shell-SelectionNotification
              - SpeechDemo-Shell-WindowTitle
              - SpeechDemo-Shell-PanelContent
              - SpeechDemo-Shell-PanelTitleRequired
              - SpeechDemo-Shell-PanelContentRequired
              - SpeechDemo-Shell-SelectionNoNotificationWhenUnchanged
            tests:
              - MainWindowViewModel_Constructor_ValidPanels_OffersAllFourPanels
              - MainWindowViewModel_Constructor_ValidPanels_SelectsFirstPanel
              - DemoPanelViewModel_Constructor_ValidArguments_CarriesTitleAndContent
              - MainWindowViewModel_Constructor_ValidPanels_EveryEntryHasNonBlankTitle
              - MainWindowViewModel_Constructor_ValidPanels_HostsTheInjectedPanelInstances
              - MainWindowViewModel_SelectedPanel_Changed_NotifiesSelectedPanel
              - MainWindowViewModel_Title_Read_NamesTheImplementedCapabilities
              - DemoPanelViewModel_Constructor_BlankTitle_ThrowsArgumentException
              - DemoPanelViewModel_Constructor_NullTitle_ThrowsArgumentNullException
              - DemoPanelViewModel_Constructor_NullContent_ThrowsArgumentNullException
              - MainWindowViewModel_SelectedPanel_SameValue_DoesNotNotify
