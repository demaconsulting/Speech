---
# Software Subsystem Requirements for the SpeechDemo DeviceSelectionSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's device pickers,
# decomposing the system-level device requirements in docs/reqstream/speech-demo.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-demo/
# device-selection-subsystem/ - one per independently testable unit:
# audio-device-service.yaml (IAudioDeviceService/AudioDeviceService, treated as one unit because
# the interface has no independently observable behavior of its own) and
# device-selection-view-model.yaml (DeviceSelectionViewModel).
#
# The requirements below are the subsystem's own behavior, verified by composing the view model
# over the real AudioDeviceService and a library AudioDeviceFactory with substitute probes.
# Every test below is a DeviceSelectionSubsystemTests test.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: DeviceSelectionSubsystem Requirements
        requirements:
          - id: SpeechDemo-DeviceSelection-PanelListsLibraryDevices
            title: >-
              The DeviceSelectionSubsystem shall list in its pickers exactly the capture and
              playback devices the library's probes report.
            justification: |
              The demo exists to show the library's device enumeration working end to end. The
              property only holds when the view model and the adapter over the library factory
              work together, so it is verified with both composed.
            children:
              - SpeechDemo-Devices-Enumeration
              - SpeechDemo-Devices-LibraryProbeDelegation
              - SpeechDemo-Devices-LibraryPlaybackProbeDelegation
              - SpeechDemo-Devices-EnumerationCount
              - SpeechDemo-Devices-EmptyProbeResult
              - SpeechDemo-Devices-ProbeResultsNotCached
              - SpeechDemo-Devices-CaptureDeviceCreation
              - SpeechDemo-Devices-PlaybackDeviceCreation
            tests:
              - DeviceSelectionSubsystem_Composed_ProbesReportDevices_PickersListThem

          - id: SpeechDemo-DeviceSelection-PanelPreselectsFirstDevice
            title: >-
              The DeviceSelectionSubsystem shall preselect the first device the library's
              probes report in each direction.
            justification: |
              A usable demo needs no configuration step. The selection handed back to the
              library must name a device the library's own probes reported, which only holds
              when the view model and the adapter work together.
            children:
              - SpeechDemo-Devices-DefaultSelection
              - SpeechDemo-Devices-ServiceRequired
              - SpeechDemo-Devices-FactoryRequired
              - SpeechDemo-Devices-SelectionNotification
            tests:
              - DeviceSelectionSubsystem_Composed_ProbesReportDevices_PickersPreselectFirstOfEachDirection

          - id: SpeechDemo-DeviceSelection-EmptyPanelExplained
            title: >-
              The DeviceSelectionSubsystem shall show empty pickers with an explanatory message
              and the library's system-default selections when the library's probes report no
              devices.
            justification: |
              A machine with no audio hardware is an ordinary state. The explanation and the
              usable default selection must survive the full path from the library's probes to
              the picker, not only the view model in isolation.
            children:
              - SpeechDemo-Devices-EmptyStateExplanation
              - SpeechDemo-Devices-EmptyStateAfterRefreshExplained
              - SpeechDemo-Devices-EmptySelectionFallback
            tests:
              - DeviceSelectionSubsystem_Composed_ProbesReportNothing_PickersExplainAndDefault

          - id: SpeechDemo-DeviceSelection-RefreshReachesLibrary
            title: >-
              The DeviceSelectionSubsystem shall make a refresh of the pickers force the
              library to re-scan its device table.
            justification: |
              A refresh that only re-reads cached lists would never reveal a hot-plugged
              device. Verifying it against the library's own environment proves the refresh
              action reaches the library rather than stopping at the demo's seam.
            children:
              - SpeechDemo-Devices-ConstructionWithoutRefresh
              - SpeechDemo-Devices-ServiceRefreshDelegation
            tests:
              - DeviceSelectionSubsystem_Composed_Refresh_ReScansLibrary

          - id: SpeechDemo-DeviceSelection-RefreshKeepsSelection
            title: >-
              The DeviceSelectionSubsystem shall keep the chosen device across a refresh when
              the library still reports it.
            justification: |
              Discarding a still-valid choice on every refresh would be visibly wrong, and the
              property must hold against the library's own re-scan, not only a substitute
              service.
            children:
              - SpeechDemo-Devices-NameBasedSelection
              - SpeechDemo-Devices-Refresh
            tests:
              - DeviceSelectionSubsystem_Composed_Refresh_DeviceStillReported_KeepsSelection

          - id: SpeechDemo-DeviceSelection-RefreshFailureKeepsState
            title: >-
              The DeviceSelectionSubsystem shall, when the library cannot complete a refresh,
              leave the device lists and selections untouched.
            justification: |
              A refresh can be refused (for example while a device is in use) or fail in the
              native layer; the panel must stay usable with its previous lists and choices,
              not clear a working choice.
            tests:
              - DeviceSelectionSubsystem_Composed_RefreshFails_KeepsListsAndSelections

          - id: SpeechDemo-DeviceSelection-RefreshFailureExplained
            title: >-
              The DeviceSelectionSubsystem shall explain, in both status texts, why a refresh
              the library could not complete changed nothing.
            justification: |
              A silent failure would leave the user believing the refresh worked.
            tests:
              - DeviceSelectionSubsystem_Composed_RefreshFails_ExplainsInStatus

          - id: SpeechDemo-Devices-HonestEmptyState-DeviceSelectionSubsystem
            title: >-
              The DeviceSelectionSubsystem shall explain, rather than silently show nothing,
              when the machine reports no audio devices.
            justification: |
              Subsystem-level grouping of the DeviceSelectionSubsystem unit requirements that
              implement SpeechDemo-Devices-HonestEmptyState.
            children:
              - SpeechDemo-Devices-EmptyStateAfterRefresh
            tests:
              - DeviceSelectionViewModel_RefreshAsync_AllDevicesRemoved_ClearsSelectionAndExplains
