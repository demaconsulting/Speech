---
# Software Subsystem Requirements for the SpeechDemo ModelSettingsSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's generic per-model
# tunable-parameter settings panel that spans its units, decomposing the system-level settings
# requirements in docs/reqstream/speech-demo.yaml. Unit-level requirements live in:
#
#   model-settings-subsystem/model-settings-view-model.yaml - ModelSettingsViewModel
#   model-settings-subsystem/parameter-view-models.yaml     - ParameterViewModelBase and the
#                                                             Numeric/Choice/Boolean presenters

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelSettingsSubsystem Requirements
        requirements:
          - id: SpeechDemo-Settings-GenericParameterRendering
            title: >-
              The ModelSettingsSubsystem shall present one item for every recognized parameter
              the selected model declares.
            justification: |
              This library's typed, self-describing parameter design lets a host build a
              completely generic settings UI with no prior knowledge of a specific model's
              declared parameter set; every declared parameter must therefore appear, whatever
              the model. How each parameter kind is recognized is a design matter described in
              the ModelSettingsSubsystem design document.
            children:
              - SpeechDemo-Settings-ParameterConstructionGuards
              - SpeechDemo-Settings-ChoicePresenter
              - SpeechDemo-Settings-ChoicePresenterSelectionNotification
              - SpeechDemo-Settings-ChoicePresenterSelection
              - SpeechDemo-Settings-ChoicePresenterNullSelectionIgnored
              - SpeechDemo-Settings-ChoicePresenterNonMemberSelectionIgnored
            tests:
              - ModelSettingsViewModel_Model_ModelWithAllThreeParameterKinds_RendersMatchingPresenters

          - id: SpeechDemo-Settings-GenericParameterRenderingOrder
            title: >-
              The ModelSettingsSubsystem shall present the parameters of the selected model in
              the order the model declares them.
            justification: |
              A model author orders parameters deliberately (for example the voice before its
              fine-tuning controls); a settings panel that reordered them would misrepresent
              that intent.
            tests:
              - ModelSettingsViewModel_Model_ModelWithAllThreeParameterKinds_RendersMatchingPresenters

          - id: SpeechDemo-Settings-GenericParameterRenderingKind
            title: >-
              The ModelSettingsSubsystem shall present each parameter with the kind of control
              appropriate to that parameter's kind (numeric, choice or boolean).
            justification: |
              A number, a selection from options and an on/off switch each need a different
              control; presenting a parameter with the wrong kind of control would let the user
              enter values the parameter cannot accept.
            tests:
              - ModelSettingsViewModel_Model_ModelWithAllThreeParameterKinds_RendersMatchingPresenters

          - id: SpeechDemo-Settings-ValueBag
            title: >-
              The ModelSettingsSubsystem shall assemble the current value of every presented
              parameter into a key-value bag keyed by each parameter's declared identifier.
            justification: |
              The design describes an untyped key-value bag as the interface between a host's
              settings UI and per-model synthesis parameter handling. The synthesis panel
              forwards this bag to the synthesizer-engine load so a chosen voice changes what is
              synthesized. The recognition panel does not consume it because the recognition
              session contract accepts no per-call parameter bag.
            children:
              - SpeechDemo-Settings-NumericPresenter-DefaultInitialization
              - SpeechDemo-Settings-NumericPresenter-Clamping
              - SpeechDemo-Settings-NumericPresenter-IntegerRounding
              - SpeechDemo-Settings-NumericPresenter-ControlSelection
              - SpeechDemo-Settings-NumericPresenter-WholeNumberControl
              - SpeechDemo-Settings-NumericPresenter-NonFiniteIgnored
              - SpeechDemo-Settings-ChoicePresenterDefaultSelection
              - SpeechDemo-Settings-BooleanPresenter
              - SpeechDemo-Settings-NumericPresenter-ContinuousPrecision
              - SpeechDemo-Settings-BooleanPresenterToggle
              - SpeechDemo-Settings-ValueBagDuplicateIds
            tests:
              - ModelSettingsViewModel_BuildValueBag_AllThreeParameterKinds_RoundTripsCurrentValues

          - id: SpeechDemo-Settings-CapturedValuesRestored
            title: >-
              The ModelSettingsSubsystem shall restore previously captured parameter values into
              the presenters of the model, keeping each presenter's default for a value that is
              missing or no longer applies.
            justification: |
              A host that rebuilds the panel (for example after the voice list changes) must be
              able to put the user's tuning back without the restored bag overriding a parameter
              the new model does not declare or an option it no longer offers.
            children:
              - SpeechDemo-Settings-RestoreIgnoresWrongTypedValues
              - SpeechDemo-Settings-RestoreIgnoresStaleValues
            tests:
              - ModelSettingsViewModel_RestoreValues_AppliesCapturedValues
              - ModelSettingsViewModel_RestoreValues_UnavailableOptionOrKey_KeepsDefault

          - id: SpeechDemo-Settings-EmptyStateExplained
            title: >-
              The ModelSettingsSubsystem shall explain an empty panel, distinguishing no model
              being selected from a model that declares no parameters.
            justification: |
              A blank settings area is indistinguishable from a broken one; the user must be
              told which of the two situations applies.
            children:
              - SpeechDemo-Settings-ValueBagEmptyWithoutModel
            tests:
              - ModelSettingsViewModel_Constructor_NoModel_ReportsNoModelEmptyState
              - ModelSettingsViewModel_Model_ModelWithNoParameters_ReportsNoParametersEmptyState

          - id: SpeechDemo-Settings-UnrecognizedParameterTolerated
            title: >-
              The ModelSettingsSubsystem shall skip a parameter of a kind it does not recognize
              and still present the model's other parameters.
            justification: |
              The library may add parameter kinds a host built against an older contract does
              not know; one unknown kind must not hide every other setting.
            children:
              - SpeechDemo-Settings-ModelSwitch
              - SpeechDemo-Settings-UnrecognizedParameterSkipped
            tests:
              - ModelSettingsViewModel_Model_UnrecognizedParameterKind_SkipsItAndPresentsTheRest

          - id: SpeechDemo-Voices-VoiceChoice-ModelSettingsSubsystem
            title: >-
              The ModelSettingsSubsystem shall offer newly available reference voices
              immediately after a model installation notification.
            justification: |
              Installing or removing a reference voice pack changes the voices a model offers.
              Subsystem-level grouping of the ModelSettingsSubsystem unit requirements that
              implement SpeechDemo-Voices-VoiceChoice: the settings panel must reflect the new
              voices without the user selecting again the model or restarting the application.
            children:
              - SpeechDemo-Settings-RestoreValues
              - SpeechDemo-Settings-RestoreWithNewOptions
            tests:
              - ModelSettingsViewModel_VoiceChoices_ReferenceVoicesChanged_NewVoicesAvailableAndSelectionRetained

          - id: SpeechDemo-Voices-VoiceChoice-SelectionRetained-ModelSettingsSubsystem
            title: >-
              The ModelSettingsSubsystem shall keep the voice the user already chose across a
              model installation notification.
            justification: |
              A catalog rebuild must not silently reset the user's voice to the default; the
              prior selection survives whenever it is still offered.
            children:
              - SpeechDemo-Settings-RestoreValues
            tests:
              - ModelSettingsViewModel_RestoreValues_AppliesCapturedValues
              - ModelSettingsViewModel_VoiceChoices_ReferenceVoicesChanged_NewVoicesAvailableAndSelectionRetained

          - id: SpeechDemo-Settings-EmptyStateExplanation-ModelSettingsSubsystem
            title: >-
              The ModelSettingsSubsystem shall explain, rather than silently show nothing, when
              no model is selected.
            justification: |
              Subsystem-level grouping of the ModelSettingsSubsystem unit requirements that
              implement SpeechDemo-Settings-EmptyStateExplanation.
            children:
              - SpeechDemo-Settings-HonestEmptyState
              - SpeechDemo-Settings-EmptyStateAfterModelCleared
              - SpeechDemo-Settings-EmptyStateNotifications
            tests:
              - ModelSettingsViewModel_Constructor_NoModel_ReportsNoModelEmptyState
              - ModelSettingsViewModel_Model_ChangedToNull_ClearsPresentersAndReportsNoModelState
              - ModelSettingsViewModel_Model_Changed_RaisesEmptyStateNotifications

          - id: SpeechDemo-Settings-NoParametersExplanation-ModelSettingsSubsystem
            title: >-
              The ModelSettingsSubsystem shall explain, rather than silently show nothing, when
              the selected model declares no tunable parameters.
            justification: |
              Subsystem-level grouping of the ModelSettingsSubsystem unit requirements that
              implement SpeechDemo-Settings-NoParametersExplanation.
            children:
              - SpeechDemo-Settings-NoParametersExplained
            tests:
              - ModelSettingsViewModel_Model_ModelWithNoParameters_ReportsNoParametersEmptyState
