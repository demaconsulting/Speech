---
# Software Subsystem Requirements for the SpeechDemo ModelSettingsSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's generic per-model
# tunable-parameter settings panel that spans its units, decomposing the system-level settings
# requirements in docs/reqstream/speech-demo.yaml. Unit-level requirements live in:
#
#   model-settings-subsystem/model-settings-view-model.yaml - ModelSettingsViewModel
#   model-settings-subsystem/parameter-view-models.yaml     - ParameterViewModelBase and the
#                                                             Numeric/Choice/Boolean presenters

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelSettingsSubsystem Requirements
        requirements:
          - id: SpeechDemo-Settings-GenericParameterRendering
            title: >-
              The ModelSettingsSubsystem shall render one presenter per parameter the selected
              model declares, choosing the presenter kind from the parameter's concrete type
              alone.
            justification: |
              This library's typed, self-describing parameter design lets a host build a
              completely generic settings UI with no prior knowledge of a specific model's
              declared parameter set. Choosing the presenter by type check alone is the
              demonstrable proof that this generic rendering works for every parameter kind the
              library defines today.
            tests:
              - ModelSettingsViewModel_Model_ModelWithAllThreeParameterKinds_RendersMatchingPresenters

          - id: SpeechDemo-Settings-ValueBag
            title: >-
              The ModelSettingsSubsystem shall assemble the current value of every presented
              parameter into a key-value bag keyed by each parameter's declared identifier.
            justification: |
              The design describes an untyped key-value bag as the interface between a host's
              settings UI and per-model synthesis parameter handling. The synthesis panel
              forwards this bag to the synthesizer-engine load so a chosen voice changes what is
              synthesized. The recognition panel does not consume it because the recognition
              session contract accepts no per-call parameter bag.
            tests:
              - ModelSettingsViewModel_BuildValueBag_AllThreeParameterKinds_RoundTripsCurrentValues
