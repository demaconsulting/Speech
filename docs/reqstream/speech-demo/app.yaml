---
# Software Unit Requirements for the SpeechDemo App
#
# These requirements describe the design-level behavior of the App unit - the Avalonia
# application object and the demo's manual composition root - decomposing the system-level
# library composition requirement in docs/reqstream/speech-demo.yaml. Composition and the
# per-step shutdown containment are exercised through the internal Compose and
# RunTeardownAsync seams, so no running desktop lifetime is needed.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: App Requirements
        requirements:
          - id: SpeechDemo-App-ShellComposition
            title: >-
              The App unit shall compose the demo's object graph by hand over the library's
              real public entry points, with every panel wired to the shared device selection
              and model catalog.
            justification: |
              The demo exists to show how a host application wires itself to the library. A
              single explicit composition root keeps that wiring readable.
            tests:
              - App_Compose_IsolatedLaunchOptions_ComposesShellWithAllPanels
              - App_Compose_NullLaunchOptions_ComposesShell
              - SpeechDemo_SystemIntegration_RealLibraryEntryPoints_ComposesWorkingShell

          - id: SpeechDemo-App-CatalogRegistration
            title: >-
              The App unit shall register every model family the demo offers in the catalog it
              composes, so the catalog panel lists them.
            justification: |
              A composition root that forgot a family would present an apparently empty or
              partial catalog.
            tests:
              - App_Compose_IsolatedLaunchOptions_CatalogListsEveryRegisteredModel
              - SpeechDemo_SystemIntegration_RealModelCatalog_ReportsKnownModels

          - id: SpeechDemo-App-MirrorPrePopulation
            title: >-
              The App unit shall pre-populate the model catalog panel's mirror settings from the
              launch options.
            justification: |
              A mirror given on the command line must be visible and editable in the panel.
            tests:
              - App_Compose_MirrorLaunchOptions_PrePopulatesCatalogPanelMirrorSettings

          - id: SpeechDemo-App-ShutdownContainment
            title: >-
              The App unit shall run each shutdown disposal step separately, so a failure in one
              step neither prevents the remaining steps nor stops the application from exiting.
            justification: |
              Shutdown releases the synthesizer, recognizer and catalog. One faulting dispose
              must not leak the others or leave the process hanging.
            tests:
              - App_RunTeardownAsync_AllStepsSucceed_RunsEveryStepInOrder
              - App_RunTeardownAsync_StepsFail_ContainsEachFailureAndRunsRemainingSteps

          - id: SpeechDemo-App-ShutdownDeferral
            title: >-
              The App unit shall defer the first shutdown request until asynchronous cleanup has
              finished, then resume shutdown exactly once.
            justification: |
              Exiting while a synthesizer or recognizer is still releasing audio devices would
              leak them.
            tests:
              - App_HandleShutdownRequested_FirstRequest_DefersThenResumesShutdownOnce
              - App_ShutdownTask_BeforeAnyRequest_IsNull

          - id: SpeechDemo-App-ShutdownReentrancy
            title: >-
              The App unit shall keep cancelling repeated shutdown requests while cleanup is
              pending and start no second cleanup.
            justification: |
              A second close request during cleanup must neither exit mid-cleanup nor run the
              disposal steps twice.
            tests:
              - App_HandleShutdownRequested_RepeatedRequest_StartsNoSecondCleanup
          - id: SpeechDemo-App-AvaloniaApplication
            title: >-
              The App unit shall be a valid Avalonia application.
            justification: |
              Avalonia's runtime and design-time tooling can only start the demo when the
              application object derives from the framework's application type.
            tests:
              - Avalonia_DemoApplication_Inspected_DerivesFromAvaloniaApplication
