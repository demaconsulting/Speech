---
# Software Unit Requirements for the SpeechDemo DemoPanelViewModel
#
# These requirements describe the behavior of the DemoPanelViewModel unit - one navigable
# entry pairing a display title with the panel view model it shows - decomposing the parent
# ShellSubsystem requirements.
#
# The requirements are grouped by concern, one criterion each:
#   - Title (Shell-PanelTitles)
#   - Content (Shell-PanelContent)
# Every test below is a DemoPanelViewModelTests test.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ShellSubsystem Requirements
        sections:
          - title: DemoPanelViewModel Requirements
            requirements:
              - id: SpeechDemo-Shell-PanelTitles
                title: >-
                  The DemoPanelViewModel shall expose the title it was created with and shall
                  reject a missing, empty or whitespace title.
                justification: |
                  A navigation entry with no readable title is unusable, so an untitled entry
                  is a programming error to surface at creation rather than a blank tab.
                tests:
                  - DemoPanelViewModel_Constructor_ValidArguments_CarriesTitleAndContent
                  - DemoPanelViewModel_Constructor_BlankTitle_ThrowsArgumentException
                  - DemoPanelViewModel_Constructor_NullTitle_ThrowsArgumentNullException

              - id: SpeechDemo-Shell-PanelContent
                title: >-
                  The DemoPanelViewModel shall expose the panel view model it was created with
                  and shall reject a missing panel.
                justification: |
                  An entry with no content would render a blank page; carrying the exact
                  instance is what lets the shell present the panel state the composition root
                  built.
                tests:
                  - DemoPanelViewModel_Constructor_ValidArguments_CarriesTitleAndContent
                  - DemoPanelViewModel_Constructor_NullContent_ThrowsArgumentNullException
