---
# Software Subsystem Requirements for the SpeechDemo SynthesisPanelSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's text-to-speech panel,
# decomposing the system-level synthesis requirements in docs/reqstream/speech-demo.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-demo/
# synthesis-panel-subsystem/ - one per independently testable unit:
# synthesizer-session-factory.yaml (ISynthesizerSessionFactory/SynthesizerSessionFactory, treated
# as one unit because the interface has no independently observable behavior of its own) and
# synthesis-panel-view-model.yaml (SynthesisPanelViewModel). The requirements below are the
# subsystem's own behavior, verified through the panel view model working with its seams.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: SynthesisPanelSubsystem Requirements
        requirements:
          - id: SpeechDemo-SynthesisPanel-PlaybackThroughSeams
            title: >-
              The SynthesisPanelSubsystem shall speak the entered text, unchanged, through the
              selected installed model and playback device.
            justification: |
              Speaking the entered text with the user's chosen voice and speaker is the panel's
              core purpose, and it must work end to end with no downloaded model, native runtime
              or speakers so it stays demonstrable and verifiable.
            tests:
              - SynthesisPanelViewModel_Play_EnteredText_SpeaksTextThroughSelectedPlaybackDevice

          - id: SpeechDemo-SynthesisPanel-LifecycleThroughSeams
            title: >-
              The SynthesisPanelSubsystem shall report synthesizing, then playing, then idle,
              with no status message, as a successful Play through its seams progresses.
            justification: |
              A user needs to see a Play advance and settle without leaving a stale message, and
              the whole lifecycle must stay verifiable with no downloaded model, native runtime
              or speakers.
            tests:
              - SynthesisPanelViewModel_Play_SuccessfulSession_TransitionsThroughLifecycleToIdle

          - id: SpeechDemo-SynthesisPanel-StopPlayback
            title: >-
              The SynthesisPanelSubsystem shall let a user interrupt speech that is in progress
              and report that it was stopped.
            justification: |
              Synthesized speech can run for an arbitrary duration, so a user needs a way to
              interrupt it and to see that the interruption took effect.
            tests:
              - SynthesisPanelViewModel_Stop_DuringPlayback_CancelsSessionAndReportsStopped

          - id: SpeechDemo-SynthesisPanel-UnavailableDeviceReporting
            title: >-
              The SynthesisPanelSubsystem shall report an explained error state instead of
              failing when no playback device is available.
            justification: |
              A machine with no speakers must show why nothing was spoken rather than crash or
              stay silent without explanation.
            tests:
              - SynthesisPanelViewModel_Play_NoPlaybackDevice_ReportsErrorState

          - id: SpeechDemo-SynthesisPanel-SetupFaultReporting
            title: >-
              The SynthesisPanelSubsystem shall report an explained error state instead of
              failing when loading the engine or creating the session faults.
            justification: |
              An invalid parameter value or a missing runtime must show why nothing was spoken
              rather than crash the demo.
            tests:
              - SynthesisPanelViewModel_Play_SetupFaults_ReportsErrorStateWithMessage

          - id: SpeechDemo-SynthesisPanel-ModelChangeGuard
            title: >-
              The SynthesisPanelSubsystem shall allow the model to be changed only while no
              speech is in progress.
            justification: |
              Changing the model under a running session would invalidate the engine in use.
            tests:
              - SynthesisPanelViewModel_Play_SuccessfulSession_CanChangeModelTogglesAcrossLifecycle

          - id: SpeechDemo-SynthesisPanel-VoiceNotice
            title: >-
              The SynthesisPanelSubsystem shall show the consent and attribution notice when the
              selected model is Chatterbox Turbo, and no notice for other models.
            justification: |
              Voice cloning carries a consent obligation that the user must see at the point of
              use.
            tests:
              - SynthesisPanelViewModel_VoiceNotice_ChatterboxShowsConsentAndAttribution_OthersShowNothing
              - SynthesisPanelViewModel_VoiceNotice_OtherModel_ShowsNothing

          - id: SpeechDemo-SynthesisPanel-EngineSessionReuse
            title: >-
              The SynthesisPanelSubsystem shall reuse its loaded engine and session across
              repeated Play calls while the model, its parameter values and the playback
              device are unchanged.
            justification: |
              Loading a model is the expensive step; replaying the same text must stay cheap.
            tests:
              - SynthesisPanelViewModel_Play_CalledTwiceWithUnchangedModelAndParameters_ReusesSameSessionWithoutReload

          - id: SpeechDemo-SynthesisPanel-ExternalChangeHandling
            title: >-
              The SynthesisPanelSubsystem shall refresh its offered models when a model with
              the synthesis role is installed in the model catalog.
            justification: |
              The panel shares the catalog with the model catalog panel. Without handling its
              changes a user would see a stale model list.
            tests:
              - SynthesisPanelViewModel_ModelInstalled_MatchingRole_TriggersRefresh

          - id: SpeechDemo-SynthesisPanel-ReferenceVoiceChangeHandling
            title: >-
              The SynthesisPanelSubsystem shall refresh its offered models while keeping the
              user's chosen voice when the reference voices change.
            justification: |
              A voice pack install or removal changes the voices on offer; the user must see the
              new voice list without losing the voice already chosen.
            tests:
              - SynthesisPanelViewModel_ReferenceVoicesChanged_RefreshesAndKeepsChosenVoice

          - id: SpeechDemo-SynthesisPanel-DeviceRefreshCoordination
            title: >-
              The SynthesisPanelSubsystem shall stop playback and release its playback device
              before the shared device list is refreshed.
            justification: |
              The panel shares the device list with the recognition panel. A refresh while
              audio is playing would otherwise hit a device that is still in use.
            tests:
              - SynthesisPanelViewModel_PreRefreshHook_WhilePlaying_StopsAndAwaitsExecutionTaskBeforeDeviceRefreshSucceeds
