---
# Software Subsystem Requirements for the SpeechDemo RecognitionPanelSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's speech-to-text panel,
# decomposing the system-level recognition requirements in docs/reqstream/speech-demo.yaml.
#
# Unit-level content is consolidated here: IRecognizerSessionFactory/RecognizerSessionFactory and
# RecognitionPanelViewModel form one seam-and-presenter pair whose behavior is only observable
# together, so per-unit requirement files would restate this content.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: RecognitionPanelSubsystem Requirements
        requirements:
          - id: SpeechDemo-Recognition-ModelSelection
            title: >-
              The RecognitionPanelSubsystem shall offer only the installed recognition models a
              user may choose to transcribe with, and shall preserve the current selection
              across a refresh where it is still installed.
            justification: |
              A model of the wrong role, or one not yet downloaded, cannot honestly transcribe
              audio; offering it would let a user start a session that can only fail. Preserving
              a still-installed selection across a refresh keeps the panel from resetting a
              choice the user already made.
            tests:
              - RecognitionPanelViewModel_Refresh_MixedCatalog_OffersOnlyInstalledRecognitionModels
              - RecognitionPanelViewModel_Refresh_ModelStillInstalled_PreservesSelection

          - id: SpeechDemo-Recognition-StartStopLifecycle
            title: >-
              The RecognitionPanelSubsystem shall start a streaming transcription session for the
              selected model through the selected capture device when Start is invoked, shall let
              a user stop it deterministically at any time - including two concurrent Stop
              invocations completing without racing to double-dispose - shall reuse the loaded
              recognizer engine across Start/Stop cycles rather than reloading it on every click
              while creating a fresh single-use session per Start, and shall invalidate the
              cached engine or session - stopping an active session first, even while actively
              listening, rather than leaving the panel stuck in a listening state it can no
              longer stop - whenever the selected model changes (invalidating the engine), the
              selected capture device changes (invalidating only the session), or a shared device
              refresh replaces the underlying capture device (invalidating only the session).
            justification: |
              Streaming speech-to-text is only useful as a start/stop lifecycle a user directly
              controls; this is the demonstrable proof that a host can drive the library's async
              engine/session contract from a UI thread with ordinary property-changed
              notification alone. Reloading the (expensive) engine on every click previously
              reloaded the model from scratch each turn, contradicting the library's own
              "construct once, reuse across many sessions" guidance for
              `ISpeechRecognizerEngine`; caching it instead makes repeated Start/Stop cycles
              cheap, while a fresh `IRecognitionSession` is still created per Start since a
              session is single-use. A model or device change can arrive mid-session (neither
              property is guarded at the model level, only disabled in the view), so
              invalidation must stop the session first or the panel would be left listening with
              no way to stop it. A device refresh can also replace the underlying capture device
              object without changing the selected name, so it must invalidate the cached session
              too even though no selection property actually changed; the cached engine is not
              bound to a device and is never invalidated on a device change alone.
            tests:
              - RecognitionPanelViewModel_Start_SuccessfulSession_EntersListeningState
              - RecognitionPanelViewModel_Stop_DuringListening_StopsWithoutDisposingSession
              - RecognitionPanelViewModel_Stop_NothingListening_IsSafeNoOp
              - RecognitionPanelViewModel_Stop_CalledTwiceConcurrently_BothCompleteWithoutThrowing
              - RecognitionPanelViewModel_StartStopStart_SameSelection_ReusesEngine
              - RecognitionPanelViewModel_DeviceRefresh_InvalidatesCachedSessionButNotEngine
              - RecognitionPanelViewModel_SelectedModelChanged_InvalidatesCachedEngine
              - RecognitionPanelViewModel_SelectedModelChanged_WhileListening_StopsAndInvalidatesEngine
              - RecognitionPanelViewModel_SelectedCaptureDeviceChanged_InvalidatesSessionButNotEngine
              - RecognitionPanelViewModel_SelectedCaptureDeviceChanged_WhileListening_StopsAndInvalidatesSession

          - id: SpeechDemo-Recognition-TranscriptSequencing
            title: >-
              The RecognitionPanelSubsystem shall replace the trailing provisional transcript
              line with each new partial result, and shall commit a final result to the ordered
              list of finished lines while clearing the trailing partial.
            justification: |
              A live captioning display must show the most recent provisional guess without
              accumulating every intermediate guess as noise, and must commit an utterance to a
              stable line the instant the recognizer considers it final - the exact sequencing a
              real captioning UI depends on.
            tests:
              - RecognitionPanelViewModel_ResultReceived_PartialThenFinal_UpdatesTranscriptInOrder
              - RecognitionPanelViewModel_BuildTranscriptText_FinalsAndPartial_RendersInOrder

          - id: SpeechDemo-Recognition-HonestUnavailableStates
            title: >-
              The RecognitionPanelSubsystem shall report an honest, explanatory outcome - rather
              than a crash or a silent no-op - when no recognition model is selected, no capture
              device is available, the loaded engine honestly reports itself unavailable, the
              session faults when actually started, or an active session itself transitions to
              a faulted state after Start completes, and shall release any engine or session it
              created for a failed attempt.
            justification: |
              A user evaluating the library on a machine with no installed model, no microphone,
              or an engine fault beyond the library's control must see why Start did nothing,
              matching the library's own "nothing throws at composition" guarantee carried
              through to the panel. A session can also fault asynchronously, after a successful
              Start, via `IRecognitionSession.StateChanged`; that must be reported with the same
              honesty as a failure discovered synchronously during Start.
            tests:
              - RecognitionPanelViewModel_Start_NoModelSelected_ReportsErrorState
              - RecognitionPanelViewModel_Start_NoCaptureDevice_ReportsErrorState
              - RecognitionPanelViewModel_Start_RecognizerUnavailable_ReportsErrorStateAndDisposes
              - RecognitionPanelViewModel_Start_RecognizerStartThrows_ReportsErrorStateAndDisposes
              - RecognitionPanelViewModel_StateChanged_SessionTransitionsToFaulted_ReportsErrorState

          - id: SpeechDemo-Recognition-HonestEmptyCatalogState
            title: >-
              The RecognitionPanelSubsystem shall explain, rather than silently show nothing,
              when no installed recognition model exists to choose from.
            justification: |
              Consistent with the honest-empty-state precedent set by the model catalog panel, an
              unexplained empty picker reads to a user as a broken application rather than an
              expected pre-download state.
            tests:
              - RecognitionPanelViewModel_Constructor_NoInstalledRecognitionModel_ReportsHonestEmptyState

          - id: SpeechDemo-Recognition-ResourceLifetime
            title: >-
              The RecognitionPanelSubsystem shall release an active session and the cached
              recognizer engine, unsubscribe from the session's StateChanged event, and
              unsubscribe from IModelCatalogService.ModelInstalled and the shared
              device-selection panel's pre-refresh hook when the panel is disposed, idempotently.
            justification: |
              A recognizer engine and its session own unmanaged inference resources and a live
              capture device; leaking either when the panel's host shuts down would starve the
              next session or leave the device open. The panel also holds a ModelInstalled
              subscription and a registered pre-refresh hook for its own lifetime, which must be
              released the same way or a disposed panel would keep refreshing itself in response
              to later installs or interfere with a shared device refresh. Idempotent disposal
              keeps a duplicate DisposeAsync call - however it is triggered by the shell - from
              faulting.
            tests:
              - RecognitionPanelViewModel_Dispose_ReleasesActiveSessionWithoutThrowing

          - id: SpeechDemo-Recognition-SessionSeam
            title: >-
              The RecognitionPanelSubsystem shall compose every speech recognizer engine it uses
              through an injectable seam over the library's recognizer factory, and that seam
              shall honestly report a model of the wrong role as unavailable rather than
              throwing.
            justification: |
              The library's recognizer factory requires an interface only the library's own
              assemblies can implement, so a demo-owned seam accepting the library's public model
              contract is what makes Start/Stop testable with no downloaded model and no native
              runtime, while still reporting a role mismatch the same honest way the library
              itself reports an uninstalled model.
            tests:
              - RecognitionPanelViewModel_Constructor_NullDependency_ThrowsArgumentNullException
              - RecognizerSessionFactory_Constructor_NullStore_ThrowsArgumentNullException
              - RecognizerSessionFactory_LoadAsync_NullModel_ThrowsArgumentNullException
              - RecognizerSessionFactory_LoadAsync_ModelNotRecognitionRole_ReturnsUnavailableEngine

          - id: SpeechDemo-Recognition-AutoRefreshOnInstall
            title: >-
              The RecognitionPanelSubsystem shall subscribe to
              IModelCatalogService.ModelInstalled at construction and automatically refresh its
              offered models when the event reports a recognition-role model, ignoring the event
              for any other role, and shall unsubscribe from it on disposal.
            justification: |
              A user who downloads a recognition model from the Model Catalog panel should see it
              become available on this panel immediately, without a manual Refresh click or an
              application restart. Filtering by role keeps an unrelated synthesis-model install
              from causing a spurious refresh, and unsubscribing on disposal prevents a disposed
              panel from reacting to a later install.
            tests:
              - RecognitionPanelViewModel_ModelInstalled_MatchingRole_TriggersRefresh
              - RecognitionPanelViewModel_ModelInstalled_NonMatchingRole_DoesNotTriggerRefresh
              - RecognitionPanelViewModel_Dispose_UnsubscribesFromModelInstalled_NoRefreshAfterDispose

          - id: SpeechDemo-Recognition-ModelSwitchGuard
            title: >-
              The RecognitionPanelSubsystem shall expose a CanChangeModel value that is true
              only when State is not Listening, and the view shall disable the model-selection
              control while it is false.
            justification: |
              Switching the selected recognition model while a streaming session is active would
              leave a running recognizer bound to a model no longer reflected in SelectedModel,
              silently desynchronizing the displayed selection from the model actually
              transcribing audio; disabling selection while Listening prevents that
              inconsistency.
            tests:
              - RecognitionPanelViewModel_CanChangeModel_TogglesAcrossStateTransitions
              - RecognitionPanelViewModel_CanChangeModel_ErrorState_IsTrue

          - id: SpeechDemo-Recognition-StopsBeforeDeviceRefresh
            title: >-
              The RecognitionPanelSubsystem shall register a pre-refresh hook with the shared
              device-selection panel at construction that stops an active listening session
              before a device refresh proceeds (a safe no-op while idle), and shall unregister it
              on disposal.
            justification: |
              The recognition panel shares a device-selection panel (and its underlying device
              factory) with the synthesis panel; clicking "Refresh devices" while this panel is
              actively listening has a real chance of the backend refusing the refresh because
              the capture device is in use. Registering the panel's own stop-and-invalidate path
              as a pre-refresh hook lets a shared refresh proceed deterministically instead of
              relying on the AudioDeviceInUseException fallback, and the hook must also be
              provably inert while idle so an unrelated Refresh click never tries to stop a
              session that was never created.
            tests:
              - RecognitionPanelViewModel_PreRefreshHook_WhileListening_StopsSessionBeforeDeviceRefreshSucceeds
              - RecognitionPanelViewModel_PreRefreshHook_WhileIdle_IsNoOpAndDeviceRefreshSucceeds
