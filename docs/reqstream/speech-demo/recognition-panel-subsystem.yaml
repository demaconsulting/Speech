---
# Software Subsystem Requirements for the SpeechDemo RecognitionPanelSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's speech-to-text panel that
# spans its units, decomposing the system-level recognition requirements in
# docs/reqstream/speech-demo.yaml. Unit-level requirements live in:
#
#   recognition-panel-subsystem/recognition-panel-view-model.yaml - RecognitionPanelViewModel
#   recognition-panel-subsystem/recognizer-session-factory.yaml   - RecognizerSessionFactory
#                                                                   (with IRecognizerSessionFactory)

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: RecognitionPanelSubsystem Requirements
        requirements:
          - id: SpeechDemo-Recognition-SessionSeam
            title: >-
              The RecognitionPanelSubsystem shall transcribe with an engine supplied by an
              injectable seam, so a session can start with no downloaded model and no native
              runtime.
            justification: |
              The library's recognizer factory requires an interface only the library's own
              assemblies can implement, so a demo-owned seam accepting the library's public model
              contract is what makes Start/Stop testable with no downloaded model and no native
              runtime.
            tests:
              - RecognitionPanelViewModel_Start_SuccessfulSession_EntersListeningState

          - id: SpeechDemo-Recognition-SessionSeamUnavailableEngine
            title: >-
              The RecognitionPanelSubsystem shall report an error state, rather than failing,
              when the seam returns an engine that is unavailable.
            justification: |
              An unavailable engine must be reported the same honest way the library itself
              reports an uninstalled model.
            tests:
              - RecognitionPanelViewModel_Start_RecognizerUnavailable_ReportsErrorStateAndDisposes

          - id: SpeechDemo-Recognition-StartStopLifecycle
            title: >-
              The RecognitionPanelSubsystem shall start a streaming transcription session for the
              selected model through the selected capture device when Start is invoked.
            justification: |
              Streaming speech-to-text is only useful as a start/stop lifecycle a user directly
              controls; starting is the demonstrable proof that a host can drive the library's
              async engine/session contract from a UI thread with ordinary property-changed
              notification alone.
            tests:
              - RecognitionPanelViewModel_Start_SuccessfulSession_EntersListeningState

          - id: SpeechDemo-Recognition-StopLifecycle
            title: >-
              The RecognitionPanelSubsystem shall stop the active streaming session and report
              that it was stopped when Stop is invoked.
            justification: |
              A user must be able to end a streaming session at any time and see that it ended.
            tests:
              - RecognitionPanelViewModel_Stop_DuringListening_StopsWithoutDisposingSession

          - id: SpeechDemo-Recognition-StopsBeforeDeviceRefresh
            title: >-
              The RecognitionPanelSubsystem shall stop an active listening session before a
              shared device refresh proceeds.
            justification: |
              The recognition panel shares a device-selection panel (and its underlying device
              factory) with the synthesis panel; clicking "Refresh devices" while this panel is
              actively listening has a real chance of the backend refusing the refresh because
              the capture device is in use. Stopping the session first lets a shared refresh
              proceed deterministically instead of relying on the AudioDeviceInUseException
              fallback.
            tests:
              - RecognitionPanelViewModel_PreRefreshHook_WhileListening_StopsSessionBeforeDeviceRefreshSucceeds

          - id: SpeechDemo-Recognition-IdleDeviceRefreshInert
            title: >-
              The RecognitionPanelSubsystem shall let a shared device refresh proceed unaffected,
              without creating a session, while it is not listening.
            justification: |
              An unrelated Refresh click must never try to stop a session that was never
              created, nor change the panel's state.
            tests:
              - RecognitionPanelViewModel_PreRefreshHook_WhileIdle_IsNoOpAndDeviceRefreshSucceeds
