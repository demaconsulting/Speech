---
# Software Subsystem Requirements for the SpeechDemo RecognitionPanelSubsystem
#
# These requirements describe the subsystem-level behavior of the demo's speech-to-text panel that
# spans its units, decomposing the system-level recognition requirements in
# docs/reqstream/speech-demo.yaml. Unit-level requirements live in:
#
#   recognition-panel-subsystem/recognition-panel-view-model.yaml - RecognitionPanelViewModel
#   recognition-panel-subsystem/recognizer-session-factory.yaml   - RecognizerSessionFactory
#                                                                   (with IRecognizerSessionFactory)

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: RecognitionPanelSubsystem Requirements
        requirements:
          - id: SpeechDemo-Recognition-SessionSeam
            title: >-
              The RecognitionPanelSubsystem shall operate deterministically, starting and stopping
              a transcription session and presenting its results, when no downloaded model and no
              native speech runtime is available.
            justification: |
              A user or evaluator on a machine with no downloaded model and no native runtime
              must still be able to exercise the Start/Stop lifecycle and see predictable
              outcomes; the same property makes the lifecycle repeatable under automated test.
            children:
              - SpeechDemo-Recognition-ModelSelection
              - SpeechDemo-Recognition-EngineLifetime
              - SpeechDemo-Recognition-FailedStartReleasesSession
              - SpeechDemo-Recognition-EngineReuse
              - SpeechDemo-Recognition-FailedAttemptReleasesResources
              - SpeechDemo-Recognition-SessionSeamWrongRole
              - SpeechDemo-Recognition-SessionSeamRecognitionModel
            tests:
              - RecognitionPanelViewModel_Start_SuccessfulSession_EntersListeningState

          - id: SpeechDemo-Recognition-SessionSeamUnavailableEngine
            title: >-
              The RecognitionPanelSubsystem shall report an error state, rather than failing,
              when the seam returns an engine that is unavailable.
            justification: |
              An unavailable engine must be reported the same honest way the library itself
              reports an uninstalled model.
            children:
              - SpeechDemo-Recognition-HonestUnavailableStates
              - SpeechDemo-Recognition-SessionStartFailureReported
              - SpeechDemo-Recognition-EngineBusyReported
              - SpeechDemo-Recognition-SessionFaultedReported
              - SpeechDemo-Recognition-ResultStreamFaultReported
            tests:
              - RecognitionPanelViewModel_Start_RecognizerUnavailable_ReportsErrorStateAndDisposes

          - id: SpeechDemo-Recognition-StartStopLifecycle
            title: >-
              The RecognitionPanelSubsystem shall start a streaming transcription session for the
              selected model through the selected capture device when Start is invoked.
            justification: |
              Streaming speech-to-text is only useful as a start/stop lifecycle a user directly
              controls; starting is the demonstrable proof that a host can drive the library's
              async engine/session contract from a UI thread with ordinary property-changed
              notification alone.
            children:
              - SpeechDemo-Recognition-AutoRefreshOnInstall
              - SpeechDemo-Recognition-ModelSelectionFallback
              - SpeechDemo-Recognition-ModelSwitchAllowedAfterError
              - SpeechDemo-Recognition-ModelSwitchAllowedAfterStop
              - SpeechDemo-Recognition-SessionSeamModelValidation
              - SpeechDemo-Recognition-AutoRefreshStopsAfterDispose
              - SpeechDemo-Recognition-ModelChangeInvalidatesEngine
              - SpeechDemo-Recognition-DeviceChangeInvalidatesSession
              - SpeechDemo-Recognition-SessionSeamArgumentValidation
            tests:
              - RecognitionPanelViewModel_Start_SuccessfulSession_EntersListeningState

          - id: SpeechDemo-Recognition-StopLifecycle
            title: >-
              The RecognitionPanelSubsystem shall stop the active streaming session and report
              that it was stopped when Stop is invoked.
            justification: |
              A user must be able to end a streaming session at any time and see that it ended.
            children:
              - SpeechDemo-Recognition-StopSession
              - SpeechDemo-Recognition-StopIdleSafe
              - SpeechDemo-Recognition-ConcurrentStopSafe
              - SpeechDemo-Recognition-LifecycleSerialized
            tests:
              - RecognitionPanelViewModel_Stop_DuringListening_StopsWithoutDisposingSession

          - id: SpeechDemo-Recognition-CaptureDebugOptIn
            title: >-
              The RecognitionPanelSubsystem shall start no capture-debug recording unless the
              capture-debug environment variable names a folder.
            justification: |
              The diagnostic writes microphone audio to disk, so it must be off by default.
            tests:
              - CaptureDebugRecorder_TryStart_EnvironmentVariableUnset_ReturnsNull

          - id: SpeechDemo-Recognition-CaptureDebugWavOutput
            title: >-
              The RecognitionPanelSubsystem shall write the captured audio at its native sample
              rate and channel count as a finalized, valid WAV file, even when no frame arrived.
            justification: |
              A diagnostic recording is only useful if it plays back exactly as captured.
            tests:
              - CaptureDebugRecorder_TryStart_RecordsFramesThenDisposed_WritesValidFinalizedWavFile
              - CaptureDebugRecorder_Dispose_NoFramesCaptured_StillWritesValidFinalizedWavFile
              - WavFileWriter_Dispose_AfterWritingSamples_WritesValidRiffWaveHeader
              - WavFileWriter_WriteSamples_NormalizedFloatSamples_RoundTripAsPcm16
              - WavFileWriter_WriteSamples_OutOfRangeSample_ClampsToBoundary

          - id: SpeechDemo-Recognition-CaptureDebugFailureContained
            title: >-
              The RecognitionPanelSubsystem shall continue listening unaffected, and stop
              recording, when writing the capture-debug audio fails.
            justification: |
              A temporary diagnostic must never be able to break the feature it observes, and a
              full or unwritable disk is an expected fault.
            tests:
              - CaptureDebugRecorder_FrameCaptured_WriteThrowsUnauthorized_StopsWritingAndFinalizesOnce

          - id: SpeechDemo-Recognition-CaptureDebugFinalizationFailureContained
            title: >-
              The RecognitionPanelSubsystem shall continue unaffected, reporting the failure to
              the console, when finalizing the capture-debug recording fails.
            justification: |
              Closing the recording can itself fail (for example while flushing or patching the
              header); that must not terminate the process or break listening.
            tests:
              - CaptureDebugRecorder_Dispose_WriterFinalizationThrows_IsContained

          - id: SpeechDemo-Recognition-CaptureDebugLateFrameDiscarded
            title: >-
              The RecognitionPanelSubsystem shall discard, without error, any captured audio frame
              that arrives after the capture-debug recording has been disposed.
            justification: |
              Stopping a session can race with the capture device delivering a last frame; the
              audio capture path must never receive an error from the diagnostic.
            tests:
              - CaptureDebugRecorder_FrameCallback_AfterDispose_IsDiscardedWithoutThrowing

          - id: SpeechDemo-Recognition-CaptureDebugDisposeIdempotent
            title: >-
              The RecognitionPanelSubsystem shall treat repeated disposal of a capture-debug
              recording as harmless.
            justification: |
              Stop, error handling, and shutdown can each release the recording; a duplicate
              release must not fault.
            tests:
              - CaptureDebugRecorder_Dispose_CalledTwice_DoesNotThrow
              - WavFileWriter_Dispose_CalledTwice_IsIdempotent

          - id: SpeechDemo-Recognition-CaptureDebugInvalidArgumentsRejected
            title: >-
              The RecognitionPanelSubsystem shall reject a capture-debug WAV output with an empty
              path or a non-positive sample rate or channel count.
            justification: |
              Such a file could never be a valid, playable WAV recording.
            tests:
              - WavFileWriter_Constructor_EmptyPath_ThrowsArgumentException
              - WavFileWriter_Constructor_NonPositiveSampleRate_ThrowsArgumentOutOfRangeException
              - WavFileWriter_Constructor_NonPositiveChannelCount_ThrowsArgumentOutOfRangeException
          - id: SpeechDemo-Recognition-StopsBeforeDeviceRefresh
            title: >-
              The RecognitionPanelSubsystem shall stop an active listening session before a
              shared device refresh proceeds.
            justification: |
              The recognition panel shares a device-selection panel (and its underlying device
              factory) with the synthesis panel; clicking "Refresh devices" while this panel is
              actively listening has a real chance of the backend refusing the refresh because
              the capture device is in use. Stopping the session first lets a shared refresh
              proceed deterministically instead of relying on the AudioDeviceInUseException
              fallback.
            children:
              - SpeechDemo-Recognition-ResourceLifetime
              - SpeechDemo-Recognition-ModelSwitchGuard
              - SpeechDemo-Recognition-DeviceChangeWhileListeningStopsFirst
              - SpeechDemo-Recognition-DeviceRefreshInvalidatesSession
            tests:
              - RecognitionPanelViewModel_PreRefreshHook_WhileListening_StopsSessionBeforeDeviceRefreshSucceeds

          - id: SpeechDemo-Recognition-IdleDeviceRefreshInert
            title: >-
              The RecognitionPanelSubsystem shall let a shared device refresh proceed unaffected,
              without creating a session, while it is not listening.
            justification: |
              An unrelated Refresh click must never try to stop a session that was never
              created, nor change the panel's state.
            tests:
              - RecognitionPanelViewModel_PreRefreshHook_WhileIdle_IsNoOpAndDeviceRefreshSucceeds

          - id: SpeechDemo-Recognition-SpeechToText-RecognitionPanelSubsystem
            title: >-
              The RecognitionPanelSubsystem shall let a user start a live streaming
              transcription session through the selected capture device using a chosen installed
              recognition model.
            justification: |
              Subsystem-level grouping of the RecognitionPanelSubsystem unit requirements that
              implement SpeechDemo-Recognition-SpeechToText.
            children:
              - SpeechDemo-Recognition-DisposeIdempotent
              - SpeechDemo-Recognition-PanelDependenciesRequired
              - SpeechDemo-Recognition-ModelSelectionPreserved
              - SpeechDemo-Recognition-AutoRefreshIgnoresOtherRoles
            tests:
              - RecognitionPanelViewModel_Dispose_ReleasesActiveSessionWithoutThrowing
              - RecognitionPanelViewModel_Constructor_NullDependency_ThrowsArgumentNullException
              - RecognitionPanelViewModel_Refresh_ModelStillInstalled_PreservesSelection
              - RecognitionPanelViewModel_ModelInstalled_NonMatchingRole_DoesNotTriggerRefresh

          - id: SpeechDemo-Recognition-PartialTranscript-RecognitionPanelSubsystem
            title: >-
              The RecognitionPanelSubsystem shall show each provisional transcript result as it
              streams, replacing the previous provisional text.
            justification: |
              Subsystem-level grouping of the RecognitionPanelSubsystem unit requirements that
              implement SpeechDemo-Recognition-PartialTranscript.
            children:
              - SpeechDemo-Recognition-TranscriptSequencing
            tests:
              - RecognitionPanelViewModel_ResultReceived_PartialThenFinal_UpdatesTranscriptInOrder

          - id: SpeechDemo-Recognition-FinalTranscript-RecognitionPanelSubsystem
            title: >-
              The RecognitionPanelSubsystem shall commit each final transcript result as a
              finished line and clear the provisional text.
            justification: |
              Subsystem-level grouping of the RecognitionPanelSubsystem unit requirements that
              implement SpeechDemo-Recognition-FinalTranscript.
            children:
              - SpeechDemo-Recognition-TranscriptFinalCommit
              - SpeechDemo-Recognition-TranscriptText
              - SpeechDemo-Recognition-TranscriptResetOnStart
            tests:
              - RecognitionPanelViewModel_ResultReceived_PartialThenFinal_UpdatesTranscriptInOrder
              - RecognitionPanelViewModel_BuildTranscriptText_FinalsAndPartial_RendersInOrder
              - RecognitionPanelViewModel_Start_SecondRun_ClearsPreviousTranscriptAndStatus

          - id: SpeechDemo-Recognition-UnavailableExplanation-RecognitionPanelSubsystem
            title: >-
              The RecognitionPanelSubsystem shall report an honest, explanatory outcome, rather
              than a crash, when no recognition model is installed.
            justification: |
              Subsystem-level grouping of the RecognitionPanelSubsystem unit requirements that
              implement SpeechDemo-Recognition-UnavailableExplanation.
            children:
              - SpeechDemo-Recognition-HonestEmptyCatalogState
              - SpeechDemo-Recognition-EmptyCatalogMessageClears
              - SpeechDemo-Recognition-NoModelSelectedReported
            tests:
              - RecognitionPanelViewModel_Constructor_NoInstalledRecognitionModel_ReportsHonestEmptyState
              - RecognitionPanelViewModel_Start_NoModelSelected_ReportsErrorState

          - id: SpeechDemo-Recognition-NoCaptureDeviceExplanation-RecognitionPanelSubsystem
            title: >-
              The RecognitionPanelSubsystem shall report an honest, explanatory outcome, rather
              than a crash, when no capture device is available and the user starts listening.
            justification: |
              Subsystem-level grouping of the RecognitionPanelSubsystem unit requirements that
              implement SpeechDemo-Recognition-NoCaptureDeviceExplanation.
            children:
              - SpeechDemo-Recognition-NoCaptureDeviceReported
            tests:
              - RecognitionPanelViewModel_Start_NoCaptureDevice_ReportsErrorState
