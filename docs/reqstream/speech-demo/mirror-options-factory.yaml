---
# Software Unit Requirements for the SpeechDemo MirrorOptionsFactory
#
# These requirements describe the design-level behavior of the MirrorOptionsFactory unit - the
# shared builder of a download mirror from raw strings - decomposing the system-level mirror
# redirection requirement in docs/reqstream/speech-demo.yaml. The factory is verified directly
# by MirrorOptionsFactoryTests; the AppLaunchOptions and ModelCatalogViewModel requirements
# record the caller-level behavior.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: MirrorOptionsFactory Requirements
        requirements:
          - id: SpeechDemo-MirrorOptions-Validation
            title: >-
              The MirrorOptionsFactory unit shall build a download mirror from raw URL,
              credential and token strings.
            justification: |
              Launch-time arguments and the in-app mirror settings must build the same mirror
              from the same raw values.
            tests:
              - MirrorOptionsFactory_Create_UrlWithBasicCredentials_ReturnsConfiguredMirror
              - MirrorOptionsFactory_Create_UrlWithBearerToken_ReturnsConfiguredMirror
              - MirrorOptionsFactory_Create_UrlOnly_ReturnsUnauthenticatedMirror

          - id: SpeechDemo-MirrorOptions-BlankUrlNoMirror
            title: >-
              The MirrorOptionsFactory unit shall return no mirror for a blank URL.
            justification: |
              Without a mirror every model downloads from its own declared public location.
            tests:
              - MirrorOptionsFactory_Create_BlankUrlNoCredentials_ReturnsNull

          - id: SpeechDemo-MirrorOptions-CredentialWithoutUrl
            title: >-
              The MirrorOptionsFactory unit shall reject a credential or token supplied
              without a URL.
            justification: |
              A credential with nowhere to apply almost always means a missing or misspelled
              URL, so it is rejected rather than silently ignored.
            tests:
              - MirrorOptionsFactory_Create_CredentialWithoutUrl_ThrowsWithoutEchoingSecret
              - ModelCatalogViewModel_ApplyMirrorAsync_CredentialsWithoutUrl_ReportsErrorWithoutCallingService

          - id: SpeechDemo-MirrorOptions-HalfCredentialPair
            title: >-
              The MirrorOptionsFactory unit shall reject a username supplied without a
              password.
            justification: |
              Half of a Basic-authentication pair can never authenticate, so the mismatch is
              reported instead of sending a request that is certain to fail.
            tests:
              - MirrorOptionsFactory_Create_UserWithoutPassword_ThrowsArgumentException

          - id: SpeechDemo-MirrorOptions-PasswordWithoutUser
            title: >-
              The MirrorOptionsFactory unit shall reject a password supplied without a
              username.
            justification: |
              A password with no username can never authenticate, so the mismatch is reported
              instead of the password being silently dropped.
            tests:
              - MirrorOptionsFactory_Create_PasswordWithoutUser_ThrowsArgumentException

          - id: SpeechDemo-MirrorOptions-InsecureCredentialRejected
            title: >-
              The MirrorOptionsFactory unit shall reject a credential or token configured for a
              plain-HTTP mirror on a non-loopback host.
            justification: |
              A credential sent over unencrypted HTTP to a remote host is exposed to anyone on
              the network path, so the configuration is refused.
            tests:
              - MirrorOptionsFactory_Create_CredentialOverPlainHttpToRemoteHost_ThrowsArgumentException

          - id: SpeechDemo-MirrorOptions-InvalidUrl
            title: >-
              The MirrorOptionsFactory unit shall reject a URL that is not a valid absolute
              URL.
            justification: |
              Launch-time arguments and the in-app mirror settings must validate identically;
              a malformed URL is reported before any download is attempted.
            tests:
              - MirrorOptionsFactory_Create_InvalidUrl_ThrowsWithoutEchoingValue
              - ModelCatalogViewModel_ApplyMirrorAsync_InvalidUrl_ReportsErrorWithoutCallingService
