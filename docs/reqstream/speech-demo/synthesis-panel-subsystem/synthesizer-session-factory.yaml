---
# Software Unit Requirements for the SpeechDemo SynthesizerSessionFactory
#
# These requirements describe the design-level behavior of the ISynthesizerSessionFactory /
# SynthesizerSessionFactory unit - the demo-owned synthesizer-engine composition seam over the
# library's SpeechModelStore and SpeechSynthesizerFactory - decomposing the parent
# SynthesisPanelSubsystem requirements. ISynthesizerSessionFactory and SynthesizerSessionFactory
# are treated as one unit because the interface has no independently observable behavior of its
# own; every test exercises it through SynthesizerSessionFactory, its sole implementation.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: SynthesisPanelSubsystem Requirements
        sections:
          - title: SynthesizerSessionFactory Requirements
            requirements:
              - id: SpeechDemo-Synthesis-SessionSeam
                title: >-
                  The SynthesizerSessionFactory shall report a model that does not implement the
                  synthesis role as an unavailable engine rather than throwing.
                justification: |
                  A user can choose an installed model of the wrong role; reporting the mismatch
                  as an unavailable engine, the same honest way the library reports an
                  uninstalled model, keeps the panel's unavailable-state handling uniform.
                tests:
                  - SynthesizerSessionFactory_LoadAsync_ModelNotSynthesisRole_ReturnsUnavailableEngine

              - id: SpeechDemo-Synthesis-SessionSeamParameterBag
                title: >-
                  The SynthesizerSessionFactory shall report a wrong-role model as an unavailable
                  engine even when a parameter value bag is supplied.
                justification: |
                  The panel always supplies the settings panel's value bag; the role check must
                  not depend on it, or a wrong-role model with settings would fail differently
                  from one without.
                tests:
                  - SynthesizerSessionFactory_LoadAsync_ModelNotSynthesisRoleWithParameterValues_ReturnsUnavailableEngine

              - id: SpeechDemo-Synthesis-SessionSeamArgumentValidation
                title: >-
                  The SynthesizerSessionFactory shall reject a missing model store or a missing
                  model with an argument-null error.
                justification: |
                  A missing store or model is a composition mistake that must surface at the
                  call site instead of as a later, unrelated failure.
                tests:
                  - SynthesizerSessionFactory_Constructor_NullStore_ThrowsArgumentNullException
                  - SynthesizerSessionFactory_LoadAsync_NullModel_ThrowsArgumentNullException
