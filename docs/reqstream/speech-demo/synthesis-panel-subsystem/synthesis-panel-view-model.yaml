---
# Software Unit Requirements for the SpeechDemo SynthesisPanelViewModel
#
# These requirements describe the design-level behavior of the SynthesisPanelViewModel unit -
# the text-to-speech panel's presentation state, model selection, embedded settings, audio-tag
# hints, and Play/Stop lifecycle - decomposing the parent SynthesisPanelSubsystem requirements.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: SynthesisPanelSubsystem Requirements
        sections:
          - title: SynthesisPanelViewModel Requirements
            requirements:
              - id: SpeechDemo-Synthesis-DependencyValidation
                title: >-
                  The SynthesisPanelViewModel shall reject a missing collaborator when it is
                  constructed.
                justification: |
                  Every library call the panel makes goes through an injected collaborator, so a
                  missing one is a composition mistake that must surface immediately rather than
                  as a failure on the first Play.
                tests:
                  - SynthesisPanelViewModel_Constructor_NullDependency_ThrowsArgumentNullException

              - id: SpeechDemo-Synthesis-ModelSelection
                title: >-
                  The SynthesisPanelViewModel shall offer only the installed synthesis models a
                  user may choose to speak text with.
                justification: |
                  A model of the wrong role, or one not yet downloaded, cannot honestly speak
                  text; offering it would let a user start a session that can only fail.
                tests:
                  - SynthesisPanelViewModel_Refresh_MixedCatalog_OffersOnlyInstalledSynthesisModels

              - id: SpeechDemo-Synthesis-SelectionPreservation
                title: >-
                  The SynthesisPanelViewModel shall keep the user's selected model across a
                  refresh when that model is still installed.
                justification: |
                  Resetting a choice the user already made every time the model list refreshes
                  would force them to select it again.
                tests:
                  - SynthesisPanelViewModel_Refresh_SelectedModelStillInstalled_PreservesSelection

              - id: SpeechDemo-Synthesis-EmbeddedSettings
                title: >-
                  The SynthesisPanelViewModel shall present the selected model's tunable
                  parameters through the embedded model-settings panel, replacing them whenever
                  the selection changes.
                justification: |
                  A voice's tunable parameters are only meaningful once a model is chosen;
                  embedding the generic settings panel is what lets this panel reuse the settings
                  subsystem instead of duplicating its rendering logic.
                tests:
                  - SynthesisPanelViewModel_SelectedModel_Changed_UpdatesEmbeddedSettings

              - id: SpeechDemo-Synthesis-AudioTagHints
                title: >-
                  The SynthesisPanelViewModel shall show example Natural Language Audio Tags
                  drawn from the library's closed, published vocabulary as inline help alongside
                  the text input.
                justification: |
                  Drawing the examples from the library's own tag catalog, rather than a
                  hand-maintained demo list, keeps the hints in sync with the vocabulary the
                  library actually recognizes.
                tests:
                  - SynthesisPanelViewModel_ExampleTagHints_ContainsExpectedTags

              - id: SpeechDemo-Synthesis-PlayLifecycle
                title: >-
                  The SynthesisPanelViewModel shall speak the entered text through the selected
                  playback device when Play is invoked.
                justification: |
                  Speaking the exact text the user entered, on the device the user chose, is the
                  panel's core purpose and the demonstration that a host can drive the library's
                  asynchronous synthesis contract from a UI thread.
                tests:
                  - SynthesisPanelViewModel_Play_EnteredText_SpeaksTextThroughSelectedPlaybackDevice

              - id: SpeechDemo-Synthesis-LifecycleReporting
                title: >-
                  The SynthesisPanelViewModel shall report synthesizing, then playing back, then
                  idle as a successful Play progresses.
                justification: |
                  A play button with no feedback leaves a user unsure whether anything is
                  happening.
                tests:
                  - SynthesisPanelViewModel_Play_SuccessfulSession_TransitionsThroughLifecycleToIdle

              - id: SpeechDemo-Synthesis-SessionStateMapping
                title: >-
                  The SynthesisPanelViewModel shall show a stopping session as playing back, a
                  newly created session as idle, and a faulted session as an error state with the
                  panel's session-fault message.
                justification: |
                  The displayed state must not drift from what the session is actually doing, so
                  a user is never told the panel is idle while audio is still stopping, or that
                  it is healthy after the session has faulted.
                tests:
                  - SynthesisPanelViewModel_SessionStateChanged_StoppingCreatedFaulted_MapsToPlayingIdleError

              - id: SpeechDemo-Synthesis-PlayWhileBusyRefused
                title: >-
                  The SynthesisPanelViewModel shall refuse to start another Play while one is
                  synthesizing or playing.
                justification: |
                  A second concurrent Play would contend for the same session and playback device;
                  refusing it keeps one utterance in flight at a time.
                tests:
                  - SynthesisPanelViewModel_Play_WhilePlaying_IsRefused

              - id: SpeechDemo-Synthesis-StopControl
                title: >-
                  The SynthesisPanelViewModel shall let a user stop an in-flight Play
                  deterministically.
                justification: |
                  Synthesized speech can run for an arbitrary duration; a user must be able to
                  interrupt it rather than wait for it to finish or close the application.
                tests:
                  - SynthesisPanelViewModel_Stop_DuringPlayback_CancelsSessionAndReportsStopped

              - id: SpeechDemo-Synthesis-EngineSessionReuse
                title: >-
                  The SynthesisPanelViewModel shall load a synthesizer engine once and reuse it
                  across repeated Play calls while the selected model and its parameter values
                  are unchanged.
                justification: |
                  Loading a model is the expensive step, and the library's guidance for its
                  synthesizer engine is to construct once and reuse across many sessions.
                  Replaying the same text with the same voice is the common case and must stay
                  cheap.
                tests:
                  - SynthesisPanelViewModel_Play_CalledTwiceWithUnchangedModelAndParameters_ReusesSameSessionWithoutReload

              - id: SpeechDemo-Synthesis-SessionReuse
                title: >-
                  The SynthesisPanelViewModel shall create a synthesizer session once and reuse
                  it across repeated Play calls while the selected model, its parameter values
                  and the playback device are unchanged.
                justification: |
                  The library's guidance for its synthesizer session is to construct once and
                  reuse it, so replaying the same text with the same voice stays cheap.
                tests:
                  - SynthesisPanelViewModel_Play_CalledTwiceWithUnchangedModelAndParameters_ReusesSameSessionWithoutReload

              - id: SpeechDemo-Synthesis-EngineReloadOnChange
                title: >-
                  The SynthesisPanelViewModel shall reload the synthesizer engine and recreate
                  the session on the next Play after the selected model's parameter values
                  change.
                justification: |
                  An engine is composed with the parameter values in effect when it was loaded;
                  reusing it after a change would speak with a stale voice.
                tests:
                  - SynthesisPanelViewModel_Play_ParameterValueChanged_ReloadsEngineAndRecreatesSession

              - id: SpeechDemo-Synthesis-EngineReloadOnModelChange
                title: >-
                  The SynthesisPanelViewModel shall reload the synthesizer engine on the next
                  Play after the selected model is replaced by a different model instance.
                justification: |
                  A catalog re-read yields new model instances; an engine loaded from the
                  previous instance must not be reused for the new one.
                tests:
                  - SynthesisPanelViewModel_Play_ModelInstanceChanged_ReloadsEngine

              - id: SpeechDemo-Synthesis-SessionRecreateOnDeviceChange
                title: >-
                  The SynthesisPanelViewModel shall recreate only the session, keeping the
                  loaded engine, on the next Play after the playback device changes.
                justification: |
                  A session is bound to one playback device while the engine is independent of
                  it, so a device change must not pay for a model reload.
                tests:
                  - SynthesisPanelViewModel_Play_PlaybackDeviceChanged_RecreatesSessionButNotEngine

              - id: SpeechDemo-Synthesis-NoModelSelectedState
                title: >-
                  The SynthesisPanelViewModel shall report an explanatory error state, rather
                  than a crash or a silent no-op, when Play is invoked with no model selected.
                justification: |
                  A user with no installed voice must see why Play did nothing.
                tests:
                  - SynthesisPanelViewModel_Play_NoModelSelected_ReportsErrorState

              - id: SpeechDemo-Synthesis-NoPlaybackDeviceState
                title: >-
                  The SynthesisPanelViewModel shall report an explanatory error state, rather
                  than a crash or a silent no-op, when Play is invoked with no playback device
                  available.
                justification: |
                  A user with no speaker must see why Play did nothing.
                tests:
                  - SynthesisPanelViewModel_Play_NoPlaybackDevice_ReportsErrorState

              - id: SpeechDemo-Synthesis-HonestUnavailableStates
                title: >-
                  The SynthesisPanelViewModel shall report an explanatory error state, rather
                  than a crash or a silent no-op, when the synthesizer engine or session reports
                  itself unavailable.
                justification: |
                  An engine fault beyond the library's control must be visible to the user.
                tests:
                  - SynthesisPanelViewModel_Play_SynthesizerUnavailable_ReportsErrorStateAndDisposes
                  - SynthesisPanelViewModel_Play_UnavailableSession_ReportsErrorStateAndDisposesSession
                  - SynthesisPanelViewModel_Play_SpeakThrowsSynthesizerUnavailable_ReportsErrorStateWithMessage

              - id: SpeechDemo-Synthesis-UnavailableEngineReleased
                title: >-
                  The SynthesisPanelViewModel shall dispose a synthesizer engine that reports
                  itself unavailable.
                justification: |
                  A failed attempt must not leak the unusable engine and the model it holds.
                tests:
                  - SynthesisPanelViewModel_Play_SynthesizerUnavailable_ReportsErrorStateAndDisposes

              - id: SpeechDemo-Synthesis-UnavailableSessionReleased
                title: >-
                  The SynthesisPanelViewModel shall dispose a synthesis session that reports
                  itself unavailable, without speaking through it.
                justification: |
                  A failed attempt must not leak the unusable session and the playback device it
                  holds.
                tests:
                  - SynthesisPanelViewModel_Play_UnavailableSession_ReportsErrorStateAndDisposesSession

              - id: SpeechDemo-Synthesis-EngineBusyState
                title: >-
                  The SynthesisPanelViewModel shall report the engine's own explanation as an
                  error state when the engine is busy and cannot create a session.
                justification: |
                  A busy engine is an expected condition the user can act on, not a defect that
                  should surface as an unhandled exception.
                tests:
                  - SynthesisPanelViewModel_Play_EngineBusy_ReportsErrorStateWithEngineMessage

              - id: SpeechDemo-Synthesis-SessionFaultRecovery
                title: >-
                  The SynthesisPanelViewModel shall release a faulted session and speak
                  through a fresh session on the next Play.
                justification: |
                  A faulted session is terminal, so the user can only recover if the panel
                  discards it rather than reusing a session known to be dead.
                tests:
                  - SynthesisPanelViewModel_Play_SessionFaulted_ReportsErrorReleasesSessionAndNextPlayRecovers

              - id: SpeechDemo-Synthesis-SessionFaultReported
                title: >-
                  The SynthesisPanelViewModel shall report a session that faults while speaking
                  as an error state carrying the fault message.
                justification: |
                  A session fault must be explained to the user rather than thrown to the UI.
                tests:
                  - SynthesisPanelViewModel_Play_SessionFaulted_ReportsErrorReleasesSessionAndNextPlayRecovers

              - id: SpeechDemo-Synthesis-SetupFaultReported
                title: >-
                  The SynthesisPanelViewModel shall report an unexpected fault while loading the
                  engine or creating the session as an error state carrying the fault message,
                  rather than letting it escape the Play command.
                justification: |
                  Seam faults such as an invalid parameter value must be explained to the user
                  and must not crash the demo.
                tests:
                  - SynthesisPanelViewModel_Play_SetupFaults_ReportsErrorStateWithMessage

              - id: SpeechDemo-Synthesis-SetupCanceledReported
                title: >-
                  The SynthesisPanelViewModel shall report a Play canceled while loading the
                  engine or creating the session as stopped and return to idle.
                justification: |
                  Stopping during a long model load is a normal user action, not a fault.
                tests:
                  - SynthesisPanelViewModel_Play_SetupCanceled_ReportsStoppedAndReturnsToIdle

              - id: SpeechDemo-Synthesis-SpeakFaultReleasesSession
                title: >-
                  The SynthesisPanelViewModel shall report an unexpected fault while speaking as
                  an error state and release the session, whose state is unknown.
                justification: |
                  Reusing a session in an unknown state could repeat the fault.
                tests:
                  - SynthesisPanelViewModel_Play_SpeakThrowsUnexpected_ReportsErrorAndReleasesSession

              - id: SpeechDemo-Synthesis-StaleSessionEventIgnored
                title: >-
                  The SynthesisPanelViewModel shall ignore a state change reported by any session
                  other than its current one.
                justification: |
                  An event queued before its session was released must not overwrite the state
                  of the panel afterwards.
                tests:
                  - SynthesisPanelViewModel_SessionStateChanged_ForeignSender_IsIgnored

              - id: SpeechDemo-Synthesis-HonestEmptyCatalogState
                title: >-
                  The SynthesisPanelViewModel shall report an empty catalog as having no models to
                  choose from (nothing offered or selected, and Play unavailable), with a message
                  available that explains how to install one, rather than silently showing
                  nothing.
                justification: |
                  Consistent with the honest-empty-state precedent set by the model catalog
                  panel, an unexplained empty picker reads to a user as a broken application
                  rather than an expected pre-download state. The view renders the supplied
                  `NoModelsMessage` when `HasModels` is false; rendering is not itself under
                  automated UI test.
                tests:
                  - SynthesisPanelViewModel_Constructor_NoInstalledSynthesisModel_ReportsHonestEmptyState

              - id: SpeechDemo-Synthesis-RefreshWhilePlayingUndisturbed
                title: >-
                  The SynthesisPanelViewModel shall leave an in-flight Play, its session and the
                  selected model undisturbed when the model list is refreshed.
                justification: |
                  A voice-pack change or an install can refresh the list during playback; the
                  refresh must not stop or dispose the running session.
                tests:
                  - SynthesisPanelViewModel_Refresh_WhilePlaying_DoesNotDisturbPlayAndSettlesIdle

              - id: SpeechDemo-Synthesis-AutoRefreshOnInstall
                title: >-
                  The SynthesisPanelViewModel shall refresh its offered models automatically when
                  a synthesis model is installed from the model catalog.
                justification: |
                  A user who downloads a synthesis model from the Model Catalog panel should see
                  it become available on this panel immediately, without a manual refresh or an
                  application restart.
                tests:
                  - SynthesisPanelViewModel_ModelInstalled_MatchingRole_TriggersRefresh

              - id: SpeechDemo-Synthesis-AutoRefreshRoleFilter
                title: >-
                  The SynthesisPanelViewModel shall not refresh its offered models when the model
                  installed is not a synthesis model.
                justification: |
                  An unrelated recognition-model install must not cause a spurious refresh.
                tests:
                  - SynthesisPanelViewModel_ModelInstalled_NonMatchingRole_DoesNotTriggerRefresh

              - id: SpeechDemo-Synthesis-VoiceSelectionForwarding
                title: >-
                  The SynthesisPanelViewModel shall synthesize with the voice and other parameter
                  values chosen in the embedded settings panel.
                justification: |
                  A voice selected through the panel's settings controls must genuinely change
                  what is synthesized; the chosen values reach the library's engine composition,
                  which resolves them against the model's own per-voice knowledge.
                tests:
                  - SynthesisPanelViewModel_Play_ModelDeclaresChoiceParameter_ForwardsValueBagToSessionFactory

              - id: SpeechDemo-Synthesis-ResourceLifetime
                title: >-
                  The SynthesisPanelViewModel shall release its cached session when it is
                  disposed.
                justification: |
                  The panel caches a session across Play calls; leaking it at shutdown would
                  keep an open playback device alive.
                tests:
                  - SynthesisPanelViewModel_DisposeAsync_AfterPlay_ReleasesSessionAndEngineOnce

              - id: SpeechDemo-Synthesis-EngineLifetime
                title: >-
                  The SynthesisPanelViewModel shall release its cached engine when it is
                  disposed.
                justification: |
                  The panel caches an engine across Play calls; leaking it at shutdown would
                  keep a loaded model alive.
                tests:
                  - SynthesisPanelViewModel_DisposeAsync_AfterPlay_ReleasesSessionAndEngineOnce

              - id: SpeechDemo-Synthesis-DisposeIdempotent
                title: >-
                  The SynthesisPanelViewModel shall tolerate being disposed more than once
                  without faulting or releasing its session and engine a second time.
                justification: |
                  A duplicate DisposeAsync call, however the shell triggers it, must not fault or
                  double-release the cached session and engine.
                tests:
                  - SynthesisPanelViewModel_DisposeAsync_NoActiveSession_IsSafeAndIdempotent
                  - SynthesisPanelViewModel_DisposeAsync_AfterPlay_ReleasesSessionAndEngineOnce

              - id: SpeechDemo-Synthesis-DisposeStopsPlayback
                title: >-
                  The SynthesisPanelViewModel shall stop an in-flight Play and wait for it to
                  finish when it is disposed.
                justification: |
                  Releasing the session and engine while speech is still running would pull them
                  out from under the in-flight Play.
                tests:
                  - SynthesisPanelViewModel_DisposeAsync_WhilePlaying_StopsPlayAndReleasesSessionAndEngine

              - id: SpeechDemo-Synthesis-DisposeUnsubscribes
                title: >-
                  The SynthesisPanelViewModel shall stop refreshing in response to model installs
                  once it is disposed.
                justification: |
                  A disposed panel must not keep reacting to later catalog events.
                tests:
                  - SynthesisPanelViewModel_DisposeAsync_UnsubscribesFromModelInstalled_NoRefreshAfterDispose

              - id: SpeechDemo-Synthesis-ModelSwitchGuard
                title: >-
                  The SynthesisPanelViewModel shall not allow the selected model and its voice
                  settings to be changed while synthesizing or playing back, and shall allow
                  the change again once idle.
                justification: |
                  Switching the selected synthesis model or its voice/speaker parameters while
                  synthesis is in flight or audio is playing would make the displayed
                  selection differ from what is actually being spoken.
                tests:
                  - SynthesisPanelViewModel_Play_SuccessfulSession_CanChangeModelTogglesAcrossLifecycle

              - id: SpeechDemo-Synthesis-ModelSwitchAllowedAfterError
                title: >-
                  The SynthesisPanelViewModel shall allow the selected model and its voice
                  settings to be changed while in an error state.
                justification: |
                  A user must be able to pick a different model after a failed Play.
                tests:
                  - SynthesisPanelViewModel_CanChangeModel_ErrorState_IsTrue

              - id: SpeechDemo-Synthesis-StopsBeforeDeviceRefresh
                title: >-
                  The SynthesisPanelViewModel shall stop an in-flight Play and wait for its
                  playback device to be released before a shared device refresh proceeds.
                justification: |
                  This panel's session stop only requests cancellation; the playback device is
                  not closed until the in-flight Play itself settles. Waiting for that makes a
                  shared device refresh deterministic.
                tests:
                  - SynthesisPanelViewModel_PreRefreshHook_WhilePlaying_StopsAndAwaitsExecutionTaskBeforeDeviceRefreshSucceeds

              - id: SpeechDemo-Synthesis-IdleDeviceRefreshInert
                title: >-
                  The SynthesisPanelViewModel shall let a shared device refresh proceed
                  unaffected while no Play is in flight.
                justification: |
                  An unrelated refresh must never wait on a Play that was never started.
                tests:
                  - SynthesisPanelViewModel_PreRefreshHook_WhileIdle_IsNoOpAndDeviceRefreshSucceeds

              - id: SpeechDemo-Voices-SynthesisRefresh
                title: >-
                  The SynthesisPanelViewModel shall re-read the catalog when the reference voices
                  change.
                justification: |
                  A voice pack install or removal rebuilds the model, so the panel must adopt the
                  new voice list immediately.
                tests:
                  - SynthesisPanelViewModel_ReferenceVoicesChanged_RefreshesAndKeepsChosenVoice

              - id: SpeechDemo-Voices-SynthesisVoiceChoiceKept
                title: >-
                  The SynthesisPanelViewModel shall keep the user's chosen voice across a
                  reference voices change where that voice is still available.
                justification: |
                  A voice pack install or removal must not make the user lose the voice they had
                  chosen.
                tests:
                  - SynthesisPanelViewModel_ReferenceVoicesChanged_RefreshesAndKeepsChosenVoice

              - id: SpeechDemo-Voices-SynthesisRefreshAfterDispose
                title: >-
                  The SynthesisPanelViewModel shall stop re-reading the catalog in response to
                  reference voice changes once it is disposed.
                justification: |
                  A disposed panel must not keep reacting to catalog events.
                tests:
                  - SynthesisPanelViewModel_DisposeAsync_UnsubscribesFromReferenceVoicesChanged

              - id: SpeechDemo-Voices-ConsentAndAttribution
                title: >-
                  The SynthesisPanelViewModel shall show the voice-cloning consent note and the
                  license attribution of every installed voice pack when the Chatterbox Turbo
                  model is selected.
                justification: |
                  Cloning a voice needs the speaker's consent and the pack's license requires
                  attribution, so both must be visible where the voice is chosen.
                tests:
                  - SynthesisPanelViewModel_VoiceNotice_ChatterboxShowsConsentAndAttribution_OthersShowNothing

              - id: SpeechDemo-Voices-NoNoticeForOtherModels
                title: >-
                  The SynthesisPanelViewModel shall show no voice notice when a model other than
                  Chatterbox Turbo is selected.
                justification: |
                  Other models have no reference voices and must not show a misleading note.
                tests:
                  - SynthesisPanelViewModel_VoiceNotice_OtherModel_ShowsNothing
