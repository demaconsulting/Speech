---
# Software Unit Requirements for the SpeechDemo ModelCatalogViewModel
#
# These requirements describe the behavior of the ModelCatalogViewModel unit - the catalog
# panel's presentation state, refresh, download orchestration, mirror settings and reference
# voice pack section - decomposing the parent ModelCatalogSubsystem requirements.
#
# The requirements are grouped by concern, one criterion each:
#   - Model rows and refresh (Models-PanelSeamRequired, Models-Enumeration, -Refresh, -EmptyCatalogExplanation)
#   - Downloading (Models-DownloadProgress, -DownloadOutcomes, -DownloadRetry, -DownloadGuard)
#   - Mirror settings (Models-MirrorSettingsUi, -MirrorSettingsPrePopulation,
#     -MirrorSettingsBlankRevert, -MirrorSettingsInvalidReported,
#     -MirrorSettingsRejectedReported, -MirrorBlockedDuringDownload)
#   - Voice pack section (Voices-PackPanel, -PackSectionHidden, -PackInstalledEmotionsShown,
#     -PackInstall, -PackEmotionChoiceForwarded, -PackInstallFailureReported,
#     -PackInstallRollbackKeepsPack, -PackInstallStateReadFallback, -PackRemove,
#     -PackRemoveFaultReported, -PackRemoveStoreErrorReported, -PackBlockedDuringDownload)
# Every test below is a ModelCatalogViewModelTests test.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelCatalogSubsystem Requirements
        sections:
          - title: ModelCatalogViewModel Requirements
            requirements:
              - id: SpeechDemo-Models-PanelSeamRequired
                title: >-
                  The ModelCatalogSubsystem shall reject a catalog panel created with no catalog
                  service.
                justification: |
                  The panel is driven entirely by its catalog service; failing at creation makes
                  a half-composed panel an immediate, diagnosable programming error.
                tests:
                  - ModelCatalogViewModel_Constructor_NullService_ThrowsArgumentNullException

              - id: SpeechDemo-Models-Enumeration
                title: >-
                  The ModelCatalogSubsystem shall show one row per model the library reports and
                  shall preselect the first row.
                justification: |
                  The panel is a direct rendering of the library's catalog: one row per known
                  model, with nothing added and nothing hidden. Preselecting the first row makes
                  the panel immediately usable without configuration.
                tests:
                  - ModelCatalogViewModel_Constructor_PopulatedCatalog_BuildsOneRowPerModel
                  - ModelCatalogViewModel_Constructor_PopulatedCatalog_SelectsFirstModel

              - id: SpeechDemo-Models-Refresh
                title: >-
                  The ModelCatalogSubsystem shall re-read the catalog on demand, keeping the
                  current selection when that model is still reported and dropping the row when
                  it is not.
                justification: |
                  The library's catalog is the single source of truth for both membership and
                  state, so a refresh must adopt it wholesale. Keeping a row the library no
                  longer reports would let the panel offer a model that cannot be downloaded.
                tests:
                  - ModelCatalogViewModel_Refresh_StateChanged_RebuildsRowsAndKeepsSelection
                  - ModelCatalogViewModel_Refresh_ModelNoLongerKnown_DropsRowAndFallsBack
                  - ModelCatalogViewModel_RefreshCommand_Executed_ReReadsCatalog

              - id: SpeechDemo-Models-DownloadProgress
                title: >-
                  The ModelCatalogSubsystem shall show a model as downloading while its download
                  runs, reflect reported progress on that model's row, and mark it installed on
                  success.
                justification: |
                  Model downloads are large enough that an application with no progress feedback
                  looks hung. Showing progress on the row being downloaded also proves the
                  library's progress contract is usable from a host's UI thread.
                tests:
                  - ModelCatalogViewModel_DownloadAsync_ProgressReported_UpdatesRowProgress
                  - ModelCatalogViewModel_DownloadAsync_Installed_MarksModelDownloaded

              - id: SpeechDemo-Models-DownloadOutcomes
                title: >-
                  The ModelCatalogSubsystem shall report a checksum mismatch, a transport
                  failure, an unexpected fault, and a cancellation as explained row states
                  rather than as an application error.
                justification: |
                  The library treats a failed download as an ordinary outcome that never
                  disturbs an existing install, so the demo must not escalate one into a crash.
                  Cancellation is reported as simply not downloaded, because the library
                  guarantees nothing was installed.
                tests:
                  - ModelCatalogViewModel_DownloadAsync_ChecksumMismatch_ReportsExplainedFailure
                  - ModelCatalogViewModel_DownloadAsync_Failed_ReportsLibraryErrorMessage
                  - ModelCatalogViewModel_DownloadAsync_SeamThrows_ContainsFaultInRow
                  - ModelCatalogViewModel_DownloadAsync_Canceled_ReportsNotDownloaded

              - id: SpeechDemo-Models-DownloadRetry
                title: >-
                  The ModelCatalogSubsystem shall allow a failed download to be retried and shall
                  clear the previous failure explanation when the retry starts.
                justification: |
                  Most download failures are transient. Leaving a stale failure message beside a
                  retry in progress would misreport the model's current state.
                tests:
                  - ModelCatalogViewModel_DownloadAsync_RetryAfterFailure_ClearsPreviousFailureMessage

              - id: SpeechDemo-Models-DownloadGuard
                title: >-
                  The ModelCatalogSubsystem shall not start a download for a model that is
                  already installed or already downloading, nor when no model is selected.
                justification: |
                  Re-downloading an installed model risks disturbing working content for no
                  benefit, and a download command invoked with no selection must do nothing
                  rather than fail.
                tests:
                  - ModelCatalogViewModel_DownloadAsync_AlreadyInstalledModel_DoesNotDownload
                  - ModelCatalogViewModel_DownloadAsync_NullModel_DoesNothing

              - id: SpeechDemo-Models-EmptyCatalogExplanation
                title: >-
                  The ModelCatalogSubsystem shall display a message explaining that the catalog
                  currently reports no known models when the catalog reports none.
                justification: |
                  An empty catalog remains a possible host composition state (for example a host
                  supplying its own, empty known-model list). Explaining an empty catalog in the
                  panel prevents a developer evaluating such a composition from reporting the
                  empty list as a bug.
                tests:
                  - ModelCatalogViewModel_Constructor_EmptyCatalog_ReportsHonestEmptyState
                  - ModelCatalogViewModel_EmptyCatalogMessage_Read_ExplainsCatalogHasNoKnownModels

              - id: SpeechDemo-Models-MirrorSettingsUi
                title: >-
                  The ModelCatalogSubsystem shall let a user type a mirror base URL and optional
                  credential or bearer token and apply those settings to redirect every
                  subsequent download.
                justification: |
                  A user whose network blocks a model's public download host needs to redirect
                  downloads to an internal mirror from the running application, not only via a
                  launch-time argument that requires relaunching the demo.
                tests:
                  - ModelCatalogViewModel_ApplyMirror_ValidMirror_ForwardsConfiguredMirrorAndReportsSuccess

              - id: SpeechDemo-Models-MirrorSettingsPrePopulation
                title: >-
                  The ModelCatalogSubsystem shall pre-populate the mirror settings from any
                  mirror arguments supplied at launch.
                justification: |
                  Pre-populating from launch-time arguments keeps the two entry points
                  consistent rather than contradictory: the panel shows the mirror the
                  application is actually using.
                tests:
                  - ModelCatalogViewModel_Constructor_InitialMirrorValues_PrePopulatesFields

              - id: SpeechDemo-Models-MirrorSettingsBlankRevert
                title: >-
                  The ModelCatalogSubsystem shall revert every subsequent download to each
                  model's own public download URI when a blank mirror URL is applied.
                justification: |
                  A user must be able to undo a mirror redirection without relaunching the
                  application.
                tests:
                  - ModelCatalogViewModel_ApplyMirror_BlankUrl_AppliesNullMirror

              - id: SpeechDemo-Models-MirrorSettingsInvalidReported
                title: >-
                  The ModelCatalogSubsystem shall report an invalid mirror configuration, such as
                  a malformed URL or credentials without a URL, as an explained panel state
                  without applying it.
                justification: |
                  Reporting a typing mistake in place matches how every other failure in this
                  panel is handled and avoids reconfiguring downloads with a bad mirror.
                tests:
                  - ModelCatalogViewModel_ApplyMirror_InvalidUrl_ReportsErrorWithoutCallingService
                  - ModelCatalogViewModel_ApplyMirror_CredentialsWithoutUrl_ReportsErrorWithoutCallingService

              - id: SpeechDemo-Models-MirrorSettingsRejectedReported
                title: >-
                  The ModelCatalogSubsystem shall report, as an explained panel state rather than
                  an error thrown at the user, a mirror change that the catalog service rejects.
                justification: |
                  A catalog service built over a fixed catalog cannot be reconfigured; the user
                  must be told so in the panel rather than meeting a crash.
                tests:
                  - ModelCatalogViewModel_ApplyMirror_ServiceRejectsReconfiguration_ReportsError

              - id: SpeechDemo-Models-MirrorBlockedDuringDownload
                title: >-
                  The ModelCatalogSubsystem shall refuse to apply a mirror change while any row is
                  downloading, reporting an explained panel error, without calling the catalog
                  service.
                justification: |
                  Changing the mirror replaces the catalog and aborts any download still in
                  flight against it. Refusing in the panel before the service is ever called
                  keeps a user's own download from being aborted by their own action.
                tests:
                  - ModelCatalogViewModel_ApplyMirror_DownloadInProgress_RefusesAndReportsError

              - id: SpeechDemo-Voices-PackPanel
                title: >-
                  The ModelCatalogSubsystem shall list the reference voice packs with the user
                  voices folder and the voice-cloning consent note.
                justification: |
                  Packs are managed where models are managed. The user must see what a pack is,
                  where their own voices go and the consent note before installing.
                tests:
                  - ModelCatalogViewModel_Constructor_ListsVoicePacks

              - id: SpeechDemo-Voices-PackSectionHidden
                title: >-
                  The ModelCatalogSubsystem shall hide the reference voices section when the
                  catalog service reports no voice packs.
                justification: |
                  Hosts built without voice support must not show an empty, confusing section.
                tests:
                  - ModelCatalogViewModel_Constructor_NoVoicePacks_HidesSection

              - id: SpeechDemo-Voices-PackInstalledEmotionsShown
                title: >-
                  The ModelCatalogSubsystem shall show, for each installed voice pack, whether
                  the install includes its emotion variants, as reported by the catalog service
                  whenever the panel is refreshed.
                justification: |
                  The user must be able to tell a voices-only install from a full one, and to
                  upgrade the former, after every refresh and not only right after an install.
                tests:
                  - ModelCatalogViewModel_Refresh_InstalledPack_ReadsHasEmotionsFromService

              - id: SpeechDemo-Voices-PackInstall
                title: >-
                  The ModelCatalogSubsystem shall install a voice pack on command and refresh the
                  rows so the pack is shown as installed.
                justification: |
                  Installing a pack makes its voices available; the user must see from the row
                  that the install worked and that the pack can now be removed.
                tests:
                  - ModelCatalogViewModel_InstallVoicePackAsync_Installed_RefreshesRows

              - id: SpeechDemo-Voices-PackEmotionChoiceForwarded
                title: >-
                  The ModelCatalogSubsystem shall install a voice pack with or without its
                  emotion variants according to the user's choice, always including them when
                  adding emotions to a voices-only install.
                justification: |
                  The emotion clips are most of a pack's size, so the user's choice must decide
                  what is downloaded, and "Add emotions" must actually add them.
                tests:
                  - ModelCatalogViewModel_InstallVoicePackAsync_PassesEmotionChoice

              - id: SpeechDemo-Voices-PackInstallFailureReported
                title: >-
                  The ModelCatalogSubsystem shall report a failed, canceled or faulted voice pack
                  install on the pack's row, with an explanation, rather than as an application
                  error.
                justification: |
                  An honest failure on the row tells the user what went wrong and lets them
                  retry, while an escaping exception would take down the demo.
                tests:
                  - ModelCatalogViewModel_InstallVoicePackAsync_FailureModes_ReportedInRow

              - id: SpeechDemo-Voices-PackInstallRollbackKeepsPack
                title: >-
                  The ModelCatalogSubsystem shall, after any unsuccessful voice pack install or
                  upgrade, show the pack in the state the catalog service reports - remaining
                  installed and removable when it is still installed - while keeping the failure
                  message on the row.
                justification: |
                  A failed "Add emotions" upgrade is rolled back to the previous voices-only
                  install, so the pack is still installed. Reporting it as broken would hide a
                  working install and disable its removal, while dropping the message would hide
                  the failure.
                tests:
                  - ModelCatalogViewModel_InstallVoicePackAsync_UpgradeFailsAndRollsBack_KeepsPackInstalledWithMessage

              - id: SpeechDemo-Voices-PackInstallStateReadFallback
                title: >-
                  The ModelCatalogSubsystem shall show the outcome of an unsuccessful voice pack
                  install, with its failure message, when the catalog service cannot report the
                  pack's state.
                justification: |
                  A second fault while re-reading the pack's state must not crash the panel or
                  lose the original failure explanation.
                tests:
                  - ModelCatalogViewModel_InstallVoicePackAsync_StateReadFails_FallsBackToOutcome

              - id: SpeechDemo-Voices-PackRemove
                title: >-
                  The ModelCatalogSubsystem shall remove an installed voice pack on command and
                  refresh the rows so the pack's voices are no longer offered.
                justification: |
                  The user must be able to reclaim disk space and withdraw voices they no
                  longer want.
                tests:
                  - ModelCatalogViewModel_RemoveVoicePack_UninstallsRefreshesAndReportsFaults

              - id: SpeechDemo-Voices-PackRemoveFaultReported
                title: >-
                  The ModelCatalogSubsystem shall report a fault while removing a voice pack on
                  the pack's row rather than as an application error.
                justification: |
                  A file-system fault during removal must not crash the demo; the user is told on
                  the row and the pack stays listed.
                tests:
                  - ModelCatalogViewModel_RemoveVoicePack_UninstallsRefreshesAndReportsFaults

              - id: SpeechDemo-Voices-PackRemoveStoreErrorReported
                title: >-
                  The ModelCatalogSubsystem shall show the catalog service's explanation on the
                  pack's row, and keep the pack installed, when removing a voice pack fails
                  with a store error or is canceled.
                justification: |
                  A removal fault must reach the user as an explanation, not a crash.
                tests:
                  - ModelCatalogViewModel_RemoveVoicePack_StoreException_ShowsMessageAndKeepsPack
                  - ModelCatalogViewModel_RemoveVoicePack_Canceled_ShowsCanceledMessage

              - id: SpeechDemo-Voices-PackBlockedDuringDownload
                title: >-
                  The ModelCatalogSubsystem shall refuse a pack install or removal while any
                  model is downloading, and shall refuse a model download or mirror change
                  while a pack is installing, without calling the catalog service.
                justification: |
                  Installing, removing or re-mirroring rebuilds the catalog, and disposing the
                  old catalog aborts any download in flight against it. Refusing the
                  overlapping operation in the panel keeps that from happening through the
                  only production caller.
                tests:
                  - ModelCatalogViewModel_InstallVoicePackAsync_ModelDownloading_RefusedWithoutCallingService
                  - ModelCatalogViewModel_DownloadAsync_PackInstalling_RefusedWithoutCallingService
                  - ModelCatalogViewModel_ApplyMirror_PackInstalling_IsRefused
