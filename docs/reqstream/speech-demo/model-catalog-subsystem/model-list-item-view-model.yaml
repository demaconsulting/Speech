---
# Software Unit Requirements for the SpeechDemo ModelListItemViewModel
#
# These requirements describe the design-level behavior of the ModelListItemViewModel unit -
# one catalog row's presentation state - decomposing the parent ModelCatalogSubsystem
# requirements.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelCatalogSubsystem Requirements
        sections:
          - title: ModelListItemViewModel Requirements
            requirements:
              - id: SpeechDemo-Models-StatePresentation
                title: >-
                  The ModelCatalogSubsystem shall present each model's identity, role, and
                  installation state in readable form.
                justification: |
                  A user needs to know at a glance what a model is and whether it is missing,
                  downloading, installed, or broken.
                tests:
                  - ModelListItemViewModel_Constructor_Descriptor_CarriesDescriptorIdentityAndState
                  - ModelListItemViewModel_StatusText_EachState_ReturnsReadableCaption

              - id: SpeechDemo-Models-RowDescriptorRequired
                title: >-
                  The ModelCatalogSubsystem shall reject a model row created with no model
                  descriptor.
                justification: |
                  Failing at creation makes an unidentified row an immediate, diagnosable
                  programming error.
                tests:
                  - ModelListItemViewModel_Constructor_NullDescriptor_ThrowsArgumentNullException

              - id: SpeechDemo-Models-DownloadAvailability
                title: >-
                  The ModelCatalogSubsystem shall offer a download for a model row only when
                  the model is neither installed nor already downloading.
                justification: |
                  Working installed content must not be disturbed, while a retry after failure
                  must remain possible.
                tests:
                  - ModelListItemViewModel_CanDownload_EachState_ReflectsRetryPolicy

              - id: SpeechDemo-Models-ProgressVisibility
                title: >-
                  The ModelCatalogSubsystem shall show a model row's progress bar only while
                  the model is downloading.
                justification: |
                  A progress bar on an idle row would misreport its state.
                tests:
                  - ModelListItemViewModel_IsDownloading_DownloadingState_ReturnsTrue

              - id: SpeechDemo-Models-FailureMessageVisibility
                title: >-
                  The ModelCatalogSubsystem shall report a model row's failure explanation as
                  present only when there is one to show.
                justification: |
                  An empty message must never render as blank red text.
                tests:
                  - ModelListItemViewModel_HasFailureMessage_ReflectsPresenceOfMessage

              - id: SpeechDemo-Models-StateChangeAnnouncement
                title: >-
                  The ModelCatalogSubsystem shall announce every derived display value of a
                  model row when its installation state changes.
                justification: |
                  Announcing the derived caption, progress visibility, and button state together
                  is what keeps a bound row from going stale mid-download.
                tests:
                  - ModelListItemViewModel_State_Changed_NotifiesDerivedProperties
