---
# Software Unit Requirements for the SpeechDemo ReferenceVoicePackListItemViewModel
#
# These requirements describe the behavior of the ReferenceVoicePackListItemViewModel unit - one
# row of the reference voice pack section of the catalog panel - decomposing the parent
# ModelCatalogSubsystem requirements.
#
# The requirements are grouped by concern, one criterion each:
#   - Row content (Voices-PackRowPresentation)
#   - Row state (Voices-PackRowStatus, -PackRowChangeAnnouncement)
#   - Emotion variants (Voices-PackEmotionOption, -PackEmotionSizeDisplay, -PackAddEmotions)
# Passing the emotion choice to the catalog service is the panel's behavior and is specified in
# model-catalog-view-model.yaml.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelCatalogSubsystem Requirements
        sections:
          - title: ReferenceVoicePackListItemViewModel Requirements
            requirements:
              - id: SpeechDemo-Voices-PackRowPresentation
                title: >-
                  The ModelCatalogSubsystem shall present each reference voice pack's name, size,
                  license and attribution, and consent note in readable form.
                justification: |
                  A user must see what they are about to download (size and license) and the
                  voice-cloning consent note before installing.
                tests:
                  - ReferenceVoicePackListItemViewModel_Constructor_ProjectsPackDetails

              - id: SpeechDemo-Voices-PackRowRequiresPack
                title: >-
                  The ModelCatalogSubsystem shall reject a voice pack row created with no pack.
                justification: |
                  Failing at creation makes an unidentified row an immediate, diagnosable
                  programming error.
                tests:
                  - ReferenceVoicePackListItemViewModel_Constructor_NullPack_ThrowsArgumentNullException

              - id: SpeechDemo-Voices-PackRowStatus
                title: >-
                  The ModelCatalogSubsystem shall show each voice pack row's status caption for
                  its install state, including voices-only installs and unrecognized states.
                justification: |
                  A user must see at a glance whether a pack is installed, installing or broken.
                tests:
                  - ReferenceVoicePackListItemViewModel_State_DrivesFlagsAndStatusText
                  - ReferenceVoicePackListItemViewModel_State_VoicesOnly_DrivesFlagsAndStatusText
                  - ReferenceVoicePackListItemViewModel_UnknownState_StatusTextFallsBackToStateName

              - id: SpeechDemo-Voices-PackRowActionAvailability
                title: >-
                  The ModelCatalogSubsystem shall offer a voice pack row's install and remove
                  actions only where its install state makes them sensible, with a transient
                  failure retryable.
                justification: |
                  A user must be offered only the actions that make sense for the pack's
                  state.
                tests:
                  - ReferenceVoicePackListItemViewModel_State_DrivesFlagsAndStatusText
                  - ReferenceVoicePackListItemViewModel_State_VoicesOnly_DrivesFlagsAndStatusText

              - id: SpeechDemo-Voices-PackRowChangeAnnouncement
                title: >-
                  The ModelCatalogSubsystem shall announce a voice pack row's derived values when
                  its install state changes.
                justification: |
                  Announcing the derived values together keeps a bound row from going stale
                  while an install runs.
                tests:
                  - ReferenceVoicePackListItemViewModel_State_Changed_RaisesDependentPropertyChanged

              - id: SpeechDemo-Voices-PackRowFailureAnnouncement
                title: >-
                  The ModelCatalogSubsystem shall announce, and report as present, a voice pack
                  row's failure message when it changes.
                justification: |
                  A bound row must show a failure explanation as soon as it is recorded.
                tests:
                  - ReferenceVoicePackListItemViewModel_FailureMessage_UpdatesHasFailureMessage
                  - ReferenceVoicePackListItemViewModel_FailureMessage_Changed_RaisesHasFailureMessageChanged

              - id: SpeechDemo-Voices-PackRowEmotionsAnnouncement
                title: >-
                  The ModelCatalogSubsystem shall announce a voice pack row's derived values when
                  its emotion install status changes.
                justification: |
                  Adding emotions to an install changes the caption, size and available actions,
                  which a bound row must reflect.
                tests:
                  - ReferenceVoicePackListItemViewModel_HasEmotions_Changed_RaisesDependentPropertyChanged

              - id: SpeechDemo-Voices-PackEmotionOption
                title: >-
                  The ModelCatalogSubsystem shall let a user choose, defaulting to on, whether a
                  voice pack that has emotion variants is installed with them.
                justification: |
                  The emotion clips are most of the pack's size, so the user must be able to
                  decline them.
                tests:
                  - ReferenceVoicePackListItemViewModel_AddEmotions_OnlyForVoicesOnlyInstall

              - id: SpeechDemo-Voices-PackNoEmotionOption
                title: >-
                  The ModelCatalogSubsystem shall offer no emotion choice for a voice pack
                  without emotion variants.
                justification: |
                  A pack that has no emotion variants must not offer a meaningless option.
                tests:
                  - ReferenceVoicePackListItemViewModel_PackWithoutEmotionsOrSize_HidesEmotionOptionAndSize

              - id: SpeechDemo-Voices-PackEmotionSizeDisplay
                title: >-
                  The ModelCatalogSubsystem shall show the installed size of a voice pack for the
                  chosen emotion option, or for the actual install once installed.
                justification: |
                  The emotion clips are about 570 MiB against about 44 MiB for the base voices,
                  so the user must see what each choice costs.
                tests:
                  - ReferenceVoicePackListItemViewModel_InstalledSizeText_FollowsOptionAndInstall
                  - ReferenceVoicePackListItemViewModel_IncludeEmotions_Changed_RaisesInstalledSizeTextChanged

              - id: SpeechDemo-Voices-PackAddEmotions
                title: >-
                  The ModelCatalogSubsystem shall offer "Add emotions" for an installed voice
                  pack that lacks its emotion variants, and for no other pack.
                justification: |
                  A user who chose voices only must be able to add the emotions later without
                  guessing, and a pack that already has them must not offer a redundant action.
                tests:
                  - ReferenceVoicePackListItemViewModel_AddEmotions_OnlyForVoicesOnlyInstall
                  - ReferenceVoicePackListItemViewModel_HasEmotions_Changed_RaisesDependentPropertyChanged
