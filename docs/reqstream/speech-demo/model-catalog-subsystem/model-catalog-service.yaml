---
# Software Unit Requirements for the SpeechDemo ModelCatalogService
#
# These requirements describe the design-level behavior of the IModelCatalogService /
# ModelCatalogService unit - the demo-owned catalog seam and its real implementation over the
# library's SpeechModelCatalog - decomposing the parent ModelCatalogSubsystem requirements.
# IModelCatalogService and ModelCatalogService are treated as one unit because the interface has
# no independently observable behavior of its own; every test exercises it through
# ModelCatalogService, its sole implementation.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelCatalogSubsystem Requirements
        sections:
          - title: ModelCatalogService Requirements
            requirements:
              - id: SpeechDemo-Models-LibraryCatalogDelegation
                title: >-
                  The ModelCatalogSubsystem shall obtain every listed model and perform every
                  download through the library's own catalog, behind an injectable seam, and
                  shall reject a missing seam.
                justification: |
                  The demo must not carry its own model registry or download logic; its evidence
                  value comes entirely from driving the library's catalog. A demo-owned seam
                  keeps the panel testable against controlled data without adding any public API
                  to the library.
                tests:
                  - ModelCatalogService_Constructor_NullCatalog_ThrowsArgumentNullException
                  - ModelCatalogService_Enumerate_LibraryKnowsRealModels_ReturnsThem
                  - ModelCatalogService_DownloadAsync_UnknownModelId_ThrowsArgumentException
                  - ModelCatalogService_Enumerate_AfterAnotherAdapterFallsOutOfUse_StillWorks
                  - ModelCatalogViewModel_Constructor_NullService_ThrowsArgumentNullException

              - id: SpeechDemo-Models-InstallNotification
                title: >-
                  The ModelCatalogSubsystem shall raise a ModelInstalled event, carrying the
                  installed model's id and role, once a download genuinely installs a model, and
                  shall never raise it for a failed, canceled, or checksum-mismatched download
                  attempt.
                justification: |
                  The STT and TTS panels already depend on this same seam and need a way to
                  learn that a model they care about just finished installing, so they can
                  refresh themselves automatically without a manual click or app restart.
                  Raising the event only on a genuine install keeps this a reliable signal
                  rather than a noisy one.
                tests:
                  - ModelCatalogService_DownloadAsync_Installed_RaisesModelInstalledWithCorrectIdAndRole
                  - ModelCatalogService_DownloadAsync_Failed_DoesNotRaiseModelInstalled

              - id: SpeechDemo-Models-MirrorRebuild
                title: >-
                  A ModelCatalogSubsystem seam constructed with a catalog factory shall rebuild
                  its catalog through that factory, passing the requested mirror (or no mirror),
                  when its mirror is reconfigured.
                justification: |
                  The demo's composition root builds its catalog once at startup, but a user
                  behind a network policy that blocks a model's public download host needs to
                  redirect downloads to an internal mirror from the running application, not only
                  via a launch-time argument. Because the library's SpeechModelCatalog cannot be
                  reconfigured in place, the seam must instead be able to build an entirely new
                  one on request.
                tests:
                  - ModelCatalogService_ApplyMirror_WithFactory_RebuildsCatalogThroughFactory

              - id: SpeechDemo-Models-MirrorRequiresFactory
                title: >-
                  A ModelCatalogSubsystem seam constructed without a catalog factory shall reject
                  both an attempt to supply a null factory and an attempt to reconfigure its
                  mirror, rather than silently doing nothing.
                justification: |
                  A seam built over a single, externally owned catalog has no catalog of its own
                  to rebuild. Failing fast - at construction for a null factory, and at
                  ApplyMirror for a seam with no factory at all - makes an unsupported
                  reconfiguration attempt an immediate, diagnosable programming error instead of a
                  silent no-op a caller could easily miss.
                tests:
                  - ModelCatalogService_Constructor_NullCatalogFactory_ThrowsArgumentNullException
                  - ModelCatalogService_ApplyMirror_NoFactory_ThrowsInvalidOperationException

              - id: SpeechDemo-Models-MirrorCatalogOwnership
                title: >-
                  A ModelCatalogSubsystem seam constructed with a catalog factory shall own the
                  lifetime of every catalog it ever builds, disposing the catalog it replaces
                  when its mirror is reconfigured and disposing its current catalog when the seam
                  itself is disposed; a seam constructed without a catalog factory shall never
                  dispose its externally owned catalog.
                justification: |
                  Nothing outside the seam ever sees a catalog built through ApplyMirror, so
                  nothing else is in a position to dispose it; without this, every mirror change
                  would leak the catalog it replaced. A seam built over a single, externally
                  owned catalog must leave that catalog's lifetime to its owner.
                tests:
                  - ModelCatalogService_ApplyMirror_WithFactory_DisposesReplacedCatalog
                  - ModelCatalogService_Dispose_WithFactory_DisposesCurrentCatalog
                  - ModelCatalogService_Dispose_WithoutFactory_DoesNotDisposeCatalog

              - id: SpeechDemo-Voices-PackService
                title: >-
                  A ModelCatalogSubsystem seam constructed over a catalog and reference voice
                  library pair shall report the library's voice packs, their install state and
                  the user voices folder; shall rebuild and replace the pair (disposing the old
                  one) and raise ReferenceVoicesChanged after a pack is uninstalled, after an
                  install attempt however it ends (installed, failed, canceled or thrown), and after a
                  mirror change; and shall report no packs and refuse pack
                  operations when it has no voice library.
                justification: |
                  The Chatterbox voice list is fixed when the model is constructed, so a voice
                  change is only visible after the catalog is rebuilt. Rebuilding the catalog
                  and the shared library together and announcing it is what lets the
                  synthesis panel offer the new voices immediately; a failed or canceled upgrade can still
                  have changed the installed state (moved aside, then restored), so the rebuild happens
                  however the install ends. Seams built without a library (every
                  other consumer) must stay inert rather than throwing at enumeration.
                tests:
                  - ModelCatalogService_Constructor_NullComposition_ThrowsArgumentNullException
                  - ModelCatalogService_ReferenceVoices_NoLibrary_ReportsNoPacksAndRefusesOperations
                  - ModelCatalogService_ReferenceVoices_Composed_ListsPackAndUserDirectory
                  - ModelCatalogService_UninstallReferenceVoicePack_RebuildsCatalogAndRaisesEvent
                  - ModelCatalogService_ApplyMirror_Composed_RebuildsPairAndRaisesEvent
                  - ModelCatalogService_InstallReferenceVoicePackAsync_Failure_StillRebuildsAndRaises
                  - ModelCatalogService_InstallReferenceVoicePackAsync_Canceled_StillRebuildsAndRaises
