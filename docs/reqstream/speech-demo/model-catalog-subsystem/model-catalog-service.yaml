---
# Software Unit Requirements for the SpeechDemo ModelCatalogService
#
# These requirements describe the behavior of the IModelCatalogService / ModelCatalogService
# unit - the demo-owned catalog seam and its real implementation over the library's
# SpeechModelCatalog - decomposing the parent ModelCatalogSubsystem requirements.
# IModelCatalogService and ModelCatalogService are treated as one unit because the interface has
# no independently observable behavior of its own; every test exercises it through
# ModelCatalogService, its sole implementation.
#
# The requirements are grouped by concern, one criterion each, and identified by prefix:
#   - SpeechDemo-Models-* : library catalog delegation and the unknown-model error, the catalog
#     seam and factory being required, install notification (and its absence on failure), mirror
#     reconfiguration and the factory it needs, and catalog lifetime ownership
#   - SpeechDemo-Voices-* : the reference voice pack members: the pack list and user voices
#     folder, the composition being required, the refusals when there is no voice library,
#     and the rebuild and announcement behavior after an uninstall, an install (whether it
#     fails or is canceled, and that a failing rebuild never masks the install's own
#     exception), a mirror change, and an uninstall that must wait for an in-flight install
# Every test below is a ModelCatalogServiceTests test.

sections:
  - title: SpeechDemo Requirements
    sections:
      - title: ModelCatalogSubsystem Requirements
        sections:
          - title: ModelCatalogService Requirements
            requirements:
              - id: SpeechDemo-Models-LibraryCatalogDelegation
                title: >-
                  The ModelCatalogService shall list exactly the models the library's own
                  catalog reports, without adding or hiding any.
                justification: |
                  The demo must not carry its own model registry; its evidence value comes
                  entirely from reporting what the library's catalog knows, with each model's
                  own declared role preserved.
                tests:
                  - ModelCatalogService_Enumerate_LibraryKnowsRealModels_ReturnsThem

              - id: SpeechDemo-Models-LibraryDownloadDelegation
                title: >-
                  The ModelCatalogService shall perform every model download through the
                  library's own catalog.
                justification: |
                  The demo must not carry its own download logic; delegating to the library's
                  catalog keeps the demo evidence of the library's contract.
                tests:
                  - ModelCatalogService_DownloadAsync_LibraryModel_InstallsThroughLibraryCatalog

              - id: SpeechDemo-Models-LibraryUnknownModelError
                title: >-
                  The ModelCatalogService shall surface the library's error, unchanged, when
                  a download is requested for an unknown model id.
                justification: |
                  Surfacing the library's caller-error contract unchanged proves downloads are
                  delegated rather than reimplemented.
                tests:
                  - ModelCatalogService_DownloadAsync_UnknownModelId_ThrowsArgumentException

              - id: SpeechDemo-Models-CatalogSeamRequired
                title: >-
                  The ModelCatalogService shall reject a missing library catalog when its
                  catalog service is created.
                justification: |
                  A catalog service with no catalog behind it could only fail later and with a
                  less obvious cause; failing at creation makes the programming error immediate.
                tests:
                  - ModelCatalogService_Constructor_NullCatalog_ThrowsArgumentNullException

              - id: SpeechDemo-Models-InstallNotification
                title: >-
                  The ModelCatalogService shall raise a ModelInstalled event, carrying the
                  installed model's id and role, once a download genuinely installs a model.
                justification: |
                  The STT and TTS panels depend on this same service and need a way to learn
                  that a model they care about just finished installing, so they can refresh
                  themselves automatically without a manual click or app restart.
                tests:
                  - ModelCatalogService_DownloadAsync_Installed_RaisesModelInstalledWithCorrectIdAndRole

              - id: SpeechDemo-Models-NoInstallNotificationOnFailure
                title: >-
                  The ModelCatalogService shall not raise a ModelInstalled event for a failed,
                  canceled, or checksum-mismatched download attempt.
                justification: |
                  Raising the event only for a genuine install keeps it a reliable signal;
                  a spurious notification would make other panels refresh for a model that is
                  not actually available.
                tests:
                  - ModelCatalogService_DownloadAsync_Failed_DoesNotRaiseModelInstalled
                  - ModelCatalogService_DownloadAsync_Canceled_DoesNotRaiseModelInstalled
                  - ModelCatalogService_DownloadAsync_ChecksumMismatch_DoesNotRaiseModelInstalled

              - id: SpeechDemo-Models-MirrorRebuild
                title: >-
                  The ModelCatalogService shall, when it can rebuild its catalog,
                  rebuild it when its mirror is reconfigured, passing the requested mirror (or no
                  mirror).
                justification: |
                  A user behind a network policy that blocks a model's public download host
                  needs to redirect downloads to an internal mirror from the running
                  application, not only via a launch-time argument. Because the library's
                  catalog cannot be reconfigured in place, the service must build an entirely
                  new one on request.
                tests:
                  - ModelCatalogService_ApplyMirror_WithFactory_RebuildsCatalogThroughFactory

              - id: SpeechDemo-Models-MirrorRequiresFactory
                title: >-
                  The ModelCatalogService shall, when it cannot rebuild its catalog,
                  reject an attempt to reconfigure its mirror.
                justification: |
                  A service built over a single, externally owned catalog has no catalog of its
                  own to rebuild. Failing fast makes an unsupported reconfiguration attempt an
                  immediate, diagnosable programming error instead of a silent no-op a caller
                  could easily miss.
                tests:
                  - ModelCatalogService_ApplyMirror_NoFactory_ThrowsInvalidOperationException

              - id: SpeechDemo-Models-CatalogFactoryRequired
                title: >-
                  The ModelCatalogService shall reject a missing catalog rebuild capability
                  when a rebuilding catalog service is created.
                justification: |
                  Failing at creation makes a service that was meant to rebuild its catalog but
                  has no means to do so an immediate, diagnosable programming error.
                tests:
                  - ModelCatalogService_Constructor_NullCatalogFactory_ThrowsArgumentNullException

              - id: SpeechDemo-Models-MirrorCatalogOwnership
                title: >-
                  The ModelCatalogService shall, when it can rebuild its catalog,
                  dispose the catalog it replaces when its mirror is reconfigured.
                justification: |
                  Nothing outside the service ever sees a catalog built through a mirror change,
                  so nothing else is in a position to dispose it; without this, every mirror
                  change would leak the catalog it replaced.
                tests:
                  - ModelCatalogService_ApplyMirror_WithFactory_DisposesReplacedCatalog

              - id: SpeechDemo-Models-MirrorDisposesCurrentCatalog
                title: >-
                  The ModelCatalogService shall, when it can rebuild its catalog,
                  dispose its current catalog when the service itself is disposed.
                justification: |
                  The service owns every catalog it builds, so disposing it is the only point at
                  which the current catalog can be released at application shutdown.
                tests:
                  - ModelCatalogService_Dispose_WithFactory_DisposesCurrentCatalog

              - id: SpeechDemo-Models-ExternalCatalogNotDisposed
                title: >-
                  The ModelCatalogService shall, when built over an externally owned catalog,
                  leave that catalog usable when the service is disposed or goes out of
                  use.
                justification: |
                  A catalog shared with other parts of the application must outlive any one
                  catalog service; its lifetime belongs to its owner.
                tests:
                  - ModelCatalogService_Dispose_WithoutFactory_DoesNotDisposeCatalog
                  - ModelCatalogService_Enumerate_AfterAnotherAdapterFallsOutOfUse_StillWorks

              - id: SpeechDemo-Voices-PackService
                title: >-
                  The ModelCatalogService shall, with a reference voice library,
                  report the library's voice packs.
                justification: |
                  The panel and the synthesis panel need one place to learn which voice packs
                  exist, so voice management is driven through the same service as model
                  management.
                tests:
                  - ModelCatalogService_ReferenceVoices_Composed_ListsPack

              - id: SpeechDemo-Voices-UserVoicesFolder
                title: >-
                  The ModelCatalogService shall, with a reference voice library,
                  report the user voices folder.
                justification: |
                  The panel needs to tell the user where their own voices go, and that folder
                  belongs with the catalog's store.
                tests:
                  - ModelCatalogService_ReferenceVoices_Composed_ReportsUserVoicesDirectory

              - id: SpeechDemo-Voices-PackServiceCompositionRequired
                title: >-
                  The ModelCatalogService shall reject a missing catalog and voice library
                  composition when its catalog service is created.
                justification: |
                  Failing at creation makes a half-composed service an immediate, diagnosable
                  programming error instead of a later fault.
                tests:
                  - ModelCatalogService_Constructor_NullComposition_ThrowsArgumentNullException

              - id: SpeechDemo-Voices-PackServiceNoLibrary
                title: >-
                  The ModelCatalogService shall, without a reference voice library,
                  report no voice packs.
                justification: |
                  Catalog services built for other consumers have no voice library and must stay
                  inert rather than throwing at enumeration.
                tests:
                  - ModelCatalogService_ReferenceVoices_NoLibrary_ReportsNoPacks

              - id: SpeechDemo-Voices-PackServiceNoLibraryRefusal
                title: >-
                  The ModelCatalogService shall, without a reference voice library,
                  refuse a request for a voice pack's state.
                justification: |
                  An explicit pack request against a service with no voice library is a
                  programming error that should be reported rather than silently ignored.
                tests:
                  - ModelCatalogService_ReferenceVoices_NoLibrary_RefusesPackStateRequest

              - id: SpeechDemo-Voices-PackServiceNoLibraryEmotionsRefusal
                title: >-
                  The ModelCatalogService shall, without a reference voice library,
                  refuse a request for whether a voice pack has emotion variants.
                justification: |
                  An explicit pack request against a service with no voice library is a
                  programming error that should be reported rather than silently ignored.
                tests:
                  - ModelCatalogService_ReferenceVoices_NoLibrary_RefusesEmotionsRequest

              - id: SpeechDemo-Voices-PackServiceNoLibraryUninstallRefusal
                title: >-
                  The ModelCatalogService shall, without a reference voice library,
                  refuse a request to uninstall a voice pack.
                justification: |
                  An explicit pack request against a service with no voice library is a
                  programming error that should be reported rather than silently ignored.
                tests:
                  - ModelCatalogService_ReferenceVoices_NoLibrary_RefusesUninstallRequest

              - id: SpeechDemo-Voices-PackUninstallRebuild
                title: >-
                  The ModelCatalogService shall rebuild its catalog and voice library after a
                  voice pack is uninstalled.
                justification: |
                  The Chatterbox voice list is fixed when the model is constructed, so a removed
                  voice is only withdrawn after the catalog is rebuilt.
                tests:
                  - ModelCatalogService_UninstallReferenceVoicePack_RebuildsCatalogAndRaisesEvent

              - id: SpeechDemo-Voices-PackUninstallAnnounce
                title: >-
                  The ModelCatalogService shall raise ReferenceVoicesChanged after a voice
                  pack is uninstalled.
                justification: |
                  Announcing the change lets the synthesis panel stop offering the removed
                  voices immediately.
                tests:
                  - ModelCatalogService_UninstallReferenceVoicePack_RebuildsCatalogAndRaisesEvent

              - id: SpeechDemo-Voices-PackInstallRebuild
                title: >-
                  The ModelCatalogService shall rebuild its catalog and voice library after a
                  voice pack install attempt that fails.
                justification: |
                  A failed upgrade can still have changed the installed state (the old install
                  is moved aside, then restored), so the rebuild must happen for the voice
                  choices to stay accurate.
                tests:
                  - ModelCatalogService_InstallReferenceVoicePackAsync_Failure_StillRebuildsAndRaises

              - id: SpeechDemo-Voices-PackInstallFailureAnnounce
                title: >-
                  The ModelCatalogService shall raise ReferenceVoicesChanged after a voice
                  pack install attempt that fails.
                justification: |
                  A failed upgrade can still have changed the installed state, so dependent
                  panels must be told to refresh their voice choices.
                tests:
                  - ModelCatalogService_InstallReferenceVoicePackAsync_Failure_StillRebuildsAndRaises

              - id: SpeechDemo-Voices-PackInstallCanceledRebuild
                title: >-
                  The ModelCatalogService shall rebuild its catalog and voice library after a
                  voice pack install attempt is canceled.
                justification: |
                  A canceled upgrade can still have changed the installed state, so the rebuild
                  must happen even though the cancellation propagates to the caller.
                tests:
                  - ModelCatalogService_InstallReferenceVoicePackAsync_Canceled_StillRebuildsAndRaises

              - id: SpeechDemo-Voices-PackInstallCanceledAnnounce
                title: >-
                  The ModelCatalogService shall raise ReferenceVoicesChanged after a voice
                  pack install attempt is canceled.
                justification: |
                  A canceled upgrade can still have changed the installed state, so dependent
                  panels must be told to refresh even though the cancellation propagates to the
                  caller.
                tests:
                  - ModelCatalogService_InstallReferenceVoicePackAsync_Canceled_StillRebuildsAndRaises

              - id: SpeechDemo-Voices-PackInstallRebuildFailureKeepsCause
                title: >-
                  The ModelCatalogService shall propagate a voice pack install's own exception,
                  rather than a failure of the catalog rebuild that follows it.
                justification: |
                  The rebuild after a failed or canceled install is a recovery step; if it also
                  fails, replacing the install's exception (such as a cancellation the caller is
                  waiting for) with the rebuild's would hide the real cause.
                tests:
                  - ModelCatalogService_InstallReferenceVoicePackAsync_RebuildFailsAfterCancel_RethrowsCancellation

              - id: SpeechDemo-Voices-PackMirrorRebuild
                title: >-
                  The ModelCatalogService shall rebuild its catalog and voice library when its
                  mirror is changed.
                justification: |
                  Voice packs download through the same mirror as models, so a mirror change
                  must produce a freshly configured catalog and library.
                tests:
                  - ModelCatalogService_ApplyMirror_Composed_RebuildsPairAndRaisesEvent

              - id: SpeechDemo-Voices-PackMirrorAnnounce
                title: >-
                  The ModelCatalogService shall raise ReferenceVoicesChanged when its mirror
                  is changed.
                justification: |
                  Dependent panels must be told to refresh once a mirror change has produced a
                  freshly configured catalog and library.
                tests:
                  - ModelCatalogService_ApplyMirror_Composed_RebuildsPairAndRaisesEvent

              - id: SpeechDemo-Voices-PackUninstallWaitsForInstall
                title: >-
                  The ModelCatalogService shall wait, without blocking the caller, for an
                  in-progress install of a voice pack to finish before uninstalling that pack.
                justification: |
                  Removing a pack mid-install would corrupt it, and refusing would force the
                  caller to retry. Serializing with the install keeps the pack consistent.
                tests:
                  - ModelCatalogService_UninstallReferenceVoicePackAsync_InstallInFlight_WaitsThenUninstalls

              - id: SpeechDemo-Voices-PackUninstallDefersRebuild
                title: >-
                  The ModelCatalogService shall not rebuild the catalog or announce a change
                  for a voice pack uninstall until the removal actually runs.
                justification: |
                  Nothing is rebuilt or announced until something actually changed, so other
                  panels are never told to refresh for a removal that has not happened yet.
                tests:
                  - ModelCatalogService_UninstallReferenceVoicePackAsync_InstallInFlight_WaitsThenUninstalls
