---
# Software Unit Requirements for WordPronouncer
#
# These requirements describe the behavior of the WordPronouncer unit: the pronunciation of one word by the
# priority list (reading, dictionary, morphology and productive prefixes, letter-to-sound model), with the
# rules for hyphenated compounds and diacritics. It decomposes the parent SpeechPhonemesEn PhonemizerSubsystem
# requirements. Covered by the WordPronouncer_* tests in
# test/DemaConsulting.Speech.Phonemes.En.Tests/PhonemizerSubsystemTests.cs.

sections:
  - title: SpeechPhonemesEn Requirements
    sections:
      - title: PhonemizerSubsystem Requirements
        sections:
          - title: WordPronouncer Requirements
            requirements:
              - id: SpeechPhonemesEn-Phonemizer-WordPronouncer-Priority
                title: >-
                  The WordPronouncer class shall pronounce a word from the reading when the reading table
                  resolves it, else from the reviewed correction of a wrong dictionary entry when the word
                  has one (nobly), else from the dictionary's first variant (the variant with the velar stop first
                  for the comparative of an adjective in ng, whose dictionary entry lists it with and without
                  the stop), else from the reviewed addition of a word the dictionary lacks (agave), else from
                  the morphology rules of a known stem, else from a productive prefix and a known remainder of
                  at least four letters (never splitting a word the dictionary lists), else, for a word not
                  written with a capital, from the dictionary word its British spelling stands for (manoeuvring
                  as maneuvering), else, for a word written with a capital that ends in -mouth, as an English
                  place name with the reduced last element (Rhinemouth), else from the letter-to-sound model, and
                  report the source of its answer; shall fold diacritics before the lookup; shall pronounce
                  a hyphenated compound part by part with the stress of one word: the stress pattern of the
                  closed dictionary spelling when it has exactly the same sounds (wherever its primary stress
                  falls: co-operate, non-fiction; not when the first element is a single letter, e-mail);
                  otherwise, after a productive prefix (re-, pre-, un-, dis-, mis-, non-, anti-, semi-, inter-,
                  ex-, de-) the weak stress of the prefix and the primary stress of the root, and in any other
                  compound one primary stress on the first element and a secondary stress on a later element
                  that had a primary one (battle-field, well-known); a small function word
                  inside it unstressed, except that a closed dictionary spelling is used when a part is not a
                  word of its own; and shall give no pronunciation for text that contains a letter it cannot
                  fold to the Latin alphabet.
                justification: |
                  This is the priority list of the package for one word. The morphology and prefix steps
                  come before the model because they are exact where the model guesses, and the minimum
                  remainder keeps a real word that merely begins like a prefix from being split. The
                  compound and diacritic rules are what make "well-known", "state-of-the-art" and "café"
                  sound like the words they are. The dictionary is wrong about a few words (it lists
                  "nobly" with the vowel of "knobbly"), so a short reviewed table of corrections speaks the
                  word the writer meant, and a short table of additions speaks the few missing words a
                  listener flagged (agave). The dictionary is American, so a British spelling it lacks would
                  be guessed letter by letter (manoeuvring with the vowels of the letters o, e and u); the two spellings sound the
                  same, and a name is left alone because its letters are not a spelling convention. The
                  dictionary reduces every English place name in -mouth it lists (Portsmouth), while the
                  letter-to-sound model gives an unknown one the full vowel, which the voice reads as two
                  words with a pause. An unknown word of two to five capitals with a vowel is nearly
                  always an initialism (USGS), which the model guesses as a nonsense word. A listener heard
                  "bio-mechanical" with the stress on bio: a combining form before a long root leaves the
                  root its stress in the dictionary.
                tests:
                  - WordPronouncer_Pronounce_ByPriority_ReportsTheSourceUsed
                  - WordPronouncer_Pronounce_LexiconCorrection_BeatsTheDictionaryEntry
                  - WordPronouncer_Pronounce_ComparativeInNg_TakesTheVariantWithTheVelarStop
                  - WordPronouncer_Pronounce_ProductivePrefix_IsPrefixPlusKnownWord
                  - WordPronouncer_Pronounce_DiacriticsCompoundsAndNonWords_FollowTheDocumentedRules
                  - WordPronouncer_Pronounce_LexiconAddition_PronouncesAWordTheDictionaryLacks
                  - WordPronouncer_Pronounce_BritishSpelling_IsTheAmericanDictionaryWord
                  - WordPronouncer_Pronounce_PlaceNameInMouth_HasTheReducedLastElement
                  - WordPronouncer_Pronounce_UnknownCapitals_AreSpelledByTheLetterNames
                  - WordPronouncer_Pronounce_CombiningForm_LeavesTheStressOnALongRoot
