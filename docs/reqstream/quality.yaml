          disconnected from library functionality.
        children:
          - SpeechDemo-OTS-Avalonia-DesktopApplicationHost
          - SpeechDemo-OTS-Avalonia-ApplicationBuilderConfiguration

      - id: Quality-DemoMvvm
        title: >-
          The repository shall rely on CommunityToolkit.Mvvm for demo observable change
