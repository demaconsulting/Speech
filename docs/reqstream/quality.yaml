---
# Quality/process requirements grouping Speech's use of off-the-shelf
# (OTS) process tooling. These requirements exist so that OTS-derived requirements
# (which describe capabilities the repository's build/quality pipeline relies on
# from third-party tools, not user-visible library functionality) are not reported
# as orphans by `dotnet reqstream --requirements requirements.yaml --enforce`.
sections:
  - title: Quality Requirements
    requirements:
      - id: Quality-TestInfrastructure
        title: The repository shall rely on xUnit to execute and report automated test results.
        tags: [quality]
        justification: |
          Automated testing depends on xUnit's test execution and reporting
          capabilities. This grouping requirement links the xUnit OTS requirements
          to the quality root so they participate in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-xUnit-Execute
          - Speech-OTS-xUnit-Report

      - id: Quality-BuildIntegrity
        title: >-
          The repository's build pipeline shall rely on BuildMark and VersionMark
          to validate tool versions and enforce build integrity.
        tags: [quality]
        justification: |
          CI/CD reliability depends on BuildMark's build-integrity checks and
          VersionMark's version-tracking capabilities. This grouping requirement
          links those OTS requirements to the quality root so they participate in
          orphan detection without being falsely reported as disconnected from
          library functionality.
        children:
          - Speech-OTS-BuildMark
          - Speech-OTS-VersionMark
          - Speech-OTS-VersionMark-Lint

      - id: Quality-StaticAnalysis
        title: The repository shall rely on SarifMark and SonarMark to enforce static-analysis quality gates.
        tags: [quality]
        justification: |
          Code quality assurance depends on SarifMark's SARIF-based enforcement and
          SonarMark's SonarCloud integration. This grouping requirement links those
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from library
          functionality.
        children:
          - Speech-OTS-SarifMark
          - Speech-OTS-SarifMark-Enforcement
          - Speech-OTS-SonarMark

      - id: Quality-PeerReview
        title: The repository shall rely on ReviewMark to enforce peer-review tracking and reporting.
        tags: [quality]
        justification: |
          Peer-review compliance depends on ReviewMark's indexing, enforcement,
          elaboration, linting, and directory-override capabilities. This grouping
          requirement links those OTS requirements to the quality root so they
          participate in orphan detection without being falsely reported as
          disconnected from library functionality.
        children:
          - Speech-OTS-ReviewMark
          - Speech-OTS-ReviewMark-IndexScan
          - Speech-OTS-ReviewMark-Enforce
          - Speech-OTS-ReviewMark-Elaborate
          - Speech-OTS-ReviewMark-Lint
          - Speech-OTS-ReviewMark-DirectoryOverride

      - id: Quality-DocumentationGeneration
        title: The repository shall rely on Pandoc and WeasyPrint to generate HTML and PDF documentation.
        tags: [quality]
        justification: |
          Documentation generation depends on Pandoc's format conversion and
          WeasyPrint's PDF rendering. This grouping requirement links those OTS
          requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-Pandoc
          - Speech-OTS-WeasyPrint

      - id: Quality-RequirementsTraceability
        title: >-
          The repository shall rely on ReqStream and FileAssert to validate
          requirements traceability and generated documentation.
        tags: [quality]
        justification: |
          Requirements traceability depends on ReqStream's linting and reporting
          capabilities, and generated-document verification depends on FileAssert.
          This grouping requirement links those OTS requirements to the quality
          root so they participate in orphan detection without being falsely
          reported as disconnected from library functionality.
        children:
          - Speech-OTS-ReqStream
          - Speech-OTS-ReqStream-Lint
          - Speech-OTS-FileAssert

      - id: Quality-AudioBackend
        title: >-
          The repository shall rely on PortAudioSharp2 for real cross-platform audio capture and
          playback.
        tags: [quality]
        justification: |
          Real audio I/O depends on PortAudioSharp2's managed PortAudio binding and its
          host-API-aware device selection and stream-opening capabilities. This grouping
          requirement links those OTS requirements to the quality root so they participate in
          orphan detection without being falsely reported as disconnected from library
          functionality.
        children:
          - Speech-OTS-PortAudioSharp2-ManagedBinding
          - Speech-OTS-PortAudioSharp2-HostApiSelection
          - Speech-OTS-PortAudioSharp2-StreamInterop

      - id: Quality-SpeechEngine
        title: >-
          The repository shall rely on sherpa-onnx for local, offline speech recognition
          inference.
        tags: [quality]
        justification: |
          Streaming speech-to-text depends on sherpa-onnx's managed streaming-recognition API and
          on each model declaring its own engine configuration through that API. This grouping
          requirement links those OTS requirements to the quality root so they participate in
          orphan detection without being falsely reported as disconnected from library
          functionality.
        children:
          - Speech-OTS-SherpaOnnx-ManagedStreamingApi
          - Speech-OTS-SherpaOnnx-ModelOwnedConfiguration

      - id: Quality-ArchiveExtraction
        title: >-
          The repository shall rely on SharpCompress to unpack downloaded .tar.bz2 model
          archives.
        tags: [quality]
        justification: |
          Model installation depends on SharpCompress's managed BZip2 tar decoder, and the
          TarBz2ArchiveExtractor helper's argument validation precedes every call into it. This
          grouping requirement links those OTS requirements to the quality root so they
          participate in orphan detection without being falsely reported as disconnected from
          library functionality.
        children:
          - Speech-OTS-SharpCompress-TarBz2Extraction
          - Speech-OTS-SharpCompress-ArgumentValidation

      - id: Quality-OnnxInference
        title: >-
          The repository shall rely on Microsoft.ML.OnnxRuntime for local, offline ONNX model
          inference.
        tags: [quality]
        justification: |
          The ONNX-based recognition and synthesis packages depend on ONNX Runtime's managed
          inference API, execution-provider fallback, and tensor binding. This grouping
          requirement links those OTS requirements to the quality root so they participate in
          orphan detection without being falsely reported as disconnected from library
          functionality.
        children:
          - Speech-OTS-MicrosoftMlOnnxRuntime-CpuInference
          - Speech-OTS-MicrosoftMlOnnxRuntime-ProviderFallback
          - Speech-OTS-MicrosoftMlOnnxRuntime-TensorBinding

      - id: Quality-VectorizedAudioMath
        title: >-
          The repository shall rely on System.Numerics.Tensors for vectorized audio sample math.
        tags: [quality]
        justification: |
          WAV decoding, resampling, and volume scaling depend on System.Numerics.Tensors'
          vectorized primitives. This grouping requirement links that OTS requirement to the
          quality root so it participates in orphan detection without being falsely reported as
          disconnected from library functionality.
        children:
          - Speech-OTS-SystemNumericsTensors-VectorizedAudioMath

      - id: Quality-SoftwareStructureModeling
        title: The repository shall rely on SysML2Tools to lint and render software-structure models.
        tags: [quality]
        justification: |
          Software-structure documentation depends on SysML2Tools' model-linting
          and diagram-rendering capabilities. This grouping requirement links those
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from library
          functionality.
        children:
          - Speech-OTS-SysML2Tools-Lint
          - Speech-OTS-SysML2Tools-Render

      - id: Quality-DemoUserInterface
        title: >-
          The repository shall rely on Avalonia and CommunityToolkit.Mvvm for the cross-platform
          demo application user interface.
        tags: [quality]
        justification: |
          The SpeechDemo application depends on Avalonia for its cross-platform desktop
          application host and on CommunityToolkit.Mvvm for observable change notification and
          generated commands. This grouping requirement links those OTS requirements to the
          quality root so they participate in orphan detection without being falsely reported as
          disconnected from library functionality.
        children:
          - SpeechDemo-OTS-Avalonia-DesktopApplicationHost
          - SpeechDemo-OTS-CommunityToolkitMvvm-ChangeNotification
          - SpeechDemo-OTS-CommunityToolkitMvvm-Commands
