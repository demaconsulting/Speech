          the quality root so it participates in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-ReqStream

      - id: Quality-RequirementsLinting
        title: The repository shall rely on ReqStream to lint requirements.
        tags: [quality]
        justification: |
          Requirements quality depends on ReqStream's linting capability. This
          grouping requirement links that OTS requirement to
          the quality root so it participates in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-ReqStream-Lint

      - id: Quality-GeneratedDocumentVerification
        title: The repository shall rely on FileAssert to verify that generated documents exist.
        tags: [quality]
        justification: |
          Generated-document verification depends on FileAssert. This grouping
          requirement links that OTS requirement to the quality root so it
