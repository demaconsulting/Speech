---
# Quality/process requirements grouping Speech's use of off-the-shelf
# (OTS) process tooling. These requirements exist so that OTS-derived requirements
# (which describe capabilities the repository's build/quality pipeline relies on
# from third-party tools, not user-visible library functionality) are not reported
# as orphans by `dotnet reqstream --requirements requirements.yaml --enforce`.
sections:
  - title: Quality Requirements
    requirements:
      - id: Quality-TestInfrastructure
        title: The repository shall rely on xUnit to execute automated tests.
        tags: [quality]
        justification: |
          Automated testing depends on xUnit's test execution capability. This
          grouping requirement links the xUnit execution OTS requirement
          to the quality root so it participates in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-xUnit-Execute

      - id: Quality-TestReporting
        title: The repository shall rely on xUnit to report automated test results.
        tags: [quality]
        justification: |
          Automated testing depends on xUnit's result reporting capability. This
          grouping requirement links the xUnit reporting OTS requirement
          to the quality root so it participates in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-xUnit-Report

      - id: Quality-BuildIntegrity
        title: The repository's build pipeline shall rely on BuildMark to generate build notes.
        tags: [quality]
        justification: |
          CI/CD reliability depends on BuildMark's build-notes generation. This
          grouping requirement links the BuildMark OTS requirement to the quality
          root so it participates in orphan detection without being falsely
          reported as disconnected from library functionality.
        children:
          - Speech-OTS-BuildMark

      - id: Quality-VersionTracking
        title: The repository's build pipeline shall rely on VersionMark to track tool versions.
        tags: [quality]
        justification: |
          CI/CD reliability depends on VersionMark's version-tracking capability.
          This grouping requirement links that OTS requirement to
          the quality root so it participates in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-VersionMark

      - id: Quality-VersionValidation
        title: The repository's build pipeline shall rely on VersionMark to validate its configuration by linting.
        tags: [quality]
        justification: |
          CI/CD reliability depends on VersionMark's linting capability. This
          grouping requirement links that OTS requirement to
          the quality root so it participates in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - Speech-OTS-VersionMark-Lint

      - id: Quality-StaticAnalysis
        title: The repository shall rely on SarifMark to enforce static-analysis results.
        tags: [quality]
        justification: |
          Code quality assurance depends on SarifMark's SARIF-based enforcement.
          This grouping requirement links those OTS requirements to the quality
          root so they participate in orphan detection without being falsely
          reported as disconnected from library functionality.
        children:
          - Speech-OTS-SarifMark
          - Speech-OTS-SarifMark-Enforcement

      - id: Quality-QualityDashboard
        title: The repository shall rely on SonarMark to report SonarCloud quality-gate status.
        tags: [quality]
        justification: |
          Code quality visibility depends on SonarMark's SonarCloud integration.
          This grouping requirement links that OTS requirement to the quality root
