          disconnected from library functionality.
        children:
          - Speech-OTS-SonarMark

      - id: Quality-PeerReview
        title: The repository shall rely on ReviewMark to enforce peer-review tracking and reporting.
        tags: [quality]
        justification: |
          Peer-review compliance depends on ReviewMark's indexing, enforcement,
          elaboration, linting, and directory-override capabilities. This grouping
          requirement links those OTS requirements to the quality root so they
          participate in orphan detection without being falsely reported as
          disconnected from library functionality.
        children:
          - Speech-OTS-ReviewMark
          - Speech-OTS-ReviewMark-IndexScan
          - Speech-OTS-ReviewMark-Enforce
          - Speech-OTS-ReviewMark-Elaborate
          - Speech-OTS-ReviewMark-Lint
          - Speech-OTS-ReviewMark-DirectoryOverride

      - id: Quality-DocumentationGeneration
        title: The repository shall rely on Pandoc to convert documentation to HTML.
        tags: [quality]
        justification: |
          Documentation generation depends on Pandoc's format conversion. This
          grouping requirement links that OTS requirement to the quality root so it
