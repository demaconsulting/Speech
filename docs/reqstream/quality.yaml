---
# Repository quality requirements
#
# Each requirement states a repository or process outcome Speech needs (WHAT), never the
# tool that currently achieves it (HOW). The tool appears only as a `children:` link to its
# OTS requirement, so the outcome survives a tool change. Every OTS requirement for build,
# analysis, review, test, or documentation tooling is a child of one of these. Runtime OTS
# items are children of the requirement of the item that uses them instead.
sections:
  - title: Repository Quality Requirements
    requirements:
      - id: Speech-Quality-TestInfrastructure
        title: The repository shall execute its automated tests.
        tags: [quality]
        justification: |
          Every other quality claim depends on automated tests that run the same way on every
          platform. Satisfied by its children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-xUnit-Execute

      - id: Speech-Quality-TestReporting
        title: The repository shall report the results of its automated tests.
        tags: [quality]
        justification: |
          Requirements traceability and release evidence need machine-readable test results
          from every platform. Satisfied by its children: verification evidence is carried by
          their tests.
        children:
          - Speech-OTS-xUnit-Report

      - id: Speech-Quality-BuildIntegrity
        title: The repository's build pipeline shall generate build notes.
        tags: [quality]
        justification: |
          Each release needs an accurate record of what changed and what was built, so that
          the released artifacts can be traced to their sources. Satisfied by its children:
          verification evidence is carried by their tests.
        children:
          - Speech-OTS-BuildMark

      - id: Speech-Quality-VersionTracking
        title: The repository's build pipeline shall record the versions of the tools it uses.
        tags: [quality]
        justification: |
          A release is only reproducible and auditable when the exact tool versions that
          produced it are recorded. Satisfied by its children: verification evidence is carried
          by their tests.
        children:
          - Speech-OTS-VersionMark

      - id: Speech-Quality-VersionValidation
        title: The repository's build pipeline shall validate its tool-version configuration.
        tags: [quality]
        justification: |
          A malformed tool-version configuration would silently drop version records from the
          release evidence, so it must be rejected before the build proceeds. Satisfied by its
          children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-VersionMark-Lint

      - id: Speech-Quality-StaticAnalysis
        title: The repository shall enforce its static-analysis results.
        tags: [quality]
        justification: |
          Code quality assurance requires that static-analysis findings are reported and that
          unresolved findings fail the build. Satisfied by its children: verification evidence
          is carried by their tests.
        children:
          - Speech-OTS-SarifMark
          - Speech-OTS-SarifMark-Enforcement

      - id: Speech-Quality-QualityDashboard
        title: The repository shall report its quality-gate status.
        tags: [quality]
        justification: |
          Code quality visibility requires the quality-gate outcome to be captured in the
          release documentation. Satisfied by its children: verification evidence is carried by
          their tests.
        children:
          - Speech-OTS-SonarMark

      - id: Speech-Quality-PeerReview
        title: The repository shall enforce peer-review tracking and reporting.
        tags: [quality]
        justification: |
          Every change to reviewable files must be peer reviewed before release, and the
          review evidence must be indexed, checked for currency, and reported. Satisfied by its
          children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-ReviewMark
          - Speech-OTS-ReviewMark-IndexScan
          - Speech-OTS-ReviewMark-Enforce
          - Speech-OTS-ReviewMark-Elaborate
          - Speech-OTS-ReviewMark-Lint
          - Speech-OTS-ReviewMark-DirectoryOverride

      - id: Speech-Quality-DocumentationGeneration
        title: The repository shall convert its documentation to HTML.
        tags: [quality]
        justification: |
          The compliance documentation set is authored as Markdown and must be published in a
          reviewable rendered form. Satisfied by its children: verification evidence is carried
          by their tests.
        children:
          - Speech-OTS-Pandoc

      - id: Speech-Quality-PdfGeneration
        title: The repository shall render its documentation as PDF.
        tags: [quality]
        justification: |
          Release evidence is archived as fixed-layout documents that stay readable without
          the build tooling. Satisfied by its children: verification evidence is carried by
          their tests.
        children:
          - Speech-OTS-WeasyPrint

      - id: Speech-Quality-RequirementsTraceability
        title: The repository shall report requirements traceability.
        tags: [quality]
        justification: |
          Each requirement must be shown to be covered by passing test evidence. Satisfied by
          its children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-ReqStream

      - id: Speech-Quality-RequirementsLinting
        title: The repository shall lint its requirements.
        tags: [quality]
        justification: |
          Malformed or orphaned requirements would undermine traceability, so they must be
          rejected before the build proceeds. Satisfied by its children: verification
          evidence is carried by their tests.
        children:
          - Speech-OTS-ReqStream-Lint

      - id: Speech-Quality-GeneratedDocumentVerification
        title: The repository shall verify that its generated documents exist.
        tags: [quality]
        justification: |
          A documentation build that silently omits a document would leave gaps in the release
          evidence. Satisfied by its children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-FileAssert

      - id: Speech-Quality-SoftwareStructureModeling
        title: The repository shall lint its software-structure models.
        tags: [quality]
        justification: |
          The software-structure model is the authoritative description of the code structure,
          so an invalid model must be rejected before the build proceeds. Satisfied by its
          children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-SysML2Tools-Lint

      - id: Speech-Quality-SoftwareStructureRendering
        title: The repository shall render its software-structure diagrams.
        tags: [quality]
        justification: |
          The design documentation embeds diagrams derived from the software-structure model,
          so the diagrams must be regenerated from the model on every documentation build.
          Satisfied by its children: verification evidence is carried by their tests.
        children:
          - Speech-OTS-SysML2Tools-Render
