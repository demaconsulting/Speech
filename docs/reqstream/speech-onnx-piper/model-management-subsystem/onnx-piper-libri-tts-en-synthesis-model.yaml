---
# Software Unit Requirements for OnnxPiperLibriTtsEnSynthesisModel
#
# These requirements describe the behavior of the OnnxPiperLibriTtsEnSynthesisModel unit: the production synthesis model
# for the Piper English (US) voice en_US-libritts_r-medium, installed from its models-release bundle. They decompose the
# parent SpeechOnnxPiper ModelManagementSubsystem requirements. Covered by the OnnxPiperLibriTtsEnSynthesisModel_* tests
# in test/DemaConsulting.Speech.Onnx.Piper.Tests/ModelManagementSubsystem/OnnxPiperLibriTtsEnSynthesisModelTests.cs,
# which build tampered bundles and a stand-in ONNX graph with PiperTestFixtures and never touch the network or the real
# voice.

sections:
  - title: SpeechOnnxPiper Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: OnnxPiperLibriTtsEnSynthesisModel Requirements
            requirements:
              - id: SpeechOnnxPiper-Models-OnnxPiperLibriTtsEnSynthesisModel-Declaration
                title: >-
                  The OnnxPiperLibriTtsEnSynthesisModel class shall declare the stable identifier
                  piper-onnx-libritts-r-en-us-medium, the Synthesis role, the license CC BY 4.0 with its canonical
                  link, a preferred audio format of mono 22,050 Hz, no audio-tag support, the shared English
                  text analyzer (the same instance for every model instance), and a capability profile that joins
                  the clause pieces of a sentence (the core chunker splits at every comma, semicolon and colon)
                  into one segment, with their annotations moved to their place (a piece that the core chunker cut
                  at a dash or inside a long clause is joined as well), so that the voice speaks a
                  sentence as one utterance, while a sentence end (including a sentence boundary an analyzer
                  declared, even after a clause mark), a pause, silence, different parameter
                  overrides and a joined text beyond 300 characters remain boundaries.
                justification: |
                  The identifier is what a host stores and a catalog lists; the license is an attribution license
                  that a host must be able to read before it offers the voice; the audio format is the voice's own
                  rate; and the text analyzer is what the engine's reading-aware phonemization depends on. A voice
                  of this kind has no inline audio tags. The voice was trained on whole sentences with their commas
                  and swallows the first sound of a clause that is its own utterance (the recognizer proxy hears
                  the first word of a clause 90.6 percent of the time as its own utterance and 97.5 percent inside
                  its sentence), so the clause pieces are joined with no change to the core library.
                tests:
                  - OnnxPiperLibriTtsEnSynthesisModel_CatalogFacts_AreDeclared
                  - OnnxPiperLibriTtsEnSynthesisModel_CapabilityProfile_SentenceClauses_AreOneSegmentWithTheirAnnotations
                  - OnnxPiperLibriTtsEnSynthesisModel_CapabilityProfile_JoinsOnlyWhereNothingSetsTheClausesApart
                  - OnnxPiperLibriTtsEnSynthesisModel_CapabilityProfile_PauseTag_StaysABoundary
                  - OnnxPiperLibriTtsEnSynthesisModel_CapabilityProfile_AnalyzerSentenceBreakAfterClauseMark_StaysABoundary
                  - OnnxPiperLibriTtsEnSynthesisModel_CapabilityProfile_TagsAndLongSentences_KeepTheBoundariesAndTheBudget
              - id: SpeechOnnxPiper-Models-OnnxPiperLibriTtsEnSynthesisModel-SpeakerSelection
                title: >-
                  The OnnxPiperLibriTtsEnSynthesisModel class shall declare exactly one parameter, an integer
                  speaker number from 0 to 903 with the default 0, and shall resolve a host's parameter values to the
                  nearest whole speaker number within 0 to 903 (accepting a boxed double, int or float), selecting
                  speaker 0 for a missing bag, a missing value, a value that is not a finite number and a value
                  outside the range, without ever throwing.
                justification: |
                  The voice has 904 speakers that are identified only by number. A host user interface supplies
                  doubles, a stale or malformed value must not fail synthesis, and the default speaker is the
                  documented fallback.
                tests:
                  - OnnxPiperLibriTtsEnSynthesisModel_Parameters_AreTheSpeakerSelectionOnly
                  - OnnxPiperLibriTtsEnSynthesisModel_ResolveSpeakerId_Value_ResolvesOrFallsBackToZero

              - id: SpeechOnnxPiper-Models-OnnxPiperLibriTtsEnSynthesisModel-DownloadAndInstall
                title: >-
                  The OnnxPiperLibriTtsEnSynthesisModel class shall declare a download of exactly one file, the
                  bundle piper-en-us-libritts-r-medium-20261122-fp32-b1.zip on the project's models release, pinned
                  by the SHA-256 5196a8aa97f9053e0bdbbc2299007d48d55f37a74e88199869daebb710d8bd0f; shall pin the
                  bundle's three vendor files (en_US-libritts_r-medium.onnx, en_US-libritts_r-medium.onnx.json and
                  MODEL_CARD, installed at the installed root) by their SHA-256 with their original rhasspy/piper-voices
                  URLs as provenance; and its installation shall fail with an invalid-data error when an extracted
                  vendor file does not match its pin.
                justification: |
                  The zip hash is the integrity check of the only file the voice comes from, and hosting it on the
                  project's own release lets hosts that cannot reach Hugging Face install it. The per-file pins prove
                  the extracted files are the original vendor files, byte for byte, and the original URLs document
                  where they come from. Altered files must never be installed.
                tests:
                  - OnnxPiperLibriTtsEnSynthesisModel_BundleContents_PinsTheThreeVendorFiles
                  - OnnxPiperLibriTtsEnSynthesisModel_DownloadDescriptor_IsModelsReleaseBundle
                  - OnnxPiperLibriTtsEnSynthesisModel_InstallAsync_BundleWithWrongFile_Throws

              - id: SpeechOnnxPiper-Models-OnnxPiperLibriTtsEnSynthesisModel-BackendCreation
                title: >-
                  The OnnxPiperLibriTtsEnSynthesisModel class shall create a synthesis backend from an installed
                  directory that runs at 22,050 Hz, shall fail with an invalid-data error when the voice
                  configuration is unusable or does not describe exactly the 904-speaker, 22,050 Hz voice (a different
                  speaker count, more or fewer, is refused), shall
                  reject an empty directory argument, shall fail when the graph is missing, and shall create the
                  inference session with the model's preferred execution providers in order and the CPU provider as
                  the fallback when a preferred provider is unavailable.
                justification: |
                  Creating the backend is the only way a host gets speech out of the model, and it has to fail
                  clearly for an installation that cannot speak. A preferred provider is an opportunity, not a
                  requirement, so its absence must not fail the voice.
                tests:
                  - OnnxPiperLibriTtsEnSynthesisModel_CreateBackend_InstalledDirectory_ReturnsBackendAtVoiceRate
                  - OnnxPiperLibriTtsEnSynthesisModel_CreateBackend_UnusableInstallation_Throws
                  - OnnxPiperLibriTtsEnSynthesisModel_CreateBackend_ConfigurationOfAnotherVoice_Throws
                  - OnnxPiperLibriTtsEnSynthesisModel_CreateBackend_UnavailablePreferredProvider_FallsBackToCpu
