---
# Software Unit Requirements for NullSpeechDiagnostics
#
# These requirements describe the design-level behavior of the NullSpeechDiagnostics
# unit, decomposing the parent Diagnostics subsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: Diagnostics Requirements
        sections:
          - title: NullSpeechDiagnostics Requirements
            requirements:
              - id: Speech-Diagnostics-NullSpeechDiagnostics-Singleton
                title: >-
                  The Diagnostics subsystem shall always provide a ready-to-use default sink, and
                  every caller shall receive the same one.
                justification: |
                  A host that supplies no sink still needs a working one, and the default holds no
                  state, so sharing one avoids allocation and gives every caller identical behavior.
                tests:
                  - NullSpeechDiagnostics_Instance_ReadTwice_ReturnsSameInstance

              - id: Speech-Diagnostics-NullSpeechDiagnostics-NeverThrows
                title: >-
                  The default diagnostics sink shall discard every reported event without throwing, for
                  every severity and for null, empty, or non-empty category and message values.
                justification: |
                  A discard sink must never itself become the reason a caller's real audio,
                  model, recognition, or synthesis operation fails.
                tests:
                  - NullSpeechDiagnostics_Report_NormalEvent_DoesNotThrow
                  - NullSpeechDiagnostics_Report_NullOrEmptyArguments_DoesNotThrow
                  - NullSpeechDiagnostics_Report_AnyLevel_DoesNotThrow
