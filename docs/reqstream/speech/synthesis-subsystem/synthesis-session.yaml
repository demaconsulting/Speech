---
# Software Unit Requirements for SynthesisSession
#
# Covers SynthesisSession only. The units the session coordinates have their own requirement files
# in this folder: synthesis-backend.yaml, layer2-rendering.yaml, sentence-chunker.yaml,
# playback-audio-resampler.yaml and dedicated-worker.yaml. The fault type it surfaces is covered by
# synthesis-session-faulted-exception.yaml.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SynthesisSession Requirements
            requirements:
              - id: Speech-Synthesis-SynthesisSession-ChunkedPipeline
                title: >-
                  The SynthesisSession class shall normalize, tag-parse, and Layer 2
                  render input text into an ordered SpeechPlan, then synthesize each resulting
                  segment in order.
                justification: |
                  Chunking keeps each backend call short, so a host is not left waiting for an
                  entire utterance's inference to complete before hearing anything.
                tests:
                  - SynthesisSession_SynthesizeAsync_PlainText_YieldsAudioSegment
                  - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

              - id: Speech-Synthesis-SynthesisSession-SequentialSynthesis
                title: >-
                  The SynthesisSession class shall keep at most one backend call in flight at a
                  time, so that synthesis of a later segment never overlaps synthesis of an
                  earlier one.
                justification: |
                  Running exactly one backend call at a time keeps the session state machine
                  simple and the non-thread-safe backend safe.
                tests:
                  - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

              - id: Speech-Synthesis-SynthesisSession-StreamedPlayback
                title: >-
                  SpeakAsync shall write each segment to the playback device as soon as that
                  segment has been synthesized, rather than after the whole plan has been
                  synthesized.
                justification: |
                  Playback of an early sentence begins after only that sentence has been
                  synthesized, so a host starts producing audible speech without waiting for the
                  whole utterance's inference to complete.
                tests:
                  - SynthesisSession_SpeakAsync_MultiSentenceInput_WritesEachSegmentBeforeSynthesizingNext

              - id: Speech-Synthesis-SynthesisSession-FullFidelitySegmentList
                title: >-
                  SynthesizeAsync shall return the complete, ordered list of every synthesized
                  speech segment for the input text, including pure-silence pause segments,
                  rather than only speech-bearing segments.
                justification: |
                  A caller that wants the full fidelity of the rendered SpeechPlan - for example
                  to re-encode or inspect the synthesized output rather than merely hearing it -
                  must see every segment the rendering pipeline produced, including a pause tag's
                  silence, not a filtered subset.
                tests:
                  - SynthesisSession_SynthesizeAsync_ReturnsFullFidelitySegmentListIncludingSilence
                  - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

              - id: Speech-Synthesis-SynthesisSession-SynthesizeCompletesWhenAllSegmentsDone
                title: >-
                  SynthesizeAsync shall complete only once every segment has been synthesized.
                justification: |
                  A caller needs every segment together rather than an incremental result
                  surface, so the returned task must not complete early.
                tests:
                  - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

              - id: Speech-Synthesis-SynthesisSession-ContinuousPlayback
                title: >-
                  The SynthesisSession class shall start the playback device once per SpeakAsync
                  operation and play every segment of that operation through it in order, without
                  restarting the device per segment.
                justification: |
                  The playback device must be driven continuously across segments rather than
                  being restarted per segment, which would introduce audible gaps between them.
                tests:
                  - SynthesisSession_SpeakAsync_PlainText_StartsWritesAndStopsDevice
                  - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction

              - id: Speech-Synthesis-SynthesisSession-PlaybackDeviceReleased
                title: >-
                  The SynthesisSession class shall stop the playback device once the SpeakAsync
                  operation ends, including when playback or device start faults.
                justification: |
                  The playback device must be released when the operation ends for any reason,
                  so a fault never leaves the device held open.
                tests:
                  - SynthesisSession_SpeakAsync_PlainText_StartsWritesAndStopsDevice
                  - SynthesisSession_SpeakAsync_PlaybackDeviceWriteThrows_PropagatesAndStillStopsDevice
                  - SynthesisSession_SpeakAsync_PlaybackDeviceStartThrows_StillCallsStop

              - id: Speech-Synthesis-SynthesisSession-GenuinePlaybackDrainWait
                title: >-
                  The SynthesisSession class shall wait for the playback device to
                  report a fully drained pending-sample count, plus a small safety margin, before
                  stopping the device at the end of a SpeakAsync operation.
                justification: |
                  Treating "every segment enqueued" as "finished playing" would stop the playback
                  device and discard whatever audio the hardware had not yet actually rendered,
                  leaving the end of the speech inaudible. Waiting for
                  IAudioPlaybackDevice.PendingSampleCount to reach zero lets the full utterance
                  be heard before the device is stopped.
                tests:
                  - SynthesisSession_SpeakAsync_PlaybackDeviceReportsPendingSamples_WaitsForDrainBeforeStopping

              - id: Speech-Synthesis-SynthesisSession-DrainWaitCancellation
                title: >-
                  The SynthesisSession class shall exit the playback drain wait promptly when the
                  operation is canceled, rather than waiting out the full drain.
                justification: |
                  A host interrupting speech (for example barge-in) must not be held up by
                  audio still queued in the playback device, so cancellation must take effect
                  immediately even while the drain wait is in progress.
                tests:
                  - SynthesisSession_SpeakAsync_CanceledDuringDrainWait_ExitsWaitPromptly

              - id: Speech-Synthesis-SynthesisSession-OverlapNotAllowed
                title: >-
                  The SynthesisSession class shall throw InvalidOperationException
                  synchronously when SpeakAsync or SynthesizeAsync is called while an earlier call
                  on the same session is still in flight.
                justification: |
                  A session drives exactly one in-flight native synthesis call and one playback
                  stream at a time; a second overlapping call would race the same backend and
                  playback device. Rejecting the overlapping call immediately, rather than
                  queuing or interleaving it, keeps the session's behavior simple and
                  deterministic for callers.
                tests:
                  - SynthesisSession_SpeakAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException
                  - SynthesisSession_SynthesizeAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException

              - id: Speech-Synthesis-SynthesisSession-StateMachine
                title: >-
                  The SynthesisSession class shall raise StateChanged with the
                  documented SynthesisSessionState transition sequence for a successful operation
                  (Created, Starting, Running, Stopping, Stopped).
                justification: |
                  A host rendering UI state needs an authoritative, observable state machine
                  rather than inferring state from whether an awaited task has completed.
                tests:
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder

              - id: Speech-Synthesis-SynthesisSession-FaultingStateSequence
                title: >-
                  The SynthesisSession class shall raise StateChanged with the transition
                  sequence Starting, Running, Faulted for an operation that faults.
                justification: |
                  A host rendering UI state must be able to observe that an operation failed,
                  and that the session has become unusable, through the same state machine it
                  uses for success.
                tests:
                  - SynthesisSession_StateChanged_FaultingOperation_RaisesTransitionsEndingInFaulted

              - id: Speech-Synthesis-SynthesisSession-StateChangedOutsideLock
                title: >-
                  The SynthesisSession class shall invoke StateChanged handlers without holding
                  any lock that blocks reading the session's State from another thread.
                justification: |
                  A handler that blocks on, or reads, the session from another thread must never
                  be able to deadlock the session.
                tests:
                  - SynthesisSession_StateChanged_HandlerBlocksOnOtherThreadReadingState_DoesNotDeadlock

              - id: Speech-Synthesis-SynthesisSession-StateChangedHandlerIsolation
                title: >-
                  The SynthesisSession class shall isolate a StateChanged subscriber's handler
                  exception, reporting it through diagnostics rather than propagating it or
                  destabilizing the session.
                justification: |
                  A misbehaving subscriber must never be able to break the session it is merely
                  observing.
                tests:
                  - SynthesisSession_StateChanged_HandlerThrows_IsIsolatedAndDoesNotPropagate

              - id: Speech-Synthesis-SynthesisSession-HotReuse
                title: >-
                  The SynthesisSession class shall support repeated, non-overlapping
                  SpeakAsync/SynthesizeAsync calls on the same instance without requiring
                  reconstruction between calls.
                justification: |
                  A host doing repeated, low-latency synthesis (for example, many turns of a
                  voice conversation) must be able to reuse one session across turns rather than
                  recreating it per turn.
                tests:
                  - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction

              - id: Speech-Synthesis-SynthesisSession-FaultedIsTerminal
                title: >-
                  The SynthesisSession class shall transition to the terminal Faulted
                  state and report the fault through diagnostics when a non-cancellation failure
                  occurs during SpeakAsync/SynthesizeAsync.
                justification: |
                  Once a failure has occurred, the session's underlying native state is no longer
                  trusted to be consistent, so it must not be allowed back into reuse.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted

              - id: Speech-Synthesis-SynthesisSession-UnrequestedCancellationFaults
                title: >-
                  The SynthesisSession class shall treat an OperationCanceledException the
                  backend throws without any cancellation having been requested as a fault,
                  transitioning to Faulted rather than Stopped.
                justification: |
                  An unrequested cancellation from the backend is a genuine failure rather than
                  a clean stop, so it must not be mistaken for ordinary cancellation.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrowsUnrequestedOperationCanceledException_TransitionsToFaultedNotStopped

              - id: Speech-Synthesis-SynthesisSession-FaultedRejectsSubsequentCalls
                title: >-
                  The SynthesisSession class shall throw SynthesisSessionFaultedException wrapping
                  the original fault from every call made after the session has faulted, rather
                  than attempting to recover or silently resetting.
                justification: |
                  Allowing further calls on a faulted session to silently retry could produce
                  corrupted or misleading output. A caller must dispose a faulted session and
                  obtain a new one rather than being misled into believing recovery occurred.
                tests:
                  - SynthesisSession_SynthesizeAsync_AfterFault_ThrowsSynthesisSessionFaultedException

              - id: Speech-Synthesis-SynthesisSession-FaultContainment
                title: >-
                  The SynthesisSession class shall surface a synthesis-backend fault honestly to
                  the caller rather than hanging or crashing the process.
                justification: |
                  A model that fails mid-utterance must fail the caller's awaited task promptly
                  so a host can report the failure, per this library's "fail honestly, never
                  crash or hang" requirement for the synthesis pipeline.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted

              - id: Speech-Synthesis-SynthesisSession-PlaybackDeviceUnavailableContainment
                title: >-
                  The SynthesisSession class shall surface an unavailable playback device
                  honestly to the caller rather than hanging or crashing the process.
                justification: |
                  A playback device that drops must fail the caller's awaited task promptly so a
                  host can report the failure, per this library's "fail honestly, never crash or
                  hang" requirement for the synthesis pipeline.
                tests:
                  - SynthesisSession_SpeakAsync_PlaybackDeviceUnavailable_ThrowsRatherThanHanging

              - id: Speech-Synthesis-SynthesisSession-SpeakerSelection
                title: >-
                  The SynthesisSession class shall resolve the speaker id passed to
                  Generate by calling ISynthesisModel.ResolveSpeakerId against the
                  constructor-supplied parameterValues bag once per synthesized segment.
                justification: |
                  A model's declared voice-selection parameter (for example
                  SherpaOnnxKokoroEnglishSynthesisModel's 11-voice ChoiceParameter) must have a real
                  effect on synthesized output when a host selects a non-default voice, so the
                  speaker id is resolved from the selection for every synthesis model.
                tests:
                  - SynthesisSession_SynthesizeAsync_NoParameterValues_ResolvesDefaultSpeakerIdFromModel
                  - SynthesisSession_SynthesizeAsync_ParameterValuesSupplied_ResolvesSpeakerIdFromBag

              - id: Speech-Synthesis-SynthesisSession-SpeakerSelectionIndependentOfTagOverrides
                title: >-
                  The SynthesisSession class shall apply a selected speaker and an independent,
                  per-segment ParameterOverrides speed/volume override (Natural Language Audio
                  Tags) together in the same call, without either mechanism regressing the other.
                justification: |
                  Session-level voice selection and per-segment Natural Language Audio Tag
                  overrides are two independent mechanisms - a selected voice applies to the
                  whole session while a [fast]/[loud] tag applies only to the segment it
                  annotates - and both must keep working correctly at the same time.
                tests:
                  - SynthesisSession_SynthesizeAsync_ParameterValuesSuppliedAlongsideSpeedTag_BothMechanismsApplyIndependently

              - id: Speech-Synthesis-SynthesisSession-StopCancelsOperation
                title: >-
                  The SynthesisSession class shall cancel an in-flight SpeakAsync/SynthesizeAsync
                  operation when StopAsync is called.
                justification: |
                  A host must be able to interrupt speech immediately in response to a user
                  action (e.g. barge-in), without the cancellation racing or hanging.
                tests:
                  - SynthesisSession_StopAsync_WhileSpeaking_DoesNotCompleteUntilInFlightGenerateReturns
                  - SynthesisSession_StopAsync_RacingOperationCompletion_NeverThrowsObjectDisposedException

              - id: Speech-Synthesis-SynthesisSession-StopUnwindsToStopped
                title: >-
                  The SynthesisSession class shall unwind an operation canceled by StopAsync to
                  Stopped rather than Faulted when the native call honors the cancellation.
                justification: |
                  A requested stop is a clean outcome; reporting it as a fault would make the
                  session unusable after every barge-in.
                tests:
                  - SynthesisSession_StopAsync_WhileSpeaking_DoesNotCompleteUntilInFlightGenerateReturns

              - id: Speech-Synthesis-SynthesisSession-StopWhenIdle
                title: >-
                  The SynthesisSession class shall treat StopAsync as a safe no-op when no
                  operation is in flight.
                justification: |
                  A host calling Stop defensively (for example on every UI state change) must not
                  need to track whether speech is active, and must not see an error from an idle
                  session.
                tests:
                  - SynthesisSession_StopAsync_NoOperationInFlight_IsNoOp

              - id: Speech-Synthesis-SynthesisSession-DisposeReleasesLeaseOnce
                title: >-
                  The SynthesisSession class shall release its engine's exclusivity lease exactly
                  once across repeated or concurrent DisposeAsync calls.
                justification: |
                  Releasing the lease more than once would let a second session bind the engine
                  while the first still held it, and never releasing it would leak the engine's
                  exclusivity across repeated speak/stop cycles.
                tests:
                  - SynthesisSession_DisposeAsync_CalledTwice_ReleasesLeaseOnce
                  - SynthesisSession_DisposeAsync_CalledConcurrentlyTwice_BothCompleteAfterSingleTeardown

              - id: Speech-Synthesis-SynthesisSession-DisposedStateReporting
                title: >-
                  The SynthesisSession class shall throw ObjectDisposedException from an
                  operational member called after disposal.
                justification: |
                  A disposed session has released its backend lease, so any further synthesis would
                  touch released state; a host must be told unambiguously that the session is no
                  longer usable.
                tests:
                  - SynthesisSession_SynthesizeAsync_AfterDispose_ThrowsObjectDisposedException

              - id: Speech-Synthesis-SynthesisSession-DisposedReportsUnavailable
                title: >-
                  The SynthesisSession class shall report IsAvailable as false once disposed.
                justification: |
                  A host checking availability before using a session must see that a disposed
                  session can no longer perform an operation.
                tests:
                  - SynthesisSession_IsAvailable_BeforeAndAfterDispose_ReflectsLifecycle

              - id: Speech-Synthesis-SynthesisSession-DisposeWaitsForNativeCompletion
                title: >-
                  The SynthesisSession class shall not complete DisposeAsync until every native
                  backend call and playback-device start call the operation began has genuinely
                  returned, even when that call was abandoned by the dedicated worker.
                justification: |
                  If DisposeAsync returned while a native Generate call was still executing on a
                  background thread, the caller could dispose the owning engine and the
                  still-running call would touch freed native memory, crashing the process. The
                  session therefore tracks each native call's raw completion separately from the
                  abandon-aware task and awaits it before completing disposal.
                tests:
                  - SynthesisSession_DisposeAsync_RacingSpeakAsync_NeverDisposesBackendWhileOperationInFlight
                  - SynthesisSession_DisposeAsync_AfterRejectedOverlappingCall_StillAwaitsOriginalOperation

              - id: Speech-Synthesis-SynthesisSession-DisposeLeaseReleaseAfterNativeCompletion
                title: >-
                  The SynthesisSession class shall not release the engine's exclusivity lease
                  until every native backend call and playback-device start call the operation
                  began has genuinely returned, even when that call was abandoned by the
                  dedicated worker.
                justification: |
                  Releasing the lease while a native call is still running would let a second
                  session bind the engine and call the shared, non-thread-safe backend
                  concurrently with the still-running call.
                tests:
                  - SynthesisSession_DisposeAsync_WhileSpeaking_DoesNotReleaseLeaseBeforeOperationSettles
                  - SynthesisSession_DisposeAsync_AbandonedWorker_DoesNotReleaseLeaseUntilWorkerExits
                  - SynthesisSession_DisposeAsync_CalledAfterAbandonmentFault_DoesNotReleaseLeaseUntilNativeCallGenuinelyReturns

              - id: Speech-Synthesis-SynthesisSession-StopWaitsForNativeCompletion
                title: >-
                  The SynthesisSession class shall not complete StopAsync until every native
                  backend call and playback-device start call the operation began has genuinely
                  returned, even when that call was abandoned by the dedicated worker.
                justification: |
                  Reporting the operation stopped while a native call is still running would let
                  the caller dispose or reuse the shared backend under it.
                tests:
                  - SynthesisSession_StopAsync_AbandonedGenerate_DoesNotCompleteUntilNativeCallGenuinelyReturns

              - id: Speech-Synthesis-SynthesisSession-DeviceStopDeferredUntilStartReturns
                title: >-
                  The SynthesisSession class shall defer a playback-device Stop that follows an
                  abandoned device Start until that Start has genuinely returned.
                justification: |
                  A device Stop issued concurrently with an abandoned device Start would race the
                  same native device.
                tests:
                  - SynthesisSession_StopAsync_AbandonedDeviceStart_DoesNotCallDeviceStopUntilStartGenuinelyReturns

              - id: Speech-Synthesis-SynthesisSession-StopCallerTokenBoundsWaitOnly
                title: >-
                  A canceled token passed to SynthesisSession.StopAsync shall make the returned
                  task throw OperationCanceledException, bounding only that caller's own wait.
                justification: |
                  A caller that gives up waiting must be released by its own token.
                tests:
                  - SynthesisSession_StopAsync_CallerTokenPreCanceled_ThrowsButOperationStillStops

              - id: Speech-Synthesis-SynthesisSession-StopCallerTokenDoesNotAbortTeardown
                title: >-
                  A canceled token passed to SynthesisSession.StopAsync shall not abort the
                  teardown itself: the operation shall still be canceled and awaited to
                  completion.
                justification: |
                  A caller that gives up waiting must not leave the operation running or abandon
                  the cancel-and-await work other callers (and DisposeAsync) depend on.
                tests:
                  - SynthesisSession_StopAsync_CallerTokenPreCanceled_ThrowsButOperationStillStops

              - id: Speech-Synthesis-SynthesisSession-AbandonedNativeCallReturnsPromptly
                title: >-
                  When a cancellation request is not honored by a native backend call within the
                  dedicated worker's abandon timeout, the SynthesisSession class shall return the
                  canceled operation to its caller promptly, while the native call may still be
                  running.
                justification: |
                  A native call may never honor cancellation; a caller that cancels must be
                  released within a bounded time rather than waiting for a call it cannot
                  interrupt.
                tests:
                  - SynthesisSession_SpeakAsync_AbandonedGenerate_ReturnsCanceledOperationWhileNativeCallStillRunning

              - id: Speech-Synthesis-SynthesisSession-SlowDeviceStartDoesNotBlockCaller
                title: >-
                  The SynthesisSession class shall not block the caller's thread while the
                  playback device's native Start call is slow to return.
                justification: |
                  A slow native device start must not block the caller's thread.
                tests:
                  - SynthesisSession_SpeakAsync_SlowPlaybackDeviceStart_DoesNotBlockCaller

              - id: Speech-Synthesis-SynthesisSession-AbandonedNativeCallFaultTransition
                title: >-
                  When a cancellation request is not honored by a native backend call within the
                  dedicated worker's abandon timeout, the SynthesisSession class shall transition
                  to the terminal Faulted state.
                justification: |
                  An abandoned native call is still running against the shared, non-thread-safe
                  backend, so the session cannot honestly return to Stopped; faulting makes that
                  condition observable to the host.
                tests:
                  - SynthesisSession_AbandonedGenerate_FaultsSessionAndRejectsReuseImmediately

              - id: Speech-Synthesis-SynthesisSession-AbandonedNativeCallReportsDiagnostics
                title: >-
                  When a cancellation request is not honored by a native backend call within the
                  dedicated worker's abandon timeout, the SynthesisSession class shall report the
                  condition through diagnostics.
                justification: |
                  An abandoned native call is a failure the host operator must be able to see in
                  diagnostics, not only through the session state.
                tests:
                  - SynthesisSession_AbandonedGenerate_ReportsFaultThroughDiagnostics

              - id: Speech-Synthesis-SynthesisSession-AbandonedNativeCallRejectsReuse
                title: >-
                  After a native backend call has been abandoned, the SynthesisSession class shall
                  reject every subsequent operation with SynthesisSessionFaultedException until
                  the session is disposed.
                justification: |
                  Accepting a new operation would start a second concurrent native call against
                  the shared, non-thread-safe backend while the abandoned one is still running.
                  DisposeAsync still waits for the abandoned call as described by
                  Speech-Synthesis-SynthesisSession-DisposeWaitsForNativeCompletion.
                tests:
                  - SynthesisSession_AbandonedGenerate_FaultsSessionAndRejectsReuseImmediately

              - id: Speech-Synthesis-SynthesisSession-SilenceAndVolume
                title: >-
                  The SynthesisSession class shall write each segment's declared pre-silence and
                  post-silence to the playback device around that segment's audio, as the
                  segment's resampled audio is played.
                justification: |
                  Pause tags and sentence-ending ellipses are realized as silence durations, so
                  the silence must be written to the device in order around the segment's audio.
                tests:
                  - SynthesisSession_SpeakAsync_SegmentWithPreAndPostSilence_WritesSilenceAroundAudio

              - id: Speech-Synthesis-SynthesisSession-VolumeScaling
                title: >-
                  The SynthesisSession class shall apply a volume override as amplitude scaling
                  clamped to the range -1.0 to 1.0.
                justification: |
                  A volume tag is realized as post-hoc gain because backends have no native gain
                  input; clamping prevents a loud tag from producing out-of-range samples.
                tests:
                  - SynthesisSession_SynthesizeAsync_VolumeOverride_ScalesAndClampsSamples
