---
# Software Unit Requirements for SynthesisSession
#
# Covers SynthesisSession only. The units the session coordinates have their own requirement files
# in this folder: synthesis-backend.yaml, layer2-rendering.yaml, sentence-chunker.yaml,
# playback-audio-resampler.yaml and dedicated-worker.yaml. The fault type it surfaces is covered by
# synthesis-session-faulted-exception.yaml.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SynthesisSession Requirements
            requirements:
              - id: Speech-Synthesis-SynthesisSession-ChunkedPipeline
                title: >-
                  The SynthesisSession class shall normalize, tag-parse, and Layer 2
                  render input text into an ordered SpeechPlan, then synthesize each resulting
                  segment in order, one backend call in flight at a time, writing each segment to
                  the playback device (for SpeakAsync) as soon as that segment is synthesized
                  rather than after the whole plan is synthesized. Synthesis of a later segment
                  does not overlap synthesis of an earlier one. SynthesizeAsync returns the
                  complete, ordered segment list only once every segment has been synthesized.
                justification: |
                  Chunking keeps each backend call short, so playback of an early sentence can
                  begin after only that sentence has been synthesized, rather than a host waiting
                  for an entire utterance's inference to complete before hearing anything.
                  Running exactly one backend call at a time keeps the session state machine
                  simple and the non-thread-safe backend safe. SynthesizeAsync still returns a
                  single materialized, full-fidelity segment list
                  (see Speech-Synthesis-SynthesisSession-FullFidelitySegmentList) since a
                  caller inspecting or re-encoding the complete synthesized output needs every
                  segment together, not an incremental result surface.
                tests:
                  - SynthesisSession_SynthesizeAsync_PlainText_YieldsAudioSegment
                  - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

              - id: Speech-Synthesis-SynthesisSession-FullFidelitySegmentList
                title: >-
                  SynthesizeAsync shall return the complete, ordered list of every synthesized
                  speech segment for the input text, including pure-silence pause segments,
                  rather than only speech-bearing segments.
                justification: |
                  A caller that wants the full fidelity of the rendered SpeechPlan - for example
                  to re-encode or inspect the synthesized output rather than merely hearing it -
                  must see every segment the rendering pipeline produced, including a pause tag's
                  silence, not a filtered subset.
                tests:
                  - SynthesisSession_SynthesizeAsync_ReturnsFullFidelitySegmentListIncludingSilence

              - id: Speech-Synthesis-SynthesisSession-ContinuousPlayback
                title: >-
                  The SynthesisSession class shall start the playback device once, play
                  each segment's pre-silence, resampled audio, and post-silence in order, and stop
                  the device once playback of the operation ends or faults.
                justification: |
                  The playback device must be driven continuously across segments rather than
                  being restarted per segment, while still guaranteeing the device is released
                  when the operation ends for any reason.
                tests:
                  - SynthesisSession_SpeakAsync_SegmentWithPreAndPostSilence_WritesSilenceAroundAudio
                  - SynthesisSession_SpeakAsync_PlainText_StartsWritesAndStopsDevice
                  - SynthesisSession_SpeakAsync_PlaybackDeviceWriteThrows_PropagatesAndStillStopsDevice
                  - SynthesisSession_SpeakAsync_PlaybackDeviceStartThrows_StillCallsStop

              - id: Speech-Synthesis-SynthesisSession-GenuinePlaybackDrainWait
                title: >-
                  The SynthesisSession class shall wait for the playback device to
                  report a fully drained pending-sample count, plus a small safety margin, before
                  stopping the device at the end of a SpeakAsync operation, and shall exit that
                  wait promptly on cancellation rather than waiting out the full drain.
                justification: |
                  Confirmed via user testing: pressing "Play" in the demo's TTS panel flashed the
                  status from "Idle" to "Playing" for about a quarter second before flashing back
                  to "Idle" with no audible sound, on every model. Root cause was that the
                  playback loop treated "every segment enqueued" as "finished playing" and
                  immediately stopped the playback device (discarding whatever audio the hardware
                  had not yet actually rendered) as soon as the fire-and-forget Write calls
                  returned, rather than once the hardware had genuinely finished. Waiting for
                  IAudioPlaybackDevice.PendingSampleCount to reach zero closes that gap without
                  regressing existing cancellation behavior.
                tests:
                  - SynthesisSession_SpeakAsync_PlaybackDeviceReportsPendingSamples_WaitsForDrainBeforeStopping

              - id: Speech-Synthesis-SynthesisSession-OverlapNotAllowed
                title: >-
                  The SynthesisSession class shall throw InvalidOperationException
                  synchronously when SpeakAsync or SynthesizeAsync is called while an earlier call
                  on the same session is still in flight.
                justification: |
                  A session drives exactly one in-flight native synthesis call and one playback
                  stream at a time; a second overlapping call would race the same backend and
                  playback device. Rejecting the overlapping call immediately, rather than
                  queuing or interleaving it, keeps the session's behavior simple and
                  deterministic for callers.
                tests:
                  - SynthesisSession_SpeakAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException
                  - SynthesisSession_SynthesizeAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException

              - id: Speech-Synthesis-SynthesisSession-StateMachine
                title: >-
                  The SynthesisSession class shall raise StateChanged with the
                  documented SynthesisSessionState transition sequence for a successful operation
                  (Created, Starting, Running, Stopping, Stopped) and for a faulting operation
                  (ending in Faulted), raising StateChanged outside the session's internal lock
                  and isolating a subscriber's handler exception rather than propagating it or
                  destabilizing the session.
                justification: |
                  A host rendering UI state needs an authoritative, observable state machine, and
                  a misbehaving subscriber must never be able to break the session it is merely
                  observing. Handlers run outside the lock so a handler that blocks on, or reads,
                  the session from another thread can never deadlock it.
                tests:
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder
                  - SynthesisSession_StateChanged_HandlerThrows_IsIsolatedAndDoesNotPropagate
                  - SynthesisSession_StateChanged_HandlerBlocksOnOtherThreadReadingState_DoesNotDeadlock

              - id: Speech-Synthesis-SynthesisSession-HotReuse
                title: >-
                  The SynthesisSession class shall support repeated, non-overlapping
                  SpeakAsync/SynthesizeAsync calls on the same instance without requiring
                  reconstruction between calls.
                justification: |
                  A host doing repeated, low-latency synthesis (for example, many turns of a
                  voice conversation) must be able to reuse one session across turns rather than
                  recreating it per turn.
                tests:
                  - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction

              - id: Speech-Synthesis-SynthesisSession-FaultedIsTerminal
                title: >-
                  The SynthesisSession class shall transition to the terminal Faulted
                  state and report the fault through diagnostics when a non-cancellation failure
                  occurs during SpeakAsync/SynthesizeAsync - including an OperationCanceledException
                  the backend throws without any cancellation having been requested - and shall
                  throw SynthesisSessionFaultedException wrapping that same fault from every
                  subsequent call once faulted, rather than attempting to recover or silently
                  resetting.
                justification: |
                  Once a session has faulted, its underlying native state is no longer trusted to
                  be consistent; allowing further calls to silently retry could produce corrupted
                  or misleading output. A caller must dispose a faulted session and obtain a new
                  one rather than being misled into believing recovery occurred.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted
                  - SynthesisSession_SynthesizeAsync_AfterFault_ThrowsSynthesisSessionFaultedException
                  - SynthesisSession_SynthesizeAsync_BackendThrowsUnrequestedOperationCanceledException_TransitionsToFaultedNotStopped

              - id: Speech-Synthesis-SynthesisSession-FaultContainment
                title: >-
                  The SynthesisSession class shall surface a synthesis-backend fault or
                  an unavailable playback device honestly to the caller rather than hanging or
                  crashing the process.
                justification: |
                  A model that fails mid-utterance or a playback device that drops must fail the
                  caller's awaited task promptly so a host can report the failure, per this
                  library's "fail honestly, never crash or hang" requirement for the synthesis
                  pipeline.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted
                  - SynthesisSession_SpeakAsync_PlaybackDeviceUnavailable_ThrowsRatherThanHanging

              - id: Speech-Synthesis-SynthesisSession-SpeakerSelection
                title: >-
                  The SynthesisSession class shall resolve the speaker id passed to
                  Generate by calling ISynthesisModel.ResolveSpeakerId against the
                  constructor-supplied parameterValues bag once per synthesized segment, and this
                  resolution shall coexist correctly
                  with the independent, per-segment ParameterOverrides speed/volume mechanism
                  (Natural Language Audio Tags) without either mechanism regressing the other.
                justification: |
                  A model's declared voice-selection parameter (for example
                  SherpaOnnxKokoroEnglishSynthesisModel's 11-voice ChoiceParameter) must have a real
                  effect on synthesized output when a host selects a non-default voice, so the
                  speaker id is resolved from the selection for every synthesis model.
                  Session-level voice selection and per-segment Natural Language Audio Tag
                  overrides are two independent mechanisms - a selected voice applies to the
                  whole session while a [fast]/[loud] tag applies only to the segment it
                  annotates - and both must keep working correctly at the same time.
                tests:
                  - SynthesisSession_SynthesizeAsync_NoParameterValues_ResolvesDefaultSpeakerIdFromModel
                  - SynthesisSession_SynthesizeAsync_ParameterValuesSupplied_ResolvesSpeakerIdFromBag
                  - SynthesisSession_SynthesizeAsync_ParameterValuesSuppliedAlongsideSpeedTag_BothMechanismsApplyIndependently

              - id: Speech-Synthesis-SynthesisSession-StopCancelsOperation
                title: >-
                  The SynthesisSession class shall cancel an in-flight SpeakAsync/SynthesizeAsync
                  operation when StopAsync is called, with the cancelled operation unwinding to
                  Stopped rather than Faulted when the native call honors the cancellation.
                justification: |
                  A host must be able to interrupt speech immediately in response to a user
                  action (e.g. barge-in), without the cancellation racing or hanging.
                tests:
                  - SynthesisSession_StopAsync_WhileSpeaking_DoesNotCompleteUntilInFlightGenerateReturns
                  - SynthesisSession_StopAsync_RacingOperationCompletion_NeverThrowsObjectDisposedException

              - id: Speech-Synthesis-SynthesisSession-StopWhenIdle
                title: >-
                  The SynthesisSession class shall treat StopAsync as a safe no-op when no
                  operation is in flight.
                justification: |
                  A host calling Stop defensively (for example on every UI state change) must not
                  need to track whether speech is active, and must not see an error from an idle
                  session.
                tests:
                  - SynthesisSession_StopAsync_NoOperationInFlight_IsNoOp

              - id: Speech-Synthesis-SynthesisSession-DisposeReleasesLeaseOnce
                title: >-
                  The SynthesisSession class shall release its engine's exclusivity lease exactly
                  once across repeated or concurrent DisposeAsync calls.
                justification: |
                  Releasing the lease more than once would let a second session bind the engine
                  while the first still held it, and never releasing it would leak the engine's
                  exclusivity across repeated speak/stop cycles.
                tests:
                  - SynthesisSession_DisposeAsync_CalledTwice_ReleasesLeaseOnce
                  - SynthesisSession_DisposeAsync_CalledConcurrentlyTwice_BothCompleteAfterSingleTeardown

              - id: Speech-Synthesis-SynthesisSession-DisposedStateReporting
                title: >-
                  The SynthesisSession class shall throw ObjectDisposedException from an
                  operational member called after disposal and shall report IsAvailable as false
                  once disposed.
                justification: |
                  A disposed session has released its backend lease, so any further synthesis would
                  touch released state; a host must be told unambiguously that the session is no
                  longer usable.
                tests:
                  - SynthesisSession_SynthesizeAsync_AfterDispose_ThrowsObjectDisposedException
                  - SynthesisSession_IsAvailable_BeforeAndAfterDispose_ReflectsLifecycle

              - id: Speech-Synthesis-SynthesisSession-DisposeWaitsForNativeCompletion
                title: >-
                  The SynthesisSession class shall not complete DisposeAsync, and shall not release
                  the engine's exclusivity lease, until every native backend call and
                  playback-device start call the operation began has genuinely returned, even when
                  that call was abandoned by the dedicated worker.
                justification: |
                  A confirmed AccessViolationException crash occurred in an earlier design
                  because cancellation let control return to the caller while a native Generate
                  call was still executing on a background thread; the caller then disposed the
                  owning engine, and the still-running call touched freed native memory. The
                  session therefore tracks each native call's raw completion separately from the
                  abandon-aware task and awaits it before releasing the lease.
                tests:
                  - SynthesisSession_DisposeAsync_WhileSpeaking_DoesNotReleaseLeaseBeforeOperationSettles
                  - SynthesisSession_DisposeAsync_RacingSpeakAsync_NeverDisposesBackendWhileOperationInFlight
                  - SynthesisSession_DisposeAsync_AfterRejectedOverlappingCall_StillAwaitsOriginalOperation
                  - SynthesisSession_DisposeAsync_AbandonedWorker_DoesNotReleaseLeaseUntilWorkerExits
                  - SynthesisSession_DisposeAsync_CalledAfterAbandonmentFault_DoesNotReleaseLeaseUntilNativeCallGenuinelyReturns

              - id: Speech-Synthesis-SynthesisSession-StopWaitsForNativeCompletion
                title: >-
                  The SynthesisSession class shall not complete StopAsync until every native
                  backend call and playback-device start call the operation began has genuinely
                  returned, even when that call was abandoned by the dedicated worker, and shall
                  defer a playback-device Stop that follows an abandoned device Start until that
                  Start genuinely returns.
                justification: |
                  Reporting the operation stopped while a native call is still running would let
                  the caller dispose or reuse the shared backend under it. A device Stop issued
                  concurrently with an abandoned device Start would race the same native device.
                tests:
                  - SynthesisSession_StopAsync_AbandonedGenerate_DoesNotCompleteUntilNativeCallGenuinelyReturns
                  - SynthesisSession_StopAsync_AbandonedDeviceStart_DoesNotCallDeviceStopUntilStartGenuinelyReturns

              - id: Speech-Synthesis-SynthesisSession-StopCallerTokenBoundsWaitOnly
                title: >-
                  The cancellation token passed to SynthesisSession.StopAsync shall bound only that
                  caller's own wait, never the teardown itself: a canceled token shall make the
                  returned task throw while the operation is still cancelled and awaited to
                  completion.
                justification: |
                  A caller that gives up waiting must not leave the operation running or abandon
                  the cancel-and-await work other callers (and DisposeAsync) depend on.
                tests:
                  - SynthesisSession_StopAsync_CallerTokenPreCanceled_ThrowsButOperationStillStops

              - id: Speech-Synthesis-SynthesisSession-AbandonedNativeCallFaults
                title: >-
                  When a cancellation request is not honored by a native backend call within the
                  dedicated worker's abandon timeout, the SynthesisSession class shall return the
                  cancelled operation to its caller promptly, transition to the terminal Faulted
                  state, report the condition through diagnostics, and reject every subsequent
                  operation with SynthesisSessionFaultedException until the session is disposed.
                justification: |
                  An abandoned native call is still running against the shared, non-thread-safe
                  backend, so the session cannot honestly return to Stopped and accept a new
                  operation that would start a second concurrent native call. Faulting keeps the
                  caller's cancellation prompt while preventing backend reuse; DisposeAsync still
                  waits for the abandoned call as described by
                  Speech-Synthesis-SynthesisSession-DisposeWaitsForNativeCompletion.
                tests:
                  - SynthesisSession_AbandonedGenerate_FaultsSessionAndRejectsReuseImmediately
                  - SynthesisSession_SpeakAsync_SlowPlaybackDeviceStart_DoesNotBlockCaller

              - id: Speech-Synthesis-SynthesisSession-SilenceAndVolume
                title: >-
                  The SynthesisSession class shall write each segment's declared pre-silence and
                  post-silence to the playback device around that segment's audio, and shall apply
                  a volume override as amplitude scaling clamped to the range -1.0 to 1.0.
                justification: |
                  Pause tags and sentence-ending ellipses are realized as silence durations, and a
                  volume tag is realized as post-hoc gain because backends have no native gain
                  input; clamping prevents a loud tag from producing out-of-range samples.
                tests:
                  - SynthesisSession_SpeakAsync_SegmentWithPreAndPostSilence_WritesSilenceAroundAudio
                  - SynthesisSession_SynthesizeAsync_VolumeOverride_ScalesAndClampsSamples
