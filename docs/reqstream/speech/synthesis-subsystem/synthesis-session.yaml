---
# Software Unit Requirements for the real synthesis session implementation
#
# Groups requirements for SynthesisSession together with the synthesis-backend seam
# (ISynthesisBackend/ISynthesisBackendFactory), SynthesisSessionFaultedException, the Layer 2
# rendering pipeline (IModelCapabilityProfile/DefaultModelCapabilityProfile, SpeechSegment/
# SpeechPlan), the SentenceChunker, and the PlaybackAudioResampler, mirroring how
# sherpa-onnx-speech-recognizer.yaml groups a cohesive implementation unit. Each unit's
# requirement subset is called out in its own subsection below so every unit still has
# requirements tracing to it individually. Renamed/restructured from the former
# sherpa-onnx-speech-synthesizer.yaml for the async Engine/Session redesign: the former
# "SherpaOnnxSpeechSynthesizer Requirements" section becomes "SynthesisSession
# Requirements" (adding overlap-rule and faulted-terminal-state requirements), and the former
# "SynthesisEngine Requirements" section becomes "SynthesisBackend Requirements".

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SynthesisSession Requirements
            requirements:
              - id: Speech-Synthesis-SynthesisSession-ChunkedPipeline
                title: >-
                  The SynthesisSession class shall normalize, tag-parse, and Layer 2
                  render input text into an ordered SpeechPlan, then synthesize each resulting
                  segment in order, making each one available to playback as soon as it is ready
                  rather than waiting for the whole plan to finish synthesizing. SynthesizeAsync
                  returns the complete, ordered segment list only once every segment has been
                  synthesized; this chunked pipelining is an internal synthesis/playback
                  optimization, not a streaming result contract exposed to SynthesizeAsync's
                  caller.
                justification: |
                  The design requires chunked, low-latency synthesis so playback of an early
                  sentence can start while a later sentence is still being synthesized, rather
                  than a host waiting for an entire utterance's inference to complete before
                  hearing anything. SpeakAsync relies on this internal pipelining directly;
                  SynthesizeAsync still returns a single materialized, full-fidelity segment list
                  (see Speech-Synthesis-SynthesisSession-FullFidelitySegmentList) since a
                  caller inspecting or re-encoding the complete synthesized output needs every
                  segment together, not an incremental result surface.
                tests:
                  - SynthesisSession_SynthesizeAsync_PlainText_YieldsAudioSegment
                  - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

              - id: Speech-Synthesis-SynthesisSession-FullFidelitySegmentList
                title: >-
                  SynthesizeAsync shall return the complete, ordered list of every synthesized
                  speech segment for the input text, including pure-silence pause segments,
                  rather than only speech-bearing segments.
                justification: |
                  A caller that wants the full fidelity of the rendered SpeechPlan - for example
                  to re-encode or inspect the synthesized output rather than merely hearing it -
                  must see every segment the rendering pipeline produced, including a pause tag's
                  silence, not a filtered subset.
                tests:
                  - SynthesisSession_SynthesizeAsync_ReturnsFullFidelitySegmentListIncludingSilence

              - id: Speech-Synthesis-SynthesisSession-PipelinedPlayback
                title: >-
                  The SynthesisSession class shall start the playback device once, play
                  each segment's pre-silence, resampled audio, and post-silence in order, and stop
                  the device once playback of the operation ends or faults.
                justification: |
                  This library's synthesize-while-playing-previous-chunk behavior requires that
                  the playback device is driven continuously across segments rather than being
                  restarted per segment, while still guaranteeing the device is released when the
                  operation ends for any reason.
                tests:
                  - SynthesisSession_SpeakAsync_PlainText_StartsWritesAndStopsDevice
                  - SynthesisSession_SpeakAsync_PlaybackDeviceWriteThrows_PropagatesAndStillStopsDevice
                  - SynthesisSession_SpeakAsync_PlaybackDeviceStartThrows_StillCallsStop

              - id: Speech-Synthesis-SynthesisSession-GenuinePlaybackDrainWait
                title: >-
                  The SynthesisSession class shall wait for the playback device to
                  report a fully drained pending-sample count, plus a small safety margin, before
                  stopping the device at the end of a SpeakAsync operation, and shall exit that
                  wait promptly on cancellation rather than waiting out the full drain.
                justification: |
                  Confirmed via user testing: pressing "Play" in the demo's TTS panel flashed the
                  status from "Idle" to "Playing" for about a quarter second before flashing back
                  to "Idle" with no audible sound, on every model. Root cause was that the
                  playback loop treated "every segment enqueued" as "finished playing" and
                  immediately stopped the playback device (discarding whatever audio the hardware
                  had not yet actually rendered) as soon as the fire-and-forget Write calls
                  returned, rather than once the hardware had genuinely finished. Waiting for
                  IAudioPlaybackDevice.PendingSampleCount to reach zero closes that gap without
                  regressing existing cancellation behavior.
                tests:
                  - SynthesisSession_SpeakAsync_PlaybackDeviceReportsPendingSamples_WaitsForDrainBeforeStopping

              - id: Speech-Synthesis-SynthesisSession-OverlapNotAllowed
                title: >-
                  The SynthesisSession class shall throw InvalidOperationException
                  synchronously when SpeakAsync or SynthesizeAsync is called while an earlier call
                  on the same session is still in flight.
                justification: |
                  A session drives exactly one in-flight native synthesis call and one playback
                  stream at a time; a second overlapping call would race the same backend and
                  playback device. Rejecting the overlapping call immediately, rather than
                  queuing or interleaving it, keeps the session's behavior simple and
                  deterministic for callers.
                tests:
                  - SynthesisSession_SpeakAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException
                  - SynthesisSession_SynthesizeAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException

              - id: Speech-Synthesis-SynthesisSession-StateMachine
                title: >-
                  The SynthesisSession class shall raise StateChanged with the
                  documented SynthesisSessionState transition sequence for a successful operation
                  (Created, Starting, Running, Stopping, Stopped) and for a faulting operation
                  (ending in Faulted), isolating a subscriber's handler exception rather than
                  propagating it or destabilizing the session.
                justification: |
                  A host rendering UI state needs an authoritative, observable state machine, and
                  a misbehaving subscriber must never be able to break the session it is merely
                  observing.
                tests:
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder
                  - SynthesisSession_StateChanged_HandlerThrows_IsIsolatedAndDoesNotPropagate

              - id: Speech-Synthesis-SynthesisSession-HotReuse
                title: >-
                  The SynthesisSession class shall support repeated, non-overlapping
                  SpeakAsync/SynthesizeAsync calls on the same instance without requiring
                  reconstruction between calls.
                justification: |
                  A host doing repeated, low-latency synthesis (for example, many turns of a
                  voice conversation) must be able to reuse one session across turns rather than
                  recreating it per turn.
                tests:
                  - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction

              - id: Speech-Synthesis-SynthesisSession-FaultedIsTerminal
                title: >-
                  The SynthesisSession class shall transition to the terminal Faulted
                  state and report the fault through diagnostics when a non-cancellation failure
                  occurs during SpeakAsync/SynthesizeAsync, and shall throw
                  SynthesisSessionFaultedException wrapping that same fault from every subsequent
                  call once faulted, rather than attempting to recover or silently resetting.
                justification: |
                  Once a session has faulted, its underlying native state is no longer trusted to
                  be consistent; allowing further calls to silently retry could produce corrupted
                  or misleading output. A caller must dispose a faulted session and obtain a new
                  one rather than being misled into believing recovery occurred.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted
                  - SynthesisSession_SynthesizeAsync_AfterFault_ThrowsSynthesisSessionFaultedException

              - id: Speech-Synthesis-SynthesisSession-FaultContainment
                title: >-
                  The SynthesisSession class shall surface a synthesis-backend fault or
                  an unavailable playback device honestly to the caller rather than hanging or
                  crashing the process.
                justification: |
                  A model that fails mid-utterance or a playback device that drops must fail the
                  caller's awaited task promptly so a host can report the failure, per this
                  library's "fail honestly, never crash or hang" requirement for the synthesis
                  pipeline.
                tests:
                  - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted
                  - SynthesisSession_SpeakAsync_PlaybackDeviceUnavailable_ThrowsRatherThanHanging

              - id: Speech-Synthesis-SynthesisSession-SpeakerSelection
                title: >-
                  The SynthesisSession class shall resolve the speaker id passed to
                  Generate by calling ISynthesisModel.ResolveSpeakerId against the
                  constructor-supplied parameterValues bag once per synthesized segment, rather
                  than a hard-coded speakerId: 0, and this resolution shall coexist correctly
                  with the independent, per-segment ParameterOverrides speed/volume mechanism
                  (Natural Language Audio Tags) without either mechanism regressing the other.
                justification: |
                  Prior to this requirement, segment generation hard-coded speakerId: 0 for every
                  synthesis model, so a model's declared voice-selection parameter (for example
                  SherpaOnnxKokoroEnglishSynthesisModel's 11-voice ChoiceParameter) had no real
                  effect on synthesized output even when a host selected a non-default voice.
                  Session-level voice selection and per-segment Natural Language Audio Tag
                  overrides are two independent mechanisms - a selected voice applies to the
                  whole session while a [fast]/[loud] tag applies only to the segment it
                  annotates - and both must keep working correctly at the same time.
                tests:
                  - SynthesisSession_SynthesizeAsync_NoParameterValues_ResolvesDefaultSpeakerIdFromModel
                  - SynthesisSession_SynthesizeAsync_ParameterValuesSupplied_ResolvesSpeakerIdFromBag
                  - SynthesisSession_SynthesizeAsync_ParameterValuesSuppliedAlongsideSpeedTag_BothMechanismsApplyIndependently

              - id: Speech-Synthesis-SynthesisSession-CancellationAndLifecycle
                title: >-
                  The SynthesisSession class shall cancel an in-flight
                  SpeakAsync/SynthesizeAsync operation deterministically when StopAsync is
                  called, treat StopAsync as a safe no-op when idle, release its lease and
                  playback-device reference on disposal exactly once across repeated DisposeAsync
                  calls, and never return control from an in-flight operation until the
                  background producer - and any native backend call it may still be mid-way
                  through - has genuinely finished, even when enumeration/awaiting is abandoned
                  for a reason unrelated to cancellation.
                justification: |
                  A host must be able to interrupt speech immediately in response to a user
                  action (e.g. barge-in), without the cancellation racing or hanging, and must not
                  leak native inference resources across repeated speak/stop cycles. A confirmed
                  AccessViolationException crash occurred in the predecessor design because the
                  cancellation path let control return to the caller while the producer task was
                  still genuinely executing a native Generate call on a background thread; the
                  caller then disposed the owning engine, and the still-running native call
                  touched freed native memory. DedicatedWorker closes this gap by always awaiting
                  the in-flight native call's genuine completion, cooperative or abandoned, before
                  returning control on any exit path.
                tests:
                  - SynthesisSession_StopAsync_WhileSpeaking_DoesNotCompleteUntilInFlightGenerateReturns
                  - SynthesisSession_StopAsync_NoOperationInFlight_IsNoOp
                  - SynthesisSession_DisposeAsync_CalledTwice_ReleasesLeaseOnce
                  - SynthesisSession_SynthesizeAsync_AfterDispose_ThrowsObjectDisposedException
                  - SynthesisSession_IsAvailable_BeforeAndAfterDispose_ReflectsLifecycle

          - title: SynthesisSessionFaultedException Requirements
            requirements:
              - id: Speech-Synthesis-SynthesisSessionFaultedException-Thrown
                title: >-
                  The SynthesisSessionFaultedException class shall be the documented exception
                  type thrown by SynthesisSession for every call made after it has
                  transitioned to the terminal Faulted state, wrapping the original fault as its
                  inner exception.
                justification: |
                  A distinct, documented exception type lets a caller distinguish "this session
                  has already faulted and must be replaced" from an ordinary new failure, and the
                  wrapped inner exception preserves the original root cause for diagnostics.
                tests:
                  - SynthesisSession_SynthesizeAsync_AfterFault_ThrowsSynthesisSessionFaultedException

          - title: SynthesisBackend Requirements
            requirements:
              - id: Speech-Synthesis-SynthesisBackend-MockableSeam
                title: >-
                  The ISynthesisBackend/ISynthesisBackendFactory seam shall isolate all
                  speech-inference interop so the synthesis pipeline's chunking, Layer 2
                  rendering, session lifecycle, and playback can be verified without a downloaded
                  model or an installed speech-engine native runtime.
                justification: |
                  CI runners cannot be assumed to have a multi-hundred-megabyte speech model or a
                  platform-specific native inference binary available, so the synthesis logic must
                  be verifiable entirely in pure managed tests.
                tests:
                  - SpeechSynthesizerFactory_LoadAsync_ModelInstalled_ReturnsRealEngine
                  - SynthesisSession_SynthesizeAsync_PlainText_YieldsAudioSegment

              - id: Speech-Synthesis-SynthesisBackend-ModelOwnedConfiguration
                title: >-
                  The ISynthesisBackend seam shall load a backend using only the configuration the
                  selected model itself declares, reusing the already-referenced sherpa-onnx
                  package rather than adding a new native dependency.
                justification: |
                  The design makes each model's backing class responsible for its own backend
                  configuration, so that adding a new synthesis model is a self-contained,
                  reviewable unit of work that never requires changing the synthesis subsystem or
                  its native package reference.
                tests:
                  - ISynthesisModel_CreateBackend_InstalledDirectory_ReturnsSynthesisBackend
                  - SpeechSynthesizerFactory_LoadAsync_ModelInstalled_ReturnsRealEngine

          - title: Layer2Rendering Requirements
            requirements:
              - id: Speech-Synthesis-Layer2Rendering-PauseAlwaysSilence
                title: >-
                  The default Layer 2 rendering strategy shall always render a pause tag as a
                  real timed silence segment, regardless of a model's declared audio-tag support,
                  with a long pause rendering strictly longer than a short pause.
                justification: |
                  The design states that pauses require no model cooperation, so every
                  installed model - however limited its audio-tag support - can honor a pause
                  tag identically and correctly.
                tests:
                  - DefaultModelCapabilityProfile_Render_ShortPause_AlwaysRendersAsSilenceSegment
                  - DefaultModelCapabilityProfile_Render_LongPause_RendersLongerSilenceThanShortPause

              - id: Speech-Synthesis-Layer2Rendering-NativePassthrough
                title: >-
                  The default Layer 2 rendering strategy shall pass a tag through as its
                  canonical bracket text, unchanged, for a model that declares native audio-tag
                  support.
                justification: |
                  A model with native audio-tag support already understands the canonical bracket
                  syntax as a control token during its own inference, so the library must not
                  alter or strip it before the model sees it.
                tests:
                  - DefaultModelCapabilityProfile_Render_NativeSupport_PassesThroughCanonicalBracketText

              - id: Speech-Synthesis-Layer2Rendering-ParameterMappedApproximation
                title: >-
                  The default Layer 2 rendering strategy shall approximate a pace or
                  delivery/volume tag as a numeric parameter override on the surrounding segment
                  for a model declaring parameter-mapped audio-tag support, and shall silently
                  strip a tag with no built-in convention rather than failing.
                justification: |
                  This library's conservative risk mitigation for unsupported tags requires that
                  a model without native tag support still gets a reasonable, non-crashing
                  approximation of pace/volume intent, while intentionally conservative scope
                  means only the tags with a clear numeric convention are mapped; every other tag
                  safely degrades to plain narration instead of causing an error.
                tests:
                  - DefaultModelCapabilityProfile_Render_ParameterMappedSupport_FastTag_MapsToSpeedParameter
                  - DefaultModelCapabilityProfile_Render_ParameterMappedSupport_EmotionTag_StripsWithNoOverride

              - id: Speech-Synthesis-Layer2Rendering-NoneStripsAll
                title: >-
                  The default Layer 2 rendering strategy shall strip every tag to plain narration
                  text, except pauses, for a model declaring no audio-tag support.
                justification: |
                  This library's "never worse than plain narration" guarantee requires that a
                  model incapable of any tag rendering still narrates the underlying text
                  correctly rather than speaking literal bracket syntax aloud.
                tests:
                  - DefaultModelCapabilityProfile_Render_NoneSupport_StripsAllTags

              - id: Speech-Synthesis-Layer2Rendering-PlainTextChunking
                title: >-
                  The default Layer 2 rendering strategy shall split ordinary narration text into
                  sentence/clause-sized chunks using the SentenceChunker, producing one rendered
                  segment per chunk.
                justification: |
                  Chunked synthesis requires a Layer 2 boundary that lines up with natural speech
                  units so that pipelined synthesize-while-playing-previous behavior sounds
                  natural rather than cutting mid-word or mid-phrase.
                tests:
                  - DefaultModelCapabilityProfile_Render_PlainTextOnly_RendersChunkedSegments
                  - DefaultModelCapabilityProfile_Render_NullArguments_ThrowsArgumentNullException

              - id: Speech-Synthesis-Layer2Rendering-EllipsisPause
                title: >-
                  The default Layer 2 rendering strategy shall render a longer,
                  chunk-boundary-triggered pause after a chunk whose text ends in a genuine
                  ellipsis, distinct from the tag-triggered short/long pause durations, while
                  every other chunk boundary continues to add zero silence.
                justification: |
                  A genuine ellipsis (three or more consecutive '.' characters, with or without
                  interspersed whitespace) models a speaker naturally trailing off, which reads
                  unnaturally abrupt if followed immediately by the next chunk with no added
                  silence; this pause is driven purely by the shape of the already-chunked text,
                  not by an explicit [pause]/[long-pause] tag, so it is a separate mechanism from
                  - and does not reuse - the tag-triggered pause durations.
                tests:
                  - DefaultModelCapabilityProfile_Render_ChunkEndingInEllipsis_SetsLongerPostSilenceThanOrdinarySentenceEnd
                  - DefaultModelCapabilityProfile_Render_ChunkEndingInSpacedEllipsis_AlsoSetsEllipsisPostSilence

          - title: SentenceChunker Requirements
            requirements:
              - id: Speech-Synthesis-SentenceChunker-BoundarySplitting
                title: >-
                  The SentenceChunker class shall split text on primary sentence boundaries first,
                  then unconditionally split every resulting sentence-level piece further on
                  secondary clause boundaries regardless of length, falling back to a whitespace
                  budget only when a piece still exceeds the configured maximum chunk length.
                justification: |
                  Gating clause-level splitting behind the length budget let a long, multi-clause
                  sentence remain a single chunk until pipelined playback caught up to it, causing
                  an audible playback delay at the sentence boundary; splitting every clause
                  unconditionally keeps the audible gap at a clause boundary short and predictable
                  regardless of overall sentence length, while the whitespace-budget fallback still
                  guarantees no chunk exceeds the length a model or pipeline stage can handle in one
                  synthesis call.
                tests:
                  - SentenceChunker_Chunk_ShortSingleSentence_ReturnsOneChunk
                  - SentenceChunker_Chunk_MultipleSentences_SplitsOnPrimaryBoundaries
                  - SentenceChunker_Chunk_LongSentenceWithClauses_SplitsOnSecondaryBoundaries
                  - SentenceChunker_Chunk_LongClauseWithNoPunctuation_SplitsOnWhitespaceBudget
                  - SentenceChunker_Chunk_ShortSentenceWithComma_SplitsOnCommaEvenUnderBudget
                  - SentenceChunker_Chunk_ShortSentenceWithSemicolonOrColon_SplitsEvenUnderBudget

              - id: Speech-Synthesis-SentenceChunker-BoundaryHandling
                title: >-
                  The SentenceChunker class shall return a single word unsplit when the word
                  alone exceeds the configured maximum chunk length, and shall reject a
                  non-positive maximum chunk length or null text.
                justification: |
                  Splitting inside a single word would produce unintelligible synthesized audio,
                  so an over-length word must still be synthesized whole; a non-positive maximum
                  length or null text describes no meaningful chunking request and must be
                  rejected rather than silently producing corrupt output.
                tests:
                  - SentenceChunker_Chunk_SingleWordExceedsBudget_ReturnsWholeWord
                  - SentenceChunker_Chunk_NonPositiveMaxLength_ThrowsArgumentOutOfRangeException
                  - SentenceChunker_Chunk_NullText_ThrowsArgumentNullException

              - id: Speech-Synthesis-SentenceChunker-NumeralPunctuationRetention
                title: >-
                  The SentenceChunker class shall never treat primary or secondary boundary
                  punctuation embedded in a numeral as a clause/sentence boundary: a punctuation
                  character flanked by a digit on both sides (e.g. the ':' in "12:30", the ',' in
                  "1,000", or the '.' in "0.5"), and a decimal point followed immediately by a
                  digit with no digit and no letter before it (e.g. the leading '.' in ".5" or
                  "$.99"), must both stay attached to their numeral rather than splitting.
                justification: |
                  Splitting a time, thousands separator, or decimal point mid-numeral produces
                  meaningless fragments ("12:" / "30", "1," / "000", or "0" / "5") when the pieces
                  are later synthesized as separate chunks. This is especially harmful for a
                  bare-fraction decimal with no leading digit: before this exception, its leading
                  "." was indistinguishable from a sentence-ending period and was dropped as a
                  degenerate, word-less chunk by the DegeneratePunctuationMerging requirement
                  above, silencing the "point" when the number was spoken (".5" read as "five"
                  instead of "point five"). Excluding a letter-preceded period from this exception
                  (e.g. "Wait.5 more.") keeps a genuine sentence-ending period, immediately
                  followed by a digit with no space, splitting normally.
                tests:
                  - SentenceChunker_Chunk_ClausePunctuationEmbeddedInNumeral_StaysAttached
                  - SentenceChunker_Chunk_ShortSentenceWithSemicolonOrColon_SplitsEvenUnderBudget

              - id: Speech-Synthesis-SentenceChunker-ConsecutiveBoundaryMerging
                title: >-
                  The SentenceChunker class shall treat a maximal run of consecutive primary
                  sentence-ending characters (any combination of '.', '!', '?', such as an
                  ellipsis or a mixed terminator like "?!" or "!!") as a single boundary, splitting
                  only once after the last character of the run and keeping the whole run attached
                  to the sentence that precedes it, both mid-text and at the end of the text.
                justification: |
                  Splitting after every individual character in a run of terminal punctuation
                  produces degenerate chunks that are just a single punctuation character with no
                  other content; synthesizing such a near-empty chunk produces audible glitches and
                  artifacts regardless of which model performs the synthesis. Merging the run into
                  one boundary also matches how a human naturally pauses once at an ellipsis rather
                  than stopping once per character.
                tests:
                  - SentenceChunker_Chunk_MidSentenceEllipsis_StaysAttachedAsSingleChunk
                  - SentenceChunker_Chunk_MixedConsecutiveTerminators_StaysAttachedAsSingleChunk
                  - SentenceChunker_Chunk_RepeatedExclamations_StaysAttachedAsSingleChunk
                  - SentenceChunker_Chunk_SingleTerminators_NoRegression
                  - SentenceChunker_Chunk_TrailingEllipsis_NoDegenerateTrailingChunk

              - id: Speech-Synthesis-SentenceChunker-DegeneratePunctuationMerging
                title: >-
                  The SentenceChunker class shall never emit a chunk whose trimmed text contains
                  no letter or digit character at all, instead merging such a piece's text onto
                  the immediately preceding non-empty chunk, or dropping it if there is no
                  preceding chunk, uniformly for both primary and secondary boundary punctuation.
                justification: |
                  A piece that is nothing but punctuation and/or whitespace - for example a lone
                  comma or a whitespace-spaced run of dots such as ". . . . ." - is not a
                  meaningful unit of speech on its own; synthesizing it as its own chunk produces
                  audible glitches/artifacts and unnecessary chunk-boundary gaps. Merging its
                  punctuation onto the preceding chunk (or dropping it when nothing precedes it)
                  preserves the punctuation's cue while eliminating the degenerate chunk.
                tests:
                  - SentenceChunker_Chunk_SpacedPunctuationRun_MergesIntoPrecedingChunk
                  - SentenceChunker_Chunk_LoneSecondaryBoundaryWithNoWordContent_MergesIntoPrecedingChunk
                  - SentenceChunker_Chunk_LeadingDegenerateRun_IsDropped

              - id: Speech-Synthesis-SentenceChunker-EllipsisMetadata
                title: >-
                  The SentenceChunker class shall expose, per chunk via ChunkWithMetadata, whether
                  the chunk's final text ends in a genuine ellipsis (three or more consecutive '.'
                  characters, with or without interspersed whitespace), while Chunk continues to
                  return only chunk text with an unchanged signature for every existing caller.
                justification: |
                  A genuine ellipsis warrants a longer rendered pause than an ordinary
                  sentence-ending terminator to sound natural; exposing this as per-chunk metadata
                  lets a Layer 2 rendering strategy render that longer pause without SentenceChunker
                  itself taking on any audio-rendering responsibility, and keeping Chunk a pure
                  projection of ChunkWithMetadata's text guarantees no existing caller's output
                  changes.
                tests:
                  - SentenceChunker_ChunkWithMetadata_TrailingAdjacentEllipsis_EndsWithEllipsisIsTrue
                  - SentenceChunker_ChunkWithMetadata_TrailingSpacedEllipsis_EndsWithEllipsisIsTrue
                  - SentenceChunker_ChunkWithMetadata_FewerThanThreeDots_EndsWithEllipsisIsFalse
                  - SentenceChunker_Chunk_AndChunkWithMetadata_ProduceSameChunkText

          - title: PlaybackAudioResampler Requirements
            requirements:
              - id: Speech-Synthesis-PlaybackAudioResampler-RateConversion
                title: >-
                  The PlaybackAudioResampler class shall convert single-channel synthesized audio
                  from the engine's sample rate to the playback device's sample rate, producing a
                  proportional number of output samples, returning the input unchanged when the
                  two rates are equal, and applying anti-aliasing lowpass filtering before
                  decimation whenever it downsamples.
                justification: |
                  A synthesis engine produces audio at one fixed rate while a playback device
                  resolves whatever rate its hardware defaults to; without this conversion,
                  synthesized speech would only play correctly on a device that happened to match
                  the model's rate, mirroring the recognition-direction requirement that
                  resampling audio already matching would introduce avoidable error and cost. A
                  downsampling path that omits anti-aliasing folds above-target-Nyquist energy
                  back into the audible band and audibly degrades playback.
                tests:
                  - PlaybackAudioResampler_Resample_EqualRates_CopiesUnchanged
                  - PlaybackAudioResampler_Resample_Upsample_ProducesInterpolatedSamples
                  - PlaybackAudioResampler_Resample_Downsample_ReducesSampleCount
                  - PlaybackAudioResampler_Resample_AboveTargetNyquistTone_IsAttenuated
                  - PlaybackAudioResampler_Resample_ShortInputDuringDownsampling_DoesNotThrow
                  - PlaybackAudioResampler_Resample_EmptyInput_ReturnsEmpty

              - id: Speech-Synthesis-PlaybackAudioResampler-Upmix
                title: >-
                  The PlaybackAudioResampler class shall replicate single-channel audio across
                  every channel the playback device requires, leaving already single-channel
                  output unchanged when the device requires one channel, and shall reject a
                  non-positive channel count.
                justification: |
                  A playback device commonly requires stereo or multi-channel output while a
                  synthesis engine produces mono audio; replicating the single channel across every
                  output channel is the simplest correct upmix, and a non-positive channel count
                  describes no meaningful playback format and must be rejected.
                tests:
                  - PlaybackAudioResampler_UpmixToChannels_SingleChannel_CopiesUnchanged
                  - PlaybackAudioResampler_UpmixToChannels_MultipleChannels_ReplicatesEachFrame
                  - PlaybackAudioResampler_UpmixToChannels_EmptyInput_ReturnsEmpty
                  - PlaybackAudioResampler_UpmixToChannels_NonPositiveChannelCount_ThrowsArgumentOutOfRangeException

              - id: Speech-Synthesis-PlaybackAudioResampler-Composition
                title: >-
                  The PlaybackAudioResampler class shall expose a single Convert operation that
                  resamples and then upmixes engine-rate mono audio directly to the playback
                  device's rate and channel count.
                justification: |
                  The synthesis pipeline always needs both conversions applied together for every
                  segment it plays, so a single composed entry point avoids every caller having to
                  correctly sequence resample-then-upmix itself.
                tests:
                  - PlaybackAudioResampler_Convert_DifferentRateAndChannels_ResamplesThenUpmixes
                  - PlaybackAudioResampler_Convert_SingleChannelTarget_ReturnsResampledWithoutUpmix
