---
# Software Unit Requirements for UnavailableSpeechSynthesizerEngine
#
# Describes the honest-fallback engine returned when synthesis is not possible on this machine.
# Its companion exception, SpeechSynthesizerUnavailableException, has its own file
# (speech-synthesizer-unavailable-exception.yaml). The unavailable session is described in
# unavailable-synthesis-session.yaml.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: UnavailableSpeechSynthesizerEngine Requirements
            requirements:
              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-ReportsUnavailable
                title: >-
                  The UnavailableSpeechSynthesizerEngine class shall report IsAvailable as false.
                justification: |
                  A caller must be able to detect that synthesis is not possible on this machine.
                tests:
                  - UnavailableSpeechSynthesizerEngine_IsAvailable_Read_ReturnsFalse

              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-NeverThrowsWhenObtainedOrHeld
                title: >-
                  The UnavailableSpeechSynthesizerEngine class shall never throw merely for being
                  obtained or held.
                justification: |
                  A caller must always be able to safely obtain and hold a fallback engine, per
                  this library's "nothing throws at composition" decision.
                tests:
                  - UnavailableSpeechSynthesizerEngine_Instance_ObtainedRepeatedly_DoesNotThrowAndIsShared

              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-CreateSessionSucceeds
                title: >-
                  The UnavailableSpeechSynthesizerEngine class shall succeed when
                  CreateSessionAsync is invoked with a non-null device, returning the shared
                  UnavailableSynthesisSession.
                justification: |
                  Binding a device to an already unavailable engine is an ordinary (if useless)
                  composition, not an error.
                tests:
                  - UnavailableSpeechSynthesizerEngine_CreateSessionAsync_Always_ReturnsUnavailableSession

              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-CreateSessionRejectsNullDevice
                title: >-
                  The UnavailableSpeechSynthesizerEngine class shall reject a null device passed
                  to CreateSessionAsync with ArgumentNullException.
                justification: |
                  A null device argument is a programming error at the call site.
                tests:
                  - UnavailableSpeechSynthesizerEngine_CreateSessionAsync_NullDevice_ThrowsArgumentNullException

              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-OperationsThrow
                title: >-
                  An unavailable text-to-speech engine shall fail a request to speak text with a
                  documented unavailability error.
                justification: |
                  A caller that ignores the availability flag and asks the engine to speak has made
                  a programming error that must surface immediately rather than silently speaking
                  nothing.
                tests:
                  - UnavailableSpeechSynthesizerEngine_SpeakAsync_Always_ThrowsSpeechSynthesizerUnavailableException

              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-SynthesizeThrows
                title: >-
                  An unavailable text-to-speech engine shall fail a request to produce audio
                  without playback with a documented unavailability error.
                justification: |
                  A caller that ignores the availability flag and asks the engine for audio has made
                  a programming error that must surface immediately rather than silently returning
                  no audio.
                tests:
                  - UnavailableSpeechSynthesizerEngine_SynthesizeAsync_Always_ThrowsSpeechSynthesizerUnavailableException

              - id: Speech-Synthesis-UnavailableSpeechSynthesizerEngine-SafeDispose
                title: >-
                  The UnavailableSpeechSynthesizerEngine class shall treat disposal as a safe
                  no-op that never throws and never invalidates the shared fallback.
                justification: |
                  A host that wraps its engine in a disposal scope must be able to run that same
                  code unchanged on a machine where synthesis is unavailable.
                tests:
                  - UnavailableSpeechSynthesizerEngine_DisposeAsync_CalledTwice_DoesNotThrow
