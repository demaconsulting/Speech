---
# Software Unit Requirements for SynthesisEngineBusyException
#
# These requirements describe the exception SpeechSynthesizerEngine.CreateSessionAsync throws when
# the engine's exclusivity lease is already held, decomposing the parent SynthesisSubsystem
# requirements. The lease policy itself is covered by speech-synthesizer-engine.yaml.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SynthesisEngineBusyException Requirements
            requirements:
              - id: Speech-Synthesis-SynthesisEngineBusyException-Thrown
                title: >-
                  The SynthesisEngineBusyException class shall be the documented exception type
                  thrown by CreateSessionAsync when a session is requested while an earlier
                  leased session is still live.
                justification: |
                  A distinct, documented exception type lets a caller distinguish "the engine is
                  busy with another session" from any other failure mode, and lets it decide
                  whether to retry after disposing its current session rather than treating the
                  failure as fatal.
                tests:
                  - SpeechSynthesizerEngine_CreateSessionAsync_LeaseAlreadyHeld_ThrowsSynthesisEngineBusyException

              - id: Speech-Synthesis-SynthesisEngineBusyException-StandardConstructors
                title: >-
                  The SynthesisEngineBusyException class shall provide standard exception
                  constructors that preserve the supplied message and inner exception.
                justification: |
                  Standard constructors let callers and tests create the exception in the usual
                  .NET way, with the message and cause intact for diagnostics.
                tests:
                  - SynthesisEngineBusyException_Constructors_PreserveMessageAndInnerException
