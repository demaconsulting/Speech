---
# Software Unit Requirements for SpeechSynthesizerEngine
#
# Describes the design-level behavior of SpeechSynthesizerEngine's own session-creation and
# lease-tracking logic: an engine hosts at most one live ISynthesisSession at a time, and
# disposes its leased session before its backend. SynthesisEngineBusyException, the signal for a
# second concurrent session request, has its own file (synthesis-engine-busy-exception.yaml).
# Mirrors the recognition direction's speech-recognizer-engine.yaml for the async Engine/Session
# redesign.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SpeechSynthesizerEngine Requirements
            requirements:
              - id: Speech-Synthesis-SpeechSynthesizerEngine-SessionExclusivity
                title: >-
                  The SpeechSynthesizerEngine class shall allow at most one live
                  ISynthesisSession to be leased from it at a time, throwing
                  SynthesisEngineBusyException synchronously from CreateSessionAsync when a
                  session is requested while an earlier leased session has not yet been disposed,
                  and succeeding again once that session is disposed.
                justification: |
                  A single loaded model (Layer 3 engine) owns one native inference context; two
                  concurrently live sessions bound to two different playback devices would race
                  against that same native context and corrupt either or both synthesis streams.
                  Failing the second CreateSessionAsync call fast and synchronously, rather than
                  queuing or silently sharing the engine, gives a caller an unambiguous signal to
                  dispose its current session before requesting another.
                children:
                  - Speech-Synthesis-ISpeechSynthesizerEngine-SessionCreationContract
                tests:
                  - SpeechSynthesizerEngine_CreateSessionAsync_NoLeaseHeld_ReturnsRealSession
                  - SpeechSynthesizerEngine_CreateSessionAsync_LeaseAlreadyHeld_ThrowsSynthesisEngineBusyException
                  - SpeechSynthesizerEngine_CreateSessionAsync_AfterPriorSessionDisposed_SucceedsAgain
                  - SpeechSynthesizerEngine_CreateSessionAsync_NullDevice_ThrowsArgumentNullException

              - id: Speech-Synthesis-SpeechSynthesizerEngine-DisposalOrdering
                title: >-
                  The SpeechSynthesizerEngine class shall dispose its active leased
                  session, if any, before disposing its owned backend, and shall dispose its
                  backend exactly once across repeated DisposeAsync calls.
                justification: |
                  Disposing the backend (and its native inference context) while a leased session
                  may still be mid-operation would leave the session holding a reference to
                  already-freed native resources; disposing the session first guarantees any
                  in-flight native call has genuinely returned before the backend itself is torn
                  down. Repeated disposal must remain a safe no-op, matching every other
                  disposable type in this library.
                tests:
                  - SpeechSynthesizerEngine_DisposeAsync_WithActiveLeasedSession_DisposesSessionFirst
                  - SpeechSynthesizerEngine_DisposeAsync_CalledTwice_DisposesBackendOnce
