---
# Software Unit Requirements for the SentenceChunker
sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SentenceChunker Requirements
            requirements:
              - id: Speech-Synthesis-SentenceChunker-BoundarySplitting
                title: >-
                  The SentenceChunker class shall split text into separate chunks at each primary
                  sentence boundary.
                justification: |
                  A sentence is the natural unit of speech; synthesizing and playing one sentence
                  at a time keeps each backend call short and the audible gap at a sentence end
                  predictable.
                tests:
                  - SentenceChunker_Chunk_ShortSingleSentence_ReturnsOneChunk
                  - SentenceChunker_Chunk_MultipleSentences_SplitsOnPrimaryBoundaries

              - id: Speech-Synthesis-SentenceChunker-SecondaryBoundarySplitting
                title: >-
                  The SentenceChunker class shall further split every sentence-level piece on its
                  secondary clause boundaries regardless of the piece's length.
                justification: |
                  Splitting every clause unconditionally keeps the audible gap at a clause
                  boundary short and predictable regardless of overall sentence length. A long,
                  multi-clause sentence left as a single chunk would cause an audible playback
                  delay at the sentence boundary.
                tests:
                  - SentenceChunker_Chunk_LongSentenceWithClauses_SplitsOnSecondaryBoundaries
                  - SentenceChunker_Chunk_ShortSentenceWithComma_SplitsOnCommaEvenUnderBudget
                  - SentenceChunker_Chunk_ShortSentenceWithSemicolonOrColon_SplitsEvenUnderBudget

              - id: Speech-Synthesis-SentenceChunker-WhitespaceBudgetFallback
                title: >-
                  The SentenceChunker class shall split a piece that still exceeds the configured
                  maximum chunk length at whitespace, so that no chunk exceeds that length unless
                  it is a single word.
                justification: |
                  The whitespace-budget fallback guarantees no chunk exceeds the length a model
                  or pipeline stage can handle in one synthesis call when a piece has no usable
                  punctuation.
                tests:
                  - SentenceChunker_Chunk_LongClauseWithNoPunctuation_SplitsOnWhitespaceBudget

              - id: Speech-Synthesis-SentenceChunker-BoundaryHandling
                title: >-
                  The SentenceChunker class shall return a single word unsplit when the word
                  alone exceeds the configured maximum chunk length.
                justification: |
                  Splitting inside a single word would produce unintelligible synthesized audio,
                  so an over-length word must still be synthesized whole.
                tests:
                  - SentenceChunker_Chunk_SingleWordExceedsBudget_ReturnsWholeWord

              - id: Speech-Synthesis-SentenceChunker-NonPositiveMaxLengthRejection
                title: >-
                  The SentenceChunker class shall reject a non-positive maximum chunk length with
                  ArgumentOutOfRangeException.
                justification: |
                  A non-positive maximum length describes no meaningful chunking request and must
                  be rejected rather than silently producing corrupt output.
                tests:
                  - SentenceChunker_Chunk_NonPositiveMaxLength_ThrowsArgumentOutOfRangeException

              - id: Speech-Synthesis-SentenceChunker-NullTextRejection
                title: >-
                  The SentenceChunker class shall reject null text with ArgumentNullException.
                justification: |
                  Null text describes no meaningful chunking request; failing fast surfaces the
                  caller bug at the call site.
                tests:
                  - SentenceChunker_Chunk_NullText_ThrowsArgumentNullException

              - id: Speech-Synthesis-SentenceChunker-NumeralPunctuationRetention
                title: >-
                  The SentenceChunker class shall never treat primary or secondary boundary
                  punctuation flanked by a digit on both sides (e.g. the ':' in "12:30", the ','
                  in "1,000", or the '.' in "0.5") as a clause/sentence boundary.
                justification: |
                  Splitting a time, thousands separator, or decimal point mid-numeral produces
                  meaningless fragments ("12:" / "30", "1," / "000", or "0" / "5") when the pieces
                  are later synthesized as separate chunks.
                tests:
                  - SentenceChunker_Chunk_ClausePunctuationEmbeddedInNumeral_StaysAttached

              - id: Speech-Synthesis-SentenceChunker-LeadingDecimalPointRetention
                title: >-
                  The SentenceChunker class shall keep a decimal point that is followed
                  immediately by a digit, with no digit and no letter before it (e.g. the leading
                  '.' in ".5" or "$.99"), attached to its numeral rather than splitting there.
                justification: |
                  A bare-fraction decimal's leading "." would otherwise be indistinguishable from
                  a sentence-ending period and be dropped as a degenerate, word-less chunk (see
                  the DegeneratePunctuationMerging requirement), silencing the "point" when the
                  number was spoken (".5" read as "five" instead of "point five").
                tests:
                  - SentenceChunker_Chunk_LeadingDecimalPoint_StaysAttached

              - id: Speech-Synthesis-SentenceChunker-LetterPrecededPeriodSplits
                title: >-
                  The SentenceChunker class shall split normally after a period preceded by a
                  letter and followed immediately by a digit with no space (e.g. "Wait.5 more.").
                justification: |
                  Excluding a letter-preceded period from the numeral rules keeps a genuine
                  sentence-ending period, immediately followed by a digit, splitting normally.
                tests:
                  - SentenceChunker_Chunk_LetterPrecededPeriodFollowedByDigit_Splits

              - id: Speech-Synthesis-SentenceChunker-ConsecutiveBoundaryMerging
                title: >-
                  The SentenceChunker class shall treat a maximal run of consecutive primary
                  sentence-ending characters ('.', '!', '?') inside the text as a single
                  boundary, keeping the whole run attached to the sentence that precedes it.
                justification: |
                  Splitting after every individual character in a run of terminal punctuation
                  (an ellipsis, or a mixed terminator such as "?!" or "!!") produces degenerate
                  chunks that are just a single punctuation character with no other content;
                  synthesizing such a near-empty chunk produces audible glitches and artifacts
                  regardless of which model performs the synthesis. Merging the run into one
                  boundary also matches how a human naturally pauses once at an ellipsis rather
                  than stopping once per character.
                tests:
                  - SentenceChunker_Chunk_MidSentenceEllipsis_StaysAttachedAsSingleChunk
                  - SentenceChunker_Chunk_MixedConsecutiveTerminators_StaysAttachedAsSingleChunk
                  - SentenceChunker_Chunk_RepeatedExclamations_StaysAttachedAsSingleChunk
                  - SentenceChunker_Chunk_SingleTerminators_NoRegression

              - id: Speech-Synthesis-SentenceChunker-TrailingBoundaryRunNoDegenerateChunk
                title: >-
                  The SentenceChunker class shall keep a run of consecutive primary
                  sentence-ending characters at the end of the text attached to the final
                  sentence, emitting no trailing punctuation-only chunk.
                justification: |
                  A trailing ellipsis or mixed terminator would otherwise yield a final chunk
                  consisting only of punctuation, which synthesizes as a glitch.
                tests:
                  - SentenceChunker_Chunk_TrailingEllipsis_NoDegenerateTrailingChunk

              - id: Speech-Synthesis-SentenceChunker-DegeneratePunctuationMerging
                title: >-
                  The SentenceChunker class shall never emit a chunk whose trimmed text contains
                  no letter or digit character at all, for both primary and secondary boundary
                  punctuation.
                justification: |
                  A piece that is nothing but punctuation and/or whitespace - for example a lone
                  comma or a whitespace-spaced run of dots such as ". . . . ." - is not a
                  meaningful unit of speech on its own; synthesizing it as its own chunk produces
                  audible glitches/artifacts and unnecessary chunk-boundary gaps.
                tests:
                  - SentenceChunker_Chunk_SpacedPunctuationRun_MergesIntoPrecedingChunk
                  - SentenceChunker_Chunk_LoneSecondaryBoundaryWithNoWordContent_MergesIntoPrecedingChunk
                  - SentenceChunker_Chunk_LeadingDegenerateRun_IsDropped

              - id: Speech-Synthesis-SentenceChunker-DegeneratePunctuationMerged
                title: >-
                  The SentenceChunker class shall merge the text of a punctuation-only piece onto
                  the immediately preceding non-empty chunk.
                justification: |
                  Merging a degenerate piece's punctuation onto the preceding chunk preserves the
                  punctuation's cue while eliminating the degenerate chunk.
                tests:
                  - SentenceChunker_Chunk_SpacedPunctuationRun_MergesIntoPrecedingChunk
                  - SentenceChunker_Chunk_LoneSecondaryBoundaryWithNoWordContent_MergesIntoPrecedingChunk

              - id: Speech-Synthesis-SentenceChunker-DegeneratePunctuationDropped
                title: >-
                  The SentenceChunker class shall drop a punctuation-only piece that has no
                  preceding chunk.
                justification: |
                  A leading piece of nothing but punctuation has no chunk to merge into and
                  carries nothing to speak, so it is discarded rather than emitted as a chunk.
                tests:
                  - SentenceChunker_Chunk_LeadingDegenerateRun_IsDropped

              - id: Speech-Synthesis-SentenceChunker-EllipsisMetadata
                title: >-
                  The SentenceChunker class shall expose, per chunk via ChunkWithMetadata, whether
                  the chunk's final text ends in a genuine ellipsis (three or more consecutive '.'
                  characters, with or without interspersed whitespace).
                justification: |
                  A genuine ellipsis warrants a longer rendered pause than an ordinary
                  sentence-ending terminator to sound natural; exposing this as per-chunk metadata
                  lets a Layer 2 rendering strategy render that longer pause without SentenceChunker
                  itself taking on any audio-rendering responsibility.
                tests:
                  - SentenceChunker_ChunkWithMetadata_TrailingAdjacentEllipsis_EndsWithEllipsisIsTrue
                  - SentenceChunker_ChunkWithMetadata_TrailingSpacedEllipsis_EndsWithEllipsisIsTrue
                  - SentenceChunker_ChunkWithMetadata_FewerThanThreeDots_EndsWithEllipsisIsFalse

              - id: Speech-Synthesis-SentenceChunker-ChunkTextProjection
                title: >-
                  The SentenceChunker class shall return, from Chunk, only chunk text, identical
                  to the text of the chunks ChunkWithMetadata returns.
                justification: |
                  Keeping Chunk a pure projection of ChunkWithMetadata's text guarantees that
                  callers needing only chunk text see the same chunks regardless of which
                  operation they call.
                tests:
                  - SentenceChunker_Chunk_AndChunkWithMetadata_ProduceSameChunkText
