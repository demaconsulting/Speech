---
# Software Unit Requirements for ISynthesisSession
#
# These requirements describe the design-level behavior of the ISynthesisSession contract
# (Layer 5, bound to one device), its SynthesisSessionState/SessionStateChangedEventArgs
# supporting types, and the overlap-not-allowed rule, decomposing the parent SynthesisSubsystem
# requirements. The requirements are split between this file and
# i-speech-synthesizer-engine.yaml, mirroring the recognition-direction counterpart.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: ISynthesisSession Requirements
            requirements:
              - id: Speech-Synthesis-ISynthesisSession-AvailabilityFlag
                title: >-
                  The ISynthesisSession interface shall expose an IsAvailable flag that never
                  throws to read, reporting false for the shared unavailable session.
                justification: |
                  Callers must be able to check availability before invoking an operational
                  member, without risk of the check itself failing.
                tests:
                  - UnavailableSynthesisSession_IsAvailable_Read_ReturnsFalse

              - id: Speech-Synthesis-ISynthesisSession-AvailabilityFalseAfterFaultOrDispose
                title: >-
                  The ISynthesisSession interface shall report IsAvailable as false once a real
                  session has faulted or been disposed.
                justification: |
                  A session's availability must honestly reflect that it can no longer perform a
                  speak/synthesize operation once it has faulted or been disposed.
                tests:
                  - SynthesisSession_IsAvailable_BeforeAndAfterDispose_ReflectsLifecycle
                  - SynthesisSession_IsAvailable_AfterFault_ReturnsFalse

              - id: Speech-Synthesis-ISynthesisSession-StateMachine
                title: >-
                  The ISynthesisSession interface shall let a host read the session's current
                  lifecycle state and be notified whenever that state changes.
                justification: |
                  A host rendering UI state (for example a "speaking" indicator) needs an
                  authoritative, observable state rather than inferring state from whether an
                  awaited task has completed.
                tests:
                  - UnavailableSynthesisSession_State_Read_ReturnsCreated
                  - UnavailableSynthesisSession_StateChanged_SubscribeAndUnsubscribe_DoesNotThrow
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder

              - id: Speech-Synthesis-ISynthesisSession-StateMachineStates
                title: >-
                  The ISynthesisSession interface shall define the lifecycle states Created,
                  Starting, Running, Stopping, Stopped, and the terminal Faulted.
                justification: |
                  A closed, documented set of states lets a host handle every state a session can
                  report.
                tests:
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder
                  - SynthesisSession_StateChanged_FaultingOperation_RaisesTransitionsEndingInFaulted

              - id: Speech-Synthesis-ISynthesisSession-StateMachineOperationScope
                title: >-
                  The ISynthesisSession interface shall report the Starting, Running, and
                  Stopping states for one in-flight operation only, returning to Stopped after
                  each operation rather than remaining active as a continuous stream.
                justification: |
                  A host showing a "speaking" indicator must see it clear when an operation ends
                  while the session stays ready for the next one.
                tests:
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder
                  - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction

              - id: Speech-Synthesis-ISynthesisSession-StateMachineTransitionOrder
                title: >-
                  The ISynthesisSession interface shall raise the state transitions of a
                  successful operation in the documented order: Starting, Running, Stopping,
                  Stopped.
                justification: |
                  A host that reacts to transitions needs a predictable order.
                tests:
                  - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder

              - id: Speech-Synthesis-ISynthesisSession-StateMachineFaultTransition
                title: >-
                  The ISynthesisSession interface shall raise StateChanged transitions ending in
                  the terminal Faulted state for a faulting operation.
                justification: |
                  A host must be able to observe that an operation failed rather than inferring it
                  from exceptions alone.
                tests:
                  - SynthesisSession_StateChanged_FaultingOperation_RaisesTransitionsEndingInFaulted

              - id: Speech-Synthesis-ISynthesisSession-StateChangedSubscriberIsolation
                title: >-
                  The ISynthesisSession interface shall isolate a StateChanged subscriber's
                  handler exception rather than propagating it.
                justification: |
                  A misbehaving subscriber must never be able to destabilize the session it is
                  observing.
                tests:
                  - SynthesisSession_StateChanged_HandlerThrows_IsIsolatedAndDoesNotPropagate

              - id: Speech-Synthesis-ISynthesisSession-OverlapNotAllowed
                title: >-
                  The ISynthesisSession interface shall reject a SpeakAsync or SynthesizeAsync
                  call made while an earlier call on the same session is still in flight, by
                  throwing InvalidOperationException immediately, rather than queuing it or
                  running both concurrently.
                justification: |
                  A session owns exactly one bound playback device and one in-flight native
                  inference call at a time; allowing a second overlapping call would either
                  corrupt playback ordering or race two calls against the same native resources.
                  Rejecting the second call immediately gives a caller a clear, synchronous signal
                  to await the first operation (or call StopAsync) before starting another, rather
                  than silently misbehaving.
                tests:
                  - SynthesisSession_SpeakAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException
                  - SynthesisSession_SynthesizeAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException

              - id: Speech-Synthesis-ISynthesisSession-StreamingContract
                title: >-
                  The ISynthesisSession interface shall let a host synthesize text into audio
                  segments and speak text through the session's bound playback device, using only
                  engine-neutral types.
                justification: |
                  This library's "engine backend stays swappable at the public API surface"
                  decision requires that a future backend can replace the current one without a
                  breaking API change.
                tests:
                  - SynthesisSession_SynthesizeAsync_PlainText_YieldsAudioSegment
                  - SynthesisSession_SpeakAsync_PlainText_StartsWritesAndStopsDevice

              - id: Speech-Synthesis-ISynthesisSession-StopContract
                title: >-
                  The ISynthesisSession interface shall let a host cancel an in-flight operation
                  deterministically.
                justification: |
                  A host must be able to cut speech off on demand.
                tests:
                  - SynthesisSession_StopAsync_WhileSpeaking_DoesNotCompleteUntilInFlightGenerateReturns

              - id: Speech-Synthesis-ISynthesisSession-StopContractIdleNoOp
                title: >-
                  The ISynthesisSession interface shall treat a cancel request made when no
                  operation is in flight as a no-op.
                justification: |
                  Calling stop defensively must be safe.
                tests:
                  - SynthesisSession_StopAsync_NoOperationInFlight_IsNoOp

              - id: Speech-Synthesis-ISynthesisSession-DisposalContract
                title: >-
                  The ISynthesisSession interface shall define disposal of the resources a
                  session holds, safe to call repeatedly.
                justification: |
                  A session holds the engine's exclusivity lease, which a host must be able to
                  release deterministically.
                tests:
                  - SynthesisSession_DisposeAsync_CalledTwice_ReleasesLeaseOnce

              - id: Speech-Synthesis-ISynthesisSession-UnavailableOperationsThrow
                title: >-
                  Every operational member of the ISynthesisSession contract (SpeakAsync,
                  SynthesizeAsync) shall throw a documented exception when invoked on an
                  unavailable session, rather than silently no-op-ing or misbehaving.
                justification: |
                  Hosts must be able to test their playback logic against the contract with no
                  model, no speakers, and no native runtime present, so an unavailable session's
                  operational members must fail loudly and consistently rather than silently
                  doing nothing.
                tests:
                  - UnavailableSynthesisSession_SpeakAsync_Always_ThrowsSpeechSynthesizerUnavailableException
                  - UnavailableSynthesisSession_SpeakAsync_NullText_ThrowsArgumentNullException
                  - UnavailableSynthesisSession_SynthesizeAsync_Always_ThrowsSpeechSynthesizerUnavailableException
                  - UnavailableSynthesisSession_SynthesizeAsync_NullText_ThrowsArgumentNullException

              - id: Speech-Synthesis-ISynthesisSession-UnavailableStopAndDisposeSafe
                title: >-
                  StopAsync and disposal on an unavailable ISynthesisSession shall remain safe
                  no-ops.
                justification: |
                  A host that wraps its session in a disposal scope or stops defensively must be
                  able to run that same code unchanged where synthesis is unavailable.
                tests:
                  - UnavailableSynthesisSession_StopAsync_NoSessionInFlight_IsNoOp
                  - UnavailableSynthesisSession_DisposeAsync_CalledTwice_DoesNotThrow

              - id: Speech-Synthesis-ISynthesisSession-HotReuseAcrossTurns
                title: >-
                  The ISynthesisSession interface shall support many independent, non-overlapping
                  speak/synthesize operations on the same session instance without requiring the
                  session to be disposed and reconstructed between operations.
                justification: |
                  Obtaining an engine from SpeechSynthesizerFactory is the expensive step - it
                  loads the model into native memory - while a session bound to a device is cheap
                  to create and reuse. A host doing repeated, low-latency synthesis (for example,
                  many turns of a voice conversation) must be able to construct one session once
                  and reuse it across turns rather than reloading the model per turn.
                tests:
                  - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction
