---
# Software Unit Requirements for AudioTagParser
#
# These requirements describe the design-level behavior of AudioTagCatalog (the closed
# alias/kind lookup table) and AudioTagParser (the Layer 1 scanner that consumes it), decomposing
# the parent SynthesisSubsystem requirements. The two types are documented together since the
# parser carries no vocabulary knowledge of its own - it exists only to locate bracket syntax and
# delegate resolution to the catalog.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: AudioTagParser Requirements
            requirements:
              - id: Speech-Synthesis-AudioTagParser-VocabularyCompleteness
                title: >-
                  Every canonical Natural Language Audio Tag shall have at least one alias in
                  AudioTagCatalog.
                justification: |
                  A canonical tag with no reachable alias would be an unusable dead value. Proving
                  completeness against the enum itself, not a hand-copied list, keeps the catalog
                  from drifting out of sync with the vocabulary as it grows in a future release.
                tests:
                  - AudioTagCatalog_Tags_Always_CoversEveryCanonicalTagWithAtLeastOneAlias

              - id: Speech-Synthesis-AudioTagParser-AliasRoundTrip
                title: >-
                  Every documented alias shall resolve back to its own canonical tag and kind,
                  including the mood tags and the shout alias.
                justification: |
                  A stale or incorrect alias mapping would silently misclassify a host's intended
                  tag.
                tests:
                  - AudioTagCatalog_TryResolve_EveryDocumentedAlias_ResolvesToItsOwnTag
                  - AudioTagCatalog_TryResolve_MoodTagsAndShoutAlias_ResolveToExpectedTag

              - id: Speech-Synthesis-AudioTagParser-NoAliasAmbiguity
                title: >-
                  No single alias shall resolve to two different canonical tags.
                justification: |
                  Ambiguous alias resolution would make Layer 1 parsing non-deterministic and
                  impossible to document reliably in a user-facing tag reference.
                tests:
                  - AudioTagCatalog_Tags_Always_NoAliasIsSharedByTwoDifferentTags

              - id: Speech-Synthesis-AudioTagParser-KindGrouping
                title: >-
                  AudioTagCatalog shall report each canonical tag's kind alongside its resolved
                  value, matching this library's Emotion/Pace/Delivery-Volume/Non-verbal/
                  Pause/Emphasis grouping.
                justification: |
                  A later Layer 2 rendering stage and host UI code need to reason about a tag's
                  broad category (for example, "pauses always render as silence regardless of
                  model capability") without hard-coding the full tag list.
                tests:
                  - AudioTagCatalog_TryResolve_EveryDocumentedAlias_ResolvesToItsOwnTag
                  - AudioTagCatalog_TryResolve_MixedCaseWithExtraWhitespace_ResolvesToCanonicalTag
                  - AudioTagCatalog_Tags_EveryCanonicalTag_HasExpectedKind

              - id: Speech-Synthesis-AudioTagParser-VocabularyImmutability
                title: >-
                  AudioTagCatalog shall expose its tag table and each tag's alias list as read-only
                  collections that a caller cannot cast back to a mutable collection.
                justification: |
                  The vocabulary is closed and single-source-of-truth; a caller that could mutate
                  the shared static table would silently change parsing for the whole process.
                tests:
                  - AudioTagCatalog_Tags_Always_IsNotCastableToMutableList
                  - AudioTagCatalog_Tags_Always_AliasesAreNotCastableToMutableArray

              - id: Speech-Synthesis-AudioTagParser-NullTextRejection
                title: >-
                  AudioTagParser.Parse and TaggedTextSpan.PlainText shall throw
                  ArgumentNullException when given null text.
                justification: |
                  Null is a caller error, not text; failing fast avoids a later null dereference
                  and is distinct from the empty-input case, which yields an empty span list.
                tests:
                  - AudioTagParser_Parse_NullText_ThrowsArgumentNullException

              - id: Speech-Synthesis-AudioTagParser-CaseInsensitiveResolution
                title: >-
                  Alias resolution shall be case-insensitive.
                justification: |
                  A host or user typing a tag inline should not need to match the catalog's exact
                  canonical casing for a tag to be recognized.
                tests:
                  - AudioTagParser_Parse_UppercaseTag_ResolvesToCanonicalTag
                  - AudioTagCatalog_Normalize_VariousInputs_ProducesExpectedNormalForm

              - id: Speech-Synthesis-AudioTagParser-ExtraWhitespaceTolerance
                title: >-
                  Alias resolution shall tolerate extra leading, trailing, and internal
                  whitespace within bracket content.
                justification: |
                  Multi-word tags (for example "very slow") are easy to mistype with extra
                  spaces; rejecting those as unrecognized would defeat the vocabulary's purpose
                  for its most error-prone entries.
                tests:
                  - AudioTagParser_Parse_TagWithExtraInternalWhitespace_ResolvesToCanonicalTag
                  - AudioTagCatalog_TryResolve_MixedCaseWithExtraWhitespace_ResolvesToCanonicalTag

              - id: Speech-Synthesis-AudioTagParser-OrderedSpanSequence
                title: >-
                  AudioTagParser.Parse shall return the input's literal text and recognized tags
                  as an ordered sequence of spans that reconstructs the input's structure,
                  including plain text alone, empty input and mixed text and tags, with no
                  spurious empty spans.
                justification: |
                  A later Layer 2 rendering stage must be able to walk the parser's output in
                  order to build a SpeechPlan; any gap, duplication, or incorrect ordering would
                  corrupt the synthesized speech's structure.
                tests:
                  - AudioTagParser_Parse_PlainTextWithNoTags_ReturnsSinglePlainTextSpan
                  - AudioTagParser_Parse_EmptyInput_ReturnsEmptySpanList
                  - AudioTagParser_Parse_MixedPlainTextAndTag_ReturnsOrderedSpans

              - id: Speech-Synthesis-AudioTagParser-TagPlacementSpans
                title: >-
                  AudioTagParser.Parse shall return adjacent tags, and a tag at the very start or
                  end of the input, as separate tag spans in order without spurious empty text spans.
                justification: |
                  Tags are often placed at the edges of a sentence or back to back; boundary
                  handling errors would drop or duplicate a tag.
                tests:
                  - AudioTagParser_Parse_AdjacentTags_ReturnsTwoSeparateTagSpans
                  - AudioTagParser_Parse_TagAtStartOfText_ReturnsTagSpanFirst
                  - AudioTagParser_Parse_TagAtEndOfText_ReturnsTagSpanLast

              - id: Speech-Synthesis-AudioTagParser-MalformedPassthrough
                title: >-
                  AudioTagParser.Parse shall pass empty brackets, unclosed brackets, and stray
                  closing brackets through as literal text, exactly as they appeared, rather than
                  throwing or discarding them.
                justification: |
                  This library's "never worse than plain narration" guarantee requires that an
                  unbalanced bracket in host- or user-supplied text degrades to ordinary
                  narration rather than failing synthesis or silently losing content.
                tests:
                  - AudioTagParser_Parse_UnclosedOpeningBracket_PassesThroughAsLiteralText
                  - AudioTagParser_Parse_EmptyBrackets_PassesThroughAsLiteralText
                  - AudioTagParser_Parse_StrayClosingBracket_PassesThroughAsLiteralText

              - id: Speech-Synthesis-AudioTagParser-NestedBracketTagResolution
                title: >-
                  AudioTagParser.Parse shall still resolve a valid tag that follows a nested
                  opening bracket.
                justification: |
                  A stray opening bracket in front of a valid tag must not swallow the tag, or
                  the tag's intent would be lost for the sake of an unrelated typo.
                tests:
                  - AudioTagParser_Parse_NestedOpeningBracketBeforeValidTag_ResolvesTag

              - id: Speech-Synthesis-AudioTagParser-UnknownBracketPassthrough
                title: >-
                  AudioTagParser.Parse shall pass unrecognized bracket content through as literal
                  text, exactly as it appeared.
                justification: |
                  A typo or an unsupported bracket phrase must degrade to ordinary narration rather
                  than failing synthesis or silently losing content.
                tests:
                  - AudioTagParser_Parse_UnknownBracketedWord_PassesThroughAsLiteralText
                  - AudioTagParser_Parse_RecognizedTagFollowedByUnknownBracket_ReturnsTagThenLiteralSpans

              - id: Speech-Synthesis-AudioTagParser-UnknownContentUnresolved
                title: >-
                  AudioTagCatalog shall report unknown, empty, or whitespace-only content as
                  unresolved.
                justification: |
                  The parser relies on the catalog to say that content is not a tag, so that
                  bracketed text that is not a tag can be treated as ordinary narration.
                tests:
                  - AudioTagCatalog_TryResolve_UnknownWord_ReturnsFalse
                  - AudioTagCatalog_TryResolve_EmptyOrWhitespace_ReturnsFalse

              - id: Speech-Synthesis-AudioTagParser-NullContentRejection
                title: >-
                  AudioTagCatalog shall throw ArgumentNullException when asked to normalize or
                  resolve null content.
                justification: |
                  Null is a caller error, not text; failing fast avoids a later null dereference.
                tests:
                  - AudioTagCatalog_NormalizeAndTryResolve_NullContent_ThrowsArgumentNullException
