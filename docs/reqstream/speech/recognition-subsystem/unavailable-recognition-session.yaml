---
# Software Unit Requirements for UnavailableRecognitionSession
#
# These requirements describe the design-level behavior of the UnavailableRecognitionSession
# unit, decomposing the parent RecognitionSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: UnavailableRecognitionSession Requirements
            requirements:
              - id: Speech-Recognition-UnavailableRecognitionSession-ReportsUnavailable
                title: >-
                  The unavailable session shall report itself unavailable and never fail merely for
                  being obtained or held.
                justification: |
                  A caller must always be able to safely obtain and hold a fallback session, so
                  composition never fails.
                tests:
                  - UnavailableRecognitionSession_IsAvailable_Read_ReturnsFalse

              - id: Speech-Recognition-UnavailableRecognitionSession-OperationsThrow
                title: >-
                  Starting an unavailable session shall raise a documented unavailable exception.
                justification: |
                  A caller that ignores the availability flag and starts the session has made a
                  programming error that must surface immediately rather than silently
                  recognizing nothing.
                tests:
                  - UnavailableRecognitionSession_StartAsync_Always_ThrowsSpeechRecognizerUnavailableException

              - id: Speech-Recognition-UnavailableRecognitionSession-GetResultsThrows
                title: Reading results from an unavailable session shall raise a documented unavailable exception.
                justification: |
                  A caller that ignores the availability flag and reads results has made a
                  programming error that must surface rather than silently yielding nothing.
                tests:
                  - UnavailableRecognitionSession_GetResultsAsync_Always_ThrowsSpeechRecognizerUnavailableException

              - id: Speech-Recognition-UnavailableRecognitionSession-SafeNoOps
                title: >-
                  Stopping an unavailable session shall be a harmless no-op, however many times it
                  is repeated, and shall leave the shared fallback usable.
                justification: |
                  A host that calls StopAsync unconditionally during teardown must be able to run
                  that same code unchanged on a machine where recognition is unavailable.
                tests:
                  - UnavailableRecognitionSession_StopAsync_Always_IsSafeNoOp

              - id: Speech-Recognition-UnavailableRecognitionSession-DisposalIdempotent
                title: >-
                  Disposing an unavailable session shall be a harmless no-op, however many times it
                  is repeated, and shall leave the shared fallback usable.
                justification: |
                  A host that wraps its session in a disposal scope must be able to run that same
                  code unchanged on a machine where recognition is unavailable, including
                  disposing the shared fallback more than once.
                tests:
                  - UnavailableRecognitionSession_DisposeAsync_CalledTwice_DoesNotThrow
