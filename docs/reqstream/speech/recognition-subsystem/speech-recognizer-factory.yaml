---
# Software Unit Requirements for SpeechRecognizerFactory
#
# These requirements describe the design-level behavior of the SpeechRecognizerFactory unit,
# decomposing the parent RecognitionSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: SpeechRecognizerFactory Requirements
            requirements:
              - id: Speech-Recognition-SpeechRecognizerFactory-RealEngine
                title: >-
                  The factory shall return a working engine
                  when the requested model is installed, declares the recognition role, and its
                  recognition backend loads.
                justification: |
                  A single composition entry point keeps all "can this machine recognize speech
                  right now?" logic in one reviewable place, so a host never has to reason about
                  model installation and backend loading separately.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_ModelInstalled_ReturnsRealEngine
                  - SpeechRecognizerFactory_LoadAsync_WithStoreModelInstalled_ReturnsRealEngine
                  - SpeechRecognizerFactory_LoadAsync_WithCatalogModelInstalled_ReturnsRealEngine

              - id: Speech-Recognition-SpeechRecognizerFactory-HonestFallbacks
                title: >-
                  The factory shall return an unavailable engine, without failing, when the requested model is not installed
                  or the model does not declare the recognition role.
                justification: |
                  Per this library's "nothing throws at composition" decision, a model that has
                  not been downloaded yet is an ordinary state at application start-up, not a
                  programming error.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_ModelNotInstalled_ReturnsUnavailableEngine
                  - SpeechRecognizerFactory_LoadAsync_ModelRoleIsNotRecognition_ReturnsUnavailableEngine
                  - SpeechRecognizerFactory_LoadAsync_WithStoreModelNotInstalled_ReturnsUnavailableEngine
                  - SpeechRecognizerFactory_LoadAsync_WithCatalogModelNotInstalled_ReturnsUnavailableEngine

              - id: Speech-Recognition-SpeechRecognizerFactory-EngineLoadFailureFallback
                title: >-
                  The factory shall return an unavailable engine, without failing, when the
                  recognizer for an installed model cannot be loaded.
                justification: |
                  The design requires that "a model whose native runtime is absent must degrade
                  the same graceful way as a missing model file, never crash". A backend that
                  cannot load because of a missing native binary, an unsupported platform, or
                  corrupt model files must therefore not fail application start-up.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_EngineLoadFails_ReturnsUnavailableEngineAndDoesNotFaultTask

              - id: Speech-Recognition-SpeechRecognizerFactory-EngineLoadFailureReported
                title: >-
                  The factory shall report an Error diagnostic describing
                  the reason when the recognition backend for an installed model cannot be
                  loaded.
                justification: |
                  Degrading to an unavailable engine must not hide why recognition is
                  unavailable from a host that wired up a diagnostics sink.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_EngineLoadFails_ReturnsUnavailableEngineAndDoesNotFaultTask

              - id: Speech-Recognition-SpeechRecognizerFactory-ArgumentValidation
                title: >-
                  The factory shall reject a null model with an argument error.
                justification: |
                  A null model is a programming error at the call site, not an ordinary
                  "unavailable" machine state, and must fail immediately with a clear error
                  rather than being silently treated as unavailable.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_NullModel_FaultsWithArgumentNullException
                  - SpeechRecognizerFactory_LoadAsync_WithStoreNullModel_FaultsWithArgumentNullException
                  - SpeechRecognizerFactory_LoadAsync_WithCatalogNullModel_FaultsWithArgumentNullException

              - id: Speech-Recognition-SpeechRecognizerFactory-NullStoreRejected
                title: The factory shall reject a null model store with an argument error.
                justification: |
                  A null store is a programming error at the call site and must fail immediately.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_WithStoreNullStore_FaultsWithArgumentNullException

              - id: Speech-Recognition-SpeechRecognizerFactory-NullCatalogRejected
                title: The factory shall reject a null model catalog with an argument error.
                justification: |
                  A null catalog is a programming error at the call site and must fail immediately.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_WithCatalogNullCatalog_FaultsWithArgumentNullException

              - id: Speech-Recognition-SpeechRecognizerFactory-CancellationFault
                title: >-
                  The factory shall honor caller cancellation by ending with a cancellation outcome
                  when its cancellation token is canceled.
                justification: |
                  Caller cancellation is a caller decision and must fail rather
                  than being silently treated as unavailable.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_CanceledToken_FaultsWithOperationCanceledException
                  - SpeechRecognizerFactory_LoadAsync_CanceledDuringGraceWindowCreateSucceeds_ThrowsAndDisposesBackend

              - id: Speech-Recognition-SpeechRecognizerFactory-ParameterValuesForwarding
                title: >-
                  The factory shall pass a caller-supplied set of parameter values through to the
                  selected model when it configures the recognizer.
                justification: |
                  This carries a tunable value (for example a selected recognition language) from a
                  host's selection through to the recognition model's configuration, mirroring
                  the equivalent capability for voice selection in synthesis.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_ParameterValuesSupplied_ReachesModelCreateBackend
                  - SpeechRecognizerFactory_LoadAsync_WithStoreParameterValuesSupplied_ReachesModelCreateBackend
                  - SpeechRecognizerFactory_LoadAsync_WithCatalogParameterValuesSupplied_ReachesModelCreateBackend

              - id: Speech-Recognition-SpeechRecognizerFactory-ParameterValuesDefault
                title: The factory shall configure the recognizer without parameter values when the caller supplies none.
                justification: |
                  Most callers need no tunable values and must not have to construct an empty set.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_ModelInstalled_ReturnsRealEngine

              - id: Speech-Recognition-SpeechRecognizerFactory-UnrecognizedParameterIdIgnored
                title: >-
                  The factory shall silently ignore a supplied
                  parameter value that names a parameter not declared by the requested model,
                  still composing a real engine, while reporting an Info-level diagnostic naming
                  the ignored key.
                justification: |
                  A host reusing one settings dictionary across different recognition models
                  must not break composition just because a given model does not declare a
                  parameter another model had; this is a deliberate, documented
                  cross-model-compatibility contract, not a caller bug, so it must never fail
                  composition - only be surfaced as an informational diagnostic for a host that
                  wired up a sink.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_UnrecognizedParameterId_ComposesAndReportsInfo

              - id: Speech-Recognition-SpeechRecognizerFactory-InvalidRecognizedParameterValueThrows
                title: >-
                  The factory shall reject composition with an argument error when a supplied numeric parameter value is invalid for the
                  declared NumericParameter.
                justification: |
                  A host explicitly targeting a parameter it knows this model declares, with a
                  value invalid for it, is a caller bug rather than a legitimate cross-model
                  compatibility gap, and must be surfaced loudly rather than silently substituted
                  and discovered much later from confusing engine behavior. A numeric value is
                  invalid when it has the wrong CLR type, lies outside [Minimum, Maximum], or is
                  non-integral for a parameter declared IsInteger.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_RecognizedNumericParameterOutOfRange_FaultsWithArgumentException
                  - SpeechRecognizerFactory_LoadAsync_RecognizedNumericParameterWrongType_FaultsWithArgumentException

              - id: Speech-Recognition-SpeechRecognizerFactory-InvalidChoiceParameterValueThrows
                title: >-
                  The factory shall reject composition with an argument error when a supplied choice parameter value is not a declared
                  option.
                justification: |
                  A value outside the closed option set can never be honored and must be surfaced
                  loudly as an error.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_RecognizedChoiceParameterInvalidOption_FaultsWithArgumentException

              - id: Speech-Recognition-SpeechRecognizerFactory-InvalidBooleanParameterValueThrows
                title: >-
                  The factory shall reject composition with an argument error when a supplied boolean parameter value is not a bool.
                justification: |
                  A non-bool value cannot be interpreted as a flag and must be surfaced loudly
                  as an error.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_RecognizedBooleanParameterWrongType_FaultsWithArgumentException
