---
# Software Unit Requirements for SpeechRecognizerFactory
#
# These requirements describe the design-level behavior of the SpeechRecognizerFactory unit,
# decomposing the parent RecognitionSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: SpeechRecognizerFactory Requirements
            requirements:
              - id: Speech-Recognition-SpeechRecognizerFactory-RealRecognizer
                title: >-
                  The SpeechRecognizerFactory class shall return a working speech recognizer when
                  the requested model is installed, declares the recognition role, its engine
                  loads, and the supplied capture device is available.
                justification: |
                  A single composition entry point keeps all "can this machine recognize speech
                  right now?" logic in one reviewable place, so a host never has to reason about
                  model installation, device availability, and engine loading separately.
                tests:
                  - SpeechRecognizerFactory_Create_ModelInstalledAndDeviceAvailable_ReturnsRealRecognizer
                  - SpeechRecognizerFactory_Create_WithStoreModelInstalledAndDeviceAvailable_ReturnsRealRecognizer
                  - SpeechRecognizerFactory_Create_WithCatalogModelInstalledAndDeviceAvailable_ReturnsRealRecognizer

              - id: Speech-Recognition-SpeechRecognizerFactory-HonestFallbacks
                title: >-
                  The SpeechRecognizerFactory class shall return an honest unavailable recognizer,
                  without throwing, when the requested model is not installed, the model does not
                  declare the recognition role, or the supplied capture device is unavailable.
                justification: |
                  Per this library's "nothing throws at composition" decision, a model that has
                  not been downloaded yet and a machine with no microphone are ordinary states at
                  application start-up, not programming errors.
                tests:
                  - SpeechRecognizerFactory_Create_ModelNotInstalled_ReturnsUnavailableRecognizer
                  - SpeechRecognizerFactory_Create_CaptureDeviceUnavailable_ReturnsUnavailableRecognizer
                  - SpeechRecognizerFactory_Create_ModelRoleIsNotRecognition_ReturnsUnavailableRecognizer
                  - SpeechRecognizerFactory_Create_WithStoreModelNotInstalled_ReturnsUnavailableRecognizer
                  - SpeechRecognizerFactory_Create_WithCatalogModelNotInstalled_ReturnsUnavailableRecognizer

              - id: Speech-Recognition-SpeechRecognizerFactory-EngineLoadFailureFallback
                title: >-
                  The SpeechRecognizerFactory class shall return an honest unavailable recognizer,
                  and report the reason, when the recognition engine for an installed model cannot
                  be loaded.
                justification: |
                  The design requires that "a model whose native runtime is absent must
                  degrade the same honest way as a missing model file, never crash". An engine
                  that cannot load because of a missing native binary, an unsupported platform, or
                  corrupt model files must therefore not fail application start-up.
                tests:
                  - SpeechRecognizerFactory_Create_EngineLoadFails_ReturnsUnavailableRecognizerAndDoesNotThrow

              - id: Speech-Recognition-SpeechRecognizerFactory-ArgumentValidation
                title: >-
                  The SpeechRecognizerFactory class shall reject a null model, a null
                  SpeechModelStore, a null SpeechModelCatalog, or a null capture device.
                justification: |
                  A null model, store, catalog, or capture device is a programming error at the
                  call site, not an ordinary "unavailable" machine state, and must fail
                  immediately with a clear exception rather than being silently treated as
                  unavailable.
                tests:
                  - SpeechRecognizerFactory_Create_NullModel_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_NullCaptureDevice_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_WithStoreNullModel_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_WithStoreNullStore_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_WithStoreNullCaptureDevice_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_WithCatalogNullModel_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_WithCatalogNullCatalog_ThrowsArgumentNullException
                  - SpeechRecognizerFactory_Create_WithCatalogNullCaptureDevice_ThrowsArgumentNullException

              - id: Speech-Recognition-SpeechRecognizerFactory-ParameterValuesForwarding
                title: >-
                  The SpeechRecognizerFactory class shall forward an optional parameterValues
                  bag to the recognition engine construction path, defaulting to null for a
                  caller that does not supply one, so a model with real tunable-parameter
                  knowledge can later interpret a genuine parameter value from it.
                justification: |
                  Prior to this requirement, no seam existed to carry a session-level tunable
                  value (for example a selected recognition language) from a host's
                  ISpeechModel.Parameters selection through to a recognition model's engine
                  configuration; adding this argument as optional with a null default keeps every
                  existing call site source-compatible while unblocking real parameter
                  interpretation end-to-end for a future tunable recognition model, mirroring the
                  equivalent SpeechSynthesizerFactory capability already added for voice
                  selection.
                tests:
                  - SpeechRecognizerFactory_Create_ParameterValuesSupplied_ReachesModelCreateEngineConfig
                  - SpeechRecognizerFactory_Create_WithStoreParameterValuesSupplied_ReachesModelCreateEngineConfig
                  - SpeechRecognizerFactory_Create_WithCatalogParameterValuesSupplied_ReachesModelCreateEngineConfig

              - id: Speech-Recognition-SpeechRecognizerFactory-UnrecognizedParameterIdIgnored
                title: >-
                  The SpeechRecognizerFactory class shall silently ignore a supplied
                  parameterValues key that names a parameter not declared by the requested model,
                  still composing a real recognizer, while reporting an Info-level diagnostic
                  naming the ignored key.
                justification: |
                  A host reusing one settings dictionary across different recognition models
                  must not break composition just because a given model does not declare a
                  parameter another model had; this is a deliberate, documented
                  cross-model-compatibility contract, not a caller bug, so it must never throw -
                  only be surfaced as an informational diagnostic for a host that wired up a
                  sink.
                tests:
                  - SpeechRecognizerFactory_Create_UnrecognizedParameterId_ComposesAndReportsInfo

              - id: Speech-Recognition-SpeechRecognizerFactory-InvalidRecognizedParameterValueThrows
                title: >-
                  The SpeechRecognizerFactory class shall throw ArgumentException synchronously
                  from Create() - before installed/role/device/engine checks run - when
                  parameterValues supplies a value for a parameter the requested model does
                  declare, but the value is invalid for that parameter (wrong CLR type, outside
                  [Minimum, Maximum] or non-integral for a NumericParameter declared IsInteger,
                  or not a declared ChoiceParameterOption.Value for a ChoiceParameter, or not a
                  bool for a BooleanParameter), naming the parameter id, the model id, and the
                  reason the value is invalid.
                justification: |
                  This is a deliberate, user-approved breaking change from this library's
                  earlier silent-default behavior for this case: a host explicitly targeting a
                  parameter it knows this model declares, with a value invalid for it, is a
                  caller bug rather than a legitimate cross-model compatibility gap, and must be
                  surfaced immediately and loudly - synchronously from Create() - rather than
                  silently substituted and discovered much later from confusing recognizer
                  behavior.
                tests:
                  - SpeechRecognizerFactory_Create_RecognizedNumericParameterOutOfRange_Throws
                  - SpeechRecognizerFactory_Create_RecognizedNumericParameterWrongType_Throws
                  - SpeechRecognizerFactory_Create_RecognizedChoiceParameterInvalidOption_Throws
                  - SpeechRecognizerFactory_Create_RecognizedBooleanParameterWrongType_Throws
