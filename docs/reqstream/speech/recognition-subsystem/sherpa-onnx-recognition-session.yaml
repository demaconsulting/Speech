---
# Software Unit Requirements for the streaming recognition session implementation
#
# Groups requirements for SherpaOnnxRecognitionSession together with the recognition-backend seam
# (IRecognitionBackend/IRecognitionBackendFactory, concretely SherpaOnnxRecognitionEngine), the
# audio-format converter, and the result-buffering backpressure policy it depends on, mirroring
# how port-audio.yaml groups a cohesive implementation unit. Each unit's requirement subset is
# called out in its own subsection below so every unit still has requirements tracing to it
# individually. DedicatedWorker's cooperative-cancel-then-abandon policy is documented separately
# in dedicated-worker.yaml, since that policy is a standalone, independently reusable concern.

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: SherpaOnnxRecognitionSession Requirements
            requirements:
              - id: Speech-Recognition-SherpaOnnxRecognitionSession-FormatConversion
                title: >-
                  The SherpaOnnxRecognitionSession class shall convert each captured audio block
                  from the capture device's reported channel count and sample rate into
                  single-channel audio at the rate the selected model requires before feeding it
                  to the recognition backend.
                justification: |
                  Desktop microphones commonly capture stereo audio at 44.1 or 48 kHz while
                  recognition models require one fixed mono rate. Without this conversion,
                  recognition would only work on machines whose microphone happened to match the
                  model, which contradicts the library's cross-platform promise.
                tests:
                  - SherpaOnnxRecognitionSession_FrameCaptured_StereoAtModelRate_FeedsDownmixedMonoToBackend

              - id: Speech-Recognition-SherpaOnnxRecognitionSession-TextNormalization
                title: >-
                  The SherpaOnnxRecognitionSession class shall pass every decoded result's text
                  through its owning model's IRecognitionModel.NormalizeText(text, isFinal)
                  before delivering it through GetResultsAsync, supplying the result's own
                  IsFinal flag as isFinal.
                justification: |
                  Some recognition models' raw output is UPPERCASE and unpunctuated (empirically
                  confirmed for the Zipformer model); consumers must see readable, cased,
                  punctuated text rather than the backend's raw output, and the session is the
                  one place every result passes through regardless of which model produced it.
                tests:
                  - SherpaOnnxRecognitionSession_FrameCaptured_FinalResult_AppliesModelNormalizeTextWithIsFinalTrue

              - id: Speech-Recognition-SherpaOnnxRecognitionSession-DeviceLostFault
                title: >-
                  The SherpaOnnxRecognitionSession class shall transition to
                  RecognitionSessionState.Faulted when its bound capture device is lost mid
                  session, rather than silently stopping or hanging a concurrent
                  GetResultsAsync enumeration.
                justification: |
                  A device that disappears mid-session (for example unplugged, or its driver
                  crashes) is a genuine runtime failure a host must learn about promptly and
                  unambiguously through the session's own state machine, exactly like a backend
                  fault.
                tests:
                  - SherpaOnnxRecognitionSession_DeviceLostMidSession_TransitionsToFaulted

              - id: Speech-Recognition-SherpaOnnxRecognitionSession-NativeCallAbandonIntegration
                title: >-
                  The SherpaOnnxRecognitionSession class shall route every call into the
                  recognition backend through the cooperative-cancel-then-abandon policy (see
                  dedicated-worker.yaml), so a single native call that ignores cancellation
                  cannot hang the session's await indefinitely, and shall report a Warning
                  diagnostic through its own diagnostics sink when abandonment occurs.
                justification: |
                  The sherpa-onnx native runtime offers no cooperative cancellation of its own;
                  without this integration a single stuck native decode/reset/flush call would
                  hang the awaiting caller (for example StopAsync during teardown) indefinitely.
                tests:
                  - SherpaOnnxRecognitionSession_NativeCallExceedsAbandonTimeout_TaskCompletesAndDiagnosticsReportsWarning

          - title: IRecognitionBackend Requirements
            requirements:
              - id: Speech-Recognition-RecognitionBackend-MockableSeam
                title: >-
                  The recognition-backend seam shall isolate all speech-inference interop so the
                  recognition session's threading, audio conversion, and result delivery can be
                  verified without a downloaded model or an installed speech-engine native
                  runtime.
                justification: |
                  CI runners cannot be assumed to have a multi-hundred-megabyte speech model or a
                  platform-specific native inference binary available, so the recognition logic
                  must be verifiable entirely in pure managed tests.
                tests:
                  - SherpaOnnxRecognitionSession_StartAsync_FromCreated_TransitionsToRunning
                  - SherpaOnnxRecognitionSession_FrameCaptured_FinalResult_AppliesModelNormalizeTextWithIsFinalTrue

              - id: Speech-Recognition-RecognitionBackend-ModelOwnedConfiguration
                title: >-
                  The recognition-backend seam shall load a backend using only the configuration
                  and input rate the selected model itself declares.
                justification: |
                  The design makes each model's backing class responsible for its own engine
                  configuration, so that adding a new model is a self-contained, reviewable unit
                  of work that never requires changing the recognition subsystem.
                tests:
                  - SpeechRecognizerFactory_LoadAsync_ModelInstalled_ReturnsRealEngine
                  - IRecognitionModel_CreateEngineConfig_InstalledDirectory_ResolvesPathsAndSampleRate

              - id: Speech-Recognition-RecognitionBackend-SessionEndResetDiscardsBufferedAudio
                title: >-
                  The recognition-backend seam's session-end Reset() shall discard audio already
                  accepted but not yet decoded, not just the decoder's current hypothesis, so an
                  abandoned utterance cannot bleed into the next session's decoding.
                justification: |
                  A streaming transducer buffers accepted audio pending future context that the
                  native Reset(stream) call does not discard; left undiscarded, that buffered
                  audio decodes into the next session as soon as any audio - even silence -
                  supplies the missing future context, so an abandoned utterance (for example a
                  push-to-talk release with no trailing silence) would otherwise bleed into the
                  next StartAsync().
                tests:
                  - SherpaOnnxRecognitionEngine_Reset_AbandonedUtteranceWithNoTrailingSilence_DoesNotBleedIntoNextSession

              - id: Speech-Recognition-RecognitionBackend-TryFlushRecoversTrailingAudio
                title: >-
                  The recognition-backend seam's TryFlush() shall finalize and decode audio
                  already accepted but not yet decoded, delivering it as a final result rather
                  than losing it, before a session-end Reset() discards whatever remains.
                justification: |
                  A streaming transducer sometimes cannot decode the tail of an utterance without
                  more audio a caller who has just stopped will never supply - for example a
                  push-to-talk release with no trailing silence. Without a way to finalize that
                  tail, the only alternative is to discard it unread (see
                  Speech-Recognition-RecognitionBackend-SessionEndResetDiscardsBufferedAudio),
                  silently losing the last word a user spoke. The native engine's own
                  InputFinished mechanism exists precisely to force a decode of buffered audio
                  without needing genuine future context, so this recovers that audio instead of
                  losing it.
                tests:
                  - SherpaOnnxRecognitionEngine_TryFlush_AbandonedUtteranceWithNoTrailingSilence_RecoversTrailingWords

              - id: Speech-Recognition-RecognitionBackend-PostEndpointWarmupReplay
                title: >-
                  The recognition-backend seam shall not lose genuinely spoken audio that falls
                  within a model's post-reset encoder warm-up period, for any model that declares
                  a positive IRecognitionModel.PostEndpointWarmupWindowMs, by buffering a rolling
                  window of pre-endpoint audio and silently replaying it into the freshly reset
                  stream on every endpoint that occurs after genuine (non-empty) recognized text
                  has been produced since the stream's most recent reset, while never surfacing
                  text derived purely from that replay as a reported result; an endpoint that
                  fires on pure/near-silence with no genuine text recognized yet since the last
                  reset shall not replay, dropping the buffered audio instead, since replaying it
                  into a freshly reset (encoder-cold) stream risks corrupting the next genuinely
                  recognized segment; models that declare the default 0 (disabled) window shall
                  be entirely unaffected, with no buffer allocated and no replay logic invoked.
                justification: |
                  SherpaOnnxNemotronStreamingEnRecognitionModel's endpoint detector was confirmed,
                  on two real user recordings, to fire as a false positive mid-utterance; the
                  resulting Reset() exposes a measured ~550ms encoder warm-up blackout that
                  silently drops genuinely spoken audio landing in that window (for example "that
                  is" dropped from "To be or not to be... that is the question"). A window-size
                  sweep against both recordings (documented in
                  .agent-logs/planning-nemotron-endpoint-word-loss-warmup-replay-fix-9d4b71.md)
                  found 800ms recovers the lost words with no duplication for Nemotron, but the
                  same window forced onto SherpaOnnxZipformerEnRecognitionModel produced genuine
                  duplicated text - so the feature must be opt-in per model, not a shared default,
                  and must be a provable no-op for every model that does not opt in. A later
                  independent quality review
                  (.agent-logs/quality-nemotron-endpoint-warmup-replay-fix-7a2f91.md) found that an
                  unconditional replay-on-every-endpoint corrupts the first genuinely recognized
                  segment of a session when an endpoint fires on leading/inter-utterance silence
                  before any speech has occurred; the fix
                  (.agent-logs/planning-nemotron-endpoint-leading-silence-regression-fix-7a2f91.md)
                  gates replay eligibility on genuine recognized text having occurred since the
                  last reset, closing that regression without reopening the original word-loss
                  defect (a genuine mid-utterance false-positive endpoint, by definition, only
                  ever occurs after real speech is already in progress within that cycle).
                tests:
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsZero_NoBufferAllocated
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsZero_AcceptSamplesAndDecode_IsNoOpForWarmupMechanism
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_BufferSizedToWindowAndAccumulates
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_BufferNeverExceedsCapacity
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_EndpointReplaysAndArmsGracePeriod
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_ReplayNeverProducesExtraResult
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_GracePeriodSuppressesImmediateReTrigger
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_SilenceOnlyEndpoint_NeverArmsReplay
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_ReplayEligibility_GatedOnHasRecognizedTextSinceReset
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_TryFlushAfterReplayWithNoNewAudio_ReportsNothing
                  - SherpaOnnxRecognitionEngine_PostEndpointWarmupWindowMsEnabled_TryDecodeAfterReplayWithNoNewAudio_ReportsNothing

              - id: Speech-Recognition-RecognitionBackend-RealSpeechAccuracy
                title: >-
                  The recognition-backend seam shall transcribe a clear, single-speaker,
                  studio-quality real human speech recording into text whose Word Error Rate
                  against the recording's known-correct ground-truth transcript does not exceed a
                  documented tolerance, for every real, installed recognition model.
                justification: |
                  Every existing automated test for this seam either replaces the real engine with
                  a fake, or drives the real engine with silence and a synthesized sine-wave tone
                  purely to exercise buffer/bookkeeping logic (see the requirements above) - none
                  of them ever assert on actual transcribed text content. That left a genuine,
                  previously unaddressed coverage gap: nothing proved the real, shipped models
                  transcribe real speech correctly. A tolerant Word-Error-Rate comparison, not an
                  exact string match, is required because a real model's raw output legitimately
                  differs from the ground truth in ways that do not reflect a transcription
                  failure - for example Tennyson's archaic spelling "crost" (for "crossed") in the
                  "Crossing the Bar" fixture recording may be rendered as either spelling by a
                  modern model's vocabulary.
                tests:
                  - SherpaOnnxRecognitionEngine_Transcribe_RealCrossingTheBarRecording_WordErrorRateBelowTolerance
                  - SherpaOnnxRecognitionEngine_Transcribe_RealCrossingTheBarRecording_NemotronWordErrorRateBelowTolerance

          - title: RecognitionResultBuffer Requirements
            requirements:
              - id: Speech-Recognition-RecognitionResultBuffer-TwoTierBackpressure
                title: >-
                  The RecognitionResultBuffer class shall coalesce queued provisional results
                  down to a single latest-provisional slot while queuing final results in a
                  bounded, drop-nothing FIFO up to a documented byte cap, so GetResultsAsync can
                  apply the documented backpressure policy without dropping a final result.
                justification: |
                  A session's result-delivery pipeline must never grow without bound merely
                  because a consumer is temporarily slower than the recognition backend, but a
                  provisional result's whole purpose is to be superseded, while a final result is
                  a committed transcript line that must never be silently dropped.
                tests:
                  - SherpaOnnxRecognitionSession_GetResultsAsync_SlowConsumer_CoalescesProvisionalResults
                  - SherpaOnnxRecognitionSession_GetResultsAsync_SlowConsumer_NeverDropsFinalResultsUnderByteCap

          - title: AudioFrameResampler Requirements
            requirements:
              - id: Speech-Recognition-AudioFrameResampler-Downmix
                title: >-
                  The AudioFrameResampler class shall collapse interleaved multi-channel audio to
                  single-channel audio by averaging each frame's channels, discarding any trailing
                  incomplete frame.
                justification: |
                  A speaker is normally present in every channel of a desktop microphone, so
                  averaging preserves the voice while partially canceling uncorrelated per-channel
                  noise; an incomplete trailing frame has no defined average and must be dropped.
                tests:
                  - AudioFrameResampler_DownmixToMono_StereoInput_AveragesChannelsPerFrame
                  - AudioFrameResampler_DownmixToMono_TrailingPartialFrame_DiscardsPartialFrame
                  - AudioFrameResampler_DownmixToMono_SingleChannel_ReturnsSamplesUnchanged
                  - AudioFrameResampler_DownmixToMono_DestinationOverload_StereoInput_WritesAveragedFrames

              - id: Speech-Recognition-AudioFrameResampler-RateConversion
                title: >-
                  The AudioFrameResampler class shall convert single-channel audio from one sample
                  rate to another, producing a proportional number of output samples, returning
                  the input unchanged when the two rates are equal, and applying anti-aliasing
                  lowpass filtering before decimation whenever it downsamples.
                justification: |
                  Recognition models accept exactly one input rate, so audio captured at any other
                  rate must be converted; converting audio that already matches would introduce
                  avoidable error and cost. A downsampling path that omits anti-aliasing folds
                  above-target-Nyquist energy back into the speech band, degrading recognition.
                tests:
                  - AudioFrameResampler_Resample_Downsampling_ProducesProportionallyFewerSamples
                  - AudioFrameResampler_Resample_AboveTargetNyquistTone_IsAttenuated
                  - AudioFrameResampler_Resample_ShortInputDuringDownsampling_DoesNotThrow
                  - AudioFrameResampler_Resample_Upsampling_LinearlyInterpolatesBetweenSamples
                  - AudioFrameResampler_Convert_MonoAtTargetRate_ReturnsSamplesUnchanged
                  - AudioFrameResampler_Convert_MonoAtDifferentRate_ResamplesWithoutDownmix
                  - AudioFrameResampler_Convert_StereoAtHigherRate_DownmixesAndResamples

              - id: Speech-Recognition-AudioFrameResampler-BoundaryHandling
                title: >-
                  The AudioFrameResampler class shall handle empty, single-sample, and
                  rounds-to-empty conversions without throwing, and shall reject a non-positive
                  sample rate or channel count, or a destination buffer too small for the input.
                justification: |
                  A capture device may legitimately deliver an empty or very short block, which
                  must not interrupt a recognition session; a non-positive rate or channel count
                  describes no meaningful audio and must be rejected rather than silently
                  producing corrupt output, and an undersized destination buffer must be rejected
                  rather than written past its bounds.
                tests:
                  - AudioFrameResampler_Convert_EmptyInput_ReturnsEmptyResult
                  - AudioFrameResampler_Resample_SingleSample_ClampsToThatSample
                  - AudioFrameResampler_Resample_OutputRoundsToZeroSamples_ReturnsEmptyResult
                  - AudioFrameResampler_Constructor_NonPositiveSourceRate_ThrowsArgumentOutOfRangeException
                  - AudioFrameResampler_Constructor_NonPositiveTargetRate_ThrowsArgumentOutOfRangeException
                  - AudioFrameResampler_Constructor_NonPositiveChannelCount_ThrowsArgumentOutOfRangeException
                  - AudioFrameResampler_DownmixToMono_NonPositiveChannelCount_ThrowsArgumentOutOfRangeException
                  - AudioFrameResampler_DownmixToMono_DestinationOverload_DestinationTooShort_ThrowsArgumentException
