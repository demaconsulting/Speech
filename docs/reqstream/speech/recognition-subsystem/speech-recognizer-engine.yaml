---
# Software Unit Requirements for SpeechRecognizerEngine
#
# These requirements describe the single-active-session lease policy of SpeechRecognizerEngine (the
# ISpeechRecognizerEngine implementation): at most one live session at a time, fail-fast rather
# than queued session creation, and disposal of an active session before the engine's own
# resources, decomposing the parent RecognitionSubsystem requirements. RecognitionEngineBusyException,
# the signal for a concurrent session request, has its own file
# (recognition-engine-busy-exception.yaml).

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: SpeechRecognizerEngine Requirements
            requirements:
              - id: Speech-Recognition-EngineExclusivity-SingleActiveSession
                title: >-
                  An ISpeechRecognizerEngine implementation shall permit at most one live session
                  created from it at a time, returning the same kind of new session once a prior
                  session created from it has fully completed its own disposal.
                justification: |
                  The native recognition backend an engine owns is not safe for two sessions to
                  drive concurrently, so the engine - not each session - is the natural place to
                  enforce that exclusivity; reuse across sequential sessions (rather than one
                  session per engine lifetime) is still required to keep the expensive model-load
                  step amortized across many turns.
                tests:
                  - SpeechRecognizerEngine_CreateSessionAsync_NoActiveSession_ReturnsSession
                  - SpeechRecognizerEngine_CreateSessionAsync_AfterPriorSessionFullyDisposed_ReturnsNewSession

              - id: Speech-Recognition-EngineExclusivity-FailFastNotQueued
                title: >-
                  An ISpeechRecognizerEngine implementation's CreateSessionAsync shall throw
                  RecognitionEngineBusyException, without queuing or waiting, when a prior
                  session created from it already holds the engine's exclusivity lease.
                justification: |
                  The lease is held while the prior session is still tearing down via its own
                  DisposeAsync. A caller that attempts to create a second session before releasing
                  the first has made a sequencing error; silently queuing the request would hide that bug
                  behind an unpredictable delay instead of surfacing it immediately, and the lease
                  is held for the whole disposal window because disposal itself still drives the
                  native backend.
                tests:
                  - SpeechRecognizerEngine_CreateSessionAsync_SessionAlreadyLeased_ThrowsRecognitionEngineBusyException
                  - SpeechRecognizerEngine_CreateSessionAsync_PriorSessionDisposing_ThrowsRecognitionEngineBusyException

              - id: Speech-Recognition-EngineExclusivity-DisposalOwnsSession
                title: >-
                  An ISpeechRecognizerEngine implementation's DisposeAsync shall dispose any
                  session it still holds the lease for before releasing the engine's own native
                  resources.
                justification: |
                  A host that disposes the engine without first disposing an active session it
                  created must not leak that session's unmanaged inference resources or leave the
                  lease held with no way to release it.
                tests:
                  - SpeechRecognizerEngine_DisposeAsync_WithActiveSession_DisposesSessionFirst
