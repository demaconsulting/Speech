---
# Software Unit Requirements for UnavailableSpeechRecognizerEngine
#
# Describes the honest-fallback engine returned when recognition is not possible on this machine.
# Its companion exception, SpeechRecognizerUnavailableException, has its own file
# (speech-recognizer-unavailable-exception.yaml).

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: UnavailableSpeechRecognizerEngine Requirements
            requirements:
              - id: Speech-Recognition-UnavailableSpeechRecognizerEngine-ReportsUnavailable
                title: >-
                  The unavailable engine shall report itself unavailable and never fail merely for
                  being obtained or held.
                justification: |
                  A caller must always be able to safely obtain and hold a fallback engine, so
                  composition never fails.
                tests:
                  - UnavailableSpeechRecognizerEngine_IsAvailable_Read_ReturnsFalse

              - id: Speech-Recognition-UnavailableSpeechRecognizerEngine-CreateSessionReturnsFallback
                title: >-
                  The unavailable engine shall return an unavailable session, without failing, for
                  any non-null device when the caller has not canceled.
                justification: |
                  A caller composing against this fallback engine must be able to reuse the same
                  create-session call unchanged regardless of availability.
                tests:
                  - UnavailableSpeechRecognizerEngine_CreateSessionAsync_Always_ReturnsUnavailableSession

              - id: Speech-Recognition-UnavailableSpeechRecognizerEngine-CreateSessionRejectsNullDevice
                title: >-
                  The unavailable engine shall reject session creation with a null device.
                justification: |
                  A null device is a programming error that must surface as an error, matching the
                  contract every engine - including this fallback - must honor.
                tests:
                  - UnavailableSpeechRecognizerEngine_CreateSessionAsync_NullDevice_ThrowsArgumentNullException

              - id: Speech-Recognition-UnavailableSpeechRecognizerEngine-CreateSessionHonorsCancellation
                title: >-
                  The unavailable engine shall honor caller cancellation of session creation when the
                  supplied token is already canceled.
                justification: |
                  Caller cancellation must be honored uniformly by every engine, including this
                  fallback.
                tests:
                  - UnavailableSpeechRecognizerEngine_CreateSessionAsync_CanceledToken_ThrowsOperationCanceledException

              - id: Speech-Recognition-UnavailableSpeechRecognizerEngine-DisposalIdempotent
                title: >-
                  Disposing the unavailable engine shall be a harmless no-op, however many times it
                  is repeated, and shall leave the shared fallback usable.
                justification: |
                  A host that wraps every engine it obtains in a disposal scope must be able to
                  run that same code unchanged on a machine where recognition is unavailable,
                  including disposing the shared fallback more than once.
                tests:
                  - UnavailableSpeechRecognizerEngine_DisposeAsync_CalledTwice_DoesNotThrow
