---
# Software Unit Requirements for RecognitionSession
#
# Covers the streaming RecognitionSession implementation. The units it coordinates have their own
# requirement files in this folder: recognition-backend.yaml (the IRecognitionBackend seam; the
# concrete SherpaOnnxRecognitionEngine and its engine-specific requirements live in SpeechSherpa, see
# docs/reqstream/speech-sherpa/recognition-subsystem/sherpa-onnx-recognition-engine.yaml),
# audio-frame-resampler.yaml, recognition-result-buffer.yaml, speech-recognizer-engine.yaml and
# dedicated-worker.yaml (the cooperative-cancel-then-abandon policy).

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: RecognitionSession Requirements
            requirements:
              - id: Speech-Recognition-RecognitionSession-FormatConversion
                title: >-
                  A recognition session shall convert captured audio from the capture device's
                  channel count into the single-channel audio the model requires.
                justification: |
                  Desktop microphones commonly capture stereo audio while recognition models
                  require mono. Without this conversion, recognition would only work on machines
                  whose microphone happened to match the model, which contradicts the library's
                  cross-platform promise.
                tests:
                  - RecognitionSession_FrameCaptured_StereoAtModelRate_FeedsDownmixedMonoToBackend

              - id: Speech-Recognition-RecognitionSession-RateConversion
                title: >-
                  A recognition session shall convert captured audio from the capture device's
                  sample rate into the rate the selected model requires.
                justification: |
                  Desktop microphones commonly capture at 44.1 or 48 kHz while recognition models
                  require one fixed rate. Without this conversion, recognition would only work on
                  machines whose microphone happened to match the model.
                tests:
                  - RecognitionSession_FrameCaptured_MonoAtHigherRate_FeedsResampledMonoToBackend

              - id: Speech-Recognition-RecognitionSession-TextNormalization
                title: >-
                  A recognition session shall deliver every result with its text normalized by the
                  owning model, which is told whether the result is final.
                justification: |
                  Some recognition models' raw output is UPPERCASE and unpunctuated ; consumers must see readable, cased,
                  punctuated text rather than the backend's raw output, and the session is the
                  one place every result passes through regardless of which model produced it.
                tests:
                  - RecognitionSession_FrameCaptured_FinalResult_AppliesModelNormalizeTextWithIsFinalTrue

              - id: Speech-Recognition-RecognitionSession-DeviceLostFault
                title: >-
                  A recognition session shall enter its faulted state when its capture device is
                  lost mid-session, rather than silently stopping or leaving a reader of its
                  results waiting forever.
                justification: |
                  A device that disappears mid-session (for example unplugged, or its driver
                  crashes) is a genuine runtime failure a host must learn about promptly and
                  unambiguously through the session's own state, exactly like a backend
                  fault.
                tests:
                  - RecognitionSession_DeviceLostMidSession_TransitionsToFaulted

              - id: Speech-Recognition-RecognitionSession-FiniteSourceLossless
                title: >-
                  When a recognition session reads from a finite audio file, it shall not drop any
                  audio, even when recognition is slower than the file is delivered.
                justification: |
                  A file is finite and delivered faster than real time, and users expect it to
                  be transcribed in totality; only a live microphone may shed its oldest audio
                  when recognition falls behind.
                tests:
                  - RecognitionSession_WavFileSource_SlowBackend_DeliversEverySample
                  - RecognitionSession_WavFileSource_StopAsync_SlowDrain_DeliversFlushedResult
                  - RecognitionSession_WavFileSource_BackendFaults_StartAsyncStillCompletes

              - id: Speech-Recognition-RecognitionSession-FiniteSourceBackpressure
                title: >-
                  When a recognition session reads from a finite audio file, it shall slow the
                  reading of the file rather than discard audio when recognition falls behind.
                justification: |
                  A file is delivered faster than real time; slowing the reader is the only way
                  to keep every sample.
                tests:
                  - RecognitionSession_WavFileSource_SlowBackend_DeliversEverySample

              - id: Speech-Recognition-RecognitionSession-FiniteSourceCompleteDelivery
                title: >-
                  A recognition session that reads a finite audio file shall deliver its results
                  for the whole file, including after a stop and when the recognizer fails.
                justification: |
                  Users expect a file to be transcribed in totality, and a failing recognizer
                  must not leave the start of the session hanging.
                tests:
                  - RecognitionSession_WavFileSource_StopAsync_SlowDrain_DeliversFlushedResult
                  - RecognitionSession_WavFileSource_BackendFaults_StartAsyncStillCompletes

              - id: Speech-Recognition-RecognitionSession-NativeCallAbandonIntegration
                title: >-
                  A recognition session shall not wait indefinitely on a recognizer call that
                  ignores cancellation.
                justification: |
                  A native recognition runtime may offer no cooperative cancellation of its own;
                  without a bounded wait a single stuck call would hang the awaiting caller (for
                  example a stop during teardown) indefinitely.
                tests:
                  - RecognitionSession_NativeCallExceedsAbandonTimeout_TaskCompletesAndDiagnosticsReportsWarning

              - id: Speech-Recognition-RecognitionSession-NativeCallAbandonWarning
                title: >-
                  A recognition session shall report a warning diagnostic when it gives up waiting
                  on a recognizer call.
                justification: |
                  An abandoned native call keeps running orphaned in the background, so the
                  abandonment must be surfaced to an observer rather than silently swallowed.
                tests:
                  - RecognitionSession_NativeCallExceedsAbandonTimeout_TaskCompletesAndDiagnosticsReportsWarning
