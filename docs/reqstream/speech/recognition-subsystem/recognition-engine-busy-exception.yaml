---
# Software Unit Requirements for RecognitionEngineBusyException
#
# These requirements describe the exception SpeechRecognizerEngine.CreateSessionAsync throws when the
# engine's single-session exclusivity lease is already held, decomposing the parent
# RecognitionSubsystem requirements. The lease policy itself is covered by
# speech-recognizer-engine.yaml.

sections:
  - title: Speech Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: RecognitionEngineBusyException Requirements
            requirements:
              - id: Speech-Recognition-RecognitionEngineBusyException-Thrown
                title: >-
                  The RecognitionEngineBusyException class shall be thrown, and only be thrown,
                  from CreateSessionAsync when the engine's single-session exclusivity lease is
                  already held.
                justification: |
                  A consumer calling CreateSessionAsync needs an unambiguous, typed signal that
                  its failure is caused by a currently-held lease rather than a null argument,
                  cancellation, or unrelated composition failure, so it can decide whether to
                  retry after releasing the prior session.
                tests:
                  - SpeechRecognizerEngine_CreateSessionAsync_SessionAlreadyLeased_ThrowsRecognitionEngineBusyException
                  - SpeechRecognizerEngine_CreateSessionAsync_PriorSessionDisposing_ThrowsRecognitionEngineBusyException

              - id: Speech-Recognition-RecognitionEngineBusyException-Constructors
                title: >-
                  The RecognitionEngineBusyException class shall provide standard exception
                  constructors (default, message, message with inner exception).
                justification: |
                  Standard exception conformance lets callers construct, catch, and inspect this
                  exception like any other .NET exception type, mirroring the identical
                  constructor pattern used by this library's other custom exception types (for
                  example AudioDeviceInUseException).
                tests:
                  - RecognitionEngineBusyException_Constructor_Default_HasNonEmptyMessage
                  - RecognitionEngineBusyException_Constructor_WithMessage_ExposesMessage
                  - RecognitionEngineBusyException_Constructor_WithInnerException_ExposesBoth
