---
# Software Subsystem Requirements for SynthesisSubsystem
#
# These requirements describe the subsystem-level behavior of the SynthesisSubsystem,
# decomposing the system-level Natural Language Audio Tag requirement in docs/reqstream/speech.yaml.
#
# The subsystem covers the closed tag vocabulary and the model-independent Layer 1 parser
# (AudioTagCatalog/AudioTagParser), Layer 2 per-model rendering into a SpeechPlan, sequential
# chunked synthesis, and playback. The API is an asynchronous Engine/Session split:
# ISpeechSynthesizerEngine (Layer 3, a loaded model) hosts
# at most one leased ISynthesisSession (Layer 5, bound to one playback device) at a time, adding
# session exclusivity, a lifecycle state machine, an overlap-not-allowed rule for concurrent
# operations on one session, a terminal Faulted state, and a dedicated-worker cancellation policy.

sections:
  - title: Speech Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        requirements:
          - id: Speech-Synthesis-ClosedVocabulary
            title: >-
              The SynthesisSubsystem shall define a closed, fixed set of Natural Language Audio
              Tags - one canonical value per tag with every documented synonym collapsed onto
              it - grouped into kinds (Emotion, Pace, Delivery/Volume, Non-verbal, Pause,
              Emphasis).
            justification: |
              The design fixes the tag vocabulary and groups it into kinds so that Layer 2
              per-model rendering and host UI code can reason about a tag's
              broad category generically, and so the vocabulary expands only through a new
              library release rather than being host- or model-configurable.
            children:
              - Speech-Synthesis-AudioTagParser-VocabularyCompleteness
              - Speech-Synthesis-AudioTagParser-AliasRoundTrip
              - Speech-Synthesis-AudioTagParser-NoAliasAmbiguity
              - Speech-Synthesis-AudioTagParser-KindGrouping
              - Speech-Synthesis-AudioTagParser-VocabularyImmutability
            tests:
              - AudioTagCatalog_Tags_Always_CoversEveryCanonicalTagWithAtLeastOneAlias
              - AudioTagCatalog_Tags_Always_NoAliasIsSharedByTwoDifferentTags

          - id: Speech-Synthesis-Layer1Parsing
            title: >-
              The SynthesisSubsystem shall parse text containing inline Natural Language Audio
              Tag bracket syntax into an ordered, model-independent sequence of literal-text and
              recognized-tag spans.
            justification: |
              This library's two-layer tag rendering decision requires a Layer 1 parser that
              is generic and model-independent, producing a neutral intermediate representation
              that a later Layer 2 rendering stage can consume regardless of which model is
              installed.
            children:
              - Speech-Synthesis-AudioTagParser-OrderedSpanSequence
              - Speech-Synthesis-AudioTagParser-TagPlacementSpans
              - Speech-Synthesis-AudioTagParser-NullTextRejection
            tests:
              - AudioTagParser_Parse_MixedPlainTextAndTag_ReturnsOrderedSpans

          - id: Speech-Synthesis-Layer1AliasResolution
            title: >-
              The SynthesisSubsystem shall resolve a tag alias to its canonical tag
              case-insensitively and tolerant of extra whitespace, and reject null content.
            justification: |
              Hosts and users write tags in varied case and spacing; resolving them to one
              canonical tag keeps Layer 2 rendering independent of how a tag was typed.
            children:
              - Speech-Synthesis-AudioTagParser-CaseInsensitiveResolution
              - Speech-Synthesis-AudioTagParser-ExtraWhitespaceTolerance
              - Speech-Synthesis-AudioTagParser-NullContentRejection
            tests:
              - AudioTagCatalog_TryResolve_MixedCaseWithExtraWhitespace_ResolvesToCanonicalTag

          - id: Speech-Synthesis-Layer1LiteralPassthrough
            title: >-
              The SynthesisSubsystem shall pass any unrecognized or malformed bracket content
              through as literal text rather than throwing or discarding it.
            justification: |
              This library's "never worse than plain narration" guarantee requires that a typo,
              an unsupported bracket phrase, or an unbalanced bracket degrades to ordinary
              narration rather than failing or losing content.
            children:
              - Speech-Synthesis-AudioTagParser-MalformedPassthrough
              - Speech-Synthesis-AudioTagParser-NestedBracketTagResolution
              - Speech-Synthesis-AudioTagParser-UnknownBracketPassthrough
              - Speech-Synthesis-AudioTagParser-UnknownContentUnresolved
            tests:
              - AudioTagParser_Parse_UnclosedOpeningBracket_PassesThroughAsLiteralText

          - id: Speech-Synthesis-Layer2Rendering
            title: >-
              The SynthesisSubsystem shall render a Layer 1 parsed span sequence into an ordered
              SpeechPlan of speech segments, passing a tag through as a model-native control
              token when the selected model's own declared audio-tag support is native, and
              rendering plain text as chunked narration.
            justification: |
              This library's two-layer tag rendering decision requires a model-independent
              Layer 1 parse to be turned into model-appropriate output by a separate Layer 2
              stage, so that adding a new model with different tag capabilities never requires
              changing the parser.
            children:
              - Speech-Synthesis-Layer2Rendering-NativePassthrough
              - Speech-Synthesis-Layer2Rendering-PlainTextChunking
              - Speech-Synthesis-Layer2Rendering-NullArgumentRejection
            tests:
              - DefaultModelCapabilityProfile_Render_NativeSupport_PassesThroughCanonicalBracketText
              - DefaultModelCapabilityProfile_Render_NativeSupport_MoodTag_PassesCanonicalText

          - id: Speech-Synthesis-Layer2RenderingApproximation
            title: >-
              The SynthesisSubsystem shall approximate a tag as a timed pause or a parameter
              override when the selected model declares parameter-mapped audio-tag support.
            justification: |
              A model without native tag support still gets a reasonable, non-crashing
              approximation of pause, pace, and volume intent.
            children:
              - Speech-Synthesis-Layer2Rendering-PauseAlwaysSilence
              - Speech-Synthesis-Layer2Rendering-ParameterMappedApproximation
              - Speech-Synthesis-Layer2Rendering-EllipsisPause
            tests:
              - DefaultModelCapabilityProfile_Render_ShortPause_AlwaysRendersAsSilenceSegment
              - DefaultModelCapabilityProfile_Render_ParameterMappedSupport_FastTag_MapsToSpeedParameter

          - id: Speech-Synthesis-Layer2RenderingStrip
            title: >-
              The SynthesisSubsystem shall strip a tag to plain narration when the selected model
              declares no audio-tag support or the tag has no mapping for the model.
            justification: |
              Every installed model, however limited its tag support, must still narrate
              correctly per the "never worse than plain narration" guarantee.
            children:
              - Speech-Synthesis-Layer2Rendering-NoneStripsAll
              - Speech-Synthesis-Layer2Rendering-ParameterMappedUnmappedStrip
            tests:
              - DefaultModelCapabilityProfile_Render_NoneSupport_StripsAllTags
              - DefaultModelCapabilityProfile_Render_NoneSupport_MoodTag_StripsAndSpeaksWords

          - id: Speech-Synthesis-MockableContract
            title: >-
              The SynthesisSubsystem shall expose a mockable Engine/Session text-to-speech
              contract (ISpeechSynthesizerEngine for a loaded model, ISynthesisSession bound to
              one device) that reports availability and fails loudly when an operational member
              is invoked on an unavailable engine or session, without exposing any inference
              backend type.
            justification: |
              This library's "engine backend stays swappable at the public API surface"
              decision requires that a future non-sherpa-onnx backend can replace the current one
              without a breaking API change, and hosts must be able to test their playback
              handling against the contract with no model, speakers, or native runtime present.
            children:
              - Speech-Synthesis-ISpeechSynthesizerEngine-AvailabilityFlag
              - Speech-Synthesis-ISpeechSynthesizerEngine-UnavailableOperationsThrow
              - Speech-Synthesis-ISpeechSynthesizerEngine-UnavailableCreateSessionSucceeds
              - Speech-Synthesis-ISynthesisSession-AvailabilityFlag
              - Speech-Synthesis-ISynthesisSession-AvailabilityFalseAfterFaultOrDispose
              - Speech-Synthesis-ISynthesisSession-UnavailableOperationsThrow
              - Speech-Synthesis-ISynthesisSession-UnavailableStopAndDisposeSafe
            tests:
              - UnavailableSpeechSynthesizerEngine_IsAvailable_Read_ReturnsFalse

          - id: Speech-Synthesis-MockableSynthesisPlaybackContract
            title: >-
              The SynthesisSubsystem shall expose, through the mockable Engine/Session contract,
              session creation bound to one device, one-shot convenience overloads, and
              streaming synthesis and playback of speech segments.
            justification: |
              Splitting a Layer 3 engine from a Layer 5 session lets one loaded model be reused to
              bind multiple sessions over its lifetime, one at a time, without reloading, while
              hosts still get a convenient one-shot API.
            children:
              - Speech-Synthesis-ISpeechSynthesizerEngine-SessionCreationContract
              - Speech-Synthesis-ISpeechSynthesizerEngine-OneShotConvenienceOverloads
              - Speech-Synthesis-ISpeechSynthesizerEngine-EngineDisposal
              - Speech-Synthesis-ISpeechSynthesizerEngine-SynthesizedSpeechShape
              - Speech-Synthesis-ISynthesisSession-StreamingContract
              - Speech-Synthesis-ISynthesisSession-DisposalContract
              - Speech-Synthesis-ISynthesisSession-HotReuseAcrossTurns
            tests:
              - SynthesisSession_SynthesizeAsync_PlainText_YieldsAudioSegment

          - id: Speech-Synthesis-MockableCancellationContract
            title: >-
              The SynthesisSubsystem shall expose, through the mockable session contract,
              deterministic cancellation of an in-flight speak operation via StopAsync.
            justification: |
              A host must be able to cut speech off on demand (barge-in) through the mockable
              contract.
            children:
              - Speech-Synthesis-ISynthesisSession-StopContract
            tests:
              - SynthesisSession_StopAsync_NoOperationInFlight_IsNoOp

          - id: Speech-Synthesis-EngineExclusivity
            title: >-
              The SynthesisSubsystem shall allow an ISpeechSynthesizerEngine to host at most one
              live ISynthesisSession at a time, failing a concurrent session request fast with a
              documented exception rather than queuing it, sharing the engine, or silently
              misbehaving.
            justification: |
              A single loaded model (Layer 3 engine) owns one native inference context; two
              concurrently live sessions bound to two different playback devices would race
              against that same native context and corrupt either or both synthesis streams.
              Failing fast gives a caller an unambiguous signal to dispose its current session
              before requesting another.
            children:
              - Speech-Synthesis-SpeechSynthesizerEngine-SessionExclusivity
              - Speech-Synthesis-SpeechSynthesizerEngine-SessionLeaseReleasedOnDispose
              - Speech-Synthesis-SynthesisEngineBusyException-Thrown
              - Speech-Synthesis-SynthesisEngineBusyException-StandardConstructors
            tests:
              - SpeechSynthesizerEngine_CreateSessionAsync_LeaseAlreadyHeld_ThrowsSynthesisEngineBusyException
              - SpeechSynthesizerEngine_CreateSessionAsync_AfterPriorSessionDisposed_SucceedsAgain

          - id: Speech-Synthesis-EngineDisposalOrdering
            title: >-
              The SynthesisSubsystem shall dispose an active leased session before disposing the
              engine itself, and dispose the engine's backend exactly once.
            justification: |
              Disposing the active session first guarantees no in-flight native call outlives
              the engine that owns its backend.
            children:
              - Speech-Synthesis-SpeechSynthesizerEngine-DisposalOrdering
              - Speech-Synthesis-SpeechSynthesizerEngine-BackendDisposedOnce
            tests:
              - SpeechSynthesizerEngine_DisposeAsync_WithActiveLeasedSession_DisposesSessionFirst
              - SpeechSynthesizerEngine_DisposeAsync_CalledTwice_DisposesBackendOnce

          - id: Speech-Synthesis-Composition
            title: >-
              The SynthesisSubsystem shall asynchronously compose a speech synthesis engine for
              an installed synthesis model without ever throwing for an ordinary machine state.
            justification: |
              Composition happens at application start-up, where a model that has not been
              downloaded yet and a machine without the speech engine's native runtime are both
              ordinary states rather than programming errors, per this library's "nothing throws
              at composition" decision. Composition does not depend on playback-device
              availability, since LoadAsync produces a Layer 3 engine not yet bound to any
              device.
            children:
              - Speech-Synthesis-SpeechSynthesizerFactory-RealEngine
              - Speech-Synthesis-SpeechSynthesizerFactory-HonestFallbacks
              - Speech-Synthesis-SpeechSynthesizerFactory-EngineLoadFailureFallback
              - Speech-Synthesis-SpeechSynthesizerFactory-ArgumentValidationAndCancellation
              - Speech-Synthesis-SpeechSynthesizerFactory-CanceledTokenThrows
              - Speech-Synthesis-SynthesisBackend-MockableSeam
              - Speech-Synthesis-SynthesisBackend-ModelOwnedConfiguration
            tests:
              - SpeechSynthesizerFactory_LoadAsync_ModelInstalled_ReturnsRealEngine
              - SpeechSynthesizerFactory_LoadAsync_ModelNotInstalled_ReturnsUnavailableEngine
              - SpeechSynthesizerFactory_LoadAsync_CanceledToken_ThrowsOperationCanceledException

          - id: Speech-Synthesis-CompositionIgnoresUnrecognizedParameter
            title: >-
              The SynthesisSubsystem shall silently ignore a supplied parameterValues key that
              names a parameter the model does not declare when composing an engine.
            justification: |
              An unrecognized parameter id is an ordinary cross-model-compatibility gap, not a
              caller bug, so it must never fail composition.
            children:
              - Speech-Synthesis-SpeechSynthesizerFactory-UnrecognizedParameterIdIgnored
            tests:
              - SpeechSynthesizerFactory_LoadAsync_UnrecognizedParameterId_ComposesAndReportsInfo

          - id: Speech-Synthesis-CompositionRejectsInvalidParameterValue
            title: >-
              The SynthesisSubsystem shall throw ArgumentException when composing an engine with
              an invalid value for a parameter the model declares.
            justification: |
              A caller explicitly targeting a parameter it knows this model declares, with a
              value invalid for it, has made a programming error at the call site, so it must be
              surfaced synchronously and loudly rather than folded into the never-throw contract
              for genuine machine-state unavailability.
            children:
              - Speech-Synthesis-SpeechSynthesizerFactory-InvalidRecognizedParameterValueThrows
            tests:
              - SpeechSynthesizerFactory_LoadAsync_RecognizedNumericParameterOutOfRange_Throws

          - id: Speech-Synthesis-VoiceSelection
            title: >-
              The SynthesisSubsystem shall thread an optional, session-level parameterValues bag
              from SpeechSynthesizerFactory.LoadAsync through to SynthesisSession.
            justification: |
              A model-declared voice parameter (for example a multi-voice ChoiceParameter) must
              reach the session that synthesizes speech so it can change synthesized output.
            children:
              - Speech-Synthesis-SpeechSynthesizerFactory-ParameterValuesForwarding
            tests:
              - SpeechSynthesizerFactory_LoadAsync_ParameterValuesSupplied_ForwardedToEngine

          - id: Speech-Synthesis-SpeakerIdResolution
            title: >-
              The SynthesisSubsystem shall resolve a speaker id from the session's
              parameterValues via ISynthesisModel.ResolveSpeakerId once per synthesized segment.
            justification: |
              A model that owns real per-voice knowledge must determine the speaker used for
              each synthesized segment, rather than every segment using a fixed speaker id.
            children:
              - Speech-Synthesis-SynthesisSession-SpeakerSelection
            tests:
              - SynthesisSession_SynthesizeAsync_NoParameterValues_ResolvesDefaultSpeakerIdFromModel
              - SynthesisSession_SynthesizeAsync_ParameterValuesSupplied_ResolvesSpeakerIdFromBag

          - id: Speech-Synthesis-VoiceSelectionIndependentOfTagOverrides
            title: >-
              The SynthesisSubsystem shall apply voice selection independently of the per-segment
              Natural Language Audio Tag speed/volume override mechanism.
            justification: |
              Voice selection and the per-segment speed/volume convention are separate
              mechanisms; using one must not disable or alter the other.
            children:
              - Speech-Synthesis-SynthesisSession-SpeakerSelectionIndependentOfTagOverrides
            tests:
              - SynthesisSession_SynthesizeAsync_ParameterValuesSuppliedAlongsideSpeedTag_BothMechanismsApplyIndependently

          - id: Speech-Synthesis-ChunkedPipeline
            title: >-
              The SynthesisSubsystem shall chunk synthesis-ready text into sentence/clause-sized
              pieces.
            justification: |
              Chunking keeps each backend call short, so playback of an early chunk can begin
              after only that chunk has been synthesized, rather than a caller waiting for an
              entire utterance's inference to complete before hearing anything.
            children:
              - Speech-Synthesis-SentenceChunker-BoundarySplitting
              - Speech-Synthesis-SentenceChunker-BoundaryHandling
              - Speech-Synthesis-SentenceChunker-NonPositiveMaxLengthRejection
              - Speech-Synthesis-SentenceChunker-NullTextRejection
              - Speech-Synthesis-SentenceChunker-NumeralPunctuationRetention
              - Speech-Synthesis-SentenceChunker-ConsecutiveBoundaryMerging
              - Speech-Synthesis-SentenceChunker-DegeneratePunctuationMerging
              - Speech-Synthesis-SentenceChunker-EllipsisMetadata
              - Speech-Synthesis-SentenceChunker-ChunkTextProjection
            tests:
              - SentenceChunker_Chunk_MultipleSentences_SplitsOnPrimaryBoundaries

          - id: Speech-Synthesis-SequentialSynthesis
            title: >-
              The SynthesisSubsystem shall synthesize the pieces of an utterance in order, one
              at a time, producing the full ordered segment list.
            justification: |
              Synthesis itself is sequential: a later chunk is not synthesized while an earlier
              chunk is still being synthesized.
            children:
              - Speech-Synthesis-SynthesisSession-ChunkedPipeline
              - Speech-Synthesis-SynthesisSession-FullFidelitySegmentList
            tests:
              - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially
              - SynthesisSession_SynthesizeAsync_ReturnsFullFidelitySegmentListIncludingSilence

          - id: Speech-Synthesis-StreamedPlayback
            title: >-
              The SynthesisSubsystem shall play each synthesized piece as soon as it has been
              synthesized rather than after the whole text has been synthesized.
            justification: |
              Playing each piece as it becomes available gives low latency to first audio, with
              the device, resampling, silence, volume, and drain handling needed for continuous
              playback.
            children:
              - Speech-Synthesis-SynthesisSession-StreamedPlayback
              - Speech-Synthesis-SynthesisSession-ContinuousPlayback
              - Speech-Synthesis-SynthesisSession-PlaybackDeviceReleased
              - Speech-Synthesis-SynthesisSession-SilenceAndVolume
              - Speech-Synthesis-SynthesisSession-VolumeScaling
              - Speech-Synthesis-SynthesisSession-GenuinePlaybackDrainWait
              - Speech-Synthesis-SynthesisSession-DrainWaitCancellation
              - Speech-Synthesis-PlaybackAudioResampler-RateConversion
              - Speech-Synthesis-PlaybackAudioResampler-EqualRateUnchanged
              - Speech-Synthesis-PlaybackAudioResampler-DownsampleAntiAliasing
              - Speech-Synthesis-PlaybackAudioResampler-Upmix
              - Speech-Synthesis-PlaybackAudioResampler-UpmixChannelCountRejection
              - Speech-Synthesis-PlaybackAudioResampler-Composition
            tests:
              - SynthesisSession_SpeakAsync_PlainText_StartsWritesAndStopsDevice
              - SynthesisSession_SpeakAsync_MultiSentenceInput_WritesEachSegmentBeforeSynthesizingNext

          - id: Speech-Synthesis-SessionOverlapAndLifecycle
            title: >-
              The SynthesisSubsystem shall reject an overlapping SpeakAsync/SynthesizeAsync call
              on a session already performing one.
            justification: |
              Each ISynthesisSession drives exactly one in-flight native synthesis call and one
              playback stream at a time; a host must be told, synchronously and unambiguously,
              when it has attempted to start a second operation before the first has finished.
              A session remains reusable across many non-overlapping operations.
            children:
              - Speech-Synthesis-SynthesisSession-OverlapNotAllowed
              - Speech-Synthesis-ISynthesisSession-OverlapNotAllowed
              - Speech-Synthesis-SynthesisSession-HotReuse
            tests:
              - SynthesisSession_SpeakAsync_CalledWhileAlreadySpeaking_ThrowsInvalidOperationException
              - SynthesisSession_SpeakAsync_CalledTwiceOnSameInstance_ReusesSameInstanceWithoutReconstruction

          - id: Speech-Synthesis-SessionStateMachine
            title: >-
              The SynthesisSubsystem shall raise an observable lifecycle state machine over each
              session operation.
            justification: |
              Starting/Running/Stopping denote one in-flight operation rather than a continuous
              stream, so a host can correctly render a "speaking" indicator.
            children:
              - Speech-Synthesis-SynthesisSession-StateMachine
              - Speech-Synthesis-SynthesisSession-FaultingStateSequence
              - Speech-Synthesis-SynthesisSession-StateChangedOutsideLock
              - Speech-Synthesis-SynthesisSession-StateChangedHandlerIsolation
              - Speech-Synthesis-ISynthesisSession-StateMachine
              - Speech-Synthesis-ISynthesisSession-StateMachineFaultTransition
              - Speech-Synthesis-ISynthesisSession-StateChangedSubscriberIsolation
            tests:
              - SynthesisSession_StateChanged_OneSuccessfulOperation_RaisesExpectedTransitionsInOrder

          - id: Speech-Synthesis-FaultedSessionTerminal
            title: >-
              The SynthesisSubsystem shall make a faulted session's terminal state
              unrecoverable, rejecting every later operation.
            justification: |
              A host must discard and replace a session whose underlying native state is no
              longer trustworthy after a fault.
            children:
              - Speech-Synthesis-SynthesisSession-FaultedIsTerminal
              - Speech-Synthesis-SynthesisSession-FaultedRejectsSubsequentCalls
              - Speech-Synthesis-SynthesisSessionFaultedException-Thrown
            tests:
              - SynthesisSession_SynthesizeAsync_AfterFault_ThrowsSynthesisSessionFaultedException

          - id: Speech-Synthesis-FaultContainment
            title: >-
              The SynthesisSubsystem shall contain and report faults raised while synthesizing or
              playing speech, and shall not hang or crash the process when disposal or an
              abandoned native call is involved.
            justification: |
              A model that fails mid-utterance or a dropped playback device is an ordinary event
              during a synthesis operation and must never leave the caller's task hanging or tear
              down the process, per this library's fault-containment requirements. Disposal must
              wait for native calls so freed native memory is never touched.
            children:
              - Speech-Synthesis-SynthesisSession-FaultContainment
              - Speech-Synthesis-SynthesisSession-DisposeReleasesLeaseOnce
              - Speech-Synthesis-SynthesisSession-DisposedStateReporting
              - Speech-Synthesis-SynthesisSession-DisposedReportsUnavailable
              - Speech-Synthesis-SynthesisSession-DisposeWaitsForNativeCompletion
              - Speech-Synthesis-SynthesisSession-DisposeLeaseReleaseAfterNativeCompletion
              - Speech-Synthesis-SynthesisSession-AbandonedNativeCallReturnsPromptly
              - Speech-Synthesis-SynthesisSession-AbandonedNativeCallFaultTransition
              - Speech-Synthesis-SynthesisSession-AbandonedNativeCallRejectsReuse
            tests:
              - SynthesisSession_SynthesizeAsync_BackendThrows_ReportsFaultAndTransitionsToFaulted

          - id: Speech-Synthesis-DeterministicCancellation
            title: >-
              The SynthesisSubsystem shall support deterministic cancellation of an in-flight
              speak operation, bounded by a cooperative-cancel dedicated-worker policy.
            justification: |
              A user interrupting speech (barge-in) is an ordinary event and the caller must get
              control back deterministically, without the stop completing while a native call is
              still running.
            children:
              - Speech-Synthesis-SynthesisSession-StopCancelsOperation
              - Speech-Synthesis-SynthesisSession-StopWhenIdle
              - Speech-Synthesis-SynthesisSession-StopWaitsForNativeCompletion
              - Speech-Synthesis-SynthesisSession-DeviceStopDeferredUntilStartReturns
              - Speech-Synthesis-SynthesisSession-StopCallerTokenBoundsWaitOnly
              - Speech-Synthesis-DedicatedWorker-CooperativeCancellation
            tests:
              - SynthesisSession_StopAsync_WhileSpeaking_DoesNotCompleteUntilInFlightGenerateReturns
              - DedicatedWorker_Run_CooperativeCancellation_CompletesPromptly

          - id: Speech-Synthesis-NonCooperativeCallAbandonment
            title: >-
              The SynthesisSubsystem shall abandon a native call that does not observe
              cancellation within a bounded time and report the abandonment, rather than hanging
              the caller.
            justification: |
              A native call is not guaranteed to honor .NET cancellation tokens at all, so the
              dedicated worker must bound how long a caller can be blocked by one, running it on
              a dedicated long-running thread.
            children:
              - Speech-Synthesis-DedicatedWorker-NonCooperativeAbandonment
              - Speech-Synthesis-DedicatedWorker-AbandonmentDiagnostic
              - Speech-Synthesis-DedicatedWorker-LongRunningExecution
            tests:
              - DedicatedWorker_Run_NonCooperativeDelegate_AbandonsAfterTimeoutAndReportsDiagnostics

          - id: Speech-Synthesis-UnavailableFallback
            title: >-
              The SynthesisSubsystem shall provide an honest unavailable engine and an honest
              unavailable session that report unavailability rather than throwing merely for
              being obtained or held.
            justification: |
              Per this library's "nothing throws at composition" decision, obtaining and holding
              a fallback engine or session must never throw. Binding a device to an already
              unavailable engine via CreateSessionAsync is itself an ordinary (if useless)
              composition rather than an error.
            children:
              - Speech-Synthesis-UnavailableSpeechSynthesizerEngine-ReportsUnavailable
              - Speech-Synthesis-UnavailableSpeechSynthesizerEngine-CreateSessionSucceeds
              - Speech-Synthesis-UnavailableSpeechSynthesizerEngine-CreateSessionRejectsNullDevice
              - Speech-Synthesis-UnavailableSpeechSynthesizerEngine-SafeDispose
              - Speech-Synthesis-UnavailableSynthesisSession-ReportsUnavailable
              - Speech-Synthesis-UnavailableSynthesisSession-StateReportsCreated
              - Speech-Synthesis-UnavailableSynthesisSession-StopIsNoOp
              - Speech-Synthesis-UnavailableSynthesisSession-SafeDispose
            tests:
              - UnavailableSpeechSynthesizerEngine_IsAvailable_Read_ReturnsFalse
              - UnavailableSpeechSynthesizerEngine_CreateSessionAsync_Always_ReturnsUnavailableSession
              - UnavailableSynthesisSession_State_Read_ReturnsCreated

          - id: Speech-Synthesis-UnavailableFallbackOperationsThrow
            title: >-
              The SynthesisSubsystem shall throw a documented exception only when an operational
              member of an unavailable engine or session is actually invoked.
            justification: |
              Only misuse of an already unavailable engine or session is a programming error
              that should surface as an exception.
            children:
              - Speech-Synthesis-UnavailableSpeechSynthesizerEngine-OperationsThrow
              - Speech-Synthesis-UnavailableSynthesisSession-OperationsThrow
              - Speech-Synthesis-UnavailableSynthesisSession-NullTextRejection
              - Speech-Synthesis-SpeechSynthesizerUnavailableException-Thrown
            tests:
              - UnavailableSpeechSynthesizerEngine_SpeakAsync_Always_ThrowsSpeechSynthesizerUnavailableException
              - UnavailableSynthesisSession_SpeakAsync_Always_ThrowsSpeechSynthesizerUnavailableException
