---
# cspell:ignore Alsa
# Software Subsystem Requirements for AudioSubsystem
#
# These requirements describe the subsystem-level behavior of the AudioSubsystem,
# decomposing the system-level audio requirements in docs/reqstream/speech.yaml.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        requirements:
          - id: Speech-Audio-NameOnlyIdentity
            title: >-
              The AudioSubsystem shall resolve a persisted device selection by the saved device name.
            justification: |
              This library's "single preferred host API per platform, name-only device
              identity" decision removes device-index instability across reboots and hot-plug
              events; the trade-off (two identically named devices are indistinguishable) is
              accepted for the desktop use case.
            children:
              - Speech-Audio-AudioDeviceDescription-NameIdentity
              - Speech-Audio-AudioDeviceDescription-ValueEquality
              - Speech-Audio-AudioDeviceSelection-ExactNameMatch
            tests:
              - AudioDeviceSelection_Resolve_MatchingName_ReturnsMatchingDevice

          - id: Speech-Audio-SelectionFallback
            title: >-
              The AudioSubsystem shall fall back to the preferred host API's default device
              when a persisted device selection no longer resolves.
            justification: |
              A previously selected device disappearing is an ordinary machine-state change,
              not a programming error, and must not raise an exception during composition.
            children:
              - Speech-Audio-AudioDeviceSelection-FallbackToDefault
              - Speech-Audio-PortAudioCaptureDevice-StaleSelectionUsesDefault
              - Speech-Audio-PortAudioPlaybackDevice-StaleSelectionUsesDefault
            tests:
              - AudioDeviceSelection_Resolve_NoLongerPresent_ReturnsNull
              - PortAudioCaptureDevice_Constructor_StaleSelection_FallsBackToDefaultDevice
              - PortAudioPlaybackDevice_Constructor_StaleSelection_FallsBackToDefaultDevice

          - id: Speech-Audio-Factory
            title: >-
              The AudioSubsystem shall provide a factory that composes capture and playback
              devices and their enumeration probes.
            justification: |
              Composition happens at application start-up, where a missing device or backend is
              an ordinary machine state; every factory method must return a working
              implementation or an honest unavailable fallback.
            children:
              - Speech-Audio-AudioDeviceFactory-InjectableProbes
              - Speech-Audio-AudioDeviceFactory-InjectablePlaybackProbe
              - Speech-Audio-AudioDeviceFactory-DiagnosticsSink
              - Speech-Audio-AudioDeviceFactory-DefaultProbesWhenNoneInjected
              - Speech-Audio-AudioDeviceFactory-UnavailableFallbackReported
              - Speech-Audio-AudioDeviceFactory-RealDefaultsWhenInitialized
              - Speech-Audio-AudioDeviceFactory-PortAudioInitializationFallback
              - Speech-Audio-AudioDeviceFactory-DeviceCreationConsistentWithInjectedProbe
            tests:
              - AudioDeviceFactory_CreateCaptureDevice_PortAudioInitialized_ReturnsRealDevice
              - AudioDeviceFactory_CreatePlaybackDevice_PortAudioInitialized_ReturnsRealDevice
              - AudioDeviceFactory_CreateDevices_PortAudioInitializationFails_ReturnUnavailableDevices

          - id: Speech-Audio-FactoryNeverThrows
            title: >-
              The AudioSubsystem shall never throw from the AudioDeviceFactory constructor or its
              Create* methods.
            justification: |
              Composition happens at application start-up, where a missing device or backend is
              an ordinary machine state; a factory method must not turn that into an exception.
              RefreshDevices is deliberately excluded: it refuses a refresh while a stream is
              active (see Speech-Audio-DeviceRefreshRefusal).
            children:
              - Speech-Audio-AudioDeviceFactory-NeverThrows
              - Speech-Audio-AudioDeviceFactory-CreateCaptureDeviceNeverThrows
              - Speech-Audio-AudioDeviceFactory-CreatePlaybackDeviceNeverThrows
            tests:
              - AudioDeviceFactory_Constructor_CustomEnvironment_DoesNotThrow

          - id: Speech-Audio-InitializationFallback
            title: >-
              The AudioSubsystem shall provide unavailable capture and playback devices and
              probes when the PortAudio runtime cannot initialize.
            justification: |
              A machine missing compatible native audio support is an expected deployment state
              that must not break composition. This subsystem requirement decomposes the
              system-level initialization-failure requirement onto the factory behavior.
            children:
              - Speech-Audio-AudioDeviceFactory-PortAudioInitializationFallback
            tests:
              - AudioDeviceFactory_Constructor_PortAudioInitializationFails_ExposesUnavailableProbes
              - AudioDeviceFactory_CreateDevices_PortAudioInitializationFails_ReturnUnavailableDevices

          - id: Speech-Audio-FormatValue
            title: >-
              The AudioSubsystem shall expose a validating audio-format value type.
            justification: |
              Model-driven composition needs one plain, public type that can describe "open the
              device in roughly this format" without leaking native PortAudio or sherpa-onnx
              types. Keeping the type inside the AudioSubsystem lets both device composition and
              model metadata talk about audio format in the same terms.
            children:
              - Speech-Audio-AudioFormat-PositiveValues
              - Speech-Audio-AudioFormat-ExposesValues
              - Speech-Audio-AudioFormat-MonoFactory
            tests:
              - AudioFormat_Constructor_ValidValues_ExposesProperties
              - AudioFormat_Mono_ValidSampleRate_ReturnsMonoFormat

          - id: Speech-Audio-PreferredFormat
            title: >-
              The AudioSubsystem shall allow callers to request a preferred capture or playback
              format, preserving device-native behavior when no preference is supplied.
            justification: |
              Model-driven composition needs to open a device in roughly the format an engine
              wants, while hosts that express no preference must keep today's device-native
              behavior. This is a deliberate grouping parent: each child requirement states one
              criterion.
            children:
              - Speech-Audio-AudioDeviceFactory-PreferredFormatForwarding
              - Speech-Audio-AudioDeviceFactory-DefaultFormatWithoutPreference
              - Speech-Audio-PortAudioCaptureDevice-PreferredFormatSelection
              - Speech-Audio-PortAudioPlaybackDevice-PreferredFormatSelection
              - Speech-Audio-PortAudioCaptureDevice-PreferredChannelCountClamp
              - Speech-Audio-PortAudioPlaybackDevice-PreferredChannelCountClamp
              - Speech-Audio-PortAudioCaptureDevice-DefaultFormatWithoutPreference
              - Speech-Audio-PortAudioPlaybackDevice-DefaultFormatWithoutPreference
              - Speech-Audio-PortAudioCaptureDevice-PreferredSampleRateNegotiated
              - Speech-Audio-PortAudioPlaybackDevice-PreferredSampleRateNegotiated
            tests:
              - AudioDeviceFactory_CreateCaptureDevice_PreferredFormatSupplied_ForwardsPreferredFormat
              - AudioDeviceFactory_CreatePlaybackDevice_PreferredFormatSupplied_ForwardsPreferredFormat
              - PortAudioCaptureDevice_Constructor_PreferredFormatWithinCapability_UsesPreferredFormat
              - PortAudioPlaybackDevice_Constructor_PreferredFormatWithinCapability_UsesPreferredFormat
              - PortAudioCaptureDevice_Constructor_PreferredSampleRateUnsupported_FallsBackToDeviceDefaultSampleRateAndReportsDiagnostic
              - PortAudioPlaybackDevice_Constructor_PreferredSampleRateUnsupported_FallsBackToDeviceDefaultSampleRateAndReportsDiagnostic

          - id: Speech-Audio-MockableContracts
            title: >-
              The AudioSubsystem shall report an unavailable state, rather than throwing, when
              no audio hardware or runtime is available, so hosts and tests can run without
              real hardware.
            justification: |
              This library's "own interfaces over direct OTS types" decision requires
              library-owned abstractions so hosts can supply mocks in tests and the backend can
              be replaced later without a breaking API change. This is a deliberate grouping
              parent: each child requirement states one criterion.
            children:
              - Speech-Audio-IAudioCaptureDevice-AvailabilityFlag
              - Speech-Audio-IAudioCaptureDevice-StartStopFrameCaptured
              - Speech-Audio-IAudioPlaybackDevice-AvailabilityFlag
              - Speech-Audio-IAudioPlaybackDevice-Start
              - Speech-Audio-IAudioPlaybackDevice-Stop
              - Speech-Audio-IAudioPlaybackDevice-Write
              - Speech-Audio-IAudioCaptureDeviceProbe-EnumerateNeverThrows
              - Speech-Audio-IAudioPlaybackDeviceProbe-EnumerateNeverThrows
            tests:
              - AudioDeviceFactory_Constructor_InjectedProbes_ExposesInjectedProbes
              - AudioDeviceFactory_Contracts_SubstitutedWithMocks_BehaveAsConfigured
              - UnavailableAudioCaptureDevice_IsAvailable_Read_ReturnsFalse
              - UnavailableAudioPlaybackDevice_IsAvailable_Read_ReturnsFalse
              - UnavailableAudioCaptureDeviceProbe_Enumerate_Always_ReturnsEmptyList
              - UnavailableAudioPlaybackDeviceProbe_Enumerate_Always_ReturnsEmptyList

          - id: Speech-Audio-PreferredHostApiEnumeration
            title: >-
              The AudioSubsystem shall list each physical audio device once per enumeration.
            justification: |
              Restricting enumeration to one host API avoids duplicate listings of the same
              physical device under multiple PortAudio backends.
            children:
              - Speech-Audio-PortAudioCaptureDeviceProbe-PreferredHostOnly
              - Speech-Audio-PortAudioPlaybackDeviceProbe-PreferredHostOnly
              - Speech-Audio-PortAudio-PreferredHostApiResolution
              - Speech-Audio-PortAudio-HostApiIndexResolution
              - Speech-Audio-PortAudioCaptureDeviceProbe-EmptyOnMissingBackend
              - Speech-Audio-PortAudioPlaybackDeviceProbe-EmptyOnMissingBackend
            tests:
              - PortAudioCaptureDeviceProbe_Enumerate_MixedHostApis_ReturnsOnlyPreferredInputDevices
              - PortAudioPlaybackDeviceProbe_Enumerate_MixedHostApis_ReturnsOnlyPreferredOutputDevices
              - PortAudioEnvironment_TryResolvePreferredHostApi_InitializedAndMapped_ReturnsHostApiInfo
              - windows@PortAudioEnvironment_ResolvePreferredHostApiType_Windows_ReturnsWasapi
              - ubuntu@PortAudioEnvironment_ResolvePreferredHostApiType_Linux_ReturnsAlsa
              - macos@PortAudioEnvironment_ResolvePreferredHostApiType_MacOs_ReturnsCoreAudio

          - id: Speech-Audio-RealCaptureDevice
            title: >-
              The AudioSubsystem shall provide a real capture-device implementation that can
              resolve a selected or default input device and surface captured sample blocks.
            justification: |
              The library's speech-recognition pipeline requires a real audio-input source for
              manual end-to-end use outside CI, while automated tests still need a mockable seam.
            children:
              - Speech-Audio-PortAudioCaptureDevice-AvailabilityReflectsResolution
              - Speech-Audio-PortAudioCaptureDevice-FrameDelivery
              - Speech-Audio-PortAudioCaptureDevice-NativeFaultsThrowUnavailable
            tests:
              - PortAudioCaptureDevice_IsAvailable_NoResolvableDevice_ReturnsFalse
              - PortAudioCaptureDevice_Start_StreamCapturesSamples_RaisesFrameCaptured
              - PortAudioCaptureDevice_Start_OpenFails_ThrowsAudioDeviceUnavailableException

          - id: Speech-Audio-RealPlaybackDevice
            title: >-
              The AudioSubsystem shall provide a real playback-device implementation that can
              resolve a selected or default output device and stream queued samples.
            justification: |
              The library's speech-synthesis pipeline requires a real audio-output sink
              for manual end-to-end use outside CI, while automated tests still need a mockable seam.
            children:
              - Speech-Audio-PortAudioPlaybackDevice-AvailabilityReflectsResolution
              - Speech-Audio-PortAudioPlaybackDevice-ResolutionFaultsContained
              - Speech-Audio-PortAudioPlaybackDevice-NullEnvironmentRejected
              - Speech-Audio-PortAudioPlaybackDevice-UnresolvedOperationsThrow
              - Speech-Audio-PortAudioPlaybackDevice-NullWriteRejected
              - Speech-Audio-PortAudioPlaybackDevice-NamedSelectionResolved
              - Speech-Audio-PortAudioPlaybackDevice-QueuedPlayback
              - Speech-Audio-PortAudioPlaybackDevice-RestartNeverReplaysStaleAudio
              - Speech-Audio-PortAudioPlaybackDevice-WriteCopiesBuffer
              - Speech-Audio-PortAudioPlaybackDevice-EmptyWriteIgnored
              - Speech-Audio-PortAudioPlaybackDevice-UnderrunZeroFill
              - Speech-Audio-PortAudioPlaybackDevice-OpenFailureThrowsUnavailable
              - Speech-Audio-PortAudioPlaybackDevice-StartFailureThrowsUnavailable
              - Speech-Audio-PortAudioPlaybackDevice-StartFailureDisposesStream
              - Speech-Audio-PortAudioPlaybackDevice-StopFailureThrowsUnavailable
              - Speech-Audio-PortAudioPlaybackDevice-StopFailureKeepsStreamActive
              - Speech-Audio-PortAudioPlaybackDevice-StartRejectedAfterStopFailure
              - Speech-Audio-PortAudioPlaybackDevice-StopRetryReleasesStream
              - Speech-Audio-PortAudioPlaybackDevice-DisposeFailureThrowsUnavailable
              - Speech-Audio-PortAudioPlaybackDevice-IdempotentStart
              - Speech-Audio-IAudioPlaybackDevice-PendingSampleCount
              - Speech-Audio-PortAudioPlaybackDevice-PendingSampleCount
              - Speech-Audio-PortAudioPlaybackDevice-PendingSampleCountExcludesZeroFill
              - Speech-Audio-PortAudioPlaybackDevice-PendingSampleCountReset
              - Speech-Audio-PortAudioPlaybackDevice-PendingSampleCountZeroWhenUnresolved
            tests:
              - PortAudioPlaybackDevice_IsAvailable_NoResolvableDevice_ReturnsFalse
              - PortAudioPlaybackDevice_Write_StreamRequestsSamples_DrainsQueueAndZeroFills
              - PortAudioPlaybackDevice_Start_OpenFails_ThrowsAudioDeviceUnavailableException

          - id: Speech-Audio-FileBackedPlaybackDevice
            title: >-
              The AudioSubsystem shall provide a file-backed playback-device implementation that
              writes queued samples to a WAV file as 16-bit PCM instead of rendering them through
              real hardware.
            justification: |
              Any host application - not only a command-line tool - needs a deterministic,
              file-based way to capture synthesized speech (for example, for its own automated
              tests), the same generic need the demo application's own temporary, non-reusable
              WavFileWriter previously served informally.
            children:
              - Speech-Audio-WavFileAudioPlaybackDevice-AlwaysAvailable
              - Speech-Audio-WavFileAudioPlaybackDevice-WriteEncodesPcm
              - Speech-Audio-WavFileAudioPlaybackDevice-WriteClampsSamples
              - Speech-Audio-WavFileAudioPlaybackDevice-ReportsConstructedFormat
              - Speech-Audio-WavFileAudioPlaybackDevice-PendingSampleCountAlwaysZero
              - Speech-Audio-WavFileAudioPlaybackDevice-FinalizesHeaderOnDispose
              - Speech-Audio-WavFileAudioPlaybackDevice-DisposeIsIdempotent
              - Speech-Audio-WavFileAudioPlaybackDevice-ArgumentValidation
              - Speech-Audio-WavFileAudioPlaybackDevice-WriteBufferValidation
              - Speech-Audio-WavFileAudioPlaybackDevice-WriteAfterDisposeRejected
              - Speech-Audio-WavFileAudioPlaybackDevice-StartStopAreNoOps
            tests:
              - WavFileAudioPlaybackDevice_IsAvailable_Always_ReturnsTrue
              - WavFileAudioPlaybackDevice_WriteThenDispose_RoundTripsSamplesWithinQuantizationTolerance

          - id: Speech-Audio-FileBackedCaptureDevice
            title: >-
              The AudioSubsystem shall provide a file-backed capture-device implementation that
              reads a mono, 16-bit PCM WAV file and delivers it as normalized capture frames
              instead of capturing from real microphone hardware, signaling end-of-file through
              an additive event.
            justification: |
              Any host application - not only a command-line tool - needs a deterministic
              way to drive speech recognition from a pre-recorded file, mirroring the identical
              file-based need on the playback side above. This is a deliberate grouping parent:
              each child requirement states one criterion.
            children:
              - Speech-Audio-WavFileAudioCaptureDevice-AlwaysAvailable
              - Speech-Audio-WavFileAudioCaptureDevice-DeliversFileContents
              - Speech-Audio-WavFileAudioCaptureDevice-EndOfFileReached
              - Speech-Audio-WavFileAudioCaptureDevice-EndOfFileSuppressedOnStop
              - Speech-Audio-WavFileAudioCaptureDevice-ReportsResolvedFormat
              - Speech-Audio-WavFileAudioCaptureDevice-ZeroFormatBeforeStart
              - Speech-Audio-WavFileAudioCaptureDevice-UnsupportedFormatThrowsInvalidOperationException
              - Speech-Audio-WavFileAudioCaptureDevice-ArgumentValidation
            tests:
              - WavFileAudioCaptureDevice_IsAvailable_Always_ReturnsTrue
              - WavFileAudioCaptureDevice_Start_FixtureFile_DeliversExpectedTotalSampleCount
              - WavFileAudioCaptureDevice_Start_FixtureFile_RaisesEndOfFileReachedExactlyOnceAfterLastFrame

          - id: Speech-Audio-PortAudioInterop
            title: >-
              The AudioSubsystem shall degrade gracefully, enumerating no devices, when the
              native audio runtime is unavailable.
            justification: |
              A machine without the native audio runtime is an ordinary deployment state, and
              hosts and CI must still be able to enumerate (an empty list) without failure. How
              the native runtime is isolated for testing is described in the AudioSubsystem
              design document.
            children:
              - Speech-Audio-PortAudio-Seam
            tests:
              - PortAudioEnvironment_TryResolvePreferredHostApi_InitializationFails_ReturnsFalseAndCachesFailure
              - PortAudioCaptureDeviceProbe_Enumerate_PreferredHostApiMissing_ReturnsEmptyList

          - id: Speech-Audio-CaptureFormatDisclosure
            title: >-
              The AudioSubsystem shall disclose the channel count and sample rate of the audio a
              capture device actually delivers, so a consumer can convert that audio into another
              format correctly.
            justification: |
              Captured sample blocks carry no format metadata of their own, and a device resolves
              whatever format its hardware defaults to. Downstream consumers - notably speech
              recognition, whose models require one fixed mono rate - cannot resample or downmix
              correctly without being told the resolved format.
            children:
              - Speech-Audio-IAudioCaptureDevice-CaptureFormat
              - Speech-Audio-PortAudioCaptureDevice-CaptureFormat
              - Speech-Audio-PortAudioCaptureDevice-ZeroCaptureFormatWhenUnresolved
              - Speech-Audio-UnavailableAudioCaptureDevice-ZeroCaptureFormat
            tests:
              - PortAudioCaptureDevice_CaptureFormat_ResolvedDevice_ReflectsResolvedDeviceFormat
              - UnavailableAudioCaptureDevice_CaptureFormat_Read_ReturnsZeroRateAndChannelCount

          - id: Speech-Audio-PlaybackFormatDisclosure
            title: >-
              The AudioSubsystem shall disclose the channel count and sample rate of the audio a
              playback device actually renders, so a consumer can convert audio into that format
              correctly before writing it.
            justification: |
              A playback device resolves whatever format its hardware defaults to, and Write
              carries no format metadata of its own. Downstream consumers - notably speech
              synthesis, whose engine produces one fixed mono rate - cannot resample or upmix
              correctly without being told the resolved format, mirroring the identical
              capture-side requirement above.
            children:
              - Speech-Audio-IAudioPlaybackDevice-PlaybackFormat
              - Speech-Audio-PortAudioPlaybackDevice-PlaybackFormat
              - Speech-Audio-PortAudioPlaybackDevice-ZeroPlaybackFormatWhenUnresolved
              - Speech-Audio-UnavailableAudioPlaybackDevice-ZeroPlaybackFormat
            tests:
              - PortAudioPlaybackDevice_PlaybackFormat_ResolvedDevice_ReflectsResolvedDeviceFormat
              - UnavailableAudioPlaybackDevice_PlaybackFormat_Read_ReturnsZeroRateAndChannelCount

          - id: Speech-Audio-UnavailableFallbacks
            title: >-
              The AudioSubsystem shall provide honest unavailable fallback implementations of
              every capture/playback device and probe interface that report unavailability
              rather than throwing.
            justification: |
              Per this library's "nothing throws at composition" decision, obtaining and
              holding a fallback device or probe must never throw.
            children:
              - Speech-Audio-UnavailableAudioCaptureDevice-ReportsUnavailable
              - Speech-Audio-UnavailableAudioPlaybackDevice-ReportsUnavailable
              - Speech-Audio-UnavailableAudioCaptureDeviceProbe-EmptyEnumeration
              - Speech-Audio-UnavailableAudioPlaybackDeviceProbe-EmptyEnumeration
            tests:
              - UnavailableAudioCaptureDevice_IsAvailable_Read_ReturnsFalse
              - UnavailableAudioPlaybackDevice_IsAvailable_Read_ReturnsFalse
              - UnavailableAudioCaptureDeviceProbe_Enumerate_Always_ReturnsEmptyList
              - UnavailableAudioPlaybackDeviceProbe_Enumerate_Always_ReturnsEmptyList

          - id: Speech-Audio-UnavailableFallbackOperationsThrow
            title: >-
              The AudioSubsystem shall throw a documented exception from an unavailable fallback
              device only when an operational member is actually invoked.
            justification: |
              Only misuse of an already unavailable device is a programming error that should
              surface as an exception.
            children:
              - Speech-Audio-UnavailableAudioCaptureDevice-OperationsThrow
              - Speech-Audio-UnavailableAudioPlaybackDevice-OperationsThrow
              - Speech-Audio-AudioDeviceUnavailableException-Thrown
            tests:
              - UnavailableAudioCaptureDevice_Start_Always_ThrowsAudioDeviceUnavailableException
              - UnavailableAudioPlaybackDevice_Write_Always_ThrowsAudioDeviceUnavailableException

          - id: Speech-Audio-DeviceRefresh
            title: >-
              The AudioSubsystem shall make newly attached or removed audio devices visible to a
              caller on demand, without recomposing the factory.
            justification: |
              Audio devices are hot-pluggable; a host application that has already composed an
              AudioDeviceFactory needs a way to make newly attached or removed hardware visible
              without recomposing the whole factory.
            children:
              - Speech-Audio-AudioDeviceFactory-RefreshDevices
              - Speech-Audio-AudioDeviceFactory-RefreshReevaluatesDefaultProbes
              - Speech-Audio-AudioDeviceFactory-RefreshPreservesInjectedProbes
            tests:
              - AudioDeviceFactory_RefreshDevices_DelegatesToEnvironmentRefresh
              - PortAudioEnvironment_Refresh_NoActiveStreams_ReinitializesAndReflectsNewOutcome

          - id: Speech-Audio-DeviceRefreshInvalidation
            title: >-
              The AudioSubsystem shall prevent a device instance created before a completed
              device-table refresh from starting a stream.
            justification: |
              PortAudio device indices are runtime-assigned and can be reused for a different
              physical device (or become invalid entirely) once the device table is re-scanned.
              A pre-refresh instance must fail safely and direct the caller to create a fresh
              instance via AudioDeviceFactory rather than open a stream against the wrong
              hardware.
            children:
              - Speech-Audio-PortAudioCaptureDevice-StaleAfterRefreshThrows
              - Speech-Audio-PortAudioPlaybackDevice-StaleAfterRefreshThrows
              - Speech-Audio-PortAudio-PortAudioEnvironment-RefreshAdvancesGeneration
            tests:
              - PortAudioCaptureDevice_Start_EnvironmentRefreshedAfterConstruction_ThrowsAudioDeviceUnavailableException
              - PortAudioPlaybackDevice_Start_EnvironmentRefreshedAfterConstruction_ThrowsAudioDeviceUnavailableException

          - id: Speech-Audio-DeviceRefreshRefusal
            title: >-
              The AudioSubsystem shall refuse a device-table refresh with a documented exception
              rather than tearing down a stream that is currently in use.
            justification: |
              A refresh must never silently invalidate a stream that is currently open.
            children:
              - Speech-Audio-PortAudio-PortAudioEnvironment-RefreshRefusedWhileActive
              - Speech-Audio-PortAudioCaptureDevice-ActiveStreamRegistration
              - Speech-Audio-PortAudioPlaybackDevice-ActiveStreamRegistration
              - Speech-Audio-PortAudioCaptureDevice-ActiveStreamDeregistration
              - Speech-Audio-PortAudioPlaybackDevice-ActiveStreamDeregistration
              - Speech-Audio-PortAudioPlaybackDevice-ActiveStreamDeregistrationOnStartFailure
              - Speech-Audio-AudioDeviceFactory-RefreshPropagatesInUse
              - Speech-Audio-AudioDeviceInUseException-Constructors
            tests:
              - AudioDeviceFactory_RefreshDevices_ActiveStreamInUse_PropagatesAudioDeviceInUseException
              - PortAudioEnvironment_Refresh_ActiveStreamRegistered_ThrowsAudioDeviceInUseExceptionAndDoesNotTerminate

          - id: Speech-Audio-AudioFileReading
            title: >-
              The AudioSubsystem shall decode WAV and FLAC audio files into floating-point clips.
            justification: |
              Hosts keep reference clips and test audio as WAV or FLAC files. That decoding is
              managed-only, behaving identically on every platform, is a design detail described
              in the AudioSubsystem design document. This is a deliberate grouping parent:
              each child requirement states one criterion.
            children:
              - Speech-Audio-AudioFileReader-DetectsContainer
              - Speech-Audio-AudioFileReader-DecodesFileOrStream
              - Speech-Audio-AudioFileReader-DecodesStream
              - Speech-Audio-AudioFileReader-ReadsFromCurrentStreamPosition
              - Speech-Audio-AudioFileReader-DecodesId3PrefixedFlac
              - Speech-Audio-AudioFileReader-ListsSupportedExtensions
              - Speech-Audio-AudioFileReader-ReportsMissingFile
              - Speech-Audio-AudioFileReader-ReportsIoFailures
              - Speech-Audio-AudioFileReader-ReportsMalformedFile
              - Speech-Audio-AudioFileReader-ReportsUnsupportedEncoding
              - Speech-Audio-AudioFileReader-NamesPathInFailures
              - Speech-Audio-AudioFileReader-NoPathForStreamFailures
              - Speech-Audio-AudioFileReader-RejectsNullStream
              - Speech-Audio-AudioFileReader-RejectsBlankPath
              - Speech-Audio-AudioFileReader-RejectsNullPath
              - Speech-Audio-AudioFileReader-RejectsNegativeMaxSamples
              - Speech-Audio-AudioFileReader-ByteCap
              - Speech-Audio-AudioFileReader-MaxSamples
              - Speech-Audio-AudioFileReader-VerifyChecksums
              - Speech-Audio-AudioFileReader-VerifyChecksumsOptOut
              - Speech-Audio-AudioFileReader-ReadMono
              - Speech-Audio-AudioFileReader-ReadMonoDownMix
              - Speech-Audio-AudioClip-DerivedMembers
              - Speech-Audio-AudioClip-ToMono
              - Speech-Audio-AudioClip-ToPcm16
              - Speech-Audio-AudioClip-ToPcm16Clamping
              - Speech-Audio-AudioClip-ToMonoIndependentCopy
              - Speech-Audio-AudioClip-ValidatesInput
              - Speech-Audio-AudioClip-ValidatesRateAndChannels
              - Speech-Audio-AudioClip-EmptyClip
              - Speech-Audio-AudioClip-PartialFrameTruncation
              - Speech-Audio-WavDecoder-Encodings
              - Speech-Audio-WavDecoder-ExtremeValueScaling
              - Speech-Audio-WavDecoder-FloatPassThrough
