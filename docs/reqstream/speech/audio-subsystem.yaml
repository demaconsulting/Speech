          - id: Speech-Audio-ClipConversion
            title: >-
              The AudioSubsystem shall provide down-mixing and resampling of decoded audio clips.
            justification: |
              Recognition and synthesis models require audio at a fixed mono rate; converting
              in the library keeps that logic in one tested place. This is a deliberate grouping
              parent: each child requirement states one criterion.
            children:
              - Speech-Audio-AudioResampler-DownMix
              - Speech-Audio-AudioResampler-DownMixChannelCountValidation
              - Speech-Audio-AudioResampler-DownMixPartialFrame
              - Speech-Audio-AudioResampler-Resample
              - Speech-Audio-AudioResampler-ResampleTonePreserved
              - Speech-Audio-AudioResampler-ResampleAntiAliasing
              - Speech-Audio-AudioResampler-ResampleEqualRates
              - Speech-Audio-AudioResampler-ResampleRateValidation
              - Speech-Audio-AudioResampler-ToMonoResampled
              - Speech-Audio-AudioResampler-ToMonoResampledTargetRate
              - Speech-Audio-WindowedSincLowpassFilter-AntiAliasing
              - Speech-Audio-AudioResampler-ToMonoResampledNullClip
              - Speech-Audio-AudioResampler-ToMonoResampledRateValidation
            tests:
              - AudioResampler_DownMix_AveragesChannels
              - AudioResampler_ToMonoResampled_StereoClip_ProducesMonoAtTargetRate
