---
# Software Unit Requirements for IModelDownloadClient
#
# These requirements describe the observable contract of the IModelDownloadClient unit (what a
# conforming download client does for a caller), decomposing the parent ModelManagementSubsystem
# requirements. The interface's member shape is documented in the unit design, not here.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: IModelDownloadClient Requirements
            requirements:
              - id: Speech-Models-IModelDownloadClient-Seam
                title: >-
                  The model download client contract shall let the model downloader's
                  fetch/verify/install behavior run against a substitute implementation with no
                  real network access.
                justification: |
                  This library's "own interfaces over direct OTS types" decision requires a
                  library-owned abstraction so that the downloader's orchestration can be unit
                  tested deterministically with a fake implementation.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForSameModelId_AreSerialized

              - id: Speech-Models-IModelDownloadClient-SuccessDeliversBytes
                title: >-
                  A successful download through the model download client contract shall write
                  exactly the fetched bytes to the caller-supplied destination and shall leave
                  that destination open for the caller.
                justification: |
                  The caller verifies and installs the destination's content and owns its
                  lifetime; a client that truncated, altered, or closed the destination would
                  break checksum verification and the caller's cleanup.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_StubbedServer_DownloadsExactBytesWithProgress
                  - HttpModelDownloadClient_DownloadAsync_Success_LeavesDestinationOpen

              - id: Speech-Models-IModelDownloadClient-ProgressReporting
                title: >-
                  A download through the model download client contract shall report progress as
                  the bytes arrive, describing a single-file transfer and ending at the total
                  number of bytes fetched.
                justification: |
                  Callers drive progress displays from these reports, and a multi-file caller
                  rewrites the file position itself, so each client reports only the one file it
                  was asked to fetch.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_StubbedServer_DownloadsExactBytesWithProgress

              - id: Speech-Models-IModelDownloadClient-ThrowsOnFailure
                title: >-
                  A download through the model download client contract shall fail with an
                  exception, rather than silently truncate, on a non-success response or a
                  transport failure.
                justification: |
                  A caller can only tell a complete download from a partial one if every failure
                  surfaces as an exception.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NonSuccessResponse_ThrowsHttpRequestException

              - id: Speech-Models-IModelDownloadClient-CancellationSurfaces
                title: >-
                  A download through the model download client contract shall surface
                  cancellation of the caller's token as an operation-canceled failure.
                justification: |
                  The downloader relies on cancellation propagating so it can discard the staging
                  directory and install nothing.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_CanceledToken_ThrowsOperationCanceledException
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing
