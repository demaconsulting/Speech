---
# Software Unit Requirements for IModelDownloadClient
#
# These requirements describe the design-level behavior of the IModelDownloadClient unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: IModelDownloadClient Requirements
            requirements:
              - id: Speech-Models-IModelDownloadClient-Seam
                title: >-
                  The IModelDownloadClient interface shall define a single mockable
                  DownloadAsync(Uri, Stream, IProgress, CancellationToken) member that isolates
                  SpeechModelDownloader from any concrete HTTP implementation.
                justification: |
                  This library's "own interfaces over direct OTS types" decision requires a
                  library-owned abstraction so that SpeechModelDownloader's
                  fetch/verify/install orchestration can be unit tested with a fake
                  implementation and no real network access, while the production path still uses
                  a real HTTP implementation.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForSameModelId_AreSerialized
                  - HttpModelDownloadClient_DownloadAsync_StubbedServer_DownloadsExactBytesWithProgress

              - id: Speech-Models-IModelDownloadClient-NoPerCallMirrorAuth
                title: >-
                  The IModelDownloadClient interface's DownloadAsync member shall accept no
                  per-call mirror-authentication parameter, so that any mirror authentication
                  an implementation applies is configured once, at construction, instead.
                justification: |
                  This member's signature is part of this library's public API surface, so it
                  stays a fixed 4-parameter signature: a host's own implementation remains
                  source-compatible across releases (enforced implicitly, because every fake and
                  implementation must implement exactly this member). Adding a
                  per-call mirrorAuth parameter would break every existing host implementation of
                  this interface on upgrade; configuring mirror authentication once at
                  construction (see HttpModelDownloadClient's constructor) achieves the same
                  behavior without widening this seam's signature.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NoMirrorAuth_SendsNoAuthorizationHeader
                  - HttpModelDownloadClient_DownloadAsync_BearerTokenMirror_SendsBearerAuthorizationHeader

              - id: Speech-Models-IModelDownloadClient-ThrowsOnFailure
                title: >-
                  The IModelDownloadClient interface's DownloadAsync member shall throw, rather
                  than silently truncate, on a non-success response or transport failure.
                justification: |
                  A caller can only tell a complete download from a partial one if every failure
                  surfaces as an exception.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NonSuccessResponse_ThrowsHttpRequestException

              - id: Speech-Models-IModelDownloadClient-CancellationSurfaces
                title: >-
                  The IModelDownloadClient interface's DownloadAsync member shall surface
                  cancellation of its token as an OperationCanceledException.
                justification: |
                  The downloader relies on cancellation propagating so it can discard the staging
                  directory and install nothing.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing
