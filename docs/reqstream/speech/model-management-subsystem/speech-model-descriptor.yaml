---
# Software Unit Requirements for SpeechModelDescriptor
#
# These requirements describe the design-level behavior of the SpeechModelDescriptor unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelDescriptor Requirements
            requirements:
              - id: Speech-Models-SpeechModelDescriptor-Snapshot
                title: >-
                  The SpeechModelDescriptor record shall pair one model with its install state as
                  an immutable snapshot that compares equal when both are the same.
                justification: |
                  SpeechModelCatalog.Enumerate() must return a value a host can safely bind to a
                  UI list without holding a live reference back to the catalog; an immutable
                  snapshot pairing a model with the state observed at build time achieves this.
                tests:
                  - SpeechModelDescriptor_Constructor_ValidModel_ExposesModelAndPassthroughProperties
                  - SpeechModelDescriptor_StateTransition_DifferentState_ProducesUnequalDescriptor
                  - SpeechModelDescriptor_SameModelAndState_AreEqual

              - id: Speech-Models-SpeechModelDescriptor-NullModelRejection
                title: >-
                  The SpeechModelDescriptor record shall reject a null model at construction.
                justification: |
                  A descriptor with no underlying model would have nothing to describe.
                tests:
                  - SpeechModelDescriptor_Constructor_NullModel_ThrowsArgumentNullException

              - id: Speech-Models-SpeechModelDescriptor-PassthroughProperties
                title: >-
                  The SpeechModelDescriptor record shall expose convenience passthrough properties
                  for the model's identity, role, and declared license (name and optional URL).
                justification: |
                  The passthrough properties save a host from unwrapping Model for the common
                  fields it needs to display, including license information for a host that
                  wants to surface it without parsing DisplayName.
                tests:
                  - SpeechModelDescriptor_Constructor_ValidModel_ExposesModelAndPassthroughProperties
                  - SpeechModelDescriptor_Passthrough_NonDefaultLicense_MirrorsModel
                  - SpeechModelDescriptor_Passthrough_NonDefaultIdentity_MirrorsModelLive
