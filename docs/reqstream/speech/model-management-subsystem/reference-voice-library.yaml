---
# Software Unit Requirements for ReferenceVoiceLibrary
#
# Unit-level behavior of ReferenceVoiceLibrary, decomposing the parent ModelManagementSubsystem
# requirements. Covered by
# test/DemaConsulting.Speech.Tests/ModelManagementSubsystem/ReferenceVoiceLibraryTests.cs using
# synthetic archives and a fake download client (no network access).

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: ReferenceVoiceLibrary Requirements
            requirements:
              - id: Speech-Models-ReferenceVoiceLibrary-StoreLayout
                title: >-
                  The ReferenceVoiceLibrary class shall keep each installed pack inside the model
                  store root, in an area of its own that is separate from the models, so that a pack
                  is found again from the same store root and one pack does not disturb another.
                justification: |
                  Keeping reference voices beside the models they serve lets one store location
                  (and one configurable root) cover everything. The exact folder hierarchy is a
                  design decision recorded in the unit design.
                tests:
                  - ReferenceVoiceLibrary_Paths_FollowDocumentedLayout

              - id: Speech-Models-ReferenceVoiceLibrary-UserFolder
                title: >-
                  The ReferenceVoiceLibrary class shall keep a user voice folder in the reference-voice
                  area of the model store root, create it on request, and list the voices placed in it.
                justification: |
                  Users need one well-known place to drop their own reference recordings.
                tests:
                  - ReferenceVoiceLibrary_Paths_FollowDocumentedLayout
                  - ReferenceVoiceLibrary_EnsureUserDirectory_CreatesFolderAndListsUserVoices

              - id: Speech-Models-ReferenceVoiceLibrary-AudioFileExtensions
                title: >-
                  The ReferenceVoiceLibrary class shall list only files with a supported audio
                  extension (.wav or .flac, matched case-insensitively) as voices.
                justification: |
                  Other files in a voice folder (notes, readmes) are not voices and must not be
                  offered to hosts.
                tests:
                  - ReferenceVoiceLibrary_EnsureUserDirectory_CreatesFolderAndListsUserVoices

              - id: Speech-Models-ReferenceVoiceLibrary-LazyFolderCreation
                title: >-
                  The ReferenceVoiceLibrary class shall not create any reference-voice folder until
                  it is asked to.
                justification: |
                  Lazy creation keeps merely constructing or listing a library free of side
                  effects on the file system.
                tests:
                  - ReferenceVoiceLibrary_EnumerateVoices_NothingPresent_ReturnsEmptyWithoutCreatingFolders

              - id: Speech-Models-ReferenceVoiceLibrary-ArgumentValidation
                title: >-
                  The ReferenceVoiceLibrary class shall reject a null store, and null, blank or unknown
                  pack ids, with an exception rather than operating on them.
                justification: |
                  Pack ids become folder names, so an unknown or null id must fail fast instead of
                  producing a path outside the pack area.
                tests:
                  - ReferenceVoiceLibrary_InvalidArguments_Throw
                  - ReferenceVoiceLibrary_BlankPackId_Throws

              - id: Speech-Models-ReferenceVoiceLibrary-PackInstall
                title: >-
                  The ReferenceVoiceLibrary class shall download a pack's whole archive, verify it
                  against the pack's checksum, and install its voices from the verified archive.
                justification: |
                  A pack gets the same integrity and atomic-install guarantees as a model.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_Success_InstallsVoicesAndUpdatesState

              - id: Speech-Models-ReferenceVoiceLibrary-MirrorRequest
                title: >-
                  The ReferenceVoiceLibrary class shall request the mirror-resolved archive address
                  when a download mirror is configured.
                justification: |
                  Hosts behind a restricted network fetch the pack from their mirror, as they do
                  for models.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_WithMirror_RequestsMirrorUri

              - id: Speech-Models-ReferenceVoiceLibrary-RepeatInstallNoOp
                title: >-
                  The ReferenceVoiceLibrary class shall treat an install of an already installed
                  pack as a no-op that downloads nothing.
                justification: |
                  A repeat install must not re-download a large archive.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_SecondCall_IsNoOp

              - id: Speech-Models-ReferenceVoiceLibrary-FailedInstallReporting
                title: >-
                  The ReferenceVoiceLibrary class shall install nothing and report a failed pack
                  state when the archive fails its checksum.
                justification: |
                  A failed install must never be reported as installed.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_ChecksumMismatch_InstallsNothingAndReportsFailedState

              - id: Speech-Models-ReferenceVoiceLibrary-NoVoicesArchiveFails
                title: >-
                  The ReferenceVoiceLibrary class shall install nothing and report a failed pack
                  state when the archive contains no voices.
                justification: |
                  An archive without voices is not a usable pack and must not read as installed.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_ArchiveWithoutVoices_FailsWithoutInstalling

              - id: Speech-Models-ReferenceVoiceLibrary-PackStateReporting
                title: >-
                  The ReferenceVoiceLibrary class shall report a pack as not downloaded before an
                  install, downloaded once installed, and failed after a failed install, and as
                  not downloaded again after an uninstall.
                justification: |
                  Hosts drive their pack UI from this state.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_Success_InstallsVoicesAndUpdatesState
                  - ReferenceVoiceLibrary_InstallPack_ChecksumMismatch_InstallsNothingAndReportsFailedState
                  - ReferenceVoiceLibrary_UninstallPackAsync_AfterDispose_StillRemoves

              - id: Speech-Models-ReferenceVoiceLibrary-PackUninstall
                title: >-
                  The ReferenceVoiceLibrary class shall uninstall a pack without touching the user
                  folder.
                justification: |
                  The user folder holds the user's own files and must survive any pack operation.
                tests:
                  - ReferenceVoiceLibrary_UninstallPackAsync_RemovesPackKeepsUserFolder

              - id: Speech-Models-ReferenceVoiceLibrary-UninstallDiscardsUpgradeBackup
                title: >-
                  The ReferenceVoiceLibrary class shall discard any upgrade backup of a pack when
                  that pack is uninstalled.
                justification: |
                  A leftover upgrade backup must not resurrect a removed pack.
                tests:
                  - ReferenceVoiceLibrary_UninstallPackAsync_DiscardsUpgradeBackup

              - id: Speech-Models-ReferenceVoiceLibrary-UninstallWaitsForInstall
                title: >-
                  The ReferenceVoiceLibrary class shall, when a pack's install is in flight, wait
                  for it (honoring cancellation) and then uninstall instead of throwing or racing it.
                justification: |
                  An uninstall must not run at the same time as an install of the same pack, or it
                  could delete files the install is writing, and waiting must not block the caller's
                  thread.
                tests:
                  - ReferenceVoiceLibrary_UninstallPackAsync_WhileInstalling_WaitsThenRemoves
                  - ReferenceVoiceLibrary_UninstallPackAsync_CanceledWhileWaiting_LeavesInstallIntact
                  - ReferenceVoiceLibrary_UninstallPackAsync_AlreadyCanceled_DoesNothingAndReleasesLock

              - id: Speech-Models-ReferenceVoiceLibrary-UninstallCompletesOnceStarted
                title: >-
                  The ReferenceVoiceLibrary class shall complete an uninstall that has started even when
                  the caller cancels afterwards.
                justification: |
                  Cancellation may only abort the wait for the pack; a half-removed pack would read as
                  neither installed nor removed.
                tests:
                  - ReferenceVoiceLibrary_UninstallPackAsync_CanceledAfterLockAcquired_StillRemoves

              - id: Speech-Models-ReferenceVoiceLibrary-BackupScanFailureTolerated
                title: >-
                  The ReferenceVoiceLibrary class shall report, rather than throw, a file-system failure
                  to look for leftover upgrade backups while installing or uninstalling a pack.
                justification: |
                  Backup recovery and cleanup are best-effort and are retried by the next install, so
                  they must not fail an otherwise healthy operation.
                tests:
                  - ReferenceVoiceLibrary_InstallAndUninstall_UnlistableModelDirectory_WarnsAndDoesNotThrowFileSystemError

              - id: Speech-Models-ReferenceVoiceLibrary-Disposal
                title: >-
                  The ReferenceVoiceLibrary class shall tolerate repeated disposal.
                justification: |
                  Disposal must be idempotent so hosts can dispose defensively.
                tests:
                  - ReferenceVoiceLibrary_Dispose_Twice_DoesNotThrow

              - id: Speech-Models-ReferenceVoiceLibrary-DisposeDuringInstall
                title: >-
                  The ReferenceVoiceLibrary class shall let an install that is already running
                  finish when the library is disposed, releasing its resources afterwards.
                justification: |
                  Disposing must not tear resources down under a running install.
                tests:
                  - ReferenceVoiceLibrary_Dispose_WhileInstalling_LetsInstallFinish

              - id: Speech-Models-ReferenceVoiceLibrary-UninstallAfterDispose
                title: >-
                  The ReferenceVoiceLibrary class shall still uninstall a pack after the library was
                  disposed.
                justification: |
                  Removing a pack needs no download resources, so cleanup after disposal stays
                  possible.
                tests:
                  - ReferenceVoiceLibrary_UninstallPackAsync_AfterDispose_StillRemoves

              - id: Speech-Models-ReferenceVoiceLibrary-InstallAfterDisposeThrows
                title: >-
                  The ReferenceVoiceLibrary class shall throw ObjectDisposedException when asked to
                  install a pack after it was disposed.
                justification: |
                  An install on a disposed instance must fail visibly rather than use released
                  resources.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_AfterDispose_Throws

              - id: Speech-Models-ReferenceVoiceLibrary-VoiceMerge
                title: >-
                  The ReferenceVoiceLibrary class shall list voices from caller-named directories,
                  then the user folder, then installed packs, and de-duplicate by voice id with the
                  first occurrence winning.
                justification: |
                  A voice a user deliberately supplies must override a bundled one of the same
                  name.
                tests:
                  - ReferenceVoiceLibrary_EnumerateVoices_MergesInPrecedenceOrderFirstIdWins

              - id: Speech-Models-ReferenceVoiceLibrary-DuplicateVoiceDiagnostic
                title: >-
                  The ReferenceVoiceLibrary class shall report a voice hidden by an earlier voice
                  with the same id as an Info diagnostic naming the id.
                justification: |
                  Users wondering why a voice is missing can find the reason in the diagnostics.
                tests:
                  - ReferenceVoiceLibrary_EnumerateVoices_DuplicateId_ReportsInfoDiagnostic

              - id: Speech-Models-ReferenceVoiceLibrary-UnreadableFolderWarning
                title: >-
                  The ReferenceVoiceLibrary class shall skip a voice folder that is not a valid
                  path or cannot be read, report a Warning diagnostic, and keep listing the other
                  folders.
                justification: |
                  One bad folder must not hide every other voice, and the skip must not be silent.
                tests:
                  - ReferenceVoiceLibrary_EnumerateVoices_MalformedExtraPath_WarnsAndContinues
                  - windows@ReferenceVoiceLibrary_EnumerateVoices_UnreadableFolder_WarnsAndContinues

              - id: Speech-Models-ReferenceVoiceLibrary-EmptyListWhenNothingPresent
                title: >-
                  The ReferenceVoiceLibrary class shall return an empty voice list rather than
                  throwing when no voice is present.
                justification: |
                  A first run before any download must simply offer no voices.
                tests:
                  - ReferenceVoiceLibrary_EnumerateVoices_NothingPresent_ReturnsEmptyWithoutCreatingFolders
                  - ReferenceVoiceLibrary_EnumerateVoices_MalformedDirectory_IsSkippedWithoutThrowing

              - id: Speech-Models-ReferenceVoiceLibrary-VoiceNameFormatting
                title: >-
                  The ReferenceVoiceLibrary class shall derive a display name from a voice id by
                  splitting it at underscores, hyphens and spaces, capitalizing each word, and
                  separating a trailing number from its word.
                justification: |
                  Hosts show voices in a list and need a presentable name without per-voice
                  metadata.
                tests:
                  - ReferenceVoiceLibrary_Humanize_FormatsName

              - id: Speech-Models-ReferenceVoiceLibrary-ConsentNotice
                title: >-
                  The ReferenceVoiceLibrary class shall expose a shared non-blank notice telling
                  users to clone only voices they have permission to use.
                justification: |
                  Hosts listing or choosing voices need one shared, consistent warning wording.
                tests:
                  - ReferenceVoiceLibrary_ConsentNotice_MentionsPermissionToClone

              - id: Speech-Models-ReferenceVoiceLibrary-EmotionVariants
                title: >-
                  The ReferenceVoiceLibrary class shall install a pack with its emotion variants by
                  default.
                justification: |
                  Emotion clips let a synthesis model match a voice to the mood of the text.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_Default_AttachesMoodClipsWithoutExtraVoices
                  - ReferenceVoiceLibrary_InstallPack_ProgressOverload_IncludesEmotions

              - id: Speech-Models-ReferenceVoiceLibrary-BaseVoicesOnRequest
                title: >-
                  The ReferenceVoiceLibrary class shall install base voices only, without emotion
                  clips, when the caller asks for no emotions.
                justification: |
                  The emotion clips are the larger part of the pack, so hosts can opt out of them.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_NoEmotions_LeavesVoicesOnly

              - id: Speech-Models-ReferenceVoiceLibrary-NeverDowngradeEmotions
                title: >-
                  The ReferenceVoiceLibrary class shall never downgrade an install that has
                  emotions when base voices only are requested.
                justification: |
                  A later voices-only request must not discard downloaded emotion clips or trigger
                  another download.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_VoicesOnlyOverEmotionInstall_NeverDowngrades

              - id: Speech-Models-ReferenceVoiceLibrary-MoodClipExposure
                title: >-
                  The ReferenceVoiceLibrary class shall make each pack voice's installed emotion
                  clips available by mood name on that voice, each mood returning its usable clip,
                  without adding voice ids.
                justification: |
                  Emotion clips are variants of an existing voice, so voice ids and ordering stay
                  unchanged. How the moods are represented is a design decision.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_Default_AttachesMoodClipsWithoutExtraVoices

              - id: Speech-Models-ReferenceVoiceLibrary-MoodStemNormalization
                title: >-
                  The ReferenceVoiceLibrary class shall name each mood clip by its trimmed,
                  lower-case file stem, keeping the first file when several stems collapse to one
                  mood, and resolve mood lookups case-insensitively and trimmed.
                justification: |
                  Hosts look moods up by name regardless of how the files were capitalized.
                tests:
                  - ReferenceVoiceLibrary_EnumerateVoices_MoodStemsDifferingByCase_AreDeduplicated

              - id: Speech-Models-ReferenceVoiceLibrary-EmotionUpgrade
                title: >-
                  The ReferenceVoiceLibrary class shall upgrade a voices-only install by installing
                  again with emotions.
                justification: |
                  A host that installed voices only must be able to add the emotion clips later.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_UpgradeFromVoicesOnly_AddsEmotions

              - id: Speech-Models-ReferenceVoiceLibrary-UpgradeRestoresOnFailure
                title: >-
                  The ReferenceVoiceLibrary class shall keep the previous install when an upgrade
                  fails or is canceled.
                justification: |
                  A failed or canceled upgrade must never lose voices the user already has.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_FailedUpgrade_KeepsPreviousInstall
                  - ReferenceVoiceLibrary_InstallPack_CanceledUpgrade_KeepsPreviousInstall

              - id: Speech-Models-ReferenceVoiceLibrary-UpgradeLockedInstall
                title: >-
                  The ReferenceVoiceLibrary class shall throw a SpeechModelStoreException and keep
                  the previous install when an upgrade cannot move the installed folder aside
                  because its files are in use.
                justification: |
                  A locked install must fail visibly without losing the installed voices.
                tests:
                  - windows@ReferenceVoiceLibrary_InstallPack_UpgradeWithLockedCurrent_ThrowsAndKeepsInstall

              - id: Speech-Models-ReferenceVoiceLibrary-AbandonedBackupRestored
                title: >-
                  The ReferenceVoiceLibrary class shall restore an upgrade backup that a previous
                  run abandoned.
                justification: |
                  A crashed upgrade must not lose the voices that were kept aside.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_AbandonedBackup_IsRestored

              - id: Speech-Models-ReferenceVoiceLibrary-InstallSerialization
                title: >-
                  The ReferenceVoiceLibrary class shall serialize concurrent installs of one pack.
                justification: |
                  Concurrent callers must not interleave the upgrade decision and the download for
                  the same pack.
                tests:
                  - ReferenceVoiceLibrary_InstallPack_ConcurrentCalls_AreSerialized

              - id: Speech-Models-ReferenceVoiceLibrary-VariantReporting
                title: >-
                  The ReferenceVoiceLibrary class shall report a pack's installed variants without
                  throwing, returning none for missing or corrupt metadata (so a later install
                  with emotions downloads the pack again).
                justification: |
                  Hosts query variants to decide whether to offer an upgrade; damaged install
                  metadata must not break that query.
                tests:
                  - ReferenceVoiceLibrary_PackVariants_MissingOrCorruptMetadata_AreEmptyAndNeverThrow
