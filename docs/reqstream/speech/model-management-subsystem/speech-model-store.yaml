---
# Software Unit Requirements for SpeechModelStore
#
# These requirements describe the design-level behavior of the SpeechModelStore unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelStore Requirements
            requirements:
              - id: Speech-Models-SpeechModelStore-AtomicSwap
                title: >-
                  The SpeechModelStore class shall atomically swap a verified staging directory
                  into place as a model's new current/ content via a directory rename, writing the
                  install manifest only after the rename succeeds.
                justification: |
                  A same-volume directory rename is atomic and effectively instantaneous on
                  NTFS/POSIX; writing the manifest last means a crash between the two steps is
                  indistinguishable from "not installed", which is the safe direction to fail.
                tests:
                  - SpeechModelStore_CompleteInstall_FirstInstall_CreatesCurrentAndManifest

              - id: Speech-Models-SpeechModelStore-AtomicSwapReplacesExisting
                title: >-
                  The SpeechModelStore class shall, when a model already has current/ content,
                  rename that content aside first and remove it after the new content is in place.
                justification: |
                  A re-install must replace an installed model without ever leaving it half
                  replaced.
                tests:
                  - SpeechModelStore_CompleteInstall_ExistingCurrent_ReplacesContentAndCleansUpOldDirectory

              - id: Speech-Models-SpeechModelStore-NeverTouchesCurrentDuringStaging
                title: >-
                  The SpeechModelStore class shall never touch a model's current/ directory
                  while a download is being fetched and verified into a separate staging
                  directory.
                justification: |
                  A model already loaded by an in-use recognizer/synthesizer must continue
                  reading unaffected content until the swap completes, addressing the
                  download-while-in-use concern.
                tests:
                  - SpeechModelStore_CompleteInstall_ExistingCurrent_ReplacesContentAndCleansUpOldDirectory

              - id: Speech-Models-SpeechModelStore-InstallStateHonesty
                title: >-
                  The SpeechModelStore class shall report a model as installed only when both
                  current/ exists and a valid install manifest accompanies it, never throwing for
                  a missing model, missing manifest, or unreadable manifest.
                justification: |
                  Treating a missing/unreadable manifest as "not installed" rather than an error
                  makes retrying an interrupted install always safe.
                tests:
                  - SpeechModelStore_IsInstalled_NoInstall_ReturnsFalse
                  - SpeechModelStore_IsInstalled_CurrentWithoutManifest_ReturnsFalse
                  - SpeechModelStore_IsInstalled_ManifestIsMalformedJson_ReturnsFalse
                  - SpeechModelStore_IsInstalled_ManifestIsEmptyJsonObject_ReturnsFalse
                  - SpeechModelStore_IsInstalled_ManifestReadAccessDenied_ReturnsFalse

              - id: Speech-Models-SpeechModelStore-InstallRollback
                title: >-
                  The SpeechModelStore class shall restore a model's previously installed
                  current/ content when the swap of a new staging directory into place fails
                  after the existing content was renamed aside.
                justification: |
                  A failed repair must not turn a working installed model into a missing one.
                tests:
                  - SpeechModelStore_CompleteInstall_SecondMoveFails_RollsBackPreviousInstall
                  - SpeechModelStore_CompleteInstall_RepairSwapFails_RestoresPreviousManifest
                  - SpeechModelStore_CompleteInstall_Repair_WritesNewManifest

              - id: Speech-Models-SpeechModelStore-UninstallFailureReporting
                title: >-
                  The SpeechModelStore class shall throw SpeechModelStoreException when an
                  uninstall cannot remove a model's current/ directory or install manifest.
                justification: |
                  Uninstall is an explicit user action; silently leaving content behind would
                  misreport success, so a locked file is surfaced as a documented exception.
                tests:
                  - SpeechModelStore_Uninstall_OpenFileHandleInCurrent_ThrowsSpeechModelStoreException
                  - SpeechModelStore_Uninstall_ManifestDeleteFails_ThrowsSpeechModelStoreException

              - id: Speech-Models-SpeechModelStore-ModelIdValidation
                title: >-
                  The SpeechModelStore class shall reject a null, empty, whitespace-only,
                  invalid-file-name, ".", or ".." model id with an ArgumentException before
                  touching the file system.
                justification: |
                  A model id is used as a single directory name; an unvalidated id could escape
                  its own directory under the storage root.
                tests:
                  - SpeechModelStore_GetModelDirectory_DotSegmentModelId_ThrowsArgumentException
                  - SpeechModelStore_GetModelDirectory_NullModelId_ThrowsArgumentNullException
                  - SpeechModelStore_Uninstall_InvalidModelId_ThrowsArgumentException

              - id: Speech-Models-SpeechModelStore-DefaultRootResolution
                title: >-
                  The SpeechModelStore class shall resolve its root directory under
                  Environment.SpecialFolder.LocalApplicationData by default.
                justification: |
                  Per-user storage under LocalApplicationData is the conventional default for
                  downloaded application data on all supported desktop platforms.
                tests:
                  - SpeechModelStore_Constructor_NoOptions_ResolvesUnderLocalApplicationData

              - id: Speech-Models-SpeechModelStore-RootPathOverrideVerbatim
                title: >-
                  The SpeechModelStore class shall use a host-supplied
                  SpeechModelStoreOptions.RootPathOverride verbatim as its root directory.
                justification: |
                  An override lets a host redirect storage without any library code change.
                tests:
                  - SpeechModelStore_Constructor_RootPathOverride_UsesOverrideVerbatim

              - id: Speech-Models-SpeechModelStore-Uninstall
                title: >-
                  The SpeechModelStore class shall remove an installed model's current/ content
                  and install manifest when explicitly uninstalled, synchronously or asynchronously.
                justification: |
                  Uninstall is an explicit, user-invoked operation; it must actually remove the
                  installed content. An awaitable UninstallAsync lets callers that must not block
                  (a UI) remove a model off their thread.
                tests:
                  - SpeechModelStore_Uninstall_InstalledModel_RemovesCurrentAndManifest
                  - SpeechModelStore_UninstallAsync_InstalledModel_RemovesCurrentAndManifest

              - id: Speech-Models-SpeechModelStore-UninstallNotInstalledNoOp
                title: >-
                  The SpeechModelStore class shall not throw when asked to uninstall a model that
                  was never installed.
                justification: |
                  Uninstalling a model that is not there is a safe no-op.
                tests:
                  - SpeechModelStore_Uninstall_NotInstalled_DoesNotThrow

              - id: Speech-Models-SpeechModelStore-UninstallAsyncRejection
                title: >-
                  The SpeechModelStore class shall reject an invalid model id or an already
                  canceled token passed to UninstallAsync.
                justification: |
                  Invalid input and a canceled caller must be refused before any file is touched.
                tests:
                  - SpeechModelStore_UninstallAsync_InvalidIdAndCanceledToken_AreRejected

              - id: Speech-Models-SpeechModelStore-UninstallStagingHandling
                title: >-
                  The SpeechModelStore class shall, on uninstall, leave a live staging directory
                  alone and remove replaced directories.
                justification: |
                  An in-flight install of the same model must not be disturbed, while leftover
                  replaced content must not accumulate.
                tests:
                  - SpeechModelStore_Uninstall_LeavesLiveStagingAndRemovesReplacedDirectories

              - id: Speech-Models-SpeechModelStore-CleanUpLeftovers
                title: >-
                  The SpeechModelStore class shall best-effort delete any leftover
                  current.replaced-* or .tmp/* directories left behind by a prior interrupted
                  install or uninstall, without throwing when a directory cannot yet be removed.
                justification: |
                  An open file handle held by another process must not block or fail cleanup;
                  the leftover directory is simply left for a future call to retry.
                tests:
                  - SpeechModelStore_CleanUpLeftovers_LeftoverTmpDirectory_IsRemoved
                  - SpeechModelStore_CleanUpLeftoversAsync_LeftoverTmpDirectory_IsRemoved

              - id: Speech-Models-SpeechModelStore-EmptyTempCleanup
                title: >-
                  The SpeechModelStore class shall remove a model's empty .tmp staging root after a
                  successful install.
                justification: |
                  An install leaves an empty .tmp folder beside the content; removing it keeps the
                  model directory tidy.
                tests:
                  - SpeechModelStore_CompleteInstall_RemovesEmptyStagingRoot

              - id: Speech-Models-SpeechModelStore-StagingRootKeptWhileInUse
                title: >-
                  The SpeechModelStore class shall keep a model's .tmp staging root after an
                  install while another operation's staging directory is still present.
                justification: |
                  A concurrent operation's staging must never be disturbed.
                tests:
                  - SpeechModelStore_CompleteInstall_OtherOperationStaging_KeepsStagingRoot
