---
# Software Unit Requirements for SpeechModelDownloadProgress
#
# These requirements describe the observable behavior of download progress reporting, decomposing
# the parent ModelManagementSubsystem requirements. Type and property names are in the design document.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelDownloadProgress Requirements
            requirements:
              - id: Speech-Models-SpeechModelDownloadProgress-FractionComplete
                title: >-
                  A progress report shall expose the completed fraction of a file transfer as the
                  bytes transferred divided by the total, when the total is known and positive.
                justification: |
                  A host progress UI needs a single, unambiguous fraction.
                tests:
                  - SpeechModelDownloadProgress_FractionComplete_KnownTotal_ComputesFraction

              - id: Speech-Models-SpeechModelDownloadProgress-UnknownTotal
                title: >-
                  A progress report shall expose no completed fraction when the total size of the
                  transfer is unknown.
                justification: |
                  An unknown total (chunked transfer with no declared length) must not be
                  misreported as zero progress.
                tests:
                  - SpeechModelDownloadProgress_FractionComplete_UnknownTotal_ReturnsNull

              - id: Speech-Models-SpeechModelDownloadProgress-ZeroTotal
                title: >-
                  A progress report shall expose a completed fraction of one when the total size
                  of the transfer is exactly zero.
                justification: |
                  A genuinely empty file must report as complete rather than dividing by zero.
                tests:
                  - SpeechModelDownloadProgress_FractionComplete_ZeroTotalBytes_ReturnsOne

              - id: Speech-Models-SpeechModelDownloadProgress-FractionBounds
                title: >-
                  A progress report shall never expose a completed fraction below zero or above one.
                justification: |
                  A host progress bar must stay within its range even when a transfer reports more
                  bytes than the declared total or a nonsensical count.
                tests:
                  - SpeechModelDownloadProgress_FractionComplete_BytesOverTotal_ClampsToOne
                  - SpeechModelDownloadProgress_FractionComplete_NegativeBytes_ClampsToZero
