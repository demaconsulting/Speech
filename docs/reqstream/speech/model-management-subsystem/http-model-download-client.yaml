---
# Software Unit Requirements for HttpModelDownloadClient
#
# These requirements describe the observable behavior of the HttpModelDownloadClient unit (what it
# sends and delivers over HTTP), decomposing the parent ModelManagementSubsystem requirements.
# How authentication is applied (single shared HTTP client, scope check, redirect handling) is
# documented in the unit design, not here.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: HttpModelDownloadClient Requirements
            requirements:
              - id: Speech-Models-HttpModelDownloadClient-RealDownload
                title: >-
                  The HTTP model download client shall perform a genuine HTTP download of the
                  requested address, delivering the exact served bytes and reporting byte-level
                  progress as the transfer proceeds.
                justification: |
                  This is the library's one real network-facing download implementation; it must
                  be proven against a genuine HTTP server (not just mocked) to be trusted in
                  production.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_StubbedServer_DownloadsExactBytesWithProgress

              - id: Speech-Models-HttpModelDownloadClient-NonSuccessResponseHandling
                title: >-
                  The HTTP model download client shall fail with an HTTP request error for a
                  non-2xx HTTP response rather than silently writing a truncated or error-page
                  body to the destination.
                justification: |
                  A non-2xx response must surface honestly rather than truncating, so a caller
                  never mistakes a partial or error-page body for a genuine model file.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NonSuccessResponse_ThrowsHttpRequestException

              - id: Speech-Models-HttpModelDownloadClient-MirrorAuthApplication
                title: >-
                  When configured with a mirror that has a bearer token, the HTTP model download
                  client shall send that token as a bearer Authorization header on the first
                  request for every address within the mirror's base location, regardless of a
                  trailing slash on either the mirror's base location or the request address.
                justification: |
                  A credentialed internal mirror needs its authentication applied to every
                  in-scope request through the single HTTP client the download client was given
                  (caller-supplied or internally owned), so that client's own proxy, timeout,
                  certificate-validation and handler configuration are never disturbed.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_BearerTokenMirror_SendsBearerAuthorizationHeader
                  - HttpModelDownloadClient_DownloadAsync_MirrorBaseUriTrailingSlashMismatch_SendsAuthorizationHeader

              - id: Speech-Models-HttpModelDownloadClient-BasicAuthApplication
                title: >-
                  When configured with a mirror that has Basic credentials, the HTTP model
                  download client shall send those credentials as a Basic Authorization header
                  on the first request, with no challenge/response round trip, for every address
                  within the mirror's base location.
                justification: |
                  Preemptive Basic covers the HTTPS-mirror scenario this library targets; a true
                  NTLM challenge/response negotiation is explicitly not supported, since it would
                  require bypassing whatever HTTP client configuration a host already supplied.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_CredentialsMirror_SendsBasicAuthorizationHeader

              - id: Speech-Models-HttpModelDownloadClient-NoAuthorizationWithoutMirror
                title: >-
                  The HTTP model download client shall send no Authorization header when it is
                  configured with no mirror authentication.
                justification: |
                  Requests that need no mirror authentication must not leak or invent credentials.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NoMirrorAuth_SendsNoAuthorizationHeader

              - id: Speech-Models-HttpModelDownloadClient-NoAuthorizationOutsideMirror
                title: >-
                  The HTTP model download client shall send no Authorization header on a request
                  for an address outside the configured mirror's base location, including a
                  sibling path that merely shares a textual prefix with the mirror's path.
                justification: |
                  Mirror credentials must never be sent to a host or path other than the mirror,
                  because a caller can ask the client directly to fetch an unrelated address.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NonMirrorUriWithMirrorConfigured_SendsNoAuthorizationHeader

              - id: Speech-Models-HttpModelDownloadClient-RedirectAuthorizationStripping
                title: >-
                  The HTTP model download client shall not send the mirror's Authorization header
                  on a request that follows an HTTP redirect, even when the redirect target is
                  within the mirror's base location.
                justification: |
                  The framework's own redirect handling already strips the Authorization header on
                  every automatic redirect, so the mirror's secret can never reach a redirect
                  target; the client deliberately does not re-authenticate redirected requests
                  itself, since a manual redirect loop would add security-sensitive code to
                  re-solve a risk the framework already mitigates. The accepted trade-off is that
                  a legitimate in-scope redirect loses its authentication and will most likely
                  fail with 401/403; a mirror expected to redirect should be configured at its
                  final, non-redirecting address.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_MirrorRedirect_StripsAuthorizationHeaderOnRedirectedRequest
