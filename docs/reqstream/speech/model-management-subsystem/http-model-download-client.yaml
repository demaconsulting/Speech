---
# Software Unit Requirements for HttpModelDownloadClient
#
# These requirements describe the design-level behavior of the HttpModelDownloadClient unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: HttpModelDownloadClient Requirements
            requirements:
              - id: Speech-Models-HttpModelDownloadClient-RealDownload
                title: >-
                  The HttpModelDownloadClient class shall genuinely perform an HTTP download of
                  the requested URI using System.Net.Http.HttpClient, reporting byte-level
                  progress as the transfer proceeds.
                justification: |
                  This is the library's one real network-facing implementation of
                  IModelDownloadClient; it must be proven against a genuine HTTP server (not just
                  mocked) to trust it in production.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_LoopbackServer_DownloadsExactBytesWithProgress

              - id: Speech-Models-HttpModelDownloadClient-NonSuccessResponseHandling
                title: >-
                  The HttpModelDownloadClient class shall throw HttpRequestException for a
                  non-2xx HTTP response rather than silently writing a truncated or error-page
                  body to the destination.
                justification: |
                  A non-2xx response must surface honestly rather than truncating, so a caller
                  never mistakes a partial or error-page body for a genuine model file.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NonSuccessResponse_ThrowsHttpRequestException

              - id: Speech-Models-HttpModelDownloadClient-MirrorAuthApplication
                title: >-
                  The HttpModelDownloadClient class shall apply a supplied mirrorAuth's
                  BearerToken (if any) as an Authorization: Bearer request header, and shall apply
                  its Credentials (if any) via a lazily-created, always internally-owned second
                  HttpClient whose HttpClientHandler.Credentials negotiates Basic/NTLM
                  authentication, without ever disturbing the primary HttpClient's documented
                  caller-supplied-vs-internally-owned ownership contract. With no mirrorAuth
                  supplied, no Authorization header is sent at all.
                justification: |
                  A credentialed internal mirror needs its authentication applied only to
                  requests actually targeting it, using a mechanism (HttpClientHandler.Credentials)
                  that genuinely supports NTLM's multi-round-trip handshake - which a single,
                  manually-built Authorization header alone cannot - while never risking the
                  primary, possibly caller-supplied HttpClient's lifetime being disturbed by
                  mirror-specific authentication state.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NoMirrorAuth_SendsNoAuthorizationHeader
                  - HttpModelDownloadClient_DownloadAsync_BearerTokenMirror_SendsBearerAuthorizationHeader
                  - HttpModelDownloadClient_DownloadAsync_CredentialsMirror_NegotiatesBasicAuthentication
