---
# Software Unit Requirements for HttpModelDownloadClient
#
# These requirements describe the design-level behavior of the HttpModelDownloadClient unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: HttpModelDownloadClient Requirements
            requirements:
              - id: Speech-Models-HttpModelDownloadClient-RealDownload
                title: >-
                  The HttpModelDownloadClient class shall genuinely perform an HTTP download of
                  the requested URI using System.Net.Http.HttpClient, reporting byte-level
                  progress as the transfer proceeds.
                justification: |
                  This is the library's one real network-facing implementation of
                  IModelDownloadClient; it must be proven against a genuine HTTP server (not just
                  mocked) to trust it in production.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_StubbedServer_DownloadsExactBytesWithProgress

              - id: Speech-Models-HttpModelDownloadClient-NonSuccessResponseHandling
                title: >-
                  The HttpModelDownloadClient class shall throw HttpRequestException for a
                  non-2xx HTTP response rather than silently writing a truncated or error-page
                  body to the destination.
                justification: |
                  A non-2xx response must surface honestly rather than truncating, so a caller
                  never mistakes a partial or error-page body for a genuine model file.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NonSuccessResponse_ThrowsHttpRequestException

              - id: Speech-Models-HttpModelDownloadClient-MirrorAuthApplication
                title: >-
                  The HttpModelDownloadClient class shall accept a DownloadMirror once, at
                  construction, and apply its BearerToken (if any) as a preemptive
                  Authorization: Bearer request header, or its Credentials (if any) as a
                  preemptive Authorization: Basic request header, to every request whose URI
                  falls within the configured DownloadMirror's BaseUri, always sent through the
                  single HttpClient instance this client was constructed with - whether
                  caller-supplied or internally owned - never a second, separately configured
                  client. With no mirror supplied, or for a request URI outside that mirror's
                  BaseUri, no Authorization header is sent at all.
                justification: |
                  A credentialed internal mirror needs its authentication applied to every
                  request this instance issues, without ever disturbing the one HttpClient's
                  documented caller-supplied-vs-internally-owned ownership contract, its own
                  proxy, timeout, certificate-validation, or handler-pipeline configuration. A
                  true NTLM challenge/response handshake is explicitly not supported, since
                  negotiating one would require a dedicated HttpClientHandler that bypasses
                  whatever HttpClient a host has already configured; preemptive Basic (sent on
                  the first request, with no round trip) covers the HTTPS-mirror scenario this
                  library targets without that trade-off.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_NoMirrorAuth_SendsNoAuthorizationHeader
                  - HttpModelDownloadClient_DownloadAsync_BearerTokenMirror_SendsBearerAuthorizationHeader
                  - HttpModelDownloadClient_DownloadAsync_CredentialsMirror_SendsBasicAuthorizationHeader

              - id: Speech-Models-HttpModelDownloadClient-RedirectAuthorizationStripping
                title: >-
                  The HttpModelDownloadClient class shall rely on the underlying HttpClient's own
                  redirect handling to strip the Authorization header from a redirected request,
                  rather than re-checking or re-applying mirror authentication against a redirect
                  response itself.
                justification: |
                  HttpClient's default handler (SocketsHttpHandler on every supported .NET
                  runtime here) unconditionally strips the Authorization header from the
                  follow-up request on every automatic redirect it follows, regardless of whether
                  the redirect target is in-scope or out-of-scope, same-host or cross-origin. This
                  already prevents the mirror's secret from ever reaching a redirect target, so
                  this class deliberately does not implement its own manual, bounded redirect
                  loop with per-hop re-authentication - doing so would add non-trivial
                  security-sensitive code to re-solve a risk the framework's own handler already
                  mitigates. The accepted trade-off is functional: a legitimate in-scope mirror
                  redirect loses its authentication and will most likely fail with 401/403 rather
                  than complete; a mirror expected to redirect should instead be configured at its
                  final, non-redirecting URI.
                tests:
                  - HttpModelDownloadClient_DownloadAsync_MirrorRedirect_StripsAuthorizationHeaderOnRedirectedRequest
