---
# Software Unit Requirements for SpeechModelDownloaderOptions
#
# These requirements describe the observable behavior of the downloader options, decomposing the
# parent ModelManagementSubsystem requirements. Type and property names are in the design document.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelDownloaderOptions Requirements
            requirements:
              - id: Speech-Models-SpeechModelDownloaderOptions-MirrorDefaultsNull
                title: >-
                  A downloader configured without a mirror shall fetch every file from its own
                  declared location, exactly as it did before mirrors existed.
                justification: |
                  A host almost never needs to configure a mirror; defaulting to none guarantees
                  zero behavior change for every existing caller.
                tests:
                  - SpeechModelDownloader_DownloadAsync_NoMirrorConfigured_ForwardsOriginalUriUnchanged

              - id: Speech-Models-SpeechModelDownloaderOptions-MirrorRedirectsDownloads
                title: >-
                  A downloader configured with a mirror shall request every declared file from a
                  location beneath that mirror instead of the file's own declared location.
                justification: |
                  This is the seam that lets a host whose network policy blocks public model hosts
                  redirect every model download to an internal mirror it controls, without any
                  change to the models' declared download descriptors.
                tests:
                  - SpeechModelDownloader_DownloadAsync_MirrorConfigured_ForwardsEffectiveUri
