---
# Software Unit Requirements for SpeechModelCatalog
#
# These requirements describe the observable behavior of the SpeechModelCatalog unit,
# decomposing the parent ModelManagementSubsystem requirements. Registration signatures, the
# in-memory tracking structures, the composed store/downloader, and option forwarding are design
# decisions documented in docs/design/speech/model-management-subsystem/speech-model-catalog.md.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelCatalog Requirements
            requirements:
              - id: Speech-Models-SpeechModelCatalog-ModelRegistration
                title: >-
                  The SpeechModelCatalog class shall initially know no models, enumerating to an
                  empty list without throwing.
                justification: |
                  The core library ships no concrete, engine-backed models of its own; concrete
                  models are supplied by separate model packages (for example SpeechSherpa) or by
                  the host itself. A freshly constructed catalog must therefore be empty, and
                  enumeration must never throw regardless of how many models are known.
                tests:
                  - SpeechModelCatalog_Enumerate_EmptyKnownModels_ReturnsEmptyList

              - id: Speech-Models-SpeechModelCatalog-AddModels
                title: >-
                  The SpeechModelCatalog class shall let a host register one or more models so
                  that every registered model appears in subsequent enumeration.
                justification: |
                  The core library carries no model-engine dependency, so a host or a model
                  package's own registration helper (such as SpeechSherpa's) must be able to
                  populate the catalog with the models it supplies.
                tests:
                  - SpeechModelCatalog_AddModels_Called_AppearsInEnumerate

              - id: Speech-Models-SpeechModelCatalog-AddModelsChaining
                title: >-
                  The SpeechModelCatalog class shall let registration calls be chained, each
                  registration continuing to operate on the same catalog.
                justification: |
                  Chaining lets a host compose a catalog fluently from several model packages in
                  one expression.
                tests:
                  - SpeechModelCatalog_AddModels_ChainedCall_ReturnsSameInstance

              - id: Speech-Models-SpeechModelCatalog-StateResolution
                title: >-
                  The SpeechModelCatalog class shall report each known model as NotDownloaded,
                  Downloading, Downloaded, or FailedOrCorrupt according to whether it is
                  installed, a download of it is in progress, or its most recent download attempt
                  failed.
                justification: |
                  Installed/not-installed alone cannot distinguish an in-progress or failed
                  download; the fixed four-state model needs an honest in-progress and failed
                  signal, which only the catalog (as the initiator of downloads) can observe.
                tests:
                  - SpeechModelCatalog_Enumerate_NeverDownloaded_ReportsNotDownloaded
                  - SpeechModelCatalog_GetState_DownloadInFlight_ReportsDownloading

              - id: Speech-Models-SpeechModelCatalog-DownloadOrchestration
                title: >-
                  The SpeechModelCatalog class shall download a known model, identified by its id
                  alone, using that model's own declared files, and report it as Downloaded on
                  success.
                justification: |
                  A host driving a model-settings page requests a download by model id alone; the
                  catalog must translate that into the model's own declared download and honestly
                  reflect the real outcome.
                tests:
                  - SpeechModelCatalog_DownloadAsync_ValidModel_ReportsDownloadedAfterCompletion

              - id: Speech-Models-SpeechModelCatalog-DownloadFailureState
                title: >-
                  The SpeechModelCatalog class shall report FailedOrCorrupt for a model whose
                  download fails its checksum verification.
                justification: |
                  A failed download must be reported honestly, never as Downloaded.
                tests:
                  - SpeechModelCatalog_DownloadAsync_ChecksumMismatch_ReportsFailedOrCorrupt

              - id: Speech-Models-SpeechModelCatalog-UnknownModelDownloadThrows
                title: >-
                  The SpeechModelCatalog class shall reject a download request for a model id
                  that was never registered.
                justification: |
                  An unknown model id is a caller programming error that must surface immediately
                  as an explicit, user-invoked action (not composition or enumeration).
                tests:
                  - SpeechModelCatalog_DownloadAsync_UnknownModelId_ThrowsArgumentException

              - id: Speech-Models-SpeechModelCatalog-StoreExposure
                title: >-
                  The SpeechModelCatalog class shall let a host reach the same model storage the
                  catalog itself uses for installed-state queries and downloads, so a recognizer
                  or synthesizer composed from the catalog's models reads the same storage.
                justification: |
                  Recognizer and synthesizer factories need the model storage; a second,
                  independent storage could silently diverge from the catalog's own (for example,
                  a custom storage root passed to one but not the other). Reaching the catalog's
                  own storage removes that risk.
                tests:
                  - SpeechModelCatalog_Store_Always_ReturnsInternalStoreInstance

              - id: Speech-Models-SpeechModelCatalog-MirrorComposition
                title: >-
                  The SpeechModelCatalog class shall download its models through a host-configured
                  download mirror, when one is configured, so that catalog downloads are fetched
                  from the mirror location.
                justification: |
                  A host that configures a mirror still wants the catalog's install-step
                  orchestration rather than a hand-built download pipeline.
                tests:
                  - SpeechModelCatalog_DownloadAsync_MirrorConfigured_ForwardsEffectiveUriThroughCatalog
                  - SpeechModelCatalog_DownloadAsync_MirrorConfigured_ForwardsEffectiveUriThroughPublicConstructor
