---
# Software Unit Requirements for SpeechModelCatalog
#
# These requirements describe the design-level behavior of the SpeechModelCatalog unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelCatalog Requirements
            requirements:
              - id: Speech-Models-SpeechModelCatalog-ModelRegistration
                title: >-
                  The SpeechModelCatalog class shall start with an empty known-model list,
                  enumerating it to an empty descriptor list without throwing.
                justification: |
                  The core library ships no concrete, engine-backed models of its own; concrete
                  models are supplied by separate model packages (for example SpeechSherpa) or by
                  the host itself. A freshly constructed catalog must therefore be empty, and
                  enumeration must never throw regardless of how many models are known.
                tests:
                  - SpeechModelCatalog_Enumerate_EmptyKnownModels_ReturnsEmptyList

              - id: Speech-Models-SpeechModelCatalog-AddModels
                title: >-
                  The SpeechModelCatalog class shall expose a public AddModels(params
                  ISpeechModel[]) method that appends the supplied models to its known-model
                  list, so they appear in subsequent enumeration, and returns the same catalog
                  instance so registration calls can be chained.
                justification: |
                  Removing the compiled-in KnownModels registry, so that the core library carries
                  no sherpa-onnx dependency, requires a public registration seam through which a
                  host or a model package's own registration extension (such as SpeechSherpa's
                  AddSherpaModels) can populate the catalog. Returning the same instance lets a
                  host compose a catalog fluently from several model packages in one expression.
                tests:
                  - SpeechModelCatalog_AddModels_Called_AppearsInEnumerate
                  - SpeechModelCatalog_AddModels_ChainedCall_ReturnsSameInstance

              - id: Speech-Models-SpeechModelCatalog-StateResolution
                title: >-
                  The SpeechModelCatalog class shall resolve a known model's state to
                  NotDownloaded, Downloading, Downloaded, or FailedOrCorrupt by combining the
                  underlying store's installed-state query with in-memory tracking of in-flight
                  and most-recently-failed download attempts.
                justification: |
                  SpeechModelStore alone only distinguishes installed/not-installed;
                  the fixed four-state model additionally requires an honest
                  in-progress and failed signal, which only the catalog (as the caller of
                  DownloadAsync) can observe.
                tests:
                  - SpeechModelCatalog_Enumerate_NeverDownloaded_ReportsNotDownloaded
                  - SpeechModelCatalog_GetState_DownloadInFlight_ReportsDownloading

              - id: Speech-Models-SpeechModelCatalog-DownloadOrchestration
                title: >-
                  The SpeechModelCatalog class shall download a known model by its declared
                  download descriptor, correctly reflecting Downloaded on success and
                  FailedOrCorrupt on a checksum mismatch, and shall throw when asked to download
                  a model id absent from its known-model list.
                justification: |
                  A host driving a model-settings page calls DownloadAsync by model id alone;
                  the catalog must translate that into the model's own declared descriptor and
                  honestly reflect the real outcome, while an unknown model id is a caller
                  programming error that must surface immediately as an explicit, user-invoked
                  action (not composition or enumeration).
                tests:
                  - SpeechModelCatalog_DownloadAsync_ValidModel_ReportsDownloadedAfterCompletion
                  - SpeechModelCatalog_DownloadAsync_ChecksumMismatch_ReportsFailedOrCorrupt
                  - SpeechModelCatalog_DownloadAsync_UnknownModelId_ThrowsArgumentException

              - id: Speech-Models-SpeechModelCatalog-StoreExposure
                title: >-
                  The SpeechModelCatalog class shall expose the SpeechModelStore instance it
                  composes internally through a public Store property, so a host can resolve an
                  installed model's directory, or compose a recognizer or synthesizer, through
                  the same catalog instance used for enumeration and download.
                justification: |
                  Phase 3 added SpeechModelStore-accepting Create overloads on
                  SpeechRecognizerFactory/SpeechSynthesizerFactory, but a host still had to
                  construct a second, independent SpeechModelStore to use them, risking silent
                  divergence from the catalog's own store (for example, a custom
                  SpeechModelStoreOptions root passed to one but not the other). Exposing the
                  catalog's own store as Store closes that gap and is the composition seam the
                  new SpeechModelCatalog-accepting Create overloads use internally.
                tests:
                  - SpeechModelCatalog_Store_Always_ReturnsInternalStoreInstance
