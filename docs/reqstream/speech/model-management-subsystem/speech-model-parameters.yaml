---
# Software Unit Requirements for the model-parameter descriptors (ISpeechModelParameter,
# NumericParameter, ChoiceParameter, BooleanParameter)
#
# These requirements describe the design-level behavior of the typed tunable-parameter
# descriptor hierarchy, decomposing the parent ModelManagementSubsystem requirements. The
# common contract and its three concrete implementations are documented together since they form
# one cohesive, tightly-coupled descriptor set with no independent behavior beyond it.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelParameters Requirements
            requirements:
              - id: Speech-Models-SpeechModelParameters-NumericValidation
                title: >-
                  The NumericParameter class shall validate at construction that minimum does not
                  exceed maximum, that step is strictly positive, and that the default value
                  falls within [minimum, maximum], rejecting a non-finite bound outright; when
                  isInteger is true, it shall additionally validate that minimum, maximum, step,
                  and default are all whole numbers.
                justification: |
                  A range that could never be honored by a slider control, or a default a host
                  could never actually supply back to the model, must be caught the moment a
                  model's backing class declares it - not discovered later when a host tries to
                  render it. An inherently whole-number parameter (for example a discrete speaker
                  index) has no fractional meaning, so a fractional bound declared alongside
                  isInteger: true must be rejected for the same reason, since it could never be
                  honored by a whole-number-only control.
                tests:
                  - NumericParameter_Constructor_ValidRange_ExposesValues
                  - NumericParameter_Constructor_NoUnit_UnitIsNull
                  - NumericParameter_Constructor_MinimumGreaterThanMaximum_ThrowsArgumentException
                  - NumericParameter_Constructor_NonPositiveStep_ThrowsArgumentException
                  - NumericParameter_Constructor_DefaultOutsideRange_ThrowsArgumentException
                  - NumericParameter_Constructor_NonFiniteMinimum_ThrowsArgumentException
                  - NumericParameter_Constructor_NullId_ThrowsArgumentNullException
                  - NumericParameter_Constructor_IsIntegerWithWholeNumberBounds_ExposesIsIntegerTrue
                  - NumericParameter_Constructor_IsIntegerOmitted_DefaultsToFalse
                  - NumericParameter_Constructor_IsIntegerWithFractionalMinimum_ThrowsArgumentException
                  - NumericParameter_Constructor_IsIntegerWithFractionalMaximum_ThrowsArgumentException
                  - NumericParameter_Constructor_IsIntegerWithFractionalStep_ThrowsArgumentException
                  - NumericParameter_Constructor_IsIntegerWithFractionalDefault_ThrowsArgumentException

              - id: Speech-Models-SpeechModelParameters-ChoiceValidation
                title: >-
                  The ChoiceParameter class shall validate at construction that at least one
                  option is declared, that no two options share the same value, and that the
                  default value matches one declared option's value exactly.
                justification: |
                  An empty option list could never be rendered as a dropdown, duplicate option
                  values would make a supplied bag entry ambiguous, and a default matching no
                  option would leave a host unable to select the model's own declared default.
                tests:
                  - ChoiceParameter_Constructor_ValidOptions_ExposesValues
                  - ChoiceParameter_Constructor_EmptyOptions_ThrowsArgumentException
                  - ChoiceParameter_Constructor_DuplicateOptionValues_ThrowsArgumentException
                  - ChoiceParameter_Constructor_DefaultNotAnOption_ThrowsArgumentException
                  - ChoiceParameterOption_Constructor_EmptyValue_ThrowsArgumentException

              - id: Speech-Models-SpeechModelParameters-BooleanValidation
                title: >-
                  The BooleanParameter class shall validate the common ISpeechModelParameter
                  fields at construction, exposing a default value with no further constraint.
                justification: |
                  A boolean value has no invalid range to reject; only the common id/display
                  name/description fields need validation, consistent with the other descriptor
                  types.
                tests:
                  - BooleanParameter_Constructor_ValidValues_ExposesValues
                  - BooleanParameter_Constructor_WhitespaceId_ThrowsArgumentException
                  - BooleanParameter_Constructor_NullDisplayName_ThrowsArgumentNullException

              - id: Speech-Models-SpeechModelParameterDiagnostics-UnrecognizedIdSilentWithDiagnostic
                title: >-
                  SpeechModelParameterDiagnostics.ValidateAndReport shall never throw for a
                  supplied parameterValues key that names no parameter declared by the model's
                  own descriptor set, and shall report an Info-level diagnostic naming the
                  ignored key ("Parameter '{id}' is not declared by this model and was ignored.").
                justification: |
                  A host reusing one settings dictionary across different models must not have
                  composition break just because a given model does not declare a parameter
                  another model had; this is a deliberate, documented cross-model-compatibility
                  contract, so an unrecognized id must remain a silent no-op (beyond the
                  informational diagnostic), never a thrown exception.
                tests:
                  - ValidateAndReport_UnrecognizedParameterId_ReportsInfoAndDoesNotThrow

              - id: Speech-Models-SpeechModelParameterDiagnostics-InvalidRecognizedValueThrows
                title: >-
                  SpeechModelParameterDiagnostics.ValidateAndReport shall throw ArgumentException
                  for the first invalid value found (iterating declared parameters in their
                  declared order, for determinism) supplied for a parameter the model does
                  declare - a wrong CLR type, a value outside [Minimum, Maximum] or a fractional
                  value for a NumericParameter declared IsInteger, a string not matching a
                  declared ChoiceParameterOption.Value for a ChoiceParameter, or a non-bool for a
                  BooleanParameter - naming the parameter id, the model id, and the reason the
                  value is invalid, without rounding or otherwise silently substituting a valid
                  value.
                justification: |
                  A host explicitly targeting a parameter it knows this model declares, with a
                  value invalid for it, is a caller bug rather than a legitimate cross-model
                  compatibility gap; this must be surfaced immediately and loudly so the host
                  fixes the value at its source, rather than the model silently substituting a
                  default (or, for a fractional value against an IsInteger parameter, silently
                  rounding it) and the host discovering the mismatch only from confusing later
                  behavior.
                tests:
                  - ValidateAndReport_NumericParameterOutOfRange_Throws
                  - ValidateAndReport_NumericParameterWrongType_Throws
                  - ValidateAndReport_IntegerParameterFractionalValue_Throws
                  - ValidateAndReport_ChoiceParameterInvalidOption_Throws
                  - ValidateAndReport_ChoiceParameterWrongType_Throws
                  - ValidateAndReport_BooleanParameterWrongType_Throws
                  - ValidateAndReport_InvalidRecognizedValueAndUnrecognizedId_ThrowsForRecognizedValue
