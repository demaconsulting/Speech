---
# Software Unit Requirements for ReferenceVoicePackInstaller
#
# Unit-level behavior of the internal ReferenceVoicePackInstaller (the downloader install hook
# that extracts a verified pack archive), decomposing the parent ModelManagementSubsystem
# requirements. Covered by
# test/DemaConsulting.Speech.Tests/ModelManagementSubsystem/ReferenceVoicePackInstallerTests.cs.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: ReferenceVoicePackInstaller Requirements
            requirements:
              - id: Speech-Models-ReferenceVoicePackInstaller-SelectiveExtraction
                title: >-
                  The ReferenceVoicePackInstaller shall extract only the voice clips and the
                  license and readme files from a verified pack archive with the archive root
                  folder removed, write a pack.json describing the pack, and delete the archive.
                justification: |
                  The upstream archive holds far more content (about 2000 emotion clips) than the
                  voice list needs; extracting only the allow-listed entries keeps the installed
                  size small while retaining the license text the CC0 attribution refers to.
                tests:
                  - ReferenceVoicePackInstaller_Install_TypicalArchive_ExtractsOnlyAllowListedEntries
                  - ReferenceVoicePackInstaller_Install_TypicalArchive_WritesPackMetadata
                  - ReferenceVoicePackInstaller_Install_TypicalArchive_DeletesArchive
                  - ReferenceVoicePackInstaller_Install_EntriesOutsideRoot_AreIgnored

              - id: Speech-Models-ReferenceVoicePackInstaller-ArchiveSafety
                title: >-
                  The ReferenceVoicePackInstaller shall reject archives containing path-traversal,
                  rooted, drive-qualified or backslash entry names, archives with no voice clips,
                  and files that are not zip archives, and shall honor cancellation.
                justification: |
                  Even a checksum-verified archive is untrusted input to the extractor (the
                  checksum guards integrity, not safety), so a zip-slip entry must never write
                  outside the staging directory and a malformed pack must fail the install rather
                  than produce an empty voice library.
                tests:
                  - ReferenceVoicePackInstaller_Install_UnsafeEntryName_ThrowsAndWritesNothingOutside
                  - ReferenceVoicePackInstaller_Install_NoVoices_Throws
                  - ReferenceVoicePackInstaller_Install_NotAZip_Throws
                  - ReferenceVoicePackInstaller_Install_CanceledToken_Throws
