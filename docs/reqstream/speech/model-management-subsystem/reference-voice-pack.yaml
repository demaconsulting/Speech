---
# Software Unit Requirements for ReferenceVoicePack
#
# Unit-level behavior of the ReferenceVoicePack descriptor (with the ReferenceVoiceInfo and
# ReferenceVoiceSource value types that travel with it), decomposing the parent
# ModelManagementSubsystem requirements. Covered by
# test/DemaConsulting.Speech.Tests/ModelManagementSubsystem/ReferenceVoicePackTests.cs.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: ReferenceVoicePack Requirements
            requirements:
              - id: Speech-Models-ReferenceVoicePack-PublishedMetadata
                title: >-
                  The ReferenceVoicePack class shall expose a built-in voice-zero 1.0 descriptor
                  carrying the published archive URL, size, SHA-256 checksum, CC0 license and
                  attribution, and shall list it in its set of known packs.
                justification: |
                  The pack is downloaded whole and verified against a fixed checksum, so the
                  published values must be exact and discoverable by a host without hard-coding.
                tests:
                  - ReferenceVoicePack_VoiceZero10_HasPublishedMetadata
                  - ReferenceVoicePack_Constructor_ValidArguments_ExposesValues

              - id: Speech-Models-ReferenceVoicePack-ArgumentValidation
                title: >-
                  The ReferenceVoicePack constructor shall reject a non-HTTPS archive URL, a
                  malformed SHA-256 checksum, a non-positive size, and an id, archive file name or
                  archive root folder that is not a single safe path segment.
                justification: |
                  The id and archive names become directory and file names, and the archive is
                  fetched over the network, so a descriptor must be unable to describe an insecure
                  transfer or a path that escapes the store.
                tests:
                  - ReferenceVoicePack_Constructor_NonHttpsUri_Throws
                  - ReferenceVoicePack_Constructor_BadChecksum_Throws
                  - ReferenceVoicePack_Constructor_UnsafeId_Throws
                  - ReferenceVoicePack_Constructor_UnsafeRootFolder_Throws
                  - ReferenceVoicePack_Constructor_NonPositiveSize_Throws
