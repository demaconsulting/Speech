---
# Software Unit Requirements for ReferenceVoicePack
#
# Unit-level behavior of the ReferenceVoicePack descriptor (with the ReferenceVoiceInfo and
# ReferenceVoiceSource value types that travel with it), decomposing the parent
# ModelManagementSubsystem requirements. Covered by
# test/DemaConsulting.Speech.Tests/ModelManagementSubsystem/ReferenceVoicePackTests.cs.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: ReferenceVoicePack Requirements
            requirements:
              - id: Speech-Models-ReferenceVoicePack-PublishedMetadata
                title: >-
                  The ReferenceVoicePack class shall expose a built-in voice-zero 1.0 descriptor
                  carrying the published archive URL, size, SHA-256 checksum, CC0 license and
                  attribution.
                justification: |
                  The pack is downloaded whole and verified against a fixed checksum, so the
                  published values must be exact.
                tests:
                  - ReferenceVoicePack_VoiceZero10_HasPublishedMetadata
                  - ReferenceVoicePack_Constructor_ValidArguments_ExposesValues

              - id: Speech-Models-ReferenceVoicePack-KnownPacksListing
                title: >-
                  The ReferenceVoicePack class shall list the built-in voice-zero 1.0 descriptor in
                  its set of known packs.
                justification: |
                  A host discovers available packs without hard-coding them.
                tests:
                  - ReferenceVoicePack_VoiceZero10_HasPublishedMetadata

              - id: Speech-Models-ReferenceVoicePack-HttpsUriRequired
                title: >-
                  The ReferenceVoicePack constructor shall reject an archive URL that is not HTTPS.
                justification: |
                  The archive is fetched over the network, so a descriptor must be unable to
                  describe an insecure transfer.
                tests:
                  - ReferenceVoicePack_Constructor_NonHttpsUri_Throws

              - id: Speech-Models-ReferenceVoicePack-ChecksumShapeValidation
                title: >-
                  The ReferenceVoicePack constructor shall reject a SHA-256 checksum that is not 64
                  hexadecimal characters.
                justification: |
                  The archive is verified against the checksum, so a malformed value could never
                  verify any download.
                tests:
                  - ReferenceVoicePack_Constructor_BadChecksum_Throws
                  - ReferenceVoicePack_Constructor_NullOrBlankArguments_Throw

              - id: Speech-Models-ReferenceVoicePack-PositiveSizeRequired
                title: >-
                  The ReferenceVoicePack constructor shall reject an archive size that is zero or
                  negative.
                justification: |
                  The size drives progress and warnings, so a non-positive value is never
                  meaningful.
                tests:
                  - ReferenceVoicePack_Constructor_NonPositiveSize_Throws

              - id: Speech-Models-ReferenceVoicePack-NullOrBlankArguments
                title: >-
                  The ReferenceVoicePack constructor shall reject a null reference argument and a
                  blank text argument.
                justification: |
                  Every descriptor field is required to download, show and attribute the voices, so
                  a missing value must fail at construction rather than later.
                tests:
                  - ReferenceVoicePack_Constructor_NullOrBlankArguments_Throw

              - id: Speech-Models-ReferenceVoicePack-UnsafePathSegmentRejection
                title: >-
                  The ReferenceVoicePack constructor shall reject an id, archive file name or
                  archive root folder that is not a single safe path segment.
                justification: |
                  The id and archive names become directory and file names, so a descriptor must
                  be unable to describe a path that escapes the store. Unsafe segments include
                  separators, a drive colon, a rooted path, "." or "..", leading or trailing
                  whitespace, a trailing dot and a Windows reserved device name, on every platform.
                tests:
                  - ReferenceVoicePack_Constructor_UnsafeId_Throws
                  - ReferenceVoicePack_Constructor_RootedRootFolder_Throws
                  - ReferenceVoicePack_Constructor_UnsafeArchiveFileName_Throws
                  - ReferenceVoicePack_Constructor_UnsafeRootFolder_Throws

              - id: Speech-Models-ReferenceVoicePack-SizeMetadata
                title: >-
                  The ReferenceVoicePack class shall expose the measured installed size of its base
                  voices and of its emotion variants, and the combined installed size for a chosen
                  variant selection.
                justification: |
                  Hosts show the download and installed sizes before the user commits to a large
                  download, so the sizes must be the real measured values of the built-in pack
                  (pinned in `ReferenceVoicePack.VoiceZero10` and checked by the linked test).
                tests:
                  - ReferenceVoicePack_VoiceZero10_InstalledSizes_AreMeasuredValues

              - id: Speech-Models-ReferenceVoicePack-InstalledSizeSelection
                title: >-
                  The ReferenceVoicePack class shall report as installed size the base voices size,
                  plus the emotion size only when emotions are included.
                justification: |
                  A host shows the disk size of whichever install variant the user chooses.
                tests:
                  - ReferenceVoicePack_VoiceZero10_InstalledSizes_AreMeasuredValues

              - id: Speech-Models-ReferenceVoicePack-InstalledSizeValidation
                title: >-
                  The ReferenceVoicePack class shall report a zero installed size when none is
                  given and reject negative installed sizes.
                justification: |
                  An unknown size must read as zero rather than a bogus value, and a negative size
                  is never meaningful.
                tests:
                  - ReferenceVoicePack_Constructor_InstalledSizes_DefaultZeroAndRejectNegative

              - id: Speech-Models-ReferenceVoicePack-MoodClipLookup
                title: >-
                  The ReferenceVoiceInfo record shall find a mood clip regardless of the case and
                  surrounding whitespace of the requested mood name.
                justification: |
                  Mood names reach consumers from tags and options in varying case and spacing, and
                  must resolve to the same clip.
                tests:
                  - ReferenceVoiceInfo_TryGetMoodClip_IsCaseInsensitiveAndTrimmed

              - id: Speech-Models-ReferenceVoicePack-MoodClipNoMatch
                title: >-
                  The ReferenceVoiceInfo record shall report no match for a null, blank or unknown
                  mood name.
                justification: |
                  A lookup that finds nothing must say so rather than return an unrelated clip,
                  including for a voice that has no mood clips.
                tests:
                  - ReferenceVoiceInfo_TryGetMoodClip_IsCaseInsensitiveAndTrimmed

              - id: Speech-Models-ReferenceVoicePack-KnownMoods
                title: >-
                  The ReferenceVoiceInfo record shall list the thirteen mood names that a pack's
                  emotion clips use.
                justification: |
                  Hosts offer the moods without hard-coding them.
                tests:
                  - ReferenceVoiceInfo_KnownMoods_ListsThirteenDistinctLowerCaseMoods

              - id: Speech-Models-ReferenceVoicePack-MoodClipsImmutable
                title: >-
                  The ReferenceVoiceInfo record shall expose its mood clips as a read-only copy,
                  in ordinal order of mood name, that later changes to the supplied dictionary do
                  not alter.
                justification: |
                  Voice descriptions are shared between consumers, so one consumer must not be
                  able to change another's clips.
                tests:
                  - ReferenceVoiceInfo_MoodClips_AreAnImmutableOrderedCopy

              - id: Speech-Models-ReferenceVoicePack-ReferenceIdentity
                title: >-
                  The ReferenceVoicePack class shall compare by reference, so two descriptors
                  built from equal values are distinct.
                justification: |
                  A pack is a singleton description; value equality would let a look-alike
                  descriptor stand in for a built-in one.
                tests:
                  - ReferenceVoicePack_Equals_SameValuesDifferentInstances_AreNotEqual

              - id: Speech-Models-ReferenceVoicePack-VoiceSources
                title: >-
                  The ReferenceVoiceSource enumeration shall distinguish voices from a named
                  directory, the user folder and an installed pack.
                justification: |
                  Hosts show and filter voices by where they came from.
                tests:
                  - ReferenceVoiceSource_Values_AreDirectoryUserAndPack

              - id: Speech-Models-ReferenceVoicePack-DownloadDescriptor
                title: >-
                  The ReferenceVoicePack class shall describe its archive to the model downloader
                  as exactly one file carrying the archive address, checksum and file name.
                justification: |
                  The pack is installed through the same verified download path as models.
                tests:
                  - ReferenceVoicePack_DownloadDescriptor_DescribesTheArchive
