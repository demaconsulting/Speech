---
# Software Unit Requirements for SpeechModelDownloader
#
# These requirements describe the design-level behavior of the SpeechModelDownloader unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelDownloader Requirements
            requirements:
              - id: Speech-Models-SpeechModelDownloader-PerModelSerialization
                title: >-
                  The SpeechModelDownloader class shall serialize two concurrent DownloadAsync
                  calls for the same model id, queueing the second behind the first rather than
                  running both in parallel.
                justification: |
                  SpeechModelStore's atomic-swap install for a given model id is not itself
                  re-entrant: two concurrent Directory.Move-based installs of the same model id
                  can race. A per-model-id lock is the minimal guard needed to prevent this
                  same-model race without constraining unrelated models.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForSameModelId_AreSerialized

              - id: Speech-Models-SpeechModelDownloader-QueuedCancellation
                title: >-
                  The SpeechModelDownloader class shall throw OperationCanceledException without
                  reaching the download client when a call is canceled while queued behind another
                  download of the same model id.
                justification: |
                  A caller that gives up while waiting must not trigger a transfer.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledWhileQueued_ThrowsWithoutReachingClient

              - id: Speech-Models-SpeechModelDownloader-DisposedThrows
                title: >-
                  The SpeechModelDownloader class shall throw ObjectDisposedException when
                  DownloadAsync is called after disposal.
                justification: |
                  A disposed downloader must fail visibly rather than use released resources.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AfterDispose_ThrowsObjectDisposed

              - id: Speech-Models-SpeechModelDownloader-DisposeWhileInFlight
                title: >-
                  The SpeechModelDownloader class shall let a download that is already running
                  complete without a lock-release error when the downloader is disposed meanwhile.
                justification: |
                  Disposal is not synchronized with in-flight downloads; releasing a disposed
                  per-model lock must not turn a successful install into an exception.
                tests:
                  - SpeechModelDownloader_DownloadAsync_DisposedWhileInFlight_StillCompletes

              - id: Speech-Models-SpeechModelDownloader-ConcurrentDownloadsAcrossModels
                title: >-
                  The SpeechModelDownloader class shall allow downloads of different model ids to
                  run fully concurrently, with no pool limit or global gate serializing them.
                justification: |
                  This library's "download integrity and progress" decision allows unlimited
                  cross-model concurrency since each model is staged and installed under its own
                  isolated subtree in SpeechModelStore, with no shared mutable state between
                  different model ids' downloads.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForDifferentModels_RunConcurrently

              - id: Speech-Models-SpeechModelDownloader-FetchVerifyInstall
                title: >-
                  The SpeechModelDownloader class shall fetch each declared file through its
                  IModelDownloadClient, verify its SHA-256 checksum, and hand a fully verified
                  result to SpeechModelStore for atomic installation.
                justification: |
                  This is the core download-integrity guarantee: every byte installed must have
                  first passed checksum verification.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress

              - id: Speech-Models-SpeechModelDownloader-NestedInstallPaths
                title: >-
                  The SpeechModelDownloader class shall stage a file whose relative install path
                  contains a foreign directory separator under the corresponding nested
                  subdirectory.
                justification: |
                  Descriptors may be authored on any platform; the staged layout must not depend
                  on which separator the author used.
                tests:
                  - SpeechModelDownloader_DownloadAsync_RelativeInstallPathWithForeignSeparator_StagesUnderNestedSubdirectory

              - id: Speech-Models-SpeechModelDownloader-ProgressReporting
                title: >-
                  The SpeechModelDownloader class shall report progress with correct
                  FileIndex/FileCount values as each declared file transfers.
                justification: |
                  Callers need accurate multi-file progress to build UI.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress
                  - SpeechModelDownloader_DownloadAsync_MultipleFiles_ReportsFileIndexAndFileCount

              - id: Speech-Models-SpeechModelDownloader-ChecksumMismatch
                title: >-
                  The SpeechModelDownloader class shall report SpeechModelDownloadOutcome.ChecksumMismatch
                  with Error populated with a descriptive exception, and install nothing, when a
                  downloaded file's SHA-256 checksum does not match its declared value.
                justification: |
                  A host must be able to trust that "installed" means "verified"; a checksum
                  mismatch must never silently install unverified or tampered content, and
                  SpeechModelDownloadResult.Error must be populated for every non-Installed
                  outcome (matching the Failed outcome) rather than left null only for this one
                  outcome, so a host never has to special-case which non-Installed outcomes carry
                  a diagnosable exception.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ChecksumMismatch_ReportsChecksumMismatchAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-CancellationDiscardsStaging
                title: >-
                  The SpeechModelDownloader class shall propagate a canceled download as
                  OperationCanceledException and discard its staging directory without installing
                  anything or affecting a prior successful install.
                justification: |
                  Cancellation is an ordinary caller-driven outcome, not a corruption; it must
                  clean up its own scratch space and leave any existing installed model untouched.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledNoOp
                title: >-
                  The SpeechModelDownloader class shall return
                  SpeechModelDownloadOutcome.Installed immediately, without any network fetch,
                  and report an Info-level diagnostic when the requested model id is already
                  installed.
                justification: |
                  A host calling DownloadAsync unconditionally on every launch (the documented
                  quickstart pattern) must not re-download and re-verify a model's full payload
                  every time merely to confirm it is already installed; the check must be made
                  inside the model id's own lock to stay race-safe against a concurrent
                  first-time install of the same model id.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalled_ReturnsInstalledWithoutFetchingOrStaging

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledLeftoverCleanup
                title: >-
                  The SpeechModelDownloader class shall remove any leftover staging or replaced
                  directory from a prior interrupted attempt when the requested model is already
                  installed.
                justification: |
                  A model that stays installed across every future launch must not leak disk space
                  from an earlier interrupted attempt; the cleanup is a cheap, best-effort
                  directory sweep with no network or hashing.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalledWithLeftoverStaging_CleansUpLeftover

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledPreservesPriorInstall
                title: >-
                  The SpeechModelDownloader class shall leave a model's prior successful install
                  completely untouched when a second DownloadAsync call is made for the same,
                  already-installed model id - the already-installed fast path takes over
                  regardless of what descriptor or model the second call supplies, so the prior
                  install can never be regressed by a second call.
                justification: |
                  A second call for an already-installed model id must be a safe no-op from the
                  model's perspective; it must never regress an already-working model to a
                  half-updated or removed state, even when the second call's descriptor would
                  itself have failed checksum verification had it genuinely been re-attempted.
                tests:
                  - SpeechModelDownloader_DownloadAsync_SecondCallAfterPriorSuccess_TakesFastPathAndLeavesPriorInstallIntact

              - id: Speech-Models-SpeechModelDownloader-InvokesModelInstallHook
                title: >-
                  The SpeechModelDownloader class shall expose a DownloadAsync(ISpeechModel, ...)
                  overload that invokes the model's own InstallAsync hook on its verified staged
                  files after checksum verification and before SpeechModelStore atomically
                  installs them.
                justification: |
                  This is the wiring that lets any real model whose declared download payload is
                  an archive (zip/tar) actually become installable: without it, ISpeechModel's
                  InstallAsync hook exists but is never called by the download/install
                  machinery. SpeechModelCatalog uses this overload exclusively so every
                  catalog-driven download genuinely runs the model's install hook.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_InvokesInstallAsyncBeforeCompleteInstall
                  - SpeechModelDownloader_DownloadAsync_WithZipArchiveModel_CurrentContainsExtractedFilesNotTheArchive
                  - SpeechModelCatalog_DownloadAsync_ZipArchiveModel_InstallsExtractedContentAndReportsDownloaded

              - id: Speech-Models-SpeechModelDownloader-InstallHookSkippedWhenAlreadyInstalled
                title: >-
                  The SpeechModelDownloader class shall not invoke a model's InstallAsync hook when
                  the model is already installed.
                justification: |
                  An already-installed model takes the no-op fast path, so its unpacking code must
                  not run again.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_SecondCallAfterPriorSuccess_TakesFastPathAndNeverInvokesInstallHook

              - id: Speech-Models-SpeechModelDownloader-InstallHookFailureIsHandledLikeDownloadFailure
                title: >-
                  The SpeechModelDownloader class shall classify an exception thrown from a model's
                  InstallAsync hook through the same failure classification as any other
                  download/install failure (so, for example, an install hook's own IOException
                  reports IoFailure just as a disk-full download failure would).
                justification: |
                  A model's own unpacking code can fail (corrupt archive, disk full, permission
                  denied) just as a transport failure can; such a failure must be just as honestly
                  classified as every other documented failure path, never collapsed into a less
                  specific outcome than an equivalent download-side failure would receive.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_InstallAsyncThrowsUnlistedExceptionType_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_InstallHookThrowsIOException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-MirrorUriResolution
                title: >-
                  The SpeechModelDownloader class shall resolve each declared file's effective
                  download request URI to the file's own declared Uri unchanged when no
                  DownloadMirror is configured (via SpeechModelDownloaderOptions.Mirror).
                justification: |
                  Without a mirror, every model must download from the public host its descriptor
                  names, with no behavior change.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_NoMirror_ReturnsOriginalUriUnchanged
                  - SpeechModelDownloader_DownloadAsync_NoMirrorConfigured_ForwardsOriginalUriUnchanged

              - id: Speech-Models-SpeechModelDownloader-MirrorUriComposition
                title: >-
                  The SpeechModelDownloader class shall, when a DownloadMirror is configured,
                  resolve each declared file's effective request URI to
                  {mirror.BaseUri}/{modelId}/{file.RelativeInstallPath} with exactly one
                  separating slash regardless of BaseUri's own trailing slash.
                justification: |
                  Some customers' IT departments block the public hosts every model's declared
                  download Uri points at; redirecting every model download to an internal mirror
                  without any per-model code change requires a single, uniform URI-rewriting seam
                  at this library's one download choke point, not a per-model opt-in.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_TrailingSlashVariations_ResolveIdentically
                  - SpeechModelDownloader_ResolveEffectiveUri_SubdirectoryRelativePath_PreservesAllSegments
                  - SpeechModelDownloader_DownloadAsync_MirrorConfigured_ForwardsEffectiveUri

              - id: Speech-Models-SpeechModelDownloader-MirrorUriEscaping
                title: >-
                  The SpeechModelDownloader class shall percent-escape the model id and every
                  RelativeInstallPath segment individually in a mirror request URI.
                justification: |
                  Ids and paths with unsafe characters must not alter the structure of the mirror
                  URI.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_ModelIdWithUnsafeCharacters_IsEscaped
                  - SpeechModelDownloader_ResolveEffectiveUri_PathSegmentWithUnsafeCharacters_IsEscapedPerSegment

              - id: Speech-Models-SpeechModelDownloader-CredentialedMirrorRequiresOwnClient
                title: >-
                  The SpeechModelDownloader class shall throw ArgumentException from its constructor
                  when a credentialed DownloadMirror is combined with a caller-supplied
                  IModelDownloadClient.
                justification: |
                  Mirror credentials are applied by the HttpModelDownloadClient the downloader creates
                  itself; silently pairing them with a caller's client would send requests without the
                  authentication the host configured, so the combination must fail fast.
                tests:
                  - SpeechModelDownloader_Constructor_CredentialedMirrorWithCallerSuppliedClient_ThrowsArgumentException

              - id: Speech-Models-SpeechModelDownloader-RicherFailureClassification
                title: >-
                  The SpeechModelDownloader class shall report SpeechModelDownloadOutcome.HttpError
                  for a download/install failure that is an HttpRequestException with a non-null
                  StatusCode.
                justification: |
                  A real HTTP error response calls for different remediation than a blocked
                  network path or a local disk failure, so a host must be able to tell it apart
                  without inspecting Error's exception type itself.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWithStatusCode_ReportsHttpError

              - id: Speech-Models-SpeechModelDownloader-NetworkBlockedClassification
                title: >-
                  The SpeechModelDownloader class shall report SpeechModelDownloadOutcome.NetworkBlocked
                  for an HttpRequestException wrapping an AuthenticationException or SocketException,
                  and for a TaskCanceledException not caused by the caller's own CancellationToken that
                  originates from the concrete HttpModelDownloadClient's own internal HTTP request timeout.
                justification: |
                  A blocked or intercepted network path is something a host might resolve by
                  configuring a DownloadMirror, so it must be distinguishable from other failures.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWrappingAuthenticationException_ReportsNetworkBlocked
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWrappingSocketException_ReportsNetworkBlocked
                  - SpeechModelDownloader_DownloadAsync_HttpModelDownloadClientInternalTimeout_ReportsNetworkBlocked

              - id: Speech-Models-SpeechModelDownloader-IoFailureClassification
                title: >-
                  The SpeechModelDownloader class shall report SpeechModelDownloadOutcome.IoFailure
                  for a download/install failure that is an IOException or UnauthorizedAccessException.
                justification: |
                  A local disk or permission failure calls for different remediation than a network
                  problem.
                tests:
                  - SpeechModelDownloader_DownloadAsync_IoException_ReportsIoFailure
                  - SpeechModelDownloader_DownloadAsync_UnauthorizedAccessException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-GenericFailureFallback
                title: >-
                  The SpeechModelDownloader class shall report SpeechModelDownloadOutcome.Failed
                  for any other exception type, including a TaskCanceledException from a
                  host-injected IModelDownloadClient or a non-timeout cancellation from the concrete
                  HttpModelDownloadClient.
                justification: |
                  The classification cannot distinguish an injected client's own cancellation
                  semantics from a genuine network timeout, so anything it cannot positively
                  identify must fall back to the generic outcome rather than be misreported.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TaskCanceledExceptionFromInjectedClient_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_HttpModelDownloadClientNonTimeoutCancellation_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_UnmatchedExceptionType_ReportsFailed

              - id: Speech-Models-SpeechModelDownloader-CallerCancellationPropagates
                title: >-
                  The SpeechModelDownloader class shall propagate a genuine caller cancellation
                  unchanged as OperationCanceledException rather than classify it as a failure.
                justification: |
                  A cancellation the caller requested must never be misreported as a failed
                  download.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-InstallHookOverload
                title: >-
                  The SpeechModelDownloader class shall offer an internal overload that runs a
                  caller-supplied install hook on the verified staging directory before the atomic
                  swap and installs whatever the hook leaves behind.
                justification: |
                  Model-agnostic payloads such as a reference-voice pack need the same verified,
                  mirror-aware, atomic download as models without implementing ISpeechModel; a
                  delegate hook shares the one orchestration path instead of duplicating it.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithInstallHookDelegate_RunsHookBeforeSwapAndInstallsItsOutput

              - id: Speech-Models-SpeechModelDownloader-InstallHookDelegateFailure
                title: >-
                  The SpeechModelDownloader class shall install nothing and report a classified
                  failure outcome when a caller-supplied install hook throws.
                justification: |
                  A failing hook must never leave partially unpacked content installed.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithThrowingInstallHookDelegate_ReportsFailureAndInstallsNothing
                  - SpeechModelDownloader_DownloadAsync_InstallHookThrowsIOException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-InstallHookDelegateCancellation
                title: >-
                  The SpeechModelDownloader class shall propagate OperationCanceledException and
                  install nothing when a caller-supplied install hook is canceled.
                justification: |
                  Cancellation during unpacking is a caller-driven outcome, not a failure.
                tests:
                  - SpeechModelDownloader_DownloadAsync_InstallHookCanceled_ThrowsAndInstallsNothing
