---
# Software Unit Requirements for SpeechModelDownloader
#
# These requirements describe the observable behavior of the SpeechModelDownloader unit (what a
# host sees when downloading and installing a model), decomposing the parent
# ModelManagementSubsystem requirements. Overloads, constructors, helper types and failure
# classification mechanics are documented in the unit design, not here.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelDownloader Requirements
            requirements:
              - id: Speech-Models-SpeechModelDownloader-ArgumentValidation
                title: >-
                  The model downloader shall reject a null download descriptor or null model with
                  a null-argument error before any download is attempted.
                justification: |
                  Invalid arguments are caller programming errors; failing fast avoids touching the
                  network or disk and avoids misreporting them as download failures.
                tests:
                  - SpeechModelDownloader_DownloadAsync_NullDescriptorOrModel_ThrowsArgumentNullException

              - id: Speech-Models-SpeechModelDownloader-InvalidModelIdValidation
                title: >-
                  The model downloader shall reject a null, empty, or invalid model id with an
                  argument error before any download is attempted.
                justification: |
                  An invalid model id is a caller programming error and must not reach the file
                  system or the network.
                tests:
                  - SpeechModelDownloader_DownloadAsync_InvalidModelId_ThrowsArgumentException

              - id: Speech-Models-SpeechModelDownloader-PerModelSerialization
                title: >-
                  The model downloader shall serialize two concurrent downloads of the same model
                  id, queueing the second behind the first rather than running both in parallel.
                justification: |
                  Installing a given model id is not re-entrant: two concurrent installs of the
                  same model id can race. Serializing per model id is the minimal guard against
                  this same-model race without constraining unrelated models.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForSameModelId_AreSerialized

              - id: Speech-Models-SpeechModelDownloader-QueuedCancellation
                title: >-
                  The model downloader shall fail with an operation-canceled error, without
                  starting any transfer, when a download is canceled while queued behind another
                  download of the same model id.
                justification: |
                  A caller that gives up while waiting must not trigger a transfer.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledWhileQueued_ThrowsWithoutReachingClient

              - id: Speech-Models-SpeechModelDownloader-DisposedThrows
                title: >-
                  The model downloader shall fail with an object-disposed error when a download is
                  requested after the downloader has been disposed.
                justification: |
                  A disposed downloader must fail visibly rather than use released resources.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AfterDispose_ThrowsObjectDisposed

              - id: Speech-Models-SpeechModelDownloader-DisposeWhileInFlight
                title: >-
                  Disposing a model downloader that uses a caller-supplied download client shall
                  not itself fail a download that is already running; that download shall still
                  complete successfully.
                justification: |
                  Disposal is not synchronized with in-flight downloads; releasing resources the
                  downloader no longer needs must not turn a successful install into an exception.
                  A download client the downloader created and owns is released by disposal and so
                  can fail an in-flight transfer; hosts cancel and await outstanding downloads
                  before disposing (see the unit design).
                tests:
                  - SpeechModelDownloader_DownloadAsync_DisposedWhileInFlight_StillCompletes

              - id: Speech-Models-SpeechModelDownloader-ConcurrentDownloadsAcrossModels
                title: >-
                  The model downloader shall allow downloads of different model ids to run fully
                  concurrently, with no pool limit or global gate serializing them.
                justification: |
                  This library's "download integrity and progress" decision allows unlimited
                  cross-model concurrency since each model is staged and installed under its own
                  isolated location, with no shared mutable state between different models'
                  downloads.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForDifferentModels_RunConcurrently

              - id: Speech-Models-SpeechModelDownloader-FetchVerifyInstall
                title: >-
                  The model downloader shall fetch each declared file of a model, verify each
                  against its declared checksum, and install the model only once every file has
                  verified, as a single all-or-nothing install.
                justification: |
                  This is the core download-integrity guarantee: every byte installed must have
                  first passed checksum verification.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress

              - id: Speech-Models-SpeechModelDownloader-NestedInstallPaths
                title: >-
                  The model downloader shall place a file whose relative install path uses a
                  directory separator of another platform under the corresponding nested
                  subdirectory.
                justification: |
                  Descriptors may be authored on any platform; the installed layout must not
                  depend on which separator the author used.
                tests:
                  - SpeechModelDownloader_DownloadAsync_RelativeInstallPathWithForeignSeparator_StagesUnderNestedSubdirectory

              - id: Speech-Models-SpeechModelDownloader-ProgressReporting
                title: >-
                  The model downloader shall report progress, identifying each file's position
                  and the total file count correctly, as each declared file transfers.
                justification: |
                  Callers need accurate multi-file progress to build UI.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress
                  - SpeechModelDownloader_DownloadAsync_MultipleFiles_ReportsFileIndexAndFileCount

              - id: Speech-Models-SpeechModelDownloader-ChecksumMismatch
                title: >-
                  The model downloader shall report a checksum-mismatch outcome with a descriptive
                  error when a downloaded file's checksum does not match its declared value.
                justification: |
                  A host must be able to trust that "installed" means "verified"; a checksum
                  mismatch must never silently install unverified or tampered content, and the
                  result must carry a diagnosable error for every non-installed outcome so a host
                  never has to special-case which outcomes carry one.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ChecksumMismatch_ReportsChecksumMismatchAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-ChecksumMismatchInstallsNothing
                title: >-
                  The model downloader shall install nothing when a downloaded file's checksum
                  does not match its declared value.
                justification: |
                  Unverified or tampered content must never become installed content.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ChecksumMismatch_ReportsChecksumMismatchAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-CancellationDiscardsStaging
                title: >-
                  The model downloader shall fail a canceled download with an operation-canceled
                  error, discard its partial download without installing anything, and leave a
                  prior successful install unaffected.
                justification: |
                  Cancellation is an ordinary caller-driven outcome, not a corruption; it must
                  clean up its own scratch space and leave any existing installed model untouched.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledNoOp
                title: >-
                  The model downloader shall report the installed outcome immediately, without any
                  network fetch or download scratch space, when the requested model id is already
                  installed.
                justification: |
                  A host calling the download unconditionally on every launch (the documented
                  quickstart pattern) must not re-download and re-verify a model's full payload
                  every time merely to confirm it is already installed; the check must be race-safe
                  against a concurrent first-time install of the same model id.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalled_ReturnsInstalledWithoutFetchingOrStaging

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledInfoDiagnostic
                title: >-
                  The model downloader shall report an informational diagnostic when the requested
                  model id is already installed.
                justification: |
                  A host diagnosing startup behavior can see that the download was skipped.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalled_ReturnsInstalledWithoutFetchingOrStaging

              - id: Speech-Models-SpeechModelDownloader-FailureErrorDiagnostic
                title: >-
                  The model downloader shall report an error diagnostic naming the model id
                  whenever a download fails for a reason other than caller cancellation.
                justification: |
                  A host diagnosing a failed download needs the structural facts (which model, and
                  the failure message) in its diagnostics sink as well as in the returned result;
                  raw model bytes are never included.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ChecksumMismatch_ReportsChecksumMismatchAndInstallsNothing
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWithStatusCode_ReportsHttpError
                  - SpeechModelDownloader_DownloadAsync_StagingCreationFails_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledLeftoverCleanup
                title: >-
                  The model downloader shall remove any leftover scratch or replaced content from
                  a prior interrupted attempt when the requested model is already installed.
                justification: |
                  A model that stays installed across every future launch must not leak disk space
                  from an earlier interrupted attempt; the cleanup is a cheap, best-effort sweep
                  with no network or hashing.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalledWithLeftoverStaging_CleansUpLeftover

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledPreservesPriorInstall
                title: >-
                  The model downloader shall leave a model's prior successful install unchanged
                  when a second download is requested for the same, already-installed model id.
                justification: |
                  A second request for an already-installed model id must be a safe no-op from the
                  model's perspective; it must never regress an already-working model to a
                  half-updated or removed state, even when the second request's descriptor would
                  itself have failed checksum verification had it genuinely been re-attempted.
                tests:
                  - SpeechModelDownloader_DownloadAsync_SecondCallAfterPriorSuccess_TakesFastPathAndLeavesPriorInstallIntact

              - id: Speech-Models-SpeechModelDownloader-InvokesModelInstallHook
                title: >-
                  When downloading a model object, the model downloader shall run the model's own
                  post-download install step on its verified downloaded files, after checksum
                  verification and before the files are installed.
                justification: |
                  This lets any real model whose declared payload is an archive actually become
                  installable: without running the model's own install step, such a payload would
                  be installed packed and unusable. The model catalog always downloads through this
                  form so every catalog-driven download runs the model's install step.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_InvokesInstallAsyncBeforeCompleteInstall
                  - SpeechModelDownloader_DownloadAsync_WithZipArchiveModel_CurrentContainsExtractedFilesNotTheArchive
                  - SpeechModelCatalog_DownloadAsync_ZipArchiveModel_InstallsExtractedContentAndReportsDownloaded

              - id: Speech-Models-SpeechModelDownloader-InstallHookSkippedWhenAlreadyInstalled
                title: >-
                  The model downloader shall not run a model's own post-download install step when
                  the model is already installed.
                justification: |
                  An already-installed model takes the no-op path, so its unpacking code must not
                  run again.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_SecondCallAfterPriorSuccess_TakesFastPathAndNeverInvokesInstallHook

              - id: Speech-Models-SpeechModelDownloader-InstallHookFailureIsHandledLikeDownloadFailure
                title: >-
                  The model downloader shall classify a failure raised by a model's own
                  post-download install step in the same way as any other download or install
                  failure (so, for example, an I/O failure there reports an I/O-failure outcome
                  just as a disk-full download failure would).
                justification: |
                  A model's own unpacking code can fail (corrupt archive, disk full, permission
                  denied) just as a transport failure can; such a failure must be just as honestly
                  classified as every other documented failure path, never collapsed into a less
                  specific outcome than an equivalent download-side failure would receive.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_InstallAsyncThrowsUnlistedExceptionType_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_InstallHookThrowsIOException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-MirrorUriResolution
                title: >-
                  The model downloader shall request each declared file from the file's own
                  declared address, unchanged, when no download mirror is configured.
                justification: |
                  Without a mirror, every model must download from the public host its descriptor
                  names, with no behavior change.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_NoMirror_ReturnsOriginalUriUnchanged
                  - SpeechModelDownloader_DownloadAsync_NoMirrorConfigured_ForwardsOriginalUriUnchanged

              - id: Speech-Models-SpeechModelDownloader-MirrorUriComposition
                title: >-
                  When a download mirror is configured, the model downloader shall request each
                  declared file from the mirror's base location followed by the model id and the
                  file's relative install path, separated by exactly one slash regardless of
                  whether the mirror's base location ends in a slash.
                justification: |
                  Some customers' IT departments block the public hosts every model's declared
                  download address points at; redirecting every model download to an internal
                  mirror without any per-model code change requires a single, uniform address
                  rewrite at this library's one download choke point, not a per-model opt-in.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_TrailingSlashVariations_ResolveIdentically
                  - SpeechModelDownloader_ResolveEffectiveUri_SubdirectoryRelativePath_PreservesAllSegments
                  - SpeechModelDownloader_DownloadAsync_MirrorConfigured_ForwardsEffectiveUri

              - id: Speech-Models-SpeechModelDownloader-MirrorUriEscaping
                title: >-
                  The model downloader shall percent-escape the model id and every segment of the
                  relative install path individually in a mirror request address.
                justification: |
                  Ids and paths with unsafe characters must not alter the structure of the mirror
                  address.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_ModelIdWithUnsafeCharacters_IsEscaped
                  - SpeechModelDownloader_ResolveEffectiveUri_PathSegmentWithUnsafeCharacters_IsEscapedPerSegment

              - id: Speech-Models-SpeechModelDownloader-CredentialedMirrorRequiresOwnClient
                title: >-
                  A model downloader shall reject, when it is created, a credentialed download
                  mirror combined with a caller-supplied download client, because a caller-supplied
                  client cannot carry the mirror's credentials.
                justification: |
                  Mirror credentials are applied only by the download client the downloader creates
                  itself; silently pairing them with a caller's client would send requests without
                  the authentication the host configured, so the combination must fail fast.
                tests:
                  - SpeechModelDownloader_Constructor_CredentialedMirrorWithCallerSuppliedClient_ThrowsArgumentException

              - id: Speech-Models-SpeechModelDownloader-CredentialedMirrorOwnClientAuthenticates
                title: >-
                  A model downloader that is given a credentialed download mirror and no
                  caller-supplied download client shall send the mirror's authentication with each
                  file request to the mirror, and shall install the verified model.
                justification: |
                  The supported way to use a credentialed mirror is to let the downloader use its
                  own client; this proves the credential actually reaches the mirror end to end
                  rather than being silently dropped.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CredentialedLoopbackMirrorWithOwnedClient_SendsAuthorizationAndInstalls

              - id: Speech-Models-SpeechModelDownloader-RicherFailureClassification
                title: >-
                  The model downloader shall report an HTTP-error outcome for a download or install
                  failure that is an HTTP request failure carrying an HTTP status code.
                justification: |
                  A real HTTP error response calls for different remediation than a blocked
                  network path or a local disk failure, so a host must be able to tell it apart
                  without inspecting the error's exception type itself.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWithStatusCode_ReportsHttpError

              - id: Speech-Models-SpeechModelDownloader-NetworkBlockedAuthentication
                title: >-
                  The model downloader shall report a network-blocked outcome for a download
                  failure that is an HTTP request failure caused by a TLS or certificate
                  authentication failure.
                justification: |
                  A TLS or certificate failure is the shape produced by an intercepting network
                  device, which a host might resolve by configuring a download mirror, so it must
                  be distinguishable from other failures.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWrappingAuthenticationException_ReportsNetworkBlocked

              - id: Speech-Models-SpeechModelDownloader-NetworkBlockedSocket
                title: >-
                  The model downloader shall report a network-blocked outcome for a download
                  failure that is an HTTP request failure caused by a socket error (DNS failure,
                  refused connection, or unreachable host).
                justification: |
                  A DNS failure, refused connection, or unreachable host is a blocked network path
                  a host might resolve by configuring a download mirror, so it must be
                  distinguishable from other failures.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWrappingSocketException_ReportsNetworkBlocked

              - id: Speech-Models-SpeechModelDownloader-NetworkBlockedTimeout
                title: >-
                  The model downloader shall report a network-blocked outcome for a request
                  timeout that is not caused by the caller's own cancellation and originates from
                  the downloader's own default HTTP download client.
                justification: |
                  A request that times out against an unresponsive network path is something a host
                  might resolve by configuring a download mirror, so it must be distinguishable
                  from other failures.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpModelDownloadClientInternalTimeout_ReportsNetworkBlocked

              - id: Speech-Models-SpeechModelDownloader-IoFailureClassification
                title: >-
                  The model downloader shall report an I/O-failure outcome for a download or
                  install failure that is an I/O error.
                justification: |
                  A local disk or permission failure calls for different remediation than a network
                  problem.
                tests:
                  - SpeechModelDownloader_DownloadAsync_IoException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-UnauthorizedAccessClassification
                title: >-
                  The model downloader shall report an I/O-failure outcome for a download or
                  install failure that is an unauthorized-access error.
                justification: |
                  A permission failure on the local disk calls for different remediation than a
                  network problem.
                tests:
                  - SpeechModelDownloader_DownloadAsync_UnauthorizedAccessException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-StagingCreationFailure
                title: >-
                  The model downloader shall report an I/O-failure outcome, without starting any
                  transfer, when the scratch space for the download cannot be created.
                justification: |
                  Download failures are reported as results rather than thrown, including local
                  file-system failures that occur before any network work starts.
                tests:
                  - SpeechModelDownloader_DownloadAsync_StagingCreationFails_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-GenericFailureFallback
                title: >-
                  The model downloader shall report a generic failed outcome for any other
                  failure, including a cancellation raised by a caller-supplied download client
                  or a non-timeout cancellation from the downloader's own default HTTP client.
                justification: |
                  The classification cannot distinguish an injected client's own cancellation
                  semantics from a genuine network timeout, so anything it cannot positively
                  identify must fall back to the generic outcome rather than be misreported.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TaskCanceledExceptionFromInjectedClient_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_HttpModelDownloadClientNonTimeoutCancellation_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_UnmatchedExceptionType_ReportsFailed

              - id: Speech-Models-SpeechModelDownloader-CallerCancellationPropagates
                title: >-
                  The model downloader shall propagate a genuine caller cancellation unchanged as
                  an operation-canceled error rather than classify it as a failure.
                justification: |
                  A cancellation the caller requested must never be misreported as a failed
                  download.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-InstallHookOverload
                title: >-
                  When given a caller-supplied post-download install step, the model downloader
                  shall run it on the verified downloaded files before the model is installed and
                  install whatever that step leaves behind.
                justification: |
                  Payloads that are not models, such as a reference-voice pack, need the same
                  verified, mirror-aware, all-or-nothing download as models without being a model
                  themselves; a supplied install step shares the one orchestration path instead of
                  duplicating it.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithInstallHookDelegate_RunsHookBeforeSwapAndInstallsItsOutput

              - id: Speech-Models-SpeechModelDownloader-InstallHookDelegateFailure
                title: >-
                  The model downloader shall install nothing and report a classified failure
                  outcome when a caller-supplied post-download install step fails.
                justification: |
                  A failing install step must never leave partially unpacked content installed.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithThrowingInstallHookDelegate_ReportsFailureAndInstallsNothing
                  - SpeechModelDownloader_DownloadAsync_InstallHookThrowsIOException_ReportsIoFailure

              - id: Speech-Models-SpeechModelDownloader-InstallHookDelegateCancellation
                title: >-
                  The model downloader shall propagate an operation-canceled error and install
                  nothing when a caller-supplied post-download install step is canceled.
                justification: |
                  Cancellation during unpacking is a caller-driven outcome, not a failure.
                tests:
                  - SpeechModelDownloader_DownloadAsync_InstallHookCanceled_ThrowsAndInstallsNothing
