---
# Software Unit Requirements for SpeechModelDownloader
#
# These requirements describe the design-level behavior of the SpeechModelDownloader unit,
# decomposing the parent ModelManagementSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelDownloader Requirements
            requirements:
              - id: Speech-Models-SpeechModelDownloader-PerModelSerialization
                title: >-
                  The SpeechModelDownloader class shall serialize two concurrent DownloadAsync
                  calls for the same model id, queueing the second behind the first rather than
                  running both in parallel.
                justification: |
                  SpeechModelStore's atomic-swap install for a given model id is not itself
                  re-entrant: two concurrent Directory.Move-based installs of the same model id
                  can race. A per-model-id lock is the minimal guard needed to prevent this
                  same-model race without constraining unrelated models.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForSameModelId_AreSerialized

              - id: Speech-Models-SpeechModelDownloader-ConcurrentDownloadsAcrossModels
                title: >-
                  The SpeechModelDownloader class shall allow downloads of different model ids to
                  run fully concurrently, with no pool limit or global gate serializing them.
                justification: |
                  This library's "download integrity and progress" decision allows unlimited
                  cross-model concurrency since each model is staged and installed under its own
                  isolated subtree in SpeechModelStore, with no shared mutable state between
                  different model ids' downloads.
                tests:
                  - SpeechModelDownloader_DownloadAsync_TwoConcurrentRequestsForDifferentModels_RunConcurrently

              - id: Speech-Models-SpeechModelDownloader-FetchVerifyInstall
                title: >-
                  The SpeechModelDownloader class shall fetch each declared file through its
                  IModelDownloadClient, verify its SHA-256 checksum, and hand a fully verified
                  result to SpeechModelStore for atomic installation, reporting progress with
                  correct FileIndex/FileCount values as each file transfers.
                justification: |
                  This is the core download-integrity guarantee: every byte installed must have
                  first passed checksum verification, and callers need accurate multi-file
                  progress to build UI.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress

              - id: Speech-Models-SpeechModelDownloader-ChecksumMismatch
                title: >-
                  The SpeechModelDownloader class shall report SpeechModelDownloadOutcome.ChecksumMismatch
                  with Error populated with a descriptive exception, and install nothing, when a
                  downloaded file's SHA-256 checksum does not match its declared value.
                justification: |
                  A host must be able to trust that "installed" means "verified"; a checksum
                  mismatch must never silently install unverified or tampered content, and
                  SpeechModelDownloadResult.Error must be populated for every non-Installed
                  outcome (matching the Failed outcome) rather than left null only for this one
                  outcome, so a host never has to special-case which non-Installed outcomes carry
                  a diagnosable exception.
                tests:
                  - SpeechModelDownloader_DownloadAsync_ChecksumMismatch_ReportsChecksumMismatchAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-CancellationDiscardsStaging
                title: >-
                  The SpeechModelDownloader class shall propagate a canceled download as
                  OperationCanceledException and discard its staging directory without installing
                  anything or affecting a prior successful install.
                justification: |
                  Cancellation is an ordinary caller-driven outcome, not a corruption; it must
                  clean up its own scratch space and leave any existing installed model untouched.
                tests:
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing

              - id: Speech-Models-SpeechModelDownloader-AlreadyInstalledNoOp
                title: >-
                  The SpeechModelDownloader class shall check, as the first step after acquiring a
                  model id's own lock, whether that model id is already installed, and if so
                  return SpeechModelDownloadOutcome.Installed immediately - without any network
                  fetch or staging-directory activity beyond an opportunistic, cheap leftover
                  cleanup sweep - and report an Info-level diagnostic, rather than unconditionally
                  re-transferring an already-installed model's payload.
                justification: |
                  A host calling DownloadAsync unconditionally on every launch (the documented
                  quickstart pattern) must not re-download and re-verify a model's full payload
                  every time merely to confirm it is already installed; this fast-path check must
                  sit inside the already-acquired per-model-id lock (not before it) to stay
                  race-safe against a concurrent first-time install of the same model id. It must
                  still opportunistically clean up any leftover staging/replaced directory from a
                  prior interrupted attempt (a cheap, best-effort directory enumeration/delete with
                  no network or hashing), so a model that stays installed across every future
                  launch does not leak disk space indefinitely.
                tests:
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalled_ReturnsInstalledWithoutFetchingOrStaging
                  - SpeechModelDownloader_DownloadAsync_AlreadyInstalledWithLeftoverStaging_CleansUpLeftover

              - id: Speech-Models-SpeechModelDownloader-PriorInstallUntouchedOnFailedRepair
                title: >-
                  The SpeechModelDownloader class shall leave a model's prior successful install
                  completely untouched when a second DownloadAsync call is made for the same,
                  already-installed model id - the already-installed fast path takes over
                  regardless of what descriptor or model the second call supplies, so the prior
                  install can never be regressed by a second call.
                justification: |
                  A second call for an already-installed model id must be a safe no-op from the
                  model's perspective; it must never regress an already-working model to a
                  half-updated or removed state, even when the second call's descriptor would
                  itself have failed checksum verification had it genuinely been re-attempted.
                tests:
                  - SpeechModelDownloader_DownloadAsync_SecondCallAfterPriorSuccess_TakesFastPathAndLeavesPriorInstallIntact

              - id: Speech-Models-SpeechModelDownloader-InvokesModelInstallHook
                title: >-
                  The SpeechModelDownloader class shall expose a DownloadAsync(ISpeechModel, ...)
                  overload that invokes the model's own InstallAsync hook on its verified staged
                  files after checksum verification and before SpeechModelStore atomically
                  installs them, recomputing the installed size from the post-install staging
                  directory's actual file tree. The existing DownloadAsync(modelId, descriptor,
                  ...) overload's behavior is unchanged and never invokes an install hook.
                justification: |
                  This is the wiring that lets any real model whose declared download payload is
                  an archive (zip/tar) actually become installable: without it, ISpeechModel's
                  InstallAsync hook exists but is never called by the download/install
                  machinery. SpeechModelCatalog uses this overload exclusively so every
                  catalog-driven download genuinely runs the model's install hook.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_InvokesInstallAsyncBeforeCompleteInstall
                  - SpeechModelDownloader_DownloadAsync_WithZipArchiveModel_CurrentContainsExtractedFilesNotTheArchive
                  - SpeechModelCatalog_DownloadAsync_ZipArchiveModel_InstallsExtractedContentAndReportsDownloaded

              - id: Speech-Models-SpeechModelDownloader-InstallHookFailureIsHandledLikeDownloadFailure
                title: >-
                  The SpeechModelDownloader class shall treat an exception thrown from a model's
                  InstallAsync hook identically to a download failure: classify it through the
                  same ClassifyFailure logic used for any other download/install failure (so, for
                  example, an install hook's own IOException reports IoFailure just as a disk-full
                  download failure would), attach the underlying exception, discard the staging
                  directory, and install nothing for that model id.
                justification: |
                  A model's own unpacking code can fail (corrupt archive, disk full, permission
                  denied) just as a transport failure can; this failure mode must be just as safe,
                  and just as honestly classified, as every other documented failure path - never
                  installing partially-unpacked content, and never collapsing a genuinely
                  diagnosable install-hook failure into a less specific outcome than an equivalent
                  download-side failure would receive.
                tests:
                  - SpeechModelDownloader_DownloadAsync_WithModel_InstallAsyncThrowsUnlistedExceptionType_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_WithModel_SecondCallAfterPriorSuccess_TakesFastPathAndNeverInvokesInstallHook

              - id: Speech-Models-SpeechModelDownloader-MirrorUriResolution
                title: >-
                  The SpeechModelDownloader class shall resolve each declared file's effective
                  download request URI via an internal, directly-unit-testable
                  ResolveEffectiveUri helper: the file's own declared Uri unchanged when no
                  DownloadMirror is configured (via SpeechModelDownloaderOptions.Mirror), or
                  {mirror.BaseUri}/{modelId}/{file.RelativeInstallPath} - with exactly one
                  separating slash regardless of BaseUri's own trailing slash, and with modelId
                  and every RelativeInstallPath segment individually percent-escaped - when one
                  is.
                justification: |
                  Some customers' IT departments block the public hosts every model's declared
                  download Uri points at; redirecting every model download to an internal mirror
                  without any per-model code change requires a single, uniform URI-rewriting seam
                  at this library's one download choke point, not a per-model opt-in.
                tests:
                  - SpeechModelDownloader_ResolveEffectiveUri_NoMirror_ReturnsOriginalUriUnchanged
                  - SpeechModelDownloader_ResolveEffectiveUri_TrailingSlashVariations_ResolveIdentically
                  - SpeechModelDownloader_ResolveEffectiveUri_SubdirectoryRelativePath_PreservesAllSegments
                  - SpeechModelDownloader_ResolveEffectiveUri_ModelIdWithUnsafeCharacters_IsEscaped
                  - SpeechModelDownloader_ResolveEffectiveUri_PathSegmentWithUnsafeCharacters_IsEscapedPerSegment
                  - SpeechModelDownloader_DownloadAsync_NoMirrorConfigured_ForwardsOriginalUriUnchanged
                  - SpeechModelDownloader_DownloadAsync_MirrorConfigured_ForwardsEffectiveUri

              - id: Speech-Models-SpeechModelDownloader-RicherFailureClassification
                title: >-
                  The SpeechModelDownloader class shall classify a download/install failure, via
                  a dedicated ClassifyFailure helper, into SpeechModelDownloadOutcome.HttpError
                  for an HttpRequestException with a non-null StatusCode,
                  SpeechModelDownloadOutcome.NetworkBlocked for an HttpRequestException wrapping
                  an AuthenticationException or SocketException, or for a TaskCanceledException
                  not caused by the caller's own CancellationToken and originating from the
                  concrete HttpModelDownloadClient's own internal HTTP request timeout (a
                  TaskCanceledException from a host-injected IModelDownloadClient instead reports
                  the generic Failed outcome, since this helper cannot distinguish an injected
                  client's own cancellation semantics from a genuine network timeout),
                  SpeechModelDownloadOutcome.IoFailure for an IOException or
                  UnauthorizedAccessException, and SpeechModelDownloadOutcome.Failed as the final
                  generic fallback for any other exception type - while a genuine caller
                  cancellation (the supplied CancellationToken itself signaled) always propagates
                  unchanged as OperationCanceledException and is never passed to ClassifyFailure.
                justification: |
                  Collapsing every failure into one generic Failed outcome leaves a host unable to
                  distinguish a blocked/intercepted network path (which it might resolve by
                  configuring a DownloadMirror) from a real HTTP error response, a local disk/
                  permission failure, or any other cause - each of which calls for a different
                  remediation. A dedicated, directly-unit-testable classification helper lets a
                  host react appropriately without inspecting Error's exception type itself, and
                  without ever risking a genuine cancellation being misreported as a failure.
                tests:
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWithStatusCode_ReportsHttpError
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWrappingAuthenticationException_ReportsNetworkBlocked
                  - SpeechModelDownloader_DownloadAsync_HttpRequestExceptionWrappingSocketException_ReportsNetworkBlocked
                  - SpeechModelDownloader_DownloadAsync_TaskCanceledExceptionFromInjectedClient_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_HttpModelDownloadClientInternalTimeout_ReportsNetworkBlocked
                  - SpeechModelDownloader_DownloadAsync_IoException_ReportsIoFailure
                  - SpeechModelDownloader_DownloadAsync_UnauthorizedAccessException_ReportsIoFailure
                  - SpeechModelDownloader_DownloadAsync_UnmatchedExceptionType_ReportsFailed
                  - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing
