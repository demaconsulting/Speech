---
# cspell:ignore Alsa
# Software Unit Requirements for PortAudioEnvironment
#
# These requirements describe the design-level behavior of the PortAudioEnvironment
# unit, decomposing the parent PortAudio subsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: PortAudio Requirements
            sections:
              - title: PortAudioEnvironment Requirements
                requirements:
                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-PlatformMapping
                    title: >-
                      The PortAudioEnvironment class shall map each supported desktop platform
                      to exactly one preferred PortAudio host API.
                    justification: |
                      The higher-level audio subsystem relies on deterministic host-API
                      selection to avoid duplicate device listings.
                    tests:
                      - windows@PortAudioEnvironment_ResolvePreferredHostApiType_Windows_ReturnsWasapi
                      - ubuntu@PortAudioEnvironment_ResolvePreferredHostApiType_Linux_ReturnsAlsa
                      - macos@PortAudioEnvironment_ResolvePreferredHostApiType_MacOs_ReturnsCoreAudio
                      - PortAudioEnvironment_ResolvePreferredHostApiType_UnsupportedPlatform_ReturnsNull

                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-CachesInitialization
                    title: >-
                      The PortAudioEnvironment class shall cache one PortAudio initialization
                      attempt and convert initialization failure into a non-throwing state.
                    justification: |
                      PortAudio initialization status influences composition-time fallback
                      decisions and must not cause repeated native initialization attempts.
                    tests:
                      - PortAudioEnvironment_TryResolvePreferredHostApi_InitializationFails_ReturnsFalseAndCachesFailure
                      - PortAudioEnvironment_Shared_ReadTwice_ReturnsSameInstance
                      - PortAudioApi_Instance_ReadTwice_ReturnsSameInstance

                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-ResolvesPreferredHostApi
                    title: >-
                      The PortAudioEnvironment class shall resolve the preferred host API's
                      runtime index and metadata when that host API is available.
                    justification: |
                      Higher-level device enumeration and default-device selection depend on the
                      host-API-scoped default device indices.
                    tests:
                      - PortAudioEnvironment_TryResolvePreferredHostApi_InitializedAndMapped_ReturnsHostApiInfo
                      - PortAudioEnvironment_TryResolvePreferredHostApi_PreferredHostApiMissing_ReturnsFalse

                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-Refresh
                    title: >-
                      The PortAudioEnvironment class shall let the device table be re-scanned on
                      demand: a refresh reinitializes the native runtime (terminating it first
                      only if it was previously initialized) and reflects the new initialization
                      outcome.
                    justification: |
                      Audio devices are hot-pluggable; the device table must be re-scannable on
                      demand, which requires reinitializing the native runtime and picking up a
                      changed initialization outcome.
                    tests:
                      - PortAudioEnvironment_Refresh_NoActiveStreams_ReinitializesAndReflectsNewOutcome
                      - PortAudioEnvironment_Refresh_NotPreviouslyInitialized_SkipsTerminateAndReinitializes
                      - PortAudioEnvironment_Refresh_OutcomeChanges_ReflectsNewInitializationResult
                      - PortAudioEnvironment_Refresh_TerminateThrows_PropagatesAndLeavesCachedStateUntouched

                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-RefreshRefusedWhileActive
                    title: >-
                      The PortAudioEnvironment class shall refuse a refresh with
                      AudioDeviceInUseException, without terminating the native runtime, while any
                      registered capture/playback device currently has an active stream.
                    justification: |
                      Refreshing under a live stream would silently tear down audio that is
                      playing or recording. The registration members that drive the refusal are
                      described in the PortAudio design document.
                    tests:
                      - PortAudioEnvironment_Refresh_ActiveStreamRegistered_ThrowsAudioDeviceInUseExceptionAndDoesNotTerminate
                      - PortAudioEnvironment_RegisterThenUnregisterActiveStream_Refresh_Succeeds

                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-RefreshAdvancesGeneration
                    title: >-
                      The PortAudioEnvironment class shall let a device detect that a refresh has
                      invalidated the device table it was resolved against: every refresh that
                      proceeds is observable as a change, and a refresh refused via
                      AudioDeviceInUseException is not.
                    justification: |
                      Capture and playback devices must detect that they were resolved before a
                      refresh invalidated the device table (see
                      Speech-Audio-DeviceRefreshInvalidation). The change-detection mechanism is
                      described in the PortAudio design document.
                    tests:
                      - PortAudioEnvironment_Refresh_NoActiveStreams_IncrementsGeneration
                      - PortAudioEnvironment_Refresh_ActiveStreamRegistered_DoesNotIncrementGeneration

                  - id: Speech-Audio-PortAudio-PortAudioEnvironment-SerializedInitializationEvaluation
                    title: >-
                      The PortAudioEnvironment class shall give concurrent callers that read its
                      initialization state while a refresh runs a consistent outcome, and shall
                      keep native initialization and termination balanced.
                    justification: |
                      An initialization-state read racing a concurrent refresh could previously
                      observe or produce an inconsistent initialization outcome, or cause the
                      native runtime to be initialized and terminated an unbalanced number of
                      times. The serialization mechanism is described in the PortAudio design
                      document.
                    tests:
                      - PortAudioEnvironment_IsInitialized_ConcurrentWithRefresh_SerializesAndPreservesInitializeTerminateBalance
