---
# Software Unit Requirements for PortAudioApi
#
# These requirements describe the design-level behavior of the PortAudioApi
# unit, decomposing the parent PortAudio subsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: PortAudio Requirements
            sections:
              - title: PortAudioApi Requirements
                requirements:
                  - id: Speech-Audio-PortAudio-PortAudioApi-BridgesManagedAndNativeCalls
                    title: >-
                      The native runtime adapter shall translate native host-API metadata,
                      sample rates, counts, format-probe results and audio blocks into their
                      managed equivalents, and shall stop a stream rather than let a handler
                      fault reach the native runtime.
                    justification: |
                      Native values and faults must not leak into managed logic. How the adapter
                      combines the managed bindings with raw native calls is described in the
                      PortAudio design document.
                    tests:
                      - PortAudioApi_ConvertHostApiInfo_NativeBlock_ReturnsManagedMetadata
                      - PortAudioApi_ConvertHostApiInfo_NullName_ReturnsEmptyName
                      - PortAudioApi_ConvertSampleRate_FractionalRate_RoundsToWholeHertz
                      - PortAudioApi_NormalizeCount_NegativeCount_ThrowsWithContext
                      - PortAudioApi_CaptureCallback_NativeInput_DeliversManagedSamples
                      - PortAudioApi_CaptureCallback_NullInputAfterData_DeliversSilence
                      - PortAudioApi_CaptureCallback_HandlerThrows_ReturnsAbort
                      - PortAudioApi_PlaybackCallback_ProvidedSamples_AreWrittenToNativeOutput
                      - PortAudioApi_PlaybackCallback_ProviderThrows_ReturnsAbort
                      - PortAudioApi_IsFormatSupported_NativeResult_MapsToSupport
                      - PortAudioApi_IsFormatSupported_NativeCallThrows_ReturnsFalse
                      - PortAudioApi_Instance_ReadTwice_ReturnsSameInstance
                      - PortAudioEnvironment_Shared_ReadTwice_ReturnsSameInstance
