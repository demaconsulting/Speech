---
# Software Unit Requirements for PortAudioApi
#
# These requirements describe the design-level behavior of the PortAudioApi
# unit, decomposing the parent PortAudio subsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: PortAudio Requirements
            sections:
              - title: PortAudioApi Requirements
                requirements:
                  - id: Speech-Audio-PortAudio-PortAudioApi-BridgesManagedAndNativeCalls
                    title: >-
                      The PortAudioApi class shall give the audio-device layer a single managed
                      entry point to the native PortAudio runtime, including the host-API queries
                      that the PortAudio managed bindings do not provide.
                    justification: |
                      The public audio-device layer must consume one coherent adapter, not a
                      mixture of separate managed-binding and raw native calls. How the adapter
                      combines the two call paths is described in the PortAudio design document.
                    tests:
                      - PortAudioApi_Instance_ReadTwice_ReturnsSameInstance
                      - PortAudioEnvironment_Shared_ReadTwice_ReturnsSameInstance
