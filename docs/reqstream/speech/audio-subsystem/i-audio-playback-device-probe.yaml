---
# Software Unit Requirements for IAudioPlaybackDeviceProbe
#
# These requirements describe the design-level behavior of the IAudioPlaybackDeviceProbe
# unit, decomposing the parent AudioSubsystem requirements.
#
# Deliberate decision: no requirement here covers the "Enumerate() alone never detects
# newly attached/removed hardware" staleness caveat. That behavior is specific to the
# PortAudio-backed implementation (see port-audio-playback-device-probe.yaml) and is not part of
# this interface's own contract - UnavailableAudioPlaybackDeviceProbe is unaffected, since it
# always enumerates zero devices regardless of hardware state. Adding a requirement here would
# misleadingly imply every implementation must exhibit this staleness.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: IAudioPlaybackDeviceProbe Requirements
            requirements:
              - id: Speech-Audio-IAudioPlaybackDeviceProbe-EnumerateNeverThrows
                title: >-
                  The IAudioPlaybackDeviceProbe interface shall define an Enumerate method that
                  never throws, returning an empty list when no playback devices are available.
                justification: |
                  A mockable enumeration contract lets hosts build device pickers, and tests
                  substitute enumerations, without any real hardware present.
                tests:
                  - UnavailableAudioPlaybackDeviceProbe_Enumerate_Always_ReturnsEmptyList
                  - PortAudioPlaybackDeviceProbe_Enumerate_PreferredHostApiMissing_ReturnsEmptyList
                  - PortAudioPlaybackDeviceProbe_Enumerate_NoDevices_ReturnsEmptyList
                  - PortAudioPlaybackDeviceProbe_Enumerate_MixedHostApis_ReturnsOnlyPreferredOutputDevices
