---
# Software Unit Requirements for FlacDecoder
#
# The internal unit (with FlacFrameDecoder, FlacBitReader, FlacCrc and FlacStreamInfo) decodes
# FLAC streams for AudioFileReader.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: FlacDecoder Requirements
            requirements:
              - id: Speech-Audio-FlacDecoder-Prediction
                title: >-
                  The FlacDecoder shall decode constant, verbatim, fixed-predictor and linear-predictor subframes.
                justification: |
                  A decoder must support every subframe type of the FLAC format to read arbitrary encoder output.
                tests:
                  - FlacDecoder_Decode_ConstantSubframe_RepeatsValue
                  - FlacDecoder_Decode_VerbatimMultiFrame_RoundTrips
                  - FlacDecoder_Decode_FixedPredictor_RoundTrips
                  - FlacDecoder_Decode_LpcPredictor_RoundTrips

              - id: Speech-Audio-FlacDecoder-ResidualCoding
                title: >-
                  The FlacDecoder shall decode both Rice residual coding methods, including escape
                  partitions.
                justification: |
                  Encoders choose either residual method and may escape partitions to raw samples.
                tests:
                  - FlacDecoder_Decode_ResidualCoding_RoundTrips

              - id: Speech-Audio-FlacDecoder-WastedBits
                title: >-
                  The FlacDecoder shall restore wasted low bits into the decoded samples.
                justification: |
                  Encoders signal always-zero low bits as wasted bits; ignoring them would scale the
                  audio wrongly.
                tests:
                  - FlacDecoder_Decode_WastedBits_AreRestored

              - id: Speech-Audio-FlacDecoder-StereoModes
                title: >-
                  The FlacDecoder shall handle all stereo decorrelation modes.
                justification: |
                  Real FLAC files vary in channel assignment.
                tests:
                  - FlacDecoder_Decode_StereoModes_RoundTrip

              - id: Speech-Audio-FlacDecoder-BitDepths
                title: >-
                  The FlacDecoder shall handle bit depths from 4 to 32.
                justification: |
                  Real FLAC files vary in sample width.
                tests:
                  - FlacDecoder_Decode_BitDepths_RoundTrip

              - id: Speech-Audio-FlacDecoder-LibFlacFixtures
                title: >-
                  The FlacDecoder shall decode FLAC files produced by libFLAC (via libsndfile)
                  bit-exactly, matching a lossless WAV made from the same samples.
                justification: |
                  Independent encoder output is the ground truth that the managed decoder is correct.
                tests:
                  - FlacDecoder_Decode_SoundfileFixture_MatchesWavBitExact

              - id: Speech-Audio-FlacDecoder-HeaderCodes
                title: >-
                  The FlacDecoder shall handle every sample-rate header code.
                justification: |
                  Real FLAC files vary in the sample-rate codes their encoders choose.
                tests:
                  - FlacDecoder_Decode_SampleRateCodes_ReportRate

              - id: Speech-Audio-FlacDecoder-BlockSizeCodes
                title: >-
                  The FlacDecoder shall handle every block-size header code.
                justification: |
                  Real FLAC files vary in the block-size codes their encoders choose.
                tests:
                  - FlacDecoder_Decode_BlockSizeCodes_RoundTrip

              - id: Speech-Audio-FlacDecoder-MultiByteFrameNumbers
                title: >-
                  The FlacDecoder shall handle multi-byte frame numbers.
                justification: |
                  Files with many frames encode frame numbers in more than one byte.
                tests:
                  - FlacDecoder_Decode_ManyFrames_ParsesMultiByteFrameNumbers

              - id: Speech-Audio-FlacDecoder-ContainerLayouts
                title: >-
                  The FlacDecoder shall handle up to eight channels and extra metadata blocks.
                justification: |
                  Real FLAC files vary in container layout.
                tests:
                  - FlacDecoder_Decode_ContainerVariants_RoundTrip

              - id: Speech-Audio-FlacDecoder-Id3Prefix
                title: >-
                  The FlacDecoder shall handle an ID3v2 prefix before the FLAC stream.
                justification: |
                  Tagged files commonly carry an ID3v2 prefix ahead of the FLAC marker.
                tests:
                  - FlacDecoder_Decode_Id3PrefixedFileWithDatExtension_DecodesThroughReader

              - id: Speech-Audio-FlacDecoder-UnknownLength
                title: >-
                  The FlacDecoder shall decode a stream of unknown length until no further frame follows.
                justification: |
                  Streaming encoders write a zero total-sample count.
                tests:
                  - FlacDecoder_Decode_UnknownTotal_DecodesUntilData_Ends

              - id: Speech-Audio-FlacDecoder-MarkerDetection
                title: >-
                  The FlacDecoder shall recognize a FLAC stream by its fLaC marker, optionally behind an
                  ID3v2 tag, and by nothing else.
                justification: |
                  Container detection by content must not mistake other data for FLAC.
                tests:
                  - FlacDecoder_IsFlac_VariousInputs_DetectsMarkerOnly

              - id: Speech-Audio-FlacDecoder-Integrity
                title: >-
                  The FlacDecoder shall verify frame-header CRC-8 and frame CRC-16 checksums,
                  rejecting a frame whose checksum is wrong with InvalidDataException.
                justification: |
                  Corrupt input must fail with a clear error instead of producing garbage.
                tests:
                  - FlacCrc_Checksums_StandardCheckString_MatchPublishedValues
                  - FlacDecoder_Decode_BadChecksums_ThrowUnlessVerificationDisabled

              - id: Speech-Audio-FlacDecoder-IntegrityOptOut
                title: >-
                  The FlacDecoder shall accept a frame with a wrong checksum when checksum
                  verification is disabled.
                justification: |
                  Hosts that prefer to recover as much audio as possible from a damaged file can
                  turn verification off.
                tests:
                  - FlacDecoder_Decode_BadChecksums_ThrowUnlessVerificationDisabled

              - id: Speech-Audio-FlacDecoder-TruncatedStreamRejection
                title: >-
                  The FlacDecoder shall reject a truncated stream with InvalidDataException.
                justification: |
                  Corrupt or hostile input must fail with a clear, bounded error instead of
                  producing garbage. This covers missing frames and damaged metadata that ends
                  early.
                tests:
                  - FlacDecoder_Decode_Truncated_Throws
                  - FlacDecoder_Decode_MissingFrames_Throws
                  - FlacDecoder_Decode_MetadataDamage_ReportsTruncation

              - id: Speech-Audio-FlacDecoder-InvalidStreamInfoRejection
                title: >-
                  The FlacDecoder shall reject invalid STREAMINFO values with
                  InvalidDataException.
                justification: |
                  STREAMINFO drives every later decoding decision, so invalid values must fail
                  clearly.
                tests:
                  - FlacDecoder_Decode_InvalidStreamInfoValues_Throw

              - id: Speech-Audio-FlacDecoder-InvalidFrameFieldRejection
                title: >-
                  The FlacDecoder shall reject a frame with invalid header, frame-number,
                  subframe or predictor fields with InvalidDataException.
                justification: |
                  Corrupt or hostile frames must fail with a clear, bounded error instead of
                  producing garbage.
                tests:
                  - FlacDecoder_Decode_InvalidFields_Throw
                  - FlacDecoder_Decode_DamagedSubframeHeader_ThrowsSpecificErrors
                  - FlacDecoder_Decode_FrameNumberBadContinuation_Throws
                  - FlacDecoder_Decode_InvalidPredictorParameters_Throw

              - id: Speech-Audio-FlacDecoder-OversizedBlockRejection
                title: >-
                  The FlacDecoder shall reject a block larger than the stream maximum or a frame
                  holding more samples than remain of a known total with InvalidDataException.
                justification: |
                  Frames that exceed the sizes the stream declares indicate corruption and must
                  not be decoded.
                tests:
                  - FlacDecoder_Decode_BlockLargerThanMaximum_Throws
                  - FlacDecoder_Decode_FrameExceedsDeclaredTotal_Throws

              - id: Speech-Audio-FlacDecoder-DamagedId3Rejection
                title: >-
                  The FlacDecoder shall reject a damaged ID3v2 prefix with InvalidDataException.
                justification: |
                  A damaged prefix, including a size field that is not syncsafe, prevents locating
                  the stream and must fail clearly.
                tests:
                  - FlacDecoder_Decode_Id3SizeNotSyncsafe_Throws
                  - FlacDecoder_Decode_DamagedId3Tag_ThrowsNotFlacStream

              - id: Speech-Audio-FlacDecoder-SampleCap
                title: >-
                  The FlacDecoder shall reject a stream exceeding the sample cap, which never exceeds the
                  maximum array length, with InvalidDataException.
                justification: |
                  A bounded decode cost protects hosts from oversized or hostile files.
                tests:
                  - FlacDecoder_Decode_ExceedsMaxSamples_Throws
                  - FlacDecoder_Decode_ExceedsArrayLimit_Throws
