---
# Software Unit Requirements for AudioFileReader
#
# The unit decodes WAV and FLAC audio files into AudioClip values, decomposing the AudioSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: AudioFileReader Requirements
            requirements:
              - id: Speech-Audio-AudioFileReader-DetectsContainer
                title: >-
                  The AudioFileReader class shall choose the WAV or FLAC decoder from the file content
                  rather than the file extension.
                justification: |
                  Files are often renamed or extension-less; the content is the reliable signal.
                tests:
                  - AudioFileReader_Read_DetectsContainerByContent
                  - AudioFileReader_Read_WavUnderUnrelatedExtension_DetectsWavByContent

              - id: Speech-Audio-AudioFileReader-DecodesFileOrStream
                title: >-
                  The AudioFileReader class shall decode a WAV or FLAC file path or a stream into an
                  AudioClip.
                justification: |
                  Hosts hold audio either on disk or in memory, including non-seekable sources.
                tests:
                  - AudioFileReader_Read_DetectsContainerByContent
                  - AudioFileReader_Read_NonSeekableStream_Decodes
                  - AudioFileReader_Read_WavStream_DecodesAndReadMonoRepeatsErrors

              - id: Speech-Audio-AudioFileReader-ListsSupportedExtensions
                title: >-
                  The AudioFileReader class shall list the supported file extensions (.wav and .flac).
                justification: |
                  Hosts and file pickers need a single authoritative list of the extensions the reader
                  supports.
                tests:
                  - AudioFileReader_SupportedExtensions_ListsWavAndFlac

              - id: Speech-Audio-AudioFileReader-ReportsMissingFile
                title: >-
                  The AudioFileReader class shall report a missing file with FileNotFoundException.
                justification: |
                  Callers must be able to tell a missing file from a bad format.
                tests:
                  - AudioFileReader_Read_MissingFile_ThrowsFileNotFound

              - id: Speech-Audio-AudioFileReader-ReportsMalformedFile
                title: >-
                  The AudioFileReader class shall report an unrecognized or malformed file with
                  InvalidDataException, naming the file path in path-based failures.
                justification: |
                  Callers must be able to tell a bad format from a missing file and to locate the offender.
                tests:
                  - AudioFileReader_Read_UnrecognizedFile_ThrowsInvalidDataWithPath
                  - AudioFileReader_Read_UnrecognizedStream_ThrowsInvalidDataWithoutPath

              - id: Speech-Audio-AudioFileReader-ReportsUnsupportedEncoding
                title: >-
                  The AudioFileReader class shall report an unsupported encoding with NotSupportedException,
                  naming the file path in path-based failures.
                justification: |
                  Callers must be able to tell an unsupported encoding from a damaged file.
                tests:
                  - AudioFileReader_Read_UnsupportedWav_ThrowsNotSupportedWithPath

              - id: Speech-Audio-AudioFileReader-ReportsInvalidArguments
                title: >-
                  The AudioFileReader class shall report invalid arguments with the matching argument
                  exception.
                justification: |
                  Caller mistakes must fail at the call site with a conventional exception type.
                tests:
                  - AudioFileReader_Read_InvalidArguments_ThrowArgumentExceptions
                  - AudioFileReader_Read_NegativeMaxSamples_ReportsOptionsParameter

              - id: Speech-Audio-AudioFileReader-ByteCap
                title: >-
                  The AudioFileReader class shall reject an input larger than the byte cap derived from
                  the configured maximum sample count with InvalidDataException before decoding it.
                justification: |
                  Hostile or accidental oversized inputs must fail with a bounded memory and time cost
                  rather than exhausting the host.
                tests:
                  - AudioFileReader_Read_FileLargerThanByteCap_ThrowsBeforeDecoding
                  - AudioFileReader_Read_SeekableStreamLargerThanByteCap_Throws
                  - AudioFileReader_Read_NonSeekableStreamLargerThanByteCap_Throws
                  - AudioFileReader_Read_UnboundedMaxSamples_ClampsByteCapToArrayMaxLength

              - id: Speech-Audio-AudioFileReader-MaxSamples
                title: >-
                  The AudioFileReader class shall reject a file that decodes to more samples than the
                  configured maximum sample count with InvalidDataException.
                justification: |
                  The byte cap is only an estimate; the decoded sample count is the exact bound on
                  memory use.
                tests:
                  - AudioFileReader_Read_MaxSamples_LimitsDecodedSamples

              - id: Speech-Audio-AudioFileReader-VerifyChecksums
                title: >-
                  The AudioFileReader class shall verify FLAC checksums by default and skip the
                  verification when the VerifyChecksums option is false.
                justification: |
                  Hosts choose between failing fast on damaged files and recovering as much audio as
                  possible.
                tests:
                  - AudioFileReader_Read_VerifyChecksums_AppliesToFlacOnly

              - id: Speech-Audio-AudioFileReader-ReadMono
                title: >-
                  The AudioFileReader class shall offer a mono read that returns the down-mixed samples at
                  the file's native sample rate.
                justification: |
                  Recognition and voice conditioning need mono audio and resample it themselves.
                tests:
                  - AudioFileReader_ReadMono_Stereo_DownMixesAtNativeRate
                  - AudioFileReader_Read_WavStream_DecodesAndReadMonoRepeatsErrors

              - id: Speech-Audio-AudioFileReader-FlacFixtures
                title: >-
                  The AudioFileReader class shall decode FLAC files produced by libFLAC (via libsndfile)
                  bit-exactly, matching a lossless WAV made from the same samples.
                justification: |
                  Independent encoder output is the ground truth that the managed decoder is correct.
                tests:
                  - FlacDecoder_Decode_SoundfileFixture_MatchesWavBitExact
