---
# Software Unit Requirements for AudioFileReader
#
# The unit decodes WAV and FLAC audio files into AudioClip values, decomposing the AudioSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: AudioFileReader Requirements
            requirements:
              - id: Speech-Audio-AudioFileReader-DetectsContainer
                title: >-
                  The AudioFileReader class shall decode a WAV or FLAC file or stream into an AudioClip,
                  choosing the decoder from the file content rather than the file extension, and shall list
                  the supported extensions.
                justification: |
                  Files are often renamed or extension-less; the content is the reliable signal.
                tests:
                  - AudioFileReader_SupportedExtensions_ListsWavAndFlac
                  - AudioFileReader_Read_DetectsContainerByContent

              - id: Speech-Audio-AudioFileReader-ReportsErrors
                title: >-
                  The AudioFileReader class shall report a missing file with FileNotFoundException, an
                  unrecognized or malformed file with InvalidDataException, an unsupported encoding with
                  NotSupportedException, and invalid arguments with the matching argument exception, naming
                  the file path in path-based failures.
                justification: |
                  Callers must be able to tell a missing file from a bad format and to locate the offender.
                tests:
                  - AudioFileReader_Read_Errors_AreReported
                  - AudioFileReader_Read_UnsupportedWav_ThrowsNotSupportedWithPath
                  - AudioFileReader_Read_FileLargerThanByteCap_ThrowsBeforeDecoding
                  - AudioFileReader_Read_SeekableStreamLargerThanByteCap_Throws
                  - AudioFileReader_Read_NonSeekableStreamLargerThanByteCap_Throws
                  - AudioFileReader_Read_NonSeekableStream_Decodes

              - id: Speech-Audio-AudioFileReader-ReadMono
                title: >-
                  The AudioFileReader class shall offer a mono read that returns the down-mixed samples at
                  the file's native sample rate.
                justification: |
                  Recognition and voice conditioning need mono audio and resample it themselves.
                tests:
                  - AudioFileReader_ReadMono_Stereo_DownMixesAtNativeRate

              - id: Speech-Audio-AudioFileReader-FlacFixtures
                title: >-
                  The AudioFileReader class shall decode FLAC files produced by libFLAC (via libsndfile)
                  bit-exactly, matching a lossless WAV made from the same samples.
                justification: |
                  Independent encoder output is the ground truth that the managed decoder is correct.
                tests:
                  - FlacDecoder_Decode_SoundfileFixture_MatchesWavBitExact
