---
# Software Unit Requirements for WindowedSincLowpassFilter
#
# WindowedSincLowpassFilter has no dedicated test class: it is exercised end to end through the
# anti-aliasing tests of the two resamplers that consume it, which is the evidence linked below.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: WindowedSincLowpassFilter Requirements
            requirements:
              - id: Speech-Audio-WindowedSincLowpassFilter-AntiAliasing
                title: >-
                  The WindowedSincLowpassFilter class shall provide a normalized windowed-sinc
                  lowpass filter that attenuates content above the target Nyquist frequency before
                  decimation, for both the capture-direction and playback-direction resamplers.
                justification: |
                  Downsampling without anti-aliasing folds energy above the target Nyquist
                  frequency back into the audible band. One shared filter keeps the DSP math
                  written once for both resampling directions.
                tests:
                  - AudioFrameResampler_Resample_AboveTargetNyquistTone_IsAttenuated
                  - PlaybackAudioResampler_Resample_AboveTargetNyquistTone_IsAttenuated
