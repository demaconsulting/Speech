---
# Software Unit Requirements for PortAudioCaptureDevice
#
# These requirements describe the design-level behavior of the PortAudioCaptureDevice
# unit, decomposing the parent AudioSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: PortAudioCaptureDevice Requirements
            requirements:
              - id: Speech-Audio-PortAudioCaptureDevice-AvailabilityReflectsResolution
                title: >-
                  The PortAudioCaptureDevice class shall report availability according to whether
                  a capture device can be resolved on the preferred host API.
                justification: |
                  Hosts need an honest, non-throwing way to decide whether manual capture is
                  currently possible.
                tests:
                  - PortAudioCaptureDevice_IsAvailable_NoResolvableDevice_ReturnsFalse

              - id: Speech-Audio-PortAudioCaptureDevice-StaleSelectionUsesDefault
                title: >-
                  The PortAudioCaptureDevice class shall fall back to the preferred host API's
                  default input device when a persisted selection no longer resolves.
                justification: |
                  A stale user preference should not make capture unavailable when the system
                  still has a valid default input device.
                tests:
                  - PortAudioCaptureDevice_Constructor_StaleSelection_FallsBackToDefaultDevice

              - id: Speech-Audio-PortAudioCaptureDevice-FrameDelivery
                title: >-
                  The PortAudioCaptureDevice class shall raise FrameCaptured with interleaved
                  floating-point samples supplied by the PortAudio seam.
                justification: |
                  The speech-recognition pipeline consumes normalized floating-point sample
                  blocks, so the capture implementation must surface that representation.
                tests:
                  - PortAudioCaptureDevice_Start_StreamCapturesSamples_RaisesFrameCaptured

              - id: Speech-Audio-PortAudioCaptureDevice-NativeFaultsThrowUnavailable
                title: >-
                  The PortAudioCaptureDevice class shall surface native stream-open failures as
                  AudioDeviceUnavailableException.
                justification: |
                  A device that disappeared or could not open after selection should fail at
                  first use with a library-specific exception rather than leaking native details.
                tests:
                  - PortAudioCaptureDevice_Start_OpenFails_ThrowsAudioDeviceUnavailableException

              - id: Speech-Audio-PortAudioCaptureDevice-CaptureFormat
                title: >-
                  The PortAudioCaptureDevice class shall report the channel count and sample rate
                  it requested when opening the resolved device, and shall report zero for both
                  when no device could be resolved.
                justification: |
                  The reported format must describe the audio actually requested and then
                  delivered through FrameCaptured, whether it came from the device default or a
                  caller-supplied preference; reporting zero when nothing was resolved keeps the
                  report consistent with the device's honest availability flag.
                tests:
                  - PortAudioCaptureDevice_CaptureFormat_ResolvedDevice_ReflectsResolvedDeviceFormat
                  - PortAudioCaptureDevice_CaptureFormat_NoResolvableDevice_ReturnsZeroRateAndChannelCount

              - id: Speech-Audio-PortAudioCaptureDevice-PreferredFormatSelection
                title: >-
                  The PortAudioCaptureDevice class shall request the caller's preferred sample
                  rate when one is supplied and shall clamp a preferred channel count down to
                  the resolved device's maximum input-channel capability; when no preference is
                  supplied it shall request the device's own default sample rate and full input
                  capability.
                justification: |
                  A format hint must never ask PortAudio to open more input channels than the
                  device exposes, but should otherwise let model-driven composition bias the
                  opened stream toward the model's own format and potentially avoid later
                  resampling or downmixing work.
                tests:
                  - PortAudioCaptureDevice_Constructor_PreferredFormatWithinCapability_UsesPreferredFormat
                  - PortAudioCaptureDevice_Constructor_PreferredChannelCountExceedsCapability_ClampsAndReportsDiagnostic
                  - PortAudioCaptureDevice_Constructor_PreferredFormatOmitted_UsesDeviceDefaultFormat
