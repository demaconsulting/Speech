---
# Software Unit Requirements for AudioDeviceDescription
#
# These requirements describe the design-level behavior of the AudioDeviceDescription
# unit, decomposing the parent AudioSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: AudioDeviceDescription Requirements
            requirements:
              - id: Speech-Audio-AudioDeviceDescription-NameIdentity
                title: >-
                  The AudioDeviceDescription record shall expose a device's name, direction,
                  channel count, and sample rate.
                justification: |
                  Hosts building device pickers need enough descriptive metadata to present a
                  device meaningfully without querying the backend again.
                tests:
                  - AudioDeviceDescription_Constructor_ExposesAllFields

              - id: Speech-Audio-AudioDeviceDescription-ValueEquality
                title: >-
                  The AudioDeviceDescription record shall compare equal exactly when all of its
                  name, direction, channel count, and sample rate match.
                justification: |
                  Consumers (probes, selections, and hosts) compare descriptions by value, and
                  a difference in any one field must make two descriptions distinct.
                tests:
                  - AudioDeviceSelection_Resolve_MatchingName_ReturnsMatchingDevice
                  - AudioDeviceDescription_Equality_IdenticalValues_AreEqual
                  - AudioDeviceDescription_Equality_AnyDifferingValue_AreNotEqual
