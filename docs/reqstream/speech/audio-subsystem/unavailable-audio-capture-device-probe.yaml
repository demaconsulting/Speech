---
# Software Unit Requirements for UnavailableAudioCaptureDeviceProbe
#
# These requirements describe the design-level behavior of the UnavailableAudioCaptureDeviceProbe
# unit, decomposing the parent Speech-Audio-UnavailableFallbacks subsystem requirement.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: UnavailableAudioCaptureDeviceProbe Requirements
            requirements:
              - id: Speech-Audio-UnavailableAudioCaptureDeviceProbe-EmptyEnumeration
                title: The UnavailableAudioCaptureDeviceProbe class shall always enumerate zero devices.
                justification: |
                  A probe with no real backend must report "no devices" rather than throwing, so
                  callers can treat "no devices" and "backend unavailable" identically.
                tests:
                  - UnavailableAudioCaptureDeviceProbe_Enumerate_Always_ReturnsEmptyList
