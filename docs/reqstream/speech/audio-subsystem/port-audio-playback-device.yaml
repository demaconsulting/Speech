---
# Software Unit Requirements for PortAudioPlaybackDevice
#
# These requirements describe the design-level behavior of the PortAudioPlaybackDevice
# unit, decomposing the parent AudioSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: PortAudioPlaybackDevice Requirements
            requirements:
              - id: Speech-Audio-PortAudioPlaybackDevice-AvailabilityReflectsResolution
                title: >-
                  The PortAudioPlaybackDevice class shall report availability according to
                  whether a playback device can be resolved on the preferred host API.
                justification: |
                  Hosts need an honest, non-throwing way to decide whether manual playback is
                  currently possible.
                tests:
                  - PortAudioPlaybackDevice_IsAvailable_NoResolvableDevice_ReturnsFalse
                  - PortAudioPlaybackDevice_Constructor_HostApiUnresolvable_ReportsUnavailable

              - id: Speech-Audio-PortAudioPlaybackDevice-ResolutionFaultsContained
                title: >-
                  The PortAudioPlaybackDevice class shall contain a fault raised while resolving
                  the playback device and report the device as unavailable.
                justification: |
                  Construction happens at application start-up, so a native device-table fault
                  must degrade to honest unavailability rather than an arbitrary interop
                  exception.
                tests:
                  - PortAudioPlaybackDevice_Constructor_DeviceQueryFaults_ReportsUnavailableAndDiagnostic

              - id: Speech-Audio-PortAudioPlaybackDevice-NullEnvironmentRejected
                title: >-
                  The PortAudioPlaybackDevice class shall reject a null environment with an
                  ArgumentNullException.
                justification: |
                  A null environment is a programming error and the only condition for which
                  construction throws.
                tests:
                  - PortAudioPlaybackDevice_Constructor_NullEnvironment_ThrowsArgumentNullException

              - id: Speech-Audio-PortAudioPlaybackDevice-UnresolvedOperationsThrow
                title: >-
                  The PortAudioPlaybackDevice class shall throw AudioDeviceUnavailableException
                  from Start, Stop and Write when no playback device could be resolved.
                justification: |
                  Operating on an honestly unavailable device is a programming error that must
                  surface as the library's documented exception.
                tests:
                  - PortAudioPlaybackDevice_Operations_NoResolvableDevice_ThrowAudioDeviceUnavailableException

              - id: Speech-Audio-PortAudioPlaybackDevice-NullWriteRejected
                title: >-
                  The PortAudioPlaybackDevice class shall reject a null sample list passed to
                  Write with an ArgumentNullException.
                justification: |
                  A null sample list is a programming error that must be reported distinctly from
                  device unavailability.
                tests:
                  - PortAudioPlaybackDevice_Operations_NoResolvableDevice_ThrowAudioDeviceUnavailableException

              - id: Speech-Audio-PortAudioPlaybackDevice-NamedSelectionResolved
                title: >-
                  The PortAudioPlaybackDevice class shall resolve the device whose name exactly
                  matches the persisted selection when that device is present.
                justification: |
                  A user's explicit device choice must be honored over the host-API default.
                tests:
                  - PortAudioPlaybackDevice_Constructor_NamedSelectionPresent_ResolvesNamedDevice

              - id: Speech-Audio-PortAudioPlaybackDevice-StaleSelectionUsesDefault
                title: >-
                  The PortAudioPlaybackDevice class shall fall back to the preferred host API's
                  default output device when a persisted selection no longer resolves.
                justification: |
                  A stale user preference should not make playback unavailable when the system
                  still has a valid default output device.
                tests:
                  - PortAudioPlaybackDevice_Constructor_StaleSelection_FallsBackToDefaultDevice

              - id: Speech-Audio-PortAudioPlaybackDevice-QueuedPlayback
                title: >-
                  The PortAudioPlaybackDevice class shall queue interleaved floating-point
                  samples and deliver them to the stream's sample requests in the order written.
                justification: |
                  Callback-driven playback must avoid blocking for new audio data.
                tests:
                  - PortAudioPlaybackDevice_Write_MultipleBlocksOfVaryingSize_DrainsInOrder
                  - PortAudioPlaybackDevice_Write_BlockLargerThanRequest_DrainsRemainderOnNextCall
                  - PortAudioPlaybackDevice_Write_SmallBlockFollowedByAnotherWrite_ConcatenatesAcrossBoundary

              - id: Speech-Audio-PortAudioPlaybackDevice-RestartNeverReplaysStaleAudio
                title: >-
                  The PortAudioPlaybackDevice class shall never replay audio left over from a
                  previous stream when playback is restarted, including after a failed native
                  stop.
                justification: |
                  A partially consumed block surviving a stop would play stale audio at the start
                  of the next stream; a failed native stop must not defeat this guarantee.
                tests:
                  - PortAudioPlaybackDevice_Stop_PartiallyConsumedBlock_RestartNeverReplaysStaleAudio
                  - PortAudioPlaybackDevice_Start_AfterFailedNativeStop_DoesNotReplayStaleHeadBlock
                  - PortAudioPlaybackDevice_Write_AfterStop_PendingCountMatchesQueuedSamples

              - id: Speech-Audio-PortAudioPlaybackDevice-WriteCopiesBuffer
                title: >-
                  The PortAudioPlaybackDevice class shall copy the samples passed to Write so the
                  caller may reuse its buffer as soon as the call returns.
                justification: |
                  Write is fire-and-forget; queued audio must own stable storage.
                tests:
                  - PortAudioPlaybackDevice_Write_CallerMutatesBufferAfterWrite_QueuedAudioUnchanged

              - id: Speech-Audio-PortAudioPlaybackDevice-EmptyWriteIgnored
                title: >-
                  The PortAudioPlaybackDevice class shall ignore an empty sample list passed to
                  Write.
                justification: |
                  An empty write carries no audio and must not queue a zero-length block.
                tests:
                  - PortAudioPlaybackDevice_Write_EmptyAndNonCollectionLists_HandledCorrectly

              - id: Speech-Audio-PortAudioPlaybackDevice-UnderrunZeroFill
                title: >-
                  The PortAudioPlaybackDevice class shall zero-fill any playback underrun.
                justification: |
                  The callback must return a complete output buffer to PortAudio on every
                  invocation, even when fewer samples are queued than requested.
                tests:
                  - PortAudioPlaybackDevice_Write_StreamRequestsSamples_DrainsQueueAndZeroFills

              - id: Speech-Audio-PortAudioPlaybackDevice-OpenFailureThrowsUnavailable
                title: >-
                  The PortAudioPlaybackDevice class shall surface a native stream-open failure as
                  AudioDeviceUnavailableException.
                justification: |
                  A device that disappeared or could not open after selection should fail at
                  first use with a library-specific exception rather than leaking native details.
                tests:
                  - PortAudioPlaybackDevice_Start_OpenFails_ThrowsAudioDeviceUnavailableException

              - id: Speech-Audio-PortAudioPlaybackDevice-StartFailureThrowsUnavailable
                title: >-
                  The PortAudioPlaybackDevice class shall surface a native stream-start failure
                  as AudioDeviceUnavailableException wrapping the original failure, disposing
                  the opened stream.
                justification: |
                  A stream that opened but could not start must not leak, and the original
                  failure rather than a cleanup fault must reach the caller.
                tests:
                  - PortAudioPlaybackDevice_Start_NativeStreamStartFails_DisposesStreamAndReleasesRegistration
                  - PortAudioPlaybackDevice_Start_DisposeThrowsDuringStartFailureCleanup_UnregistersActiveStreamAndThrowsOriginalStartFailure

              - id: Speech-Audio-PortAudioPlaybackDevice-StopFailureThrowsUnavailable
                title: >-
                  The PortAudioPlaybackDevice class shall surface a native stream-stop failure as
                  AudioDeviceUnavailableException wrapping the original failure, still disposing
                  the stream and logging, not throwing, any dispose fault that follows.
                justification: |
                  Shutdown faults must not escape as arbitrary interop exceptions, and the
                  primary stop failure must remain visible to the caller.
                tests:
                  - PortAudioPlaybackDevice_Stop_NativeStopFails_ThrowsWrappedAndReleasesRegistration
                  - PortAudioPlaybackDevice_Stop_NativeStopAndDisposeBothFail_ThrowsStopFailure

              - id: Speech-Audio-PortAudioPlaybackDevice-DisposeFailureThrowsUnavailable
                title: >-
                  The PortAudioPlaybackDevice class shall surface a stream-dispose failure that
                  follows a successful stop as AudioDeviceUnavailableException.
                justification: |
                  A dispose fault is the final interop cleanup boundary and must be wrapped
                  consistently.
                tests:
                  - PortAudioPlaybackDevice_Stop_DisposeFailsAfterStop_ThrowsWrappedDisposeFailure

              - id: Speech-Audio-PortAudioPlaybackDevice-IdempotentStart
                title: >-
                  The PortAudioPlaybackDevice class shall treat Start on an already started
                  device as a no-op.
                justification: |
                  Opening a second native stream would leak the first.
                tests:
                  - PortAudioPlaybackDevice_Start_AlreadyStarted_OpensResolvedFormatOnce

              - id: Speech-Audio-PortAudioPlaybackDevice-PlaybackFormat
                title: >-
                  The PortAudioPlaybackDevice class shall report the channel count and sample
                  rate it requested when opening the resolved device.
                justification: |
                  The reported format must describe the audio Write actually sends to the device,
                  whether that request came from the hardware default or a caller-supplied
                  preference, so a consumer resampling or upmixing audio before playback -
                  notably speech synthesis - converts it correctly.
                tests:
                  - PortAudioPlaybackDevice_PlaybackFormat_ResolvedDevice_ReflectsResolvedDeviceFormat
                  - PortAudioPlaybackDevice_Start_AlreadyStarted_OpensResolvedFormatOnce

              - id: Speech-Audio-PortAudioPlaybackDevice-ZeroPlaybackFormatWhenUnresolved
                title: >-
                  The PortAudioPlaybackDevice class shall report a channel count and sample rate
                  of zero when no device could be resolved.
                justification: |
                  Reporting zero when nothing was resolved keeps the report consistent with the
                  device's honest availability flag.
                tests:
                  - PortAudioPlaybackDevice_PlaybackFormat_NoResolvableDevice_ReturnsZeroRateAndChannelCount

              - id: Speech-Audio-PortAudioPlaybackDevice-PreferredFormatSelection
                title: >-
                  The PortAudioPlaybackDevice class shall request the caller's preferred sample
                  rate when one is supplied and the resolved device's host API confirms it can
                  be opened.
                justification: |
                  Letting model-driven composition bias the opened stream toward the model's
                  preferred format potentially avoids later resampling or upmixing work.
                tests:
                  - PortAudioPlaybackDevice_Constructor_PreferredFormatWithinCapability_UsesPreferredFormat
                  - PortAudioPlaybackDevice_Constructor_PreferredSampleRateSupported_UsesPreferredFormat

              - id: Speech-Audio-PortAudioPlaybackDevice-PreferredChannelCountClamp
                title: >-
                  The PortAudioPlaybackDevice class shall clamp a preferred channel count down to
                  the resolved device's maximum output-channel capability.
                justification: |
                  A playback hint must never ask PortAudio to open more output channels than the
                  device exposes.
                tests:
                  - PortAudioPlaybackDevice_Constructor_PreferredChannelCountExceedsCapability_ClampsAndReportsDiagnostic

              - id: Speech-Audio-PortAudioPlaybackDevice-DefaultFormatWithoutPreference
                title: >-
                  The PortAudioPlaybackDevice class shall request the device's own default sample
                  rate and full output capability when no preferred format is supplied.
                justification: |
                  Callers that express no preference must keep today's device-native behavior.
                tests:
                  - PortAudioPlaybackDevice_Constructor_PreferredFormatOmitted_UsesDeviceDefaultFormat

              - id: Speech-Audio-PortAudioPlaybackDevice-PreferredSampleRateNegotiated
                title: >-
                  The PortAudioPlaybackDevice class shall fall back to the resolved device's
                  default sample rate and report an Info-level diagnostic when the resolved
                  device's host API cannot open the caller's preferred sample rate.
                justification: |
                  Forwarding an un-negotiated preferred rate straight to the native stream-open
                  call fails Start() on real hardware whose native mix rate differs from a
                  synthesis model's declared preferred sample rate. Probing capability at
                  construction time, before IsAvailable/SampleRate are ever read, keeps both
                  honest: a caller only ever sees a sample rate that has already been confirmed
                  openable.
                tests:
                  - PortAudioPlaybackDevice_Constructor_PreferredSampleRateUnsupported_FallsBackToDeviceDefaultSampleRateAndReportsDiagnostic

              - id: Speech-Audio-PortAudioPlaybackDevice-PendingSampleCount
                title: >-
                  The PortAudioPlaybackDevice class shall track, with PendingSampleCount, how
                  many samples passed to Write have not yet been dequeued by the playback
                  callback.
                justification: |
                  A caller that must not cut playback off, notably speech synthesis, needs a
                  signal of real drain progress. Write is fire-and-forget, so only a count that
                  reflects actual callback consumption, rather than mere queue occupancy at
                  enqueue time, tells it when the hardware has rendered everything.
                tests:
                  - PortAudioPlaybackDevice_PendingSampleCount_WriteDrainAndStop_TracksQueueDepth
                  - PortAudioPlaybackDevice_Write_MultipleBlocksOfVaryingSize_DrainsInOrder
                  - PortAudioPlaybackDevice_Write_BlockLargerThanRequest_DrainsRemainderOnNextCall
                  - PortAudioPlaybackDevice_Write_SmallBlockFollowedByAnotherWrite_ConcatenatesAcrossBoundary
                  - PortAudioPlaybackDevice_Write_EmptyAndNonCollectionLists_HandledCorrectly
                  - PortAudioPlaybackDevice_ProvideSamples_NonPositiveRequest_ReturnsEmptyAndKeepsQueue

              - id: Speech-Audio-PortAudioPlaybackDevice-PendingSampleCountExcludesZeroFill
                title: >-
                  The PortAudioPlaybackDevice class shall decrement the pending sample count only
                  by samples the playback callback genuinely dequeues, never by a zero-fill
                  shortfall.
                justification: |
                  Counting zero-fill padding as drained would drive the count below the real
                  queue depth and let a drain-waiting caller stop playback early.
                tests:
                  - PortAudioPlaybackDevice_PendingSampleCount_WriteDrainAndStop_TracksQueueDepth
                  - PortAudioPlaybackDevice_Write_StreamRequestsSamples_DrainsQueueAndZeroFills

              - id: Speech-Audio-PortAudioPlaybackDevice-PendingSampleCountReset
                title: >-
                  The PortAudioPlaybackDevice class shall report a pending sample count of zero
                  after Stop clears the queue.
                justification: |
                  A discarded queue can never deliver samples, so reporting them as pending would
                  stall drain-waiting callers.
                tests:
                  - PortAudioPlaybackDevice_Stop_PartiallyConsumedBlock_RestartNeverReplaysStaleAudio
                  - PortAudioPlaybackDevice_PendingSampleCount_WriteDrainAndStop_TracksQueueDepth
                  - PortAudioPlaybackDevice_Stop_NativeStopFails_ThrowsWrappedAndReleasesRegistration

              - id: Speech-Audio-PortAudioPlaybackDevice-PendingSampleCountZeroWhenUnresolved
                title: >-
                  The PortAudioPlaybackDevice class shall report a pending sample count of zero
                  when no device was resolved.
                justification: |
                  A device that never resolved can never deliver samples, so reporting any as
                  pending would stall drain-waiting callers.
                tests:
                  - PortAudioPlaybackDevice_IsAvailable_NoResolvableDevice_ReturnsFalse

              - id: Speech-Audio-PortAudioPlaybackDevice-ActiveStreamRegistration
                title: >-
                  The PortAudioPlaybackDevice class shall register itself with the environment's
                  active-stream tracking before Start opens a native stream, so a concurrent or
                  later PortAudioEnvironment.Refresh() knows this device's stream is active.
                justification: |
                  PortAudioEnvironment.Refresh()'s refusal behavior (see
                  Speech-Audio-PortAudio-PortAudioEnvironment-Refresh) is only correct if this
                  device accurately reports its own active state to the shared environment; an
                  unregistered active stream would let a refresh silently tear down live audio.
                tests:
                  - PortAudioPlaybackDevice_Start_RegistersActiveStreamWithEnvironment_RefreshThrowsWhileStarted

              - id: Speech-Audio-PortAudioPlaybackDevice-ActiveStreamDeregistration
                title: >-
                  The PortAudioPlaybackDevice class shall unregister itself from the environment's
                  active-stream tracking once Stop completes, so a later
                  PortAudioEnvironment.Refresh() is no longer blocked by this device.
                justification: |
                  A stream left registered after Stop would block every future refresh
                  indefinitely.
                tests:
                  - PortAudioPlaybackDevice_Stop_UnregistersActiveStream_RefreshSucceedsAfterStop
                  - PortAudioPlaybackDevice_Stop_NativeStopFails_ThrowsWrappedAndReleasesRegistration

              - id: Speech-Audio-PortAudioPlaybackDevice-ActiveStreamDeregistrationOnStartFailure
                title: >-
                  The PortAudioPlaybackDevice class shall unregister itself from the environment's
                  active-stream tracking when Start's native open or start attempt fails.
                justification: |
                  A registration left behind by a failed start would block every future refresh
                  indefinitely, even though no stream is running.
                tests:
                  - PortAudioPlaybackDevice_Start_DisposeThrowsDuringStartFailureCleanup_UnregistersActiveStreamAndThrowsOriginalStartFailure
                  - PortAudioPlaybackDevice_Start_NativeStreamStartFails_DisposesStreamAndReleasesRegistration

              - id: Speech-Audio-PortAudioPlaybackDevice-StaleAfterRefreshThrows
                title: >-
                  The PortAudioPlaybackDevice class shall throw AudioDeviceUnavailableException
                  from Start when the PortAudioEnvironment it was resolved against has completed
                  a device-table refresh since this instance was constructed.
                justification: |
                  See Speech-Audio-DeviceRefreshInvalidation: a device
                  resolved before a refresh caches a device index that the refresh may have
                  invalidated (reused for a different physical device, or removed entirely), so
                  starting it afterward without this check risks opening a stream against the
                  wrong hardware rather than failing safely.
                tests:
                  - PortAudioPlaybackDevice_Start_EnvironmentRefreshedAfterConstruction_ThrowsAudioDeviceUnavailableException
                  - PortAudioPlaybackDevice_Start_ConstructedAfterRefresh_StartsNormally
