---
# cspell:ignore Alsa
# Software Subsystem Requirements for PortAudio
#
# These requirements describe the child PortAudio subsystem that isolates native
# PortAudioSharp2 interop behind mockable internal abstractions.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: PortAudio Requirements
            requirements:
              - id: Speech-Audio-PortAudio-Seam
                title: >-
                  The PortAudio subsystem shall allow host-API selection, device enumeration and
                  stream behavior to run against a substitute audio runtime, so that they operate
                  without the native PortAudio library or any audio hardware.
                justification: |
                  CI cannot assume access to audio hardware, so host-API selection and stream
                  lifecycle logic must be verifiable using fakes instead of the real runtime.
                  The mechanism (a managed abstraction in front of the native runtime) is
                  described in the PortAudio design document.
                children:
                  - Speech-Audio-PortAudio-IPortAudioApi-AbstractsNativeRuntime
                  - Speech-Audio-PortAudio-IPortAudioStream-AbstractsStreamLifecycle
                  - Speech-Audio-PortAudio-PortAudioEnvironment-CachesInitialization
                  - Speech-Audio-PortAudio-PortAudioEnvironment-Refresh
                  - Speech-Audio-PortAudio-PortAudioEnvironment-RefreshRefusedWhileActive
                  - Speech-Audio-PortAudio-PortAudioEnvironment-RefreshAdvancesGeneration
                  - Speech-Audio-PortAudio-PortAudioEnvironment-SerializedInitializationEvaluation
                  - Speech-Audio-PortAudio-PortAudioApi-BridgesManagedAndNativeCalls
                  - Speech-Audio-PortAudio-SupportingTypes-DescribeInteropMetadata
                tests:
                  - PortAudioEnvironment_TryResolvePreferredHostApi_InitializationFails_ReturnsFalseAndCachesFailure
                  - PortAudioCaptureDevice_Start_StreamCapturesSamples_RaisesFrameCaptured
                  - PortAudioPlaybackDevice_Write_StreamRequestsSamples_DrainsQueueAndZeroFills

              - id: Speech-Audio-PortAudio-PreferredHostApiResolution
                title: >-
                  The PortAudio subsystem shall map each supported operating system to exactly
                  one preferred PortAudio host API.
                justification: |
                  The higher-level audio subsystem relies on a single host API per platform to
                  avoid duplicate device listings and host-API ambiguity.
                children:
                  - Speech-Audio-PortAudio-PortAudioEnvironment-PlatformMapping
                  - Speech-Audio-PortAudio-SupportingTypes-DeclareHostApiConstants
                tests:
                  - windows@PortAudioEnvironment_ResolvePreferredHostApiType_Windows_ReturnsWasapi
                  - ubuntu@PortAudioEnvironment_ResolvePreferredHostApiType_Linux_ReturnsAlsa
                  - macos@PortAudioEnvironment_ResolvePreferredHostApiType_MacOs_ReturnsCoreAudio

              - id: Speech-Audio-PortAudio-HostApiIndexResolution
                title: >-
                  The PortAudio subsystem shall resolve the preferred PortAudio host API's runtime
                  host-API index.
                justification: |
                  Device enumeration and default-device selection are scoped by the runtime
                  host-API index, which only the native runtime can report.
                children:
                  - Speech-Audio-PortAudio-SupportingTypes-BindMissingHostApiInterop
                  - Speech-Audio-PortAudio-PortAudioEnvironment-ResolvesPreferredHostApi
                tests:
                  - PortAudioEnvironment_TryResolvePreferredHostApi_InitializedAndMapped_ReturnsHostApiInfo
                  - PortAudioEnvironment_TryResolvePreferredHostApi_PreferredHostApiMissing_ReturnsFalse
