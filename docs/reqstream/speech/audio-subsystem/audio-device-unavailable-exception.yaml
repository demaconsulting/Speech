---
# Software Unit Requirements for AudioDeviceUnavailableException
#
# These requirements describe the design-level behavior of the AudioDeviceUnavailableException
# unit, decomposing the parent Speech-Audio-UnavailableFallbacks subsystem requirement.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: AudioDeviceUnavailableException Requirements
            requirements:
              - id: Speech-Audio-AudioDeviceUnavailableException-Thrown
                title: >-
                  The AudioDeviceUnavailableException class shall provide standard exception
                  constructors (default, message, message with inner exception).
                justification: |
                  Standard exception conformance lets callers construct, catch, and inspect this
                  exception like any other .NET exception type, including wrapping an underlying
                  native failure as the inner exception.
                tests:
                  - AudioDeviceUnavailableException_Constructor_WithMessage_ExposesMessage
                  - AudioDeviceUnavailableException_Constructor_WithInnerException_ExposesBoth
                  - AudioDeviceUnavailableException_Constructor_Default_HasNonEmptyMessage
