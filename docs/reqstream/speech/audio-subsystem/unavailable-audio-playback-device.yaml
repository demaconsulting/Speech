---
# Software Unit Requirements for UnavailableAudioPlaybackDevice
#
# These requirements describe the design-level behavior of the UnavailableAudioPlaybackDevice
# unit, decomposing the parent AudioSubsystem requirements.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: UnavailableAudioPlaybackDevice Requirements
            requirements:
              - id: Speech-Audio-UnavailableAudioPlaybackDevice-ReportsUnavailable
                title: >-
                  The UnavailableAudioPlaybackDevice class shall report IsAvailable as false and
                  never throw merely for being constructed or held.
                justification: |
                  A caller must always be able to safely obtain and hold a fallback playback
                  device, per this library's "nothing throws at composition" decision.
                tests:
                  - UnavailableAudioPlaybackDevice_IsAvailable_Read_ReturnsFalse

              - id: Speech-Audio-UnavailableAudioPlaybackDevice-OperationsThrow
                title: >-
                  The UnavailableAudioPlaybackDevice class shall throw AudioDeviceUnavailableException
                  when Start, Stop, or Write is invoked.
                justification: |
                  A caller that ignores the IsAvailable flag and invokes an operational member
                  has made a programming error that must surface immediately.
                tests:
                  - UnavailableAudioPlaybackDevice_Start_Always_ThrowsAudioDeviceUnavailableException
                  - UnavailableAudioPlaybackDevice_Stop_Always_ThrowsAudioDeviceUnavailableException
                  - UnavailableAudioPlaybackDevice_Write_Always_ThrowsAudioDeviceUnavailableException

              - id: Speech-Audio-UnavailableAudioPlaybackDevice-ZeroPlaybackFormat
                title: >-
                  The UnavailableAudioPlaybackDevice class shall report a channel count and
                  sample rate of zero.
                justification: |
                  A fallback device plays no audio, so reporting a plausible-looking format would
                  mislead a consumer into preparing a conversion for audio that will never be
                  played; zero is the honest report and matches the false availability flag,
                  mirroring UnavailableAudioCaptureDevice's identical behavior.
                tests:
                  - UnavailableAudioPlaybackDevice_PlaybackFormat_Read_ReturnsZeroRateAndChannelCount
