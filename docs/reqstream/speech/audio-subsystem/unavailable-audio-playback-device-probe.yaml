---
# Software Unit Requirements for UnavailableAudioPlaybackDeviceProbe
#
# These requirements describe the design-level behavior of the UnavailableAudioPlaybackDeviceProbe
# unit, decomposing the parent Speech-Audio-UnavailableFallbacks subsystem requirement.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: UnavailableAudioPlaybackDeviceProbe Requirements
            requirements:
              - id: Speech-Audio-UnavailableAudioPlaybackDeviceProbe-EmptyEnumeration
                title: The unavailable audio playback device probe shall always report zero devices.
                justification: |
                  A probe with no real backend must report "no devices" rather than throwing, so
                  callers can treat "no devices" and "backend unavailable" identically.
                tests:
                  - UnavailableAudioPlaybackDeviceProbe_Enumerate_Always_ReturnsEmptyList
