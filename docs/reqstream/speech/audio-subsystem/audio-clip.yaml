---
# Software Unit Requirements for AudioClip
#
# The unit is the decoded-audio value type returned by AudioFileReader.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: AudioClip Requirements
            requirements:
              - id: Speech-Audio-AudioClip-DerivedMembers
                title: >-
                  The AudioClip record shall report its frame count and duration.
                justification: |
                  Consumers need the common size views of decoded audio without re-implementing them.
                tests:
                  - AudioClip_DerivedMembers_FrameCountAndDuration
                  - AudioClip_EmptySamples_HasZeroDuration

              - id: Speech-Audio-AudioClip-ToMono
                title: >-
                  The AudioClip record shall down-mix to mono.
                justification: |
                  Mono-oriented consumers need a down-mixed view of decoded audio.
                tests:
                  - AudioClip_ToMono_AveragesChannels
                  - AudioClip_ToMono_MonoClip_ReturnsIndependentCopy
                  - AudioClip_ToMono_NaNSample_PropagatesToFrame
                  - AudioClip_DerivedMembers_MonoDownMix

              - id: Speech-Audio-AudioClip-ToPcm16
                title: >-
                  The AudioClip record shall convert its samples to 16-bit PCM so that the nominal
                  [-1, 1] sample range maps onto the 16-bit sample range.
                justification: |
                  Playback and file writers need 16-bit PCM.
                tests:
                  - AudioClip_ToPcm16_ScalesWithRounding
                  - AudioClip_DerivedMembers_Pcm16Conversion

              - id: Speech-Audio-AudioClip-ToPcm16Clamping
                title: >-
                  The AudioClip record shall clamp out-of-range samples to the 16-bit range when
                  converting to PCM and convert NaN to zero.
                justification: |
                  Out-of-range or invalid samples must not overflow or produce arbitrary PCM values.
                tests:
                  - AudioClip_ToPcm16_ClampsOutOfRangeSamples
                  - AudioClip_DerivedMembers_Pcm16Conversion

              - id: Speech-Audio-AudioClip-ValidatesInput
                title: >-
                  The AudioClip record shall reject null samples with ArgumentNullException, both at
                  construction and in with-expressions.
                justification: |
                  A null sample array would fail later, far from the mistake.
                tests:
                  - AudioClip_InvalidValues_NullSamples_Throws
                  - AudioClip_InvalidValues_WithNullSamples_Throws

              - id: Speech-Audio-AudioClip-ValidatesRateAndChannels
                title: >-
                  The AudioClip record shall reject a non-positive sample rate or channel count with
                  ArgumentOutOfRangeException, both at construction and in with-expressions.
                justification: |
                  A zero rate or channel count would divide by zero in Duration and the down-mix.
                tests:
                  - AudioClip_InvalidValues_SampleRate_Throws
                  - AudioClip_InvalidValues_ChannelCount_Throws
                  - AudioClip_InvalidValues_WithSampleRate_Throws
                  - AudioClip_InvalidValues_WithChannelCount_Throws
                  - AudioClip_With_ValidSampleRate_Applies

              - id: Speech-Audio-AudioClip-EmptyClip
                title: >-
                  The AudioClip record shall accept an empty sample array as a zero-duration clip.
                justification: |
                  An empty recording is valid data and must not be treated as an error.
                tests:
                  - AudioClip_EmptySamples_HasZeroDuration

              - id: Speech-Audio-AudioClip-PartialFrameTruncation
                title: >-
                  The AudioClip record shall count only whole frames when the sample count is not a
                  multiple of the channel count.
                justification: |
                  Frame count and duration must describe complete frames; a stray sample is not one.
                tests:
                  - AudioClip_NonMultipleFrameCount_TruncatesToWholeFrames

              - id: Speech-Audio-AudioClip-ToMonoIndependentCopy
                title: >-
                  The AudioClip record shall return an independent copy of the samples when
                  down-mixing a mono clip.
                justification: |
                  Callers may modify the returned array without altering the clip.
                tests:
                  - AudioClip_ToMono_MonoClip_ReturnsIndependentCopy
