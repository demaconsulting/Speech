---
# Software Unit Requirements for WavDecoder
#
# The internal unit decodes RIFF/WAVE images for AudioFileReader.

sections:
  - title: Speech Requirements
    sections:
      - title: AudioSubsystem Requirements
        sections:
          - title: WavDecoder Requirements
            requirements:
              - id: Speech-Audio-WavDecoder-Encodings
                title: >-
                  The WavDecoder class shall decode 8-bit unsigned and 16-, 24- and 32-bit signed PCM
                  WAV data, scaling integer samples to [-1, 1).
                justification: |
                  These are the integer encodings hosts commonly produce.
                tests:
                  - WavDecoder_Decode_PcmDepths_ScaleToUnitRange

              - id: Speech-Audio-WavDecoder-ExtremeValueScaling
                title: >-
                  The WavDecoder class shall map the most negative PCM value of each depth to exactly
                  -1 and keep the largest positive value below 1.
                justification: |
                  Exact scaling keeps full-scale audio within the unit range.
                tests:
                  - WavDecoder_Decode_ExtremePcmValues_ScaleAsExpected
                  - WavDecoder_Decode_EightBitExtremes_ScaleAsExpected

              - id: Speech-Audio-WavDecoder-FloatPassThrough
                title: >-
                  The WavDecoder class shall decode 32-bit float WAV data, passing float samples,
                  including NaN, through unchanged.
                justification: |
                  Float audio is already in the unit range; altering it would corrupt the signal.
                tests:
                  - WavDecoder_Decode_Float32_PassesThrough
                  - WavDecoder_Decode_FloatNaN_PassesThroughUnchanged

              - id: Speech-Audio-WavDecoder-HeaderTolerance
                title: >-
                  The WavDecoder class shall skip unknown chunks and pad odd-sized chunks while
                  walking the chunk list.
                justification: |
                  Encoders in the wild write extra chunks; tolerating them avoids needless failures
                  on files that are otherwise valid.
                tests:
                  - WavDecoder_Decode_ExtensibleWithExtraChunks_Decodes

              - id: Speech-Audio-WavDecoder-DuplicateFmtLastWins
                title: >-
                  The WavDecoder class shall use the last fmt chunk that precedes the data chunk when
                  several are present.
                justification: |
                  A deterministic rule avoids ambiguity for the rare files that repeat the chunk.
                tests:
                  - WavDecoder_Decode_DuplicateFmtChunks_LastOneWins

              - id: Speech-Audio-WavDecoder-ExtensibleFormat
                title: >-
                  The WavDecoder class shall decode the WAVE_FORMAT_EXTENSIBLE form using the tag of its
                  sub-format (PCM or float).
                justification: |
                  Multichannel and high-resolution encoders commonly write the extensible header.
                tests:
                  - WavDecoder_Decode_ExtensibleWithExtraChunks_Decodes
                  - WavDecoder_Decode_ExtensibleFloatSubFormat_DecodesAsFloat

              - id: Speech-Audio-WavDecoder-ExtensibleUnsupportedRejection
                title: >-
                  The WavDecoder class shall reject an unsupported extensible sub-format or bit depth
                  with NotSupportedException.
                justification: |
                  A clearly typed failure lets callers distinguish an unsupported encoding from a
                  damaged file.
                tests:
                  - WavDecoder_Decode_ExtensibleUnsupportedEncoding_Throws

              - id: Speech-Audio-WavDecoder-OverstatedDataSize
                title: >-
                  The WavDecoder class shall clamp an overstated data chunk size, including 0xFFFFFFFF, to
                  the bytes actually present.
                justification: |
                  Streaming and interrupted encoders write inexact sizes; clamping avoids needless
                  failures on files that are otherwise valid.
                tests:
                  - WavDecoder_Decode_OverstatedDataSize_IsClamped
                  - WavDecoder_Decode_MaxDataSize_IsClampedToBytesPresent

              - id: Speech-Audio-WavDecoder-TrailingPartialFrame
                title: >-
                  The WavDecoder class shall drop a trailing partial frame.
                justification: |
                  A ragged final frame cannot be interpreted and must not shift later frames or fail the decode.
                tests:
                  - WavDecoder_Decode_TrailingPartialFrame_IsDropped
                  - WavDecoder_Decode_OverstatedDataSize_IsClamped

              - id: Speech-Audio-WavDecoder-ZeroLengthData
                title: >-
                  The WavDecoder class shall decode a zero-length data chunk to an empty clip.
                justification: |
                  An empty recording is valid input and must not be treated as damaged.
                tests:
                  - WavDecoder_Decode_ZeroLengthData_YieldsEmptyClip

              - id: Speech-Audio-WavDecoder-MultichannelOrder
                title: >-
                  The WavDecoder class shall keep multichannel samples interleaved in the channel order
                  stored in the file and report the file's channel count.
                justification: |
                  Down-mixing and channel-specific processing assume frame-major interleaved order.
                tests:
                  - WavDecoder_Decode_TwentyFourBitStereo_KeepsChannelOrder

              - id: Speech-Audio-WavDecoder-UnsupportedEncodingRejection
                title: >-
                  The WavDecoder class shall reject an unsupported format tag or bit depth with
                  NotSupportedException.
                justification: |
                  A clearly typed failure lets callers distinguish an unsupported encoding from a
                  damaged file.
                tests:
                  - WavDecoder_Decode_UnsupportedEncoding_Throws

              - id: Speech-Audio-WavDecoder-MalformedChunkRejection
                title: >-
                  The WavDecoder class shall reject an image with no data chunk, or with a data chunk
                  before the fmt chunk, with InvalidDataException.
                justification: |
                  Hostile or damaged files must fail clearly rather than decode garbage.
                tests:
                  - WavDecoder_Decode_MalformedImages_Throw
                  - WavDecoder_Decode_ChunkRunsPastEnd_ReportsNoDataChunk

              - id: Speech-Audio-WavDecoder-TruncatedImageRejection
                title: >-
                  The WavDecoder class shall reject a truncated fmt or extensible fmt chunk with
                  InvalidDataException.
                justification: |
                  A cut-off file must fail clearly rather than decode garbage.
                tests:
                  - WavDecoder_Decode_MalformedImages_Throw

              - id: Speech-Audio-WavDecoder-InvalidFormatFieldRejection
                title: >-
                  The WavDecoder class shall reject an image with zero channels or a zero sample rate
                  with InvalidDataException.
                justification: |
                  Such a header cannot describe playable audio and must fail clearly.
                tests:
                  - WavDecoder_Decode_MalformedImages_Throw

              - id: Speech-Audio-WavDecoder-SampleRateRangeRejection
                title: >-
                  The WavDecoder class shall reject a sample rate above the 32-bit signed range with
                  InvalidDataException and a message naming the rate.
                justification: |
                  Such a rate cannot be represented by AudioClip, and the message must not blame a
                  missing rate.
                tests:
                  - WavDecoder_Decode_SampleRateAboveIntMax_Throws

              - id: Speech-Audio-WavDecoder-NonWavRejection
                title: >-
                  The WavDecoder class shall reject data that lacks a RIFF/WAVE header, including data
                  shorter than the 12-byte header, with InvalidDataException.
                justification: |
                  Data that is not a WAV image must fail clearly rather than decode garbage.
                tests:
                  - WavDecoder_Decode_NonWavHeader_Throws
                  - WavDecoder_Decode_ImageShorterThanHeader_Throws

              - id: Speech-Audio-WavDecoder-SampleCap
                title: >-
                  The WavDecoder class shall reject an image holding more samples than the configured
                  maximum with InvalidDataException, accepting exactly the maximum.
                justification: |
                  A bounded decode cost protects hosts from oversized or hostile files.
                tests:
                  - WavDecoder_Decode_ExceedsMaxSamples_Throws
                  - WavDecoder_Decode_ExactSampleCap_IsAcceptedAndOneUnderIsRejected
