---
# Software Subsystem Requirements for the SpeechCli RecognitionCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one speech-to-text subcommand
# (recognize), decomposing the system-level dispatch requirements in docs/reqstream/speech-cli.yaml.
#
# The recognition-engine loading seam requirement lives with the ModelCommandsSubsystem
# requirements (SpeechCli-ModelCommands-RecognitionSeamExtension).

sections:
  - title: SpeechCli Requirements
    sections:
      - title: RecognitionCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-RecognitionCommands-Recognize
            title: >-
              The tool shall stream speech-to-text results from exactly one of a pre-recorded
              mono WAV file (`--input <wav-path>`) or a real microphone (`--mic`), through a
              known, downloaded recognition model named by `--stt-model <id>`, when invoked with
              `recognize`, rejecting a missing `--stt-model`, an unknown/wrong-role/not-downloaded
              model id, or a conflicting/missing input source with a clean, actionable,
              non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              An operator or script needs one command that turns either a WAV file or a live
              microphone into recognized text without needing to know which library types compose
              a recognizer. Input-source mutual exclusion and model validation must fail
              predictably and with an actionable next step (`list-models`, `list-models --role
              stt`, or `download <modelId>`) so a scripted invocation can react to the specific
              failure rather than a generic error.
            tests:
              - RecognizeCommand_ParseArguments_MissingModel_ThrowsArgumentException
              - RecognizeCommand_ParseArguments_InputFlag_ParsesInputPath
              - RecognizeCommand_ParseArguments_MicFlag_ParsesTrue
              - RecognizeCommand_ParseArguments_UnsupportedArgument_ThrowsArgumentException
              - RecognizeCommand_ParseArguments_FlagMissingValue_ThrowsArgumentException
              - RecognizeCommand_Run_InputAndMicBothGiven_ThrowsArgumentException
              - RecognizeCommand_Run_NoInputSource_ThrowsArgumentException
              - RecognizeCommand_Run_UnknownModelId_ThrowsArgumentException
              - RecognizeCommand_Run_WrongRoleModel_ThrowsArgumentException
              - RecognizeCommand_Run_NotDownloadedModel_ThrowsArgumentExceptionWithDownloadHint
              - RecognizeCommand_Run_Success_DisposesEngineAndSessionOnce
              - SpeechCli_RecognizeCommandWithoutModel_Invoked_ReturnsCleanError
              - SpeechCli_RecognizeCommandWithUnknownModel_Invoked_ReturnsCleanError
              - SpeechCli_RecognizeCommandWithWrongRoleModel_Invoked_ReturnsCleanError
              - SpeechCli_RecognizeCommandWithNotDownloadedModel_Invoked_ReturnsCleanErrorWithDownloadHint
              - SpeechCli_RecognizeCommandWithConflictingInputSources_Invoked_ReturnsCleanError
              - SpeechCli_RecognizeCommandWithRealSttModel_Invoked_ProducesNonEmptyRecognizedText
              - Program_Run_WithRecognizeCommandAndNoModel_ThrowsArgumentException

          - id: SpeechCli-RecognitionCommands-ParamValidation
            title: >-
              The tool shall accept repeatable `--stt-param key=value` flags and apply each to
              the recognition model, and shall reject a malformed token, a value outside the
              range or options that model declares, or a key that model does not declare, with a
              clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Recognition models declare tunable parameters exactly as synthesis models do (for
              example decoding beam width); validating each value against the model's declared
              parameters before recognition starts catches an operator typo immediately, with
              the same `--stt-param` semantics `speak`, `recognize`, and `ask` all share.
            tests:
              - RecognizeCommand_ParseArguments_RepeatedParamFlags_AccumulatesInOrder
              - RecognizeCommand_Run_ValidParam_ForwardsToCreateRecognizerEngine
              - RecognizeCommand_Run_InvalidParam_ThrowsArgumentException

          - id: SpeechCli-RecognitionCommands-InputFileValidation
            title: >-
              The tool shall reject an `--input` file that is not a valid WAV file, or is not
              mono 16-bit PCM, with a clear, non-zero-exit-code error naming the problem rather
              than a stack trace.
            tags: [subsystem]
            justification: |
              Recognition models require mono audio; an unsupported or corrupt input file must
              produce an actionable message instead of garbage results or a crash.
            tests:
              - RecognizeCommand_Run_InputFileIsNotWav_ThrowsInvalidOperationExceptionNamingFile
              - RecognizeCommand_Run_InputFileIsStereoWav_ThrowsInvalidOperationExceptionAboutMono

          - id: SpeechCli-RecognitionCommands-FileInputEofDrivenStop
            title: >-
              The tool shall, in `--input` mode, print every recognition result derived from the
              whole file and then end the command on its own once the file is exhausted, without
              operator interruption and without a fixed waiting period.
            tags: [subsystem]
            justification: |
              A file-input recognition session is inherently finite and must terminate on its
              own once the file is exhausted, without an operator needing to interrupt it or the
              command needing an arbitrary settle delay that would be either too short
              (truncating results) or too long (wasting time) for an unknown file duration. The
              draining and stop mechanism is described in the RecognitionCommandSubsystem design
              document.
            tests:
              - RecognizeCommand_Run_FileInput_StartsAndStopsRecognizerViaExplicitDrain
              - RecognizeCommand_Run_FileInput_PassesWavFileCaptureDeviceToCreateSession

          - id: SpeechCli-RecognitionCommands-SilenceTimeout
            title: >-
              The tool shall, in `--mic` mode, end the recognition session automatically, after
              delivering every result already produced, once no recognition result (partial or
              final) has arrived for the number of seconds given by `--silence-timeout
              <seconds>` (5 seconds when omitted) since the previous result, and shall reject a
              non-positive or malformed `--silence-timeout` with a clean error. The wait before
              the first result is governed by `--start-timeout`.
            tags: [subsystem]
            justification: |
              An unattended microphone session with no natural end-of-file signal needs an
              automatic, configurable way to end itself when the speaker has stopped talking,
              rather than requiring an operator to remain present to press `Ctrl+C`. The timer
              mechanism is described in the RecognitionCommandSubsystem design document.
            tests:
              - RecognizeCommand_ParseArguments_SilenceTimeoutFlag_ParsesSeconds
              - RecognizeCommand_ParseArguments_NonPositiveSilenceTimeout_ThrowsArgumentException
              - RecognizeCommand_ParseArguments_MalformedSilenceTimeout_ThrowsArgumentException
              - SilenceTimeoutRecognizerSession_Construct_NullSession_ThrowsArgumentNullException
              - SilenceTimeoutRecognizerSession_Construct_NonPositiveIdleTimeout_ThrowsArgumentOutOfRangeException
              - SilenceTimeoutRecognizerSession_Construct_NullTimeProvider_DoesNotThrow
              - SilenceTimeoutRecognizerSession_GetResultsAsync_TimeoutBeforeAnyResult_StopsSessionAndRaisesTimedOutOnce
              - SilenceTimeoutRecognizerSession_GetResultsAsync_TimeoutAfterResult_StopsSessionAndRaisesTimedOutOnce
              - SilenceTimeoutRecognizerSession_GetResultsAsync_CancellationRequested_PropagatesOperationCanceledException

          - id: SpeechCli-RecognitionCommands-StartTimeout
            title: >-
              The tool shall, in `--mic` mode, end the recognition session automatically when no
              recognition result has arrived within the number of seconds given by the optional
              `--start-timeout <seconds>` (8 seconds when omitted) after listening begins,
              independently of `--silence-timeout`, which governs only the gaps after the first
              result, and shall reject a non-positive or malformed `--start-timeout` with a
              clean error.
            tags: [subsystem]
            justification: |
              A grace period for a user to begin speaking is typically much longer than the
              brief pause used to detect the end of an utterance; conflating the two into one
              `--silence-timeout` value forces an operator to choose between a session that
              gives up too quickly on a slow starter or one that lingers too long after the user
              has actually stopped talking. A fixed default keeps the start window independent
              of whatever silence timeout an operator chooses.
            tests:
              - RecognizeCommand_ParseArguments_StartTimeoutFlag_ParsesSeconds
              - RecognizeCommand_ParseArguments_StartTimeoutOmitted_DefaultsToNull
              - RecognizeCommand_ParseArguments_NonPositiveStartTimeout_ThrowsArgumentException
              - RecognizeCommand_ParseArguments_MalformedStartTimeout_ThrowsArgumentException
              - RecognizeCommand_Run_StartTimeoutOmitted_ResolvesToFixedEightSecondDefault
              - RecognizeCommand_Run_SilenceTimeoutOmitted_ResolvesToFixedFiveSecondDefault
              - RecognizeCommand_Run_StartTimeoutGiven_ResolvesToGivenValue
              - SilenceTimeoutRecognizerSession_Construct_NonPositiveStartTimeout_ThrowsArgumentOutOfRangeException
              - SilenceTimeoutRecognizerSession_GetResultsAsync_StartTimeoutOmitted_ArmsTimerWithIdleTimeout
              - SilenceTimeoutRecognizerSession_GetResultsAsync_StartTimeoutGiven_ArmsTimerWithStartTimeout
              - SilenceTimeoutRecognizerSession_GetResultsAsync_FirstResultReceived_ReArmsWithIdleTimeoutNotStartTimeout
              - SilenceTimeoutRecognizerSession_GetResultsAsync_SecondResultReceived_StaysOnIdleTimeout

          - id: SpeechCli-RecognitionCommands-VerbosityAndOutput
            title: >-
              The tool shall, by default, print both interim and final recognition results, an
              interim result overwritten in place and a final result settled on its own line.
            tags: [subsystem]
            justification: |
              A live console benefits from seeing an evolving interim hypothesis as well as the
              settled transcript.
            tests:
              - RecognizeCommand_ParseArguments_InterimAndFinalOnlyFlags_ParseTrue
              - RecognizeCommand_Run_DefaultVerbosity_PrintsBothInterimAndFinal
              - RecognizeCommand_Run_ShrinkingInterimSequence_DoesNotLeaveStaleCharacters

          - id: SpeechCli-RecognitionCommands-InterimOnly
            title: >-
              The tool shall print only interim recognition results when `--interim` is given.
            tags: [subsystem]
            justification: |
              An operator watching live feedback may not want settled lines interleaved with it.
            tests:
              - RecognizeCommand_Run_Interim_SuppressesFinalSettleConsoleOutput

          - id: SpeechCli-RecognitionCommands-FinalOnly
            title: >-
              The tool shall print only final recognition results when `--final-only` is given.
            tags: [subsystem]
            justification: |
              A scripted consumer of the console output needs the settled transcript without
              never-finalized partial guesses.
            tests:
              - RecognizeCommand_Run_FinalOnly_SuppressesInterimConsoleOutput

          - id: SpeechCli-RecognitionCommands-VerbosityConflict
            title: >-
              The tool shall reject `recognize` invoked with both `--interim` and `--final-only`
              with a clear, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              The two flags select contradictory output; failing fast avoids silently picking one.
            tests:
              - RecognizeCommand_Run_InterimAndFinalOnlyBothGiven_ThrowsArgumentException

          - id: SpeechCli-RecognitionCommands-OutputText
            title: >-
              The tool shall, given `--output-text <text-path>`, write only final results to the
              file, one per line, overwriting any prior file content, regardless of the console
              verbosity flags' effect on console output.
            tags: [subsystem]
            justification: |
              A scripted consumer of `--output-text` needs a stable, append-free record of only
              the settled, final transcript, independent of how verbose the console output is.
            tests:
              - RecognizeCommand_ParseArguments_OutputFlag_ParsesOutputPath
              - RecognizeCommand_Run_Output_WritesOnlyFinalResultsOverwritingPriorContent

          - id: SpeechCli-RecognitionCommands-DeviceDispatch
            title: >-
              The tool shall, in `--mic` mode, resolve and validate a real capture device
              (honoring `--capture-device` when given), rejecting an unknown device name or an
              unavailable resolved device with a clean, non-zero-exit-code error rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              Validating an unknown/unavailable real capture device before any recognition is
              attempted avoids a partially-run, undeliverable session, mirroring `devices test`'s
              and `speak`'s own validate-before-create pattern.
            tests:
              - RecognizeCommand_Run_UnknownDevice_ThrowsArgumentException
              - RecognizeCommand_Run_NoCaptureDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-RecognitionCommands-NullGuards
            title: >-
              The RecognitionCommandSubsystem shall reject a missing context, catalog, factory, or
              argument list immediately with `ArgumentNullException`, so a programming error is
              never silently ignored.
            tags: [subsystem]
            justification: |
              Consistent with every other subsystem in this tool, a missing required dependency
              must fail immediately and specifically rather than surface later as a confusing
              `NullReferenceException` deep inside recognition or device resolution logic.
            tests:
              - RecognizeCommand_Run_NullContext_ThrowsArgumentNullException
              - RecognizeCommand_Run_NullCatalog_ThrowsArgumentNullException
              - RecognizeCommand_Run_NullFactory_ThrowsArgumentNullException
              - RecognizeCommand_ParseArguments_NullArgs_ThrowsArgumentNullException
