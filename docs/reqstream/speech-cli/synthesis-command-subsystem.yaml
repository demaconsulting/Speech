---
# Software Subsystem Requirements for the SpeechCli SynthesisCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one text-to-speech subcommand
# (speak), decomposing the system-level dispatch requirements in docs/reqstream/speech-cli.yaml.
#
# Unit-level content lives in per-unit files under
# docs/reqstream/speech-cli/synthesis-command-subsystem/ - one per unit:
# speak-command.yaml (SpeakCommand),
# parameter-bag-parser.yaml (ParameterBagParser),
# i-cli-playback-device-source.yaml (ICliPlaybackDeviceSource) and
# audio-device-factory-playback-device-source.yaml (AudioDeviceFactoryPlaybackDeviceSource).
#
# The requirements below are the subsystem's own behavior: the command running end to end, and the
# parameter parser serving every command that accepts typed model parameters.
#
# The behavior that loads a synthesis engine and sizes the WAV output from a model's preferred
# audio format lives with the ModelCommandsSubsystem requirements
# (SpeechCli-ModelCommands-SynthesisSeamExtension).

sections:
  - title: SpeechCli Requirements
    sections:
      - title: SynthesisCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-SynthesisCommands-Speak
            title: >-
              The tool shall synthesize the text given by `--text <string>` when invoked with
              `speak`.
            tags: [subsystem]
            justification: |
              An operator or script needs one command that turns arbitrary text into speech
              without needing to know which library types compose a synthesizer.
            tests:
              - SpeakCommand_RunAsync_TextFlag_SynthesizesText
              - SpeakCommand_RunAsync_Success_DisposesEngineAndSessionOnce

          - id: SpeechCli-SynthesisCommands-SpeakFile
            title: >-
              The tool shall synthesize the contents of the file named by `--file <path>` when
              invoked with `speak`.
            tags: [subsystem]
            justification: |
              Long passages are easier to keep in a file than on a command line.
            tests:
              - SpeakCommand_RunAsync_ReadableFile_SynthesizesFileContents

          - id: SpeechCli-SynthesisCommands-SpeakStdin
            title: >-
              The tool shall synthesize text piped to standard input when invoked with `speak`
              and neither `--text` nor `--file`.
            tags: [subsystem]
            justification: |
              A script needs to feed generated text to speech through a pipe.
            tests:
              - SpeakCommand_RunAsync_RedirectedStdin_SynthesizesPipedText

          - id: SpeechCli-SynthesisCommands-SpeakKnownModel
            title: >-
              The tool shall refuse to synthesize, naming the model, when invoked with `speak`
              and a `--tts-model <id>` that is not a known, downloaded synthesis model.
            tags: [subsystem]
            justification: |
              Speech from an unknown or missing model cannot be produced, so the operator needs
              to be told which model id is unusable.
            tests:
              - SpeakCommand_RunAsync_UnknownModelId_ThrowsArgumentException
              - SpeakCommand_RunAsync_WrongRoleModel_ThrowsArgumentException
              - SpeakCommand_RunAsync_NotDownloadedModel_ThrowsArgumentExceptionWithDownloadHint

          - id: SpeechCli-SynthesisCommands-ParamFlagNameReported
            title: >-
              The tool shall name the flag the operator used (`--tts-param` for `speak`,
              `--stt-param` for `recognize`) in every error it reports for a malformed or
              undeclared model parameter.
            tags: [subsystem]
            justification: |
              The same parameter handling serves the synthesis and recognition commands, so an
              operator needs the error to point at the flag they actually typed in order to
              correct it.
            tests:
              - ParameterBagParser_ParseToken_NoSeparator_ThrowsArgumentException
              - ParameterBagParser_Resolve_UnrecognizedKey_ThrowsArgumentException
