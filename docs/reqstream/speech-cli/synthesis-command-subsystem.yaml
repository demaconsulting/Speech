---
# Software Subsystem Requirements for the SpeechCli SynthesisCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one text-to-speech subcommand
# (speak), decomposing the system-level dispatch requirements in docs/reqstream/speech-cli.yaml.
#
# The behavior that loads a synthesis engine and sizes the WAV output from a model's preferred
# audio format lives with the ModelCommandsSubsystem requirements
# (SpeechCli-ModelCommands-SynthesisSeamExtension).

sections:
  - title: SpeechCli Requirements
    sections:
      - title: SynthesisCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-SynthesisCommands-Speak
            title: >-
              The tool shall synthesize speech from text supplied via `--text <string>`,
              `--file <path>`, or piped stdin, through a known, downloaded synthesis model named
              by `--tts-model <id>`, when invoked with `speak`.
            tags: [subsystem]
            justification: |
              An operator or script needs one command that turns arbitrary text into speech
              without needing to know which library types compose a synthesizer.
            tests:
              - SpeakCommand_ParseArguments_TextFlag_ParsesText
              - SpeakCommand_RunAsync_Success_DisposesEngineAndSessionOnce

          - id: SpeechCli-SynthesisCommands-ModelValidation
            title: >-
              The tool shall reject `speak` invoked without `--tts-model`, or with an unknown,
              wrong-role, or not-downloaded model id, with a clean, actionable,
              non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Model validation must fail predictably and with an actionable next step
              (`list-models`, `list-models --role tts`, or `download <modelId>`) so a scripted
              invocation can react to the specific failure rather than a generic error.
            tests:
              - SpeakCommand_ParseArguments_MissingModel_ThrowsArgumentException
              - SpeakCommand_RunAsync_UnknownModelId_ThrowsArgumentException
              - SpeakCommand_RunAsync_WrongRoleModel_ThrowsArgumentException
              - SpeakCommand_RunAsync_NotDownloadedModel_ThrowsArgumentExceptionWithDownloadHint
              - SpeechCli_SpeakCommandWithoutModel_Invoked_ReturnsCleanError
              - SpeechCli_SpeakCommandWithUnknownModel_Invoked_ReturnsCleanError
              - SpeechCli_SpeakCommandWithWrongRoleModel_Invoked_ReturnsCleanError
              - SpeechCli_SpeakCommandWithNotDownloadedModel_Invoked_ReturnsCleanErrorWithDownloadHint
              - Program_Run_WithSpeakCommandAndNoModel_ThrowsArgumentException

          - id: SpeechCli-SynthesisCommands-TextSourceValidation
            title: >-
              The tool shall reject `speak` invoked with more than one of `--text`, `--file`, and
              piped stdin, or with none of them, with a clean, actionable, non-zero-exit-code
              error rather than a stack trace.
            tags: [subsystem]
            justification: |
              An ambiguous or missing text source must fail predictably so a scripted invocation
              never speaks the wrong text or waits on input that never arrives.
            tests:
              - SpeakCommand_RunAsync_TextAndFileBothGiven_ThrowsArgumentException
              - SpeakCommand_RunAsync_NoTextSourceAndStdinNotRedirected_ThrowsArgumentException
              - SpeechCli_SpeakCommandWithConflictingTextSources_Invoked_ReturnsCleanError

          - id: SpeechCli-SynthesisCommands-ArgumentValidation
            title: >-
              The tool shall reject `speak` invoked with an unsupported argument, or a flag
              missing its value, with a clean, non-zero-exit-code error rather than a stack
              trace.
            tags: [subsystem]
            justification: |
              A mistyped option must fail predictably rather than being silently ignored.
            tests:
              - SpeakCommand_ParseArguments_UnsupportedArgument_ThrowsArgumentException
              - SpeakCommand_ParseArguments_FlagMissingValue_ThrowsArgumentException

          - id: SpeechCli-SynthesisCommands-ParamValidation
            title: >-
              The tool shall accept repeatable `--tts-param key=value` flags and apply each to
              the synthesis model, resolving a numeric value to a number, a choice value to one
              of the model's options, and a `true`/`false` value to a boolean.
            tags: [subsystem]
            justification: |
              Every synthesis model declares its own tunable parameters with its own valid
              ranges and options; resolving `--tts-param` against that declared set before
              synthesis starts gives the model correctly typed values.
            tests:
              - ParameterBagParser_ParseToken_WellFormedToken_SplitsKeyAndValue
              - ParameterBagParser_ParseToken_EmptyValueHalf_ReturnsEmptyValue
              - ParameterBagParser_Resolve_NumericInRange_ResolvesBoxedDouble
              - ParameterBagParser_Resolve_IntegerParameterWholeValue_ResolvesBoxedDouble
              - ParameterBagParser_Resolve_ValidChoiceValue_ResolvesBoxedString
              - ParameterBagParser_Resolve_ValidBooleanValue_ResolvesBoxedBool
              - ParameterBagParser_Resolve_NoRawValues_ReturnsEmptyBag
              - SpeakCommand_ParseArguments_RepeatedParamFlags_AccumulatesInOrder
              - SpeakCommand_RunAsync_ValidParam_ForwardsToCreateSynthesizerEngine

          - id: SpeechCli-SynthesisCommands-ParamRejection
            title: >-
              The tool shall reject a `--tts-param` with a malformed token, a numeric value
              outside the declared range or not a whole number where the model requires one, a
              choice value the model does not offer, a boolean value other than `true`/`false`,
              or a key the model does not declare, with a clean, non-zero-exit-code error rather
              than a stack trace.
            tags: [subsystem]
            justification: |
              Validating `--tts-param` against the declared set catches an operator typo or
              out-of-range value immediately, rather than having it silently ignored or fail
              deep inside synthesis minutes into a run. An unrecognized key is deliberately
              rejected even though the library itself ignores one, since an unrecognized
              command-line value is almost always an operator mistake that should fail loudly.
            tests:
              - ParameterBagParser_ParseToken_NoSeparator_ThrowsArgumentException
              - ParameterBagParser_ParseToken_EmptyKey_ThrowsArgumentException
              - ParameterBagParser_Resolve_NumericOutOfRange_ThrowsArgumentException
              - ParameterBagParser_Resolve_NumericMalformed_ThrowsArgumentException
              - ParameterBagParser_Resolve_IntegerParameterFractionalValue_ThrowsArgumentException
              - ParameterBagParser_Resolve_InvalidChoiceValue_ThrowsArgumentException
              - ParameterBagParser_Resolve_InvalidBooleanValue_ThrowsArgumentException
              - ParameterBagParser_Resolve_UnrecognizedKey_ThrowsArgumentException
              - SpeakCommand_RunAsync_InvalidParam_ThrowsArgumentException

          - id: SpeechCli-SynthesisCommands-NoTags
            title: >-
              The tool shall unconditionally strip every Natural Language Audio Tag from the
              resolved text, keeping only its literal narration content, when `--no-tags` is
              given, regardless of the resolved model's own declared audio-tag support level.
            tags: [subsystem]
            justification: |
              An operator explicitly requesting tag stripping is asking for literal narration
              text only; a model's own native tag-support level (Native/ParameterMapped) must not
              silently override that explicit request, since the operator's own downstream use of
              the audio (e.g. a context where tag-driven expressiveness is unwanted) is the
              deciding factor, not what the model happens to support.
            tests:
              - SpeakCommand_ParseArguments_NoTagsFlag_ParsesTrue
              - SpeakCommand_RunAsync_NoTags_StripsRecognizedTagExactly
              - SpeakCommand_RunAsync_WithoutNoTags_PassesOriginalTextUnchanged

          - id: SpeechCli-SynthesisCommands-OutputDispatch
            title: >-
              The tool shall write synthesized audio to a WAV file sized from the resolved
              model's preferred audio format when `--output-audio <path>` is given, ignoring any
              `--playback-device` given alongside it.
            tags: [subsystem]
            justification: |
              `--output-audio` unambiguously indicates the operator wants a file, not real
              playback, so silently requiring the two to agree (or erroring when both are given)
              would be an unnecessary usability trap.
            tests:
              - SpeakCommand_RunAsync_Output_ConstructsWavFileDeviceFromPreferredFormat

          - id: SpeechCli-SynthesisCommands-PlaybackDeviceDispatch
            title: >-
              The tool shall, when `--output-audio` is not given, resolve and validate a real
              playback device (honoring `--playback-device` when given), rejecting an unknown
              device name or an unavailable resolved device with a clean, non-zero-exit-code
              error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Validating an unknown/unavailable real device before any synthesis is attempted
              avoids a partially-synthesized, undeliverable session.
            tests:
              - SpeakCommand_RunAsync_UnknownDevice_ThrowsArgumentException
              - SpeakCommand_RunAsync_NoPlaybackDeviceAvailable_ThrowsInvalidOperationException
              - AudioDeviceFactoryPlaybackDeviceSource_PlaybackProbe_ForwardsToFactory
              - AudioDeviceFactoryPlaybackDeviceSource_CreatePlaybackDevice_ForwardsToFactory
              - AudioDeviceFactoryPlaybackDeviceSource_NullFactory_ThrowsArgumentNullException

          - id: SpeechCli-SynthesisCommands-CancellationAndDisposal
            title: >-
              The tool shall wire `Ctrl+C` to cooperative cancellation of an in-progress `speak`
              session, reporting a cancellation as a clean message rather than an unhandled
              exception.
            tags: [subsystem]
            justification: |
              A long-running synthesis session must be interruptible without corrupting a
              partially-written output file or leaving native resources open.
            tests:
              - SpeakCommand_RunAsync_Canceled_ReportsErrorCleanly

          - id: SpeechCli-SynthesisCommands-Disposal
            title: >-
              The tool shall dispose the synthesizer before the playback device in every case
              (success, failure, or cancellation) of a `speak` session.
            tags: [subsystem]
            justification: |
              Disposing the synthesizer first guarantees any in-flight playback/write has
              genuinely quiesced before the underlying device is released, mirroring the
              ordering `DownloadCommand` already established for its own cancellation handling.
            tests:
              - SpeakCommand_RunAsync_Success_DisposesEngineAndSessionOnce
