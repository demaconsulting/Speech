---
# Software Subsystem Requirements for the SpeechCli ConversationCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one voice-conversation subcommand (ask),
# decomposing the system-level dispatch requirements in docs/reqstream/speech-cli.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-cli/conversation-command-subsystem/ -
# one per independently testable unit:
# ask-command.yaml (AskCommand),
# i-cli-capture-device-source.yaml (ICliCaptureDeviceSource), and
# audio-device-factory-capture-device-source.yaml (AudioDeviceFactoryCaptureDeviceSource).
#
# The requirements below are the subsystem's own behavior: a complete speak-then-listen turn running end to end
# with a caller-supplied capture device and no audio hardware, and an honest unavailable report when the default
# capture device does not exist.

sections:
  - title: SpeechCli Requirements
    sections:
      - title: ConversationCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-ConversationCommands-CaptureDeviceSeam
            title: >-
              The ConversationCommandSubsystem shall use a caller-supplied capture device for the reply, so a
              complete speak-then-listen turn runs end to end with no audio hardware.
            justification: |
              Real capture hardware is absent on build agents, so a turn that only worked with a real device
              could not be verified there. Accepting a caller-supplied device keeps the whole turn verifiable
              everywhere.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-DefaultCaptureDeviceUnavailable
            title: >-
              The ConversationCommandSubsystem shall report an unavailable capture device, without crashing,
              when the default capture device is requested and the machine has no capture devices.
            justification: |
              Operators on a machine without a microphone must get a clear explanation rather than a crash or
              a hang.
            tests:
              - AskCommand_Run_NoCaptureDeviceAvailable_ThrowsInvalidOperationException
              - AudioDeviceFactoryCaptureDeviceSource_CreateCaptureDevice_DefaultWithNoDevices_ReturnsUnavailableDevice
