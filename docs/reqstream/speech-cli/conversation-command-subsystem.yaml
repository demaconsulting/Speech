---
# Software Subsystem Requirements for the SpeechCli ConversationCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one voice-conversation
# subcommand (ask), decomposing the system-level dispatch requirements in
# docs/reqstream/speech-cli.yaml.
#
# This subsystem reuses the speech-synthesis engine loading of SynthesisCommandSubsystem and the
# speech-recognition engine loading of RecognitionCommandSubsystem exactly as speak and recognize
# already do individually, since ask requires exactly one synthesis-role model and exactly one
# recognition-role model, never a single model serving both roles.

sections:
  - title: SpeechCli Requirements
    sections:
      - title: ConversationCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-ConversationCommands-Ask
            title: >-
              The tool shall speak prompt text (from `--text`, `--file`, or piped stdin) through a
              downloaded synthesis model named by `--tts-model <id>` when invoked with `ask`.
            tags: [subsystem]
            justification: |
              An AI agent or operator scripting a voice conversation needs one command that
              speaks a prompt without needing to reason about which library types compose a
              synthesizer.
            tests:
              - AskCommand_ParseArguments_TextFlag_ParsesText
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-AskListenAfterPrompt
            title: >-
              The tool shall, once the prompt's playback finishes, listen for a reply through a
              downloaded recognition model named by `--stt-model <id>` when invoked with `ask`.
            tags: [subsystem]
            justification: |
              An AI agent or operator needs the reply captured in the same command that spoke
              the prompt, without sequencing two separate CLI invocations.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-AskModelValidation
            title: >-
              The tool shall reject `ask` invoked without `--tts-model` or without `--stt-model`
              with a clean, non-zero-exit-code error naming the missing option rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              A missing model option must fail predictably so a scripted invocation can react to
              the specific failure rather than a generic error.
            tests:
              - AskCommand_ParseArguments_MissingTtsModel_ThrowsArgumentException
              - AskCommand_ParseArguments_MissingSttModel_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskModelUnknown
            title: >-
              The tool shall reject `ask` invoked with an unknown `--tts-model` or `--stt-model`
              id with a clean, non-zero-exit-code error suggesting `list-models` rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              An id typo must fail with an actionable next step, as it does for `speak` and
              `recognize`.
            tests:
              - AskCommand_Run_UnknownTtsModelId_ThrowsArgumentException
              - AskCommand_Run_UnknownSttModelId_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskModelWrongRole
            title: >-
              The tool shall reject `ask` invoked with a `--tts-model` that is not a synthesis
              model, or a `--stt-model` that is not a recognition model, with a clean,
              non-zero-exit-code error suggesting `list-models --role tts` or `--role stt`
              rather than a stack trace.
            tags: [subsystem]
            justification: |
              Swapping the two model ids is an easy mistake that must fail with an actionable
              next step instead of loading the wrong engine.
            tests:
              - AskCommand_Run_WrongRoleTtsModel_ThrowsArgumentException
              - AskCommand_Run_WrongRoleSttModel_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskModelNotDownloaded
            title: >-
              The tool shall reject `ask` invoked with a `--tts-model` or `--stt-model` that is
              known but not downloaded with a clean, non-zero-exit-code error suggesting
              `download <modelId>` rather than a stack trace.
            tags: [subsystem]
            justification: |
              A model that is known but absent from disk needs a different remedy than an
              unknown one, so the error must name the download step.
            tests:
              - AskCommand_Run_NotDownloadedTtsModel_ThrowsArgumentExceptionWithDownloadHint
              - AskCommand_Run_NotDownloadedSttModel_ThrowsArgumentExceptionWithDownloadHint

          - id: SpeechCli-ConversationCommands-AskTextSource
            title: >-
              The tool shall reject `ask` invoked with more than one of `--text`, `--file`, and
              piped stdin with a clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              An ambiguous prompt must fail predictably, so a scripted invocation never speaks
              the wrong text.
            tests:
              - AskCommand_Run_TextAndFileBothGiven_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskTextSourceMissing
            title: >-
              The tool shall reject `ask` invoked with none of `--text`, `--file`, and piped
              stdin with a clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              A missing prompt must fail predictably, so a scripted invocation never waits on
              input that never arrives.
            tests:
              - AskCommand_Run_NoTextSource_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskUnsupportedOptions
            title: >-
              The tool shall reject `ask` invoked with `--interim`, `--final-only`, `--no-tags`,
              `--input`, `--output-audio`, or any other unsupported argument with a clean,
              non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Rejecting flags `ask` does not support (rather than silently ignoring them) avoids
              a caller mistakenly believing an unsupported option took effect.
            tests:
              - AskCommand_ParseArguments_Interim_ThrowsArgumentException
              - AskCommand_ParseArguments_FinalOnly_ThrowsArgumentException
              - AskCommand_ParseArguments_NoTags_ThrowsArgumentException
              - AskCommand_ParseArguments_Input_ThrowsArgumentException
              - AskCommand_ParseArguments_OutputAudio_ThrowsArgumentException
              - AskCommand_ParseArguments_UnsupportedArgument_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskFlagMissingValue
            title: >-
              The tool shall reject `ask` invoked with a flag that is missing its value with a
              clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              A flag with no value is an incomplete invocation that must fail predictably rather
              than consume the next token or be ignored.
            tests:
              - AskCommand_ParseArguments_FlagMissingValue_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-ParamForwarding
            title: >-
              The tool shall accept repeatable `--tts-param key=value` and `--stt-param
              key=value` flags and apply each to the model it names.
            tags: [subsystem]
            justification: |
              Both synthesis and recognition models declare tunable parameters, with the same
              `--tts-param`/`--stt-param` semantics `speak`, `recognize`, and `ask` all share.
            tests:
              - AskCommand_ParseArguments_RepeatedParamFlags_AccumulateInOrderIndependently
              - AskCommand_Run_ValidParams_ForwardToRespectiveCreateCalls

          - id: SpeechCli-ConversationCommands-ParamRejection
            title: >-
              The tool shall reject an `ask` `--tts-param` or `--stt-param` with a malformed
              token, a value outside the range or options that model declares, or a key that
              model does not declare, with a clean, non-zero-exit-code error rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              Validating each value against the respective model's declared parameters before
              any audio is produced catches an operator typo immediately.
            tests:
              - AskCommand_Run_InvalidTtsParam_ThrowsArgumentException
              - AskCommand_Run_InvalidSttParam_ThrowsArgumentException
              - AskCommand_Run_UnknownParamKey_ThrowsArgumentException
              - AskCommand_ParseArguments_MalformedParamToken_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-ListenTermination
            title: >-
              The tool shall end its listen phase as soon as the first final recognition result
              arrives.
            tags: [subsystem]
            justification: |
              `ask` models one bounded question/answer turn, not open-ended transcription, so
              exactly one final result is always enough to end the turn.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-ListenStartTimeout
            title: >-
              The tool shall end the listen phase when no reply result arrives within the
              optional `--start-timeout <seconds>`, with the same meaning the flag has for
              `recognize --mic`.
            tags: [subsystem]
            justification: |
              A caller that opts into a start timeout needs `ask` to give up on a reply that never
              starts, consistently with `recognize --mic`.
            tests:
              - AskCommand_ParseArguments_TimeoutFlags_ParseAsPositiveDoubles

          - id: SpeechCli-ConversationCommands-ListenSilenceTimeout
            title: >-
              The tool shall end the listen phase when the gap after a result exceeds the
              optional `--silence-timeout <seconds>`, with the same meaning the flag has for
              `recognize --mic`.
            tags: [subsystem]
            justification: |
              A caller that opts into a silence timeout needs `ask` to give up on a reply that
              never finishes, consistently with `recognize --mic`.
            tests:
              - AskCommand_ParseArguments_TimeoutFlags_ParseAsPositiveDoubles
              - AskCommand_Run_SilenceTimeoutWithNoFinalResult_EndsTurnWithEmptyText

          - id: SpeechCli-ConversationCommands-ListenTimeoutDefaults
            title: >-
              The tool shall end the listen phase using `recognize --mic`'s default timeouts (5
              seconds for silence, 8 seconds for start) when `ask` is given neither
              `--start-timeout` nor `--silence-timeout`.
            tags: [subsystem]
            justification: |
              A turn must still end on its own when the operator chooses no timeouts.
            tests:
              - AskCommand_Run_NoTimeoutFlagsGiven_StillEndsTurnViaDefaultSilenceTimeout

          - id: SpeechCli-ConversationCommands-ListenTimeoutValidation
            title: >-
              The tool shall reject a non-positive or non-numeric `--silence-timeout` or
              `--start-timeout` given to `ask` with a clean, non-zero-exit-code error.
            tags: [subsystem]
            justification: |
              A zero or negative timeout would end the turn immediately, so it must fail
              predictably.
            tests:
              - AskCommand_ParseArguments_NonPositiveSilenceTimeout_ThrowsArgumentException
              - AskCommand_ParseArguments_NonPositiveStartTimeout_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-OutputStdout
            title: >-
              The tool shall print the final recognized reply text to stdout by default.
            tags: [subsystem]
            justification: |
              A scripted caller of `ask` can read the reply from the command's own output.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-OutputText
            title: >-
              The tool shall write the final recognized reply text to the file named by
              `--output-text <text-path>` instead of stdout.
            tags: [subsystem]
            justification: |
              A scripted caller of `ask` needs the same stable file destination that `recognize`
              already offers, so an agent can read the reply from a known file path.
            tests:
              - AskCommand_ParseArguments_OutputTextFlag_ParsesPath
              - AskCommand_Run_OutputText_WritesRecognizedTextToFile

          - id: SpeechCli-ConversationCommands-OutputTextOverwrite
            title: >-
              The tool shall replace any previous content of the `--output-text` file rather
              than appending to it.
            tags: [subsystem]
            justification: |
              A caller reading the file must see only the latest reply, never a mixture of
              turns.
            tests:
              - AskCommand_Run_OutputTextExistingFile_OverwritesPriorContent

          - id: SpeechCli-ConversationCommands-OutputTextEmpty
            title: >-
              The tool shall write a completely empty `--output-text` file when no recognized
              text was produced.
            tags: [subsystem]
            justification: |
              A caller reading the file can tell that the turn ended without a reply, rather
              than finding a stale file or none at all.
            tests:
              - AskCommand_Run_SilenceTimeoutWithNoFinalResult_EndsTurnWithEmptyText

          - id: SpeechCli-ConversationCommands-PlaybackDeviceUnknown
            title: >-
              The tool shall reject `ask` invoked with a `--playback-device` name that matches
              no playback device with a clean, non-zero-exit-code error rather than a stack
              trace, before any synthesis is attempted.
            tags: [subsystem]
            justification: |
              Validating an unknown real playback device before any synthesis is attempted
              avoids a partially-run, undeliverable turn, mirroring `speak`'s own
              validate-before-create pattern.
            tests:
              - AskCommand_Run_UnknownPlaybackDevice_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-DeviceUnavailable
            title: >-
              The tool shall reject `ask` with a clean, non-zero-exit-code error rather than a
              stack trace when no playback device is available, before any synthesis is
              attempted.
            tags: [subsystem]
            justification: |
              A machine with no playback device cannot deliver the prompt, so the turn must
              fail before it starts.
            tests:
              - AskCommand_Run_NoPlaybackDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-ConversationCommands-CaptureDeviceDispatch
            title: >-
              The tool shall reject `ask` invoked with a `--capture-device` name that matches no
              capture device with a clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Validating an unknown real capture device before recognition is attempted avoids
              a partially-run, undeliverable turn, mirroring `recognize`'s own
              validate-before-create pattern.
            tests:
              - AskCommand_Run_UnknownCaptureDevice_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-CaptureDeviceUnavailable
            title: >-
              The tool shall report a clean, non-zero-exit-code error rather than a stack trace
              when `ask` has no capture device available for its listen phase.
            tags: [subsystem]
            justification: |
              A machine with no capture device cannot hear the reply, so the turn must fail
              with an actionable message.
            tests:
              - AskCommand_Run_NoCaptureDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-ConversationCommands-SpeakCancellation
            title: >-
              The tool shall skip the listen phase entirely, without a crash, when `Ctrl+C` is
              pressed during the speak phase of `ask`.
            tags: [subsystem]
            justification: |
              Listening for a reply to a prompt the operator interrupted would be surprising;
              a single cooperative-cancellation path, mirroring `speak`'s own pattern, keeps
              this guarantee simple to reason about and verify.
            tests:
              - AskCommand_Run_CanceledDuringSpeak_SkipsListenPhase

          - id: SpeechCli-ConversationCommands-ListenCancellation
            title: >-
              The tool shall report a clean cancellation, print no recognized text and write no
              output file, when `Ctrl+C` is pressed at any point from the start of the listen
              phase until the reply has been delivered.
            tags: [subsystem]
            justification: |
              A half-finished reply must never be delivered as if it were complete.
            tests:
              - AskCommand_RunAsync_CtrlCDuringListen_ReportsCanceledAndDoesNotPrintText
              - AskCommand_RunAsync_CtrlCBeforeListenStarts_ReportsCanceledAndDoesNotPrintText
              - AskCommand_RunAsync_CtrlCImmediatelyAfterListenReturns_ReportsCanceledAndDoesNotPrintText
              - AskCommand_RunAsync_CtrlCImmediatelyBeforeFileWrite_ReportsCanceledAndDoesNotWriteFile

          - id: SpeechCli-ConversationCommands-ListenTimeoutIsNotCancellation
            title: >-
              The tool shall not report a cancellation when a silence timeout ends the `ask`
              turn.
            tags: [subsystem]
            justification: |
              A timeout is a normal way for a turn to end and must not be reported as an
              interruption.
            tests:
              - AskCommand_RunAsync_SilenceTimeoutWithNoCtrlC_ReportsSuccessNotCanceled

          - id: SpeechCli-ConversationCommands-Disposal
            title: >-
              The tool shall dispose the synthesizer, playback device, recognizer, and
              silence-timeout session (when present) exactly once on every exit path of `ask`.
            tags: [subsystem]
            justification: |
              A two-phase command must not leave an orphaned recognizer or a leaked audio device
              behind on success, failure, or cancellation.
            tests:
              - AskCommand_Run_CanceledDuringSpeak_SkipsListenPhase
              - AskCommand_Run_ExceptionDuringSpeak_DisposesPlaybackDeviceAndRethrows
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-PrewarmRecognizer
            title: >-
              The tool shall have the listen phase's recognizer prepared by the time the speak
              phase's playback finishes, so listening begins without a model-loading delay after
              the prompt.
            tags: [subsystem, performance]
            justification: |
              Loading a recognition model into native memory is the expensive step in
              constructing a recognition session; deferring it until playback finishes
              introduces an avoidable gap between finishing speaking and starting to listen,
              which matters for a natural-feeling voice conversation. Overlapping the load with
              the time a person spends listening to the prompt removes that gap without starting
              microphone capture early and without changing any other observable behavior, exit
              code, or error message. The concurrency strategy is described in the
              ConversationCommandSubsystem design document.
            tests:
              - AskCommand_Run_PrewarmsRecognizerConcurrentlyWithPlayback_CreatesRecognizerBeforePlaybackCompletes

          - id: SpeechCli-ConversationCommands-PrewarmFailureReporting
            title: >-
              The tool shall report a failure preparing the recognizer when the listen phase
              starts, after the prompt has been spoken, rather than losing it.
            tags: [subsystem, performance]
            justification: |
              Preparing the recognizer concurrently with playback must not skip or reorder the
              speak phase, nor swallow a setup failure.
            tests:
              - AskCommand_Run_NoCaptureDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-ConversationCommands-PrewarmCancellationRelease
            title: >-
              The tool shall release the already-prepared recognizer when cancellation lands
              during the speak phase, without delaying the cancellation.
            tags: [subsystem, performance]
            justification: |
              A recognizer loaded ahead of time must not leak when the turn is canceled before
              listening starts, and the expensive load must not delay responsiveness to
              `Ctrl+C`.
            tests:
              - AskCommand_Run_CanceledDuringSpeak_SkipsListenPhase
              - AskCommand_RunAsync_CanceledDuringSpeak_ReturnsPromptlyWithoutAwaitingInFlightPrewarm
