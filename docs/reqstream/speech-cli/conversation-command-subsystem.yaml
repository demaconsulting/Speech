---
# Software Subsystem Requirements for the SpeechCli ConversationCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one voice-conversation
# subcommand (ask), decomposing the system-level dispatch requirements in
# docs/reqstream/speech-cli.yaml.
#
# This subsystem reuses the speech-synthesis engine loading of SynthesisCommandSubsystem and the
# speech-recognition engine loading of RecognitionCommandSubsystem exactly as speak and recognize
# already do individually, since ask requires exactly one synthesis-role model and exactly one
# recognition-role model, never a single model serving both roles.

sections:
  - title: SpeechCli Requirements
    sections:
      - title: ConversationCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-ConversationCommands-Ask
            title: >-
              The tool shall speak prompt text (from `--text`, `--file`, or piped stdin) through a
              downloaded synthesis model named by `--tts-model <id>` and then, once playback
              finishes, listen for a reply through a downloaded recognition model named by
              `--stt-model <id>`, and print the final recognized result, when invoked with `ask`.
            tags: [subsystem]
            justification: |
              An AI agent or operator scripting a voice conversation needs one command that
              speaks a prompt and listens for the reply without needing to sequence two separate
              CLI invocations or reason about which library types compose a synthesizer and a
              recognizer.
            tests:
              - AskCommand_ParseArguments_TextFlag_ParsesText
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-AskModelValidation
            title: >-
              The tool shall reject `ask` invoked without `--tts-model` or `--stt-model`, or with
              an unknown, wrong-role, or not-downloaded model id for either model, with a clean,
              actionable, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Both models must be validated the same way `speak`'s and `recognize`'s own model
              resolution validates a single model, with an actionable next step (`list-models`,
              `list-models --role tts`/`--role stt`, or `download <modelId>`) so a scripted
              invocation can react to the specific failure rather than a generic error.
            tests:
              - AskCommand_ParseArguments_MissingTtsModel_ThrowsArgumentException
              - AskCommand_ParseArguments_MissingSttModel_ThrowsArgumentException
              - AskCommand_Run_UnknownTtsModelId_ThrowsArgumentException
              - AskCommand_Run_UnknownSttModelId_ThrowsArgumentException
              - AskCommand_Run_WrongRoleTtsModel_ThrowsArgumentException
              - AskCommand_Run_WrongRoleSttModel_ThrowsArgumentException
              - AskCommand_Run_NotDownloadedTtsModel_ThrowsArgumentExceptionWithDownloadHint
              - AskCommand_Run_NotDownloadedSttModel_ThrowsArgumentExceptionWithDownloadHint

          - id: SpeechCli-ConversationCommands-AskTextSource
            title: >-
              The tool shall reject `ask` invoked with more than one of `--text`, `--file`, and
              piped stdin, or with none of them, with a clean, actionable, non-zero-exit-code
              error rather than a stack trace.
            tags: [subsystem]
            justification: |
              An ambiguous or missing prompt must fail predictably, so a scripted invocation
              never speaks the wrong text or waits on input that never arrives.
            tests:
              - AskCommand_Run_TextAndFileBothGiven_ThrowsArgumentException
              - AskCommand_Run_NoTextSource_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-AskUnsupportedOptions
            title: >-
              The tool shall reject `ask` invoked with `--interim`, `--final-only`, `--no-tags`,
              `--input`, `--output-audio`, any other unsupported argument, or a flag missing its
              value, with a clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Rejecting flags `ask` does not support (rather than silently ignoring them) avoids
              a caller mistakenly believing an unsupported option took effect.
            tests:
              - AskCommand_ParseArguments_Interim_ThrowsArgumentException
              - AskCommand_ParseArguments_FinalOnly_ThrowsArgumentException
              - AskCommand_ParseArguments_NoTags_ThrowsArgumentException
              - AskCommand_ParseArguments_Input_ThrowsArgumentException
              - AskCommand_ParseArguments_OutputAudio_ThrowsArgumentException
              - AskCommand_ParseArguments_UnsupportedArgument_ThrowsArgumentException
              - AskCommand_ParseArguments_FlagMissingValue_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-ParamValidation
            title: >-
              The tool shall accept repeatable `--tts-param key=value` and `--stt-param
              key=value` flags and apply each to the model it names.
            tags: [subsystem]
            justification: |
              Both synthesis and recognition models declare tunable parameters, with the same
              `--tts-param`/`--stt-param` semantics `speak`, `recognize`, and `ask` all share.
            tests:
              - AskCommand_ParseArguments_RepeatedParamFlags_AccumulateInOrderIndependently
              - AskCommand_Run_ValidParams_ForwardToRespectiveCreateCalls

          - id: SpeechCli-ConversationCommands-ParamRejection
            title: >-
              The tool shall reject an `ask` `--tts-param` or `--stt-param` with a malformed
              token, a value outside the range or options that model declares, or a key that
              model does not declare, with a clean, non-zero-exit-code error rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              Validating each value against the respective model's declared parameters before
              any audio is produced catches an operator typo immediately.
            tests:
              - AskCommand_Run_InvalidTtsParam_ThrowsArgumentException

          - id: SpeechCli-ConversationCommands-ListenTermination
            title: >-
              The tool shall end its listen phase as soon as the first final recognition result
              arrives.
            tags: [subsystem]
            justification: |
              `ask` models one bounded question/answer turn, not open-ended transcription, so
              exactly one final result is always enough to end the turn.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-ListenTimeouts
            title: >-
              The tool shall accept optional `--start-timeout <seconds>`/`--silence-timeout
              <seconds>` flags with identical meaning and defaulting to `recognize --mic`'s own
              defaults (5 seconds for silence, 8 seconds for start), ending the listen phase as
              a safety net for a reply that never finishes or never starts.
            tags: [subsystem]
            justification: |
              Reusing `recognize --mic`'s own idle-timeout session unmodified, rather than
              reimplementing similar logic, keeps a single source of truth for the two-phase
              idle-window semantics `--start-timeout`/`--silence-timeout` already established.
            tests:
              - AskCommand_ParseArguments_TimeoutFlags_ParseAsPositiveDoubles
              - AskCommand_ParseArguments_NonPositiveSilenceTimeout_ThrowsArgumentException
              - AskCommand_Run_SilenceTimeoutWithNoFinalResult_EndsTurnWithEmptyText
              - AskCommand_Run_NoTimeoutFlagsGiven_StillEndsTurnViaDefaultSilenceTimeout

          - id: SpeechCli-ConversationCommands-OutputDispatch
            title: >-
              The tool shall print the final recognized reply text to stdout by default.
            tags: [subsystem]
            justification: |
              A scripted caller of `ask` can read the reply from the command's own output.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-OutputText
            title: >-
              The tool shall write the final recognized reply text to the file named by
              `--output-text <text-path>` instead of stdout, creating or overwriting a plain-text
              file containing just the recognized text (or a completely empty file when no
              recognized text was produced), with overwrite-not-append file semantics.
            tags: [subsystem]
            justification: |
              A scripted caller of `ask` needs the same stable file destination that `recognize`
              already offers, so an agent can read the reply from a known file path.
            tests:
              - AskCommand_ParseArguments_OutputTextFlag_ParsesPath
              - AskCommand_Run_OutputText_WritesRecognizedTextToFile

          - id: SpeechCli-ConversationCommands-DeviceDispatch
            title: >-
              The tool shall resolve and validate a real playback device (honoring
              `--playback-device` when given) for its speak phase, rejecting an unknown device
              name or an unavailable resolved device with a clean, non-zero-exit-code error
              rather than a stack trace.
            tags: [subsystem]
            justification: |
              Validating an unknown/unavailable real playback device before any synthesis is
              attempted avoids a partially-run, undeliverable turn, mirroring `speak`'s own
              validate-before-create pattern.
            tests:
              - AskCommand_Run_UnknownPlaybackDevice_ThrowsArgumentException
              - AskCommand_Run_NoPlaybackDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-ConversationCommands-CaptureDeviceDispatch
            title: >-
              The tool shall resolve and validate a real capture device (honoring
              `--capture-device` when given) for its listen phase, rejecting an unknown device
              name or an unavailable resolved device with a clean, non-zero-exit-code error
              rather than a stack trace.
            tags: [subsystem]
            justification: |
              Validating an unknown/unavailable real capture device before recognition is
              attempted avoids a partially-run, undeliverable turn, mirroring `recognize`'s own
              validate-before-create pattern.
            tests:
              - AskCommand_Run_UnknownCaptureDevice_ThrowsArgumentException
              - AskCommand_Run_NoCaptureDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-ConversationCommands-CancellationAndDisposal
            title: >-
              The tool shall cancel cleanly, with no partial recognized-text or playback state
              leaked and no crash, when `Ctrl+C` is pressed at any point during either its speak
              or listen phase, skipping the listen phase entirely when cancellation lands during
              the speak phase.
            tags: [subsystem]
            justification: |
              A two-phase command must not leave a half-played prompt or a partial result behind
              when interrupted; a single cooperative-cancellation path spanning both phases,
              mirroring `speak`'s/`recognize`'s own pattern, keeps this guarantee simple to
              reason about and verify.
            tests:
              - AskCommand_Run_CanceledDuringSpeak_SkipsListenPhase
              - AskCommand_RunAsync_CtrlCDuringListen_ReportsCanceledAndDoesNotPrintText
              - AskCommand_RunAsync_CtrlCBeforeListenStarts_ReportsCanceledAndDoesNotPrintText
              - AskCommand_RunAsync_CtrlCImmediatelyAfterListenReturns_ReportsCanceledAndDoesNotPrintText
              - AskCommand_RunAsync_CtrlCImmediatelyBeforeFileWrite_ReportsCanceledAndDoesNotWriteFile
              - AskCommand_RunAsync_SilenceTimeoutWithNoCtrlC_ReportsSuccessNotCanceled

          - id: SpeechCli-ConversationCommands-Disposal
            title: >-
              The tool shall dispose the synthesizer, playback device, recognizer, and
              silence-timeout session (when present) exactly once on every exit path of `ask`.
            tags: [subsystem]
            justification: |
              A two-phase command must not leave an orphaned recognizer or a leaked audio device
              behind on success, failure, or cancellation.
            tests:
              - AskCommand_Run_CanceledDuringSpeak_SkipsListenPhase
              - AskCommand_Run_ExceptionDuringSpeak_DisposesPlaybackDeviceAndRethrows
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult

          - id: SpeechCli-ConversationCommands-PrewarmRecognizer
            title: >-
              The tool shall have the listen phase's recognizer prepared by the time the speak
              phase's playback finishes, so listening begins without a model-loading delay after
              the prompt.
            tags: [subsystem, performance]
            justification: |
              Loading a recognition model into native memory is the expensive step in
              constructing a recognition session; deferring it until playback finishes
              introduces an avoidable gap between finishing speaking and starting to listen,
              which matters for a natural-feeling voice conversation. Overlapping the load with
              the time a person spends listening to the prompt removes that gap without starting
              microphone capture early and without changing any other observable behavior, exit
              code, or error message. The concurrency strategy is described in the
              ConversationCommandSubsystem design document.
            tests:
              - AskCommand_Run_PrewarmsRecognizerConcurrentlyWithPlayback_CreatesRecognizerBeforePlaybackCompletes

          - id: SpeechCli-ConversationCommands-PrewarmFailureReporting
            title: >-
              The tool shall report a failure preparing the recognizer when the listen phase
              starts, after the prompt has been spoken, rather than losing it.
            tags: [subsystem, performance]
            justification: |
              Preparing the recognizer concurrently with playback must not skip or reorder the
              speak phase, nor swallow a setup failure.
            tests:
              - AskCommand_Run_NoCaptureDeviceAvailable_ThrowsInvalidOperationException

          - id: SpeechCli-ConversationCommands-PrewarmCancellationRelease
            title: >-
              The tool shall release the already-prepared recognizer when cancellation lands
              during the speak phase, without delaying the cancellation.
            tags: [subsystem, performance]
            justification: |
              A recognizer loaded ahead of time must not leak when the turn is canceled before
              listening starts, and the expensive load must not delay responsiveness to
              `Ctrl+C`.
            tests:
              - AskCommand_Run_CanceledDuringSpeak_SkipsListenPhase
              - AskCommand_RunAsync_CanceledDuringSpeak_ReturnsPromptlyWithoutAwaitingInFlightPrewarm

          - id: SpeechCli-ConversationCommands-NullGuards
            title: >-
              The ConversationCommandSubsystem shall reject a missing context, catalog, device
              source, capture-device source, or argument list immediately with
              `ArgumentNullException`, so a programming error is never silently ignored.
            tags: [subsystem]
            justification: |
              Consistent with every other subsystem in this tool, a missing required dependency
              must fail immediately and specifically rather than surface later as a confusing
              `NullReferenceException` deep inside synthesis, recognition, or device resolution
              logic.
            tests:
              - AskCommand_Run_NullContext_ThrowsArgumentNullException
              - AskCommand_Run_NullCatalog_ThrowsArgumentNullException
              - AskCommand_Run_NullDeviceSource_ThrowsArgumentNullException
              - AskCommand_Run_NullCaptureSource_ThrowsArgumentNullException
              - AskCommand_ParseArguments_NullArgs_ThrowsArgumentNullException
              - AskCommand_RunAsync_NullContext_ThrowsArgumentNullException
              - AskCommand_RunAsync_NullCatalog_ThrowsArgumentNullException
              - AskCommand_RunAsync_NullDeviceSource_ThrowsArgumentNullException
              - AskCommand_RunAsync_NullCaptureSource_ThrowsArgumentNullException
              - AskCommand_RunAsync_NullStopSignal_ThrowsArgumentNullException
              - AskCommand_RunAsync_NullOnRecognizerCreated_ThrowsArgumentNullException
