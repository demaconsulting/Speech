---
# Software Subsystem Requirements for the SpeechCli ConversationCommandSubsystem
#
# These requirements describe the subsystem-level behavior of the one voice-conversation subcommand (ask),
# decomposing the system-level dispatch requirements in docs/reqstream/speech-cli.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-cli/conversation-command-subsystem/ -
# one per independently testable unit:
# ask-command.yaml (AskCommand),
# i-cli-capture-device-source.yaml (ICliCaptureDeviceSource), and
# audio-device-factory-capture-device-source.yaml (AudioDeviceFactoryCaptureDeviceSource).
#
# The requirement below is the subsystem's own behavior: a complete speak-then-listen turn, composed of the
# command and its capture-device seam, running end to end with no audio hardware, and the production seam
# resolving devices exactly as the real factory does.

sections:
  - title: SpeechCli Requirements
    sections:
      - title: ConversationCommandSubsystem Requirements
        requirements:
          - id: SpeechCli-ConversationCommands-CaptureDeviceSeam
            title: >-
              The ConversationCommandSubsystem shall resolve the capture device for the reply through its
              capture-device source, so a complete speak-then-listen turn runs end to end with a substituted
              device, while the production source resolves devices exactly as the real audio device factory
              does.
            justification: |
              The real audio device factory reports an unavailable capture device on any machine without audio
              hardware, whatever the caller injects, so a turn that only worked through it could not be
              verified on a build agent. Resolving through a substitutable source keeps the whole turn
              verifiable everywhere, and the pass-through production source guarantees the operator's real
              devices are resolved exactly as the factory resolves them.
            tests:
              - AskCommand_Run_Success_SpeaksThenListensAndPrintsFinalResult
              - AudioDeviceFactoryCaptureDeviceSource_CreateCaptureDevice_ForwardsToFactory
