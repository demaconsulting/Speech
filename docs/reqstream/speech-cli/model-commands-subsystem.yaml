---
# Software Subsystem Requirements for the SpeechCli ModelCommandsSubsystem
#
# These requirements describe the subsystem-level behavior shared by the seven model-management
# and reference-voice subcommands (list-models, model-info, download, uninstall, clean,
# list-voices, voices): that what the operator sees is exactly what the speech library reports.
# The behavior of each unit is specified in its own file in the model-commands-subsystem/ folder:
#   - model-commands-subsystem/i-cli-model-catalog.yaml
#   - model-commands-subsystem/speech-model-catalog-adapter.yaml
#   - model-commands-subsystem/cli-model-catalog-factory.yaml
#   - model-commands-subsystem/download-progress-reporter.yaml
#   - model-commands-subsystem/list-models-command.yaml
#   - model-commands-subsystem/model-info-command.yaml
#   - model-commands-subsystem/download-command.yaml
#   - model-commands-subsystem/uninstall-command.yaml
#   - model-commands-subsystem/clean-command.yaml
#   - model-commands-subsystem/list-voices-command.yaml
#   - model-commands-subsystem/voices-command.yaml
#
# The `--voices-dir` option is a global option and is therefore specified at system level
# (SpeechCli-Cli-VoicesDir).

sections:
  - title: SpeechCli Requirements
    sections:
      - title: ModelCommandsSubsystem Requirements
        requirements:
          - id: SpeechCli-ModelCommands-LibraryDelegation
            title: >-
              The tool shall report every model's identity, install state, and the outcome of
              every download, install, uninstall, and cleanup exactly as the speech library
              reports it, keeping no model state of its own between invocations.
            tags: [subsystem]
            justification: |
              The subsystem exists to expose the library's own model-management behavior from
              the command line, so what an operator sees must never diverge from what the
              library reports. The evidence is exercised through the production catalog over an
              isolated store: the known-model list, the never-installed uninstall and cleanup
              behavior, the unknown-id refusal, and the `--models-dir` composition. The
              `--models-dir` test asserts the user-voices folder and a non-empty catalog but not
              the store root itself, so that part of the evidence is partial.
            tests:
              - SpeechModelCatalogAdapter_Enumerate_ReturnsCompiledInKnownModels
              - SpeechModelCatalogAdapter_UninstallAndCleanUpLeftovers_NeverInstalledModel_DoNotThrow
              - SpeechModelCatalogAdapter_DownloadAsync_UnknownModelId_ThrowsArgumentException
              - CliModelCatalogFactory_Create_WithModelsDir_UsesGivenRoot
