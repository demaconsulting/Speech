---
# Software Subsystem Requirements for the SpeechCli ModelCommandsSubsystem
#
# These requirements describe the subsystem-level behavior of the seven model-management and
# reference-voice subcommands (list-models, model-info, download, uninstall, clean, list-voices,
# voices), decomposing the system-level dispatch requirements in docs/reqstream/speech-cli.yaml.
#
# Unit-level content is consolidated here rather than split per command: all seven commands
# share one model-catalog dependency over the library's SpeechModelCatalog/SpeechModelStore,
# and each command's own logic is a small, single-purpose argument parser plus a thin call into
# that dependency, so per-command requirement files would mostly restate this shared context.
#
# Each requirement states one observable behavior. The `--voices-dir` option is a global option
# and is therefore specified at system level (SpeechCli-Cli-VoicesDir).

sections:
  - title: SpeechCli Requirements
    sections:
      - title: ModelCommandsSubsystem Requirements
        requirements:
          - id: SpeechCli-ModelCommands-ListModels
            title: >-
              The tool shall list every known model's id, display name, role, install state, and
              license name when invoked with `list-models`, optionally filtered to one role
              (`--role tts`/`stt`) and/or one install-state group (`--state downloaded`/
              `missing`), and shall print either an aligned table (default) or a JSON array
              (`--format json`).
            tags: [subsystem]
            justification: |
              An operator or script needs to discover which models exist, which are already
              installed, and which still need to be downloaded, without inspecting the
              model-store directory by hand. A machine-parseable JSON form lets a script make
              the same decision without scraping table formatting.
            tests:
              - ListModelsCommand_Run_NoFilters_ListsEveryModelAsTable
              - ListModelsCommand_Run_RoleFilterTts_ListsOnlySynthesisModels
              - ListModelsCommand_Run_StateFilterDownloaded_ListsOnlyDownloadedModels
              - ListModelsCommand_Run_StateFilterMissing_ListsOnlyMissingModels
              - ListModelsCommand_Run_FormatJson_EmitsJsonArray
              - ListModelsCommand_Run_EmptyCatalog_PrintsNoModelsMessage
              - SpeechCli_ListModelsCommand_Invoked_ListsKnownModelsAsTable
              - SpeechCli_ListModelsCommandWithJsonFormat_Invoked_EmitsJsonArray

          - id: SpeechCli-ModelCommands-ModelInfo
            title: >-
              The tool shall print a model's full identity (id, display name, role, install
              state, license name and URL, audio-tag support) and every one of its parameters
              (with min/max/step/default for a numeric parameter, options/default for a choice
              parameter, or default for a boolean parameter) when invoked with
              `model-info <modelId>`, and shall reject an unrecognized model id with a clear,
              non-zero-exit-code error naming the id and suggesting `list-models`, rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              An operator deciding whether a model is suitable (e.g. its voice choices, its
              license) needs its full parameter surface, not just its name. An id typo is a
              certainty in interactive use, so it must fail predictably rather than crash.
            tests:
              - ModelInfoCommand_Run_KnownModel_PrintsIdentityAndState
              - ModelInfoCommand_Run_NumericParameter_PrintsBounds
              - ModelInfoCommand_Run_ChoiceParameter_PrintsOptions
              - ModelInfoCommand_Run_BooleanParameter_PrintsDefault
              - ModelInfoCommand_Run_UnknownModelId_ThrowsArgumentException
              - SpeechCli_ModelInfoCommandWithUnknownId_Invoked_ReturnsCleanError
              - SpeechCli_ModelInfoCommandWithMissingArgument_Invoked_ReturnsCleanError

          - id: SpeechCli-ModelCommands-Download
            title: >-
              The tool shall download, verify, and install one or more models given by id when
              invoked with `download <modelId> [<modelId>...]`, in the order given, reporting
              live progress for the in-progress model.
            tags: [subsystem]
            justification: |
              An operator cannot use any speech capability without a model on disk, and a large
              download needs visible progress so the operator can tell it is working.
            tests:
              - DownloadCommand_RunAsync_SingleModel_Succeeds_ReportsInstalled
              - DownloadCommand_RunAsync_MultipleModels_DownloadsEachSequentially
              - DownloadCommand_RunAsync_ReportsProgress_WritesPercentLine
              - DownloadProgressReporter_Create_KnownTotal_PrintsOneLinePerWholePercent
              - DownloadProgressReporter_Create_UnknownTotal_ReportsKilobytes

          - id: SpeechCli-ModelCommands-DownloadContinueOnFailure
            title: >-
              The tool shall attempt every model requested by `download` even when an earlier
              one fails, and shall exit non-zero if any requested model's download fails.
            tags: [subsystem]
            justification: |
              A single failed model (checksum mismatch, network fault, unknown id) in a
              multi-model request must not silently abandon the remaining requested models, so a
              script requesting several models learns the true outcome of every one of them
              rather than stopping at the first failure.
            tests:
              - DownloadCommand_RunAsync_ChecksumMismatch_ReportsErrorAndContinues
              - DownloadCommand_RunAsync_UnknownModelId_ReportsErrorAndContinues
              - SpeechCli_DownloadCommandWithUnknownId_Invoked_ReturnsNonZeroExitCode

          - id: SpeechCli-ModelCommands-DownloadForce
            title: >-
              The tool shall uninstall an already-downloaded model before downloading it again
              when `download` is given `--force`, and shall not uninstall a model that is not
              downloaded.
            tags: [subsystem]
            justification: |
              `--force` gives an operator a way to recover from a suspected-corrupt local copy
              without manually deleting files, and must never remove anything when there is
              nothing to replace.
            tests:
              - DownloadCommand_RunAsync_ForceOnDownloadedModel_UninstallsFirst
              - DownloadCommand_RunAsync_ForceOnMissingModel_DoesNotUninstall

          - id: SpeechCli-ModelCommands-DownloadArgumentValidation
            title: >-
              The tool shall reject a `download` invocation that names no model id, or that
              carries an unsupported flag, with a clear, non-zero-exit-code error rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              A mistyped or incomplete download command must fail predictably so a script can
              detect it, instead of silently downloading nothing.
            tests:
              - DownloadCommand_RunAsync_NoModelIds_ThrowsArgumentException
              - DownloadCommand_RunAsync_UnsupportedFlag_ThrowsArgumentException
              - SpeechCli_DownloadCommandWithMissingArgument_Invoked_ReturnsCleanError

          - id: SpeechCli-ModelCommands-DownloadCancellation
            title: >-
              The tool shall stop the remaining `download` batch, without attempting further
              requested models, when the operator interrupts the process (`Ctrl+C`), reporting
              which model was in progress when canceled.
            tags: [subsystem]
            justification: |
              A large multi-model download can take a long time; an operator who interrupts it
              is asking the whole operation to stop, not just the current file, so continuing to
              attempt further models after a deliberate interruption would be surprising and
              wasteful.
            tests:
              - DownloadCommand_RunAsync_CanceledBeforeStart_ReportsErrorAndStopsBatch
              - DownloadCommand_RunAsync_Canceled_ReportsErrorAndStopsBatch
              - ConsoleCancellation_Register_Raise_CancelsSourceRunsCallbackAndSuppressesTermination
              - ConsoleCancellation_Observe_Raise_RunsCallbackWithoutSuppressingTermination

          - id: SpeechCli-ModelCommands-Uninstall
            title: >-
              The tool shall remove a downloaded model's installed files when invoked with
              `uninstall <modelId>`, treating a model that has nothing installed as a safe,
              successful no-op rather than an error.
            tags: [subsystem]
            justification: |
              Freeing disk space is the sole purpose of this command; a model with nothing
              installed already satisfies that goal, so reporting it as an error would make a
              defensive "uninstall it if present" script exit non-zero for no real problem.
            tests:
              - UninstallCommand_Run_InstalledModel_UninstallsAndReportsSuccess
              - UninstallCommand_Run_NeverInstalledModel_IsSafeNoOp
              - UninstallCommand_Run_StoreThrows_ThrowsInvalidOperationException
              - SpeechCli_UninstallCommand_Invoked_NeverInstalledModel_ExitsCleanly

          - id: SpeechCli-ModelCommands-Clean
            title: >-
              The tool shall remove any partial or stale download artifacts left behind for a
              model when invoked with `clean <modelId>`, without ever failing for a model with
              nothing to clean up.
            tags: [subsystem]
            justification: |
              A prior interrupted or failed download can leave scratch files behind; an operator
              needs a way to reclaim that space without needing to know the model store's
              internal layout, and a routine "clean up after every attempt" script must never be
              broken by a model that already has nothing to clean.
            tests:
              - CleanCommand_Run_KnownModel_CleansUpAndReportsSuccess
              - CleanCommand_Run_MissingModelIdArgument_ThrowsArgumentException
              - SpeechCli_CleanCommand_Invoked_NothingToCleanUp_ExitsCleanly

          - id: SpeechCli-ModelCommands-LibraryDelegation
            title: >-
              The tool shall report every model descriptor, download, install, uninstall, and
              cleanup outcome exactly as the speech library's model catalog and model store
              provide it, keeping no model state of its own, and shall reject a missing context
              or catalog immediately with `ArgumentNullException`.
            tags: [subsystem]
            justification: |
              The subsystem exists to expose the library's own model-management behavior from
              the command line, so it must not maintain any model state of its own. Keeping that
              dependency replaceable lets each command's argument parsing and presentation be
              verified without network access or an installed model; the seam is described in
              the ModelCommandsSubsystem design document.
            tests:
              - ListModelsCommand_Run_NullContext_ThrowsArgumentNullException
              - ListModelsCommand_Run_NullCatalog_ThrowsArgumentNullException
              - ModelInfoCommand_Run_NullContext_ThrowsArgumentNullException
              - ModelInfoCommand_Run_NullCatalog_ThrowsArgumentNullException
              - DownloadCommand_RunAsync_NullContext_ThrowsArgumentNullException
              - DownloadCommand_RunAsync_NullCatalog_ThrowsArgumentNullException
              - UninstallCommand_Run_NullContext_ThrowsArgumentNullException
              - UninstallCommand_Run_NullCatalog_ThrowsArgumentNullException
              - CleanCommand_Run_NullContext_ThrowsArgumentNullException
              - CleanCommand_Run_NullCatalog_ThrowsArgumentNullException
              - SpeechModelCatalogAdapter_Enumerate_ReturnsCompiledInKnownModels
              - SpeechModelCatalogAdapter_DownloadAsync_UnknownModelId_ThrowsArgumentException
              - CliModelCatalogFactory_Create_WithModelsDir_UsesGivenRoot
              - CliModelCatalogFactory_Create_NullContext_ThrowsArgumentNullException

          - id: SpeechCli-ModelCommands-DownloadMirrorComposition
            title: >-
              The tool shall apply the download mirror configured through the global
              `--mirror-*` options (see `SpeechCli-Cli-DownloadMirror`) to every model download
              performed by any model-management command, rather than accepting and ignoring it.
            tags: [subsystem]
            justification: |
              A configured mirror is needed when the default download host is unreachable or
              prohibited; decomposing the system-level `SpeechCli-Cli-DownloadMirror`
              requirement down to this subsystem makes the mirror's actual effect on a real
              download independently verifiable.
            tests:
              - CliModelCatalogFactory_Create_WithMirrorUrl_AppliesMirrorToDownloads

          - id: SpeechCli-ModelCommands-SynthesisSeamExtension
            title: >-
              The tool shall let `speak` load the synthesis engine of a resolved synthesis model
              and size its WAV output from that model's preferred audio format, and shall reject
              a model of any other role with a clear error naming the model rather than an
              unhandled exception.
            tags: [subsystem]
            justification: |
              `speak` must run a real synthesis engine and write audio in the format that model
              produces, both of which only make sense for a synthesis model. A wrong-role model
              must produce an actionable message, not a crash.
            tests:
              - SpeechModelCatalogAdapter_GetPreferredAudioFormat_RecognitionRoleModel_ThrowsArgumentException
              - SpeechModelCatalogAdapter_GetPreferredAudioFormat_NullDescriptor_ThrowsArgumentNullException
              - SpeechModelCatalogAdapter_CreateSynthesizerEngineAsync_RecognitionRoleModel_ThrowsArgumentException
              - SpeechModelCatalogAdapter_CreateSynthesizerEngineAsync_NullDescriptor_ThrowsArgumentNullException
              - SpeechModelCatalogAdapter_GetPreferredAudioFormat_WithSynthesisModel_ReturnsFormat
              - SpeechModelCatalogAdapter_CreateSynthesizerEngineAsync_WithSynthesisModel_ReturnsEngine

          - id: SpeechCli-ModelCommands-RecognitionSeamExtension
            title: >-
              The tool shall let `recognize` load the recognition engine of a resolved
              recognition model, and shall reject a model of any other role with a clear error
              naming the model rather than an unhandled exception.
            tags: [subsystem]
            justification: |
              `recognize` must run a real recognition engine, which only makes sense for a
              recognition model. A wrong-role model must produce an actionable message, not a
              crash.
            tests:
              - SpeechModelCatalogAdapter_CreateRecognizerEngineAsync_SynthesisRoleModel_ThrowsArgumentException
              - SpeechModelCatalogAdapter_CreateRecognizerEngineAsync_NullDescriptor_ThrowsArgumentNullException
              - SpeechModelCatalogAdapter_CreateRecognizerEngineAsync_WithRecognitionModel_ReturnsEngine

          - id: SpeechCli-ModelCommands-ChatterboxComposition
            title: >-
              The tool shall offer the Chatterbox Turbo synthesis model alongside the other known
              models, with the reference voices that the voice commands list and install (an
              installed pack, the per-user folder, or the `--voices-dir` folder) as the voices it
              can speak with, and shall keep listing and model use working when a file in the
              `--voices-dir` folder cannot be decoded.
            tags: [subsystem]
            justification: |
              Chatterbox Turbo is a voice-cloning model: it can speak only with a reference
              voice, so the command line must be able to supply voices and the model must see
              exactly the voices the voice commands list and install. One undecodable file in a
              user's folder must not take the whole voice list down.
            tests:
              - SpeechModelCatalogAdapter_Enumerate_ReturnsCompiledInKnownModels
              - CliModelCatalogFactory_Create_WithModelsDir_UsesGivenRoot
              - CliModelCatalogFactory_Create_WithVoicesDir_EnumeratesThatFolder
              - SpeechModelCatalogAdapter_Voices_ListsUserAndVoicesDirVoices
              - SpeechModelCatalogAdapter_DamagedVoicesDirFile_DoesNotBreakAdapterOrListing

          - id: SpeechCli-ModelCommands-ListVoices
            title: >-
              The tool shall list every available reference voice (id, source, display name)
              when invoked with `list-voices`, as an aligned table (default) or a JSON array
              (`--format json`).
            tags: [subsystem]
            justification: |
              Voice ids are the values of the Chatterbox `voice` parameter and there can be well
              over a hundred of them, so an operator needs a discoverable list, in a form a
              script can also parse.
            tests:
              - ListVoicesCommand_Run_Table_ListsVoicesAndConsentNote
              - ListVoicesCommand_Run_Json_WritesParseableArray
              - SpeechCli_ListVoicesCommand_Invoked_PrintsConsentNote
              - SpeechCli_ListVoicesCommandWithJsonFormat_Invoked_EmitsJsonArray

          - id: SpeechCli-ModelCommands-ListVoicesUsageHints
            title: >-
              The tool shall tell the operator how to obtain voices when `list-voices` finds
              none, and shall show how to choose a listed voice (`speak --tts-param
              voice=<id>`) when it finds some.
            tags: [subsystem]
            justification: |
              An empty list is a dead end unless it says how to add voices, and a list of ids is
              only useful if it says where the id goes.
            tests:
              - ListVoicesCommand_Run_Table_ListsVoicesAndConsentNote
              - ListVoicesCommand_Run_NoVoices_ExplainsHowToAddVoices

          - id: SpeechCli-ModelCommands-ListVoicesConsentNote
            title: >-
              The tool shall print the consent note, that only voices the operator has permission
              to use may be cloned, whenever `list-voices` prints its output.
            tags: [subsystem]
            justification: |
              Cloning a voice reproduces a person's vocal identity, so the consent note is shown
              where voices are chosen.
            tests:
              - ListVoicesCommand_Run_Table_ListsVoicesAndConsentNote
              - ListVoicesCommand_Run_NoVoices_ExplainsHowToAddVoices
              - SpeechCli_ListVoicesCommand_Invoked_PrintsConsentNote

          - id: SpeechCli-ModelCommands-ListVoicesArgumentValidation
            title: >-
              The tool shall reject a `list-voices` invocation with an unknown `--format` value or
              an unsupported argument with a clear, non-zero-exit-code error rather than a stack
              trace.
            tags: [subsystem]
            justification: |
              A mistyped option must fail predictably so a script can detect it instead of
              receiving output in an unexpected form.
            tests:
              - ListVoicesCommand_Run_BadArguments_ThrowsArgumentException
              - ListVoicesCommand_Run_UnknownFormat_ThrowsArgumentException
              - ListVoicesCommand_Run_NullArguments_Throw

          - id: SpeechCli-ModelCommands-VoicePacks
            title: >-
              The tool shall list the installable reference-voice packs with their install state
              when invoked with `voices packs`.
            tags: [subsystem]
            justification: |
              An operator needs to see which voice packs exist and which are already installed
              before choosing to download one.
            tests:
              - VoicesCommand_RunAsync_Packs_ListsPackStateAndConsentNote
              - SpeechCli_VoicesPacksCommand_Invoked_ListsPacksAndConsentNote

          - id: SpeechCli-ModelCommands-VoicePackInstall
            title: >-
              The tool shall download, verify, and install a reference-voice pack with live
              progress, through the configured `--models-dir` and `--mirror-*` options, when
              invoked with `voices install <packId>`.
            tags: [subsystem]
            justification: |
              The reference-voice pack is a large optional download, so installing it must follow
              the same conventions as model downloads (store location, mirror, progress).
            tests:
              - VoicesCommand_RunAsync_Install_ReportsProgressAndConsentNote
              - DownloadProgressReporter_Create_KnownTotal_PrintsOneLinePerWholePercent
              - DownloadProgressReporter_Create_UnknownTotal_ReportsKilobytes

          - id: SpeechCli-ModelCommands-VoicePackInstallFailure
            title: >-
              The tool shall exit non-zero and report the reason when `voices install` fails or
              is canceled.
            tags: [subsystem]
            justification: |
              A script installing the voice pack must be able to detect that it did not
              complete, including when the operator interrupted it.
            tests:
              - VoicesCommand_RunAsync_InstallFails_ReportsErrorExitCode
              - VoicesCommand_RunAsync_InstallCanceled_ReportsErrorExitCode
              - ConsoleCancellation_Register_Raise_CancelsSourceRunsCallbackAndSuppressesTermination

          - id: SpeechCli-ModelCommands-VoicePackConsentNote
            title: >-
              The tool shall print the consent note, that only voices the operator has permission
              to use may be cloned, after a successful `voices install` and when listing packs.
            tags: [subsystem]
            justification: |
              The consent note is repeated at install time because that is when a pack of real
              people's voices arrives on the machine.
            tests:
              - VoicesCommand_RunAsync_Install_ReportsProgressAndConsentNote
              - VoicesCommand_RunAsync_Packs_ListsPackStateAndConsentNote

          - id: SpeechCli-ModelCommands-VoicePackUninstall
            title: >-
              The tool shall remove an installed reference-voice pack when invoked with
              `voices uninstall <packId>`, treating a pack with nothing installed as a safe,
              successful no-op.
            tags: [subsystem]
            justification: |
              Freeing disk space is the sole purpose of this command; a defensive "uninstall it
              if present" script must not exit non-zero for a pack that is already absent.
            tests:
              - VoicesCommand_RunAsync_Uninstall_ForwardsAndReports
              - VoicesCommand_RunAsync_UninstallStoreThrows_ThrowsInvalidOperationException

          - id: SpeechCli-ModelCommands-VoicePackArgumentValidation
            title: >-
              The tool shall reject an unknown pack id, a missing or extra argument, or an
              unknown sub-action of `voices` with a clear, non-zero-exit-code error rather than a
              stack trace.
            tags: [subsystem]
            justification: |
              A mistyped voices command must fail predictably and name the problem so a script
              can detect it.
            tests:
              - VoicesCommand_RunAsync_InstallUnknownPack_ThrowsArgumentException
              - VoicesCommand_RunAsync_BadArguments_ThrowsArgumentException
              - VoicesCommand_RunAsync_NullArguments_Throw
              - SpeechModelCatalogAdapter_VoicePackUninstallAndInstall_UnknownOrMissingPack_BehaveCleanly

          - id: SpeechCli-ModelCommands-VoiceEmotions
            title: >-
              The tool shall install a reference-voice pack with its emotion variants by default
              when invoked with `voices install`.
            tags: [subsystem]
            justification: |
              Emotion variants make the cloned voices expressive, so an operator who does not
              ask otherwise gets the full pack.
            tests:
              - VoicesCommand_RunAsync_Install_DefaultIncludesEmotions

          - id: SpeechCli-ModelCommands-VoiceEmotionsOptOut
            title: >-
              The tool shall install only the base voices when `voices install` is given
              `--no-emotions`.
            tags: [subsystem]
            justification: |
              The emotion clips make the pack roughly thirteen times larger (about 570 MiB
              against about 44 MiB), so an operator must be able to opt out.
            tests:
              - VoicesCommand_RunAsync_InstallNoEmotions_InstallsBaseVoicesOnly

          - id: SpeechCli-ModelCommands-VoiceEmotionsSizes
            title: >-
              The tool shall show, in `voices packs`, the download size, the installed size
              without and with emotions, and the installed variant of each pack.
            tags: [subsystem]
            justification: |
              An operator must be able to see the sizes before choosing whether to include
              emotions.
            tests:
              - VoicesCommand_RunAsync_Packs_ShowsDownloadAndInstalledSizes

          - id: SpeechCli-ModelCommands-VoiceEmotionsUpgradeNotice
            title: >-
              The tool shall announce that the pack is removed and downloaded again when
              `voices install` replaces a voices-only install to add emotions.
            tags: [subsystem]
            justification: |
              Replacing an existing install triggers a large download, so the operator must be
              told why.
            tests:
              - VoicesCommand_RunAsync_InstallOverVoicesOnly_AnnouncesUpgrade

          - id: SpeechCli-ModelCommands-VoiceEmotionsListing
            title: >-
              The tool shall show how many emotion variants (moods) each voice has when invoked
              with `list-voices`, as a Moods column in the table and a `moods` array in JSON.
            tags: [subsystem]
            justification: |
              An operator must be able to discover which voices carry moods before choosing one.
            tests:
              - ListVoicesCommand_Run_MoodClips_ShowsMoodsColumnAndJson
