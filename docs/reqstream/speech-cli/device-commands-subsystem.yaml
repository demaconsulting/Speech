---
# Software Subsystem Requirements for the SpeechCli DeviceCommandsSubsystem
#
# These requirements describe the subsystem-level behavior of the three device-related
# subcommands (list-devices, devices test, doctor), decomposing the system-level dispatch
# requirements in docs/reqstream/speech-cli.yaml.
#
# Unlike ModelCommandsSubsystem, no CLI-owned seam is introduced here: IAudioCaptureDeviceProbe
# and IAudioPlaybackDeviceProbe are already public, directly fakeable interfaces, and
# AudioDeviceFactory itself exposes a public constructor accepting injected probes, so every
# command depends directly on the library's own public audio types.

sections:
  - title: SpeechCli Requirements
    sections:
      - title: DeviceCommandsSubsystem Requirements
        requirements:
          - id: SpeechCli-DeviceCommands-ListDevices
            title: >-
              The tool shall enumerate every currently detected audio capture (input) and
              playback (output) device's name, direction, channel count, and sample rate as an
              aligned table when invoked with `list-devices`.
            tags: [subsystem]
            justification: |
              An operator or script needs to discover which audio devices this machine offers,
              and by what name, before selecting one for `devices test`, `speak`, `recognize`, or
              `ask`.
            tests:
              - ListDevicesCommand_Run_NoFilter_ListsBothDirections
              - SpeechCli_ListDevicesCommand_Invoked_ExitsCleanly

          - id: SpeechCli-DeviceCommands-ListDevicesDirectionFilter
            title: >-
              The tool shall restrict the `list-devices` output to one direction when
              `--direction input` or `--direction output` is given.
            tags: [subsystem]
            justification: |
              An operator selecting a microphone or a speaker only needs the devices of that
              direction.
            tests:
              - ListDevicesCommand_Run_DirectionInput_ListsOnlyCaptureDevices
              - ListDevicesCommand_Run_DirectionOutput_ListsOnlyPlaybackDevices

          - id: SpeechCli-DeviceCommands-ListDevicesNoDevices
            title: >-
              The tool shall print a plain "No devices found." message, rather than an error,
              when `list-devices` finds no devices.
            tags: [subsystem]
            justification: |
              Treating "no devices" as a plain informational message mirrors this library's own
              graceful-degradation convention for optional audio hardware, since a headless/CI
              machine with no audio hardware is a normal, not exceptional, condition.
            tests:
              - ListDevicesCommand_Run_NoDevices_PrintsNoDevicesMessage

          - id: SpeechCli-DeviceCommands-ListDevicesArgumentValidation
            title: >-
              The tool shall reject a `list-devices` invocation with an invalid or valueless
              `--direction`, or an unsupported flag, with a clear, non-zero-exit-code error
              rather than a stack trace.
            tags: [subsystem]
            justification: |
              A mistyped option must fail predictably so a script can detect it instead of
              receiving output in an unexpected form.
            tests:
              - ListDevicesCommand_Run_InvalidDirectionValue_ThrowsArgumentException
              - ListDevicesCommand_Run_DirectionFlagMissingValue_ThrowsArgumentException
              - ListDevicesCommand_Run_UnsupportedFlag_ThrowsArgumentException
              - SpeechCli_ListDevicesCommandWithInvalidDirection_Invoked_ReturnsCleanError

          - id: SpeechCli-DeviceCommands-DevicesTest
            title: >-
              The tool shall sanity-check a single audio device, optionally named with
              `--device <name>`, without requiring any speech model when invoked with
              `devices test`.
            tags: [subsystem]
            justification: |
              An operator needs a way to prove a specific audio device actually works before
              relying on it for real speech I/O, without needing a downloaded model just to test
              hardware.
            tests:
              - DevicesTestCommand_ParseArguments_DeviceFlag_ParsesDeviceName
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_NullDeviceName_ReturnsNull
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_KnownDeviceName_ReturnsSelection

          - id: SpeechCli-DeviceCommands-DevicesTestOutput
            title: >-
              The tool shall play a short synthesized test tone on the selected playback device
              when `devices test` is invoked for the output direction, which is the default when
              `--direction` is omitted.
            tags: [subsystem]
            justification: |
              Defaulting to the output direction avoids implicitly recording real audio input as
              a side effect of a bare invocation, since recording is inherently more
              privacy-sensitive than playing a tone.
            tests:
              - DevicesTestCommand_ParseArguments_NoFlags_DefaultsToOutputDirection
              - DevicesTestCommand_ParseArguments_DirectionOutput_ParsesToPlaybackDirection
              - DevicesTestCommand_PlayTestTone_AvailableDevice_WritesToneAndReportsIt

          - id: SpeechCli-DeviceCommands-DevicesTestInput
            title: >-
              The tool shall record a short clip from the selected capture device and report
              basic capture statistics (sample count, peak amplitude) when `devices test` is
              invoked with `--direction input`.
            tags: [subsystem]
            justification: |
              An operator needs to confirm that a microphone actually delivers audio without
              needing a downloaded recognition model.
            tests:
              - DevicesTestCommand_ParseArguments_DirectionInput_ParsesToCaptureDirection
              - DevicesTestCommand_RecordTestClip_DeviceDeliversFrames_ReportsSampleCountAndPeak

          - id: SpeechCli-DeviceCommands-DevicesTestInputNoSamples
            title: >-
              The tool shall fail with a non-zero exit code and a clear message when the capture device
              delivers no samples during a `devices test --direction input` recording.
            tags: [subsystem]
            justification: |
              A capture test that recorded nothing has not proven that the microphone works, so reporting
              success with a zero peak would hide exactly the fault the command exists to detect.
            tests:
              - DevicesTestCommand_RecordTestClip_DeviceDeliversNoFrames_ThrowsInvalidOperationException

          - id: SpeechCli-DeviceCommands-DevicesTestDeviceValidation
            title: >-
              The tool shall reject a `devices test` invocation naming an unrecognized
              `--device`, or whose resolved device is unavailable, with a clean,
              non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              Validating the device before any tone or recording is attempted makes a mistyped
              device name fail predictably.
            tests:
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_UnknownDeviceName_ThrowsArgumentException
              - DevicesTestCommand_Run_UnknownPlaybackDevice_ThrowsArgumentException
              - DevicesTestCommand_Run_UnknownCaptureDevice_ThrowsArgumentException
              - SpeechCli_DevicesTestCommandWithUnknownDevice_Invoked_ReturnsCleanError

          - id: SpeechCli-DeviceCommands-DevicesTestArgumentValidation
            title: >-
              The tool shall reject a `devices` invocation with a missing or unknown sub-action,
              an invalid or valueless `--direction` or `--device`, or an unsupported flag, with a
              clean, non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              A mistyped devices command must fail predictably so a script can detect it.
            tests:
              - DevicesTestCommand_ParseArguments_MissingSubAction_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_UnknownSubAction_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_InvalidDirectionValue_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_UnsupportedFlag_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_DeviceFlagMissingValue_ThrowsArgumentException
              - SpeechCli_DevicesCommandWithoutSubAction_Invoked_ReturnsCleanError

          - id: SpeechCli-DeviceCommands-DevicesTestOutputDrainTimeout
            title: >-
              The tool shall fail `devices test` for the output direction with a non-zero exit
              code and a clear message, rather than hanging, when the playback device does not
              finish playing the test tone within the tone's duration plus a fixed margin.
            tags: [subsystem]
            justification: |
              A stalled or disconnected output device must not leave a diagnostic command
              blocked forever, since the command exists to detect exactly that kind of fault.
            tests:
              - DevicesTestCommand_PlayTestTone_DeviceNeverDrains_ThrowsInvalidOperationException

          - id: SpeechCli-DeviceCommands-DevicesTestInvariantFormatting
            title: >-
              The tool shall report `devices test` durations with a period as the decimal
              separator regardless of the operator's culture.
            tags: [subsystem]
            justification: |
              A script parsing the report must see the same text on every machine.
            tests:
              - DevicesTestCommand_RecordTestClip_CommaDecimalCulture_ReportsInvariantDuration

          - id: SpeechCli-DeviceCommands-ToneGeneration
            title: >-
              The tool shall generate the `devices test` output tone with exactly the number of
              samples implied by the playback device's sample rate and channel count and the
              tone duration, without requiring a downloaded model.
            tags: [subsystem]
            justification: |
              Sanity-checking playback hardware must not depend on a downloaded synthesis model
              being available; a simple, deterministic tone is sufficient to prove audio
              actually reaches the device, and its correctness can be proven with pure math,
              with no real hardware.
            tests:
              - DevicesTestCommand_GenerateToneSamples_ReturnsExpectedSampleCount

          - id: SpeechCli-DeviceCommands-ToneSampleRateValidation
            title: >-
              The tool shall reject a non-positive sample rate when generating the `devices test`
              output tone.
            tags: [subsystem]
            justification: |
              A zero or negative sample rate cannot describe a tone and must fail predictably
              rather than produce an empty or corrupt signal.
            tests:
              - DevicesTestCommand_GenerateToneSamples_NonPositiveSampleRate_ThrowsArgumentOutOfRangeException

          - id: SpeechCli-DeviceCommands-ToneAmplitudeRange
            title: >-
              The tool shall keep every sample of the `devices test` output tone within the
              normalized range -1.0 to 1.0.
            tags: [subsystem]
            justification: |
              An out-of-range sample would clip or distort on the device and defeat the
              sanity check.
            tests:
              - DevicesTestCommand_GenerateToneSamples_AllSamplesWithinNormalizedRange

          - id: SpeechCli-DeviceCommands-ToneChannelIdentity
            title: >-
              The tool shall give the `devices test` output tone identical samples on every
              channel.
            tags: [subsystem]
            justification: |
              Identical channels let an operator confirm every speaker of a multi-channel output
              device receives the same audible tone.
            tests:
              - DevicesTestCommand_GenerateToneSamples_IdenticalAcrossChannels

          - id: SpeechCli-DeviceCommands-Doctor
            title: >-
              The tool shall report the model store's root path and writability as a pass/fail
              checklist when invoked with `doctor`.
            tags: [subsystem]
            justification: |
              An operator setting up this tool on a new machine needs one command that surfaces
              the most likely cause of trouble with model downloads: a model store that is
              missing or unwritable.
            tests:
              - DoctorCommand_Run_WritableModelStore_ReportsHealthy
              - DoctorCommand_Run_ReportsModelStoreRootPath
              - SpeechCli_DoctorCommand_Invoked_ReportsHealthChecklist

          - id: SpeechCli-DeviceCommands-DoctorDiskSpace
            title: >-
              The tool shall report the available disk space at the model store's root in
              `doctor`.
            tags: [subsystem]
            justification: |
              A model store that is out of space is a likely cause of failed model downloads.
            tests:
              - DoctorCommand_Run_ReportsAvailableDiskSpace

          - id: SpeechCli-DeviceCommands-DoctorNativeRuntimes
            title: >-
              The tool shall report in `doctor` whether the native SherpaOnnx runtime is
              resolvable.
            tags: [subsystem]
            justification: |
              A missing native runtime is a common cause of recognition failures.
            tests:
              - DoctorCommand_Run_ReportsSherpaOnnxNativeLibraryResolvable
              - DoctorCommand_ResolveSherpaOnnxNativeLibraryPath_AssetPresent_ReturnsPath
              - DoctorCommand_ResolveSherpaOnnxNativeLibraryPath_AssetAbsent_ReturnsNull

          - id: SpeechCli-DeviceCommands-DoctorPortAudioRuntime
            title: >-
              The tool shall report in `doctor` an unavailable native PortAudio runtime as an
              informational note rather than a failure.
            tags: [subsystem]
            justification: |
              A missing native audio runtime is a normal, gracefully-degraded condition this
              library already handles at the point of use, so `doctor` reports it without
              failing a healthy headless or CI machine.
            tests:
              - DoctorCommand_Run_UnavailablePortAudio_ReportsInformationalNoteNotFailure

          - id: SpeechCli-DeviceCommands-DoctorAudioDevices
            title: >-
              The tool shall report in `doctor` the number of detected input and output audio
              devices.
            tags: [subsystem]
            justification: |
              No audio hardware is a likely cause of a failed `speak` or `recognize`, and an
              operator needs to see that without running each narrower command individually.
            tests:
              - DoctorCommand_Run_ReportsAudioDeviceCounts

          - id: SpeechCli-DeviceCommands-DoctorModelCounts
            title: >-
              The tool shall report in `doctor` the number of installed models against the
              number of known models.
            tags: [subsystem]
            justification: |
              An operator needs to see at a glance whether any model has been downloaded yet.
            tests:
              - DoctorCommand_Run_ReportsInstalledVersusKnownModelCounts

          - id: SpeechCli-DeviceCommands-DoctorExitCode
            title: >-
              The tool shall make `doctor` exit non-zero only when the model store is not
              writable, treating every other check as informational.
            tags: [subsystem]
            justification: |
              Only the model store's writability is a hard failure because it is infrastructure
              this tool itself owns and depends on for every model-management command; missing
              audio hardware or an unresolvable native runtime must not fail a perfectly healthy
              headless or CI machine.
            tests:
              - DoctorCommand_Run_UnwritableModelStore_ReportsUnhealthyAndNonZeroExitCode
              - DoctorCommand_Run_UnavailablePortAudio_ReportsInformationalNoteNotFailure

          - id: SpeechCli-DeviceCommands-LibraryDelegation
            title: >-
              The tool shall list and count audio devices exactly as the speech library
              enumerates them, without adding, hiding, or renaming any device.
            tags: [subsystem]
            justification: |
              Operators rely on the reported device names being the same names the speech
              library accepts for device selection, so the report must not reshape them.
            tests:
              - ListDevicesCommand_Run_NoFilter_ListsBothDirections
              - DoctorCommand_Run_ReportsAudioDeviceCounts
