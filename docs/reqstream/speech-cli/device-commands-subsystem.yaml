---
# Software Subsystem Requirements for the SpeechCli DeviceCommandsSubsystem
#
# These requirements describe the subsystem-level behavior of the three device-related
# subcommands (list-devices, devices test, doctor), decomposing the system-level requirement
# SpeechCli-DeviceInspection and the `devices test` requirement SpeechCli-DeviceTest in docs/reqstream/speech-cli.yaml.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-cli/device-commands-subsystem/ -
# one per command:
# list-devices-command.yaml (ListDevicesCommand),
# devices-test-command.yaml (DevicesTestCommand) and
# doctor-command.yaml (DoctorCommand).
#
# The requirements below are the subsystem's own behavior: the commands taken together treat a
# machine with no audio hardware as a normal condition rather than an error, and `devices test` plays
# a tone for a known device (DevicesTestNormalAndError, whose ID is kept for stability) and rejects an
# unknown one cleanly (DevicesTestUnknownDevice).

sections:
  - title: SpeechCli Requirements
    sections:
      - title: DeviceCommandsSubsystem Requirements
        requirements:
          - id: SpeechCli-DeviceCommands-HeadlessMachine
            title: >-
              The DeviceCommandsSubsystem shall report a machine with no audio devices as an
              informational outcome, not an error, when `list-devices` or `doctor` is invoked.
            tags: [subsystem]
            justification: |
              A headless or CI machine with no audio hardware is a normal condition, and the
              library degrades gracefully for optional audio hardware. Both inspection commands
              must therefore complete cleanly there instead of failing, so scripts that run them
              on any machine behave predictably. The behavior spans two units.
            tests:
              - ListDevicesCommand_Run_NoDevices_PrintsNoDevicesMessage
              - DoctorCommand_Run_UnavailablePortAudio_ReportsInformationalNoteNotFailure
              - SpeechCli_ListDevicesCommand_Invoked_ExitsCleanly
              - SpeechCli_DoctorCommand_Invoked_ReportsHealthChecklist

          - id: SpeechCli-DeviceCommands-DevicesTestNormalAndError
            title: >-
              The DeviceCommandsSubsystem shall play the test tone on a known playback device and report it when
              `devices test` is invoked.
            tags: [subsystem]
            justification: |
              The test command is the operator's proof that audio works, so its success path must behave
              predictably when the command's parts run together, with no audio hardware needed.
            tests:
              - DevicesTestCommand_PlayTestTone_AvailableDevice_WritesToneAndReportsIt

          - id: SpeechCli-DeviceCommands-DevicesTestUnknownDevice
            title: >-
              The DeviceCommandsSubsystem shall reject an unknown device name with a clean error naming the
              device when `devices test` is invoked.
            tags: [subsystem]
            justification: |
              A mistyped device name is the commonest operator error for the test command, so it must end
              with a clear message instead of a stack trace, with no audio hardware needed.
            tests:
              - DevicesTestCommand_Run_UnknownPlaybackDevice_ThrowsArgumentException
              - SpeechCli_DevicesTestCommandWithUnknownDevice_Invoked_ReturnsCleanError
