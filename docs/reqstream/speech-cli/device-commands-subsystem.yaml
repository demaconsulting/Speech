---
# Software Subsystem Requirements for the SpeechCli DeviceCommandsSubsystem
#
# These requirements describe the subsystem-level behavior of the three device-related
# subcommands (list-devices, devices test, doctor), decomposing the system-level dispatch
# requirements in docs/reqstream/speech-cli.yaml.
#
# Unlike ModelCommandsSubsystem, no CLI-owned seam is introduced here: IAudioCaptureDeviceProbe
# and IAudioPlaybackDeviceProbe are already public, directly fakeable interfaces, and
# AudioDeviceFactory itself exposes a public constructor accepting injected probes, so every
# command depends directly on the library's own public audio types.

sections:
  - title: SpeechCli Requirements
    sections:
      - title: DeviceCommandsSubsystem Requirements
        requirements:
          - id: SpeechCli-DeviceCommands-ListDevices
            title: >-
              The tool shall enumerate every currently detected audio capture (input) and
              playback (output) device's name, direction, channel count, and sample rate when
              invoked with `list-devices`, optionally filtered to one direction
              (`--direction input`/`output`), printing an aligned table, or a plain "No devices
              found." message when the result is empty, rather than an error.
            tags: [subsystem]
            justification: |
              An operator or script needs to discover which audio devices this machine offers,
              and by what name, before selecting one for `devices test`, `speak`, `recognize`, or
              `ask`. Treating "no devices" as a plain informational message, not an
              error, mirrors this library's own graceful-degradation convention for optional
              audio hardware, since a headless/CI machine with no audio hardware is a normal,
              not exceptional, condition.
            tests:
              - ListDevicesCommand_Run_NoFilter_ListsBothDirections
              - ListDevicesCommand_Run_DirectionInput_ListsOnlyCaptureDevices
              - ListDevicesCommand_Run_DirectionOutput_ListsOnlyPlaybackDevices
              - ListDevicesCommand_Run_NoDevices_PrintsNoDevicesMessage
              - ListDevicesCommand_Run_InvalidDirectionValue_ThrowsArgumentException
              - ListDevicesCommand_Run_DirectionFlagMissingValue_ThrowsArgumentException
              - ListDevicesCommand_Run_UnsupportedFlag_ThrowsArgumentException
              - SpeechCli_ListDevicesCommand_Invoked_ExitsCleanly
              - SpeechCli_ListDevicesCommandWithInvalidDirection_Invoked_ReturnsCleanError

          - id: SpeechCli-DeviceCommands-DevicesTest
            title: >-
              The tool shall sanity-check a single audio device without requiring any speech
              model when invoked with `devices test [--device <name>] [--direction input|output]`
              - playing a short synthesized test tone for the output direction (the default when
              `--direction` is omitted), or recording a short clip and reporting basic capture
              statistics (sample count, peak amplitude) for the input direction - and shall reject
              an unrecognized `--device` name, or an unavailable resolved device, with a clean,
              non-zero-exit-code error rather than a stack trace.
            tags: [subsystem]
            justification: |
              An operator needs a way to prove a specific audio device actually works before
              relying on it for real speech I/O, without needing a downloaded model just to test
              hardware. Defaulting to the output direction avoids implicitly recording real audio
              input as a side effect of a bare invocation, since recording is inherently more
              privacy-sensitive than playing a tone.
            tests:
              - DevicesTestCommand_ParseArguments_NoFlags_DefaultsToOutputDirection
              - DevicesTestCommand_ParseArguments_DirectionInput_ParsesToCaptureDirection
              - DevicesTestCommand_ParseArguments_DirectionOutput_ParsesToPlaybackDirection
              - DevicesTestCommand_ParseArguments_DeviceFlag_ParsesDeviceName
              - DevicesTestCommand_ParseArguments_MissingSubAction_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_UnknownSubAction_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_InvalidDirectionValue_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_UnsupportedFlag_ThrowsArgumentException
              - DevicesTestCommand_ParseArguments_DeviceFlagMissingValue_ThrowsArgumentException
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_NullDeviceName_ReturnsNull
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_KnownDeviceName_ReturnsSelection
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_UnknownDeviceName_ThrowsArgumentException
              - DevicesTestCommand_Run_UnknownPlaybackDevice_ThrowsArgumentException
              - DevicesTestCommand_Run_UnknownCaptureDevice_ThrowsArgumentException
              - SpeechCli_DevicesCommandWithoutSubAction_Invoked_ReturnsCleanError
              - SpeechCli_DevicesTestCommandWithUnknownDevice_Invoked_ReturnsCleanError

          - id: SpeechCli-DeviceCommands-ToneGeneration
            title: >-
              The tool shall play a generated test tone for the output direction of `devices
              test`, with no downloaded model required, having the sample count for the
              requested sample rate and duration, every sample within the normalized range -1.0
              to 1.0, and identical samples on every channel.
            tags: [subsystem]
            justification: |
              Sanity-checking playback hardware must not depend on a downloaded synthesis model
              being available; a simple, deterministic tone is sufficient to prove audio
              actually reaches the device, and its correctness (sample count, range, per-channel
              identity) can be proven with pure math, with no real hardware. The in-process
              sine-wave generation is described in the DeviceCommandsSubsystem design document.
            tests:
              - DevicesTestCommand_GenerateToneSamples_ReturnsExpectedSampleCount
              - DevicesTestCommand_GenerateToneSamples_AllSamplesWithinNormalizedRange
              - DevicesTestCommand_GenerateToneSamples_IdenticalAcrossChannels
              - DevicesTestCommand_GenerateToneSamples_NonPositiveSampleRate_ThrowsArgumentOutOfRangeException

          - id: SpeechCli-DeviceCommands-Doctor
            title: >-
              The tool shall report the model store's root path, writability, and available
              disk space as a pass/fail checklist when invoked with `doctor`.
            tags: [subsystem]
            justification: |
              An operator setting up this tool on a new machine needs one command that surfaces
              the most likely cause of trouble with model downloads: a model store that is
              missing, unwritable, or out of space.
            tests:
              - DoctorCommand_Run_WritableModelStore_ReportsHealthy
              - DoctorCommand_Run_ReportsModelStoreRootPath
              - SpeechCli_DoctorCommand_Invoked_ReportsHealthChecklist

          - id: SpeechCli-DeviceCommands-DoctorNativeRuntimes
            title: >-
              The tool shall report in `doctor` whether the native PortAudio and SherpaOnnx
              runtimes are resolvable, as an informational note rather than a failure when one
              is not.
            tags: [subsystem]
            justification: |
              A missing native runtime is a common cause of audio and recognition failures, but
              it is a normal, gracefully-degraded condition this library already handles at the
              point of use, so `doctor` reports it without failing a healthy headless or CI
              machine.
            tests:
              - DoctorCommand_Run_ReportsSherpaOnnxNativeLibraryResolvable
              - DoctorCommand_ResolveSherpaOnnxNativeLibraryPath_AssetPresent_ReturnsPath
              - DoctorCommand_ResolveSherpaOnnxNativeLibraryPath_AssetAbsent_ReturnsNull
              - DoctorCommand_Run_UnavailablePortAudio_ReportsInformationalNoteNotFailure

          - id: SpeechCli-DeviceCommands-DoctorAudioDevices
            title: >-
              The tool shall report in `doctor` the number of detected input and output audio
              devices.
            tags: [subsystem]
            justification: |
              No audio hardware is a likely cause of a failed `speak` or `recognize`, and an
              operator needs to see that without running each narrower command individually.
            tests:
              - DoctorCommand_Run_ReportsAudioDeviceCounts

          - id: SpeechCli-DeviceCommands-DoctorModelCounts
            title: >-
              The tool shall report in `doctor` the number of installed models against the
              number of known models.
            tags: [subsystem]
            justification: |
              An operator needs to see at a glance whether any model has been downloaded yet.
            tests:
              - DoctorCommand_Run_ReportsInstalledVersusKnownModelCounts

          - id: SpeechCli-DeviceCommands-DoctorExitCode
            title: >-
              The tool shall make `doctor` exit non-zero only when the model store is not
              writable, treating every other check as informational.
            tags: [subsystem]
            justification: |
              Only the model store's writability is a hard failure because it is infrastructure
              this tool itself owns and depends on for every model-management command; missing
              audio hardware or an unresolvable native runtime must not fail a perfectly healthy
              headless or CI machine.
            tests:
              - DoctorCommand_Run_UnwritableModelStore_ReportsUnhealthyAndNonZeroExitCode
              - DoctorCommand_Run_UnavailablePortAudio_ReportsInformationalNoteNotFailure

          - id: SpeechCli-DeviceCommands-LibraryDelegation
            title: >-
              The tool shall report every audio device probe and device-creation result exactly
              as the speech library's audio device facilities provide it, and shall reject a
              missing context, probe, factory, or model catalog immediately with an exception.
            tags: [subsystem]
            justification: |
              The library's probe interfaces are already public and directly replaceable in
              tests, so the subsystem adds no wrapper of its own; a missing dependency must
              still fail immediately so a programming error is never silently ignored. See the
              DeviceCommandsSubsystem design document.
            tests:
              - ListDevicesCommand_Run_NullContext_ThrowsArgumentNullException
              - ListDevicesCommand_Run_NullCaptureProbe_ThrowsArgumentNullException
              - ListDevicesCommand_Run_NullPlaybackProbe_ThrowsArgumentNullException
              - DevicesTestCommand_ResolveDeviceSelectionOrThrow_NullKnownDevices_ThrowsArgumentNullException
              - DevicesTestCommand_Run_NullContext_ThrowsArgumentNullException
              - DevicesTestCommand_Run_NullFactory_ThrowsArgumentNullException
              - DoctorCommand_Run_NullContext_ThrowsArgumentNullException
              - DoctorCommand_Run_NullCatalog_ThrowsArgumentNullException
              - DoctorCommand_Run_EmptyModelStoreRootPath_ThrowsArgumentException
