---
# Software Unit Requirements for SilenceRunLimiter
#
# These requirements describe the design-level behavior of the SilenceRunLimiter unit, the
# leading-silence mitigation that truncates long quiet runs, decomposing the parent
# SpeechOnnxNemotronStt RecognitionSubsystem requirements. Its companion DitherNoise source has
# its own file (dither-noise.yaml).
#
# Covered by test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/RecognitionSubsystem/
# SilenceRunLimiterTests.cs.

sections:
  - title: SpeechOnnxNemotronStt Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: SilenceRunLimiter Requirements
            requirements:
              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-Truncation
                title: >-
                  The SilenceRunLimiter class shall truncate any quiet run longer than 400 ms to
                  400 ms, for both digital silence and low-level noise.
                justification: |
                  Long leading silence or very low noise makes the Nemotron model emit nothing
                  or garbage; truncating to a short run keeps context while preventing that
                  failure.
                tests:
                  - Process_DigitalSilence_TruncatesToCap
                  - Process_LowLevelNoise_TruncatesToCap

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-PreservesSpeech
                title: >-
                  The SilenceRunLimiter class shall pass through every sample of a loud frame,
                  including speech that follows a truncated silence or begins immediately.
                justification: |
                  The limiter exists to remove silence only; dropping speech samples would
                  corrupt the transcript.
                tests:
                  - Process_ToneBurst_PassesThrough
                  - Process_SilenceThenTone_KeepsAllToneSamples
                  - Process_ImmediateSpeechStart_KeepsEverything

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-PreservesQuietSpeech
                title: >-
                  The SilenceRunLimiter class shall not drop very quiet speech whose level is
                  above the threshold.
                justification: |
                  Soft speakers must not be treated as silence and lose words.
                tests:
                  - Process_VeryQuietSpeech_IsNotDropped

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-DefaultThreshold
                title: >-
                  The SilenceRunLimiter class shall use a default quiet threshold of 0.003 RMS
                  until calibrated.
                justification: |
                  Audio must be classified from the first frame, before enough of the stream has
                  been seen to calibrate.
                tests:
                  - Process_MidLevelCalibration_ThresholdIsMultipleOfNoiseFloor

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-AdaptiveThreshold
                title: >-
                  The SilenceRunLimiter class shall set its threshold to 3.5 times the 15th
                  percentile of the frame RMS values of the first 20 frames (400 ms).
                justification: |
                  A fixed threshold is wrong for both very clean and very noisy microphones; an
                  adaptive threshold calibrated from the stream's own start is robust.
                tests:
                  - Process_MidLevelCalibration_ThresholdIsMultipleOfNoiseFloor

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-ThresholdMaximum
                title: >-
                  The SilenceRunLimiter class shall clamp the calibrated threshold to at most
                  0.006.
                justification: |
                  Loud or speech-filled calibration audio must not raise the threshold above the
                  level of quiet speech and disable the gate for speech.
                tests:
                  - Process_LoudCalibration_ThresholdClampedToMaximum

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-ThresholdMinimum
                title: >-
                  The SilenceRunLimiter class shall clamp the calibrated threshold to at least
                  0.0015.
                justification: |
                  Exact digital silence during calibration must not make the threshold vanish.
                tests:
                  - Process_SilentCalibration_ThresholdClampedToMinimum

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-CalibrationFlow
                title: >-
                  The SilenceRunLimiter class shall let audio continue to flow during
                  calibration.
                justification: |
                  No speech may be delayed or lost while the limiter calibrates.
                tests:
                  - Process_DuringCalibration_AudioStillFlows

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-NonAdaptive
                title: >-
                  The SilenceRunLimiter class shall keep the default threshold when adaptation is
                  disabled.
                justification: |
                  A host that knows its noise floor must be able to fix the threshold.
                tests:
                  - Process_NonAdaptive_KeepsDefaultThreshold

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-StreamingEquivalence
                title: >-
                  The SilenceRunLimiter class shall produce identical output whether audio is
                  processed in one call or in arbitrary chunks.
                justification: |
                  The recognizer receives audio in arbitrary pieces; the limiter's output must
                  not depend on the split.
                tests:
                  - Process_ChunkedFeed_EqualsSingleFeed

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-Flush
                title: >-
                  The SilenceRunLimiter class's Flush method shall emit any partial frame still
                  held.
                justification: |
                  The tail of a stream must not be lost.
                tests:
                  - Flush_PartialFrame_IsEmitted

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-QuietRunClock
                title: >-
                  The SilenceRunLimiter class shall expose the length of the current quiet run
                  measured on the input clock, including samples it dropped.
                justification: |
                  Endpointing must see how long the input has really been quiet even though the
                  limiter removes most of it.
                tests:
                  - QuietRunSamples_TracksInputClock

              - id: SpeechOnnxNemotronStt-Recognition-SilenceRunLimiter-Reset
                title: >-
                  The SilenceRunLimiter class's Reset method shall restore the initial,
                  uncalibrated state.
                justification: |
                  A new session must start uncalibrated.
                tests:
                  - Reset_AfterUse_RestoresInitialState
