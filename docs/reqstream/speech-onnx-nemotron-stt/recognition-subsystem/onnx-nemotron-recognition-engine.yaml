---
# Software Unit Requirements for OnnxNemotronRecognitionEngine
#
# These requirements describe the design-level behavior of the OnnxNemotronRecognitionEngine unit,
# the real raw-ONNX implementation of the Speech library's public IRecognitionBackend seam,
# decomposing the parent SpeechOnnxNemotronStt RecognitionSubsystem requirements. The unit's
# collaborators NemotronEncoder, NemotronRnntNetwork, and NemotronEndpointDetector have their own
# unit requirement files (nemotron-encoder.yaml, nemotron-rnnt-network.yaml, and
# nemotron-endpoint-detector.yaml).
#
# Covered by test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/RecognitionSubsystem/
# OnnxNemotronRecognitionEngineTests.cs, against fake encoder and network implementations
# (Fakes.cs) that never load model files.

sections:
  - title: SpeechOnnxNemotronStt Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: OnnxNemotronRecognitionEngine Requirements
            requirements:
              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Construction
                title: >-
                  The OnnxNemotronRecognitionEngine class shall throw ArgumentNullException for
                  a null encoder, decoder, or vocabulary.
                justification: |
                  A programming error should surface immediately with a clear exception rather
                  than a null-reference failure deeper in recognition.
                tests:
                  - Constructor_NullArguments_Throw

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-SampleRate
                title: >-
                  The OnnxNemotronRecognitionEngine class shall consume 16 kHz audio.
                justification: |
                  The Nemotron front end is trained on 16 kHz audio, and the Speech library
                  resamples captured audio to the rate the engine declares.
                tests:
                  - SampleRate_Is16kHz

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Buffering
                title: >-
                  The OnnxNemotronRecognitionEngine class's AcceptSamples method shall only
                  buffer audio without decoding it, and shall ignore empty input.
                justification: |
                  The Speech library's recognition worker feeds audio and pumps decoding
                  separately; buffering must be cheap.
                tests:
                  - AcceptSamples_Empty_IsIgnored

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ChunkedDecoding
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryDecode method shall report
                  nothing and run no encoder work until a full 56-frame chunk is available.
                justification: |
                  The cache-aware encoder is trained on fixed-size chunks, so decoding must run
                  in whole encoder chunks.
                tests:
                  - TryDecode_LessThanChunk_ReportsNothing

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ProvisionalResults
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryDecode method shall decode every
                  complete chunk and report the utterance text so far as a provisional result
                  when that text has changed.
                justification: |
                  A host displaying live text needs each change reported.
                tests:
                  - TryDecode_SpeechChunk_ReportsProvisionalText

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ProvisionalOnlyOnChange
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryDecode method shall report
                  nothing when decoding a chunk leaves the utterance text unchanged.
                justification: |
                  Re-reporting unchanged text would flood the result stream.
                tests:
                  - TryDecode_NoNewTokens_ReportsNothing

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Flush
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryFlush method shall decode the
                  buffered partial chunk and return the utterance text as a final result.
                justification: |
                  When a stream ends, the audio still buffered must be decoded, or the last
                  words of an utterance would be lost.
                tests:
                  - TryFlush_PartialAudio_ReturnsFinalText

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-FlushTail
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryFlush method shall decode the
                  configured number of whole chunks of silence features after the buffered audio,
                  so the model's look-ahead delay is drained.
                justification: |
                  The model's look-ahead delay would otherwise hold back the last words of an
                  utterance.
                tests:
                  - TryFlush_NoTailChunks_DecodesOnlyAudio

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-SilencePadding
                title: >-
                  The OnnxNemotronRecognitionEngine class shall complete a partly filled chunk
                  and form the flush tail only from the features of dithered digital silence,
                  never from all-zero feature rows, so the padding adds no words.
                justification: |
                  An all-zero log-mel row is a loud input to the model, which then invents words
                  after the last spoken word; silence features let the model hear silence.
                tests:
                  - OnnxNemotronRecognitionEngine_TryFlush_PartialChunk_PadsWithSilenceFeatures
                  - OnnxNemotronRecognitionEngine_TryFlush_SpeechThenSilence_AddsNoWordsFromPadding

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-FlushNothing
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryFlush method shall return false
                  and produce no result when no audio or no text was produced.
                justification: |
                  A flush of an empty or text-free stream must not invent a final result.
                tests:
                  - TryFlush_NoAudio_ReturnsFalse
                  - TryFlush_AudioWithoutTokens_ReturnsFalse

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-DecodeClockEndpointing
                title: >-
                  The OnnxNemotronRecognitionEngine class shall report the utterance text as a
                  final result when its endpoint detector reports an endpoint, measuring each
                  decoded encoder frame at the input duration of its real (not padding) feature
                  rows and counting the quiet input the limiter removed at the point in the stream
                  where it was removed.
                justification: |
                  The utterance boundary must follow the audio the model actually decoded: a
                  frame without new words is trailing silence whether the input was silent or
                  steady noise, a pause the limiter shortened must still count at its real
                  length so an utterance ends about 1.2 s after its last word, and synthetic
                  padding, which often starts inside an encoder frame, must never count as input.
                tests:
                  - OnnxNemotronRecognitionEngine_TryDecode_SilenceAfterSpeech_FinalizesWithoutModelReset
                  - OnnxNemotronRecognitionEngine_TryDecode_ShortPauseBelowRule_KeepsOneUtterance
                  - OnnxNemotronRecognitionEngine_TryDecode_SteadyAudioWithoutNewTokens_FinalizesAfterTrailingBlanks
                  - OnnxNemotronRecognitionEngine_TryDecode_PaddingInsideEncoderFrame_DoesNotAdvanceEndpointClock

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EndpointKeepsModelState
                title: >-
                  The OnnxNemotronRecognitionEngine class shall keep the encoder caches, the
                  decoder state, and the feature stream at an endpoint, so tokens decoded after
                  the endpoint are reported exactly once in the next utterance.
                justification: |
                  Resetting the model at an endpoint discards the left context of speech that
                  resumes right after it, losing or repeating words; keeping the state lets the
                  model continue as if no endpoint had occurred.
                tests:
                  - OnnxNemotronRecognitionEngine_TryDecode_SilenceAfterSpeech_FinalizesWithoutModelReset
                  - OnnxNemotronRecognitionEngine_TryDecode_SpeechAfterEndpoint_KeepsEveryToken

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EndpointWithinBlock
                title: >-
                  The OnnxNemotronRecognitionEngine class shall report one final result per
                  utterance when several paused utterances arrive in a single block of accepted
                  audio.
                justification: |
                  A host may deliver audio in blocks of any size, and the utterance boundaries
                  must not depend on how the audio was split.
                tests:
                  - OnnxNemotronRecognitionEngine_TryDecode_PausedSpeechInOneBlock_ReportsOneFinalPerUtterance

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-MaximumUtterance
                title: >-
                  The OnnxNemotronRecognitionEngine class shall, when an utterance reaches the
                  maximum utterance length, report the tokens before the start of its last word
                  as a final result and carry that last word into the next utterance.
                justification: |
                  The last word may still be in progress when the maximum is reached; splitting
                  between words keeps every word whole and reported exactly once.
                tests:
                  - OnnxNemotronRecognitionEngine_TryDecode_ContinuousTokensBeyondMaximum_SplitsUtterance
                  - OnnxNemotronRecognitionEngine_TryDecode_MaximumLengthSplit_KeepsWordsWhole

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EndpointOptions
                title: >-
                  The OnnxNemotronRecognitionEngine class shall apply the configured endpoint
                  rules and throw ArgumentOutOfRangeException for a negative endpoint rule
                  duration or a negative number of flush tail chunks.
                justification: |
                  The endpoint rules are tuning values the evaluation tool varies; an invalid
                  configuration must fail at construction rather than silently distort
                  segmentation.
                tests:
                  - OnnxNemotronRecognitionEngine_TryDecode_CustomEndpointRules_FinalizesAtConfiguredSilence
                  - OnnxNemotronRecognitionEngine_Constructor_InvalidOptions_ThrowsArgumentOutOfRangeException

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ClosingPunctuation
                title: >-
                  The OnnxNemotronRecognitionEngine class shall drop closing punctuation tokens
                  (such as ".", ",", "?", closing brackets and quotes, and their CJK and
                  full-width forms) that would open a new utterance after an endpoint, while
                  keeping the words that follow them.
                justification: |
                  Because the model state is kept at an endpoint, the model may emit the closing
                  punctuation of the sentence just finalized a little later; that punctuation
                  belongs to the finalized sentence and must neither become a final of its own
                  nor start the next utterance.
                tests:
                  - OnnxNemotronRecognitionEngine_TryFlush_PunctuationAfterEndpoint_ReportsNoPunctuationOnlyFinal
                  - OnnxNemotronRecognitionEngine_TryFlush_PunctuationBeforeNextWords_StartsSegmentWithWord

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-SilenceNeverEndpoints
                title: >-
                  The OnnxNemotronRecognitionEngine class shall report no result, provisional or
                  final, for input that is silence alone, however long, and shall not reset the
                  model for it.
                justification: |
                  A stream of only silence has no utterance to finalize, and any text reported
                  for it would be invented.
                tests:
                  - TryDecode_OnlySilence_NeverEndpoints
                  - OnnxNemotronRecognitionEngine_TryFlush_SilenceOnly_ReportsNoText

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-QuietPadding
                title: >-
                  The OnnxNemotronRecognitionEngine class shall, once the quiet run after speech
                  reaches the limiter's quiet cap and before the endpoint, complete a partly
                  filled chunk with dithered silence so its text is reported as a provisional
                  result.
                justification: |
                  The limiter drops audio during a long quiet run, so the last words would
                  otherwise wait in an incomplete chunk until the endpoint.
                tests:
                  - TryDecode_QuietAfterShortSpeech_ReportsBeforeEndpoint

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-QuietPaddingCap
                title: >-
                  The OnnxNemotronRecognitionEngine class shall complete a partly filled chunk
                  at the configured limiter quiet cap rather than a fixed length.
                justification: |
                  The padding threshold must follow the limiter's configuration so the two
                  never disagree.
                tests:
                  - TryDecode_CustomLimiterCap_PadsAtThatCap

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Reset
                title: >-
                  After the OnnxNemotronRecognitionEngine class's Reset method, processing a new
                  audio stream shall yield the same results and endpoint behavior as a fresh engine
                  with the same configuration.
                justification: |
                  The Speech library reuses a backend across sessions; a new session must not
                  inherit the previous session's audio or model state. (The design resets the
                  limiter, dither, feature extractor, encoder, decoder, endpoint detector, and
                  utterance state; see the OnnxNemotronRecognitionEngine design.)
                tests:
                  - Reset_AfterAudio_NextStreamMatchesFreshEngine

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Dispose
                title: >-
                  The OnnxNemotronRecognitionEngine class's Dispose method shall release the
                  encoder and decoder once and cause later operations to throw
                  ObjectDisposedException.
                justification: |
                  The Speech library owns the backend's lifetime; native model resources must be
                  released deterministically and use after release must fail clearly.
                tests:
                  - Dispose_DisposesCollaboratorsAndBlocksUse
