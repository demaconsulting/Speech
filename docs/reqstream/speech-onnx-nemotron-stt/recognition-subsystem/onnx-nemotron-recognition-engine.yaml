---
# Software Unit Requirements for OnnxNemotronRecognitionEngine
#
# These requirements describe the design-level behavior of the OnnxNemotronRecognitionEngine unit,
# the real raw-ONNX implementation of the Speech library's public IRecognitionBackend seam,
# decomposing the parent SpeechOnnxNemotronStt RecognitionSubsystem requirements. The unit's
# internal collaborators INemotronEncoder, NemotronEncoder, and NemotronRnntNetwork are
# documented inside the engine and decoder unit design documents rather than as separate units.
#
# Covered by test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/RecognitionSubsystem/
# OnnxNemotronRecognitionEngineTests.cs, against fake encoder and network implementations
# (Fakes.cs) that never load model files, and NemotronEncoderTests.cs for the NemotronEncoder
# collaborator.

sections:
  - title: SpeechOnnxNemotronStt Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: OnnxNemotronRecognitionEngine Requirements
            requirements:
              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Construction
                title: >-
                  The OnnxNemotronRecognitionEngine class shall throw ArgumentNullException for
                  a null encoder, decoder, or vocabulary.
                justification: |
                  A programming error should surface immediately with a clear exception rather
                  than a null-reference failure deeper in recognition.
                tests:
                  - Constructor_NullArguments_Throw

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-SampleRate
                title: >-
                  The OnnxNemotronRecognitionEngine class shall consume 16 kHz audio.
                justification: |
                  The Nemotron front end is trained on 16 kHz audio, and the Speech library
                  resamples captured audio to the rate the engine declares.
                tests:
                  - SampleRate_Is16kHz

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Buffering
                title: >-
                  The OnnxNemotronRecognitionEngine class's AcceptSamples method shall only
                  buffer audio without decoding it, and shall ignore empty input.
                justification: |
                  The Speech library's recognition worker feeds audio and pumps decoding
                  separately; buffering must be cheap.
                tests:
                  - AcceptSamples_Empty_IsIgnored

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ChunkedDecoding
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryDecode method shall report
                  nothing and run no encoder work until a full 56-frame chunk is available.
                justification: |
                  The cache-aware encoder is trained on fixed-size chunks, so decoding must run
                  in whole encoder chunks.
                tests:
                  - TryDecode_LessThanChunk_ReportsNothing

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ProvisionalResults
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryDecode method shall decode every
                  complete chunk and report the utterance text so far as a provisional result
                  when that text has changed.
                justification: |
                  A host displaying live text needs each change reported.
                tests:
                  - TryDecode_SpeechChunk_ReportsProvisionalText

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-ProvisionalOnlyOnChange
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryDecode method shall report
                  nothing when decoding a chunk leaves the utterance text unchanged.
                justification: |
                  Re-reporting unchanged text would flood the result stream.
                tests:
                  - TryDecode_NoNewTokens_ReportsNothing

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Flush
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryFlush method shall decode the
                  buffered partial chunk and return the utterance text as a final result.
                justification: |
                  When a stream ends, the audio still buffered must be decoded, or the last
                  words of an utterance would be lost.
                tests:
                  - TryFlush_PartialAudio_ReturnsFinalText

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-FlushTail
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryFlush method shall decode the
                  configured number of all-zero tail chunks after the buffered audio, so the
                  model's look-ahead delay is drained.
                justification: |
                  The model's look-ahead delay would otherwise hold back the last words of an
                  utterance.
                tests:
                  - TryFlush_NoTailChunks_DecodesOnlyAudio

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-FlushNothing
                title: >-
                  The OnnxNemotronRecognitionEngine class's TryFlush method shall return false
                  and produce no result when no audio or no text was produced.
                justification: |
                  A flush of an empty or text-free stream must not invent a final result.
                tests:
                  - TryFlush_NoAudio_ReturnsFalse
                  - TryFlush_AudioWithoutTokens_ReturnsFalse

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-QuietEndpointing
                title: >-
                  The OnnxNemotronRecognitionEngine class shall finalize an utterance when the
                  input clock has been quiet for at least 2500 ms after speech, reporting the
                  final text and fully resetting the model state.
                justification: |
                  The limiter removes most of a long quiet run, so the chunk clock stalls during
                  silence; endpointing must therefore be measured on the input clock.
                tests:
                  - TryDecode_QuietAfterSpeech_EndpointsAndResets

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-QuietInsideBlock
                title: >-
                  The OnnxNemotronRecognitionEngine class shall finalize an utterance at a quiet
                  run that lies inside a single large block of accepted audio.
                justification: |
                  A host may deliver audio in blocks of any size, and the utterance boundary must
                  not depend on how the audio was split.
                tests:
                  - TryDecode_QuietInsideOneBlock_SplitsUtterance

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-SilenceNeverEndpoints
                title: >-
                  The OnnxNemotronRecognitionEngine class shall never endpoint on silence alone.
                justification: |
                  A stream of only silence has no utterance to finalize.
                tests:
                  - TryDecode_OnlySilence_NeverEndpoints

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-QuietPadding
                title: >-
                  The OnnxNemotronRecognitionEngine class shall, once the quiet run after speech
                  reaches the limiter's quiet cap and before the endpoint, complete a partly
                  filled chunk with dithered silence so its text is reported as a provisional
                  result.
                justification: |
                  The limiter drops audio during a long quiet run, so the last words would
                  otherwise wait in an incomplete chunk until the 2500 ms endpoint.
                tests:
                  - TryDecode_QuietAfterShortSpeech_ReportsBeforeEndpoint

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-QuietPaddingCap
                title: >-
                  The OnnxNemotronRecognitionEngine class shall complete a partly filled chunk
                  at the configured limiter quiet cap rather than a fixed length.
                justification: |
                  The padding threshold must follow the limiter's configuration so the two
                  never disagree.
                tests:
                  - TryDecode_CustomLimiterCap_PadsAtThatCap

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EmptyChunkEndpointing
                title: >-
                  The OnnxNemotronRecognitionEngine class shall finalize an utterance after
                  three consecutive token-free chunks once text exists, keeping the model state
                  so decoding continues seamlessly.
                justification: |
                  Steady background noise never reads as quiet, so a fallback endpoint based on
                  the model's own lack of output is needed; keeping the model state avoids
                  disturbing a speaker who merely paused.
                tests:
                  - TryDecode_EmptyChunksAfterText_FinalizesKeepingState

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EncoderInputs
                title: >-
                  The NemotronEncoder class shall feed the audio features, length, caches, and
                  language id to the encoder session by the model's tensor names and report the
                  encoded frame count.
                justification: |
                  The production tensor wiring cannot be exercised by the managed fakes, and the
                  real model is too large for CI, so a tiny synthetic ONNX model with the same
                  tensor contract verifies the wiring.
                tests:
                  - NemotronEncoder_Encode_FirstChunk_ReturnsFramesWithLanguage

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EncoderCacheFeedback
                title: >-
                  The NemotronEncoder class shall feed each call's cache outputs back as the next
                  call's cache inputs.
                justification: |
                  The cache-aware encoder depends on the previous chunks' context; without the
                  feedback each chunk would be encoded in isolation.
                tests:
                  - NemotronEncoder_Encode_SecondChunk_UsesPreviousCaches

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EncoderReset
                title: >-
                  The NemotronEncoder class's Reset method shall restore zero caches.
                justification: |
                  A new utterance must not inherit the previous utterance's context.
                tests:
                  - NemotronEncoder_Reset_AfterEncoding_RestartsCaches

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EncoderProbe
                title: >-
                  The NemotronEncoder class shall run a probe inference on a session without
                  taking ownership of the session or disturbing its later use.
                justification: |
                  A probe lets construction learn the encoder's tensor contract before first use
                  while the encoder remains usable.
                tests:
                  - NemotronEncoder_RunProbeInference_ValidSession_LeavesSessionUsable

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EncoderDispose
                title: >-
                  The NemotronEncoder class shall reject use after disposal with
                  ObjectDisposedException.
                justification: |
                  Use of a released native session must fail clearly rather than crash.
                tests:
                  - NemotronEncoder_Encode_AfterDispose_Throws

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-EncoderArgumentValidation
                title: >-
                  The NemotronEncoder class shall throw ArgumentNullException for a null
                  session.
                justification: |
                  A programming error should surface immediately with a clear exception.
                tests:
                  - NemotronEncoder_Constructor_NullSession_Throws

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Reset
                title: >-
                  The OnnxNemotronRecognitionEngine class's Reset method shall return the
                  limiter, dither, feature extractor, encoder, decoder, and utterance state to
                  the start-of-stream state.
                justification: |
                  The Speech library reuses a backend across sessions; a new session must not
                  inherit the previous session's audio or model state.
                tests:
                  - Reset_ClearsState

              - id: SpeechOnnxNemotronStt-Recognition-OnnxNemotronRecognitionEngine-Dispose
                title: >-
                  The OnnxNemotronRecognitionEngine class's Dispose method shall release the
                  encoder and decoder once and cause later operations to throw
                  ObjectDisposedException.
                justification: |
                  The Speech library owns the backend's lifetime; native model resources must be
                  released deterministically and use after release must fail clearly.
                tests:
                  - Dispose_DisposesCollaboratorsAndBlocksUse
