---
# Software Unit Requirements for NemotronRnntGreedyDecoder
#
# These requirements describe the design-level behavior of the NemotronRnntGreedyDecoder unit,
# decomposing the parent SpeechOnnxNemotronStt RecognitionSubsystem requirements. The unit's
# ONNX-backed collaborator NemotronRnntNetwork has its own unit requirement file
# (nemotron-rnnt-network.yaml); this unit is verified over the IRnntNetwork seam with a fake.
#
# Covered by test/DemaConsulting.Speech.Onnx.NemotronStt.Tests/RecognitionSubsystem/
# NemotronRnntGreedyDecoderTests.cs.

sections:
  - title: SpeechOnnxNemotronStt Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: NemotronRnntGreedyDecoder Requirements
            requirements:
              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-Greedy
                title: >-
                  The NemotronRnntGreedyDecoder class shall collect every non-blank token the
                  network predicts for each encoder frame into the caller's token list.
                justification: |
                  Greedy search is the decoding policy of the model's reference pipeline.
                tests:
                  - Decode_Tokens_AreCollectedAndAdvanced

              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-BlankOnly
                title: >-
                  The NemotronRnntGreedyDecoder class shall emit nothing for an encoder frame
                  whose network output is blank.
                justification: |
                  Blank means "no token for this frame"; emitting anything would invent text.
                tests:
                  - Decode_AllBlank_EmitsNothing

              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-StateAdvance
                title: >-
                  The NemotronRnntGreedyDecoder class shall advance the prediction state once per
                  emitted token and only for emitted tokens.
                justification: |
                  Later frames must condition on the transcript so far, which blank output does
                  not extend.
                tests:
                  - Decode_Tokens_AreCollectedAndAdvanced

              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-SymbolCap
                title: >-
                  The NemotronRnntGreedyDecoder class shall emit at most ten symbols per encoder
                  frame, moving on to the next frame once the cap is reached.
                justification: |
                  A network that never predicts blank must not trap the decoder in an endless
                  loop within one frame.
                tests:
                  - Decode_NeverBlank_StopsAtTenSymbolsPerFrame

              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-Reset
                title: >-
                  The NemotronRnntGreedyDecoder class's Reset method shall reset the underlying
                  network's prediction state.
                justification: |
                  A new utterance must start from the initial prediction state.
                tests:
                  - Reset_ResetsNetwork

              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-Dispose
                title: >-
                  The NemotronRnntGreedyDecoder class's Dispose method shall dispose the
                  underlying network.
                justification: |
                  The decoder owns the network's native resources and must release them
                  deterministically.
                tests:
                  - Dispose_DisposesNetwork

              - id: SpeechOnnxNemotronStt-Recognition-NemotronRnntGreedyDecoder-ArgumentValidation
                title: >-
                  The NemotronRnntGreedyDecoder class shall throw ArgumentNullException for a
                  null network or a null token list.
                justification: |
                  A programming error should surface immediately with a clear exception rather
                  than a null-reference failure deeper in decoding.
                tests:
                  - NullArguments_Throw
