---
# Software Subsystem Requirements for the SpeechOnnxNemotronStt ModelManagementSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechOnnxNemotronStt
# ModelManagementSubsystem, decomposing the system-level requirements in
# docs/reqstream/speech-onnx-nemotron-stt.yaml. This subsystem supplies the one concrete,
# ONNX-Runtime-backed speech model that implements the Speech library's IRecognitionModel
# contract (OnnxNemotronMultilingualRecognitionModel), the supporting vocabulary unit
# (NemotronVocabulary), and the AddNemotronSttModels() catalog-registration extension method.
#
# Unit-level content lives in per-unit files under
# docs/reqstream/speech-onnx-nemotron-stt/model-management-subsystem/. The AddNemotronSttModels()
# extension method (SpeechModelCatalogNemotronSttExtensions) has no separate unit file; its
# requirements are consolidated here at subsystem level, matching the sibling SpeechOnnxKokoro
# and SpeechSherpa systems' established convention for their own catalog extension methods.
#
# This package is covered by test/DemaConsulting.Speech.Onnx.NemotronStt.Tests - see per-unit files
# under docs/reqstream/speech-onnx-nemotron-stt/model-management-subsystem/ for the full tests:
# lists.

sections:
  - title: SpeechOnnxNemotronStt Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        requirements:
          - id: SpeechOnnxNemotronStt-Models-CatalogRegistration
            title: >-
              The SpeechOnnxNemotronStt ModelManagementSubsystem shall provide a public
              AddNemotronSttModels() extension method on the Speech library's SpeechModelCatalog
              that registers exactly its one ONNX-Runtime-backed recognition model.
            justification: |
              The Speech library's catalog has no compiled-in model registry; a host must
              register the models it wants through SpeechModelCatalog.AddModels. A single,
              discoverable registration entry point lets a host opt into this package's model
              with one call.
            tests:
              - AddNemotronSttModels_Called_RegistersOneRecognitionModel

          - id: SpeechOnnxNemotronStt-Models-CatalogRegistrationProviders
            title: >-
              The AddNemotronSttModels() extension method shall optionally accept an ordered
              list of preferred execution provider names and register the model with them.
            justification: |
              A host may prefer a particular ONNX Runtime execution provider, such as a GPU
              provider, and must be able to say so at registration time.
            tests:
              - AddNemotronSttModels_WithProviders_Registers

          - id: SpeechOnnxNemotronStt-Models-CatalogRegistrationChaining
            title: >-
              The AddNemotronSttModels() extension method shall return the same catalog
              instance it was called on.
            justification: |
              Returning the same instance keeps the catalog composable with other model
              packages in one fluent expression.
            tests:
              - AddNemotronSttModels_Called_ReturnsSameCatalogInstance

          - id: SpeechOnnxNemotronStt-Models-RealRecognitionModel
            title: >-
              The ModelManagementSubsystem shall provide one real, concrete IRecognitionModel
              class (OnnxNemotronMultilingualRecognitionModel) that declares its catalog
              identity, audio format, audio tag support, and license.
            justification: |
              The Speech library defines the recognition-model contract but ships no concrete
              models; a host needs a real recognition model that honestly describes itself to
              perform offline speech-to-text with this model family at all.
            children:
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-Identity
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-AudioFormat
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-AudioTagSupport
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-License
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-LicenseUrl
            tests:
              - Metadata_IsDeclared

          - id: SpeechOnnxNemotronStt-Models-DownloadDescriptor
            title: >-
              The ModelManagementSubsystem shall declare a download descriptor naming every one
              of the model's eleven files, each with a checksum and an HTTPS download URI.
            justification: |
              A host needs a checksum-verified, installable model; the downloader can only
              fetch and verify the files the model declares.
            children:
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-DownloadDescriptor
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-DownloadChecksums
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-DownloadUris
            tests:
              - DownloadDescriptor_ListsElevenFiles

          - id: SpeechOnnxNemotronStt-Models-LanguageSelection
            title: >-
              The ModelManagementSubsystem shall let a host select the recognition language,
              en-US by default or en-GB, through a language ChoiceParameter.
            justification: |
              Every locale shares the same model files, so a language choice lets a host pick a
              locale without installing the same model twice.
            children:
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-LanguageParameter
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-LanguageOptions
            tests:
              - Parameters_LanguageChoice

          - id: SpeechOnnxNemotronStt-Models-CreateBackendValidation
            title: >-
              The ModelManagementSubsystem's CreateBackend method shall fail with an exception,
              rather than return a partially built backend, for an unusable installation: an
              empty model directory, missing model files, or a vocabulary that does not declare
              the selected locale.
            justification: |
              A host must learn about an unusable installation at backend construction so the
              Speech library's factory can degrade it to the honest unavailable recognizer,
              instead of failing later during recognition.
            children:
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-EmptyDirectoryRejected
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-MissingFilesRejected
              - SpeechOnnxNemotronStt-Models-OnnxNemotronMultilingualRecognitionModel-UnsupportedLocaleRejected
            tests:
              - CreateBackend_EmptyDirectory_Throws
              - CreateBackend_MissingFiles_Throws
              - CreateBackend_VocabularyWithoutLocale_Throws

          - id: SpeechOnnxNemotronStt-Models-VocabularyLoading
            title: >-
              The ModelManagementSubsystem shall load the model's own vocabulary file and
              reject an empty vocabulary (NemotronVocabulary).
            justification: |
              The language identifier, blank id, and token text are properties of the exported
              model, so they must come from its own vocabulary at load time; an empty
              vocabulary is a corrupt installation.
            children:
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-Load
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-RejectEmpty
            tests:
              - Load_File_ReadsTokens
              - Constructor_Empty_Throws

          - id: SpeechOnnxNemotronStt-Models-VocabularyLanguageIds
            title: >-
              The ModelManagementSubsystem shall derive the encoder language identifier for a
              selected locale from the model's own vocabulary and report a locale the
              vocabulary does not declare.
            justification: |
              The language identifier is a property of the exported model, so it must be
              derived from the vocabulary rather than hard-coded.
            children:
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-LanguageIds
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-UnknownLocale
            tests:
              - TryGetLanguageId_KnownLocales_ReturnsOrdinal
              - TryGetLanguageId_UnknownLocale_ReturnsFalse

          - id: SpeechOnnxNemotronStt-Models-VocabularyBlankId
            title: >-
              The ModelManagementSubsystem shall derive the RNN-T blank token id from the
              model's own vocabulary.
            justification: |
              The blank id is a property of the exported model, so it must be derived from the
              vocabulary rather than hard-coded.
            children:
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-BlankId
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-BlankIdFallback
            tests:
              - BlankId_IsBlankTokenIndex
              - BlankId_NoBlankToken_IsLastIndex

          - id: SpeechOnnxNemotronStt-Models-VocabularyDetokenization
            title: >-
              The ModelManagementSubsystem shall convert emitted token ids into normalized,
              readable text.
            justification: |
              The model emits SentencePiece-style tokens that must be converted back to
              readable text.
            children:
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-Detokenize
              - SpeechOnnxNemotronStt-Models-NemotronVocabulary-DetokenizeEmpty
            tests:
              - Detokenize_Tokens_NormalizesText
              - Detokenize_Empty_ReturnsEmpty
