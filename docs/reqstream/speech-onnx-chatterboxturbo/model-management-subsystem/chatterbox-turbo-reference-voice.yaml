---
# Software Unit Requirements for ChatterboxTurboReferenceVoice
#
# Unit-level behavior of the ChatterboxTurboReferenceVoice unit (audio decoding and resampling
# come from the core AudioSubsystem), decomposing the parent SpeechOnnxChatterboxTurbo
# ModelManagementSubsystem requirements.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/ModelManagementSubsystem/
# ChatterboxTurboReferenceVoiceTests.cs.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: ChatterboxTurboReferenceVoice Requirements
            requirements:
              - id: SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-Normalization
                title: >-
                  The ChatterboxTurboReferenceVoice class shall keep mono 24 kHz samples as
                  supplied, down-mix multi-channel audio by averaging, resample other rates to
                  24 kHz preserving content, and trim over-long clips to the maximum length.
                justification: |
                  The speech encoder requires mono 24 kHz audio of bounded length.
                tests:
                  - ChatterboxTurboReferenceVoice_FromSamples_Mono24k_KeepsSamples
                  - ChatterboxTurboReferenceVoice_FromSamples_Stereo48k_IsDownMixedAndResampled
                  - ChatterboxTurboReferenceVoice_FromSamples_TooLong_IsTrimmed

              - id: SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-FileLoading
                title: >-
                  The ChatterboxTurboReferenceVoice class shall load WAV and FLAC files of any
                  channel count through the core AudioFileReader and shall report unreadable,
                  unsupported or malformed files with distinct exceptions.
                justification: |
                  Hosts hold clips as WAV or FLAC files, and a caller needs to tell a missing file from
                  an unsupported format.
                tests:
                  - ChatterboxTurboReferenceVoice_FromFile_Pcm16Wav_LoadsVoice
                  - ChatterboxTurboReferenceVoice_FromFile_StereoWav_LoadsVoice
                  - ChatterboxTurboReferenceVoice_FromFile_Float32Wav_LoadsVoice
                  - ChatterboxTurboReferenceVoice_FromFile_Flac_LoadsVoice
                  - ChatterboxTurboReferenceVoice_FromFile_BadFiles_ThrowDistinctExceptions

              - id: SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-Validation
                title: >-
                  The ChatterboxTurboReferenceVoice class shall reject clips shorter than the
                  minimum useful length and invalid arguments.
                justification: |
                  A too-short clip cannot condition the model and would produce poor speech.
                tests:
                  - ChatterboxTurboReferenceVoice_FromSamples_TooShort_Throws
                  - ChatterboxTurboReferenceVoice_FromSamples_InvalidArguments_Throw

              - id: SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-LazyFileLoading
                title: >-
                  The ChatterboxTurboReferenceVoice class shall support a file-backed voice whose
                  audio is decoded on first use only, and shall report a decoding failure then with
                  an exception that names the file.
                justification: |
                  A library of over a hundred clips must list instantly, and one damaged clip must
                  fail only when chosen, with a message that identifies it.
                tests:
                  - ChatterboxTurboReferenceVoice_FromFileLazy_CorruptFile_FailsOnFirstUseNamingFile
                  - ChatterboxTurboReferenceVoice_FromFileLazy_ValidFile_LoadsOnceOnFirstUse
