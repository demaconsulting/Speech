---
# Software Unit Requirements for SpeechModelCatalogChatterboxTurboExtensions
#
# Unit-level behavior of the SpeechModelCatalogChatterboxTurboExtensions unit, decomposing the parent
# SpeechOnnxChatterboxTurbo ModelManagementSubsystem requirements.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/ModelManagementSubsystem/
# SpeechModelCatalogChatterboxTurboExtensionsTests.cs.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: SpeechModelCatalogChatterboxTurboExtensions Requirements
            requirements:
              - id: SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-Registration
                title: >-
                  The SpeechModelCatalogChatterboxTurboExtensions class shall register the
                  package's single synthesis model into the supplied SpeechModelCatalog.
                justification: |
                  Registration is the opt-in seam through which a host composes this package with
                  the Speech library without the library depending on it.
                tests:
                  - SpeechModelCatalogChatterboxTurboExtensions_AddChatterboxTurboModels_RegistersModelAndReturnsCatalog

              - id: SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-ReturnsCatalog
                title: >-
                  The SpeechModelCatalogChatterboxTurboExtensions class shall return the same
                  catalog instance it was called on.
                justification: |
                  Returning the catalog allows call chaining with the other registration methods.
                tests:
                  - SpeechModelCatalogChatterboxTurboExtensions_AddChatterboxTurboModels_RegistersModelAndReturnsCatalog

              - id: SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-NullCatalog
                title: >-
                  The SpeechModelCatalogChatterboxTurboExtensions class shall throw
                  ArgumentNullException when the catalog is null.
                justification: |
                  A null catalog is a caller bug that must fail fast and visibly.
                tests:
                  - SpeechModelCatalogChatterboxTurboExtensions_AddChatterboxTurboModels_NullCatalog_ThrowsArgumentNullException

              - id: SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-DefaultStoreVoices
                title: >-
                  The SpeechModelCatalogChatterboxTurboExtensions class shall, when the options name
                  no reference-voice library, offer the voices of the catalog store's library
                  without modifying the caller's options object.
                justification: |
                  Hosts get the user folder and installed voice pack with no wiring, and a shared
                  options object must not be mutated by registering it against one catalog.
                tests:
                  - SpeechModelCatalogChatterboxTurboExtensions_AddChatterboxTurboModels_DefaultsToCatalogStoreVoices

              - id: SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-ComposesOptions
                title: >-
                  The SpeechModelCatalogChatterboxTurboExtensions class shall register the model
                  with the precision variants and the voices named by the supplied options.
                justification: |
                  A host selects variants and voices through the options and expects the
                  registered model to reflect both.
                tests:
                  - SpeechModelCatalogChatterboxTurboExtensions_AddChatterboxTurboModels_VariantsAndVoices_AreComposed
