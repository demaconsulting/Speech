---
# Software Subsystem Requirements for the SpeechOnnxChatterboxTurbo ModelManagementSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechOnnxChatterboxTurbo
# ModelManagementSubsystem, decomposing the system-level requirements in
# docs/reqstream/speech-onnx-chatterboxturbo.yaml. The subsystem holds the catalog extension
# method, the ISynthesisModel implementation (with its options and variant enums), the embedded
# byte-level BPE tokenizer, and the reference-voice type with its mood clips.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/ModelManagementSubsystem/;
# unit-level requirements live under
# docs/reqstream/speech-onnx-chatterboxturbo/model-management-subsystem/.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        requirements:
          - id: SpeechOnnxChatterboxTurbo-Models-CatalogRegistration
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall expose an
              AddChatterboxTurboModels extension method that registers the package's single
              synthesis model, configured with the supplied options, into a SpeechModelCatalog
              and returns that same catalog.
            justification: |
              Registration is the opt-in seam through which a host composes this package with
              the Speech library without the library depending on it.
            children:
              - SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-Registration
              - SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-ReturnsCatalog
              - SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-NullCatalog

          - id: SpeechOnnxChatterboxTurbo-Models-ModelDescription
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall provide an
              ISynthesisModel for Chatterbox Turbo English that declares its identity, license,
              capability profile with native audio-tag support (including the supported mood
              tags) and 24 kHz mono output.
            justification: |
              The model store and the Speech library list, select and render for a model from
              this declared metadata.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-Identity
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-DisplayName
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-License
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-OutputFormat
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CapabilityProfile
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-ProfileJoinSilence

          - id: SpeechOnnxChatterboxTurbo-Models-ModelDownload
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall describe the
              downloadable file set of the model for each selectable precision variant, and load
              the graphs of the selected variant.
            justification: |
              The model store verifies and installs exactly what the descriptor lists, and a
              backend that loaded another variant's graphs would not match the installed files.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-DownloadDescriptor
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-Variants
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-VariantLoading

          - id: SpeechOnnxChatterboxTurbo-Models-VoiceChoice
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall expose the voices
              supplied to the model, explicitly or from a voice directory, as a voice choice
              with unique ids.
            justification: |
              The model has no built-in voices, so the host's own clips define the voice list a
              user can choose from.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-Voices
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-VoiceSelection
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-VoiceDirectory
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-VoiceDirectoryResilience
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-DuplicateVoices

          - id: SpeechOnnxChatterboxTurbo-Models-BackendCreation
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall build a loaded
              synthesis backend from an installed model directory.
            justification: |
              This is how the model store turns an installed model into speech.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CreateBackend

          - id: SpeechOnnxChatterboxTurbo-Models-BackendCreationFailures
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall fail backend creation
              with an exception that identifies the cause of the failure (no voice, empty
              directory path, missing model file, invalid graph).
            justification: |
              A broken install or configuration must be reported precisely so the host can tell
              the causes apart.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CreateBackendFailures
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CreateBackendEmptyPath
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CreateBackendMissingFile
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CreateBackendInvalidGraph

          - id: SpeechOnnxChatterboxTurbo-Models-BackendCreationCleanup
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall release every native
              session it already created when backend creation fails.
            justification: |
              Native sessions must never leak when construction fails.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-CreateBackendNoLeak

          - id: SpeechOnnxChatterboxTurbo-Models-ModelOptions
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall let a host configure
              the model through an options object whose defaults are the fp16 language model, q4
              auxiliary graphs, 1024 maximum new tokens and a 150 ms mood join silence.
            justification: |
              A host that supplies no options gets sensible behavior.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-Options

          - id: SpeechOnnxChatterboxTurbo-Models-ModelOptionsValidation
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall reject invalid model
              option values when they are assigned.
            justification: |
              Invalid values fail at assignment rather than during synthesis.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-OptionsValidation
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-OptionsRangeValidation
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-OptionsNullVoiceList

          - id: SpeechOnnxChatterboxTurbo-Models-TextTokenization
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall tokenize text into
              exactly the ids the reference tokenizer produces, without any separate tokenizer
              download.
            justification: |
              The language model is only correct for the exact ids its training tokenizer
              produced, and avoiding a second download keeps installation to one model.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-Encoding
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-EmptyText
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-EmbeddedDocument
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-SpecialTokens
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-TrailingEndOfText
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-Errors
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-InvalidGzip
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-EmptyAddedToken
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-MalformedMerges
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-MissingEndOfText
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-EmptyVocabulary
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-UnknownPiece
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-NullArguments
              - SpeechOnnxChatterboxTurbo-Models-ByteLevelBpeTokenizer-MergeRanks

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoices
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall create reference
              voices from WAV or FLAC files of any sample rate and channel count.
            justification: |
              Hosts hold clips in whatever format they were recorded.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-FileLoading

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceSamples
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall create reference
              voices from in-memory audio of any sample rate and channel count.
            justification: |
              Hosts that already hold decoded audio must not need a file.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-FromSamples

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceFileErrors
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall report a reference
              voice file it cannot use with an exception that identifies the problem.
            justification: |
              A clip that cannot be used must be reported clearly.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-FileErrors

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceArguments
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall reject invalid
              arguments when creating a reference voice.
            justification: |
              Programming errors must surface with a clear exception.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-InvalidMoodArguments

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceNormalization
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall normalize every
              reference voice to mono audio at 24 kHz.
            justification: |
              The speech encoder expects mono 24 kHz audio, while hosts hold clips in whatever
              channel layout and rate they were recorded in.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-Normalization
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-DownMix
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-Resampling

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceLength
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall trim reference voices
              longer than 30 seconds to 30 seconds.
            justification: |
              The speech encoder is only specified for clips of bounded length.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-MaximumLength

          - id: SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceMinimumLength
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall reject reference
              voices shorter than 1 second.
            justification: |
              The speech encoder needs a clip long enough to condition on.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-Validation

          - id: SpeechOnnxChatterboxTurbo-Models-StoreReferenceVoices
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall offer the voices of the
              model store's reference-voice library, downloaded pack and user folder, as selectable
              voices alongside explicitly supplied ones.
            justification: |
              Voice cloning needs reference clips, and shipping a ready-to-download pack of
              permissively licensed clips plus a user folder removes the need for every host to
              source and wire up its own.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-StoreVoices
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-StoreVoiceDefault
              - SpeechOnnxChatterboxTurbo-Models-SpeechModelCatalogChatterboxTurboExtensions-DefaultStoreVoices
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_Constructor_StoreVoices_MergedAfterExplicitAndDirectoryFirstIdWins

          - id: SpeechOnnxChatterboxTurbo-Models-StoreVoiceUniqueness
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall skip a library voice
              whose id is already present among the voices.
            justification: |
              An earlier voice wins, so a duplicate id never makes a voice unreachable.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-StoreVoiceDuplicates
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_Constructor_LibraryVoiceDuplicate_IsSkippedWithInfoDiagnostic

          - id: SpeechOnnxChatterboxTurbo-Models-StoreVoiceNaming
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall keep the display names
              of library voices distinguishable from earlier voices.
            justification: |
              Two voices with the same visible name could not be told apart in a voice list.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-StoreVoiceLabels
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_Constructor_UserVoiceLabelClash_AddsUserSuffix

          - id: SpeechOnnxChatterboxTurbo-Models-StoreVoiceOptOutChoice
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall let a host opt out of
              the library voices.
            justification: |
              A host that wants only its own voices must be able to say so.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-StoreVoiceOptOut
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_Constructor_IncludeStoreVoicesFalse_IgnoresLibrary

          - id: SpeechOnnxChatterboxTurbo-Models-StoreVoiceLazyLoading
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall list store voices
              without decoding their clips, and decode a clip only when its voice is first used.
            justification: |
              A hundred clips must not be decoded at startup.
            children:
              - SpeechOnnxChatterboxTurbo-Models-OnnxChatterboxTurboEnglishSynthesisModel-StoreVoiceLazyLoading
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-LazyFileLoading
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-ConcurrentFirstUse
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_Constructor_CorruptStoreVoice_DoesNotFailConstruction

          - id: SpeechOnnxChatterboxTurbo-Models-StoreVoiceDamagedClip
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall report a damaged store
              voice clip when its voice is first used, with its file named, without affecting the
              other voices.
            justification: |
              One damaged clip must not make the model unusable, and its message must identify
              it.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-LazyFileErrors
            tests:
              - ChatterboxTurboReferenceVoice_FromFileLazy_CorruptFile_FailsOnFirstUseNamingFile

          - id: SpeechOnnxChatterboxTurbo-Models-StoreVoiceMoods
            title: >-
              The SpeechOnnxChatterboxTurbo ModelManagementSubsystem shall give each voice
              optional mood clips that are decoded only when used, are looked up by mood name
              regardless of case or surrounding spaces, and report an absent mood as missing.
            justification: |
              Emotion variants of a voice must list instantly, fail only when used, and let the
              engine fall back to the base clip for a missing mood.
            children:
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-MoodClips
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-MoodMissing
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-MoodClipLoading
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-MoodNames
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-MoodLookup
              - SpeechOnnxChatterboxTurbo-Models-ChatterboxTurboReferenceVoice-NullMoodMap
            tests:
              - ChatterboxTurboReferenceVoice_WithMoodFiles_LoadsMoodClipsLazilyAndReportsMissingMoods
