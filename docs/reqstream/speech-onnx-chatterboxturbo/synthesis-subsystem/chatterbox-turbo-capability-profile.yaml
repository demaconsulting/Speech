---
# Software Unit Requirements for ChatterboxTurboCapabilityProfile
#
# Unit-level behavior of the ChatterboxTurboCapabilityProfile unit (with its tag kind and
# treatment types), decomposing the parent SpeechOnnxChatterboxTurbo SynthesisSubsystem
# requirements.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SynthesisSubsystem/
# ChatterboxTurboCapabilityProfileTests.cs.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: ChatterboxTurboCapabilityProfile Requirements
            requirements:
              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NativeTags
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall render laugh, throat-clear and
                  gasp tags as the model's native bracketed tokens, keeping a mid-sentence tag
                  inline with the speech around it.
                justification: |
                  These tokens are the model's reliable paralinguistic output.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_MidSentenceLaugh_StaysInlineWithNativeToken
                  - ChatterboxTurboCapabilityProfile_Render_NativeTags_UseModelTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Silence
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall render a sigh as 300 ms of
                  silence, a short pause as 300 ms of silence and a long pause as 900 ms of
                  silence.
                justification: |
                  The model has no usable token for these, so real silence is the faithful
                  rendering.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_Sigh_BecomesSilenceSegment
                  - ChatterboxTurboCapabilityProfile_Render_PauseTags_BecomeSilence

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Unsupported
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall omit every tag it has no
                  rendering for, so that no bracketed text the model could speak aloud is emitted.
                justification: |
                  The model mispronounces unknown brackets, so tags it cannot render must become
                  nothing.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_UnsupportedTags_NeverEmitBracketText
                  - ChatterboxTurboCapabilityProfile_Treatments_CoverEveryTagWithoutEmotionTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTag
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall handle a native tag that would
                  end a sentence according to the configured policy: move it before the final
                  word, suffix it, or strip it.
                justification: |
                  A tag with no speech after it makes the model misbehave.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_TrailingTag_MoveBeforeFinalWord_RelocatesTag
                  - ChatterboxTurboCapabilityProfile_Render_TrailingTag_Suffix_AppendsOrDrops
                  - ChatterboxTurboCapabilityProfile_Render_TrailingTag_Strip_DropsTag

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TagBetweenSentences
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall attach a tag between sentences
                  to the following sentence.
                justification: |
                  A tag that stands alone has no speech to attach to.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_TagBetweenSentences_LeadsNextSentence

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTagOnlyChunk
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall join a chunk holding only a
                  trailing tag to the previous unit.
                justification: |
                  A chunk of only a tag has no speech to carry it.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_TrailingTagOnlyChunk_JoinsPreviousUnit

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Segmentation
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall split text into sentences and
                  add a 500 ms pause after an ellipsis ending.
                justification: |
                  The model is reliable only on moderate-length sentences.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_Sentences_AreSplitWithEllipsisPause

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-DigitFlankedStop
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall not treat a full stop flanked
                  by digits as a sentence boundary.
                justification: |
                  A decimal number must be spoken as one unit.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_DigitFlankedStop_IsNotASentenceBoundary

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-LongSentences
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall split a sentence longer than
                  200 characters into parts, keeping every word.
                justification: |
                  The model degrades on long inputs, and splitting must never lose speech.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_LongSentence_IsSplit
                  - ChatterboxTurboCapabilityProfile_Render_OverLongClause_SplitsOnWordBudgetKeepingEveryWord

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-InvalidInput
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall return a safe result for empty
                  or invalid text and reject null arguments.
                justification: |
                  Rendering must never fail a synthesis call on degenerate input.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_EmptyOrInvalid_BehavesSafely
                  - ChatterboxTurboCapabilityProfile_Render_NullArguments_Throw

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Moods
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall map the mood tags (and the
                  shout, tired, worried and neutral aliases) to a mood that applies to the
                  following text until the next mood tag, the last of consecutive mood tags
                  winning.
                justification: |
                  The model has no emotion tokens, so moods are realized by switching the
                  reference clip per segment.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_MoodTag_MarksFollowingTextWithMood
                  - ChatterboxTurboCapabilityProfile_Render_MoodRuns_AppliesUntilNextMoodTagInOrder
                  - ChatterboxTurboCapabilityProfile_Render_ConsecutiveMoodTags_LastWins

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NonMoodTags
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall keep the whispers, sarcastic,
                  soft and breathy tags stripped rather than treating them as moods.
                justification: |
                  Only the tags with a recorded reference clip are realized as moods.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_NonMoodStyleTags_StayStripped

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarker
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall mark each spoken segment with
                  its mood so the synthesis engine can read the mood back unchanged.
                justification: |
                  The engine needs the mood choice per segment.
                tests:
                  - ChatterboxTurboCapabilityProfile_MoodMarker_RoundTripsAndJoinIsValidated

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarkerLookup
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall match a mood name to a known
                  mood case-insensitively after trimming it, and shall add no marker for a null,
                  blank or unknown mood.
                justification: |
                  Mood names reach the profile in varying case and spacing and must select the
                  same clip.
                tests:
                  - ChatterboxTurboCapabilityProfile_WithMoodMarker_IsCaseInsensitiveAndTrimmed

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MarkerSafety
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall remove the mood-carrying
                  characters from user text so a caller cannot forge a mood.
                justification: |
                  The carrier must never be spoken or forged by text the user supplies.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_MarkerCharactersInUserText_AreStripped

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilence
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall add the configured join silence
                  (150 ms by default) only where the mood changes.
                justification: |
                  A change of reference clip is audible, so a short silence at the change hides
                  the seam.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_MoodChange_AddsJoinSilenceOnlyAtChanges

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceDisabled
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall add no join silence when the
                  configured join silence is zero.
                justification: |
                  A host can opt out of the seam-hiding silence.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_JoinSilence_ZeroDisablesAndLongerEllipsisPauseWins

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceOverlap
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall not double a pause that already
                  exists at a mood change, and an ellipsis pause longer than the join silence
                  shall win.
                justification: |
                  Stacked silences would make an audible gap.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_JoinSilence_ZeroDisablesAndLongerEllipsisPauseWins
                  - ChatterboxTurboCapabilityProfile_Render_PauseBetweenMoods_IsUnmarkedAndNotDoubled

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceValidation
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall accept a join silence from 0 to
                  1000 ms and reject an undefined end-of-sentence policy.
                justification: |
                  Out-of-range configuration must fail early instead of producing odd audio.
                tests:
                  - ChatterboxTurboCapabilityProfile_Constructor_JoinBoundariesAcceptedAndUndefinedPolicyRejected

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodTagPolicy
                title: >-
                  The ChatterboxTurboCapabilityProfile class shall apply the end-of-sentence tag
                  policy to each mood segment separately.
                justification: |
                  Each segment is generated on its own, so a trailing tag is a problem per
                  segment.
                tests:
                  - ChatterboxTurboCapabilityProfile_Render_NativeTagInMoodSpan_KeepsPolicyPerSegment
