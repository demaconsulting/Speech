---
# Software Unit Requirements for OnnxChatterboxTurboSynthesisEngine
#
# Unit-level behavior of the OnnxChatterboxTurboSynthesisEngine unit, decomposing the parent
# SpeechOnnxChatterboxTurbo SynthesisSubsystem requirements.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SynthesisSubsystem/
# OnnxChatterboxTurboSynthesisEngineTests.cs.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: OnnxChatterboxTurboSynthesisEngine Requirements
            requirements:
              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Generate
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall assemble the language-model
                  prompt from the voice conditioning and embedded text, generate speech tokens,
                  and decode them with the prompt tokens and trailing silence into audio.
                justification: |
                  This is the Chatterbox Turbo inference procedure; deviations change the audio.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_ScriptedTokens_AssemblesPromptAndDecoderInput

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-EmptyText
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall return empty audio without
                  calling the networks for empty text.
                justification: |
                  Empty input needs no inference and must not fail.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_EmptyText_ReturnsEmptyAudioWithoutNetworkCalls

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SpeedIgnored
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall ignore the requested speech
                  speed, returning the same audio for any speed.
                justification: |
                  The model has no speed control; the Speech library documents that such a model
                  ignores the speed rather than distorting the audio.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_Speed_IsIgnored

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Bounds
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall bound generation by both an
                  absolute maximum and a limit proportional to the text length, never allowing a
                  very large ratio to exceed the absolute maximum.
                justification: |
                  A missing end-of-speech token must not hang the host application.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged
                  - OnnxChatterboxTurboSynthesisEngine_Generate_ProportionalBound_StopsRunawayEarly
                  - OnnxChatterboxTurboSynthesisEngine_Generate_HugeRatio_ClampsToMaxNewTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Truncation
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall flag a result that hit a
                  bound as truncated and never throw for hitting a bound.
                justification: |
                  A bounded utterance is a degraded result, not a failure, and a host can tell it
                  from a complete one.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StopAfterCappedRun_EndsWithoutTruncation

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCap
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall limit identical consecutive
                  speech tokens to the configured maximum by excluding the repeated token from the
                  next selection.
                justification: |
                  The model can lock onto one speech token and produce a sustained tone; breaking
                  the run restores progress without affecting normal speech.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StuckToken_IsCappedAtRunLength
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StuckToken_NeverExceedsCapAnywhere

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCapDisabled
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall not limit repeated tokens
                  when the configured maximum is zero.
                justification: |
                  A host must be able to turn the guard off.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_CapZero_AllowsUnboundedRepeats

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-StopToken
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall never exclude the stop token
                  from selection, so a capped run can still end speech.
                justification: |
                  Breaking a token loop must never prevent the model from ending speech.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StopAfterCappedRun_EndsWithoutTruncation

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Voices
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall encode each voice once and
                  use the voice selected by speaker id.
                justification: |
                  Voice encoding is expensive and the speaker id comes from host configuration.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-VoiceFallback
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall fall back to the first voice
                  for an invalid speaker id.
                justification: |
                  A bad id from host configuration must not fail synthesis.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack
                  - OnnxChatterboxTurboSynthesisEngine_Generate_UnknownSpeaker_UsesFirstVoiceClip

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodConditioning
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall condition a mood segment on
                  the selected voice's clip for that mood, encoding it once per voice and mood.
                justification: |
                  Per-mood encoding is expensive and deterministic.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker
                  - OnnxChatterboxTurboSynthesisEngine_Generate_RenderedPlan_OrderedClipsAndNoMarkerInTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodMarkerHidden
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall never pass a mood marker to
                  the tokenizer or speak it, and shall return empty audio for text that holds
                  only a marker.
                justification: |
                  The marker is an internal carrier and must never reach the speech.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MarkerOnlyText_ReturnsEmptyAudio
                  - OnnxChatterboxTurboSynthesisEngine_Generate_RenderedPlan_OrderedClipsAndNoMarkerInTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodFallback
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall use the voice's base clip
                  when it has no clip for the requested mood.
                justification: |
                  A missing mood must never fail synthesis.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMissing_FallsBackToBaseClip

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SegmentGuards
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall apply the generation bounds
                  and run-length cap to each mood segment separately.
                justification: |
                  A runaway segment must not consume the budget of the segments after it.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MarkedSegments_GuardsApplyPerSegment

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-InvalidArguments
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall reject invalid constructor
                  arguments and null text.
                justification: |
                  Misuse must be loud.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Constructor_InvalidArguments_Throw
                  - OnnxChatterboxTurboSynthesisEngine_Generate_NullText_ThrowsArgumentNullException

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Lifecycle
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall, on dispose, dispose its
                  networks and reject further generation.
                justification: |
                  Native sessions must be released deterministically.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Dispose_DisposesNetworksAndRejectsGenerate

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-DisposeDuringGeneration
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall, when disposed during a
                  generation, wait for that generation to stop before disposing its networks.
                justification: |
                  Releasing native sessions under a running inference would crash the process.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Dispose_DuringGeneration_StopsGenerationAndWaitsForIt
