---
# Software Unit Requirements for OnnxChatterboxTurboSynthesisEngine
#
# Unit-level behavior of the OnnxChatterboxTurboSynthesisEngine unit, decomposing the parent
# SpeechOnnxChatterboxTurbo SynthesisSubsystem requirements.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SynthesisSubsystem/
# OnnxChatterboxTurboSynthesisEngineTests.cs.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: OnnxChatterboxTurboSynthesisEngine Requirements
            requirements:
              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Generate
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall assemble the language-model
                  prompt from the voice conditioning and embedded text, generate speech tokens,
                  decode them with the prompt tokens and trailing silence, and return empty audio
                  without network calls for empty text.
                justification: |
                  This is the Chatterbox Turbo inference procedure; deviations change the audio.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_ScriptedTokens_AssemblesPromptAndDecoderInput
                  - OnnxChatterboxTurboSynthesisEngine_Generate_EmptyText_ReturnsEmptyAudioWithoutNetworkCalls

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Bounds
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall bound generation by both an
                  absolute maximum and a limit proportional to the text length (clamped so a
                  very large ratio cannot overflow), flag a bounded
                  result as truncated, and never throw for hitting a bound.
                justification: |
                  A missing end-of-speech token must not hang or fail the host application.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged
                  - OnnxChatterboxTurboSynthesisEngine_Generate_ProportionalBound_StopsRunawayEarly
                  - OnnxChatterboxTurboSynthesisEngine_Generate_HugeRatio_ClampsToMaxNewTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCap
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall limit identical consecutive
                  speech tokens to the configured maximum by excluding the repeated token from the
                  next selection, shall never exclude the stop token, and shall not limit repeats
                  when the maximum is zero.
                justification: |
                  The model can lock onto one speech token and produce a sustained tone; breaking
                  the run restores progress without affecting normal speech.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StuckToken_IsCappedAtRunLength
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StuckToken_NeverExceedsCapAnywhere
                  - OnnxChatterboxTurboSynthesisEngine_Generate_CapZero_AllowsUnboundedRepeats
                  - OnnxChatterboxTurboSynthesisEngine_Generate_StopToken_IsNeverBlocked

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Voices
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall encode each voice once and
                  use the voice selected by speaker id, falling back to the first voice for an
                  invalid id.
                justification: |
                  Voice encoding is expensive and the speaker id comes from host configuration.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodConditioning
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall read and remove the internal
                  mood marker before tokenizing, condition the segment on the selected voice's
                  clip for that mood (encoded once per voice and mood), fall back to the voice's
                  base clip when the mood is missing, and apply the generation guards to each
                  segment separately.
                justification: |
                  The marker must never reach the tokenizer or be spoken, a missing mood must
                  never fail synthesis, and per-mood encoding is expensive and deterministic.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMissing_FallsBackToBaseClip
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MarkerOnlyText_ReturnsEmptyAudio
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MarkedSegments_GuardsApplyPerSegment
                  - OnnxChatterboxTurboSynthesisEngine_Generate_RenderedPlan_OrderedClipsAndNoMarkerInTokens

              - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Lifecycle
                title: >-
                  The OnnxChatterboxTurboSynthesisEngine class shall validate its constructor
                  arguments and, on dispose, dispose its networks and reject further generation.
                justification: |
                  Native sessions must be released deterministically and misuse must be loud.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Constructor_InvalidArguments_Throw
                  - OnnxChatterboxTurboSynthesisEngine_Generate_NullText_ThrowsArgumentNullException
                  - OnnxChatterboxTurboSynthesisEngine_Dispose_DisposesNetworksAndRejectsGenerate
