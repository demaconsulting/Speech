---
# Software Unit Requirements for ChatterboxTurboConditioning
#
# Unit-level behavior of the ChatterboxTurboConditioning unit, decomposing the parent
# SpeechOnnxChatterboxTurbo SynthesisSubsystem requirements. The unit is a data record with no
# tests of its own; it is verified through the tests of the units that produce and consume it.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SynthesisSubsystem/
# OnnxChatterboxTurboNetworksTests.cs and OnnxChatterboxTurboSynthesisEngineTests.cs.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: ChatterboxTurboConditioning Requirements
            requirements:
              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-EncoderOutputs
                title: >-
                  The ChatterboxTurboConditioning record shall carry the speech encoder's
                  conditioning embeddings and length, prompt tokens, speaker embeddings and
                  speaker feature frames of one reference clip unchanged.
                justification: |
                  The language model and the decoder are only correct for the exact encoder
                  outputs of the clip being spoken.
                tests:
                  - OnnxChatterboxTurboNetworks_Encode_NamedOutputs_ReturnsConditioning
                  - OnnxChatterboxTurboNetworks_Decode_SpeechTokens_ReturnsWaveform
                  - OnnxChatterboxTurboNetworks_Decode_ChangedConditioning_ChangesWaveform

              - id: SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-Reuse
                title: >-
                  The ChatterboxTurboConditioning record shall be safely shareable across
                  utterances, because it is treated as read-only.
                justification: |
                  One conditioning serves every later utterance, so it must not change after
                  creation. The engine unit owns the caching behavior itself.
                tests:
                  - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack
                  - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker
