---
# Software Subsystem Requirements for the SpeechOnnxChatterboxTurbo SynthesisSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechOnnxChatterboxTurbo
# SynthesisSubsystem, decomposing the system-level requirements in
# docs/reqstream/speech-onnx-chatterboxturbo.yaml. The subsystem implements the Speech library's
# public ISynthesisBackend seam over the four Chatterbox Turbo graphs: the engine (generation
# loop), the networks (ONNX Runtime sessions), the token selector, the conditioning record
# (reference-clip encoder outputs) and the capability profile (audio-tag rendering policy).
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SynthesisSubsystem/;
# unit-level requirements live under
# docs/reqstream/speech-onnx-chatterboxturbo/synthesis-subsystem/.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        requirements:
          - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxBackend
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall implement the Speech
              library's ISynthesisBackend seam for the Chatterbox Turbo model on the CPU,
              reporting the true 24 kHz output sample rate.
            justification: |
              A real implementation of the backend seam is what turns the Speech library's
              synthesis policy into audible speech for this package's model.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Generate
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-EmptyText
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SpeedIgnored
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Lifecycle
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-DisposeDuringGeneration
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Encode
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Embed
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Step
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Decode
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-EncoderOutputs
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Precision
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Configuration
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-GraphValidation
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-ConstructionCleanup
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Lifecycle
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-EncoderOutputs
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_CreateBackend_SyntheticInstall_SynthesizesAudio
              - OnnxChatterboxTurboSynthesisEngine_Generate_ScriptedTokens_AssemblesPromptAndDecoderInput

          - id: SpeechOnnxChatterboxTurbo-Synthesis-VoiceConditioning
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall condition every utterance
              on the voice selected by speaker id, falling back to the first voice for an
              out-of-range id.
            justification: |
              The selected voice defines how the speech sounds, and a safe fallback keeps a bad
              id from failing synthesis.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Voices
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-VoiceFallback
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack

          - id: SpeechOnnxChatterboxTurbo-Synthesis-VoiceCaching
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall encode each reference voice
              only once.
            justification: |
              Encoding a clip is expensive and deterministic, so caching it keeps per-sentence
              latency low.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-VoiceCaching
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-Reuse
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodConditioning
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall condition a mood segment on
              the selected voice's clip for that mood, encoding each mood clip only once.
            justification: |
              Moods are realized by switching the reference clip, and per-mood encoding is
              expensive and deterministic.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodConditioning
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodClipCaching
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodFallback
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall condition a mood segment on
              the voice's base clip when the selected voice has no clip for that mood.
            justification: |
              A voice that lacks a mood must still be spoken rather than fail.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodFallback
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMissing_FallsBackToBaseClip

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodMarkerHiding
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall never let the internal
              mood-carrying character reach the tokenizer or the speech, whether it was written
              by the capability profile or supplied in the caller's text, and shall return empty
              audio for text that holds only such characters.
            justification: |
              A mood is realized by switching clips, so the internal carrier must never be spoken
              or forged.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodMarkerHidden
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MarkerOnlyText
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MarkerSafety
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker
              - OnnxChatterboxTurboSynthesisEngine_Generate_MarkerOnlyText_ReturnsEmptyAudio

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagProfile
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall provide a capability
              profile that renders each audio tag as speech, silence or nothing according to what
              the model can reproduce.
            justification: |
              The model's tag behavior is model-specific, so the policy belongs with the
              package rather than the generic Speech library renderer.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NativeTags
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Silence
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Unsupported
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-InvalidInput
            tests:
              - ChatterboxTurboCapabilityProfile_Render_MidSentenceLaugh_StaysInlineWithNativeToken

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagRelocation
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall relocate, suffix or drop a
              tag that would end a sentence, and keep a tag between sentences with the speech
              that follows it.
            justification: |
              A tag with no speech after it makes the model misbehave.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTag
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TagBetweenSentences
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTagOnlyChunk
            tests:
              - ChatterboxTurboCapabilityProfile_Render_TrailingTag_MoveBeforeFinalWord_RelocatesTag

          - id: SpeechOnnxChatterboxTurbo-Synthesis-Segmentation
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall split text into sentences
              of at most 200 characters, keeping every word.
            justification: |
              The model degrades on long inputs, and splitting must never lose speech.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Segmentation
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-DigitFlankedStop
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-LongSentences
            tests:
              - ChatterboxTurboCapabilityProfile_Render_LongSentence_IsSplit

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodTags
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall turn mood audio tags into
              per-segment moods, hiding the seam between moods with a short silence.
            justification: |
              The model has no emotion tokens, so moods are realized by switching the reference
              clip per segment.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Moods
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NonMoodTags
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarker
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarkerLookup
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilence
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceDisabled
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceOverlap
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceValidation
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodTagPolicy
            tests:
              - ChatterboxTurboCapabilityProfile_Render_MoodChange_AddsJoinSilenceOnlyAtChanges

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationBounds
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall stop generation at the
              end-of-speech token or, failing that, at a bound derived from the text length and
              an absolute maximum, flagging the result as truncated.
            justification: |
              Without a bound a missing end-of-speech token would never terminate.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Bounds
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-ProportionalBound
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Truncation
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SegmentGuards
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-StopToken
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged

          - id: SpeechOnnxChatterboxTurbo-Synthesis-RepetitionGuard
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall avoid sustained repetition of
              a single speech token.
            justification: |
              Without a penalty the model loops on a single token.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCap
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCapDisabled
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-Selection
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-TieBreak
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-RepetitionPenalty
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-OutOfRangeHistory
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-NonFinite
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-BlockedToken
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-StopToken
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-SingleId
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_StuckToken_IsCappedAtRunLength
