---
# Software Subsystem Requirements for the SpeechOnnxChatterboxTurbo SynthesisSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechOnnxChatterboxTurbo
# SynthesisSubsystem, decomposing the system-level requirements in
# docs/reqstream/speech-onnx-chatterboxturbo.yaml. The subsystem implements the Speech library's
# public ISynthesisBackend seam over the four Chatterbox Turbo graphs: the engine (generation
# loop), the networks (ONNX Runtime sessions), the token selector, the conditioning record
# (reference-clip encoder outputs) and the capability profile (audio-tag rendering policy).
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SynthesisSubsystem/;
# unit-level requirements live under
# docs/reqstream/speech-onnx-chatterboxturbo/synthesis-subsystem/.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        requirements:
          - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxBackend
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall synthesize 24 kHz audio from
              text for the Chatterbox Turbo model on the CPU through the Speech library's
              ISynthesisBackend seam.
            justification: |
              A real implementation of the backend seam is what turns the Speech library's
              synthesis policy into audio for this package's model.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Generate
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-EmptyText
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SpeedIgnored
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-NullText
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-VoiceListSnapshot
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Lifecycle
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-DisposeDuringGeneration
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Encode
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Embed
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-EmbedEmpty
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Step
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Decode
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-DecodeConditioning
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-DecodeEmpty
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-EncoderOutputs
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-EncoderOutputsUnnamed
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-EncoderOutputsUnrecognized
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Precision
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-InvalidArguments
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-EmbeddingLength
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-SequenceLength
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-AttentionLength
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Configuration
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-ConfigurationValidation
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-GraphValidation
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-GraphValidationLanguageModel
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-ConstructionCleanup
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-Lifecycle
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-UseAfterDispose
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-StateDispose
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-StateDisposeSafe
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboNetworks-DisposeAll
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-EncoderOutputs
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-Reuse
            tests:
              - OnnxChatterboxTurboEnglishSynthesisModel_CreateBackend_SyntheticInstall_SynthesizesAudio
              - OnnxChatterboxTurboSynthesisEngine_Generate_ScriptedTokens_AssemblesPromptAndDecoderInput

          - id: SpeechOnnxChatterboxTurbo-Synthesis-OnnxBackendSampleRate
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall report the true 24 kHz
              output sample rate of the audio it produces.
            justification: |
              The Speech library resamples and mixes based on the true rate of the audio.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SampleRate
            tests:
              - OnnxChatterboxTurboSynthesisEngine_SampleRate_Is24Kilohertz

          - id: SpeechOnnxChatterboxTurbo-Synthesis-VoiceConditioning
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall condition every utterance
              on the voice selected by speaker id, falling back to the first voice for an
              out-of-range id.
            justification: |
              The selected voice defines how the speech sounds, and a safe fallback keeps a bad
              id from failing synthesis.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Voices
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-VoiceFallback
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodUnknownSpeaker
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack

          - id: SpeechOnnxChatterboxTurbo-Synthesis-VoiceCaching
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall encode each reference voice
              only once.
            justification: |
              Encoding a clip is expensive and deterministic, so caching it keeps per-sentence
              latency low.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-VoiceCaching
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboConditioning-Reuse
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_Voices_AreEncodedOnceAndFallBack

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodConditioning
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall condition a mood segment on
              the selected voice's clip for that mood, encoding each mood clip only once.
            justification: |
              Moods are realized by switching the reference clip, and per-mood encoding is
              expensive and deterministic.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodConditioning
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodClipCaching
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodFallback
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall condition a mood segment on
              the voice's base clip when the selected voice has no clip for that mood.
            justification: |
              A voice that lacks a mood must still be spoken rather than fail.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodFallback
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMissing_FallsBackToBaseClip

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodMarkerHiding
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall never speak any control
              character that stands for a mood, whether written by the capability profile or
              present in the text handed to the tokenizer.
            justification: |
              A mood is realized by switching clips, so no control character standing for a
              mood may be spoken.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MoodMarkerHidden
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MoodMarker_UsesMoodClipOnceAndHidesMarker

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodMarkerCallerSupplied
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall ignore any mood control
              character and any tag placeholder character present in the caller's text, so a
              caller cannot forge a mood or a native tag.
            justification: |
              A forged control character would let caller text select a reference clip or leak
              into speech.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MarkerSafety
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-PlaceholderSafety
            tests:
              - ChatterboxTurboCapabilityProfile_Render_PlaceholderCharactersInUserText_AreRemoved

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodMarkerOnlyText
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall return empty audio for text
              that holds only mood tags.
            justification: |
              A mood with no speech has nothing to synthesize and must not fail.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-MarkerOnlyText
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MarkerOnlyText_ReturnsEmptyAudio

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagProfile
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall render the laugh,
              throat-clear and gasp audio tags as the model's own sounds inside the sentence.
            justification: |
              The model's tag behavior is model-specific, so the policy belongs with the
              package rather than the generic Speech library renderer.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NativeTags
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NativeTagThroatClear
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NativeTagGasp
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NativeTagInline
            tests:
              - ChatterboxTurboCapabilityProfile_Render_MidSentenceLaugh_StaysInlineWithNativeToken

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagSilence
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall render the sigh and pause
              audio tags as silence.
            justification: |
              The model has no usable token for these tags, so real silence is the faithful
              rendering.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Silence
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-ShortPauseSilence
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-LongPauseSilence
            tests:
              - ChatterboxTurboCapabilityProfile_Render_Sigh_BecomesSilenceSegment
              - ChatterboxTurboCapabilityProfile_Render_ShortPause_BecomesThreeHundredMillisecondSilence
              - ChatterboxTurboCapabilityProfile_Render_LongPause_BecomesNineHundredMillisecondSilence

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagOmission
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall omit every audio tag the
              model cannot reproduce.
            justification: |
              The model mispronounces unknown brackets, so tags it cannot render must become
              nothing.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Unsupported
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TagOnlyDropped
            tests:
              - ChatterboxTurboCapabilityProfile_Render_UnsupportedTags_NeverEmitBracketText

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagInputSafety
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall render empty, whitespace-only
              or otherwise invalid text as an empty plan without failing.
            justification: |
              Rendering must never fail a synthesis call on degenerate input.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-InvalidInput
            tests:
              - ChatterboxTurboCapabilityProfile_Render_EmptyInput_ProducesEmptyPlan
              - ChatterboxTurboCapabilityProfile_Render_WhitespaceOnlyText_ProducesEmptyPlan

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagNullArguments
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall reject null arguments when
              rendering text.
            justification: |
              A null argument is a programming error and must surface clearly.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NullArguments
            tests:
              - ChatterboxTurboCapabilityProfile_Render_NullArguments_Throw

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagRelocation
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall move a tag that would end a
              sentence before the final word when the EndOfSentenceTagPolicy option is
              MoveBeforeFinalWord, which is the default.
            justification: |
              A tag with no speech after it makes the model misbehave.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTag
            tests:
              - ChatterboxTurboCapabilityProfile_Render_TrailingTag_MoveBeforeFinalWord_RelocatesTag

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagSuffixing
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall suffix a tag that would end
              a sentence when the host sets the EndOfSentenceTagPolicy option to Suffix, and
              shall drop such a tag when it has no suffixed form.
            justification: |
              A host may prefer to keep the tag at the end of the sentence.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTagSuffix
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTagSuffixDrop
            tests:
              - ChatterboxTurboCapabilityProfile_Render_TrailingTag_Suffix_AppendsSuffixedTag
              - ChatterboxTurboCapabilityProfile_Render_TrailingTag_SuffixWithoutSuffixForm_DropsTag

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagStripping
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall strip a tag that would end a
              sentence when the host sets the EndOfSentenceTagPolicy option to Strip.
            justification: |
              A host may prefer silence over a tag at the end of a sentence.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTagStrip
            tests:
              - ChatterboxTurboCapabilityProfile_Render_TrailingTag_Strip_DropsTag

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagPolicyValidation
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall reject an undefined
              EndOfSentenceTagPolicy value.
            justification: |
              An undefined policy must fail early instead of producing odd audio.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-PolicyValidation
            tests:
              - ChatterboxTurboCapabilityProfile_Constructor_UndefinedPolicy_ThrowsArgumentOutOfRangeException

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagBetweenSentences
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall keep a tag between
              sentences with the speech that follows it.
            justification: |
              A tag that stands alone has no speech to attach to.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TagBetweenSentences
            tests:
              - ChatterboxTurboCapabilityProfile_Render_TagBetweenSentences_LeadsNextSentence

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TagOnlyChunk
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall join a chunk holding only a
              trailing tag to the previous unit.
            justification: |
              A chunk of only a tag has no speech to carry it.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-TrailingTagOnlyChunk
            tests:
              - ChatterboxTurboCapabilityProfile_Render_TrailingTagOnlyChunk_JoinsPreviousUnit

          - id: SpeechOnnxChatterboxTurbo-Synthesis-Segmentation
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall split text into sentences
              of at most 200 characters of source text (each audio tag counting as one
              character), keeping every word.
            justification: |
              The model degrades on long inputs, and splitting must never lose speech.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Segmentation
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-EllipsisPause
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-DigitFlankedStop
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-LongSentences
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-LongSentenceClauses
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-LongSentenceBudget
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-OverLongToken
            tests:
              - ChatterboxTurboCapabilityProfile_Render_LongSentence_IsSplitKeepingEveryWord

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodTags
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall turn the fifteen mood audio
              tags into per-segment moods that select the matching reference-clip mood.
            justification: |
              The model has no emotion tokens, so moods are realized by switching the reference
              clip per segment.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-Moods
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodAliases
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodPersistence
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodLastWins
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-NonMoodTags
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarker
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarkerLookup
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodMarkerNone
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodTagPolicy
            tests:
              - ChatterboxTurboCapabilityProfile_Render_MoodTag_MarksFollowingTextWithMood

          - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodSeamSilence
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall hide the seam between moods
              with a silence of 150 ms by default, which the host can configure from 0 (off)
              to 1000 ms.
            justification: |
              A change of reference clip is audible, so a short silence at the change hides the
              seam.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilence
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceDisabled
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceOverlap
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceEllipsisWins
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceValidation
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboCapabilityProfile-MoodJoinSilenceRange
            tests:
              - ChatterboxTurboCapabilityProfile_Render_MoodChange_AddsJoinSilenceOnlyAtChanges

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationBounds
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall stop generation after at
              most 1024 speech tokens by default, a maximum the host can configure.
            justification: |
              Without a bound a missing end-of-speech token would never terminate.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Bounds
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationProportionalBound
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall stop generation after 25
              speech tokens per text token by default (a ratio the host can configure) plus a
              fixed slack of 32 tokens.
            justification: |
              A runaway generation on short text must end long before the absolute maximum.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-ProportionalBound
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_ProportionalBound_StopsRunawayEarly

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationStop
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall end generation at the
              end-of-speech token.
            justification: |
              Breaking a token loop must never prevent the model from ending speech.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-StopToken
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_StopAfterCappedRun_EndsWithoutTruncation
              - OnnxChatterboxTurboSynthesisEngine_Generate_CapOfOne_StopTokenIsNeverExcluded

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationTruncation
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall flag a result that hit a
              generation bound as truncated.
            justification: |
              A bounded utterance is a degraded result, and a host can tell it from a complete
              one.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-Truncation
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationNoException
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall never throw for hitting a
              generation bound.
            justification: |
              A bounded utterance is a degraded result, not a failure.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-BoundNoException
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_NeverStops_IsBoundedAndFlagged

          - id: SpeechOnnxChatterboxTurbo-Synthesis-GenerationSegmentGuards
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall apply the generation bounds
              to each mood segment separately.
            justification: |
              A runaway segment must not consume the budget of the segments after it.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-SegmentGuards
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_MarkedSegments_GuardsApplyPerSegment

          - id: SpeechOnnxChatterboxTurbo-Synthesis-RepetitionGuard
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall limit identical consecutive
              speech tokens to 12 by default, a cap the host can configure or turn off with 0,
              while still allowing the speech to end.
            justification: |
              Without a cap the model loops on a single token.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCap
              - SpeechOnnxChatterboxTurbo-Synthesis-OnnxChatterboxTurboSynthesisEngine-RunLengthCapDisabled
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-BlockedToken
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-BlockedTokenInHistory
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-BlockedTokenOutOfRange
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-StopToken
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-SingleId
            tests:
              - OnnxChatterboxTurboSynthesisEngine_Generate_StuckToken_IsCappedAtRunLength

          - id: SpeechOnnxChatterboxTurbo-Synthesis-RepetitionPenalty
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall make a recently generated
              speech token less likely to be chosen again, without forbidding a repeat whose
              score is far ahead.
            justification: |
              A mild penalty discourages loops while keeping legitimately repeated tokens.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-RepetitionPenalty
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-RepetitionPenaltyNegative
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-RepetitionPenaltyBounded
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-OutOfRangeHistory
            tests:
              - ChatterboxTurboTokenSelector_Select_RepeatedPositive_IsPenalized

          - id: SpeechOnnxChatterboxTurbo-Synthesis-TokenSelection
            title: >-
              The SpeechOnnxChatterboxTurbo SynthesisSubsystem shall choose speech tokens
              deterministically, resolving ties to the lowest id, never choosing a token whose
              score is not a number, and rejecting empty scores and a missing history.
            justification: |
              Reproducible, crash-free selection is the base of the generation loop.
            children:
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-Selection
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-TieBreak
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-Deterministic
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-NonFinite
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-NaNNeverChosen
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-PositiveInfinity
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-NegativeInfinity
              - SpeechOnnxChatterboxTurbo-Synthesis-ChatterboxTurboTokenSelector-InvalidArguments
            tests:
              - ChatterboxTurboTokenSelector_Select_NoHistory_ReturnsArgmax
              - ChatterboxTurboTokenSelector_Select_Ties_ResolveToLowestId
