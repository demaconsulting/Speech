---
# Software System Requirements for SpeechOnnxChatterboxTurbo
#
# These requirements describe the externally visible behavior of the SpeechOnnxChatterboxTurbo
# library (DemaConsulting.Speech.Onnx.ChatterboxTurbo) from the perspective of a host application
# consuming it, without specifying implementation details. SpeechOnnxChatterboxTurbo is a sibling
# system to Speech: it supplies a concrete, ONNX-Runtime-backed Chatterbox Turbo (English,
# reference-clip voice-cloning) text-to-speech model and inference engine through the Speech
# library's ISynthesisModel extension seam, ships as its own package, and is versioned as part of
# this repository. The Speech library never depends on it.
#
# Covered by test/DemaConsulting.Speech.Onnx.ChatterboxTurbo.Tests/SpeechOnnxChatterboxTurboTests.cs
# (system-level tests over a synthetic install, through the Speech library's real pipeline) - see the
# subsystem/unit-level reqstream files under docs/reqstream/speech-onnx-chatterboxturbo/ for the
# unit tests these system requirements decompose into.

sections:
  - title: SpeechOnnxChatterboxTurbo Requirements
    requirements:
      - id: SpeechOnnxChatterboxTurbo-Models-AddChatterboxTurboModels
        title: >-
          The library shall let a host register its ONNX-Runtime-backed Chatterbox Turbo
          synthesis model, together with the reference voices it should clone, with a Speech
          library SpeechModelCatalog through a single AddChatterboxTurboModels() call that
          returns the same catalog for chaining.
        tags: [system]
        justification: |
          The Speech library's catalog ships empty and carries no ONNX Runtime dependency, so a
          host needs one discoverable, opt-in entry point to make this package's model available
          for enumeration, download, and composition, composable with registrations from any
          other model package.
        children:
          - SpeechOnnxChatterboxTurbo-Models-CatalogRegistration
          - SpeechOnnxChatterboxTurbo-Models-ModelOptions
          - SpeechOnnxChatterboxTurbo-Models-ModelOptionsValidation
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_AddChatterboxTurboModels_RegistersModelAndReturnsCatalog

      - id: SpeechOnnxChatterboxTurbo-Models-SynthesisModel
        title: >-
          The library shall provide a real, downloadable English synthesis model implementing
          the Speech library's ISynthesisModel contract, available in selectable precision
          variants.
        tags: [system]
        justification: |
          A host needs a real, checksum-verified, installable synthesis model to perform offline
          text-to-speech with this model family, and precision variants let a host trade
          download size against fidelity.
        children:
          - SpeechOnnxChatterboxTurbo-Models-ModelDescription
          - SpeechOnnxChatterboxTurbo-Models-ModelDownload
          - SpeechOnnxChatterboxTurbo-Models-BackendCreation
          - SpeechOnnxChatterboxTurbo-Models-BackendCreationFailures
          - SpeechOnnxChatterboxTurbo-Models-BackendCreationCleanup
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_RegisteredModel_IsDownloadableWithVariantsAndVoices

      - id: SpeechOnnxChatterboxTurbo-Models-EmbeddedTokenizer
        title: >-
          The library shall turn text into the token ids the model was trained on without
          requiring any separate tokenizer download.
        tags: [system]
        justification: |
          The graphs do not tokenize text themselves, and the language model is only correct for
          the exact ids its training tokenizer produced.
        children:
          - SpeechOnnxChatterboxTurbo-Models-TextTokenization
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_EmbeddedTokenizer_SynthesizesWithoutTokenizerDownload

      - id: SpeechOnnxChatterboxTurbo-Synthesis-RealBackend
        title: >-
          The library shall synthesize audible speech from text through the Speech library's
          synthesis pipeline, running the Chatterbox Turbo model locally on the CPU.
        tags: [system]
        justification: |
          The Speech library's synthesis policy is verified against a fake backend; only a real
          backend turns rendered text into audible speech for this package's synthesis model.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-OnnxBackend
          - SpeechOnnxChatterboxTurbo-Synthesis-OnnxBackendSampleRate
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_SyntheticInstall_SynthesizesThroughSpeechPipeline

      - id: SpeechOnnxChatterboxTurbo-Synthesis-VoiceCloning
        title: >-
          The library shall accept a caller-supplied reference clip of any sample rate and
          channel count, as in-memory audio or a WAV or FLAC file, as the source of a voice that
          the host can select by id.
        tags: [system]
        justification: |
          Chatterbox Turbo has no built-in voices, so a host must be able to supply clips in the
          formats it already has, and no third-party voice audio can be bundled with the
          package.
        children:
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoices
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceSamples
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceFileErrors
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceArguments
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceNormalization
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceLength
          - SpeechOnnxChatterboxTurbo-Models-ReferenceVoiceMinimumLength
          - SpeechOnnxChatterboxTurbo-Models-VoiceChoice
          - SpeechOnnxChatterboxTurbo-Synthesis-VoiceCaching
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_VoiceCloning_AcceptsAnyRateAndChannelCount

      - id: SpeechOnnxChatterboxTurbo-Synthesis-VoiceConditioningSystem
        title: >-
          The library shall speak in the voice cloned from the selected reference clip.
        tags: [system]
        justification: |
          Conditioning on a short reference clip is this model's distinguishing capability.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-VoiceConditioning
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_VoiceConditioning_UsesSelectedVoiceClip

      - id: SpeechOnnxChatterboxTurbo-Models-StoreVoices
        title: >-
          The library shall offer, without any host code, the voices of the Speech model store's
          reference-voice library (the user's voice folder and the installed voice pack) as
          selectable voices alongside the voices a host supplies.
        tags: [system]
        justification: |
          A host should get a usable voice list as soon as a voice pack is installed or the user
          drops clips in their folder.
        children:
          - SpeechOnnxChatterboxTurbo-Models-StoreReferenceVoices
          - SpeechOnnxChatterboxTurbo-Models-StoreVoiceUniqueness
          - SpeechOnnxChatterboxTurbo-Models-StoreVoiceNaming
          - SpeechOnnxChatterboxTurbo-Models-StoreVoiceOptOutChoice
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_StoreVoices_OfferedByDefaultAndSpoken

      - id: SpeechOnnxChatterboxTurbo-Models-StoreVoicesResilience
        title: >-
          The library shall decode a store voice only when it is used, so a damaged clip never
          prevents the model from loading or the other voices from being used.
        tags: [system]
        justification: |
          A hundred clips must not be decoded at startup, and one damaged clip must not make the
          model unusable.
        children:
          - SpeechOnnxChatterboxTurbo-Models-StoreVoiceLazyLoading
          - SpeechOnnxChatterboxTurbo-Models-StoreVoiceDamagedClip
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_StoreVoicesResilience_DamagedClipDoesNotBlockOtherVoices

      - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodVoices
        title: >-
          The library shall speak text that follows a mood audio tag using the selected voice's
          clip for that mood.
        tags: [system]
        justification: |
          The model has no emotion tokens; switching the reference clip is how a mood is
          expressed.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-MoodTags
          - SpeechOnnxChatterboxTurbo-Synthesis-MoodSeamSilence
          - SpeechOnnxChatterboxTurbo-Synthesis-MoodConditioning
          - SpeechOnnxChatterboxTurbo-Models-StoreVoiceMoods
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_MoodVoices_UseMoodClipWithBaseFallback

      - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodVoiceFallback
        title: >-
          The library shall speak text that follows a mood audio tag using the selected voice's
          base clip when the voice has no clip for that mood.
        tags: [system]
        justification: |
          A voice that lacks a mood must still be spoken rather than fail.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-MoodFallback
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_MoodVoices_UseMoodClipWithBaseFallback

      - id: SpeechOnnxChatterboxTurbo-Synthesis-MoodMarkerHidden
        title: >-
          The library shall never speak any internal mood-carrying character, whether it is
          supplied in the caller's text or added while the text is prepared.
        tags: [system]
        justification: |
          A mood is realized by switching clips, so any internal carrier must never reach the
          speech.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-MoodMarkerHiding
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_MoodMarkerHidden_NeverSpokenOrSynthesized

      - id: SpeechOnnxChatterboxTurbo-Synthesis-NativeTagRendering
        title: >-
          The library shall render the laugh, throat-clear and gasp audio tags as the model's
          own paralinguistic sounds.
        tags: [system]
        justification: |
          The model produces laughs, throat clears and gasps from bracketed tokens, so they are
          rendered as real sounds rather than words.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-TagProfile
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_NativeTagRendering_SilenceInlineOrOmitted

      - id: SpeechOnnxChatterboxTurbo-Synthesis-SilenceTagRendering
        title: >-
          The library shall render the sigh and pause audio tags as real silence of a fixed
          duration.
        tags: [system]
        justification: |
          The model has no usable sound for these tags, so silence is the faithful rendering.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-TagSilence
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_NativeTagRendering_SilenceInlineOrOmitted

      - id: SpeechOnnxChatterboxTurbo-Synthesis-OmittedTagRendering
        title: >-
          The library shall omit every audio tag the model cannot reproduce, so no tag is ever
          spoken as words.
        tags: [system]
        justification: |
          The model ignores or mispronounces other tags, so a tailored policy omits them and
          tagged text never fails or sounds wrong.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-TagOmission
          - SpeechOnnxChatterboxTurbo-Synthesis-TagInputSafety
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_NativeTagRendering_SilenceInlineOrOmitted

      - id: SpeechOnnxChatterboxTurbo-Synthesis-TagPlacement
        title: >-
          The library shall not leave an audio tag without speech after it, by moving the tag
          before the final word, appending it or dropping it according to the configured policy.
        tags: [system]
        justification: |
          A tag with no speech after it makes the model misbehave, so the host chooses how the
          tag is kept next to speech.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-TagRelocation
          - SpeechOnnxChatterboxTurbo-Synthesis-TagSuffixing
          - SpeechOnnxChatterboxTurbo-Synthesis-TagStripping
          - SpeechOnnxChatterboxTurbo-Synthesis-TagBetweenSentences
          - SpeechOnnxChatterboxTurbo-Synthesis-TagOnlyChunk
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_TagPlacement_TrailingTagIsKeptWithSpeech

      - id: SpeechOnnxChatterboxTurbo-Synthesis-LongTextSegmentation
        title: >-
          The library shall speak text of any length by splitting it into sentences of at most
          200 characters, keeping every word.
        tags: [system]
        justification: |
          The model degrades on long inputs, and splitting must never lose speech.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-Segmentation
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_LongTextSegmentation_SplitsAndSpeaksEverySentence

      - id: SpeechOnnxChatterboxTurbo-Synthesis-RunawayProtection
        title: >-
          The library shall bound every generation so a failure to emit the end-of-speech token
          yields a truncated utterance after a bounded amount of work rather than an unbounded
          loop or an exception.
        tags: [system]
        justification: |
          An autoregressive model can fail to stop on unusual inputs; an unbounded loop would
          hang a host application and exhaust memory.
        children:
          - SpeechOnnxChatterboxTurbo-Synthesis-GenerationBounds
          - SpeechOnnxChatterboxTurbo-Synthesis-GenerationProportionalBound
          - SpeechOnnxChatterboxTurbo-Synthesis-GenerationStop
          - SpeechOnnxChatterboxTurbo-Synthesis-GenerationTruncation
          - SpeechOnnxChatterboxTurbo-Synthesis-GenerationNoException
          - SpeechOnnxChatterboxTurbo-Synthesis-GenerationSegmentGuards
          - SpeechOnnxChatterboxTurbo-Synthesis-RepetitionGuard
        tests:
          - SpeechOnnxChatterboxTurbo_SystemIntegration_RunawayProtection_BoundsGenerationWithoutException
