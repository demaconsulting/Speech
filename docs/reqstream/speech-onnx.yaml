---
# Software System Requirements for SpeechOnnx
#
# These requirements describe the externally visible behavior of the SpeechOnnx library
# (DemaConsulting.Speech.Onnx) from the perspective of a model package consuming it, without
# specifying implementation details. SpeechOnnx is a sibling system to Speech: it supplies
# generic ONNX Runtime infrastructure - today, execution-provider probing and selection - reusable
# by any ONNX-Runtime-backed model package (for example the sibling
# DemaConsulting.Speech.Onnx.Kokoro package), and declares zero models itself.
#
# Covered by test/DemaConsulting.Speech.Onnx.Tests - see
# docs/reqstream/speech-onnx/onnx-runtime-subsystem/onnx-execution-provider-selector.yaml for the
# unit-level tests: lists this system requirement's child decomposes into.

sections:
  - title: SpeechOnnx Requirements
    requirements:
      - id: SpeechOnnx-Runtime-ProviderFallback
        title: >-
          The library shall let a model package build an ONNX Runtime InferenceSession that
          opportunistically prefers an ordered list of accelerated execution providers, each
          optionally verified with a caller-supplied representative-inference probe, before
          falling back to the always-available CPU provider, without requiring the package to
          reference any provider-specific native runtime at compile time, and without leaking the
          native SessionOptions or InferenceSession resources used to try each candidate.
        tags: [system]
        justification: |
          A raw ONNX model package must run correctly on a machine with no accelerated execution
          provider installed, and should transparently benefit from one when a consuming
          application supplies it - including degrading gracefully when a provider loads
          successfully but cannot actually run the model's graph (observed with DirectML).
          Centralizing this fallback, probing, and resource-disposal logic in one shared,
          once-reviewed helper means every model package built on this library gets identical
          provider-selection behavior rather than duplicating or re-introducing a resource leak
          in its own code.
        children:
          - SpeechOnnx-Runtime-OnnxExecutionProviderSelector-ProviderFallback
        tests:
          - Create_NoPreferredProviders_CreatesWorkingCpuSession
          - Create_UnknownProviderName_FallsBackToCpuSession
          - Create_ValidateSessionProbeThrowsOnnxRuntimeException_DisposesCandidateAndFallsBackToCpuWithoutProbingFallback
          - Create_ValidateSessionProbeThrowsOtherException_Rethrows
