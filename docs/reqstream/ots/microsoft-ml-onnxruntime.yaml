---
# Microsoft.ML.OnnxRuntime OTS Software Requirements
#
# Requirements for the Microsoft.ML.OnnxRuntime managed ONNX inference API.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Microsoft.ML.OnnxRuntime Requirements
        requirements:
          - id: Speech-OTS-MicrosoftMlOnnxRuntime-CpuInference
            title: >-
              Microsoft.ML.OnnxRuntime shall provide a CPU inference session for a well-formed
              ONNX model without requiring any accelerated execution provider.
            justification: |
              The SpeechOnnx model packages must always be able to load their graphs; the
              built-in CPU provider is the guaranteed final fallback of the shared execution
              provider selector.
            tags: [ots]
            tests:
              - OnnxExecutionProviderSelector_Create_NoPreferredProviders_CreatesWorkingCpuSession

          - id: Speech-OTS-MicrosoftMlOnnxRuntime-ProviderFallback
            title: >-
              Microsoft.ML.OnnxRuntime shall report an unrecognized execution provider through
              OnnxRuntimeException.
            justification: |
              Accelerated providers are optional and machine-dependent; the selector's layered
              fallback relies on an unrecognized provider name surfacing as an
              OnnxRuntimeException rather than as a crash or a silently broken session. The test
              observes the resulting fallback to a working CPU session; the exception itself is
              caught inside the selector and is therefore evidenced indirectly.
            tags: [ots]
            tests:
              - OnnxExecutionProviderSelector_Create_UnknownProviderName_FallsBackToCpuSession

          - id: Speech-OTS-MicrosoftMlOnnxRuntime-ProbeFailureFallback
            title: Microsoft.ML.OnnxRuntime shall report a failed probe inference through OnnxRuntimeException.
            justification: |
              A candidate execution provider can construct a session that then fails at inference
              time; the selector's fallback relies on that failure surfacing as an
              OnnxRuntimeException. The test provokes a genuine OnnxRuntimeException with a
              wrong-typed input, which stands in for an accelerated-provider probe failure.
            tags: [ots]
            tests:
              - OnnxExecutionProviderSelector_Create_ValidateSessionProbeThrowsOnnxRuntimeException_DisposesCandidateAndFallsBackToCpuWithoutProbingFallback

          - id: Speech-OTS-MicrosoftMlOnnxRuntime-TensorBinding
            title: >-
              Microsoft.ML.OnnxRuntime shall bind typed tensor inputs and outputs, including
              cache tensors carried between steps, for the model packages' network wrappers.
            justification: |
              The Chatterbox Turbo and Nemotron engines run autoregressive and streaming graphs
              whose caches are fed back on every step, so correct tensor binding is essential.
            tags: [ots]
            tests:
              - OnnxChatterboxTurboNetworks_Encode_NamedOutputs_ReturnsConditioning
              - OnnxChatterboxTurboNetworks_Step_TwoSteps_ReusesCacheAndReturnsLastLogits
              - NemotronEncoder_Encode_SecondChunk_UsesPreviousCaches
              - OnnxChatterboxTurboNetworks_Encode_UnnamedFourOutputs_BindsPositionally
