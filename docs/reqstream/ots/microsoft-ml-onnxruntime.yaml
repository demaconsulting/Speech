---
# Microsoft.ML.OnnxRuntime OTS Software Requirements
#
# Requirements for the Microsoft.ML.OnnxRuntime managed ONNX inference API.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Microsoft.ML.OnnxRuntime Requirements
        requirements:
          - id: Speech-OTS-MicrosoftMlOnnxRuntime-CpuInference
            title: >-
              Microsoft.ML.OnnxRuntime shall provide a CPU inference session for a well-formed
              ONNX model without requiring any accelerated execution provider.
            justification: |
              The SpeechOnnx model packages must always be able to load their graphs; the
              built-in CPU provider is the guaranteed final fallback of the shared execution
              provider selector.
            tags: [ots]
            tests:
              - Create_NoPreferredProviders_CreatesWorkingCpuSession

          - id: Speech-OTS-MicrosoftMlOnnxRuntime-ProviderFallback
            title: >-
              Microsoft.ML.OnnxRuntime shall report an unusable or unrecognized execution
              provider through its documented OnnxRuntimeException so the selector can fall
              back to the CPU provider.
            justification: |
              Accelerated providers are optional and machine-dependent; the selector's layered
              fallback relies on a failing provider (including an unrecognized provider name, or
              a candidate session whose probe inference fails) surfacing as an
              OnnxRuntimeException rather than as a crash or a silently broken session.
            tags: [ots]
            tests:
              - Create_UnknownProviderName_FallsBackToCpuSession
              - Create_ValidateSessionProbeThrowsOnnxRuntimeException_DisposesCandidateAndFallsBackToCpuWithoutProbingFallback

          - id: Speech-OTS-MicrosoftMlOnnxRuntime-TensorBinding
            title: >-
              Microsoft.ML.OnnxRuntime shall bind typed tensor inputs and outputs, including
              cache tensors carried between steps, for the model packages' network wrappers.
            justification: |
              The Chatterbox Turbo and Nemotron engines run autoregressive and streaming graphs
              whose caches are fed back on every step, so correct tensor binding is essential.
            tags: [ots]
            tests:
              - OnnxChatterboxTurboNetworks_Encode_NamedOutputs_ReturnsConditioning
              - OnnxChatterboxTurboNetworks_Step_TwoSteps_ReusesCacheAndReturnsLastLogits
              - Encode_SecondChunk_UsesPreviousCaches
