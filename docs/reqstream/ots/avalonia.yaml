---
# Avalonia OTS Software Requirements
#
# Requirements for the Avalonia cross-platform UI framework used by the demo application.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Avalonia Requirements
        requirements:
          - id: SpeechDemo-OTS-Avalonia-DesktopApplicationHost
            title: Avalonia shall provide the cross-platform desktop application host.
            justification: |
              The demo has to run on the same desktop platforms the library supports, so a
              Windows-only UI framework was not an option. Avalonia supplies one XAML-based
              application host that runs on Windows, Linux, and macOS, letting the demo prove
              the library is consumable from a real cross-platform application without writing
              a separate front end per operating system.

              Automated verification is limited to configuring the application host, because a
              CI runner has no display and starting a windowing lifetime would prove nothing
              about the demo that the ViewModel tests do not already prove. Styling (Fluent
              theme, Inter font) and the XAML view layer are deliberately outside this
              requirement; they are checked by compiled bindings at build time and by manual
              visual inspection.
            tags: [ots]
            tests:
              - Avalonia_DemoApplication_Inspected_DerivesFromAvaloniaApplication

          - id: SpeechDemo-OTS-Avalonia-ApplicationBuilderConfiguration
            title: Avalonia shall configure the application host through its application builder.
            justification: |
              The demo's process entry point starts the UI by configuring an Avalonia application
              builder bound to the demo's application type; that configuration must succeed
              against the referenced packages for the demo to start at all.
            tags: [ots]
            tests:
              - Avalonia_BuildAvaloniaApp_Invoked_ReturnsConfiguredApplicationBuilder
