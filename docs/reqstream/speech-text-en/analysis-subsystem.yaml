---
# Software Subsystem Requirements for the SpeechTextEn AnalysisSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechTextEn AnalysisSubsystem,
# decomposing the system-level requirements in docs/reqstream/speech-text-en.yaml. This subsystem
# supplies the English text analyzer (EnglishTextAnalyzer), its options
# (EnglishTextAnalyzerOptions), the annotation vocabulary and typed reader (TextEnAnnotations), the
# internal seam over the part-of-speech tagging package (PartOfSpeechAdapter), and the aggregate
# diagnostics reporter (AnalysisDiagnostics). It drives the NormalizationSubsystem, which never
# depends on it, and turns the normalization result into annotations and sentence breaks. Each
# requirement states one observable behavior.
#
# Unit-level content lives in per-unit files under
# docs/reqstream/speech-text-en/analysis-subsystem/. Covered by
# test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/AnalysisSubsystemTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        requirements:
          - id: SpeechTextEn-Analysis-AnalyzerContract
            title: >-
              The AnalysisSubsystem shall provide an analyzer that implements the Speech
              library's text-analysis contract, keeps no state about analyzed texts between
              requests, serves concurrent requests, honors cancellation at any point (never
              returning a result or reporting diagnostics for a canceled request), and also
              offers a richer, local-only analysis result.
            justification: |
              The Speech library calls one analyzer instance for every request on thread-pool
              threads and expects it to stop when the operation is canceled; the richer result
              lets a model package and tests see every token without going through the
              language-neutral annotations. The statement about retained state is scoped to this
              library's own state; the tagging package's per-thread working buffer is a documented
              limitation of that dependency (see the system design).
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-Cancellation
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-ArgumentValidation
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-ConcurrencyAndNoRetainedReferences
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedAnalysis
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-EmptyText
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-Cancellation
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-ArgumentValidation
            tests:
              - AnalysisSubsystem_Analyze_CancellationRequested_ThrowsOperationCanceledExceptionAndReportsNothing
              - AnalysisSubsystem_Analyze_CancellationDuringLastSentence_ThrowsOperationCanceledExceptionAndReportsNothing
              - AnalysisSubsystem_Analyze_ManyConcurrentRequests_LoadTaggerOnceAndAgree

          - id: SpeechTextEn-Analysis-PartOfSpeechAnnotations
            title: >-
              The AnalysisSubsystem shall annotate each word token of the analyzed text with its
              Universal Dependencies part of speech on the word's exact source span, shall name
              and read back that annotation through a documented vocabulary, and shall let the
              options switch it off independently of the normalization annotations.
            justification: |
              This decomposes the system part-of-speech requirement: the analyzer produces the
              annotation, the options select it (together with the normalization annotations by
              default), and the vocabulary gives a backend a typed way to read it.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-WordAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-WellFormedAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-OptionsSelection
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Defaults
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Initialization
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-SelectionValidation
              - SpeechTextEn-Analysis-TextEnAnnotations-KindNames
              - SpeechTextEn-Analysis-TextEnAnnotations-ReadPartOfSpeech
              - SpeechTextEn-Analysis-TextEnAnnotations-ReadArgumentValidation
            tests:
              - AnalysisSubsystem_Analyze_Sentence_AnnotationsReadBackThroughTypedReader
              - AnalysisSubsystem_Analyze_PartOfSpeechNotSelected_ProducesNoAnnotationsButSentenceBreaks

          - id: SpeechTextEn-Analysis-NormalizationAnnotations
            title: >-
              The AnalysisSubsystem shall run the normalization on the tokens of the analyzed
              text when the options select it, without loading the tagger for it, shall emit each
              normalization as an annotation of the normalization kind on its span, merged in
              text order with the part-of-speech annotations (the part of speech first at an equal
              start), shall return sentence breaks reconciled with the abbreviation readings, shall
              name and read back the annotation through the documented vocabulary, and shall offer
              the normalizations and clitic roles in the detailed result.
            justification: |
              The normalization subsystem describes how spans are spoken and edits the sentence
              breaks; this subsystem puts the result in the language-neutral form the Speech
              library carries to a backend, keeps the annotations in the order the library
              expects, and, since the sentence breaks are the analyzer's single opinion, hands
              over the reconciled list. The richer result gives a model package and tests the
              data that has no place in the annotations.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-NormalizationAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-ReconciledBreaks
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedNormalization
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-NormalizationSelection
              - SpeechTextEn-Analysis-TextEnAnnotations-ReadNormalized
            tests:
              - AnalysisSubsystem_Analyze_NormalizedText_AnnotationsReadBackAndBreaksAreReconciled
              - EnglishTextAnalyzer_Analyze_AbbreviationToken_EmitsPartOfSpeechThenNormalization
              - EnglishTextAnalyzer_Analyze_NormalizationOnly_LoadsNoTaggerAndEmitsOnlyNormalizations
              - EnglishTextAnalyzer_Analyze_NormalizationNotSelected_KeepsTokenizerBreaksAndEmitsNoNormalization
              - EnglishTextAnalyzer_AnalyzeDetailed_NormalizedText_ListsNormalizationsAndCliticRoles

          - id: SpeechTextEn-Analysis-SharedTagger
            title: >-
              The AnalysisSubsystem shall obtain the part-of-speech tagger lazily and at most once
              per process (retrying after a failed attempt rather than remembering the failure),
              and shall not load it for an analyzer that is never invoked, for an empty text, or
              when part-of-speech annotation is not selected.
            justification: |
              The tagger inflates about 1.3 MB of embedded data on first use. A host that
              constructs an analyzer but never speaks, or does not want tags, must not pay that
              cost, concurrent first requests must not each load their own copy, and one failed
              load must not disable analysis for the rest of the process.
            children:
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-LazySingleTagger
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-SplitWithoutTagger
            tests:
              - AnalysisSubsystem_Analyze_UnusedOrUntaggedAnalyzer_NeverLoadsTagger
              - AnalysisSubsystem_Analyze_ManyConcurrentRequests_LoadTaggerOnceAndAgree

          - id: SpeechTextEn-Analysis-SentenceBoundaries
            title: >-
              The AnalysisSubsystem shall supply, as a non-null list, the offset of the first word
              of every sentence after the first, with sentences determined by the tagger package's
              tokenizer (and, when normalization is selected, reconciled with the readings of
              abbreviations) and offsets that index the exact analyzed text.
            justification: |
              A non-null list is what makes the analyzer's opinion authoritative to the Speech
              library even when it finds no break, and offsets into the exact input are what the
              library re-bases onto its segments.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-SentenceBreaks
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-SourceOffsets
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-TagReporting
            tests:
              - AnalysisSubsystem_Analyze_MultiSentenceText_ReturnsAuthoritativeBreaks

          - id: SpeechTextEn-Analysis-PlaceholderNeutrality
            title: >-
              The AnalysisSubsystem shall analyze a text containing audio-tag placeholders exactly
              as it would analyze the same text with each placeholder replaced by a space, so that
              no annotation covers a placeholder and the words around it keep their context.
            justification: |
              A same-length replacement keeps every offset valid for the original text, and
              analyzing across the replaced position is what carries context over an inline audio
              tag.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-Placeholders
            tests:
              - AnalysisSubsystem_Analyze_PlaceholderBetweenWords_IsNeverCoveredAndContextIsCarried

          - id: SpeechTextEn-Analysis-DiagnosticsAggregation
            title: >-
              The AnalysisSubsystem shall report one event of counts per completed analysis to the
              optional diagnostics sink, counting sentences, tokens, annotations, unknown words,
              normalizations, ambiguous readings and numeric fallbacks, built from fixed words and numbers only,
              shall report nothing when no sink is configured or the analysis is canceled, and
              shall contain a failing sink.
            justification: |
              This decomposes the system diagnostics requirement into the reporter's observable
              behavior: aggregate counts, one event, no text, and failure containment.
            children:
              - SpeechTextEn-Analysis-AnalysisDiagnostics-SingleCountsEvent
              - SpeechTextEn-Analysis-AnalysisDiagnostics-NormalizationCounts
              - SpeechTextEn-Analysis-AnalysisDiagnostics-NoTextContent
              - SpeechTextEn-Analysis-AnalysisDiagnostics-NullSink
              - SpeechTextEn-Analysis-AnalysisDiagnostics-SinkFailureContained
            tests:
              - AnalysisSubsystem_Analyze_Request_ReportsOneCountsOnlyDiagnostic
              - AnalysisSubsystem_Analyze_ThrowingDiagnosticsSink_StillReturnsSameResult
              - AnalysisSubsystem_Analyze_CancellationRequested_ThrowsOperationCanceledExceptionAndReportsNothing
