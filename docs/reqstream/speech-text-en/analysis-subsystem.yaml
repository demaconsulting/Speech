---
# Software Subsystem Requirements for the SpeechTextEn AnalysisSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechTextEn AnalysisSubsystem,
# decomposing the system-level requirements in docs/reqstream/speech-text-en.yaml. This subsystem
# supplies the English text analyzer (EnglishTextAnalyzer), its options
# (EnglishTextAnalyzerOptions), the annotation vocabulary and typed readers (TextEnAnnotations), the
# immutable dictionary of host-supplied pronunciation overrides (PronunciationOverrides), the
# internal seam over the part-of-speech tagging package (PartOfSpeechAdapter), and the aggregate
# diagnostics reporter (AnalysisDiagnostics). It drives the NormalizationSubsystem, which never
# depends on it, and the HeteronymSubsystem (reading inventory and classifier), which never depends
# on it either, and turns their results into annotations and sentence breaks. Each
# requirement states one observable behavior.
#
# Unit-level content lives in per-unit files under
# docs/reqstream/speech-text-en/analysis-subsystem/. Covered by
# test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/AnalysisSubsystemTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        requirements:
          - id: SpeechTextEn-Analysis-AnalyzerContract
            title: >-
              The AnalysisSubsystem shall provide an analyzer that implements the Speech library's
              text-analysis contract, gives every request a result that does not depend on earlier
              requests, serves concurrent requests (including the first ones that race on a fresh
              analyzer) and lets a later request succeed after an earlier one failed because the
              part-of-speech tagger could not be created, honors cancellation at any point (never
              returning a result or reporting diagnostics for a canceled request), supplies as a
              non-null list the offset of the first word of every sentence after the first (sentences
              determined by the tagger package's tokenizer and, when normalization is selected,
              reconciled with the readings of abbreviations, with offsets that index the exact
              analyzed text), analyzes a text containing audio-tag placeholders exactly as it would
              analyze the text with each placeholder replaced by a space, emits only the annotation
              families its options select while still supplying sentence breaks and tokens, and also
              offers a richer, local-only analysis result.
            justification: |
              The Speech library calls one analyzer instance for every request on thread-pool threads
              and expects it to stop when the operation is canceled; the richer result lets a model
              package and tests see every token without going through the language-neutral
              annotations. Independence from earlier requests is the observable side of the
              library's rule that an analyzer must not retain the request text; how the analyzer and
              the tagging package keep no text is recorded in the system design. A non-null list is
              what makes the analyzer's opinion authoritative to the Speech library even when it
              finds no break, and offsets into the exact input are what the library re-bases onto its
              segments. A same-length replacement keeps every offset valid for the original text, and
              analyzing across the replaced position carries context over an inline audio tag. The
              tagger inflates about 1.3 MB of embedded data on first use, so a host that does not
              want tags should not need it, and a failed creation (for example a transient
              out-of-memory condition) must not disable analysis for the rest of the process; how the
              tagger is obtained is a design strategy recorded in the analysis subsystem design.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-Contract
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedAnalysis
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-PartOfSpeechAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-SentenceBreaks
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-Placeholders
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-Resilience
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-TaggedSplit
            tests:
              - AnalysisSubsystem_Analyze_CancellationRequested_ThrowsOperationCanceledExceptionAndReportsNothing
              - AnalysisSubsystem_Analyze_ManyConcurrentRequests_AgreeWithSequentialResult
              - AnalysisSubsystem_Analyze_TaggerFailsOnce_LaterRequestSucceeds
              - AnalysisSubsystem_Analyze_MultiSentenceText_ReturnsAuthoritativeBreaks
              - AnalysisSubsystem_Analyze_PlaceholderBetweenWords_IsNeverCoveredAndContextIsCarried
              - AnalysisSubsystem_Analyze_PartOfSpeechNotSelected_ProducesNoAnnotationsButSentenceBreaks

          - id: SpeechTextEn-Analysis-PartOfSpeechAnnotations
            title: >-
              The AnalysisSubsystem shall annotate each word token of the analyzed text with its
              Universal Dependencies part of speech on the word's exact source span, shall name and
              read back that annotation through a documented vocabulary, and shall let the options
              switch it off independently of the normalization annotations.
            justification: |
              This decomposes the system part-of-speech requirement: the analyzer produces the
              annotation, the options select it (together with the normalization annotations by
              default), and the vocabulary gives a backend a typed way to read it.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-PartOfSpeechAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-AnnotationSelection
              - SpeechTextEn-Analysis-TextEnAnnotations-KindNames
              - SpeechTextEn-Analysis-TextEnAnnotations-Readers
            tests:
              - AnalysisSubsystem_Analyze_Sentence_AnnotationsReadBackThroughTypedReader
              - AnalysisSubsystem_Analyze_PartOfSpeechNotSelected_ProducesNoAnnotationsButSentenceBreaks

          - id: SpeechTextEn-Analysis-NormalizationAnnotations
            title: >-
              The AnalysisSubsystem shall run the normalization on the tokens of the analyzed text
              when the options select it, whether or not part-of-speech annotation is selected, shall
              emit each normalization as an annotation of the normalization kind (or, for a sequence
              of capital letters, the spell-out kind with the same span and value) on its span,
              merged in text order with the part-of-speech annotations (the part of speech first at
              an equal start), shall return sentence breaks reconciled with the abbreviation
              readings, shall name and read back both kinds through the documented vocabulary as one
              replacement family, and shall offer the normalizations (with a spelled flag) and the
              clitic roles in the detailed result.
            justification: |
              The normalization subsystem describes how spans are spoken and edits the sentence
              breaks; this subsystem puts the result in the language-neutral form the Speech library
              carries to a backend, keeps the annotations in the order the library expects, and,
              since the sentence breaks are the analyzer's single opinion, hands over the reconciled
              list. The analyzer chooses the annotation kind from the shape the normalizer decided,
              and the vocabulary lets a backend read the two replacement kinds with one call and
              learn whether the value is letters to speak by name. The richer result gives a model
              package and tests the data that has no place in the annotations. A host that selects
              only normalization gets normalizations alone, without part-of-speech annotations or
              tags.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-NormalizationAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-SentenceBreaks
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedAnalysis
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-AnnotationSelection
              - SpeechTextEn-Analysis-TextEnAnnotations-Readers
            tests:
              - AnalysisSubsystem_Analyze_NormalizedText_AnnotationsReadBackAndBreaksAreReconciled
              - AnalysisSubsystem_Analyze_OverrideAndSpelledText_ReplacementsAndPronunciationsAreDisjoint

          - id: SpeechTextEn-Analysis-OverrideAnnotations
            title: >-
              The AnalysisSubsystem shall supply the pronunciation dictionary as an immutable,
              thread-safe value that is built from entries or from a tab-separated file, whose
              entries (word, case flag, action and payload) and whole size are validated and bounded,
              whose errors name a position and a reason but never content, and whose file format is
              simple enough to maintain by hand, and shall, when its options carry a non-empty
              dictionary and select normalization, resolve the dictionary against the tokens of the
              analyzed text and annotate each matching word on its exact span (a normalization
              annotation with the spoken words, a spell-out annotation with the letters, a
              pronunciation annotation with the scheme and phonemes, and no annotation for a word
              spoken as written), keeping the part-of-speech annotation of the word, never changing
              the analyzed text or the sentence breaks, reading the annotations back through typed
              readers, and rejecting at construction a non-empty dictionary without normalization.
            justification: |
              This decomposes the system override and dictionary requirements into the subsystem's
              behavior: the dictionary validates and bounds what a host supplies, the analyzer asks
              it which tokens match, the normalization pass applies the result, and the annotations
              carry it to a backend in the form the Speech library delivers; the typed readers let a
              backend use the result without parsing strings. An override changes how a word is
              spoken, not where a sentence ends, so the sentence breaks are untouched.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-Overrides
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Settings
              - SpeechTextEn-Analysis-TextEnAnnotations-Readers
              - SpeechTextEn-Analysis-PronunciationOverrides-Matching
              - SpeechTextEn-Analysis-PronunciationOverrides-Contract
              - SpeechTextEn-Analysis-PronunciationOverrides-EntryValidation
              - SpeechTextEn-Analysis-PronunciationOverrides-TsvLoading
              - SpeechTextEn-Analysis-PronunciationOverrides-Immutability
            tests:
              - AnalysisSubsystem_Analyze_OverrideActions_ReadBackThroughTypedReaders

          - id: SpeechTextEn-Analysis-ReadingAnnotations
            title: >-
              The AnalysisSubsystem shall, when its options select the reading family (as they do by
              default) and a heteronym model is available, annotate each whole word token that is a
              form of the reading inventory with an annotation of the reading kind (the reading id)
              and one of the reading-confidence kind (the confidence with three decimals and an
              invariant period), both on exactly the span of the token and after the part-of-speech
              annotation of the word, shall never emit them for a token that carries or lies inside a
              replacement, a spell-out or a pronunciation or that has any other override, shall
              decide each reading in the context of the sentence of the word, shall flag a reading
              below a configurable threshold in the detailed result without withholding it, shall
              name and read back both annotations through the documented vocabulary, shall emit the
              readings of the embedded model by default, none when it is given no model or the family
              is not selected, and continue without readings when the model is damaged or
              incompatible, and shall let a reading entry of the pronunciation dictionary fix the
              reading of a word, emitting the id with a confidence of 1.000 without any model and
              without letting the classifier overrule it, validated against the reading inventory
              when the dictionary is built.
            justification: |
              This decomposes the system reading requirement: the analyzer asks the classifier, the
              options select the family and the threshold, and the vocabulary gives a backend typed
              readers. The annotations sit on the word because they say how it is spoken, so a token
              that another rule has already decided has no reading. A host that does nothing gets
              the readings of the model that ships in the package, and a model that cannot be used
              must degrade the analysis to what it was without it. A classifier is right most of the
              time, not always; the host that knows the reading of a name must be able to say so with
              the dictionary it already uses, and the entry must be checked when it is written
              because a reading id that no word can have would otherwise be silently ignored.
            children:
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-ReadingAnnotations
              - SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedAnalysis
              - SpeechTextEn-Analysis-PartOfSpeechAdapter-TaggedSplit
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-AnnotationSelection
              - SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Settings
              - SpeechTextEn-Analysis-TextEnAnnotations-KindNames
              - SpeechTextEn-Analysis-TextEnAnnotations-Readers
              - SpeechTextEn-Analysis-PronunciationOverrides-EntryValidation
              - SpeechTextEn-Analysis-PronunciationOverrides-Matching
              - SpeechTextEn-Normalization-TokenDirectives
            tests:
              - AnalysisSubsystem_Analyze_ReadingFamily_ReadsBackThroughTypedReadersAndCoexistsWithPartOfSpeech
              - AnalysisSubsystem_Analyze_ReadingOverrideFromTsv_AppliesAndCounts

          - id: SpeechTextEn-Analysis-DiagnosticsAggregation
            title: >-
              The AnalysisSubsystem shall report one event of counts per completed analysis to the
              optional diagnostics sink, counting sentences, tokens, annotations, unknown words,
              normalizations, ambiguous readings, numeric fallbacks, overrides applied and overrides
              ignored, shall report, when readings were assigned to a text, one Info-level event of
              counts only (classified, single-candidate, set by override and below the threshold) in
              the category TextEn.Heteronym and, once per analyzer, one Warning-level event in the
              category TextEn.Model when the heteronym model is damaged or incompatible, shall build
              the events from fixed words and numbers only, shall report nothing when no sink is
              configured or the analysis is canceled, and shall contain a failing sink.
            justification: |
              This decomposes the system diagnostics requirements into the reporter's observable
              behavior: aggregate counts, no text, no dictionary content and no word or reading id,
              so a host learns how many readings were decided and how many were doubtful and that its
              model was refused, and a sink is an observer whose fault must never stop speech.
            children:
              - SpeechTextEn-Analysis-AnalysisDiagnostics-RequestEvent
              - SpeechTextEn-Analysis-AnalysisDiagnostics-HeteronymAndModelEvents
              - SpeechTextEn-Analysis-AnalysisDiagnostics-SinkContainment
            tests:
              - AnalysisSubsystem_Analyze_Request_ReportsOneCountsOnlyDiagnostic
              - AnalysisSubsystem_Analyze_ThrowingDiagnosticsSink_StillReturnsSameResult
              - AnalysisSubsystem_Analyze_CancellationRequested_ThrowsOperationCanceledExceptionAndReportsNothing
