---
# Software Subsystem Requirements for the SpeechTextEn TrainingDataSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechTextEn TrainingDataSubsystem,
# decomposing the system-level requirements in docs/reqstream/speech-text-en.yaml. The subsystem is
# the non-shipped check-data tool of the Text.En trainer (tools/DemaConsulting.Speech.Text.En.Trainer):
# it reads the committed training and evaluation data in data/text-en/ and fails when the data is
# malformed, altered, mislabeled, restricted, undocumented or leaking. It consists of the strict file
# reader (TsvTable), the typed data loader (TextEnDataSet), the manifest verifier (DataManifest), the
# whole-word span check (SpanValidator), the finding collector (CheckReport), the schema, license and
# leakage checks (SchemaChecker, LicenseChecker, LeakageChecker) and the command line entry
# (CheckDataCommand). The data itself is a tool input, not a software item. Each requirement
# states one observable behavior.
#
# Unit-level content lives in per-unit files under
# docs/reqstream/speech-text-en/training-data-subsystem/. Covered by
# test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystemTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        requirements:
          - id: SpeechTextEn-TrainingData-CheckCommand
            title: >-
              The TrainingDataSubsystem shall provide one command that runs every check of the
              committed training data in a fixed order, reports every finding with the check and
              location it belongs to, and signals success, a data finding and a usage or input
              error with different exit codes.
            justification: |
              The checks are a gate in the lint script and in the build pipeline, and are run by hand
              before a data change. A single command with stable output and exit codes serves all
              three, and running every check in one pass shows a maintainer all the problems at once.
            children:
              - SpeechTextEn-TrainingData-CheckDataCommand-ExitCodes
              - SpeechTextEn-TrainingData-CheckDataCommand-Options
              - SpeechTextEn-TrainingData-CheckReport-Report
            tests:
              - TrainingDataSubsystem_CheckData_ValidFixture_PassesAllChecks
              - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck

          - id: SpeechTextEn-TrainingData-FileFormat
            title: >-
              The TrainingDataSubsystem shall accept only data files that are canonical UTF-8 text
              (no byte order mark, line feed line ends, a final newline, no empty line, a constant
              number of tab-separated columns, normalization form C and no quoting), shall preserve
              the source location of every datum in the findings it reports, shall know the closed
              vocabulary of data sources, and shall compare every file of the data folder with the
              committed manifest of file names, SHA-256 hashes, byte counts and row counts, failing
              when a file differs, is missing, or is not listed.
            justification: |
              The sentence offsets and the manifest hashes only mean the same on every platform
              when the bytes are canonical, and natural sentences that contain quotation marks must
              not be altered by a reader that interprets them. The manifest is a reviewed file that
              pins the exact content of data too large to review row by row, so a data change cannot
              pass the check without that review.
            children:
              - SpeechTextEn-TrainingData-TsvTable-StrictFormat
              - SpeechTextEn-TrainingData-TsvTable-FindingLocations
              - SpeechTextEn-TrainingData-TextEnDataSet-Loading
              - SpeechTextEn-TrainingData-TextEnDataSet-SourceVocabulary
              - SpeechTextEn-TrainingData-DataManifest-HashVerification
              - SpeechTextEn-TrainingData-DataManifest-Format
            tests:
              - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
              - TrainingDataSubsystem_CheckData_ManifestDrift_NamesFileAndPassesAfterRegeneration

          - id: SpeechTextEn-TrainingData-SchemaValidation
            title: >-
              The TrainingDataSubsystem shall validate the reading inventory, its forms and its
              mapping, the extension decisions and every labeled row (identifiers, splits, readings,
              lemmas, sources, licenses and offsets), shall require the target span of every row to be
              one whole listed form of its reading, shall keep the published gap table equal to the
              counts of the committed rows, and shall fail when a row has no provenance record or a
              provenance record has no row, when a row under a license that requires attribution has
              no attribution file, or when the documents of the data folder do not state an allowed
              license.
            justification: |
              The data is thousands of labeled examples that nobody can read through. A wrong label,
              a span that points at the wrong text or a reference to a reading that does not exist
              would teach the classifier something false, and each row must be traceable to the
              document it was harvested from or to how it was generated, so each of these is checked
              by machine.
            children:
              - SpeechTextEn-TrainingData-SchemaChecker-Inventory
              - SpeechTextEn-TrainingData-SchemaChecker-Rows
              - SpeechTextEn-TrainingData-SchemaChecker-ReadingCounts
              - SpeechTextEn-TrainingData-SpanValidator-ValidSpan
              - SpeechTextEn-TrainingData-LicenseChecker-Attribution
            tests:
              - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
              - TrainingDataSubsystem_CheckData_ValidFixture_PassesAllChecks
              - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks

          - id: SpeechTextEn-TrainingData-LicenseGate
            title: >-
              The TrainingDataSubsystem shall fail when any data row carries a license outside the
              allowed open licenses, a license its source may not carry, or a restricted-license term
              or Misaki reference in its metadata.
            justification: |
              The owner decided that the data is published under open terms and that no restricted
              material and no Misaki data is used. The check keeps that decision true for
              every row on every change.
            children:
              - SpeechTextEn-TrainingData-LicenseChecker-AllowedLicenses
              - SpeechTextEn-TrainingData-LicenseChecker-RestrictedContent
            tests:
              - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
              - TrainingDataSubsystem_CheckData_ValidFixture_PassesAllChecks

          - id: SpeechTextEn-TrainingData-LeakageGate
            title: >-
              The TrainingDataSubsystem shall fail when a sentence, a natural document or a synthetic
              template occurs in more than one of the training, development and holdout files, shall fail
              when a file in the data folder names an evaluation-only corpus, and, when a folder of
              evaluation sets is supplied, shall also fail when a row repeats or nearly repeats an
              evaluation sentence.
            justification: |
              The owner decided that the evaluation corpora are never committed and never trained on.
              The separation of the committed splits can always be checked and is a build gate. The
              comparison with the external evaluation sets can only be done by an operator who has them,
              so it is optional and never lets a missing folder pass as success.
            children:
              - SpeechTextEn-TrainingData-LeakageChecker-InternalLeakage
              - SpeechTextEn-TrainingData-LeakageChecker-ExternalOverlap
              - SpeechTextEn-TrainingData-LeakageChecker-EvaluationSetLoading
              - SpeechTextEn-TrainingData-LicenseChecker-RestrictedContent
            tests:
              - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
              - TrainingDataSubsystem_CheckData_ExternalOverlap_IsReportedWhenSetsSupplied
              - TrainingDataSubsystem_CheckData_ValidFixture_PassesAllChecks
