---
# Software Subsystem Requirements for the SpeechTextEn ClusteringSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechTextEn ClusteringSubsystem,
# decomposing the system-level requirement SpeechTextEn-Training-PublicDomainCorpus in docs/reqstream/speech-text-en.yaml.
# The subsystem is the non-shipped cluster command of the Text.En trainer (tools/DemaConsulting.Speech.Text.En.Trainer):
# it fetches and pins a public-domain book corpus from an official mirror and audits it against every evaluation set
# with the analyzer's own tokenizer. It consists of the body extraction (GutenbergBody), the corpus cache
# (ClusterCorpusCache), the reader (ClusterCorpusReader), the leakage audit
# (CorpusLeakageAudit) and the command (ClusterCommand). Each requirement states one observable behavior.
#
# Unit-level content lives in per-unit files under docs/reqstream/speech-text-en/clustering-subsystem/. Covered by
# test/DemaConsulting.Speech.Text.En.Trainer.Tests/ClusteringSubsystemTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: ClusteringSubsystem Requirements
        requirements:
          - id: SpeechTextEn-Clustering-PinnedCorpus
            title: >-
              The ClusteringSubsystem shall obtain the books of the corpus only over HTTPS from an allowed official
              mirror, never from the main web site, one request at a time with a configurable pause of at least one
              second between requests, stop at once when the mirror refuses a request, pin the normalized body of
              each book by its size and SHA-256, record a new pin only on request and only for a book that has none,
              and use a book only when its cached body matches its pin, exiting with 2 and writing nothing when one
              does not.
            justification: |
              The corpus may only come from books whose public-domain status is recorded, fetched in the way the
              archive asks automated clients to use it. Pinning each body makes the corpus fixed, so a later
              edition, a damaged download or a hand edit of the cache cannot change it unnoticed, and a pin is
              never overwritten, so a changed book shows up as a failure instead of a new pin.
            children:
              - SpeechTextEn-Clustering-GutenbergBody-Body
              - SpeechTextEn-Clustering-GutenbergBody-Reject
              - SpeechTextEn-Clustering-ClusterCorpusCache-SourceList
              - SpeechTextEn-Clustering-ClusterCorpusCache-WritePins
              - SpeechTextEn-Clustering-ClusterCorpusCache-PoliteFetch
              - SpeechTextEn-Clustering-ClusterCorpusCache-VerifiedBodies
              - SpeechTextEn-Clustering-ClusterCorpusCache-Cancellation
              - SpeechTextEn-Clustering-ClusterCommand-Fetch
            tests:
              - ClusteringSubsystem_Cluster_FetchAudit_EndToEnd
              - ClusteringSubsystem_Cluster_TamperedCache_IsRefused

          - id: SpeechTextEn-Clustering-LeakageAudit
            title: >-
              The ClusteringSubsystem shall split the corpus into sentences with the analyzer's own tokenizer, find
              every corpus sentence that repeats or nearly repeats a sentence of the development, natural holdout,
              independent holdout, regression and generalization files, or that belongs to a corpus passage quoting
              one, report the removals per evaluation file and rule, write them to a reviewable list on request, and
              report the committed list as current or stale.
            justification: |
              Excluding the books that hold evaluation sentences does not catch another edition, an anthology or a
              quotation in another book. A feature learned from an evaluation sentence would make every later
              measurement on that sentence too good, so the corpus is compared by content with every evaluation set
              and the overlap is listed and committed for review before the corpus is used.
            children:
              - SpeechTextEn-Clustering-CorpusLeakageAudit-Rules
              - SpeechTextEn-Clustering-CorpusLeakageAudit-Attribution
              - SpeechTextEn-Clustering-CorpusLeakageAudit-Counts
              - SpeechTextEn-Clustering-CorpusLeakageAudit-RemovalsFile
              - SpeechTextEn-Clustering-CorpusLeakageAudit-EvaluationSentences
              - SpeechTextEn-Clustering-ClusterCorpusReader-Tokenization
              - SpeechTextEn-Clustering-ClusterCommand-Audit
            tests:
              - ClusteringSubsystem_Cluster_BookQuotingEvaluation_SentenceRemoved

          - id: SpeechTextEn-Clustering-Deterministic
            title: >-
              The ClusteringSubsystem shall produce byte-identical removal lists for any number of worker threads
              and on every supported operating system.
            justification: |
              The removal list is reviewed and committed. Whether it is still current can only be checked when the
              same inputs always give the same bytes, on the developer's machine, on every continuous-integration
              system and with any number of threads.
            children:
              - SpeechTextEn-Clustering-CorpusLeakageAudit-Attribution
            tests:
              - ClusteringSubsystem_Cluster_DifferentThreadCounts_IdenticalRemovals

          - id: SpeechTextEn-Clustering-CommandLine
            title: >-
              The ClusteringSubsystem shall run exactly one of the fetch and audit modes per run, print counts, ids,
              hashes and timings but never corpus text, and exit with 0 when done or current, 1 when the removals
              are stale or a book failed, and 2 for a usage, input or data error.
            justification: |
              The commands are run by hand for network-bound or long work; the exit codes let a script use the
              result, and the console never repeats corpus text, so a log can be shared.
            children:
              - SpeechTextEn-Clustering-ClusterCommand-Usage
            tests:
              - ClusteringSubsystem_Cluster_FetchAudit_EndToEnd
