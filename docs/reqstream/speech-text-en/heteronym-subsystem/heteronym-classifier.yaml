---
# Software Unit Requirements for HeteronymClassifier
#
# These requirements describe the design-level behavior of the HeteronymClassifier unit (and the
# internal HeteronymModelProvider, ModelLoadStatus and HeteronymPrediction members that are
# documented with it), decomposing the parent SpeechTextEn HeteronymSubsystem requirements. The unit
# chooses among the candidate readings of a word in its sentence context by integer scoring of the
# weights of a sparse model and reports a calibrated confidence, and the provider supplies the
# classifier lazily, once and shared. Each requirement states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/HeteronymSubsystem/HeteronymClassifierTests.cs, with the
# fixture model builder Fakes/HeteronymFixtureModel.cs and the counting model source
# Fakes/CountingModelSource.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: HeteronymSubsystem Requirements
        sections:
          - title: HeteronymClassifier Requirements
            requirements:
              - id: SpeechTextEn-Heteronym-HeteronymClassifier-CandidateRestricted
                title: >-
                  The HeteronymClassifier class shall choose the reading of a word only among the
                  candidate readings that the inventory lists for that word, by the sum of the
                  weights of the buckets of the word's features conjoined with the reading and
                  shared with its role, accumulated as integers, so that no weight of any other
                  reading can change the choice.
                justification: |
                  A model is trained on context, not on the inventory; a decision outside the
                  candidates would name a reading that the word cannot have. Integer accumulation
                  makes the decision identical on every platform and runtime, which floating-point
                  addition does not guarantee.
                tests:
                  - HeteronymClassifier_Classify_NonCandidateWithHugeWeight_NeverWins

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-TieBreak
                title: >-
                  The HeteronymClassifier class shall choose, when several candidates have the
                  highest score (including every candidate of a model without weights), the one
                  that the forms table lists first.
                justification: |
                  A deterministic tie rule makes the result of an empty or ambiguous model
                  reproducible and lets the order of the forms table express which reading is the
                  default for a word.
                tests:
                  - HeteronymClassifier_Classify_NoWeights_TieGoesToFirstCandidate

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-CalibratedConfidence
                title: >-
                  The HeteronymClassifier class shall report the confidence of a decision as the
                  probability of the chosen candidate when the candidate scores, divided by the
                  scale and the temperature of the model, are turned into probabilities (the
                  exponential of each score as a share of the sum over all candidates), a number from 0
                  to 1 that is the largest of the candidates' probabilities, using the integer
                  score only for the decision.
                justification: |
                  A confidence that depends on a temperature fitted at training time is a
                  calibrated probability that hosts can compare with a threshold; using the integer
                  score for the decision and the floating-point value only for the report means a
                  difference between platforms in the last bits of a logarithm can never change
                  which reading is chosen.
                tests:
                  - HeteronymClassifier_Classify_TwoCandidates64Apart_ConfidenceIsCalibratedSoftmax
                  - HeteronymClassifier_Classify_ThreeCandidates_ConfidenceIsInRangeAndTopOne
                  - HeteronymClassifier_Classify_NoWeights_TieGoesToFirstCandidate

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-SingleCandidate
                title: >-
                  The HeteronymClassifier class shall return, for a form with a single candidate,
                  that reading with a confidence of 1 without scoring or counting a classification.
                justification: |
                  There is nothing to decide, so no model work is needed and the answer is certain;
                  the model must not be able to turn a form with one reading into something else.
                tests:
                  - HeteronymClassifier_Classify_SingleCandidateForm_ReturnsConfidenceOneWithoutScoring

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-ModelCompatibility
                title: >-
                  The HeteronymClassifier constructor shall throw InvalidDataException for a model
                  that was trained for a newer reading-inventory version than the inventory it is
                  given, shall accept a model of the same or an older version, and shall throw
                  ArgumentNullException for a null inventory or model.
                justification: |
                  A model for a newer inventory may name readings that this runtime does not
                  know, so applying it would give wrong or missing decisions; a model for an older
                  inventory only lacks weights for the readings added since, which is a safe
                  default, so the library upgrades without retraining.
                tests:
                  - HeteronymClassifier_Constructor_InventoryVersionCompatibility_IsChecked
                  - HeteronymClassifier_Constructor_NullArgument_ThrowsArgumentNullException

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-ArgumentValidation
                title: >-
                  The HeteronymClassifier class shall throw ArgumentOutOfRangeException for a
                  target that is negative or not below the length of the sentence it is given,
                  whether the form has one candidate or several.
                justification: |
                  A programming error should surface immediately with a clear exception rather than
                  as a decision about the wrong word.
                tests:
                  - HeteronymClassifier_Classify_TargetOutsideSentence_ThrowsArgumentOutOfRangeException

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-ThreadSafety
                title: >-
                  The HeteronymClassifier class shall give the same predictions to any number of
                  threads classifying at once as to a single thread.
                justification: |
                  One classifier is shared by every analyzer of the process and used on thread-pool
                  threads, so it must keep no state between calls.
                tests:
                  - HeteronymClassifier_Classify_ConcurrentCallers_GetSingleThreadedResults

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-CancellationObserver
                title: >-
                  The HeteronymClassifier class shall report each classification that it scores
                  with a model, but not a single-candidate form, to an optional observer with the
                  running count, so that a caller can act at an exact classification.
                justification: |
                  Cancellation between candidate words must be testable at a chosen word without
                  depending on timing, and the count is the only state the classifier exposes.
                tests:
                  - HeteronymClassifier_Classify_Observer_ReceivesRunningCount
                  - HeteronymClassifier_Classify_SingleCandidateForm_ReturnsConfidenceOneWithoutScoring

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-LazySharedLoad
                title: >-
                  The HeteronymModelProvider class shall report whether a model source is
                  configured without opening it, shall open the source only when a classifier is
                  first requested, shall load the model once for any number of concurrent first
                  requests and give them one shared classifier, shall report the embedded provider
                  and the provider without a source as not configured and without a model, and
                  shall expose the inventory it was built with without loading a model.
                justification: |
                  Loading is the expensive step and many analyzers never need it, so asking whether
                  a model exists must be free and the first real request must pay the cost once for
                  everyone. This release embeds no model, so the shared embedded provider is the
                  provider that never has one.
                tests:
                  - HeteronymModelProvider_IsConfigured_NeverOpensTheSource
                  - HeteronymModelProvider_GetClassifier_ConcurrentFirstCalls_LoadOnceAndShare
                  - HeteronymModelProvider_EmbeddedAndNone_AreNotConfiguredAndHaveNoModel

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-LoadFailureContained
                title: >-
                  The HeteronymModelProvider class shall report a source without a model, a damaged
                  model, a source that fails to read, a well-formed model of another feature set
                  and a model of a newer inventory as a status (not shipped, invalid for the
                  damaged and unreadable, incompatible for the well-formed models that do not fit
                  this build) with no classifier rather than by
                  throwing, and shall remember the status instead of opening the source again.
                justification: |
                  A model that cannot be used must not break speech or be retried on every request;
                  the status lets the analyzer tell a host once, and caching it makes a bad file
                  cost one failed read for the life of the process.
                tests:
                  - HeteronymModelProvider_GetClassifier_NoModel_ReportsNotShippedOnce
                  - HeteronymModelProvider_GetClassifier_CorruptOrFailingSource_ReportsInvalidAndCachesIt
                  - HeteronymModelProvider_GetClassifier_ModelOfNewerInventory_ReportsIncompatible
                  - HeteronymModelProvider_GetClassifier_ModelOfOtherFeatureSet_ReportsIncompatible
                  - HeteronymModelProvider_GetClassifier_ModelWithZeroFeatureSet_ReportsInvalid
                  - HeteronymModelProvider_GetClassifier_CorruptedChecksum_ReportsInvalid
                  - HeteronymModelProvider_GetClassifier_BadMagic_ReportsInvalid
