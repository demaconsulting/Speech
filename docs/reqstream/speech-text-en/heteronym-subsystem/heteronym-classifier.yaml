---
# Software Unit Requirements for HeteronymClassifier
#
# These requirements describe the design-level behavior of the HeteronymClassifier unit (and the
# internal HeteronymModelProvider, ModelLoadStatus and HeteronymPrediction members that are
# documented with it), decomposing the parent SpeechTextEn HeteronymSubsystem requirements. The unit
# chooses among the candidate readings of a word in its sentence context by integer scoring of the
# weights of a sparse model and reports a calibrated confidence, and the provider supplies the
# classifier from a model source and contains its failures. Each requirement states one observable
# behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/HeteronymSubsystem/HeteronymClassifierTests.cs, with the
# fixture model builder Fakes/HeteronymFixtureModel.cs and the model source fake
# Fakes/CountingModelSource.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: HeteronymSubsystem Requirements
        sections:
          - title: HeteronymClassifier Requirements
            requirements:
              - id: SpeechTextEn-Heteronym-HeteronymClassifier-Decision
                title: >-
                  The HeteronymClassifier class shall choose the reading of a word only among the
                  candidate readings that the inventory lists for that word, deterministically on
                  every platform, preferring the candidate that the forms table lists first on a
                  tie (including every candidate of a model without weights), shall return the
                  single candidate of a form with one reading with a confidence of 1, shall report
                  for every other decision a confidence from 0 to 1 that is the temperature-calibrated
                  probability of the chosen candidate, and shall throw ArgumentOutOfRangeException
                  for a target that is negative or not below the length of the sentence.
                justification: |
                  A model is trained on context, not on the inventory; a decision outside the
                  candidates would name a reading that the word cannot have, and a model must not be
                  able to turn a form with one reading into something else. The decision must be
                  identical on every platform and runtime, and a deterministic tie rule makes an
                  empty or ambiguous model reproducible and lets the order of the forms table
                  express the default reading. A confidence that depends on a temperature fitted at
                  training time is a calibrated probability that hosts can compare with a
                  threshold. A programming error should surface immediately as an exception rather
                  than as a decision about the wrong word. How the decision is computed (integer
                  accumulation of weights, floating point only for the reported confidence) is a
                  design choice recorded in the heteronym classifier design.
                tests:
                  - HeteronymClassifier_Classify_NonCandidateWithHugeWeight_NeverWins
                  - HeteronymClassifier_Classify_NoWeights_TieGoesToFirstCandidate
                  - HeteronymClassifier_Classify_TwoCandidates64Apart_ConfidenceIsCalibratedSoftmax
                  - HeteronymClassifier_Classify_ThreeCandidates_ConfidenceIsInRangeAndTopOne
                  - HeteronymClassifier_Classify_SingleCandidateForm_ReturnsConfidenceOne
                  - HeteronymClassifier_Classify_TargetOutsideSentence_ThrowsArgumentOutOfRangeException

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-AdjectiveCue
                title: >-
                  The HeteronymClassifier class shall add a fixed prior worth odds of about 9 to 1 to
                  the score of every candidate reading whose part-of-speech hint includes ADJ when the
                  tagger tags the word ADJ and a degree adverb tagged ADV stands right before it or a
                  coordinating conjunction joins it to a word tagged ADJ, and shall add nothing
                  otherwise, so that a weakly contested adjective reading wins and a confident model
                  keeps its reading.
                justification: |
                  A degree adverb before a word that the tagger reads as an adjective (very minute, so
                  close) or the coordination with another adjective (minute and clear) leaves almost
                  no room for a noun or a verb, but the model's sparse features see these
                  constructions too rarely to weigh them: a listener flagged "very minute and clear"
                  read as the unit of time. Requiring both the tag and the construction keeps a degree
                  word in another role (the very minute) from triggering it, and a prior rather than a
                  rule leaves the model the last word when it is confident.
                tests:
                  - HeteronymClassifier_Classify_AdjectiveCue_DecidesAWeaklyContestedAdjective
                  - HeteronymClassifier_Classify_AdjectiveCueAgainstAConfidentModel_ModelWins

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-FormTenseAndContextCues
                title: >-
                  The HeteronymClassifier class shall add a prior worth odds of about 2.7 to 1 to the
                  only candidate that can be a noun of the form when the tagger tags the word NOUN and
                  the form itself rules out another candidate's noun use, a prior worth odds of about 9
                  to 1 to a past-tense candidate when the sentence has a past-time word and the word
                  does not follow an auxiliary or a particle, and a prior worth odds of about 9 to 1 to
                  a candidate with one of its cue words within three words, and nothing otherwise.
                justification: |
                  A listener flagged "a knife wound" read as the past of wind, which is never a noun in
                  that form, and "a deep muscle tear" read as the drop from the eye, a use of the rip
                  reading the training data has once. The tense of read depends on words such as
                  yesterday that the sparse features rarely see with it. Retraining with added rows
                  re-rolled other readings of the single-epoch model, so the evidence is added as
                  priors that leave a confident model its reading; the noun-form prior is small
                  because a strong one lost a development row to a tagging error.
                tests:
                  - HeteronymClassifier_Classify_NounFormCue_DecidesAFormThatOnlyOneReadingMakesANoun
                  - HeteronymClassifier_Classify_PastTimeCue_DecidesTheTenseOfAWeaklyContestedVerb
                  - HeteronymClassifier_Classify_ContextCue_DecidesAReadingTheTrainingDataSeldomShows

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-ModelCompatibility
                title: >-
                  The HeteronymClassifier constructor shall throw InvalidDataException for a model
                  that was trained for a newer reading-inventory version than the inventory it is
                  given, shall accept a model of the same or an older version, and shall throw
                  ArgumentNullException for a null inventory or model.
                justification: |
                  A model for a newer inventory may name readings that this runtime does not
                  know, so applying it would give wrong or missing decisions; a model for an older
                  inventory only lacks weights for the readings added since, which is a safe
                  default, so the library upgrades without retraining.
                tests:
                  - HeteronymClassifier_Constructor_InventoryVersionCompatibility_IsChecked
                  - HeteronymClassifier_Constructor_NullArgument_ThrowsArgumentNullException

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-ThreadSafetyAndCancellation
                title: >-
                  The HeteronymClassifier class shall give the same predictions to any number of
                  threads classifying at once as to a single thread, and shall report each
                  classification that it scores with a model, but not a single-candidate form, to an
                  optional observer with the running count, so that a caller can act at an exact
                  classification.
                justification: |
                  One classifier is shared by every analyzer of the process and used on thread-pool
                  threads, so it must keep no state between calls. Cancellation between candidate
                  words must be testable at a chosen word without depending on timing, and the
                  count is the only state the classifier exposes.
                tests:
                  - HeteronymClassifier_Classify_ConcurrentCallers_GetSingleThreadedResults
                  - HeteronymClassifier_Classify_Observer_ReceivesRunningCount

              - id: SpeechTextEn-Heteronym-HeteronymClassifier-ModelSupply
                title: >-
                  The HeteronymModelProvider class shall give every one of any number of concurrent
                  first requests a classifier that predicts exactly as a sequentially obtained one
                  does, shall report the embedded provider as configured with a model that loads
                  and fits this build, shall report the provider without a source as not
                  configured and without a model, and shall report a source without a model, a
                  damaged model, a source that fails to read, a well-formed model of another
                  feature set and a model of a newer inventory as a status (not shipped, invalid
                  for the damaged and unreadable, incompatible for the well-formed models that do
                  not fit this build) with no classifier rather than by throwing.
                justification: |
                  Many analyzers never need a model, concurrent first requests must all be served
                  correctly, and a model that cannot be used must not break speech: the status lets
                  the analyzer tell a host once. The shared embedded provider serves the model that
                  ships in the package, and the provider without a source never has one. When the
                  source is opened, that it is opened once and the classifier shared, and that a
                  failed load is remembered are design choices recorded in the heteronym classifier
                  design and are not required of every implementation.
                tests:
                  - HeteronymModelProvider_EmbeddedAndNone_EmbeddedLoadsAndNoneHasNoModel
                  - HeteronymModelProvider_GetClassifier_ConcurrentFirstCalls_GetClassifiersWithSequentialPredictions
                  - HeteronymModelProvider_GetClassifier_NoModel_ReportsNotShipped
                  - HeteronymModelProvider_GetClassifier_CorruptOrFailingSource_ReportsInvalid
                  - HeteronymModelProvider_GetClassifier_ModelOfNewerInventory_ReportsIncompatible
                  - HeteronymModelProvider_GetClassifier_ModelOfOtherFeatureSet_ReportsIncompatible
