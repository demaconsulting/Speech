---
# Software Subsystem Requirements for the SpeechTextEn TrainingSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechTextEn TrainingSubsystem, decomposing
# the system-level requirements in docs/reqstream/speech-text-en.yaml. The subsystem is the non-shipped train
# and evaluate commands of the Text.En trainer (tools/DemaConsulting.Speech.Text.En.Trainer): they train the
# English heteronym model from the committed training and development data and the reading inventory, check
# that the committed model and its training record are what retraining produces, and measure the model on the
# development and holdout sets with baselines, a confidence interval and a quality gate decision. It consists of
# the loader that prepares the rows exactly as the analyzer sees them (TrainingCorpus), the reproducible random
# source and mathematics (DeterministicRandom, DeterministicMath), the learner (AveragedPerceptronTrainer), the
# choice of the epoch count and the calibration temperature and the model image (ModelSelection), the training
# record (TrainingRecord), the train command (TrainCommand), the evaluator (HeteronymEvaluator), the evaluation
# record (EvaluationRecord), the loader of the evaluation overlays (EvaluationOverlay) and the evaluate command
# (EvaluateCommand). Each requirement states one observable behavior.
#
# Unit-level content lives in per-unit files under
# docs/reqstream/speech-text-en/training-subsystem/. Covered by
# test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystemTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        requirements:
          - id: SpeechTextEn-Training-RepeatableModel
            title: >-
              The TrainingSubsystem shall give, for the same training data, development data, inventory
              and settings, a model with the same content on every run and on every operating system,
              byte for byte in its uncompressed form, shall record in every model it builds the inventory
              version, the feature-set version, the trainer version and the hash of the training data and
              write with it a record in a deterministic text form that reads back to the same values and
              is refused, with the reason, when it is damaged or out of range, and shall verify on request
              that the committed model and its record are what retraining from the current inputs and the
              recorded settings produces, reporting each way in which they are not, naming it, and not
              reporting a model whose content is equal but whose compressed form differs.
            justification: |
              A model nobody can reproduce cannot be reviewed or trusted. The repeatability rests on the
              reproducible random source and mathematics, the fixed order of the examples and a learning
              step that depends on nothing but its inputs. The test pins the hash of the uncompressed
              model trained from a small fixture; the same hash must come out on every operating system
              of the build matrix, and that matrix, which runs this test on each system, is the evidence
              of the identity across systems. The record is what lets anyone retrain the model and verify
              it, and the runtime refuses a model whose inventory or feature set it does not support. A
              change to the data, to the tagger or to a setting, or an edit of the model or its record,
              makes the committed model something the repository can no longer reproduce, and the check
              lets the build find that before a model ships; naming the cause tells the owner what to do.
            children:
              - SpeechTextEn-Training-DeterministicRandom-Reproducible
              - SpeechTextEn-Training-DeterministicMath-Accuracy
              - SpeechTextEn-Training-AveragedPerceptronTrainer-Repeatable
              - SpeechTextEn-Training-ModelSelection-Images
              - SpeechTextEn-Training-TrainingCorpus-InputFiles
              - SpeechTextEn-Training-TrainingRecord-RoundTrip
              - SpeechTextEn-Training-TrainingRecord-Validation
              - SpeechTextEn-Training-TrainCommand-WritesModelAndRecord
              - SpeechTextEn-Training-TrainCommand-Check
            tests:
              - TrainingSubsystem_Train_SameInputsTwice_ProduceIdenticalUncompressedImagesAndRecords
              - TrainingSubsystem_Train_FixtureImage_MatchesPinnedHash
              - TrainingSubsystem_Train_TinyFixture_ProducesLoadableModelThatClassifiesTrainingPatterns
              - TrainingSubsystem_Train_UnalignedRow_SkippedAndCountedInRecord
              - TrainingSubsystem_TrainCheck_FreshModelIsCurrentAndChangesMakeItStale
              - TrainingSubsystem_TrainCheck_CommittedModelAndRecord_AreCurrent

          - id: SpeechTextEn-Training-CommandContract
            title: >-
              The TrainingSubsystem shall provide a train command and an evaluate command that signal
              success, a stale model or a failed gate, and a usage, input or data error with different
              exit codes, that name the row or the file of a data error, that reject settings out of
              their range, and that let an experiment with other settings never replace the committed
              model and record.
            justification: |
              The commands are run by hand, by scripts and by the build. A stable exit code contract
              lets them tell a real finding from a mistake, and keeping experiments away from the
              committed files means the committed model changes only when its owner means it to.
            children:
              - SpeechTextEn-Training-TrainCommand-UsageAndDataErrors
              - SpeechTextEn-Training-TrainCommand-WritesModelAndRecord
              - SpeechTextEn-Training-EvaluateCommand-UsageErrors
              - SpeechTextEn-Training-TrainingCorpus-DataValidation
              - SpeechTextEn-Training-AveragedPerceptronTrainer-SettingsValidation
              - SpeechTextEn-Training-ModelSelection-SettingsValidation
              - SpeechTextEn-Training-DeterministicRandom-BoundValidation
              - SpeechTextEn-Training-HeteronymEvaluator-InputValidation
            tests:
              - TrainingSubsystem_Program_DispatchesTrainAndEvaluate
              - TrainingSubsystem_Train_LabelNotACandidate_ExitsTwoNamingTheRow

          - id: SpeechTextEn-Training-HoldoutFreeTraining
            title: >-
              The TrainingSubsystem shall use only the training data, the development data and the
              reading inventory to train a model and to choose its epoch count and calibration
              temperature, so that the holdout files can be absent or altered without changing the model
              or its record, and shall read a holdout file only when the operator asks to evaluate a
              holdout set or to decide the gate, announcing it.
            justification: |
              A holdout set measures a model only while nothing the model or its choices were made from
              has seen it. Choices made on the development set leave the holdout sets as the honest
              measurement, and the evaluation commands read a holdout only when the owner takes that
              irreversible step.
            children:
              - SpeechTextEn-Training-TrainingCorpus-InputFiles
              - SpeechTextEn-Training-ModelSelection-Selection
              - SpeechTextEn-Training-EvaluateCommand-HoldoutDiscipline
            tests:
              - TrainingSubsystem_Train_HoldoutFilesAbsentOrAltered_ImageUnchanged

          - id: SpeechTextEn-Training-RuntimeAlignedTraining
            title: >-
              The TrainingSubsystem shall prepare every training row with the analyzer's own tokenizer,
              tagger and features, shall learn only from the rows whose target is exactly one token of
              that tokenization and whose word has more than one reading, shall count the rows skipped in
              the record of the model, shall learn from them weights that, loaded as a model by the
              runtime, make the analyzer choose the labeled readings for the patterns of the training
              rows, with the natural rows given the configured weight and the small weights pruned, and
              shall decide, for every aligned row of the development and holdout sets, the same reading
              with its own scoring as the analyzer emits with the trained model, reporting any difference.
            justification: |
              The analyzer only classifies words it sees as one token, in the context it builds. A model
              trained on contexts the analyzer never presents would be tuned for another system, and the
              count of the skipped rows tells the owner how much of the data the analyzer cannot use. The
              purpose of training is a model the runtime can load and use, so the learned weights are
              judged by the analyzer's own decisions; the natural-row weight and the pruning are the
              owner's two controls over what is learned and how large the file is. The trainer and the
              analyzer are separate paths over the same weights, and checking them against each other on
              every row turns "trained on what the analyzer sees" from an intention into a measured fact.
            children:
              - SpeechTextEn-Training-TrainingCorpus-RuntimeAlignment
              - SpeechTextEn-Training-AveragedPerceptronTrainer-Learning
              - SpeechTextEn-Training-AveragedPerceptronTrainer-Repeatable
              - SpeechTextEn-Training-ModelSelection-Images
              - SpeechTextEn-Training-HeteronymEvaluator-GateDecision
            tests:
              - TrainingSubsystem_Train_UnalignedRow_SkippedAndCountedInRecord
              - TrainingSubsystem_Train_TinyFixture_ProducesLoadableModelThatClassifiesTrainingPatterns
              - TrainingSubsystem_Evaluate_TrainerAndAnalyzerPredictions_AgreeOnEveryFixtureRow

          - id: SpeechTextEn-Training-EvaluationReport
            title: >-
              The TrainingSubsystem shall report the reading accuracy of a model on the development and
              holdout sets, end to end through the analyzer, with the own-part-of-speech, majority and
              first-candidate baselines, the accuracy by source, reading and confidence, the readings with
              the lowest accuracy, a paired confidence interval of the improvement over the
              own-part-of-speech baseline that treats the rows of a document as one unit, and the variation
              of the holdout accuracy between seeds, shall decide the quality gate from the natural
              holdout, passing a model only when its pooled accuracy reaches the threshold of the record,
              the threshold itself being enough, and the lower bound of the confidence interval of its
              improvement is above zero, and shall write the evaluation as deterministic record files and
              verify them on request, naming each file that is edited, missing or different from what the
              evaluation produces.
            justification: |
              Whether a model is worth shipping depends on what it adds beyond what is free, how sure that
              is, and where it fails. A figure for the model alone shows none of that. Counting a row the
              analyzer cannot read as wrong keeps the figure honest. The owner fixed the thresholds before
              any model was measured so that they could not be tuned to a result, and deciding from the
              record's thresholds, which retraining never rewrites, keeps that promise. The evaluation
              record is the evidence of the gate decision, so it has to be reproducible, and a change to it
              that is not the product of an evaluation has to be found.
            children:
              - SpeechTextEn-Training-HeteronymEvaluator-Metrics
              - SpeechTextEn-Training-HeteronymEvaluator-Baselines
              - SpeechTextEn-Training-HeteronymEvaluator-ImprovementInterval
              - SpeechTextEn-Training-HeteronymEvaluator-GateDecision
              - SpeechTextEn-Training-HeteronymEvaluator-InputValidation
              - SpeechTextEn-Training-EvaluateCommand-UsageErrors
              - SpeechTextEn-Training-EvaluateCommand-HoldoutDiscipline
              - SpeechTextEn-Training-EvaluateCommand-GateExitCodes
              - SpeechTextEn-Training-EvaluateCommand-RecordWriteAndCheck
              - SpeechTextEn-Training-EvaluationRecord-Files
              - SpeechTextEn-Training-EvaluationRecord-Deterministic
              - SpeechTextEn-Training-TrainingRecord-RoundTrip
            tests:
              - TrainingSubsystem_Evaluate_FixtureSets_ComputesAccuracyBaselinesAndCoverage
              - TrainingSubsystem_Evaluate_Gate_ExitCodeFollowsThresholds
              - TrainingSubsystem_Evaluate_WriteThenCheck_MatchesAndDetectsEditedRecord
              - TrainingSubsystem_Evaluate_CommittedModelAndData_PassesGate

          - id: SpeechTextEn-Training-OverlayReport
            title: >-
              The TrainingSubsystem shall evaluate, on request and in the evaluation record, the regression
              overlay and the generalization set end to end through the analyzer with the model under test, and
              shall report for each overlay and each of its slices (all rows; seen and unseen rows and each
              origin of the regression overlay; each kind, family and cue-solvable class of the generalization
              set) the accuracy with the curated cue priors and of the model alone without them, with clustered
              intervals of both and of their paired difference (a generalization row resampling with its family,
              a regression row alone), the rows on which a cue prior acts and the rows whose reading it changes;
              shall stop with a data error that names every generalization row marked cue_unsolvable=yes that is
              not one runtime token, on which the adjective, past-time or a context cue test fires, to which the
              noun-form prior applies, or whose reading a cue prior changes; and shall append the overlays to the
              record after the data sets, with a per-row file and a per-slice file, so every earlier line of the
              record stays byte-identical.
            justification: |
              The overlays measure whether the cue priors and later features help on flagged and on unseen
              sentences; the model-only decision uses the classifier's own scoring and changes neither the
              classifier nor the model, so the comparison measures only the priors. Clustering by family keeps
              rows written from one idea from counting as independent evidence. A row wrongly marked as out of
              reach of the cues would distort the very subset the pre-registered criterion reports, so it is a
              data error. Appending keeps the gate evidence of the record unchanged.
            children:
              - SpeechTextEn-Training-EvaluationOverlay-Rows
              - SpeechTextEn-Training-EvaluationOverlay-Refusal
              - SpeechTextEn-Training-HeteronymEvaluator-OverlayCuedAndModelOnly
              - SpeechTextEn-Training-HeteronymEvaluator-CueUnsolvableCheck
              - SpeechTextEn-Training-EvaluateCommand-OverlaySets
              - SpeechTextEn-Training-EvaluationRecord-OverlayFiles
            tests:
              - TrainingSubsystem_Evaluate_Overlays_ReportedWithAndWithoutCuesAndAppendedToRecord
              - TrainingSubsystem_Evaluate_CommittedModelAndData_PassesGate
