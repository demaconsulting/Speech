---
# Software Unit Requirements for EnglishTextAnalyzerOptions
#
# These requirements describe the design-level behavior of the EnglishTextAnalyzerOptions unit (and
# the TextEnAnnotationSelection enumeration declared with it), decomposing the parent SpeechTextEn
# AnalysisSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/EnglishTextAnalyzerOptionsTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: EnglishTextAnalyzerOptions Requirements
            requirements:
              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Defaults
                title: >-
                  The EnglishTextAnalyzerOptions record shall default to selecting the
                  part-of-speech, the normalization and the reading annotations and to having no
                  diagnostics sink.
                justification: |
                  A host that just constructs an analyzer gets the useful behavior without
                  configuration and no reporting it did not ask for. The reading family is part of
                  the default selection and is served by the heteronym model embedded in the
                  package, so the default output includes the reading of every heteronym word.
                tests:
                  - EnglishTextAnalyzerOptions_Defaults_SelectAllFamiliesAndNoSink

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Initialization
                title: >-
                  The EnglishTextAnalyzerOptions record shall accept the annotation selection and
                  the diagnostics sink at initialization, and a copy made with a with-expression
                  shall leave the original unchanged.
                justification: |
                  Options are shared configuration; a derived copy must never change the options
                  an existing analyzer was built from.
                tests:
                  - EnglishTextAnalyzerOptions_Initialization_SetsValuesAndWithExpressionCopies

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-SelectionValidation
                title: >-
                  The EnglishTextAnalyzerOptions record shall throw ArgumentOutOfRangeException for
                  an annotation selection that contains a flag the library does not define, and
                  the selection enumeration shall be a flags enumeration whose None value is zero.
                justification: |
                  An undefined flag is a typo or a value from a newer release; failing loudly is
                  safer than silently treating it as a selection.
                tests:
                  - EnglishTextAnalyzerOptions_Annotations_UndefinedFlag_ThrowsArgumentOutOfRangeException
                  - TextEnAnnotationSelection_Members_AreFlagsWithNoneZero

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-NormalizationSelection
                title: >-
                  The EnglishTextAnalyzerOptions record shall accept every combination of the
                  defined selection flags (none, part of speech, normalization, reading, and
                  every combination of them), so that a host can select each annotation family
                  independently of the others.
                justification: |
                  Normalization needs no tagger and the part of speech needs no normalization, so
                  a host may want either alone, and the reading family can be chosen with or
                  without the part-of-speech annotation it uses as context; the combinations must
                  be valid rather than merely not undefined.
                tests:
                  - EnglishTextAnalyzerOptions_Annotations_DefinedFlagCombinations_AreAccepted
                  - EnglishTextAnalyzerOptions_Defaults_SelectAllFamiliesAndNoSink

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-ReadingSelection
                title: >-
                  The EnglishTextAnalyzerOptions record shall define the reading family as the
                  selection flag with the value 4, include it in the default selection, and treat
                  any flag above it as undefined.
                justification: |
                  The flag values are part of the public contract and a host may store them, so the
                  reading flag has a fixed value; including it in the default means a host gets
                  readings as soon as a model is available without changing its options.
                tests:
                  - TextEnAnnotationSelection_Members_AreFlagsWithNoneZero
                  - EnglishTextAnalyzerOptions_Defaults_SelectAllFamiliesAndNoSink
                  - EnglishTextAnalyzerOptions_Annotations_UndefinedFlag_ThrowsArgumentOutOfRangeException

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-LowConfidenceThreshold
                title: >-
                  The EnglishTextAnalyzerOptions record shall carry a low-confidence threshold of
                  0.60 by default, shall accept at initialization any finite value from 0 to 1
                  including both ends and keep it in a with-expression copy, and shall throw
                  ArgumentOutOfRangeException for a value below 0, above 1 or not finite.
                justification: |
                  A confidence is a probability, so a threshold outside 0 to 1 or not a number
                  is a mistake that would silently flag everything or nothing; the threshold is
                  only used to count and flag doubtful readings, never to withhold one.
                tests:
                  - EnglishTextAnalyzerOptions_Defaults_SelectAllFamiliesAndNoSink
                  - EnglishTextAnalyzerOptions_LowConfidenceThreshold_ValuesFromZeroToOne_AreAcceptedAndCopied
                  - EnglishTextAnalyzerOptions_LowConfidenceThreshold_OutOfRange_ThrowsArgumentOutOfRangeException

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Overrides
                title: >-
                  The EnglishTextAnalyzerOptions record shall carry an optional pronunciation
                  dictionary that is null by default, can be set at initialization and replaced in a
                  with-expression without changing the original, and is held by reference.
                justification: |
                  The dictionary is host configuration that belongs with the other analyzer
                  options; it is immutable, so sharing the reference is safe and no copy of a
                  possibly large dictionary is made, and the default keeps an analyzer without
                  overrides exactly as it was.
                tests:
                  - EnglishTextAnalyzerOptions_Overrides_DefaultsToNullAndCopiesWithWith
