---
# Software Unit Requirements for EnglishTextAnalyzerOptions
#
# These requirements describe the design-level behavior of the EnglishTextAnalyzerOptions unit (and
# the TextEnAnnotationSelection enumeration declared with it), decomposing the parent SpeechTextEn
# AnalysisSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/EnglishTextAnalyzerOptionsTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: EnglishTextAnalyzerOptions Requirements
            requirements:
              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-AnnotationSelection
                title: >-
                  The EnglishTextAnalyzerOptions record shall default to selecting the
                  part-of-speech, the normalization and the reading annotations and to having no
                  diagnostics sink, shall accept every combination of the defined selection flags
                  so that a host can select each annotation family independently of the others, and
                  shall throw ArgumentOutOfRangeException, at initialization and in a copy, for a
                  selection that contains a flag the library does not define.
                justification: |
                  A host that just constructs an analyzer gets the useful behavior (including the
                  readings of the model embedded in the package) without configuration and no
                  reporting it did not ask for. Normalization needs no tagger and the part of speech
                  needs no normalization, so a host may want either alone; the combinations must be
                  valid rather than merely not undefined. An undefined flag is a typo or a value
                  from a newer release, and failing loudly is safer than silently treating it as a
                  selection.
                tests:
                  - EnglishTextAnalyzerOptions_Defaults_SelectAllFamiliesAndNoSink
                  - EnglishTextAnalyzerOptions_Annotations_DefinedFlagCombinations_AreAccepted
                  - EnglishTextAnalyzerOptions_Annotations_UndefinedFlag_ThrowsArgumentOutOfRangeException

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzerOptions-Settings
                title: >-
                  The EnglishTextAnalyzerOptions record shall carry a low-confidence threshold of
                  0.60 by default, shall accept any finite value from 0 to 1 including both ends and
                  keep it in a copy, shall throw ArgumentOutOfRangeException for a value below 0,
                  above 1 or not finite, and shall carry an optional pronunciation dictionary that
                  is null by default.
                justification: |
                  A confidence is a probability, so a threshold outside 0 to 1 or not a number is a
                  mistake that would silently flag everything or nothing; the threshold only counts
                  and flags doubtful readings and never withholds one. The dictionary is host
                  configuration that belongs with the other analyzer options, and the null default
                  keeps an analyzer without overrides exactly as it was.
                tests:
                  - EnglishTextAnalyzerOptions_Defaults_SelectAllFamiliesAndNoSink
                  - EnglishTextAnalyzerOptions_LowConfidenceThreshold_ValuesFromZeroToOne_AreAcceptedAndCopied
                  - EnglishTextAnalyzerOptions_LowConfidenceThreshold_OutOfRange_ThrowsArgumentOutOfRangeException
