---
# Software Unit Requirements for EnglishTextAnalyzer
#
# These requirements describe the design-level behavior of the EnglishTextAnalyzer unit (and the
# EnglishTextAnalysis/AnalyzedToken result types it returns, which are documented with it),
# decomposing the parent SpeechTextEn AnalysisSubsystem requirements. Each requirement states one
# observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/EnglishTextAnalyzerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: EnglishTextAnalyzer Requirements
            requirements:
              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-WordAnnotations
                title: >-
                  The EnglishTextAnalyzer class shall annotate each word token of a text with one
                  part-of-speech annotation whose span is exactly that word in the analyzed text,
                  in text order, using the tag the tagger chooses in the context of the sentence,
                  and shall give punctuation and symbol tokens, and any token without a letter
                  or digit, no annotation.
                justification: |
                  A backend selects a pronunciation from the word's part of speech, so the
                  annotation must sit on exactly the word and reflect its sentence context;
                  tagging punctuation would add volume without information, and a part of speech
                  on a bare symbol or invisible character would make a clause that speaks nothing
                  look like content to the Speech library's chunker.
                tests:
                  - EnglishTextAnalyzer_Analyze_SimpleSentence_AnnotatesEachWordOnItsSourceSpan
                  - EnglishTextAnalyzer_Analyze_UnambiguousSentence_ProducesExpectedUniversalTags
                  - EnglishTextAnalyzer_Analyze_SameSpellingInDifferentContext_UsesContextForTag
                  - EnglishTextAnalyzer_Analyze_PunctuationAndSymbols_CarryNoAnnotation
                  - EnglishTextAnalyzer_Analyze_TokenWithoutLetterOrDigit_CarriesNoPartOfSpeech
                  - EnglishTextAnalyzer_Analyze_NumeralToken_KeepsItsPartOfSpeech

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-WellFormedAnnotations
                title: >-
                  The EnglishTextAnalyzer class shall produce only annotations that lie within the
                  analyzed text, start and end on non-whitespace characters, never cut a UTF-16
                  surrogate pair, never cover a tag placeholder, and carry a part of speech from
                  the Universal Dependencies tag set, for any input text.
                justification: |
                  The Speech library drops an annotation that starts or ends on trimmed
                  whitespace or covers a placeholder, and a backend that receives a half
                  surrogate pair would receive invalid text; annotation correctness must hold for
                  arbitrary user text, including emoji and malformed text.
                tests:
                  - EnglishTextAnalyzer_Analyze_RandomText_AnnotationsAndBreaksAreWellFormed

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-OptionsSelection
                title: >-
                  The EnglishTextAnalyzer class shall produce part-of-speech annotations only when
                  its options select them, and shall still supply sentence breaks and tokens when
                  they are not selected.
                justification: |
                  A host that needs only sentence boundaries should not pay for tagging, and the
                  boundaries must not depend on the annotation selection.
                tests:
                  - EnglishTextAnalyzer_Analyze_PartOfSpeechNotSelected_ProducesNoAnnotationsAndLoadsNoTagger

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-SentenceBreaks
                title: >-
                  The EnglishTextAnalyzer class shall return a non-null list of sentence breaks
                  holding the offset of the first token of every sentence after the first, shall
                  not break a sentence at an abbreviation period that does not end it, and shall
                  return an empty list for a text with at most one sentence.
                justification: |
                  The Speech library treats a non-null list as authoritative, so even a text with
                  one sentence must return an empty list rather than null; a break at an
                  abbreviation would hand a model a fragment.
                tests:
                  - EnglishTextAnalyzer_Analyze_MultipleSentences_ReturnsBreaksAtLaterSentenceStarts
                  - EnglishTextAnalyzer_Analyze_AbbreviationPeriod_DoesNotBreakSentence
                  - EnglishTextAnalyzer_Analyze_SingleSentence_ReturnsEmptyNonNullBreaks

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-Placeholders
                title: >-
                  The EnglishTextAnalyzer class shall treat each tag placeholder as a separator
                  that is never part of a word or covered by an annotation, shall analyze the
                  text on both sides of it as running text, and shall place a sentence break at
                  the next word rather than at the placeholder.
                justification: |
                  Placeholders replace audio tags inside a request; the words around a tag belong
                  to the same sentence, and an annotation over a placeholder would be discarded
                  by the Speech library.
                tests:
                  - EnglishTextAnalyzer_Analyze_PlaceholderBetweenWords_IsNeverCovered
                  - EnglishTextAnalyzer_Analyze_PlaceholderBetweenWords_EqualsAnalysisWithSpaceInItsPlace
                  - EnglishTextAnalyzer_Analyze_PlaceholderTouchingWords_SeparatesTheWords
                  - EnglishTextAnalyzer_Analyze_PlaceholderAtSentenceBoundary_BreaksBeforeNextWord
                  - EnglishTextAnalyzer_Analyze_PlaceholderAfterAbbreviation_IsNeverCoveredAndContextCrossesIt

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-EmptyText
                title: >-
                  The EnglishTextAnalyzer class shall return no annotations and an empty, non-null
                  list of sentence breaks for a text without word tokens (empty, whitespace only,
                  or only tag placeholders), without loading the tagger.
                justification: |
                  A request may consist of nothing but tags or spaces; it must produce a valid
                  empty analysis cheaply.
                tests:
                  - EnglishTextAnalyzer_Analyze_TextWithoutWords_ReturnsNoAnnotationsAndLoadsNoTagger

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-Cancellation
                title: >-
                  The EnglishTextAnalyzer class shall throw OperationCanceledException, and shall
                  neither return a result nor report diagnostics, when the cancellation token is
                  already canceled (before doing any work) and when it is canceled at any later
                  point: during tagger initialization, while a sentence (including the only or the
                  last one) is being tagged, while the pronunciation overrides are looked up,
                  while the text is being normalized, or while the result is being built.
                justification: |
                  The Speech library passes the operation's token to the analyzer and a stop or
                  dispose waits for the analyzer to return, so a long text must stop promptly; and
                  a canceled request that returned normally would materialize everything and
                  report an event for work the caller abandoned.
                tests:
                  - EnglishTextAnalyzer_Analyze_AlreadyCanceledToken_ThrowsWithoutLoadingTagger
                  - EnglishTextAnalyzer_Analyze_CanceledDuringTaggerInitialization_ThrowsOperationCanceledException
                  - EnglishTextAnalyzer_Analyze_CanceledDuringOnlySentence_ThrowsAndReportsNothing
                  - EnglishTextAnalyzer_Analyze_CanceledDuringFinalSentence_ThrowsAndReportsNothing
                  - EnglishTextAnalyzer_Analyze_CanceledDuringNormalization_ThrowsAndReportsNothing
                  - EnglishTextAnalyzer_Analyze_CanceledDuringOverrideLookup_ThrowsAndReportsNothing
                  - EnglishTextAnalyzer_Analyze_NotCanceled_ReportsOneDiagnosticsEvent

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-ArgumentValidation
                title: >-
                  The EnglishTextAnalyzer class shall throw ArgumentNullException for a null text
                  and for null options.
                justification: |
                  A programming error should surface immediately with a clear exception.
                tests:
                  - EnglishTextAnalyzer_Analyze_NullText_ThrowsArgumentNullException
                  - EnglishTextAnalyzer_Constructor_NullOptions_ThrowsArgumentNullException

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-ConcurrencyAndNoRetainedReferences
                title: >-
                  The EnglishTextAnalyzer class shall give identical results to any number of
                  concurrent requests on one instance, and shall keep no reference to an analyzed
                  text or to a result in its own state after the request returns.
                justification: |
                  One model instance may back several engines, so its analyzer is called
                  concurrently; the library requires that an analyzer not retain the request text,
                  which is the user's speech content. This requirement covers the analyzer's own
                  state only: the tagging package keeps the characters of tagged tokens in an
                  internal per-thread buffer it never clears (a known limitation of the
                  dependency, documented in the design and tracked upstream as
                  https://github.com/demaconsulting/PartOfSpeech/issues/29), which this library
                  cannot clear and which is therefore not claimed to be fixed here.
                tests:
                  - EnglishTextAnalyzer_Analyze_ConcurrentRequestsOnOneAnalyzer_ReturnIdenticalResultsAndLoadTaggerOnce
                  - EnglishTextAnalyzer_Analyze_AfterReturn_KeepsNoReferenceToTextOrResults

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedAnalysis
                title: >-
                  The EnglishTextAnalyzer class shall offer a detailed analysis that lists every
                  token with its span, text, part of speech, confidence and known-word flag
                  together with the same annotations and sentence breaks the language-neutral
                  analysis returns.
                justification: |
                  A model package or a test needs the confidence and the known-word flag, which
                  have no place in the language-neutral annotations, and must be able to rely on
                  the two results agreeing.
                tests:
                  - EnglishTextAnalyzer_AnalyzeDetailed_Sentence_ListsTokensWithTagConfidenceAndKnownWordFlag
                  - EnglishTextAnalyzer_Analyze_ComparedWithAnalyzeDetailed_ReturnsSameAnnotationsAndBreaks

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-NormalizationAnnotations
                title: >-
                  The EnglishTextAnalyzer class shall, when its options select normalization,
                  annotate each normalization on its span with an annotation of the normalization
                  kind whose value is the spoken form (an empty value for a dropped character),
                  shall merge these with the part-of-speech annotations in text order with the part
                  of speech first at an equal start, shall run the normalization without loading
                  the tagger, shall never change the analyzed text, and shall build no detail lists
                  in the language-neutral analysis.
                justification: |
                  Backends read the spoken form from the annotation on the span, in the order the
                  Speech library delivers them, and a host that selects only normalization must
                  not pay for the tagger; the language-neutral path is the hot path, so the detail
                  that only the richer result needs is not built for it.
                tests:
                  - EnglishTextAnalyzer_Analyze_AbbreviationToken_EmitsPartOfSpeechThenNormalization
                  - EnglishTextAnalyzer_Analyze_NormalizationOnly_LoadsNoTaggerAndEmitsOnlyNormalizations
                  - EnglishTextAnalyzer_Analyze_PlaceholderAfterAbbreviation_IsNeverCoveredAndContextCrossesIt
                  - EnglishTextAnalyzer_Analyze_ComparedWithAnalyzeDetailed_AllocatesLess

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-ReconciledBreaks
                title: >-
                  The EnglishTextAnalyzer class shall return as sentence breaks the tokenizer's
                  breaks reconciled with the abbreviation readings when normalization is selected,
                  so that a sentence ends after an abbreviation read as its last word and not
                  after a title, and shall return the tokenizer's breaks unchanged when it is
                  not selected.
                justification: |
                  The abbreviation reading decides whether a period ends a sentence, so the
                  reported breaks must follow it; a host that does not select normalization gets
                  exactly the tokenizer's opinion.
                tests:
                  - EnglishTextAnalyzer_Analyze_AbbreviationPeriod_DoesNotBreakSentence
                  - EnglishTextAnalyzer_Analyze_NormalizationNotSelected_KeepsTokenizerBreaksAndEmitsNoNormalization

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-DetailedNormalization
                title: >-
                  The EnglishTextAnalyzer class shall list in the detailed analysis every
                  normalization with its source text, spoken text and kind, and the role of each
                  clitic token, shall list none and classify no clitic when normalization is not
                  selected, and shall return the same annotations and breaks as the
                  language-neutral analysis.
                justification: |
                  The kind of a normalization and the role of a clitic have no place in the
                  language-neutral annotations, but a model package needs them, and it must be able
                  to rely on the two results agreeing.
                tests:
                  - EnglishTextAnalyzer_AnalyzeDetailed_NormalizedText_ListsNormalizationsAndCliticRoles
                  - EnglishTextAnalyzer_AnalyzeDetailed_NormalizationNotSelected_HasNoNormalizationsAndNoCliticRoles
                  - EnglishTextAnalyzer_Analyze_VariedTexts_MatchesAnalyzeDetailedAnnotationsAndBreaks

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-Overrides
                title: >-
                  The EnglishTextAnalyzer class shall, when its options carry a non-empty
                  pronunciation dictionary and select normalization, annotate each word the
                  dictionary matches on exactly that token with a normalization annotation (a say
                  entry), a spell-out annotation (a spell entry), a pronunciation annotation (a
                  pronounce entry) or no annotation (a skip entry), shall still emit the
                  part-of-speech annotation of the word before it, shall annotate around a tag
                  placeholder, shall list a say or spell override in the detailed analysis with the
                  override kind, shall return the same annotations and breaks from both analysis
                  methods, shall never change the sentence breaks, and shall allocate nothing per
                  token for a dictionary that matches nothing.
                justification: |
                  An override changes how one word is spoken, so it must sit on exactly that word
                  and in the order a backend expects, beside the part of speech that selects among
                  the readings of other words; the dictionary decides how a word is spoken, never
                  where a sentence ends, including when the word is an abbreviation whose period
                  the tokenizer separates, and the common case of a dictionary that matches nothing
                  in most requests must stay cheap.
                tests:
                  - EnglishTextAnalyzer_Analyze_SayOverride_EmitsNormAndKeepsPartOfSpeech
                  - EnglishTextAnalyzer_Analyze_SpellOutOverride_EmitsSpell
                  - EnglishTextAnalyzer_Analyze_PronunciationOverride_EmitsPron
                  - EnglishTextAnalyzer_Analyze_SkipOverride_EmitsNothingForToken
                  - EnglishTextAnalyzer_Analyze_OverrideAdjacentToAudioTag_AnnotatesAroundPlaceholder
                  - EnglishTextAnalyzer_AnalyzeDetailed_ListsOverrideNormalizationKind
                  - EnglishTextAnalyzer_Analyze_AnalyzeAndDetailed_ProduceSameAnnotationsWithOverrides
                  - EnglishTextAnalyzer_Analyze_OverridesDoNotChangeSentenceBreaks
                  - EnglishTextAnalyzer_Analyze_OverridesOnAbbreviations_DoNotChangeSentenceBreaks
                  - EnglishTextAnalyzer_Analyze_GoldenCases_MatchThroughThePublicApi
                  - EnglishTextAnalyzer_Analyze_OverridesWithoutHits_AddNoPerTokenAllocation

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-OverridesRequireNormalization
                title: >-
                  The EnglishTextAnalyzer constructor shall throw ArgumentException, with the
                  parameter name options, for options that carry a non-empty pronunciation
                  dictionary without the normalization annotation family, shall accept an empty
                  dictionary whatever the selection, and shall copy the dictionary reference at
                  construction so that a later with-copy of the options has no effect.
                justification: |
                  Overrides are applied by the normalization pass, so a dictionary with
                  normalization switched off would be silently ignored, which hides a configuration
                  mistake; an empty dictionary changes nothing and is harmless.
                tests:
                  - EnglishTextAnalyzer_Ctor_OverridesWithoutNormalization_Throws
                  - EnglishTextAnalyzer_Ctor_EmptyOverridesWithoutNormalization_IsAccepted
                  - EnglishTextAnalyzer_Ctor_OptionsCopiedAtConstruction_IgnoresLaterWith

              - id: SpeechTextEn-Analysis-EnglishTextAnalyzer-SpelledInitialisms
                title: >-
                  The EnglishTextAnalyzer class shall annotate an initialism (FBI), a dotted
                  initialism (U.S.), a single-letter initial (A.), a dotted credential (Ph.D.),
                  the letters of a meridiem (p.m.) and the letter groups of an ampersand initialism
                  (AT&T, R&D, Q&A, AT&T's) with a spell-out annotation instead of a normalization
                  annotation, with an unchanged spoken text, shall annotate the "and" of an
                  ampersand initialism and every word replacement (Dr.) as a normalization, and
                  shall emit no spell-out annotation when normalization is not selected.
                justification: |
                  A letter sequence must reach a backend as letters to speak by name, so that a
                  lone A or I is never read as the article or the pronoun; a word replacement is
                  not letters and keeps the normalization kind, and without normalization nothing
                  is replaced at all.
                tests:
                  - EnglishTextAnalyzer_Analyze_Initialisms_EmitSpellInsteadOfNorm
                  - EnglishTextAnalyzer_Analyze_WordReplacement_StaysNorm
                  - EnglishTextAnalyzer_Analyze_AmpersandInitialism_EmitsLetterSpansAndAndNorm
                  - EnglishTextAnalyzer_Analyze_NormalizationNotSelected_EmitsNoSpell
