---
# Software Unit Requirements for PartOfSpeechAdapter
#
# These requirements describe the design-level behavior of the PartOfSpeechAdapter unit, the one
# internal seam over the DemaConsulting.PartOfSpeech package, decomposing the parent SpeechTextEn
# AnalysisSubsystem requirements. Each requirement states one observable behavior. The OTS
# requirements of the tagging package are children of the requirements that depend on them.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/PartOfSpeechAdapterTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: PartOfSpeechAdapter Requirements
            requirements:
              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-SourceOffsets
                title: >-
                  The PartOfSpeechAdapter class shall split a text into sentences and tokens in
                  text order, with every token's offset and length indexing exactly the text that
                  was given, including after line breaks.
                justification: |
                  Annotations and sentence breaks must index the text the Speech library supplied,
                  so the adapter must report positions in that text and never in a rebuilt one.
                children:
                  - Speech-OTS-PartOfSpeech-TokenizationOffsets
                tests:
                  - PartOfSpeechAdapter_Analyze_MultiSentenceText_TokenOffsetsIndexSourceInSentenceOrder

              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-TagReporting
                title: >-
                  The PartOfSpeechAdapter class shall report, for each tagged token, its
                  Universal Dependencies tag name, a confidence from 0 to 1 and whether the
                  tagger's lexicon knows the token's spelling.
                justification: |
                  The analyzer needs the tag for its annotation and the confidence and
                  known-word flag for its detailed result and its unknown-word count, without any
                  tagger type leaving the adapter.
                children:
                  - Speech-OTS-PartOfSpeech-ConfidenceAndKnownWord
                tests:
                  - PartOfSpeechAdapter_Analyze_TagTrue_ReportsTagConfidenceAndKnownWord

              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-ConcurrentUseAndRecovery
                title: >-
                  The PartOfSpeechAdapter class shall give the same tagged tokens to every call on
                  one adapter, including calls that start at the same moment on a fresh adapter,
                  shall report a tagger factory that fails or returns no tagger as an exception of
                  that call only (a later call that finds a working tagger shall succeed), and
                  shall report an unusable tagger as InvalidOperationException rather than as a
                  null reference.
                justification: |
                  The tagger is large to load and is shared by every analyzer, so many threads may
                  be its first users. A failure to load it (for example a transient out-of-memory
                  condition) must not disable English analysis for the rest of the process. How the
                  tagger is obtained (lazily, once, shared by one process-wide adapter, with a
                  failed creation not cached) is a design strategy recorded in the part-of-speech
                  adapter design; the observable contract is correct results under concurrency and
                  recovery after a failure.
                children:
                  - Speech-OTS-PartOfSpeech-DefaultTagger
                  - Speech-OTS-PartOfSpeech-ThreadSafety
                tests:
                  - PartOfSpeechAdapter_Analyze_RepeatedCalls_ReturnSameTaggedTokens
                  - PartOfSpeechAdapter_Analyze_ConcurrentFirstUses_ReturnIdenticalResults
                  - PartOfSpeechAdapter_Analyze_FactoryFailsOnce_NextCallSucceeds
                  - PartOfSpeechAdapter_Analyze_ConcurrentCallersAfterOneFailure_OnlyTheFailingCallSeesIt
                  - PartOfSpeechAdapter_Analyze_FactoryReturnsNull_ThrowsInvalidOperationException

              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-UntaggedSplit
                title: >-
                  The PartOfSpeechAdapter class shall split a text into sentences and tokens, with
                  no tag on any token, when tagging is not requested, and shall return no sentences
                  for a text that has no tokens whether or not tagging is requested.
                justification: |
                  Sentence boundaries do not need the tagger, so a host that wants only boundaries
                  gets untagged tokens, and an empty request gets an empty result.
                tests:
                  - PartOfSpeechAdapter_Analyze_TagFalse_ReportsUntaggedTokens
                  - PartOfSpeechAdapter_Analyze_TextWithoutTokens_ReturnsNoSentences

              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-Cancellation
                title: >-
                  The PartOfSpeechAdapter class shall throw OperationCanceledException for an
                  already-canceled token, and when cancellation is requested while the tagger is
                  obtained or while a sentence (including the only or last one) is tagged, instead
                  of returning a result.
                justification: |
                  Cancellation has to be honored wherever it arrives, not only between sentences,
                  so a long text stops promptly and a canceled request never returns a result. The
                  polling points (before each sentence, after the tagger is obtained, after each
                  sentence, periodically while tokens are copied) are recorded in the part-of-speech
                  adapter design.
                tests:
                  - PartOfSpeechAdapter_Analyze_CanceledToken_ThrowsOperationCanceledException
                  - PartOfSpeechAdapter_Analyze_CanceledDuringTaggerInitialization_ThrowsOperationCanceledException
                  - PartOfSpeechAdapter_Analyze_CanceledAfterOnlySentenceTagged_Throws
                  - PartOfSpeechAdapter_Analyze_CanceledAfterFinalSentenceTagged_Throws

              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-ArgumentValidation
                title: >-
                  The PartOfSpeechAdapter class shall throw ArgumentNullException for a null
                  tagger factory and for a null text.
                justification: |
                  A programming error should surface immediately with a clear exception.
                tests:
                  - PartOfSpeechAdapter_NullArguments_ThrowArgumentNullException
