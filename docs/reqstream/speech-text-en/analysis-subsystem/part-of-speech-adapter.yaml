---
# Software Unit Requirements for PartOfSpeechAdapter
#
# These requirements describe the design-level behavior of the PartOfSpeechAdapter unit, the one
# internal seam over the DemaConsulting.PartOfSpeech package, decomposing the parent SpeechTextEn
# AnalysisSubsystem requirements. Each requirement states one observable behavior. The OTS
# requirements of the tagging package are children of the requirements that depend on them.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/PartOfSpeechAdapterTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: PartOfSpeechAdapter Requirements
            requirements:
              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-TaggedSplit
                title: >-
                  The PartOfSpeechAdapter class shall split a text into sentences and tokens in text
                  order, with every token's offset and length indexing exactly the text that was
                  given (including after line breaks), shall report for each tagged token its
                  Universal Dependencies tag name, a confidence from 0 to 1 and whether the tagger's
                  lexicon knows the token's spelling, shall split the text with no tag on any token
                  when tagging is not requested and return no sentences for a text that has no
                  tokens, and shall describe the tokens of a tagged sentence for the heteronym
                  features, one description per token in sentence order, exactly as the heteronym
                  context builder describes each token from its text, span, tag and confidence.
                justification: |
                  Annotations and sentence breaks must index the text the Speech library supplied,
                  so the adapter reports positions in that text and never in a rebuilt one. The
                  analyzer needs the tag for its annotation and the confidence and known-word flag
                  for its detailed result and its unknown-word count, without any tagger type
                  leaving the adapter; sentence boundaries do not need the tagger, and an empty
                  request gets an empty result. The model is trained on the contexts the trainer
                  builds and applied to the contexts the analyzer builds, so a single description of
                  a sentence that both use means the two cannot differ in what they feed the
                  features; the adapter owns it so that the heteronym subsystem need not depend on
                  the analysis subsystem.
                children:
                  - Speech-OTS-PartOfSpeech-TokenizationOffsets
                  - Speech-OTS-PartOfSpeech-ConfidenceAndKnownWord
                tests:
                  - PartOfSpeechAdapter_Analyze_MultiSentenceText_TokenOffsetsIndexSourceInSentenceOrder
                  - PartOfSpeechAdapter_Analyze_TagTrue_ReportsTagConfidenceAndKnownWord
                  - PartOfSpeechAdapter_DescribeSentence_TaggedSentence_DescribesEveryTokenLikeContextCreate
                  - PartOfSpeechAdapter_Analyze_TagFalse_ReportsUntaggedTokens
                  - PartOfSpeechAdapter_Analyze_TextWithoutTokens_ReturnsNoSentences

              - id: SpeechTextEn-Analysis-PartOfSpeechAdapter-Resilience
                title: >-
                  The PartOfSpeechAdapter class shall give the same tagged tokens to calls that start
                  at the same moment on a fresh adapter, shall report a tagger factory that fails or
                  returns no tagger as an exception of that call only (a later call that finds a
                  working tagger shall succeed, and an unusable tagger is reported as
                  InvalidOperationException rather than as a null reference), shall throw
                  OperationCanceledException instead of returning a result for an already-canceled
                  token and when cancellation is requested while the tagger is obtained or while the
                  last sentence is tagged, and shall throw ArgumentNullException for a null tagger
                  factory and for a null text.
                justification: |
                  The tagger is large to load and is shared by every analyzer, so many threads may be
                  its first users. A failure to load it (for example a transient out-of-memory
                  condition) must not disable English analysis for the rest of the process.
                  Cancellation has to be honored wherever it arrives, not only between sentences, so
                  a long text stops promptly and a canceled request never returns a result. A
                  programming error should surface immediately with a clear exception. How the
                  tagger is obtained (lazily, once, shared by one process-wide adapter, with a failed
                  creation not cached) and where the cancellation token is polled are design
                  strategies recorded in the part-of-speech adapter design; the observable contract
                  is correct results under concurrency, recovery after a failure and prompt
                  cancellation.
                children:
                  - Speech-OTS-PartOfSpeech-DefaultTagger
                  - Speech-OTS-PartOfSpeech-ThreadSafety
                tests:
                  - PartOfSpeechAdapter_Analyze_ConcurrentFirstUses_ReturnIdenticalResults
                  - PartOfSpeechAdapter_Analyze_FactoryFailsOnce_NextCallSucceeds
                  - PartOfSpeechAdapter_Analyze_FactoryReturnsNull_ThrowsInvalidOperationException
                  - PartOfSpeechAdapter_Analyze_CanceledToken_ThrowsOperationCanceledException
                  - PartOfSpeechAdapter_Analyze_CanceledDuringTaggerInitialization_ThrowsOperationCanceledException
                  - PartOfSpeechAdapter_Analyze_CanceledAfterFinalSentenceTagged_Throws
                  - PartOfSpeechAdapter_NullArguments_ThrowArgumentNullException
