---
# Software Unit Requirements for TextEnAnnotations
#
# These requirements describe the design-level behavior of the TextEnAnnotations unit, decomposing
# the parent SpeechTextEn AnalysisSubsystem requirements. Each requirement states one observable
# behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/TextEnAnnotationsTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: TextEnAnnotations Requirements
            requirements:
              - id: SpeechTextEn-Analysis-TextEnAnnotations-KindNames
                title: >-
                  The TextEnAnnotations class shall declare the six annotation kind names of the
                  package family (normalization, part of speech, reading, reading confidence,
                  pronunciation and spell-out) as distinct constants.
                justification: |
                  Backends reference the kinds by name, so the full vocabulary has to be stable
                  from the first release even though later releases will add the producers of the
                  other kinds. This release produces four of the six (normalization, part of
                  speech, spell-out and pronunciation); the two reading kinds are reserved.
                tests:
                  - TextEnAnnotations_Kinds_HaveDocumentedDistinctNames

              - id: SpeechTextEn-Analysis-TextEnAnnotations-ReadPartOfSpeech
                title: >-
                  The TextEnAnnotations class shall read the part of speech out of an annotation
                  of the part-of-speech kind whose value is a Universal Dependencies tag, and
                  shall report false, without throwing, for an annotation of another kind or with
                  a value outside the tag set.
                justification: |
                  A backend calls the reader on every annotation of a segment, most of which may
                  be of other kinds, and must not parse kind and value strings itself.
                tests:
                  - TextEnAnnotations_TryReadPartOfSpeech_PartOfSpeechAnnotation_ReturnsTagName
                  - TextEnAnnotations_TryReadPartOfSpeech_OtherKindOrUnknownValue_ReturnsFalse

              - id: SpeechTextEn-Analysis-TextEnAnnotations-ReadArgumentValidation
                title: >-
                  The TextEnAnnotations class's readers shall throw ArgumentNullException for a
                  null annotation.
                justification: |
                  A programming error should surface immediately with a clear exception.
                tests:
                  - TextEnAnnotations_TryReadPartOfSpeech_NullAnnotation_ThrowsArgumentNullException
                  - TextEnAnnotations_TryReadNormalized_NullAnnotation_ThrowsArgumentNullException
                  - TextEnAnnotations_TryReadReplacement_OtherKindMalformedOrNull_ReturnsFalseOrThrows

              - id: SpeechTextEn-Analysis-TextEnAnnotations-ReadNormalized
                title: >-
                  The TextEnAnnotations class shall read the spoken text out of an annotation of
                  the normalization kind, including the empty text of a dropped character, and
                  shall report false, without throwing, for an annotation of another kind.
                justification: |
                  A backend calls the reader on every annotation of a segment, most of which may
                  be of other kinds, and must not parse kind and value strings itself.
                tests:
                  - TextEnAnnotations_TryReadNormalized_NormalizationAnnotation_ReturnsSpokenText
                  - TextEnAnnotations_TryReadNormalized_OtherKind_ReturnsFalse

              - id: SpeechTextEn-Analysis-TextEnAnnotations-ReadSpellOut
                title: >-
                  The TextEnAnnotations class shall read the letters out of an annotation of the
                  spell-out kind whose value is single capital ASCII letters separated by single
                  spaces with at most one padding space on either side, returning the value exactly
                  as stored, and shall report false, without throwing, for an annotation of
                  another kind or with any other value.
                justification: |
                  A backend that speaks letters by name must be able to rely on the value being
                  letters, so the reader accepts only the grammar the library produces and a
                  malformed value from any other source is an ordinary "no" rather than a crash or
                  a wrongly spoken word.
                tests:
                  - TextEnAnnotations_TryReadSpellOut_WellFormedLetters_ReturnsValueExactly
                  - TextEnAnnotations_TryReadSpellOut_OtherKindOrMalformedValue_ReturnsFalse

              - id: SpeechTextEn-Analysis-TextEnAnnotations-ReadPronunciation
                title: >-
                  The TextEnAnnotations class shall read the scheme and the phonemes out of an
                  annotation of the pronunciation kind whose value is a scheme from the closed list
                  (ipa or arpabet), a colon and phonemes that satisfy that scheme's syntax, splitting
                  at the first colon, and shall report false, without throwing, for an annotation of
                  another kind, an unknown scheme or malformed phonemes.
                justification: |
                  A backend that supports a notation uses the phonemes for the word, and one that
                  does not must be able to tell that and speak the word as usual, so the reader
                  returns a typed scheme and reports anything it cannot use as a plain "no".
                tests:
                  - TextEnAnnotations_TryReadPronunciation_WellFormedValue_ReturnsSchemeAndPhonemes
                  - TextEnAnnotations_TryReadPronunciation_OtherKindOrMalformedValue_ReturnsFalse

              - id: SpeechTextEn-Analysis-TextEnAnnotations-ReadReplacement
                title: >-
                  The TextEnAnnotations class shall read the spoken replacement out of either a
                  normalization annotation (reporting words, including the empty text of a dropped
                  character) or a well-formed spell-out annotation (reporting letters to speak by
                  letter name), shall report a normalization annotation as not spelled whatever its
                  value holds, and shall report false, without throwing, for any other kind or a
                  malformed spelled value.
                justification: |
                  The two kinds replace the spoken text of a span and form one ascending sequence,
                  so a backend collecting them needs one call that returns the value and whether it
                  is letters, instead of two readers whose results it must merge. Only the kind
                  says letters: a host's payload of "I" is a word, so the flag is never derived
                  from the value of a normalization annotation.
                tests:
                  - TextEnAnnotations_TryReadReplacement_NormAndSpell_ReturnValueAndSpelledFlag
                  - TextEnAnnotations_TryReadReplacement_OtherKindMalformedOrNull_ReturnsFalseOrThrows
