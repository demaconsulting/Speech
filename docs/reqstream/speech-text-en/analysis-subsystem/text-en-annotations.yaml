---
# Software Unit Requirements for TextEnAnnotations
#
# These requirements describe the design-level behavior of the TextEnAnnotations unit, decomposing
# the parent SpeechTextEn AnalysisSubsystem requirements. Each requirement states one observable
# behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/TextEnAnnotationsTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: TextEnAnnotations Requirements
            requirements:
              - id: SpeechTextEn-Analysis-TextEnAnnotations-KindNames
                title: >-
                  The TextEnAnnotations class shall declare the six annotation kind names of the
                  package family (normalization, part of speech, reading, reading confidence,
                  pronunciation and spell-out) as distinct constants.
                justification: |
                  Backends reference the kinds by name, so the full vocabulary has to be stable from
                  the first release. The two reading kinds are emitted together on the same span and
                  are read back by the readers of the unit.
                tests:
                  - TextEnAnnotations_Kinds_HaveDocumentedDistinctNames

              - id: SpeechTextEn-Analysis-TextEnAnnotations-Readers
                title: >-
                  The TextEnAnnotations class shall read, out of an annotation of the matching kind,
                  the Universal Dependencies tag of a part-of-speech annotation; the spoken text of a
                  normalization annotation (including the empty text of a dropped character); the
                  letters of a spell-out annotation whose value is single capital ASCII letters
                  separated by single spaces with at most one padding space on either side, exactly
                  as stored; the scheme (ipa or arpabet) and the phonemes of a pronunciation
                  annotation whose phonemes satisfy that scheme's syntax, splitting at the first
                  colon; the spoken replacement of either a normalization annotation (never
                  reported as spelled, whatever its value holds) or a well-formed spell-out
                  annotation (reported as spelled); the id of a reading annotation whose value
                  satisfies the reading id grammar, without checking it against the inventory; and
                  the confidence of a reading-confidence annotation whose value is an unsigned
                  decimal number from 0 to 1 in ASCII digits with an optional period and at most six
                  decimals, giving the same number under every culture; and every reader shall
                  report false, without throwing, for an annotation of another kind or with a value
                  outside its grammar, and shall throw ArgumentNullException for a null annotation.
                justification: |
                  A backend calls the readers on every annotation of a segment, most of which may be
                  of other kinds, and must not parse kind and value strings itself, so a malformed
                  value from any source is an ordinary "no" rather than a crash or a wrongly spoken
                  word. A backend that speaks letters by name must be able to rely on the value being
                  letters; one that does not support a notation must be able to tell that and speak
                  the word as usual. The two replacement kinds form one ascending sequence, so one
                  call returns the value and whether it is letters; only the kind says letters,
                  because a host's payload of "I" is a word. A backend built against a newer
                  inventory must still read an id this release does not know, so only the grammar is
                  checked. Reading the confidence with the current culture would give 0.5 on one
                  machine and nothing or 5 on another, and a value outside the probability range must
                  be an ordinary "no".
                tests:
                  - TextEnAnnotations_TryReadPartOfSpeech_PartOfSpeechAnnotation_ReturnsTagName
                  - TextEnAnnotations_TryReadPartOfSpeech_OtherKindOrUnknownValue_ReturnsFalse
                  - TextEnAnnotations_TryReadNormalized_NormalizationAnnotation_ReturnsSpokenText
                  - TextEnAnnotations_TryReadNormalized_OtherKind_ReturnsFalse
                  - TextEnAnnotations_TryReadNormalized_NullAnnotation_ThrowsArgumentNullException
                  - TextEnAnnotations_TryReadSpellOut_WellFormedLetters_ReturnsValueExactly
                  - TextEnAnnotations_TryReadSpellOut_OtherKindOrMalformedValue_ReturnsFalse
                  - TextEnAnnotations_TryReadPronunciation_WellFormedValue_ReturnsSchemeAndPhonemes
                  - TextEnAnnotations_TryReadPronunciation_OtherKindOrMalformedValue_ReturnsFalse
                  - TextEnAnnotations_TryReadReplacement_NormAndSpell_ReturnValueAndSpelledFlag
                  - TextEnAnnotations_TryReadReplacement_OtherKindMalformedOrNull_ReturnsFalseOrThrows
                  - TextEnAnnotations_TryReadReading_WellFormedId_ReturnsId
                  - TextEnAnnotations_TryReadReading_OtherKindOrIllFormedId_ReturnsFalse
                  - TextEnAnnotations_TryReadReadingConfidence_ValidValue_ReturnsInvariantNumberUnderEveryCulture
                  - TextEnAnnotations_TryReadReadingConfidence_InvalidValueOrKind_ReturnsFalse
