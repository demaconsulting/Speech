---
# Software Unit Requirements for PronunciationOverrides
#
# These requirements describe the design-level behavior of the PronunciationOverrides unit (and the
# PronunciationOverrideEntry record, the OverrideAction and PronunciationScheme enumerations and the
# internal OverrideSyntax grammars that are documented with it), decomposing the parent SpeechTextEn
# AnalysisSubsystem requirements. The unit is the immutable dictionary of host-supplied
# pronunciation overrides: it validates entries, loads the tab-separated dictionary format, and
# finds which tokens of a text an entry applies to. Each requirement states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/PronunciationOverridesTests.cs, with
# the sample dictionary TestData/overrides-dictionary.tsv and the golden file
# TestData/overrides-cases.tsv.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: PronunciationOverrides Requirements
            requirements:
              - id: SpeechTextEn-Analysis-PronunciationOverrides-EntryValidation
                title: >-
                  The PronunciationOverrides class shall reject, with an ArgumentException whose
                  message holds the zero-based entry index and a fixed reason but never the word
                  or the payload, an entry whose word is empty, longer than 64 UTF-16 code units,
                  not well-formed UTF-16, not starting with a letter, not ending with a letter or
                  a decimal digit, containing a character other than letters, combining marks,
                  decimal digits and the characters ' ’ - . & / _, or mixing the plain and the
                  typographic apostrophe, an entry whose action is not defined, an entry whose
                  payload does not fit its action, and a spell-out entry whose word is not 1 to 32
                  ASCII letters, and shall throw ArgumentNullException for a null entry list or
                  element.
                justification: |
                  A dictionary is host configuration that decides what is spoken, so a malformed
                  entry must fail loudly where it is added rather than silently never match. The
                  key grammar keeps a key to what the tokenizer can deliver as one token (a
                  leading or trailing apostrophe, hyphen or period is not a word the matcher can
                  find), letter names exist only for the letters A to Z, and the error names the
                  position without echoing text, because a dictionary may hold names or other
                  sensitive words that must not reach a log.
                tests:
                  - PronunciationOverrides_Create_InvalidWord_ThrowsWithEntryIndexAndNoContent
                  - PronunciationOverrides_Create_WordLengthBoundary_RejectsOnlyTooLong
                  - PronunciationOverrides_Create_ValidWord_IsAccepted
                  - PronunciationOverrides_Create_UndefinedAction_Throws
                  - PronunciationOverrides_Create_ActionPayloadMismatch_Throws
                  - PronunciationOverrides_Create_SpellOutNonAsciiOrTooLong_Throws
                  - PronunciationOverrides_Create_NullEntriesOrElement_Throws

              - id: SpeechTextEn-Analysis-PronunciationOverrides-PayloadGrammar
                title: >-
                  The PronunciationOverrides class shall accept as the payload of a say entry only
                  1 to 256 UTF-16 code units of letters, combining marks, apostrophes, hyphens and
                  single spaces between words (with at least one letter, no digit and no clause
                  punctuation), and as the payload of a pronunciation entry only ipa: or arpabet:
                  followed by phonemes in that scheme's syntax (ipa: 1 to 128 UTF-16 code units
                  without whitespace or control, format, private-use or unassigned characters;
                  arpabet: 1 to 32 phones of one to three capital letters and an optional stress
                  digit 0 to 2, separated by single spaces), and shall reject any other scheme.
                justification: |
                  A spoken replacement is handed to a backend as plain words, so it cannot carry a
                  digit or a comma that would change how the backend splits clauses (a number is
                  written in words), and a phoneme string must be well formed enough that a
                  backend never receives text it cannot even parse. Whether a symbol belongs to a
                  particular phoneme inventory is the backend's concern, so only the syntax is
                  checked here and the scheme list is closed so that a new notation is a release,
                  not a host decision.
                tests:
                  - PronunciationOverrides_Create_SayPayload_GrammarEnforced
                  - PronunciationOverrides_Create_SayPayloadLength_BoundaryIsInclusive
                  - PronunciationOverrides_Create_PronunciationPayload_SchemeAndSyntaxEnforced
                  - PronunciationOverrides_Create_PhonemeLengthBounds_AreInclusive
                  - PronunciationOverrides_Factories_ProduceValidatedEntries

              - id: SpeechTextEn-Analysis-PronunciationOverrides-DuplicateKeys
                title: >-
                  The PronunciationOverrides class shall reject as a duplicate two entries that
                  have the same word and the same case flag (the words compared with
                  OrdinalIgnoreCase for case-insensitive entries, and with the plain and the
                  typographic apostrophe counted as one), shall never let one entry silently
                  replace another, and shall accept a case-sensitive and a case-insensitive entry
                  for the same word and case-sensitive entries that differ only in case.
                justification: |
                  Two entries for one word are a configuration mistake whose outcome ("last one
                  wins") would depend on file order, so it is reported; a sensitive and an
                  insensitive entry for the same word are a deliberate pair (a name and the common
                  word it resembles) with a defined precedence.
                tests:
                  - PronunciationOverrides_Create_DuplicateKeys_Throws
                  - PronunciationOverrides_Create_SensitiveAndInsensitiveSameWord_Allowed

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Limits
                title: >-
                  The PronunciationOverrides class shall bound its input: at most 10,000 entries,
                  words of at most 64 and payloads of at most 256 UTF-16 code units, tab-separated
                  lines of at most 1,024 characters and at most 50,000 lines (counting blank and
                  comment lines), shall accept input exactly at each limit, and shall stop reading
                  an endless input without line breaks after one character more than a line may
                  hold and an endless input of short lines after one line more than a file may
                  hold.
                justification: |
                  A dictionary is read from a file the host does not control, so unbounded input
                  would exhaust memory or never return; and a dictionary is searched on every
                  request, so its size bounds the cost of a lookup. Bounds that are exact (the
                  limit itself is accepted) are documented and testable.
                tests:
                  - PronunciationOverrides_Create_EntryCountBoundary_IsInclusive
                  - PronunciationOverrides_Create_WordLengthBoundary_RejectsOnlyTooLong
                  - PronunciationOverrides_Create_SayPayloadLength_BoundaryIsInclusive
                  - PronunciationOverrides_Create_PhonemeLengthBounds_AreInclusive
                  - PronunciationOverrides_FromTsv_LineLengthBoundary_IsInclusive
                  - PronunciationOverrides_FromTsv_LineCountBoundary_IsInclusive
                  - PronunciationOverrides_FromTsv_EntryCountBoundary_NamesTheLine
                  - PronunciationOverrides_FromTsv_EndlessInputWithoutNewline_StopsAtLimit
                  - PronunciationOverrides_FromTsv_EndlessShortLines_StopsAtLineLimit

              - id: SpeechTextEn-Analysis-PronunciationOverrides-TsvLoading
                title: >-
                  The PronunciationOverrides class shall read a dictionary from tab-separated text
                  with one entry per line (word, case, action and an optional payload), ignoring
                  empty lines and lines starting with a number sign, accepting LF and CRLF line ends, a missing
                  final line end, a byte-order mark at the start of the first line and an empty
                  fourth column for a skip or spell entry, preserving the order of the file, and
                  producing exactly the dictionary that Create produces from the same entries.
                justification: |
                  A non-programmer maintains a pronunciation dictionary as a text file, so the
                  format must be simple, forgiving about line ends and the byte-order mark that
                  editors add, and exactly equivalent to building the entries in code, so there is
                  one set of rules to learn and test.
                tests:
                  - PronunciationOverrides_FromTsv_SampleDictionary_ParsesEntries
                  - PronunciationOverrides_SampleDictionaryKeys_AreSingleTokensOfTheRealTokenizer
                  - PronunciationOverrides_FromTsv_LineEndingsAndBom_AreAccepted
                  - PronunciationOverrides_FromTsv_EquivalentToCreate

              - id: SpeechTextEn-Analysis-PronunciationOverrides-TsvValidation
                title: >-
                  The PronunciationOverrides class shall reject malformed tab-separated text with an
                  InvalidDataException whose message holds the one-based line number and a fixed
                  reason but never any text of the line (a wrong number of columns, an unknown case
                  or action word, a payload where none is allowed or none where one is required, a
                  column with leading or trailing whitespace, a line of only whitespace, a control
                  character other than the tab separator on any line including a comment, a lone
                  carriage return, an invalid entry, a duplicate on its later line), shall throw
                  ArgumentNullException for a null reader, shall let exceptions of the reader
                  propagate, and shall neither dispose nor retain the reader.
                justification: |
                  A dictionary file is edited by hand, so the error must say which line is wrong,
                  but a pronunciation dictionary can hold names that must not reach a log, so it
                  must never say what is on the line. The reader belongs to the caller, who may
                  keep reading from it or must close it itself.
                tests:
                  - PronunciationOverrides_FromTsv_MalformedRows_ThrowWithLineNumberAndNoContent
                  - PronunciationOverrides_FromTsv_DuplicateAndNullReader_Throw
                  - PronunciationOverrides_FromTsv_ReaderFailure_Propagates
                  - PronunciationOverrides_FromTsv_DoesNotDisposeReader

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Immutability
                title: >-
                  The PronunciationOverrides class shall be immutable once built: a later change to
                  the supplied collection shall have no effect on it, it shall expose the entries
                  only through a read-only view in the order
                  supplied, shall share one empty dictionary, and shall give identical results to
                  concurrent lookups.
                justification: |
                  One dictionary is shared by every analyzer and request of a model, on many
                  threads, so it must not be changeable after it was validated, by the caller who
                  built it or by anyone who reads its entries.
                tests:
                  - PronunciationOverrides_Create_SourceMutatedAfterwards_DoesNotAffectDictionary
                  - PronunciationOverrides_Entries_IsReadOnlyCopy
                  - PronunciationOverrides_Empty_IsSharedAndEmpty
                  - PronunciationOverrides_Resolve_ConcurrentCalls_ReturnIdenticalDirectives

              - id: SpeechTextEn-Analysis-PronunciationOverrides-CaseRules
                title: >-
                  The PronunciationOverrides class shall compare a case-sensitive entry with the
                  exact UTF-16 code units and a case-insensitive entry with OrdinalIgnoreCase,
                  shall let a case-sensitive entry win over a case-insensitive entry for the same
                  token, shall never consult the current culture (Turkish and Azeri dotted and
                  dotless I never fold into the ASCII letters), and shall apply no Unicode
                  normalization form.
                justification: |
                  A name and the common word it resembles differ only in case ("Polish" and
                  "polish"), so the dictionary must let the exact spelling win over the general
                  one, and the result must not depend on the machine's culture, where "I" would
                  otherwise fold differently on a Turkish computer. A key in one normalization
                  form is a different key from the same text in another, which the documentation
                  states, so the behavior is predictable rather than clever.
                tests:
                  - PronunciationOverrides_Resolve_CaseSensitiveBeatsInsensitive
                  - PronunciationOverrides_Resolve_InsensitiveEntry_UsesOrdinalIgnoreCase
                  - PronunciationOverrides_Resolve_TurkishAndAzeriCurrentCulture_DoNotChangeMatching
                  - PronunciationOverrides_Resolve_SupplementaryLetters_MatchWithoutSplittingPairs
                  - PronunciationOverrides_Resolve_NoNormalizationFolding
                  - NormalizationSubsystem_Overrides_UnderForeignCultures_GiveIdenticalResults

              - id: SpeechTextEn-Analysis-PronunciationOverrides-WholeWordMatching
                title: >-
                  The PronunciationOverrides class shall match an entry only against one whole
                  token of the analyzed text, never against part of a token or several tokens, and
                  never when the character before or after the token is a letter, a combining mark
                  or a decimal digit (so the Do of a split Don't never matches), shall match the
                  stem of a clitic that the tokenizer splits off, a hyphenated compound only as a
                  whole, a word next to a tag placeholder, and a key with an apostrophe in either
                  apostrophe style.
                justification: |
                  Matching inside a word would make a dictionary entry for "Ann" rewrite "Annual",
                  and the tokenizer splits some contractions and not others, so the rule is stated
                  on the tokens it actually delivers and the neighbor test keeps the piece of a
                  split word from matching on its own. A tag placeholder is a separator, so the
                  words on both sides of an audio tag still match.
                tests:
                  - PronunciationOverrides_Resolve_PartialToken_DoesNotMatch
                  - PronunciationOverrides_Resolve_NeighborLetterMarkOrDigit_Blocks
                  - PronunciationOverrides_Resolve_CliticStem_Matches
                  - PronunciationOverrides_Resolve_HyphenCompound_OnlyWhole
                  - PronunciationOverrides_Resolve_ApostropheStyles_MatchBothSpellings
                  - PronunciationOverrides_Resolve_PlaceholderSeparators_AreBoundaries
                  - PronunciationOverrides_Resolve_AgainstNaiveReference_RandomKeysAndTexts

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Directives
                title: >-
                  The PronunciationOverrides class shall resolve a text's tokens to at most one
                  directive per matching token, in strictly ascending token order, carrying the
                  action of the entry (skip, replace with the spoken words, spell with no value,
                  pronounce with the scheme and phonemes), and none for a token no entry matches.
                justification: |
                  The normalization pass consumes the directives in one cursor walk, so they must
                  be ascending and unique, and a token that no entry matches must change nothing.
                  The golden file pins the resulting behavior on real tokens.
                tests:
                  - PronunciationOverrides_Resolve_Actions_MapToDirectives
                  - PronunciationOverrides_Resolve_OneDirectivePerToken_AscendingUnique
                  - PronunciationOverrides_Resolve_NoMatches_ReturnsNoDirectives
                  - PronunciationOverrides_GoldenCases_NormalizeAsDocumented

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Cancellation
                title: >-
                  The PronunciationOverrides class shall throw OperationCanceledException before any
                  work for a token that is already canceled, and shall throw it instead of
                  returning directives when cancellation is requested while a long text is being
                  looked up, and shall resolve a large text against a full dictionary to exactly
                  the directives of the words that are keys.
                justification: |
                  The lookup runs on every request on thread-pool threads and a stop or dispose
                  waits for the analyzer to return, so a long text must stop promptly. The large
                  text with a full dictionary and one huge token keeps the lookup honest about
                  adversarial input: the directives are the correct ones, however large the text.
                  How often the lookup polls the token and how its scan stays linear are design
                  choices recorded in the pronunciation overrides design.
                tests:
                  - PronunciationOverrides_Resolve_Cancellation_ThrowsOnPreCanceledTokenAndWhenCanceledWhileProcessing
                  - PronunciationOverrides_Resolve_LargeText_ResolvesExactlyTheMatchingWords

              - id: SpeechTextEn-Analysis-PronunciationOverrides-ArgumentValidation
                title: >-
                  The PronunciationOverrides class shall throw ArgumentNullException for a null
                  text and ArgumentException for a token that is empty or outside the text,
                  without arithmetic that can overflow on extreme offsets.
                justification: |
                  A programming error should surface immediately with a clear exception rather than
                  as a wrong match, and a hostile token list must not be able to wrap an offset
                  around.
                tests:
                  - PronunciationOverrides_Resolve_NullText_Throws
                  - PronunciationOverrides_Resolve_TokenOutsideText_Throws

              - id: SpeechTextEn-Analysis-PronunciationOverrides-ReadingAction
                title: >-
                  The PronunciationOverrides class shall accept a reading entry (the reading action,
                  numeric value 5, built with the entry factory or written as the action word
                  reading in the tab-separated file) whose payload is a reading id, shall reject a
                  null word or payload in the entry factory, and shall still reject every other
                  unknown action word with the line number and a fixed reason.
                justification: |
                  A host fixes the reading of a word with the same dictionary, file format and
                  rules it uses for the other overrides, so there is one set of rules to learn; the
                  action word is part of the file format and the numeric value part of the public
                  enumeration, so both are pinned.
                tests:
                  - PronunciationOverrideEntry_Reading_CreatesReadingEntryWithIdPayload
                  - PronunciationOverrides_FromTsv_ReadingAction_IsValidatedWithLineNumbers

              - id: SpeechTextEn-Analysis-PronunciationOverrides-ReadingStrictValidation
                title: >-
                  The PronunciationOverrides class shall validate a reading entry against the
                  reading inventory when the dictionary is built, rejecting, with the entry index
                  or the line number and a fixed reason that never echoes the word or the id, a
                  missing or empty reading id, an ill-formed id, an id that is not in the inventory
                  and a word that is not a form of that reading (compared with ASCII-only case
                  folding, so a non-ASCII look-alike is not a form).
                justification: |
                  A reading id that no word can have, or an id attached to the wrong word, would be
                  silently ignored at run time, which hides a configuration mistake until a user
                  hears the wrong word; checking when the entry is written puts the error where
                  the line is. The reasons are fixed text because a dictionary may hold names.
                tests:
                  - PronunciationOverrides_Create_ReadingEntryInvalid_ThrowsFixedReason
                  - PronunciationOverrides_Create_ReadingEntryWordCase_IsFoldedAsciiOnly
                  - PronunciationOverrides_FromTsv_ReadingAction_IsValidatedWithLineNumbers

              - id: SpeechTextEn-Analysis-PronunciationOverrides-ReadingDirective
                title: >-
                  The PronunciationOverrides class shall resolve a token that a reading entry
                  matches to a reading directive carrying the reading id, matching a
                  case-insensitive entry whatever the case of the token and a case-sensitive entry
                  only in its own case.
                justification: |
                  The analyzer turns the directive into the reading annotations and the
                  normalization pass speaks the word as written; the matching rules are those of
                  every other action, so a reading entry never surprises a host that knows them.
                tests:
                  - PronunciationOverrides_Create_ReadingEntry_AcceptedAndResolvesToReadingDirective
