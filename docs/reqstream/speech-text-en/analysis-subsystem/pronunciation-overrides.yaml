---
# Software Unit Requirements for PronunciationOverrides
#
# These requirements describe the design-level behavior of the PronunciationOverrides unit (and the
# PronunciationOverrideEntry record, the OverrideAction and PronunciationScheme enumerations and the
# internal OverrideSyntax grammars that are documented with it), decomposing the parent SpeechTextEn
# AnalysisSubsystem requirements. The unit is the immutable dictionary of host-supplied
# pronunciation overrides: it validates entries, loads the tab-separated dictionary format, and
# finds which tokens of a text an entry applies to. Each requirement states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/PronunciationOverridesTests.cs, with
# the sample dictionary TestData/overrides-dictionary.tsv and the golden file
# TestData/overrides-cases.tsv.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: PronunciationOverrides Requirements
            requirements:
              - id: SpeechTextEn-Analysis-PronunciationOverrides-EntryValidation
                title: >-
                  The PronunciationOverrides class shall reject, with an ArgumentException whose
                  message holds the zero-based entry index and a fixed reason but never the word or
                  the payload, an entry whose word is empty, longer than 64 UTF-16 code units, not
                  well-formed UTF-16, not starting with a letter, not ending with a letter or a
                  decimal digit, containing a character other than letters, combining marks, decimal
                  digits and the characters ' ’ - . & / _, or mixing the plain and the typographic
                  apostrophe, an entry whose action is not defined or whose payload does not fit its
                  action (a say payload of 1 to 256 UTF-16 code units of letters, combining marks,
                  apostrophes, hyphens and single spaces between words with at least one letter, no
                  digit and no clause punctuation; a pronunciation payload of ipa: or arpabet:
                  followed by phonemes in that scheme's syntax, ipa of 1 to 128 code units without
                  whitespace or control, format, private-use or unassigned characters and arpabet of
                  1 to 32 phones of one to three capital letters and an optional stress digit 0 to
                  2), a spell-out entry whose word is not 1 to 32 ASCII letters, a duplicate of the
                  same word and case flag (compared with OrdinalIgnoreCase for case-insensitive
                  entries and with the plain and the typographic apostrophe counted as one) and a
                  reading entry whose id is missing, ill-formed, not in the reading inventory or
                  attached to a word that is not a form of that reading (ASCII-only case folding), shall
                  accept a case-sensitive and a case-insensitive entry for the same word and
                  accept every input exactly at its limit (at most 10,000 entries, words of at most
                  64 and payloads of at most 256 UTF-16 code units), and shall throw
                  ArgumentNullException for a null entry list, element or factory argument.
                justification: |
                  A dictionary is host configuration that decides what is spoken, so a malformed
                  entry must fail loudly where it is added rather than silently never match. The key
                  grammar keeps a key to what the tokenizer can deliver as one token, letter names
                  exist only for the letters A to Z, a spoken replacement is handed to a backend as
                  plain words (a number is written in words) and a phoneme string must be well formed
                  enough that a backend never receives text it cannot parse; whether a symbol belongs
                  to a phoneme inventory is the backend's concern, and the scheme list is closed so
                  that a new notation is a release, not a host decision. Two entries for one word are
                  a mistake whose outcome would depend on file order, while a sensitive and an
                  insensitive entry for the same word are a deliberate pair (a name and the common
                  word it resembles). A reading id that no word can have, or an id attached to the
                  wrong word, would be silently ignored at run time. The error names the position
                  without echoing text, because a dictionary may hold names that must not reach a
                  log; documented bounds that are exact (the limit itself is accepted) are testable.
                tests:
                  - PronunciationOverrides_Create_InvalidWord_ThrowsWithEntryIndexAndNoContent
                  - PronunciationOverrides_Create_WordLengthBoundary_RejectsOnlyTooLong
                  - PronunciationOverrides_Create_ValidWord_IsAccepted
                  - PronunciationOverrides_Create_UndefinedAction_Throws
                  - PronunciationOverrides_Create_ActionPayloadMismatch_Throws
                  - PronunciationOverrides_Create_SpellOutNonAsciiOrTooLong_Throws
                  - PronunciationOverrides_Create_NullEntriesOrElement_Throws
                  - PronunciationOverrides_Create_SayPayload_GrammarEnforced
                  - PronunciationOverrides_Create_SayPayloadLength_BoundaryIsInclusive
                  - PronunciationOverrides_Create_PronunciationPayload_SchemeAndSyntaxEnforced
                  - PronunciationOverrides_Create_PhonemeLengthBounds_AreInclusive
                  - PronunciationOverrides_Create_DuplicateKeys_Throws
                  - PronunciationOverrides_Create_SensitiveAndInsensitiveSameWord_Allowed
                  - PronunciationOverrides_AliasCollisions_AreRejectedByCreateAndFromTsv
                  - PronunciationOverrides_Create_EntryCountBoundary_IsInclusive
                  - PronunciationOverrides_Create_ReadingEntryInvalid_ThrowsFixedReason
                  - PronunciationOverrides_Create_ReadingEntryWordCase_IsFoldedAsciiOnly

              - id: SpeechTextEn-Analysis-PronunciationOverrides-TsvLoading
                title: >-
                  The PronunciationOverrides class shall read a dictionary from tab-separated text
                  with one entry per line (word, case, action and an optional payload; the action
                  words include reading), ignoring empty lines and lines starting with a number
                  sign, accepting LF and CRLF line ends, a missing final line end, a byte-order mark
                  at the start of the first line and an empty fourth column for a skip or spell
                  entry, preserving the order of the file and producing exactly the dictionary that
                  Create produces from the same entries; shall bound the input to lines of at most
                  1,024 characters and at most 50,000 lines (counting blank and comment lines),
                  accept input exactly at each limit and stop reading an endless input without line
                  breaks after one character more than a line may hold; shall reject malformed text
                  with an InvalidDataException whose message holds the one-based line number and a
                  fixed reason but never any text of the line (a wrong number of columns, an unknown
                  case or action word, a payload where none is allowed or none where one is
                  required, a column with leading or trailing whitespace, a line of only whitespace,
                  a control character other than the tab separator on any line including a comment,
                  a lone carriage return, an invalid entry including an invalid reading entry, a
                  duplicate on its later line); shall throw ArgumentNullException for a null
                  reader, let exceptions of the reader propagate, and neither dispose nor retain
                  the reader.
                justification: |
                  A non-programmer maintains a pronunciation dictionary as a text file, so the format
                  must be simple, forgiving about the line ends and the byte-order mark that editors
                  add, exactly equivalent to building the entries in code (one set of rules to learn
                  and test), and bounded, because the file is one the host does not control and
                  unbounded input would exhaust memory or never return. A file is edited by hand, so
                  the error must say which line is wrong, but it can hold names that must not reach a
                  log, so it never says what is on the line. The reader belongs to the caller, who
                  may keep reading from it or must close it itself.
                tests:
                  - PronunciationOverrides_FromTsv_SampleDictionary_ParsesEntries
                  - PronunciationOverrides_SampleDictionaryKeys_AreSingleTokensOfTheRealTokenizer
                  - PronunciationOverrides_FromTsv_LineEndingsAndBom_AreAccepted
                  - PronunciationOverrides_FromTsv_LineLengthBoundary_IsInclusive
                  - PronunciationOverrides_FromTsv_LineCountBoundary_IsInclusive
                  - PronunciationOverrides_FromTsv_EndlessInputWithoutNewline_StopsAtLimit
                  - PronunciationOverrides_FromTsv_MalformedRows_ThrowWithLineNumberAndNoContent
                  - PronunciationOverrides_FromTsv_DuplicateAndNullReader_Throw
                  - PronunciationOverrides_FromTsv_ReadingAction_IsValidatedWithLineNumbers
                  - PronunciationOverrides_FromTsv_ReaderFailure_Propagates
                  - PronunciationOverrides_FromTsv_DoesNotDisposeReader

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Immutability
                title: >-
                  The PronunciationOverrides class shall be immutable once built: a later change to
                  the supplied collection shall have no effect on it, it shall expose the entries
                  only through a read-only view in the order supplied, and it shall give identical
                  results to concurrent lookups.
                justification: |
                  One dictionary is shared by every analyzer and request of a model, on many threads,
                  so it must not be changeable after it was validated, by the caller who built it or
                  by anyone who reads its entries.
                tests:
                  - PronunciationOverrides_Create_SourceMutatedAfterwards_DoesNotAffectDictionary
                  - PronunciationOverrides_Resolve_ConcurrentCalls_ReturnIdenticalDirectives

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Matching
                title: >-
                  The PronunciationOverrides class shall resolve a text's tokens to at most one
                  directive per matching token, in strictly ascending token order, carrying the
                  action of the entry (skip, replace with the spoken words, spell with no value,
                  pronounce with the scheme and phonemes, or fix the reading with the reading id)
                  and none for a token no entry matches; shall match an entry only against one whole
                  token, never against part of a token or several tokens and never when the character
                  before or after the token is a letter, a combining mark or a decimal digit (so the
                  Do of a split Don't never matches), while matching the stem of a clitic that the
                  tokenizer splits off, a hyphenated compound only as a whole, a word next to a tag
                  placeholder and a key with an apostrophe in either apostrophe style; and shall
                  compare a case-sensitive entry with the exact UTF-16 code units and a
                  case-insensitive entry with OrdinalIgnoreCase, let a case-sensitive entry win over a case-insensitive entry for the same token, never consult the
                  current culture (Turkish and Azeri dotted and dotless I never fold into the ASCII
                  letters) and apply no Unicode normalization form.
                justification: |
                  The normalization pass consumes the directives in one cursor walk, so they must be
                  ascending and unique, and a token that no entry matches must change nothing; the
                  golden file pins the resulting behavior on real tokens. Matching inside a word
                  would make an entry for "Ann" rewrite "Annual", and the tokenizer splits some
                  contractions and not others, so the rule is stated on the tokens it delivers and
                  the neighbor test keeps the piece of a split word from matching on its own. A name
                  and the common word it resembles differ only in case ("Polish" and "polish"), so
                  the exact spelling must win over the general one, and the result must not depend on
                  the machine's culture; a key in one normalization form is a different key from the
                  same text in another, which the documentation states, so the behavior is
                  predictable rather than clever. The matching rules are those of every action, so a
                  reading entry never surprises a host that knows them.
                tests:
                  - PronunciationOverrides_Resolve_Actions_MapToDirectives
                  - PronunciationOverrides_Resolve_OneDirectivePerToken_AscendingUnique
                  - PronunciationOverrides_Create_ReadingEntry_AcceptedAndResolvesToReadingDirective
                  - PronunciationOverrides_Resolve_PartialToken_DoesNotMatch
                  - PronunciationOverrides_Resolve_NeighborLetterMarkOrDigit_Blocks
                  - PronunciationOverrides_Resolve_CliticStem_Matches
                  - PronunciationOverrides_Resolve_HyphenCompound_OnlyWhole
                  - PronunciationOverrides_Resolve_ApostropheStyles_MatchBothSpellings
                  - PronunciationOverrides_Resolve_ApostropheCaseVariants_SelectOwnEntry
                  - PronunciationOverrides_Resolve_SensitiveAliasBeatsInsensitive
                  - PronunciationOverrides_Resolve_PlaceholderSeparators_AreBoundaries
                  - PronunciationOverrides_Resolve_AgainstNaiveReference_RandomKeysAndTexts
                  - PronunciationOverrides_Resolve_CaseSensitiveBeatsInsensitive
                  - PronunciationOverrides_Resolve_InsensitiveEntry_UsesOrdinalIgnoreCase
                  - PronunciationOverrides_Resolve_TurkishAndAzeriCurrentCulture_DoNotChangeMatching
                  - PronunciationOverrides_Resolve_SupplementaryLetters_MatchWithoutSplittingPairs
                  - PronunciationOverrides_Resolve_NoNormalizationFolding
                  - PronunciationOverrides_GoldenCases_NormalizeAsDocumented

              - id: SpeechTextEn-Analysis-PronunciationOverrides-Contract
                title: >-
                  The PronunciationOverrides class shall throw OperationCanceledException before any
                  work for a token that is already canceled and instead of returning directives when
                  cancellation is requested while a long text is being looked up, and shall throw
                  ArgumentNullException for a null text and ArgumentException for a token that is
                  empty or outside the text, without arithmetic that can overflow on extreme
                  offsets.
                justification: |
                  The lookup runs on every request on thread-pool threads and a stop or dispose waits
                  for the analyzer to return, so a long text must stop promptly; how often the lookup
                  polls the token and how its scan stays linear are design choices recorded in the
                  pronunciation overrides design. A programming error should surface immediately with
                  a clear exception rather than as a wrong match, and a hostile token list must not be
                  able to wrap an offset around.
                tests:
                  - PronunciationOverrides_Resolve_Cancellation_ThrowsOnPreCanceledTokenAndWhenCanceledWhileProcessing
                  - PronunciationOverrides_Resolve_TokenOutsideText_Throws
