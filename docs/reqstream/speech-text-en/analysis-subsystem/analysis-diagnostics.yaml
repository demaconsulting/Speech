---
# Software Unit Requirements for AnalysisDiagnostics
#
# These requirements describe the design-level behavior of the AnalysisDiagnostics unit, decomposing
# the parent SpeechTextEn AnalysisSubsystem requirements. Each requirement states one observable
# behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/AnalysisDiagnosticsTests.cs
# and, for the events as the analyzer reports them,
# test/DemaConsulting.Speech.Text.En.Tests/AnalysisSubsystem/EnglishTextAnalyzerTests.cs and
# EnglishTextAnalyzerReadingTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: AnalysisSubsystem Requirements
        sections:
          - title: AnalysisDiagnostics Requirements
            requirements:
              - id: SpeechTextEn-Analysis-AnalysisDiagnostics-RequestEvent
                title: >-
                  The AnalysisDiagnostics class shall report exactly one Info-level event per
                  completed request to its sink, in the category TextEn.Analysis, carrying the
                  numbers of sentences, tokens, annotations, unknown words, normalizations, readings
                  chosen by default without a clear context, numeric fallbacks, overrides applied and
                  overrides ignored (both zero without a dictionary), in that fixed order, built
                  from fixed words and numbers only so that no word, token, annotation value or
                  dictionary content can appear in it, and the analyzer shall supply the counts from
                  the normalization result of the request, counting sentences as the reconciled
                  breaks plus one when the text has any token.
                justification: |
                  A host can group and filter by category and wants a summary of the work done, not
                  an event per word; the counts tell it how much the normalization changed, how
                  often it had to guess and whether its dictionary does anything. The library's
                  diagnostics contract forbids synthesized text content in any report, and a
                  dictionary can hold names, so building the message from counts alone makes a leak
                  impossible rather than merely unlikely.
                tests:
                  - AnalysisDiagnostics_ReportRequest_Sink_ReceivesOneInfoEventWithCounts
                  - AnalysisDiagnostics_FormatMessage_AnyCounts_ContainsOnlyFixedWordsAndNumbers
                  - EnglishTextAnalyzer_Analyze_NormalizedText_ReportsNormalizationAndAmbiguityCounts
                  - EnglishTextAnalyzer_Analyze_Overrides_ReportCountsAndNoContent

              - id: SpeechTextEn-Analysis-AnalysisDiagnostics-HeteronymAndModelEvents
                title: >-
                  The AnalysisDiagnostics class shall report, when at least one reading was assigned
                  to a request, exactly one Info-level event in the category TextEn.Heteronym
                  carrying the numbers of readings assigned, classified by the model, taken from a
                  form with a single candidate, set by a reading override and below the confidence
                  threshold (which the message also states), and none when no reading was assigned;
                  shall report a damaged or incompatible heteronym model as one Warning-level event
                  with a fixed message in the category TextEn.Model, which the analyzer reports at
                  most once per analyzer and never for a model that is merely absent; and shall build
                  both messages from fixed words and numbers written with the invariant culture only.
                justification: |
                  A host learns how much of the assignment came from the model and how much from its
                  own entries, how many readings were doubtful (the evidence for tuning the
                  threshold) and that its model was refused, without any word or reading id reaching
                  a log: a reading id begins with the lemma of the word, and culture-specific digits
                  would make the event differ between hosts. A separate event leaves the analysis
                  message, which hosts may already parse, as it was; repeating the warning on every
                  request would flood a log.
                tests:
                  - AnalysisDiagnostics_ReportReadings_Counts_ReceivesOneInfoEventInHeteronymCategory
                  - AnalysisDiagnostics_ReportReadings_NothingAssigned_ReportsNothing
                  - AnalysisDiagnostics_FormatReadingMessage_AnyCulture_ContainsOnlyFixedWordsAndInvariantNumbers
                  - AnalysisDiagnostics_ReportModelProblem_Sink_ReceivesOneFixedWarning
                  - EnglishTextAnalyzer_Analyze_Diagnostics_HeteronymEventIsCountsOnlyAndAtMostOnce
                  - EnglishTextAnalyzer_Analyze_LowConfidenceThreshold_CountsClassifiedReadingsBelowIt
                  - EnglishTextAnalyzer_Analyze_ModelWarning_OncePerAnalyzerOnlyForUnusableModel

              - id: SpeechTextEn-Analysis-AnalysisDiagnostics-SinkContainment
                title: >-
                  The AnalysisDiagnostics class shall accept a missing sink and report nothing, and
                  shall contain any exception thrown by its sink while it reports the request,
                  heteronym and model events, so that reporting never interrupts the analysis it
                  observes.
                justification: |
                  Diagnostics are optional, so an analyzer without a sink must work unchanged; and a
                  diagnostics sink is an observer whose contract forbids throwing, so if one throws
                  anyway the speech request it was observing must still complete with its result.
                tests:
                  - AnalysisDiagnostics_ReportRequest_ThrowingSink_IsContained
                  - AnalysisDiagnostics_ReportReadingsAndModelProblem_NullOrThrowingSink_AreContained
