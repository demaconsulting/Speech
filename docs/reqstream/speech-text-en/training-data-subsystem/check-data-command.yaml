---
# Software Unit Requirements for CheckDataCommand
#
# These requirements describe the design-level behavior of the CheckDataCommand unit, the command-line
# entry of the Text.En trainer that runs every check of the training data, decomposing the parent
# SpeechTextEn TrainingDataSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystem/CheckDataCommandTests.cs.
# The program entry point (Program.cs) is glue that dispatches to this unit and is covered with it.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        sections:
          - title: CheckDataCommand Requirements
            requirements:
              - id: SpeechTextEn-TrainingData-CheckDataCommand-ExitCodes
                title: >-
                  The CheckDataCommand class shall run the manifest verification, the loading of the data,
                  the schema check, the license check and the leakage checks in that order, even when an
                  earlier one reported a finding, shall run the external leakage check only when an
                  evaluation folder is supplied (otherwise saying that it was skipped), shall report an
                  evaluation folder inside the data folder as a finding, shall print which check each
                  finding belongs to followed by the summary, and shall give the exit code 0 when every
                  check passes, 1 when any check reports a finding, and 2 for a usage or input error (an
                  unknown command or option, a missing or invalid option value, a data folder that cannot
                  be found, a malformed data or evaluation path, or an evaluation folder that is missing,
                  empty or holds a file with no sentence), writing usage and input errors to the error
                  stream.
                justification: |
                  The lint script and the build pipeline act on the exit code, so a failed check and a
                  broken invocation need different codes. A maintainer fixing a data problem wants to see
                  all findings in one run in a fixed order, and an evaluation corpus inside the data
                  folder would be committed with it.
                tests:
                  - CheckDataCommand_Run_ValidData_ExitsZeroAndSkipsExternalCheck
                  - CheckDataCommand_Run_Violation_ExitsOneAndNamesCheckFileAndLine
                  - CheckDataCommand_Run_UnknownOption_ExitsTwoWithMessage
                  - CheckDataCommand_Run_OptionWithoutValue_ExitsTwo
                  - CheckDataCommand_Run_InvalidMaxFindings_ExitsTwo
                  - CheckDataCommand_Run_DataFolderMissing_ExitsTwo
                  - CheckDataCommand_Run_EvalSetsFolderMissing_ExitsTwo
                  - CheckDataCommand_Run_MalformedPath_ExitsTwo
                  - CheckDataCommand_Run_EvalSetsInsideDataFolder_ExitsOneWithFinding
                  - Program_Run_MissingOrUnknownCommand_ExitsTwoWithUsage

              - id: SpeechTextEn-TrainingData-CheckDataCommand-Options
                title: >-
                  The CheckDataCommand class shall take the data folder from the data option, otherwise
                  by searching upward from the working directory and then from the application folder;
                  shall take the evaluation folder from the evaluation-sets option or else the
                  evaluation-sets environment variable, the option winning; shall accept an option
                  value after an equals sign; and shall accept options to write the leakage report file
                  (only with evaluation sets and outside the data folder), to limit the findings
                  printed per check, to print the per-reading counts and to print the usage.
                justification: |
                  The same command must run from the repository root, from a build output folder and
                  from a script that supplies the evaluation sets, without the operator editing
                  anything.
                tests:
                  - Program_Run_CheckDataHelp_PrintsCommandUsage
                  - CheckDataCommand_Run_DataOptionWithEquals_IsAccepted
                  - CheckDataCommand_Run_NoDataOption_DiscoversFolderFromCurrentDirectory
                  - CheckDataCommand_Run_EvalSetsFromEnvironment_RunsExternalCheck
                  - CheckDataCommand_Run_EvalSetsOptionAndEnvironment_OptionTakesPrecedence
                  - CheckDataCommand_Run_LeakageReportOption_WritesReportFile
                  - CheckDataCommand_Run_LeakageReportWithoutSetsOrInsideData_ExitsTwo
                  - CheckDataCommand_Run_MaxFindings_CapsPrintedFindings
                  - CheckDataCommand_Run_CountsOption_PrintsPerReadingTable

              - id: SpeechTextEn-TrainingData-CheckDataCommand-StagedGeneralization
                title: >-
                  The CheckDataCommand class shall run the evaluation overlay checks after the internal leakage
                  check, and with the generalization option shall check the given staged generalization file
                  in place of the committed set, locating its findings as staged and saying which file it
                  checked, and shall end with the exit code 2 when that file does not exist.
                justification: |
                  The blind writer's output is checked against the committed data before it is committed,
                  with the same command and rules that later gate the committed set; a missing file is an
                  operator error, not a data finding.
                tests:
                  - CheckDataCommand_Run_StagedGeneralization_ChecksStagedFileWithGenericReasons
                  - CheckDataCommand_Run_StagedGeneralizationMissing_ExitsTwo
                  - CheckDataCommand_TryParse_GeneralizationOption_IsParsed

              - id: SpeechTextEn-TrainingData-CheckDataCommand-ClusterCheck
                title: >-
                  The CheckDataCommand class shall run the corpus check after the evaluation overlay checks, so
                  that a finding in the corpus files fails the run with the exit code 1.
                justification: |
                  The command is the data gate of CI; the corpus pins and removals are committed data and must
                  pass the same gate as every other data file.
                tests:
                  - CheckDataCommand_Run_ClusterFinding_ExitsOne
