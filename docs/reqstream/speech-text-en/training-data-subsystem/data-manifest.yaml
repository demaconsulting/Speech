---
# Software Unit Requirements for DataManifest
#
# These requirements describe the design-level behavior of the DataManifest unit, the verifier of the
# committed manifest of the Text.En training data, decomposing the parent SpeechTextEn
# TrainingDataSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystem/DataManifestTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        sections:
          - title: DataManifest Requirements
            requirements:
              - id: SpeechTextEn-TrainingData-DataManifest-HashVerification
                title: >-
                  The DataManifest class shall report a finding when the manifest is missing and for
                  every file listed in the manifest that does not exist or whose SHA-256 hash, byte count
                  or row count (the lines of the file minus the header for a tab-separated file, the lines
                  otherwise) differs from the manifest, and shall name the file and the expected and
                  actual values.
                justification: |
                  The manifest pins the exact content of the data. A change to any listed file, even
                  one byte, must fail the check until the manifest is regenerated and the change is
                  therefore reviewed, because the manifest is itself a reviewed file.
                tests:
                  - DataManifest_Verify_MatchingManifest_ReportsNothing
                  - DataManifest_Verify_ChangedByte_ReportsHashMismatch
                  - DataManifest_Verify_WrongBytes_ReportsSizeMismatch
                  - DataManifest_Verify_WrongRows_ReportsRowCountMismatch
                  - DataManifest_Verify_MissingFile_ReportsListedFileMissing
                  - DataManifest_Verify_MissingManifest_ReportsFinding
                  - DataManifest_CountLines_CountsTerminatedAndUnterminatedLines

              - id: SpeechTextEn-TrainingData-DataManifest-CompleteListing
                title: >-
                  The DataManifest class shall report a finding for every file under the data folder
                  that the manifest does not list, except the manifest itself and the local cache
                  folders, which it shall ignore.
                justification: |
                  A file that is not in the manifest is not pinned and would escape review. The two
                  local cache folders hold downloaded or intermediate material that is never
                  committed, so their content must not count as data.
                tests:
                  - DataManifest_Verify_UnlistedFile_IsReported
                  - DataManifest_Verify_LocalCaches_AreIgnored

              - id: SpeechTextEn-TrainingData-DataManifest-Determinism
                title: >-
                  The DataManifest class shall require manifest entries to have four columns, a
                  lowercase 64-digit hexadecimal hash, integer counts and a relative path with forward
                  slashes, to be unique and to be sorted by ordinal comparison of the path, and shall
                  report a finding for an entry that is not.
                justification: |
                  A manifest in a single canonical form can be regenerated byte for byte on any
                  platform, so a difference between two manifests is always a real change in the
                  data and never an artifact of path separators, ordering or letter case, and a
                  manifest entry can never point outside the data folder.
                tests:
                  - DataManifest_Load_ValidManifest_ExposesEntries
                  - DataManifest_Verify_UnsortedEntries_ReportsOrder
                  - DataManifest_Verify_DuplicateEntry_ReportsDuplicate
                  - DataManifest_Verify_UpperCaseDigest_ReportsMalformedDigest
                  - DataManifest_Verify_NonRelativePath_IsRejected
                  - DataManifest_Verify_MalformedLine_ReportsColumns
                  - DataManifest_Verify_NonIntegerBytes_ReportsMalformedNumbers
