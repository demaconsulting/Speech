---
# Software Unit Requirements for CheckReport
#
# These requirements describe the design-level behavior of the CheckReport unit, the collector of the
# findings of the training data checks, decomposing the parent SpeechTextEn TrainingDataSubsystem
# requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystem/CheckReportTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        sections:
          - title: CheckReport Requirements
            requirements:
              - id: SpeechTextEn-TrainingData-CheckReport-Report
                title: >-
                  The CheckReport class shall give the exit code 0 when no finding was recorded and the
                  exit code 1 otherwise, shall state the number of findings in its final summary line,
                  and shall write the findings in the order they were recorded, each with its check
                  name, location and message, at most a stated number (at least one) per check
                  followed by a count of the findings left out.
                justification: |
                  The check is a gate in the lint script and in the build pipeline, both of which act
                  on the exit code, so a single finding must fail it. Output that differs from run to
                  run cannot be compared, and a defect that affects thousands of rows must not bury
                  every other finding in the log.
                tests:
                  - CheckReport_ExitCode_NoFindings_IsZeroAndSummaryIsOk
                  - CheckReport_ExitCode_AnyFinding_IsOneAndSummaryCountsFindings
                  - CheckReport_WriteTo_Findings_AreWrittenInInsertionOrderWithLocation
                  - CheckReport_WriteTo_MoreFindingsThanCap_PrintsCapAndCountsSuppressed
                  - CheckReport_Constructor_CapBelowOne_ThrowsArgumentOutOfRangeException
