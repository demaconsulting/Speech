---
# Software Unit Requirements for SchemaChecker
#
# These requirements describe the design-level behavior of the SchemaChecker unit, the check of the
# structure and cross-references of the Text.En training data, decomposing the parent SpeechTextEn
# TrainingDataSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystem/SchemaCheckerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        sections:
          - title: SchemaChecker Requirements
            requirements:
              - id: SpeechTextEn-TrainingData-SchemaChecker-Inventory
                title: >-
                  The SchemaChecker class shall report a finding for a reading in the inventory whose
                  identifier is not unique or is not a lowercase ASCII lemma-and-sense identifier whose
                  lemma part equals the lemma column, whose part-of-speech hint is not from the closed
                  set, whose status is neither active nor deprecated, whose description is empty or
                  repeated, or that contains any phonetic (IPA) character, and for a mapping row whose
                  target reading does not exist, a repeated word identifier, a reading without a mapping
                  that was not added as a new reading by an extension decision, a form of an unknown
                  reading, a reading without any form, and an extension decision that is neither an
                  addition nor a deferral, adds an unknown reading or defers with readings listed.
                justification: |
                  The reading identifiers are the labels a classifier is trained on and are owned by this
                  repository. They must be well formed and unique, the inventory must carry no phonetic
                  transcription, and the inventory, the form table, the mapping and the extension
                  decisions must describe one set of readings, because a dangling or missing reference
                  makes the span check or an evaluation silently skip a reading.
                tests:
                  - SchemaChecker_Run_ReadingInventoryDefects_ReportsEachFinding
                  - SchemaChecker_Run_ReferentialDefects_ReportsEachFinding
                  - SchemaChecker_Run_ExtensionAddedReadingWithoutMapping_ReportsNothing
                  - SchemaChecker_Run_ExtensionDecisionDefects_ReportsEachFinding

              - id: SpeechTextEn-TrainingData-SchemaChecker-Rows
                title: >-
                  The SchemaChecker class shall report a finding for a data row whose identifier is not
                  unique across the four data files, whose split column differs from its file, whose
                  reading does not exist, whose lemma differs from the reading's lemma, whose source is
                  outside the vocabulary, or whose target span fails the strict whole-word check; shall
                  decide from the source of each row, never from its identifier, which provenance table
                  must describe it and report a row or a provenance entry that has no counterpart or is
                  repeated; shall report a row of the independent holdout source outside the independent
                  holdout file, a row of that file with another source, and an identifier whose prefix
                  does not match the family of its source; and shall report no finding for a valid data
                  set or for the identifier families of the committed data with their matching sources.
                justification: |
                  Each row is one labeled example, and the thousands of rows can only be checked by
                  machine. A wrong split, an unknown label or a span that does not point at the labeled
                  word is a wrong example. Every row must be traceable to the document it was harvested
                  from or to how it was generated, and an identifier is free text that can be edited, so
                  an exemption keyed on it would let a row escape provenance and template separation or
                  pass as independent holdout data by being renamed.
                tests:
                  - SchemaChecker_Run_ValidFixture_ReportsNoFindings
                  - SchemaChecker_Run_RowFieldDefects_ReportsEachFinding
                  - SchemaChecker_Run_ProvenanceDefects_ReportsEachFinding
                  - SchemaChecker_Run_SyntheticRowRenamedToHoldoutId_ReportsIdAndMissingProvenance
                  - SchemaChecker_Run_HoldoutIndependentRowWithSyntheticSource_ReportsFindings
                  - SchemaChecker_Run_IdentifierAndSourceMismatches_ReportsEachFinding
                  - SchemaChecker_Run_AllIdentifierFamiliesWithMatchingSources_ReportsNoFindings

              - id: SpeechTextEn-TrainingData-SchemaChecker-ReadingCounts
                title: >-
                  The SchemaChecker class shall compute the number of rows per reading and split and the
                  rows still needed (never below zero), shall report a finding when the committed gap
                  table has a stale, missing, unknown or repeated row, and shall print a summary of the
                  counts as information that does not fail the run.
                justification: |
                  The gap table tells the maintainer which readings still need examples. A stale table
                  would hide a gap or show one that was already closed, so it must always equal the
                  counts of the committed rows.
                tests:
                  - ReadingCounts_Build_ValidFixture_CountsRowsPerReading
                  - ReadingCount_Needs_AreClampedAtZero
                  - SchemaChecker_Run_GapTableDefects_ReportsEachFinding
