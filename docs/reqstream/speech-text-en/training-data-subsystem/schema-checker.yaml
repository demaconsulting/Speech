---
# Software Unit Requirements for SchemaChecker
#
# These requirements describe the design-level behavior of the SchemaChecker unit, the check of the
# structure and cross-references of the Text.En training data, decomposing the parent SpeechTextEn
# TrainingDataSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystem/SchemaCheckerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        sections:
          - title: SchemaChecker Requirements
            requirements:
              - id: SpeechTextEn-TrainingData-SchemaChecker-Inventory
                title: >-
                  The SchemaChecker class shall report a finding for a reading in the inventory whose
                  identifier is not unique or is not a lowercase ASCII lemma-and-sense identifier whose
                  lemma part equals the lemma column, whose part-of-speech hint is not from the
                  closed set, whose status is neither active nor deprecated, whose description is empty
                  or repeated, or that contains any phonetic (IPA) character.
                justification: |
                  The reading identifiers are the labels a classifier is trained on and are owned by
                  this repository. They must be well formed and unique, and the inventory must carry
                  no phonetic transcription, because pronunciations come from a different source and
                  must not be copied from a restricted one.
                tests:
                  - SchemaChecker_Run_ReadingIdGrammar_ReportsFinding
                  - SchemaChecker_Run_ReadingLemmaNotIdPrefix_ReportsFinding
                  - SchemaChecker_Run_DuplicateReadingId_ReportsFinding
                  - SchemaChecker_Run_BadPosTokenAndStatus_ReportsFindings
                  - SchemaChecker_Run_DuplicateDescription_ReportsFinding
                  - SchemaChecker_Run_IpaSymbolInDescription_ReportsFinding

              - id: SpeechTextEn-TrainingData-SchemaChecker-ReferentialIntegrity
                title: >-
                  The SchemaChecker class shall report a finding for a mapping row whose target
                  reading does not exist, for a repeated word identifier in the mapping, for a reading
                  that has no mapping and was not added as a new reading by an extension decision, for
                  a form that names an unknown reading, for a reading without any form, and for an
                  extension decision that is neither an addition nor a deferral, that adds an unknown
                  reading or that defers with readings listed.
                justification: |
                  The inventory, the form table, the mapping to the evaluation corpus identifiers and
                  the extension decisions describe one set of readings. A dangling or missing reference
                  makes the span check or an evaluation silently skip a reading.
                tests:
                  - SchemaChecker_Run_DuplicateWordId_ReportsFinding
                  - SchemaChecker_Run_MappingToUnknownReading_ReportsFinding
                  - SchemaChecker_Run_UnmappedReading_ReportsFinding
                  - SchemaChecker_Run_ExtensionAddedReadingWithoutMapping_ReportsNothing
                  - SchemaChecker_Run_FormOfUnknownReading_ReportsFinding
                  - SchemaChecker_Run_ReadingWithoutForm_ReportsFinding
                  - SchemaChecker_Run_InvalidDecision_ReportsFinding
                  - SchemaChecker_Run_AddDecisionWithUnknownReading_ReportsFinding
                  - SchemaChecker_Run_DeferDecisionWithReadings_ReportsFinding

              - id: SpeechTextEn-TrainingData-SchemaChecker-Rows
                title: >-
                  The SchemaChecker class shall report a finding for a data row whose identifier is not
                  unique across the four data files, whose split column differs from its file, whose
                  reading does not exist, whose lemma differs from the reading's lemma, whose source is
                  outside the vocabulary, or whose target span fails the strict whole-word check, and
                  shall report no finding for a valid data set.
                justification: |
                  Each row is one labeled example. A row with a wrong split, an unknown label, a lemma
                  that does not belong to its reading or a span that does not point at the labeled
                  word is a wrong example, and the thousands of rows can only be checked by machine.
                tests:
                  - SchemaChecker_Run_ValidFixture_ReportsNoFindings
                  - SchemaChecker_Run_DuplicateIdAcrossFiles_ReportsFinding
                  - SchemaChecker_Run_WrongSplitColumn_ReportsFinding
                  - SchemaChecker_Run_UnknownReading_ReportsFinding
                  - SchemaChecker_Run_LemmaMismatch_ReportsFinding
                  - SchemaChecker_Run_UnknownSource_ReportsFinding
                  - SchemaChecker_Run_NonIntegerOffsets_ReportsFinding
                  - SchemaChecker_Run_SpanOffByOne_ReportsFinding
                  - SchemaChecker_Run_SpanInsideLongerWord_ReportsFinding
                  - SchemaChecker_Run_SpanSplitsSurrogatePair_ReportsFinding
                  - SchemaChecker_Run_SpanBeyondSentence_ReportsFinding

              - id: SpeechTextEn-TrainingData-SchemaChecker-ProvenanceIds
                title: >-
                  The SchemaChecker class shall decide from the source of each row, never from its
                  identifier, which provenance table must describe it, and shall report a finding when a
                  row of a harvest source has no entry in the harvest provenance table, when a row of a
                  synthetic source has no entry in the synthetic provenance table, when a provenance entry
                  is repeated, and when a provenance entry matches no row it should describe, the only row
                  without a provenance table being a row of the independent holdout source in the
                  independent holdout file.
                justification: |
                  Every row must be traceable to the document it was harvested from or to the record
                  of how it was generated. A row without a record, or a record without a row, means the
                  provenance claims of the data are incomplete or stale. An identifier is a free text
                  that can be edited, so an exemption keyed on an identifier prefix would let a
                  synthetic or harvested row escape provenance and template separation by being renamed.
                tests:
                  - SchemaChecker_Run_HarvestRowWithoutProvenance_ReportsFinding
                  - SchemaChecker_Run_SyntheticRowWithoutProvenance_ReportsFinding
                  - SchemaChecker_Run_ProvenanceWithoutRow_ReportsFinding
                  - SchemaChecker_Run_DuplicateProvenanceEntry_ReportsFinding
                  - SchemaChecker_Run_SyntheticRowRenamedToHoldoutId_ReportsIdAndMissingProvenance
                  - SchemaChecker_Run_HoldoutIndependentRowWithSyntheticSource_ReportsFindings

              - id: SpeechTextEn-TrainingData-SchemaChecker-SourceConsistency
                title: >-
                  The SchemaChecker class shall report a finding, at the row, when a row of the
                  independent holdout source is outside the independent holdout file, when a row of the
                  independent holdout file has another source, when an independent holdout row has an
                  identifier that does not start with hind-, when a synthetic row has an identifier that
                  does not start with syn, and when a harvested row has an identifier that starts with
                  syn or hind-, and shall report no finding for the identifier families of the committed
                  data with their matching sources.
                justification: |
                  The source, the identifier and the file of a row must tell the same story. If they may
                  disagree, one edited cell is enough to move a generated row out of the checks that
                  apply to its source or to pass it off as independent holdout data.
                tests:
                  - SchemaChecker_Run_SyntheticRowRenamedToHoldoutId_ReportsIdAndMissingProvenance
                  - SchemaChecker_Run_IndependentHoldoutSourceInTrain_ReportsFinding
                  - SchemaChecker_Run_HoldoutIndependentRowWithSyntheticSource_ReportsFindings
                  - SchemaChecker_Run_HarvestRowWithGeneratedId_ReportsFinding
                  - SchemaChecker_Run_SyntheticRowIdWithoutSynPrefix_ReportsFinding
                  - SchemaChecker_Run_IndependentHoldoutRowIdWithoutHindPrefix_ReportsFinding
                  - SchemaChecker_Run_AllIdentifierFamiliesWithMatchingSources_ReportsNoFindings

              - id: SpeechTextEn-TrainingData-SchemaChecker-ReadingCounts
                title: >-
                  The SchemaChecker class shall compute the number of rows per reading and split and the
                  rows still needed (never below zero), shall report a finding when the committed gap
                  table has a stale, missing, unknown or repeated row, and shall print a summary of the
                  counts as information that does not fail the run.
                justification: |
                  The gap table tells the maintainer which readings still need examples. A stale table
                  would hide a gap or show one that was already closed, so it must always equal the
                  counts of the committed rows.
                tests:
                  - ReadingCounts_Build_ValidFixture_CountsRowsPerReading
                  - ReadingCount_Needs_AreClampedAtZero
                  - ReadingCounts_WriteTable_ValidFixture_WritesHeaderAndOneLinePerReading
                  - SchemaChecker_Run_StaleGapsRow_ReportsFinding
                  - SchemaChecker_Run_GapsRowMissing_ReportsFinding
                  - SchemaChecker_Run_GapsRowUnknownOrDuplicate_ReportsFindings
                  - SchemaChecker_Run_ValidFixture_AddsSummaryInfo
