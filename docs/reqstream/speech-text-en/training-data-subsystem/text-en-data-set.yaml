---
# Software Unit Requirements for TextEnDataSet
#
# These requirements describe the design-level behavior of the TextEnDataSet unit, the one-time
# loader that turns the committed Text.En training data files into typed rows, decomposing the parent
# SpeechTextEn TrainingDataSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingDataSubsystem/TextEnDataSetTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingDataSubsystem Requirements
        sections:
          - title: TextEnDataSet Requirements
            requirements:
              - id: SpeechTextEn-TrainingData-TextEnDataSet-Loading
                title: >-
                  The TextEnDataSet class shall validate every supported file of a data folder,
                  including the reading inventory, the form table, the mapping table, the extension
                  decisions, the four data files, both provenance tables and the gap table, shall
                  check the format of every other table file, shall report a finding, never an
                  exception, for a missing file, a header that differs from the expected one or a
                  value that is not an integer where an integer is required, and continue with the
                  rest, and shall give every data row, reading, form and provenance record with the
                  line it came from (and, for a data row, its file and split) and the forms listed for
                  a reading.
                justification: |
                  Every check works on the same tables and reports where it found a defect. A defective
                  or missing file is the very thing the checks exist to find, so it has to become a
                  reported finding that lets the other checks run, not an unhandled failure that hides
                  them, and every datum a check reads must carry its origin.
                tests:
                  - TextEnDataSet_Load_ValidFixture_LoadsAllTablesWithoutFindings
                  - TextEnDataSet_Load_Rows_CarryFileSplitLineAndOffsets
                  - TextEnDataSet_FormsOf_KnownAndUnknownReading_ReturnListedForms
                  - TextEnDataSet_Load_MissingFile_ReportsFindingAndContinues
                  - TextEnDataSet_Load_NonIntegerOffsets_ReportsFindingAndKeepsRow
                  - TextEnDataSet_Load_WrongDataHeader_ReportsFindingAndLoadsNoRowsOfThatFile
                  - TextEnDataSet_Load_OtherTsvFileWithBadFormat_ReportsFinding

              - id: SpeechTextEn-TrainingData-TextEnDataSet-SourceVocabulary
                title: >-
                  The TextEnDataSet class shall know the closed vocabulary of data sources, and for
                  each source the set of licenses it may carry and whether its sentences are generated
                  or taken from a natural document, with the kind of the source (harvest, synthetic or
                  independent holdout), and shall report that a source outside the
                  vocabulary is unknown.
                justification: |
                  The license policy per source and the provenance rules depend on knowing which
                  sources exist and which are generated. A closed vocabulary means a new source
                  cannot enter the data without a deliberate change that is reviewed.
                tests:
                  - SourceInfo_TryGet_KnownSource_ReturnsKindAndLicenses
                  - SourceInfo_TryGet_UnknownSource_ReturnsFalse
                  - SourceInfo_KindOf_Source_ReturnsKindOrNull

              - id: SpeechTextEn-TrainingData-TextEnDataSet-OverlayLoading
                title: >-
                  The TextEnDataSet class shall load the regression overlay and the generalization set of a
                  data folder, and a generalization set from any given path, with their exact headers, shall
                  give every overlay row with its file, line, offsets and overlay columns, shall accept a
                  generalization set that has its header only as a set without rows, and shall report a
                  finding, never an exception, for a missing overlay file, a header that differs or an offset
                  that is not an integer.
                justification: |
                  The overlay checks and the evaluation read the same rows, and a generalization set staged
                  outside the repository must be read exactly like the committed one. The set was committed
                  with its header only until a blind writer had written it.
                tests:
                  - TextEnDataSet_Load_ValidFixture_LoadsAllTablesWithoutFindings
                  - TextEnDataSet_Load_OverlayRows_CarryFileLineOffsetsAndColumns
                  - TextEnDataSet_Load_MissingOverlayOrBadOffset_IsFinding
