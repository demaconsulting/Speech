---
# Software Unit Requirements for ClusteringRecord
#
# These requirements describe the design-level behavior of the ClusteringRecord unit, the part of the Text.En trainer
# that writes and parses clustering.json, decomposing the parent SpeechTextEn ClusteringSubsystem requirements. Each
# requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/ClusteringSubsystem/ClusteringRecordTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: ClusteringSubsystem Requirements
        sections:
          - title: ClusteringRecord Requirements
            requirements:
              - id: SpeechTextEn-Clustering-ClusteringRecord-Format
                title: >-
                  The ClusteringRecord unit shall write the record as a JSON document with the schema number and the
                  settings, inputs, corpus and result objects in a fixed field order, two-space indentation, LF line
                  endings and a final LF, holding only integers and strings and nothing that depends on the machine,
                  the time or the thread count, and parse a written record back to an equal record.
                justification: |
                  The record is committed and compared byte for byte by the full check; it must be the same for the
                  same induction everywhere.
                tests:
                  - ClusteringRecord_Write_FixedTextForm
                  - ClusteringRecord_Parse_WrittenRecord_RoundTrips

              - id: SpeechTextEn-Clustering-ClusteringRecord-Parse
                title: >-
                  The ClusteringRecord unit shall throw InvalidDataException for a document that is not JSON, has
                  another schema, or lacks a field or has one of the wrong type.
                justification: |
                  A malformed record must not be read as settings for a re-induction or as evidence of a table.
                tests:
                  - ClusteringRecord_Parse_InvalidDocuments_Throw
