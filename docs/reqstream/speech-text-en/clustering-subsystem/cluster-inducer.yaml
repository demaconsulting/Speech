---
# Software Unit Requirements for ClusterInducer
#
# These requirements describe the design-level behavior of the ClusterInducer unit (and the bigram graph that is
# documented with it), the part of the Text.En trainer that induces hierarchical word classes from integer bigram counts,
# decomposing the parent SpeechTextEn ClusteringSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/ClusteringSubsystem/ClusterInducerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: ClusteringSubsystem Requirements
        sections:
          - title: ClusterInducer Requirements
            requirements:
              - id: SpeechTextEn-Clustering-ClusterInducer-Classes
                title: >-
                  The ClusterInducer unit shall give every vocabulary word a bit-string path such that no path is a
                  prefix of another and there are exactly as many distinct paths as the smaller of the cluster count
                  and the vocabulary size, where each merge joins the two clusters whose merge loses the least mutual
                  information of adjacent clusters, as recomputed from scratch, among the clusters present.
                justification: |
                  Prefix-free bit strings let a model use coarse and fine classes by taking prefixes; merging the pair
                  that loses the least mutual information is what makes words of the same distribution share a class.
                tests:
                  - ClusterInducer_Induce_SmallInput_LossesMatchBruteForceOracle
                  - ClusterInducer_Induce_SyntheticInput_PathsArePrefixFreeAndBounded
                  - ClusterInducer_Induce_FewerWordsThanClusters_OnePathPerWord

              - id: SpeechTextEn-Clustering-ClusterInducer-Determinism
                title: >-
                  The ClusterInducer unit shall produce identical paths and an identical merge sequence, losses
                  included to the last bit, for any number of worker threads and on every supported operating system.
                justification: |
                  The table is committed and re-verified by re-induction; any dependence on threads or platform
                  arithmetic would make that check fail for reasons unrelated to the inputs.
                tests:
                  - ClusterInducer_Induce_DifferentThreadCounts_IdenticalOutput
                  - ClusterInducer_Induce_FixedInput_MatchesGoldenPathsAndMerges

              - id: SpeechTextEn-Clustering-ClusterInducer-TieBreak
                title: >-
                  The ClusterInducer unit shall, among merges with equal loss, choose the one with the lowest first
                  slot and then the lowest second slot.
                justification: |
                  Equal losses occur (for example between words that never meet), and a fixed rule is needed for a
                  unique result.
                tests:
                  - ClusterInducer_Induce_AllLossesEqual_MergesLowestSlotsFirst

              - id: SpeechTextEn-Clustering-ClusterInducer-Progress
                title: >-
                  The ClusterInducer unit shall report its progress at a configurable interval of placed words and of
                  final merges, including the end of both stages.
                justification: |
                  The induction of a full vocabulary takes minutes; progress lets the command show the time left.
                tests:
                  - ClusterInducer_Induce_WithProgress_ReportsWordsAndFinalMerges

              - id: SpeechTextEn-Clustering-ClusterInducer-InputValidation
                title: >-
                  The ClusterInducer unit shall build its bigram input from pair counts by adding repeated pairs, with
                  the left and right marginals and the total, refuse keys that are not strictly ascending pairs of known
                  words with positive counts, and refuse fewer than two words, fewer than two clusters or fewer than
                  one thread, throwing ArgumentException.
                justification: |
                  A malformed input would make a table that looks valid but is not the clustering of the corpus.
                tests:
                  - BigramGraph_FromPairs_RepeatedPairs_AddsCountsAndMarginals
                  - BigramGraph_FromSortedKeys_InvalidKeys_Throw
                  - ClusterInducer_Induce_InvalidArguments_Throw
