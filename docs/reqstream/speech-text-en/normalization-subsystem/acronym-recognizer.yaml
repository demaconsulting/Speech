---
# Software Unit Requirements for AcronymRecognizer
#
# These requirements describe the design-level behavior of the AcronymRecognizer unit, the
# lexicon of initialisms embedded in the package (written from scratch and released under the
# package's MIT License) with the rules that recognize an initialism in a token and give its
# letter-by-letter spoken form. It decomposes the parent SpeechTextEn NormalizationSubsystem
# requirements. Each requirement states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/NormalizationSubsystem/AcronymRecognizerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: NormalizationSubsystem Requirements
        sections:
          - title: AcronymRecognizer Requirements
            requirements:
              - id: SpeechTextEn-Normalization-AcronymRecognizer-Recognition
                title: >-
                  The AcronymRecognizer class shall recognize a listed initialism only in its exact
                  capitalization and speak it as its capital letters separated by spaces, shall
                  spell an unlisted token of two to five capital letters that contains no vowel and
                  is not Roman-numeral-shaped while leaving other unlisted capitals unchanged, shall
                  speak dotted letter forms upper-cased and spaced (reporting whether the token
                  itself ends with the period) and an ampersand initialism group by group joined
                  with the word and (keeping a possessive tail), and in a sentence written entirely
                  in capitals shall leave the ambiguous listed forms and the vowel-less rule alone
                  while still speaking the unambiguous listed and dotted forms.
                justification: |
                  "US" is the country and "us" is a pronoun, so only the exact case tells them
                  apart; a model reads "FBI" as three letters only if it is given the letters. A
                  token such as "HTTP" has no vowel to pronounce and is spelled, while "NASA" reads
                  as a word and "XIV" as a numeral. In an all-capital sentence "IT" is an ordinary
                  word in capitals while "FBI" remains an initialism. The period of "U.S.A." decides
                  the sentence handling, so the recognizer must say whether it is part of the
                  token.
                tests:
                  - AcronymRecognizer_TryRecognize_CaseVariants_AreCaseSensitive
                  - AcronymRecognizer_TryRecognize_Initialism_IsSpokenLetterByLetter
                  - AcronymRecognizer_TryRecognize_ShoutingSentence_LeavesAmbiguousAndRuleSpelledForms
                  - AcronymRecognizer_TryRecognize_TokensThatAreNotInitialisms_AreNotRecognized
                  - AcronymRecognizer_TryRecognize_DottedLetters_AreSpelled
                  - AcronymRecognizer_TryRecognize_AmpersandForms_AreSpelledWithAnd

              - id: SpeechTextEn-Normalization-AcronymRecognizer-Lexicon
                title: >-
                  The AcronymRecognizer class shall build a recognizer from a lexicon in the
                  documented tab-separated format and use exactly that lexicon, shall throw
                  InvalidDataException that names the line number for a malformed row, shall throw
                  ArgumentNullException for a null reader, and shall give the documented
                  recognitions of the embedded lexicon to concurrent first uses.
                justification: |
                  A defective lexicon is a build defect and must fail at once and point at the row;
                  several requests may be the first to use the embedded lexicon at the same time,
                  and each must get the documented answer.
                tests:
                  - AcronymRecognizer_FromTsv_CustomLexicon_IsUsed
                  - AcronymRecognizer_FromTsv_MalformedRow_ThrowsInvalidDataExceptionNamingTheLine
                  - AcronymRecognizer_FromTsvAndDefault_NullReaderAndConcurrentFirstUse_BehaveAsDocumented
