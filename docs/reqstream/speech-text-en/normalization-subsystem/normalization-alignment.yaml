---
# Software Unit Requirements for NormalizationAlignment
#
# These requirements describe the design-level behavior of the NormalizationAlignment unit: the
# alignment types AlignedTextBuilder and AlignedText that check, hold and apply the replacement
# spans, the forced and suppressed sentence breaks and the clitic records of one normalization
# pass, together with the small value types they use (NormalizationToken, NormalizedSpan and
# CliticMark) and the public NormalizationKind and CliticKind vocabularies,
# including the spelled flag of a span and the pronunciation marks of host overrides.
# They decompose the parent SpeechTextEn NormalizationSubsystem requirements. Each requirement
# states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/NormalizationSubsystem/NormalizationAlignmentTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: NormalizationSubsystem Requirements
        sections:
          - title: NormalizationAlignment Requirements
            requirements:
              - id: SpeechTextEn-Normalization-NormalizationAlignment-SpanValidation
                title: >-
                  The AlignedTextBuilder class shall accept replacement spans and pronunciation
                  marks only in ascending order, without overlap, each non-empty and inside the
                  text (checked without arithmetic that can overflow), not starting or ending on
                  whitespace, not covering a tag placeholder, not cutting a UTF-16 surrogate pair
                  and with a non-null, placeholder-free spoken text or mark value that is empty only
                  for a dropped span, shall reject a span marked spelled whose spoken text is not
                  single capital ASCII letters separated by single spaces (at most one padding space
                  per side), shall reject a null source text, and shall report the accepted spans and
                  marks ascending in the aligned text it builds, and the AlignedText it builds shall
                  split the source text into replacement spans and unchanged gaps that tile it
                  exactly and shall produce the spoken text by replacing only the spans.
                justification: |
                  Every consumer walks the spans once in text order, and the Speech library discards
                  an annotation that starts or ends on trimmed whitespace or covers a placeholder,
                  while a cut surrogate pair is invalid text; a defective span must therefore fail
                  where the rule made it rather than reach a backend. A span marked as letters that
                  is not letters would make a backend speak a word by letter names, and one grammar
                  shared with the annotation readers means the builder and a reader cannot drift
                  apart. A pronunciation is attached to a word that is not replaced, so a word is
                  either replaced or pronounced, never both. An exact partition and a reference
                  application of the spoken forms are what make the claim that nothing outside a
                  span changes checkable.
                tests:
                  - AlignedTextBuilder_Add_SpanOutOfOrderOverlappingEmptyOrOutOfBounds_ThrowsArgumentException
                  - AlignedTextBuilder_Add_AscendingDisjointSpans_AreKeptInOrder
                  - AlignedTextBuilder_Add_SpanWithWhitespaceEdge_ThrowsArgumentException
                  - AlignedTextBuilder_Constructor_NullSource_ThrowsArgumentNullException
                  - SpelledGrammar_IsLetterSequence_AcceptsOnlyCapitalLettersWithSingleSpaces
                  - AlignedTextBuilder_Add_SpelledSpan_RequiresLetterSequence
                  - AlignedTextBuilder_AddPronunciation_EmptyOrOutOfBoundsOrOverflowing_ThrowsArgumentException
                  - AlignedTextBuilder_AddPronunciation_UnifiedOrderingWithSpans
                  - AlignedTextBuilder_AddPronunciation_WhitespacePlaceholderSurrogateOrBadValue_ThrowsArgumentException
                  - AlignedText_Segments_SpansAndGaps_PartitionTheTextExactly
                  - AlignedText_ApplySpokenForms_ReplacesOnlySpans

              - id: SpeechTextEn-Normalization-NormalizationAlignment-BreakReconciliation
                title: >-
                  The AlignedTextBuilder class shall accept forced and suppressed sentence breaks
                  only at a token start inside the text (never on whitespace, a tag placeholder or
                  the first character) and shall hold them sorted and duplicate-free in any
                  request order, and the AlignedText class shall combine them with the tokenizer's
                  breaks by adding the forced ones and removing the suppressed ones, returning the
                  tokenizer's breaks unchanged when there is no edit and rejecting a null list.
                justification: |
                  The normalization knows how an abbreviation is read and so where a sentence ends
                  after it; expressing that as edits to the tokenizer's breaks keeps the tokenizer
                  authoritative everywhere else, and the result must be a valid break list for the
                  Speech library.
                tests:
                  - AlignedTextBuilder_ForceBreakAndSuppressBreak_InvalidOffset_ThrowsArgumentOutOfRangeException
                  - AlignedTextBuilder_ForceBreak_OnPlaceholder_ThrowsArgumentOutOfRangeException
                  - AlignedTextBuilder_Build_BreakRequestsInAnyOrder_AreSortedAndDistinct
                  - AlignedText_ReconcileBreaks_TokenizerForcedAndSuppressed_AreCombined

              - id: SpeechTextEn-Normalization-NormalizationAlignment-Counters
                title: >-
                  The AlignedTextBuilder class shall record clitic classifications (rejecting one
                  that is out of bounds, out of order, overlapping, empty or of kind None) and shall
                  count ambiguous resolutions, numeric fallbacks, user overrides applied and user
                  overrides ignored independently, reporting all of them in the aligned text it
                  builds (as zero when none was counted), and shall report whether the previous
                  replacement ends exactly where a following one starts with its spoken text ending
                  in a letter.
                justification: |
                  The clitic roles and the counts are results of the same pass as the spans and have
                  to travel with them to the detailed analysis and the diagnostics, where they tell
                  a host how often a reading was a guess, a number was left as written or an
                  override could not be applied; validating the classifications keeps the detailed
                  result well formed, and a text without any of them must report exactly zero. The
                  adjacency report lets the normalizer separate two replacements that touch with
                  exactly one space.
                tests:
                  - AlignedTextBuilder_MarkCliticAndCountAmbiguous_ValidateAndAccumulate
                  - AlignedTextBuilder_TouchesPreviousSpokenLetter_ReportsAdjacencyOnlyAfterLetterEndedSpan
