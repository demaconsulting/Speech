---
# Software Unit Requirements for AbbreviationResolver
#
# These requirements describe the design-level behavior of the AbbreviationResolver unit, the
# lexicon of written-English abbreviations embedded in the package (written from scratch and
# released under the package's MIT License), including the month and weekday abbreviations, with the rules that choose between the readings of an
# ambiguous abbreviation from its neighboring tokens. It decomposes the parent SpeechTextEn
# NormalizationSubsystem requirements. It uses no tagger. Each requirement states one observable
# behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/NormalizationSubsystem/AbbreviationResolverTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: NormalizationSubsystem Requirements
        sections:
          - title: AbbreviationResolver Requirements
            requirements:
              - id: SpeechTextEn-Normalization-AbbreviationResolver-Lexicon
                title: >-
                  The AbbreviationResolver class shall return the spoken form of every listed
                  abbreviation matched case-sensitively and exactly, shall report whether the match
                  includes a separate period token, shall resolve each month and weekday
                  abbreviation to its full name (before a date as a prefix reading, elsewhere as a
                  suffix reading, and a month abbreviation written without a period before a
                  digit) while leaving May and a weekday written without a period as written, shall
                  not treat an ordinary word as an abbreviation, shall build its lexicon from a
                  table in the documented tab-separated format (accepting comments, blank lines and
                  CRLF) and throw InvalidDataException naming the line for a malformed row and
                  ArgumentNullException for a null reader, and shall give the documented
                  resolutions to concurrent first lookups.
                justification: |
                  The lexicon is the single place that says how an abbreviation is spoken; an
                  exact, case-sensitive match keeps ordinary words such as "no" or "dr" untouched.
                  The tokenizer breaks sentences after "Jan." and "Sat." even in the middle of a
                  date, so the reading of a month or weekday has to remove that break, while a bare
                  "Mar." or "Sun." (the verb, the star) stays as written. A defective table is a
                  build defect and must fail at once and point at the row, and several requests
                  may be the first to need the embedded lexicon at the same time, so every one of
                  them must get the same answer.
                tests:
                  - AbbreviationResolver_TryResolve_ListedForm_ReturnsSpokenForm
                  - AbbreviationResolver_TryResolve_PeriodShapes_AreReported
                  - AbbreviationResolver_TryResolve_OrdinaryWords_AreNotAbbreviations
                  - AbbreviationResolver_TryResolve_MonthAndWeekdayAbbreviations_ResolveToFullNamesInDateAndNonDateContexts
                  - AbbreviationResolver_FromTsv_CommentsBlankLinesAndCrLf_AreAccepted
                  - AbbreviationResolver_FromTsv_MalformedRow_ThrowsInvalidDataExceptionNamingTheLine
                  - AbbreviationResolver_FromTsv_NullReader_ThrowsArgumentNullException
                  - AbbreviationResolver_TryResolve_ConcurrentFirstLookups_ReturnDocumentedResolutions

              - id: SpeechTextEn-Normalization-AbbreviationResolver-ReadingChoice
                title: >-
                  The AbbreviationResolver class shall choose between the prefix and the suffix
                  reading of an ambiguous abbreviation from the neighboring tokens only (a
                  following name, a preceding name, number or determiner, skipping a possessive
                  before the abbreviation, and resolving a single-letter initial only before a name
                  or another initial), shall not take a name suffix or credential (Ph.D., Esq., III)
                  that follows Sr. for the name of a Sister, shall apply a reading only where its
                  guard holds (the number reading of No. only before a digit, the date guards on
                  the ASCII digits and the month names) and let a reading whose guard holds replace
                  the unguarded alternatives, and shall use the reading marked as the default and
                  report it as ambiguous where the neighbors do not decide, never counting a clear
                  reading or alternatives that are not a prefix and suffix pair.
                justification: |
                  "Dr. Smith" is a doctor and "Maple Dr. He" is a drive; the words around the
                  abbreviation usually decide, and using only tokens keeps the rule independent of
                  the tagger and its cost. "No. 5" is a number and "No. I don't know" is the word,
                  and "Jan. 5" is a date in which the period does not end a sentence, so a guard
                  keeps a reading to the context it was written for. A documented default makes the
                  unclear cases predictable, and the ambiguity flag is what the diagnostics count so
                  a host can see how often the choice was a guess.
                tests:
                  - AbbreviationResolver_TryResolve_AmbiguousForm_FollowsTheNeighborCues
                  - AbbreviationResolver_IsNameContinuation_ListedFormsOnly
                  - AbbreviationResolver_TryResolve_PossessiveBeforeAbbreviation_IsSkippedForContext
                  - AbbreviationResolver_TryResolve_Initials_ResolveOnlyBeforeNames
                  - AbbreviationResolver_TryResolve_No_IsNumberBeforeDigitAndWordOtherwise
                  - AbbreviationResolver_TryResolve_Guards_RestrictReadingsToTheirContext
                  - AbbreviationResolver_TryResolve_DateGuards_RestrictMonthAndWeekdayReadings
                  - AbbreviationResolver_TryResolve_InconclusiveContext_UsesDefaultAndIsCounted
                  - AbbreviationResolver_FromTsv_NonPairAlternatives_UseDefaultWithoutCounting
