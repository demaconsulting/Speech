---
# Software Unit Requirements for NumberVerbalizer
#
# These requirements describe the design-level behavior of the NumberVerbalizer unit, the stateless
# builder of the English words of a number (cardinals, ordinals, years, decades, decimals, digit
# sequences, fractions, clock times and calendar dates) over a bounded buffer, decomposing the parent
# SpeechTextEn NormalizationSubsystem requirements. It reads ASCII digits only, uses no
# culture-sensitive API and is checked against an independent reference implementation in the tests.
# Each requirement states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/NormalizationSubsystem/NumberVerbalizerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: NormalizationSubsystem Requirements
        sections:
          - title: NumberVerbalizer Requirements
            requirements:
              - id: SpeechTextEn-Normalization-NumberVerbalizer-Words
                title: >-
                  The NumberVerbalizer class shall give the lowercase words, separated by single
                  spaces and without hyphen, comma or "and", of a cardinal of up to 15 significant
                  ASCII digits (ignoring leading zeros, with the scale words thousand, million,
                  billion and trillion), of an ordinal (replacing only the last word of the
                  cardinal, with the ordinal suffix the last digits require), of a year from 1000 to
                  2099 as two pairs (every other four-digit number and the years that both readings
                  speak alike as the cardinal) and of a decade as a plural word, of a decimal (the
                  integer part, the word point and the fraction digits one by one with zeros kept)
                  and a digit sequence as one word per digit, of a fraction (half, quarter and
                  hundredth, singular for a numerator of one and plural otherwise), of a clock time
                  (oh for a minute of one to nine, o'clock or hundred for minute 00), and of a
                  calendar date (the capitalized month name, the day ordinal and the year).
                justification: |
                  Every number the recognizer reads is spelled by this unit, so a wrong word here
                  is a wrong reading everywhere. A year is spoken in pairs, not as a quantity, and
                  reporting which years read differently from the cardinal lets the recognizer
                  count a guess only where the two readings really differ. "3.14" is "three point
                  one four" and "007" is read digit by digit. Matching an independent reference
                  implementation for every cardinal and ordinal from 0 to 9999, for random values
                  of up to 15 digits, at every scale boundary, for every year from 1000 to 2099 and
                  for every hour and minute proves the words, including the irregular ones.
                tests:
                  - NumberVerbalizer_Cardinal_EveryValueFrom0To9999_MatchesReference
                  - NumberVerbalizer_Cardinal_RandomValuesUpTo15Digits_MatchesReference
                  - NumberVerbalizer_Cardinal_ScaleBoundaries_UseCorrectScaleWords
                  - NumberVerbalizer_Ordinal_EveryValueFrom0To9999_MatchesReference
                  - NumberVerbalizer_Year_EveryYearFrom1000To2099_MatchesReference
                  - NumberVerbalizer_Decade_Forms_AreSpoken
                  - NumberVerbalizer_Decimal_FractionDigitsAreSpelledIncludingZeros
                  - NumberVerbalizer_Fraction_SingularPluralAndSpecialDenominators
                  - NumberVerbalizer_Clock_AllHoursAndMinutes_MatchReference
                  - NumberVerbalizer_Calendar_MonthNamesAndDayOrdinals_AreSpoken

              - id: SpeechTextEn-Normalization-NumberVerbalizer-Safety
                title: >-
                  The NumberVerbalizer class shall never produce a spoken value of more than 1,024
                  characters for any input within its documented limits, shall make every value
                  consist of letters, single spaces and the apostrophe of o'clock only, drawn from a
                  closed vocabulary with no digit, shall give the same words under every current
                  culture, and shall throw ArgumentException for an empty digit span, a character
                  other than the ASCII digits 0 to 9, and a digit count, hour, minute or year length
                  outside its documented limits.
                justification: |
                  A bounded value keeps the cost of a number constant, and a value without a digit
                  or an unknown word is what lets a backend treat it as plain words. Words built
                  with a culture-sensitive conversion could differ between machines (the Turkish
                  upper-case i is the classic case). The recognizer checks every limit before it
                  asks for a reading, so a call outside them is a defect that must fail where it is
                  made rather than produce a truncated or wrong spoken value, and digits of other
                  scripts are not numbers this library reads.
                tests:
                  - NumberVerbalizer_WorstCaseInputs_StayWithinOutputBound
                  - NumberVerbalizer_UnderForeignCultures_GivesIdenticalWords
                  - NumberVerbalizer_InvalidDigits_ThrowArgumentException
