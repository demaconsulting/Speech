---
# Software Unit Requirements for TextNormalizer
#
# These requirements describe the design-level behavior of the TextNormalizer unit, the stateless
# rule pass that turns the tokens of a text into an aligned description of how parts of it are
# spoken, decomposing the parent SpeechTextEn NormalizationSubsystem requirements. Its rules are applied
# in a fixed order: user override directives (which win over every other rule for the spoken form;
# the sentence-break edits of the abbreviation rules are kept), invisible characters,
# web addresses (through WebAddressRecognizer), clitics, numeric expressions (through
# NumericExpressionRecognizer), abbreviations, acronyms, identifiers of letters and digits
# (through AlphanumericTokenRecognizer), symbols and apostrophes. The tests feed
# it the tokens of the real DemaConsulting.PartOfSpeech tokenizer through a test harness, which is
# the unit's only dependency on the OTS package and exists in the tests only. Each requirement
# states one observable behavior.
#
# Covered by
# test/DemaConsulting.Speech.Text.En.Tests/NormalizationSubsystem/TextNormalizerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: NormalizationSubsystem Requirements
        sections:
          - title: TextNormalizer Requirements
            requirements:
              - id: SpeechTextEn-Normalization-TextNormalizer-Spans
                title: >-
                  The TextNormalizer class shall describe each replacement as a span on the exact
                  characters of one token, of one token with its adjacent period token, or of a
                  numeric span the recognizer produced (a token, a currency symbol with its number,
                  an apostrophe with its decade), shall apply the numeric recognizer after the
                  invisible-character and clitic rules and before the abbreviation rule, speaking
                  the tokens a multi-token match consumed only once and forwarding its ambiguity and
                  fallback counts, shall drop each maximal run of invisible formatting characters as
                  one empty replacement (keeping the joiners that glue emoji sequences and applying
                  no other rule to a token that contains one), shall mark a replacement as spelled
                  exactly when its spoken text without the separating padding is single capital
                  letters separated by single spaces (never for a replace directive), shall emit an
                  ampersand initialism as one spelled span per group of capital letters and one
                  "and" symbol span per ampersand with a possessive tail outside the spans and the
                  same spoken text as for the whole token, shall separate a spoken word from a
                  touching letter or digit and two adjacent word-producing replacements with exactly
                  one space without moving any offset, and shall produce nothing for an empty text
                  or an empty token list.
                justification: |
                  Spans limited to token extents are the rule that keeps each one free of
                  whitespace and clause separators and so safe from chunking. The numeric rule must
                  run before the abbreviation lexicon so that "5 ft." is a unit and "Jan. 5" leaves
                  the number to it, and a consumed follow-up token (the word "million", a percent
                  sign) belongs to its number and must not be spoken a second time. Dropping is the
                  only edit that removes text, so it is explicit and limited to characters that carry
                  no sound. Deciding the spelled flag once, by the shape of the spoken text, makes it
                  impossible for a rule to produce letters that are not marked or a marking that is
                  not letters, and the ampersand of "AT&T" is the word "and", so splitting the token
                  keeps the promise of the spelled kind and the words a consumer speaks. Without the
                  separating space "50%" would speak its two words as one run.
                tests:
                  - TextNormalizer_Normalize_SuffixPeriod_IsKeptAtSentenceEndAndConsumedMidSentence
                  - TextNormalizer_Normalize_EmptyTextAndTokens_ProducesNothing
                  - TextNormalizer_Normalize_NumericTokens_AreRecognizedBeforeAbbreviations
                  - TextNormalizer_Normalize_InvisibleCharacters_AreDroppedExplicitly
                  - TextNormalizer_Normalize_SpelledReplacements_AreDecidedByShape
                  - TextNormalizer_Normalize_AmpersandInitialisms_AreDecomposedWithUnchangedSpokenText
                  - TextNormalizer_Normalize_AmpersandInitialismNextToReplacement_PadsExactlyOneSpace

              - id: SpeechTextEn-Normalization-TextNormalizer-AddressesAndIdentifiers
                title: >-
                  The TextNormalizer class shall speak a URL, an e-mail address and a bare domain
                  with a known top-level domain as their pieces (the scheme letters and a leading
                  www spelled, each separator as a word, the slashes after the scheme dropped, the
                  words between them left as written) before any clitic, abbreviation or acronym
                  rule can take the token, shall speak an identifier of capital letters and digits
                  with its letters spelled and its digits read and a name joined to a number by a
                  hyphen with only the number read, and shall leave a file name, a dotted name with
                  an unknown ending and a capital word of four or more letters before digits as
                  written.
                justification: |
                  A model reads "john.smith@example.com" as one unpronounceable word and "A4" as the
                  article and a number, so the pieces that are not words must be spoken, while the
                  words of an address stay words for the phonemizer. The address rule runs first
                  because a dotted name could otherwise be taken for a clitic or an abbreviation, and
                  the identifier rule runs after the lexicons so that a listed entry wins. Names such
                  as "report.pdf" and "Node.js" are not addresses and must not be reworded.
                tests:
                  - TextNormalizer_Normalize_WebAddresses_AreSpokenAsTheirPieces
                  - TextNormalizer_Normalize_LettersAndDigits_AreSpelledAndRead

              - id: SpeechTextEn-Normalization-TextNormalizer-PeriodsAndBreaks
                title: >-
                  The TextNormalizer class shall consume the period of an abbreviation read as a
                  prefix (a title, Saint, Doctor, Number or an initial) and remove the tokenizer's
                  sentence break after it; for an abbreviation read as a suffix or as the word No,
                  or a unit that may carry an abbreviation period, it shall add a sentence break
                  before a capitalized next word, keep the period where the abbreviation ends its
                  sentence, consume it in the middle of a sentence and add no break before a
                  lower-case or digit word; it shall handle a dotted initialism whose period is a
                  separate token like any other abbreviation; it shall treat a name suffix or
                  credential (Jr., Sr., Esq., Ph.D., M.D., III and similar) that is directly
                  followed by another one as part of the same name, still ending the sentence before
                  a word that begins a sentence; it shall count an abbreviation resolution as
                  ambiguous once when the default reading was used or the cues competed, a numeric
                  match once when it asks for it and each numeric fallback, never a clear reading;
                  and it shall not speak an ambiguous initialism in a sentence written entirely in
                  capitals while still speaking a capitalized initialism in an ordinary sentence.
                justification: |
                  Whether an abbreviation period ends the sentence depends on how the abbreviation
                  is read: after a title it never does, and after a street suffix or a unit it does
                  when a capitalized sentence follows ("He is 6 ft. tall." continues, "He is 6 ft.
                  Then he left." does not). A credential after a name suffix ("John Smith Jr. Ph.D.
                  spoke.") continues the name. The rule set is closed and local, using only the next
                  token, so its effect on the breaks is predictable. The counts are the evidence of
                  how often the normalization had to guess or give up, so they count each guess once
                  and nothing else, and in an all-capital sentence every word looks like an
                  initialism, so "IT" and "US" would be spelled where they are the words "it" and
                  "us".
                children:
                  - Speech-OTS-PartOfSpeech-TokenizationConventions
                tests:
                  - TextNormalizer_Normalize_SuffixPeriod_IsKeptAtSentenceEndAndConsumedMidSentence
                  - TextNormalizer_Normalize_PrefixTitle_ConsumesPeriodAndSuppressesTokenizerBreak
                  - TextNormalizer_Normalize_SuffixBeforeNextWord_ForcesBreakOnlyBeforeCapitalizedWord
                  - TextNormalizer_Normalize_WordReading_ForcesBreakWithoutSpan
                  - TextNormalizer_Normalize_DottedInitialismWithSeparatePeriod_IsHandled
                  - TextNormalizer_Normalize_NameSuffixBeforeCredential_ConsumesPeriodAndKeepsNameTogether
                  - TextNormalizer_Normalize_AmbiguousResolutions_AreCountedOnce

              - id: SpeechTextEn-Normalization-TextNormalizer-SymbolsAndApostrophes
                title: >-
                  The TextNormalizer class shall speak an operator symbol only when whitespace or
                  the text edge sets it apart on both sides, shall speak the copyright, registered,
                  trademark, section and paragraph marks alone or touching a word (separating two
                  adjacent marks that both produce words by exactly one space) and a slash only
                  between two plain words, leaving every other use of these characters unchanged,
                  shall canonicalize a typographic apostrophe inside a clitic or a word while
                  keeping quotation marks unchanged, and shall classify each clitic from the
                  neighboring words only when classification is requested.
                justification: |
                  The same characters mean something else in markup, paths, fractions and units,
                  where rewording them would damage the text, so only the clear word-like uses are
                  spoken, and adjacent marks would otherwise run together into one unreadable word.
                  The role of a clitic is a result for the detailed analysis only, so the lean path
                  skips it, but the canonical apostrophe is needed in both.
                tests:
                  - TextNormalizer_Normalize_Operators_AreSpokenOnlyWhenSetApart
                  - TextNormalizer_Normalize_Marks_AreSpoken
                  - TextNormalizer_Normalize_AdjacentMarks_PadExactlyOneSpaceAndKeepOffsets
                  - TextNormalizer_Normalize_Slash_IsSpokenOnlyBetweenWords
                  - TextNormalizer_Normalize_Apostrophes_AreCanonicalizedOnlyInsideWords
                  - TextNormalizer_Normalize_Clitics_AreClassifiedFromContext
                  - TextNormalizer_Normalize_CliticsNotRequested_RecordsNoCliticsButStillCanonicalizes

              - id: SpeechTextEn-Normalization-TextNormalizer-Directives
                title: >-
                  The TextNormalizer class shall apply a directive to its token as the first rule so
                  that it wins over every built-in rule (the clitic rule, a symbol, a lexicon
                  abbreviation, a listed or ruled acronym and an ampersand initialism): a skip
                  directive emits nothing, a replace directive emits one override span of the
                  directive's words with the single separating space of the alignment contract, a
                  spell directive emits one spelled override span of the token's ASCII letters (none
                  for a token that is not only ASCII letters, which is spoken as written and counted
                  as ignored), a pronounce directive records one pronunciation mark and no span, and
                  a reading directive speaks the token as written with no span and no mark and is
                  counted as applied; shall make for a token that a directive handles (applied or
                  ignored) the sentence-break edits the built-in abbreviation rules would have made,
                  so that the reconciled sentence breaks are identical with and without directives;
                  shall leave a token that an earlier multi-token match has consumed to that match,
                  counting the directive as ignored, and count applied and ignored directives
                  separately; and shall throw ArgumentException for a directive list that is not in
                  strictly ascending token order or names a token outside the tokens.
                justification: |
                  A host asks for a word to be spoken a particular way precisely because the
                  built-in rules get it wrong, so the override has to come before them. Each action
                  has exactly one effect on the result, and a defective directive must degrade to
                  the written word rather than corrupt the alignment. A directive changes how a word
                  is spoken, not where a sentence ends: a changed break splits a sentence ("See
                  Fig." and "5 for details.") or joins two, and the abbreviation rules are the only
                  producers of those edits. The number rules read a number with its unit as one
                  construct, so a replacement of the unit word alone would corrupt the reading and
                  the ignored count tells a host its entry had no effect. The pass consumes the
                  directives with one forward cursor, so an unordered or out-of-range list is a
                  defect of the caller that must fail where it is made.
                tests:
                  - TextNormalizer_Normalize_SkipDirective_EmitsNothingAndCountsApplied
                  - TextNormalizer_Normalize_ReadingDirective_SpokenAsWrittenAndCountsApplied
                  - TextNormalizer_Normalize_ReplaceDirective_EmitsOverrideSpanWithSinglePadding
                  - TextNormalizer_Normalize_SpellDirective_SpellsAsciiLettersOnly
                  - TextNormalizer_Normalize_PronounceDirective_AddsMarkWithoutSpan
                  - TextNormalizer_Normalize_DirectiveOnBuiltInToken_BeatsEveryBuiltInRule
                  - TextNormalizer_Normalize_DirectiveOnAbbreviation_KeepsBuiltInSentenceBreaks
                  - TextNormalizer_Normalize_DirectiveOnFig_ReviewExampleHasNoSentenceBreak
                  - TextNormalizer_Normalize_DefectiveDirective_StillKeepsBuiltInSentenceBreaks
                  - TextNormalizer_Normalize_DirectiveOnConsumedToken_IsIgnoredAndCounted
                  - TextNormalizer_Normalize_MixedDirectives_CountAppliedAndIgnoredSeparately
                  - TextNormalizer_Normalize_InvalidDirectiveIndices_ThrowArgumentException

              - id: SpeechTextEn-Normalization-TextNormalizer-Contract
                title: >-
                  The TextNormalizer class shall throw OperationCanceledException before any work for
                  a token that is already canceled and instead of returning a result when
                  cancellation is requested during a pass, shall give the same result for repeated
                  and concurrent normalization of a text with the same configured lexicons, using
                  only the lexicons it was constructed with, and shall throw ArgumentNullException
                  for a null text or a null lexicon and ArgumentException for a token list that does
                  not describe the text.
                justification: |
                  A long text must stop promptly when the request is canceled, and one shared
                  normalizer serves every request on thread-pool threads, so results must not depend
                  on timing or on other requests. A programming error should surface immediately
                  with a clear exception rather than as a wrong span.
                tests:
                  - TextNormalizer_Normalize_PreCanceledToken_ThrowsOperationCanceledException
                  - TextNormalizer_Normalize_CanceledMidPass_ThrowsOperationCanceledException
                  - TextNormalizer_Normalize_RepeatedAndCustomLexicons_AreDeterministic
                  - TextNormalizer_NormalizeAndConstructor_InvalidArguments_Throw
                  - TextNormalizer_Normalize_TokenRangeOverflowingOrOutsideText_ThrowsArgumentException
                  - TextNormalizer_Normalize_SecondTokenOverflowing_ThrowsArgumentException
