---
# Software Unit Requirements for CorpusReader
#
# These requirements describe the design-level behavior of the CorpusReader unit, the part of the Text.En
# trainer that tokenizes the public-domain corpus with the analyzer's tokenizer, decomposing the parent SpeechTextEn
# CorpusSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/CorpusSubsystem/CorpusReaderTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: CorpusSubsystem Requirements
        sections:
          - title: CorpusReader Requirements
            requirements:
              - id: SpeechTextEn-Corpus-CorpusReader-Tokenization
                title: >-
                  The CorpusReader unit shall split each body into paragraphs at blank lines with their lines
                  joined by single spaces, split each paragraph into sentences and tokens with the analyzer's
                  tokenizer, identically for any number of threads, normalize a token with the analyzer's rule (curly
                  single quotes become the apostrophe, only ASCII capitals are lower-cased, a token with a digit and
                  no letter becomes the number form), and treat a form longer than 40 characters or with a character
                  outside U+0021 to U+007E, U+00A1 to U+00FF and U+2010 to U+2027 as not eligible.
                justification: |
                  The audit compares the corpus with evaluation sentences sentence by sentence, so the corpus must be
                  split exactly as the analyzer splits text; a later feature learned from the corpus must hold exactly
                  the forms the analyzer looks up, and only characters whose text is the same on every platform.
                tests:
                  - CorpusReader_Paragraphs_BlankLines_SplitAndJoin
                  - CorpusReader_Normalize_RuntimeRule
                  - CorpusReader_NormalizeEligible_Boundaries
                  - CorpusReader_Tokenize_DifferentThreadCounts_SameBooks
