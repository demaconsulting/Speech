---
# Software Unit Requirements for CorpusCache
#
# These requirements describe the design-level behavior of the CorpusCache unit (and the source list that is
# documented with it), the part of the Text.En trainer that validates cluster-sources.tsv, fetches the corpus books from
# an official mirror with a polite rate limit, pins and verifies their bodies and hands out only verified bodies,
# decomposing the parent SpeechTextEn CorpusSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/CorpusSubsystem/CorpusCacheTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: CorpusSubsystem Requirements
        sections:
          - title: CorpusCache Requirements
            requirements:
              - id: SpeechTextEn-Corpus-CorpusCache-SourceList
                title: >-
                  The CorpusCache unit shall load the source list only when it follows the data-file format
                  rules and has the exact header, every source id is gutenberg-N with N ascending and unique, every
                  group and status is a known one, every year is 1929 or earlier or a dash, every address is an HTTPS
                  address of a plain-text file of that book on an allowed mirror, and a body pin is present only on a
                  used book and then has both a 64-digit lowercase SHA-256 and a positive size, throwing
                  InvalidDataException that names the line otherwise, and shall list the used books in ordinal
                  source-id order.
                justification: |
                  The list is the reviewed record of which books may be used and why; a malformed row, a book after
                  1929 or an address off the official mirrors must be found before anything is fetched or counted.
                tests:
                  - CorpusSourceList_Load_ValidList_ParsesRows
                  - CorpusSourceList_Load_InvalidRows_Throw

              - id: SpeechTextEn-Corpus-CorpusCache-WritePins
                title: >-
                  The CorpusCache unit shall fill new pins only into rows that have none and leave every other
                  byte of the source list unchanged.
                justification: |
                  A pin is evidence of what a book was when it was reviewed; overwriting one would hide a changed
                  book, and touching other cells would make the reviewed list differ from what was reviewed.
                tests:
                  - CorpusSourceList_WithPins_FillsOnlyUnpinnedRows

              - id: SpeechTextEn-Corpus-CorpusCache-PoliteFetch
                title: >-
                  The CorpusCache unit shall request only the text and metadata of used books, only over HTTPS
                  from an allowed mirror (optionally a configured allowed mirror in place of the listed one), one
                  request at a time with the configured pause before every request but the first, retry a failed
                  request at most three times after 5, 15 and 45 seconds, fail only that book when a file does not
                  exist, never follow an HTTP redirect, failing only that book without a retry when the mirror
                  answers with one, and stop the whole run with IOException when the mirror refuses a request with
                  HTTP 403 or 429.
                justification: |
                  The archive asks automated clients to use its mirrors, one connection at a time and slowly; a
                  refusal means the client must stop, and a transient failure must not cost a whole run. A redirect
                  could lead from the mirror to the main web site, which automated clients must not use, so it is
                  refused rather than followed.
                tests:
                  - CorpusCache_Fetch_UnpinnedBooks_FetchesPoliteAndPins
                  - CorpusCache_Fetch_TooManyRequests_StopsRun
                  - CorpusCache_Fetch_TransientFailure_RetriesWithBackoff
                  - CorpusCache_Fetch_NotFound_FailsBookWithoutRetry
                  - CorpusCache_Mirror_ReplacesHostAndRefusesOthers
                  - CorpusCache_Fetch_MirrorRedirects_FailsBookWithoutRetry
                  - GutenbergMirrorFetcher_CreateHandler_Default_DoesNotFollowRedirects
                  - GutenbergMirrorFetcher_Open_RedirectToMainSite_RefusedWithoutFollowing
                  - GutenbergMirrorFetcher_Open_Success_ReturnsBodyWithUserAgent

              - id: SpeechTextEn-Corpus-CorpusCache-VerifiedBodies
                title: >-
                  The CorpusCache unit shall make no request for a book whose cached body matches its pin,
                  restore a damaged body from the cached download without a request when the download still yields the
                  pinned body, fail a book whose fetched text no longer yields its pinned body without writing it, and
                  hand out a body only when it is pinned and matches its pin, throwing InvalidDataException that says
                  to fetch or to write the pins otherwise.
                justification: |
                  Only the reviewed, pinned text may be counted; a cache edited or damaged after it was verified is
                  refused, and the mirror is not asked again for what is already at hand.
                tests:
                  - CorpusCache_Fetch_PinnedAndCached_MakesNoRequest
                  - CorpusCache_TamperedBody_RefusedThenRestored
                  - CorpusCache_Fetch_MirrorTextDiffersFromPin_Fails
                  - CorpusCache_ReadBodies_UnpinnedBook_Throws

              - id: SpeechTextEn-Corpus-CorpusCache-Cancellation
                title: >-
                  The CorpusCache unit shall let a cancellation by the caller propagate as
                  OperationCanceledException as soon as it is seen, during a request, while a response body is being
                  read or before or after a pause, without retrying the request, writing a partial file or reporting
                  it as a failed download, and shall still retry a canceled
                  request whose caller did not cancel (the HTTP client's timeout).
                justification: |
                  A canceled run must stop promptly and say that it was canceled; retrying it would hold the run for
                  up to a minute of backoff and then misreport the cancellation as a network failure, while a timeout
                  is a transient failure like any other.
                tests:
                  - CorpusCache_Fetch_CallerCanceledDuringRequest_PropagatesWithoutRetry
                  - CorpusCache_Fetch_CallerCanceledDuringBodyRead_StopsWithoutWritingFile
                  - CorpusCache_Fetch_CallerCanceledDuringBackoff_StopsBeforeNextRequest
                  - CorpusCache_Fetch_DefaultPauseCanceled_EndsAtOnce
                  - CorpusCache_Fetch_TimeoutWithoutCallerCancellation_Retries
