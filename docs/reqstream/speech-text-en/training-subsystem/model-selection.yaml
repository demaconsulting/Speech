---
# Software Unit Requirements for ModelSelection
#
# These requirements describe the design-level behavior of the ModelSelection unit, the part of the Text.En
# trainer that chooses the epoch count and the calibration temperature on the development set and builds the
# model image, decomposing the parent SpeechTextEn TrainingSubsystem requirements. Each requirement states one
# observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystem/ModelSelectionTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        sections:
          - title: ModelSelection Requirements
            requirements:
              - id: SpeechTextEn-Training-ModelSelection-Selection
                title: >-
                  The ModelSelection class shall, from the development rows only, keep the earliest epoch
                  at which the most natural development rows are decided correctly (all development rows
                  when there are no natural ones, the first epoch when there are none), and shall choose as
                  the calibration temperature the value of a fixed grid that gives the smallest loss on those
                  rows (one when there are none) and store it in the model.
                justification: |
                  More epochs fit the training data better but can fit the examples' quirks instead of
                  the language. The development set, which the model never learns from, is where the
                  choice can be made honestly, and preferring the earliest of equal epochs keeps the
                  choice stable. The confidence the runtime reports is only a probability a host can
                  compare with a threshold if the temperature is fitted on examples that were not trained
                  on.
                tests:
                  - ModelSelection_Train_Fixture_KeepsTheEarliestEpochWithTheMostNaturalDevRowsCorrect
                  - ModelSelection_Train_NoNaturalDevRows_SelectsOnAllDevRows
                  - ModelSelection_Train_NoDevRows_KeepsFirstEpochAtTemperatureOne
                  - ModelSelection_Train_Fixture_TemperatureMinimizesTheLossOnTheSelectionRows

              - id: SpeechTextEn-Training-ModelSelection-Images
                title: >-
                  The ModelSelection class shall build the model both as a compressed file and as an
                  uncompressed image that hold the same weights, shall report the hash and size of the
                  uncompressed image and the counts of the rows used and skipped, and shall give
                  byte-identical uncompressed images and identical results for the same corpus and settings.
                justification: |
                  The runtime refuses a model whose inventory or feature set does not fit, and the owner
                  must be able to tell which data produced a model. The uncompressed image is what is
                  compared and hashed, because the bytes of a compressed file depend on the compression
                  library, and the model is checked for staleness by retraining it, so the same inputs must
                  give the same model.
                tests:
                  - ModelSelection_Train_SameInputsTwice_GivesIdenticalImages

              - id: SpeechTextEn-Training-ModelSelection-SettingsValidation
                title: >-
                  The ModelSelection class shall throw InvalidDataException for invalid settings and
                  ArgumentNullException for a null corpus.
                justification: |
                  Invalid settings have to fail at once with a clear exception.
                tests:
                  - ModelSelection_Train_InvalidSettings_ThrowsInvalidDataException
