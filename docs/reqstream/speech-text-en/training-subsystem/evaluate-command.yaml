---
# Software Unit Requirements for EvaluateCommand
#
# These requirements describe the design-level behavior of the EvaluateCommand unit, the evaluate command of the
# Text.En trainer that measures a trained model on the development and holdout sets, decides the quality gate and
# writes or verifies the evaluation record, decomposing the parent SpeechTextEn TrainingSubsystem requirements.
# Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystem/EvaluateCommandTests.cs. The
# program entry point (Program.cs) is glue that dispatches to this unit.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        sections:
          - title: EvaluateCommand Requirements
            requirements:
              - id: SpeechTextEn-Training-EvaluateCommand-UsageErrors
                title: >-
                  The EvaluateCommand class shall print its usage and give the exit code 0 for the help
                  option, and shall give the exit code 2 with a message on the error stream that names the
                  problem, and without a gate verdict, for an unknown option, an option without a value, an
                  unknown set name, the write and check options together, a missing model file and a
                  harvested row without a source document.
                justification: |
                  The build and the owner act on the exit code. A mistake in the command must not look
                  like a failed gate or a stale record, and a measurement whose confidence interval rests
                  on unknown documents would claim more certainty than the data holds, so the command
                  stops rather than print a verdict.
                tests:
                  - EvaluateCommand_Run_Help_PrintsUsageAndExitsZero
                  - EvaluateCommand_Run_BadCommandLine_ExitsTwoNamingTheProblem
                  - EvaluateCommand_Run_UnknownSetOrWriteWithCheck_ExitsTwo
                  - EvaluateCommand_Run_MissingModel_ExitsTwo
                  - EvaluateCommand_Run_HarvestedRowWithoutProvenance_ExitsTwoNamingTheProblem

              - id: SpeechTextEn-Training-EvaluateCommand-HoldoutDiscipline
                title: >-
                  The EvaluateCommand class shall, when it evaluates only the development set, read no
                  holdout file and say nothing about a holdout, and shall, when it evaluates a holdout
                  set, announce that a holdout is being read and print the model accuracy, the three
                  baselines, the improvement over the own-part-of-speech baseline with its confidence
                  interval, the parity of the trainer with the analyzer and the readings with the lowest
                  accuracy.
                justification: |
                  Looking at a holdout set is the one step that cannot be undone: a set that has guided a
                  choice no longer measures anything. The owner must be able to evaluate during
                  development without touching a holdout, must be told whenever one is touched, and
                  decides from the printed figures whether the model is good enough.
                tests:
                  - EvaluateCommand_Run_DevSet_DoesNotReadHoldoutFiles
                  - EvaluateCommand_Run_HoldoutSet_AnnouncesAndPrintsTheFigures

              - id: SpeechTextEn-Training-EvaluateCommand-GateExitCodes
                title: >-
                  The EvaluateCommand class shall, with the gate option, evaluate every gate set that has a
                  threshold in the record, print for each its accuracy, the clustered interval of the
                  accuracy, the threshold and whether it is met, and give the exit code 0 and the verdict
                  pass only when every set reaches its threshold and, with the check option, the record is
                  current, shall otherwise give the exit code 1, printing both results, and shall give the
                  exit code 2 naming the set when a gate set has no file or no rows.
                justification: |
                  The quality gate decision has to be a command whose exit code a pipeline can act on, and a
                  failure has to say which set failed. A passing record check must not hide a failing gate,
                  a passing gate must not hide a stale evidence record, and a gate set that is missing must
                  not be skipped silently.
                tests:
                  - EvaluateCommand_Run_GateAccuracyBelowThreshold_ExitsOne
                  - EvaluateCommand_Gate_MissingGateSet_ExitsTwo
                  - EvaluateCommand_Run_GateWithWrite_DecidesOnTheNaturalHoldout
                  - EvaluateCommand_Run_GatePassesRecordCurrent_ExitsZero

              - id: SpeechTextEn-Training-EvaluateCommand-FlipReport
                title: >-
                  The EvaluateCommand class shall, with the gate option, print every gate row whose reading
                  under the model being evaluated differs from the current reading of the committed record,
                  with its set, id, labeled reading, both readings and the change, and the fixed and broken
                  counts of each set, without changing the record.
                justification: |
                  A later model change is reviewed before anything is committed: the gate run on the
                  candidate model shows exactly which goldens, listening flags and test rows it fixes or
                  breaks.
                tests:
                  - EvaluateCommand_Gate_CandidateModel_PrintsFlipsAgainstCommittedRecord

              - id: SpeechTextEn-Training-EvaluateCommand-RecordWriteAndCheck
                title: >-
                  The EvaluateCommand class shall, with the write option, write the evaluation record
                  files, shall, with the check option, give the exit code 0 when the record is current and
                  the exit code 1 naming each file that is edited or missing, and shall, with the seeds
                  option, train once with each evaluation seed of the record, score each model end to end on
                  every gate set with rows, and print the aggregate counts of each and the threshold the
                  gate's rule derives from them, never a per-row result.
                justification: |
                  The evaluation record is the evidence of the quality gate decision. It has to be
                  reproducible, and a change to it that is not the product of an evaluation has to be
                  found. The variation of the accuracy between seeds says how far one run's figure can be
                  trusted, and it is what the gate thresholds are derived from.
                tests:
                  - EvaluateCommand_Run_WriteThenCheck_MatchesAndDetectsEditedRecord
                  - EvaluateCommand_Run_Seeds_ReportsEachSeed

              - id: SpeechTextEn-Training-EvaluateCommand-OverlaySets
                title: >-
                  The EvaluateCommand class shall accept the regression overlay and the generalization set as
                  set names that are not part of all, shall print for each the evaluation of the shipped
                  classifier, the cue-unsolvable rows verified and every slice with and without the cue priors,
                  shall skip an overlay without rows and say so, shall give the exit code 2 for a requested
                  overlay whose file is missing or for a cue-unsolvable row on which a cue acts, and shall, when
                  it writes or checks the record, evaluate the overlays whose files exist after the data sets,
                  saying which overlay file it leaves out.
                justification: |
                  The overlays are measured on demand while a change is being judged and in the committed
                  record as the baseline of later work. They are kept out of all because they are not part of
                  the gate, and they come last in the record so the gate evidence keeps its lines.
                tests:
                  - EvaluateCommand_Run_OverlaySets_ReportedWithAndWithoutCues
                  - EvaluateCommand_Run_OverlayMissingViolatedOrEmpty_ExitsTwoOrSkips
                  - EvaluateCommand_Run_WriteWithOverlays_AppendsAfterTheDataSets
