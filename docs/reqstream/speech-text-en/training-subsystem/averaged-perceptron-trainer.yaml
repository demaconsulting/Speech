---
# Software Unit Requirements for AveragedPerceptronTrainer
#
# These requirements describe the design-level behavior of the AveragedPerceptronTrainer unit (and the
# ShortWeights struct that is documented with it), the learner of the Text.En trainer that turns the aligned,
# ambiguous training rows into integer weights, decomposing the parent SpeechTextEn TrainingSubsystem
# requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystem/AveragedPerceptronTrainerTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        sections:
          - title: AveragedPerceptronTrainer Requirements
            requirements:
              - id: SpeechTextEn-Training-AveragedPerceptronTrainer-Learning
                title: >-
                  The AveragedPerceptronTrainer class shall learn from the aligned rows that have more than
                  one candidate reading integer weights that decide a separable set of those rows for their
                  labels, with the exact weights that a single correction gives, with the natural rows given
                  the configured weight, and without any change from rows that are not aligned or have a
                  single candidate.
                justification: |
                  The only purpose of the trainer is weights that make the runtime classifier choose the
                  labeled reading. A case small enough to compute by hand is the evidence that the learned
                  numbers are the intended ones, and a row with nothing to decide must not move the model.
                  The natural sentences are the closest examples to the text the analyzer meets, so the
                  owner controls how much they count.
                tests:
                  - AveragedPerceptronTrainer_Train_SeparableFixture_DecidesEveryTrainingRow
                  - AveragedPerceptronTrainer_Train_SingleMistakenRow_GivesExactAveragedWeights
                  - AveragedPerceptronTrainer_Train_NaturalWeight_ChangesTheWeights
                  - AveragedPerceptronTrainer_Train_UnalignedAndSingleCandidateRows_AreIgnored

              - id: SpeechTextEn-Training-AveragedPerceptronTrainer-Repeatable
                title: >-
                  The AveragedPerceptronTrainer class shall give the same weights after every epoch for
                  the same corpus, settings and seed, and shall drop every weight whose magnitude does not
                  exceed the prune threshold.
                justification: |
                  A model that cannot be reproduced cannot be checked for staleness, so the training must
                  depend on nothing but its inputs. Small weights add size to the model file without
                  changing many decisions, and the threshold lets the owner trade size against accuracy.
                tests:
                  - AveragedPerceptronTrainer_Train_SameSeedTwice_GivesIdenticalWeights
                  - AveragedPerceptronTrainer_Train_PruneThreshold_DropsSmallWeights

              - id: SpeechTextEn-Training-AveragedPerceptronTrainer-StableRowOrder
                title: >-
                  The AveragedPerceptronTrainer class shall offer a visiting order in which adding training
                  rows does not change the relative order in which the existing rows are visited in any
                  epoch, and which depends only on the rows, the settings and the seed.
                justification: |
                  A shuffle of row positions moves every later row when one row is inserted, so a small
                  data change retrains the model on a different order and its effect cannot be told apart
                  from the reshuffle. An order tied to each row's own identity isolates the effect of the
                  added rows, which a targeted data round needs, and it must stay as repeatable as the
                  rest of the training.
                tests:
                  - AveragedPerceptronTrainer_Train_KeyedOrder_InsertedRowsKeepRelativeOrderOfExistingRows
                  - AveragedPerceptronTrainer_Train_KeyedOrderSameSeed_IsDeterministic

              - id: SpeechTextEn-Training-AveragedPerceptronTrainer-SettingsValidation
                title: >-
                  The AveragedPerceptronTrainer constructor shall throw InvalidDataException before any
                  training for settings outside their range and for settings whose worst-case arithmetic on
                  the corpus could overflow 64-bit integers, naming the settings, and shall train the
                  largest validated settings without corrupting any weight.
                justification: |
                  A setting outside its range, such as a table size no model file can hold, has to fail at
                  once and not after a long training run. A wrapped integer would silently corrupt the
                  weights and so the committed model, so the worst case is bounded up front.
                tests:
                  - AveragedPerceptronTrainer_Constructor_InvalidSettings_ThrowsInvalidDataException
                  - AveragedPerceptronTrainer_Constructor_SettingsBeyondTheOverflowBound_ThrowsNamingTheSettings
                  - AveragedPerceptronTrainer_Train_ValidatedMaximumSettings_TrainsWithoutOverflow
