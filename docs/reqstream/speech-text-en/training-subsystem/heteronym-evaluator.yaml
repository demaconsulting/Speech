---
# Software Unit Requirements for HeteronymEvaluator
#
# These requirements describe the design-level behavior of the HeteronymEvaluator unit (and the result records
# that are documented with it), the part of the Text.En trainer that scores a model on a labeled set end to end
# through the analyzer, with baselines, strata, a clustered confidence interval and the quality gate decision,
# decomposing the parent SpeechTextEn TrainingSubsystem requirements. Each requirement states one observable
# behavior. The input requirement (SpeechTextEn-Training-HeteronymEvaluator-InputValidation) also covers the rows
# supplied by a caller and is a child of the ExternalEvaluationSubsystem too, whose command evaluates the external
# sets through this unit.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystem/HeteronymEvaluatorTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        sections:
          - title: HeteronymEvaluator Requirements
            requirements:
              - id: SpeechTextEn-Training-HeteronymEvaluator-Metrics
                title: >-
                  The HeteronymEvaluator class shall score a model on a set of labeled rows by running the
                  real analyzer with that model on each row's sentence, and shall report the number of
                  rows, of aligned rows, of single-candidate rows and of rows that received a reading, the
                  number decided correctly, the number each of the own-part-of-speech, majority and
                  first-candidate baselines decides correctly, the tallies by source and by confidence
                  bucket, the tallies by labeled reading from the lowest accuracy to the highest, and the
                  number of document clusters, shall count a row whose target is not a token of the
                  analyzer's tokenization as decided wrong and as not covered, and shall express a ratio of
                  two integers in basis points, rounded half away from zero, and as zero when the
                  denominator is zero.
                justification: |
                  Accuracy alone says little. Against the baselines it shows what the model adds beyond
                  the tag the tagger already gives, and the strata show where the model is weak, a model
                  that is good on average can still fail one reading completely. Running the real analyzer
                  measures what a user would get, and a row the analyzer cannot read must lower the
                  accuracy, not disappear from the measurement. The evaluation record is committed and
                  compared, and ratios computed in floating point could round differently on another
                  platform.
                tests:
                  - HeteronymEvaluator_Evaluate_NaturalHoldout_ComputesExactMetrics
                  - HeteronymEvaluator_Evaluate_NaturalHoldout_ListsReadingsWorstFirst
                  - HeteronymEvaluator_Evaluate_UnalignedRow_CountsWrongAndUncovered
                  - HeteronymEvaluator_RoundBasisPoints_RoundsHalfAwayFromZero

              - id: SpeechTextEn-Training-HeteronymEvaluator-Baselines
                title: >-
                  The HeteronymEvaluator class shall decide the own-part-of-speech baseline by choosing the
                  one candidate whose part-of-speech tags include the tag the tagger gave the word, and the
                  first candidate when no candidate or more than one candidate has that tag, and shall
                  decide the majority baseline by choosing, for each word, the reading that the training
                  rows label most often for its form.
                justification: |
                  These are the improvements a model has to beat to be worth shipping: what the tagger
                  already gives with no model at all, and the simplest possible classifier, which learns
                  nothing from context.
                tests:
                  - HeteronymEvaluator_Evaluate_UposBaseline_UsesTheTagWhenTheHintIsUnique
                  - HeteronymEvaluator_Evaluate_MajorityBaseline_FollowsTheTrainingLabels

              - id: SpeechTextEn-Training-HeteronymEvaluator-ImprovementInterval
                title: >-
                  The HeteronymEvaluator class shall compute a confidence interval of the improvement of
                  the model over the own-part-of-speech baseline, in basis points, that treats all rows of
                  one document as one unit, whose lower bound is above zero only when the model is better
                  than the baseline, and that is the same for the same clusters, settings and seed every
                  time: an interval at the exact difference when every cluster is alike or there is only
                  one cluster, a difference of zero and a lower bound that is not above zero when the model
                  is exactly as good as the baseline, an interval around the estimate with a positive lower
                  bound when the model is clearly better, a wider interval for rows that share documents
                  than for the same improvement spread over independent rows, and the empty interval when
                  there are no clusters.
                justification: |
                  A model can look better than the baseline by luck on a finite set. The interval says how
                  much of the improvement can be trusted, and it is the second condition of the quality
                  gate. Sentences of one document are alike, so treating them as independent would claim
                  more certainty than the data holds, and the interval is written into the committed
                  evaluation record, so it must be the same on every run and every platform.
                tests:
                  - HeteronymEvaluator_Bootstrap_IdenticalClusters_GiveExactDegenerateInterval
                  - HeteronymEvaluator_Bootstrap_ModelEqualsBaseline_LowerBoundIsNotPositive
                  - HeteronymEvaluator_Bootstrap_ModelClearlyBetter_HasPositiveLowerBoundAroundTheEstimate
                  - HeteronymEvaluator_Bootstrap_SingleCluster_IntervalEqualsTheEstimate
                  - HeteronymEvaluator_Bootstrap_RowsOfOneDocumentResampleTogether_SoTheIntervalIsWider
                  - HeteronymEvaluator_Evaluate_RowsOfOneDocument_FormOneCluster
                  - HeteronymEvaluator_Bootstrap_FixedSeed_IsRepeatableAndEmptyInputIsEmpty

              - id: SpeechTextEn-Training-HeteronymEvaluator-GateDecision
                title: >-
                  The HeteronymEvaluator class shall decide that a model passes the quality gate only when
                  its pooled accuracy on the natural holdout is at least the threshold, the threshold
                  itself being enough, and the lower bound of the interval of the improvement is above
                  zero, shall decide that a set without rows does not pass, and shall compare, for every
                  aligned row, the reading the trainer's own scoring decides with the reading the analyzer
                  emits, reporting the number compared, mismatched and suppressed and giving the same
                  decided rows when only the trainer's scoring is evaluated.
                justification: |
                  The gate was fixed before any model was measured. Both conditions are needed: accuracy
                  says the model is good, and the interval says it is better than not having it. The
                  trainer and the analyzer are separate code paths over the same model, and if they ever
                  disagreed the weights would have been tuned for decisions the analyzer never makes.
                tests:
                  - HeteronymEvaluator_DecideGate_AccuracyThresholdIsInclusive
                  - HeteronymEvaluator_DecideGate_LowerBoundNotPositive_Fails
                  - HeteronymEvaluator_DecideGate_NoRows_Fails
                  - HeteronymEvaluator_Evaluate_AllSets_TrainerAndAnalyzerAgreeOnEveryRow
                  - HeteronymEvaluator_EvaluateDirect_AgreesWithEndToEndOnTheFixture

              - id: SpeechTextEn-Training-HeteronymEvaluator-InputValidation
                title: >-
                  The HeteronymEvaluator class shall refuse to evaluate a set that contains a harvested row
                  without a source document, throwing InvalidDataException that names the row or the
                  missing provenance file, shall treat each synthetic or independently written row as a unit
                  of its own, shall throw InvalidDataException for a set name that is not one of the known
                  sets, and shall evaluate labeled rows that the caller supplies, with a clustering of the
                  rows that the caller supplies, as it evaluates a set of the data folder, reporting with
                  them a confidence interval of the accuracy itself that treats the rows of a cluster as one
                  unit and encloses the accuracy, and leaving the results of the sets of the data folder
                  unchanged.
                justification: |
                  A harvested row that silently counted as independent would make the interval claim more
                  certainty than the data holds, so only rows that are independent by construction may
                  stand alone, and asking for a set that does not exist must not evaluate something else.
                  Rows that come from outside the data folder, such as the external evaluation sets, have
                  to be measured by the same end-to-end method as the committed sets, with their own idea of
                  which rows belong together, or their figures could not be compared with the committed
                  record, which must not change because of it.
                tests:
                  - HeteronymEvaluator_Evaluate_MissingProvenanceFile_ThrowsInvalidDataException
                  - HeteronymEvaluator_Evaluate_IndependentAndSyntheticRows_NeedNoProvenance
                  - HeteronymEvaluator_Evaluate_UnknownSet_ThrowsInvalidDataException
                  - HeteronymEvaluator_EvaluateRows_CustomClustering_GroupsRowsOfOneCluster
                  - HeteronymEvaluator_EvaluateRows_AccuracyInterval_EnclosesPointEstimate

              - id: SpeechTextEn-Training-HeteronymEvaluator-OverlayCuedAndModelOnly
                title: >-
                  The HeteronymEvaluator class shall evaluate the rows of an overlay end to end through the
                  analyzer with the model under test, clustered as the overlay says, and shall give for every
                  row the reading with the curated cue priors, the reading the model alone chooses with the
                  classifier's own integer scoring on the same path (no reading where the analyzer emits none,
                  and the analyzer's reading where the target is not one runtime token) and whether a cue prior
                  acts on one of its candidates, and for every slice the rows, both correct counts, clustered
                  intervals of both accuracies and of their paired difference, the rows on which a cue prior
                  acts and the rows whose reading differs, all slice first and the others in ordinal order; it
                  shall refuse an overlay whose row id repeats and shall stop with a data error when a row on
                  which no cue prior acts gets different readings with and without the priors.
                justification: |
                  The difference between the shipped classifier and the model alone is the effect of the cue
                  priors and nothing else only when both decide on the same features with the same scoring.
                  The model-only decision is computed by the evaluation and leaves the classifier, the model and
                  the analyzer untouched. One of the priors is private to the classifier and is mirrored for
                  the count of rows it acts on; the stop on a row without a detected cue whose reading still
                  changes keeps that mirror honest.
                tests:
                  - HeteronymEvaluator_EvaluateOverlay_NoCueFires_ReportsSlicesWithEqualModelOnly
                  - HeteronymEvaluator_EvaluateOverlay_CueFires_CountsFiredRowsApartFromChangedRows
                  - HeteronymEvaluator_EvaluateOverlay_RepeatedId_ThrowsInvalidDataException

              - id: SpeechTextEn-Training-HeteronymEvaluator-CueUnsolvableCheck
                title: >-
                  The HeteronymEvaluator class shall stop the evaluation of an overlay with a data error that
                  names, with the reason, every row marked as not solvable by the curated cues that is not one
                  runtime token, on which the adjective, the past-time or a context cue test fires, on which the
                  noun-form prior is added to a candidate whether or not it changes the reading, or whose reading
                  differs with and without the cue priors, and shall not name a row without that mark.
                justification: |
                  The cue-unsolvable subset measures what the model achieves where the hand-written cues cannot
                  help; a row in it on which a cue acts would make that figure wrong, and the operator needs the
                  row and the reason to correct the data. A cue that acts without changing the reading today still
                  acts on the row, and would change it under a different model.
                tests:
                  - HeteronymEvaluator_EvaluateOverlay_CueUnsolvableViolation_ThrowsNamingRowsAndReasons
                  - HeteronymEvaluator_EvaluateOverlay_CueUnsolvableNounFormCueWithoutChange_ThrowsNamingTheCue
