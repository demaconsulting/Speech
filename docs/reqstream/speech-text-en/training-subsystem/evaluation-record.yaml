---
# Software Unit Requirements for EvaluationRecord
#
# These requirements describe the design-level behavior of the EvaluationRecord unit, the deterministic
# tab-separated record files of the evaluation of the Text.En model, decomposing the parent SpeechTextEn
# TrainingSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystem/EvaluationRecordTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        sections:
          - title: EvaluationRecord Requirements
            requirements:
              - id: SpeechTextEn-Training-EvaluationRecord-Files
                title: >-
                  The EvaluationRecord class shall write a summary file with one row per evaluated set that
                  holds the exact integer counts and the basis-point ratios, a gate file that holds the
                  hash of the model image, the thresholds, whether each condition holds and the verdict
                  (pass, fail, or not evaluated when there is no natural holdout), files that list the
                  accuracy by source, by reading and by confidence bucket with the own-part-of-speech
                  baseline of each group, and a seeds file that lists the holdout accuracy of each
                  evaluation seed with its mean, minimum and maximum, and shall format a basis-point value
                  as a percentage with two decimals and an optional sign, without dependence on the
                  current culture.
                justification: |
                  The record is the evidence of the quality gate decision: the decision, the thresholds it
                  was made with and the model it was made for must be recorded together, with exact numbers
                  and not rounded text. Where the model is weak, and how much of the accuracy is the seed,
                  matter as much as the average. Figures printed for the owner have to read the same on
                  every machine.
                tests:
                  - EvaluationRecord_Render_Summary_HasExactFigures
                  - EvaluationRecord_Render_Gate_HasThresholdsAndVerdict
                  - EvaluationRecord_Render_Gate_FailAndNotEvaluated
                  - EvaluationRecord_Render_Groups_ListEveryGroup
                  - EvaluationRecord_Render_Seeds_HasRowsAndSpread
                  - EvaluationRecord_FormatPercent_FormatsBasisPoints

              - id: SpeechTextEn-Training-EvaluationRecord-Deterministic
                title: >-
                  The EvaluationRecord class shall produce the same files for the same evaluation every
                  time, in ordinal file-name order, with line feeds only and a final line feed, and shall
                  compare a folder with an evaluation, naming every file that is edited, missing or
                  different from what the evaluation produces, and naming none when the folder is current.
                justification: |
                  The record is committed and compared. Any variation that does not come from the
                  evaluation would make a current record look stale, and a record that cannot be verified
                  would be a claim nobody can check.
                tests:
                  - EvaluationRecord_Render_IsDeterministicWithLineFeedsOnly
                  - EvaluationRecord_WriteThenCompare_DetectsEditedAndMissingFiles
