---
# Software Unit Requirements for TrainingCorpus
#
# These requirements describe the design-level behavior of the TrainingCorpus unit (and the LabeledRow,
# PreparedRow and RowPreparer members that are documented with it), the loader of the Text.En trainer that
# turns the training and development files and the reading inventory into prepared rows, decomposing the parent
# SpeechTextEn TrainingSubsystem requirements. Each requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Text.En.Trainer.Tests/TrainingSubsystem/TrainingCorpusTests.cs.

sections:
  - title: SpeechTextEn Requirements
    sections:
      - title: TrainingSubsystem Requirements
        sections:
          - title: TrainingCorpus Requirements
            requirements:
              - id: SpeechTextEn-Training-TrainingCorpus-InputFiles
                title: >-
                  The TrainingCorpus class shall read exactly four files of the data folder, the training
                  rows, the development rows, the reading inventory and its forms, in file order, and
                  shall never read a holdout file, so that the corpus is the same whether a holdout file
                  is present, absent or altered.
                justification: |
                  A holdout set only measures a model that never saw it. The loader is the one place the
                  training data enters the trainer, so keeping every holdout file out of it keeps every
                  later step free of holdout influence, and the file order makes the rows, and therefore
                  the training, reproducible.
                tests:
                  - TrainingCorpus_Load_Fixture_PreparesRowsInFileOrder
                  - TrainingCorpus_Load_HoldoutFilesMissingOrGarbage_GivesTheSameCorpus

              - id: SpeechTextEn-Training-TrainingCorpus-RuntimeAlignment
                title: >-
                  The TrainingCorpus class shall prepare each labeled row by running the analyzer's own
                  tokenizer, part-of-speech tagger and feature extractor on its sentence, shall mark the
                  row aligned, with its features, its tag and whether its word has more than one candidate
                  reading, only when exactly one runtime token has the span of the row's target, and shall
                  otherwise mark the row not aligned, with no features, and count it.
                justification: |
                  The model is only as good as the match between the examples it learns from and the
                  contexts the analyzer presents to it. A row whose target the analyzer does not see as one
                  word can never be classified at run time, so it must not teach the model anything, and
                  the owner must be able to see how many rows were lost.
                tests:
                  - TrainingCorpus_Load_AlignedRows_HaveFeaturesAndUposAndAmbiguity
                  - TrainingCorpus_Load_TargetInsideLongerToken_IsNotAligned

              - id: SpeechTextEn-Training-TrainingCorpus-PartOfSpeechHints
                title: >-
                  The TrainingCorpus class shall expose, for every reading of the inventory, the
                  part-of-speech tags that the readings table lists for it.
                justification: |
                  The own-part-of-speech baseline of the evaluation chooses a reading from the tag
                  alone, and it must use the tags the inventory documents, not a second copy of them.
                tests:
                  - TrainingCorpus_Load_Fixture_ReadsPartOfSpeechHints

              - id: SpeechTextEn-Training-TrainingCorpus-DataValidation
                title: >-
                  The TrainingCorpus class shall reject with an InvalidDataException that names the row,
                  the file or the line a target that is not a form of the inventory, a label that is not a
                  candidate reading of the target's form, a malformed or out-of-sentence span, a file with
                  the wrong header and each input file that is missing.
                justification: |
                  A label that cannot be a reading of its word would silently teach the model something
                  false. The trainer fails instead, and names what to fix.
                tests:
                  - TrainingCorpus_Load_LabelNotACandidate_ThrowsNamingTheRow
                  - TrainingCorpus_Load_TargetNotAForm_ThrowsNamingTheRow
                  - TrainingCorpus_Load_MissingInputFile_ThrowsNamingTheFile
                  - RowPreparer_ReadRows_SpanOutsideSentence_ThrowsNamingFileAndLine
                  - RowPreparer_ReadRows_WrongHeader_ThrowsInvalidDataException

              - id: SpeechTextEn-Training-TrainingCorpus-InputHashes
                title: >-
                  The TrainingCorpus class shall provide a SHA-256 hash of the four input files that
                  changes when any of them changes and does not change when any other file of the data
                  folder changes, and a SHA-256 hash of the features of all prepared rows that changes
                  when the features of a row change even though its label does not.
                justification: |
                  The model records which inputs it was trained from. A hash of exactly the inputs that
                  can change the model, and one of the features those inputs produce under the current
                  tokenizer and tagger, let the check find a stale model whichever of the data or the
                  analysis changed, without flagging an unrelated edit of a documentation file.
                tests:
                  - TrainingCorpus_DataSha256_ChangesWithTrainingInputOnly
                  - TrainingCorpus_FeaturesSha256_ChangesWithTheFeaturesOfARow
