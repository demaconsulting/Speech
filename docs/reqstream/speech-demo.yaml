---
# Software System Requirements for SpeechDemo
#
# These requirements describe the externally visible behavior of the demo application
# from the perspective of a person running it, without specifying implementation details.
# SpeechDemo is a sibling system to Speech: it consumes the Speech library's public API
# and demonstrates it, but ships and is versioned as part of this repository.

sections:
  - title: SpeechDemo Requirements
    requirements:
      - id: SpeechDemo-Shell-CapabilityNavigation
        title: >-
          The demo application shall present each demonstrated library capability as a
          separately selectable, titled panel.
        tags: [system]
        justification: |
          The demo application design requires a single application that
          exercises the library's capabilities. Grouping each capability into its own named
          panel lets a user find the capability they want to try, and lets further capabilities
          be added without redesigning the application shell.
        children:
          - SpeechDemo-Shell-PanelCatalog
          - SpeechDemo-Shell-DefaultPanel
          - SpeechDemo-Shell-PanelTitles
          - SpeechDemo-Shell-PanelEntryTitles
          - SpeechDemo-Shell-PanelHosting
          - SpeechDemo-Shell-SelectionNotification
          - SpeechDemo-Shell-WindowTitle
          - SpeechDemo-Shell-PanelContent
          - SpeechDemo-Shell-PanelTitleRequired
          - SpeechDemo-Shell-PanelContentRequired
          - SpeechDemo-Shell-SelectionNoNotificationWhenUnchanged
        tests:
          - SpeechDemo_SystemIntegration_RealLibraryEntryPoints_ComposesWorkingShell

      - id: SpeechDemo-Shell-LibraryComposition
        title: >-
          The demo application shall compose itself over the library's real public entry
          points without ever throwing at start-up.
        tags: [system]
        justification: |
          The demo's primary evidence value is that the library is genuinely consumable by a
          real application. A start-up crash on a machine with no audio backend or no installed
          model would contradict the library's own "nothing throws at composition" guarantee,
          so the demo must survive every ordinary machine state.
        children:
          - SpeechDemo-Shell-CompositionRoot
          - SpeechDemo-Shell-EmptyEnvironmentComposition
          - SpeechDemo-App-ShellComposition
          - SpeechDemo-App-AvaloniaApplication
          - SpeechDemo-App-ShutdownContainment
          - SpeechDemo-Program-AvaloniaApp
        tests:
          - SpeechDemo_SystemIntegration_RefreshAllPanels_NeverThrows

      - id: SpeechDemo-Shell-LaunchOptions
        title: >-
          The demo application shall accept a launch-time option that relocates the model
          store.
        tags: [system]
        justification: |
          A developer starting the demo from a shell or script needs a discoverable, scriptable
          way to point it at a different model store, matching the option speech-cli already
          offers.
        children:
          - SpeechDemo-LaunchOptions-Parsing
          - SpeechDemo-LaunchOptions-StoreFolder
          - SpeechDemo-LaunchOptions-StoreFolderDefault
        tests:
          - SpeechDemo_SystemIntegration_LaunchOptions_RelocateModelStore

      - id: SpeechDemo-Shell-LaunchOptionRejection
        title: >-
          The demo application shall reject an unrecognized or incomplete launch-time option
          with an explained error.
        tags: [system]
        justification: |
          Failing fast on a mistyped option prevents a user believing a setting is in effect
          when it is not.
        children:
          - SpeechDemo-LaunchOptions-HelpRequest
          - SpeechDemo-LaunchOptions-RejectUnrecognized
          - SpeechDemo-LaunchOptions-RejectMissingValue
          - SpeechDemo-LaunchOptions-RejectNullArguments
          - SpeechDemo-LaunchOptions-RejectNullEnvironmentReader
          - SpeechDemo-Program-FailFast
          - SpeechDemo-Program-HelpRequest
        tests:
          - SpeechDemo_SystemIntegration_LaunchOptions_RejectBadOptionsWithExplanation

      - id: SpeechDemo-Devices-Selection
        title: >-
          The demo application shall let a user see the available audio capture and playback
          devices and choose which one to use.
        tags: [system]
        justification: |
          Choosing a microphone and a speaker is the first thing a user of a speech application
          must do, and it is the demonstrable proof that the library's device enumeration and
          name-based selection contracts are usable from a host application.
        children:
          - SpeechDemo-Devices-Enumeration
          - SpeechDemo-Devices-DefaultSelection
          - SpeechDemo-Devices-NameBasedSelection
          - SpeechDemo-Devices-Refresh
          - SpeechDemo-Devices-LibraryProbeDelegation
          - SpeechDemo-DeviceSelection-PanelListsLibraryDevices
          - SpeechDemo-DeviceSelection-PanelPreselectsFirstDevice
          - SpeechDemo-DeviceSelection-RefreshKeepsSelection
          - SpeechDemo-Devices-LibraryPlaybackProbeDelegation
          - SpeechDemo-DeviceSelection-RefreshReachesLibrary
          - SpeechDemo-Devices-ServiceRequired
          - SpeechDemo-Devices-FactoryRequired
          - SpeechDemo-Devices-EnumerationCount
          - SpeechDemo-Devices-ConstructionWithoutRefresh
          - SpeechDemo-Devices-SelectionNotification
          - SpeechDemo-Devices-EmptyProbeResult
          - SpeechDemo-Devices-ProbeResultsNotCached
          - SpeechDemo-Devices-ServiceRefreshDelegation
          - SpeechDemo-Devices-CaptureDeviceCreation
          - SpeechDemo-Devices-PlaybackDeviceCreation
        tests:
          - SpeechDemo_SystemIntegration_RealAudioBackend_DeviceEnumerationNeverThrows

      - id: SpeechDemo-Devices-HonestEmptyState
        title: >-
          The demo application shall explain, rather than silently show nothing, when the
          machine reports no audio devices.
        tags: [system]
        justification: |
          The library degrades to honest unavailable probes when the audio backend cannot
          initialize. An empty picker with no explanation reads to a user as a broken
          application, so the demo must say what happened and remain usable.
        children:
          - SpeechDemo-Devices-EmptyStateExplanation
          - SpeechDemo-Devices-EmptyStateAfterRefresh
          - SpeechDemo-Devices-EmptyStateAfterRefreshExplained
          - SpeechDemo-Devices-EmptySelectionFallback
          - SpeechDemo-DeviceSelection-EmptyPanelExplained
        tests:
          - SpeechDemo_SystemIntegration_UnavailableAudioBackend_DevicePanelExplainsAbsence

      - id: SpeechDemo-Models-CatalogBrowsing
        title: >-
          The demo application shall list the speech models the library knows about together
          with each model's current installation state.
        tags: [system]
        justification: |
          Before a user can try recognition or synthesis they must know which models exist and
          which are installed. This panel is also the demonstrable proof that a host can build
          a complete model-management page against the library's generic catalog contract
          alone, with no knowledge of any specific model.
        children:
          - SpeechDemo-Models-Enumeration
          - SpeechDemo-ModelCatalog-PanelRefresh
          - SpeechDemo-Models-InitialSelection
          - SpeechDemo-Models-RefreshDropsUnknownModel
          - SpeechDemo-Models-RowDescriptorRequired
          - SpeechDemo-Models-StateChangeAnnouncement
          - SpeechDemo-Models-StatePresentation
          - SpeechDemo-Models-Refresh
          - SpeechDemo-Models-RefreshBlockedDuringTransfer          - SpeechDemo-Models-LibraryCatalogDelegation
          - SpeechDemo-ModelCatalog-PanelOperation
          - SpeechDemo-Models-LibraryDownloadDelegation
          - SpeechDemo-Models-CatalogSeamRequired
          - SpeechDemo-Models-PanelSeamRequired
        tests:
          - SpeechDemo_SystemIntegration_RefreshAllPanels_NeverThrows

      - id: SpeechDemo-Models-Download
        title: >-
          The demo application shall let a user download a listed model and shall show it as
          installed once the download succeeds.
        tags: [system]
        justification: |
          Downloading is the only way a user obtains a model, so the list must reflect a
          successful download as an installed model.

          This requirement is verified against a controlled catalog service rather than a real
          multi-hundred-megabyte download, since automated tests must not depend on network
          access.
        children:
          - SpeechDemo-Models-DownloadGuardInstalled
          - SpeechDemo-Models-DownloadGuardInFlight
          - SpeechDemo-Models-DownloadAvailability
          - SpeechDemo-Models-InstallNotification
          - SpeechDemo-ModelCatalog-ModelDownload
          - SpeechDemo-Models-DownloadInstalled
          - SpeechDemo-Models-DownloadNoSelection
        tests:
          - SpeechDemo_SystemIntegration_DownloadListedModel_ShowsInstalledOutcome

      - id: SpeechDemo-Models-DownloadProgressReporting
        title: >-
          The demo application shall report a running download's progress on the downloading
          model's row.
        tags: [system]
        justification: |
          A model download can be hundreds of megabytes, so a user needs to see that it is
          running and how far it has progressed rather than an unchanging list.
        children:
          - SpeechDemo-Models-DownloadProgress
          - SpeechDemo-Models-DownloadInFlightState
          - SpeechDemo-Models-ProgressVisibility
        tests:
          - SpeechDemo_SystemIntegration_DownloadListedModel_ReportsProgress

      - id: SpeechDemo-Models-DownloadFailureReporting
        title: >-
          The demo application shall explain a failed or checksum-mismatched model download
          on that model's row rather than crashing or silently doing nothing.
        tags: [system]
        justification: |
          The library treats a failed or checksum-mismatched download as an ordinary outcome
          rather than an exception, so the demo must surface honest failure in the list.
        children:
          - SpeechDemo-Models-DownloadOutcomes
          - SpeechDemo-Models-LibraryUnknownModelError
          - SpeechDemo-Models-FailureMessageVisibility
          - SpeechDemo-Models-NoInstallNotificationOnFailure
          - SpeechDemo-Models-DownloadTransportFailure
          - SpeechDemo-Models-DownloadFaultContained
          - SpeechDemo-Models-DownloadCanceled
        tests:
          - SpeechDemo_SystemIntegration_DownloadListedModel_FailureIsReported

      - id: SpeechDemo-Models-FailedDownloadRetry
        title: >-
          The demo application shall let a user retry a failed model download and shall clear
          the earlier failure explanation when the retry succeeds.
        tags: [system]
        justification: |
          A transient network failure should not leave a user stuck with a model they cannot
          obtain, nor with a stale error beside a model that is now installed.
        children:
          - SpeechDemo-Models-DownloadRetry
        tests:
          - SpeechDemo_SystemIntegration_DownloadListedModel_FailedDownloadIsRetryable

      - id: SpeechDemo-Models-RealCatalogReporting
        title: >-
          The demo application shall list every recognition and synthesis model the shipped
          model packages provide.
        tags: [system]
        justification: |
          The demo's composition root registers the sibling packages' production models into
          its SpeechModelCatalog - core DemaConsulting.Speech ships zero built-in models - so
          the demo's catalog panel must surface those real models.
        tests:
          - SpeechDemo_SystemIntegration_RealModelCatalog_ReportsKnownModels

      - id: SpeechDemo-Models-EmptyCatalogReporting
        title: >-
          The demo application shall explain an empty catalog, rather than silently show
          nothing, when a caller-supplied catalog has no models.
        tags: [system]
        justification: |
          A caller-supplied catalog can genuinely have no models; an unexplained blank list
          reads to a user as a broken application.
        children:
          - SpeechDemo-Models-EmptyCatalogExplanation
        tests:
          - SpeechDemo_SystemIntegration_EmptyCatalog_ModelPanelExplainsEmptiness

      - id: SpeechDemo-Models-MirrorRedirection
        title: >-
          The demo application shall let a user redirect every subsequent model download to an
          internal mirror named in launch-time arguments.
        tags: [system]
        justification: |
          A user whose network policy blocks a model's public download host (for example
          huggingface.co) needs a way to redirect downloads to an internal mirror, matching the
          capability SpeechCli already offers via its own --mirror-* global options. A launch
          option covers a scripted/CI launch.
        children:
          - SpeechDemo-LaunchOptions-MirrorConfiguration
          - SpeechDemo-LaunchOptions-NoMirror
          - SpeechDemo-LaunchOptions-MirrorRejection
          - SpeechDemo-LaunchOptions-MirrorUrlEnvironment
          - SpeechDemo-LaunchOptions-MirrorUrlOptionPrecedence
          - SpeechDemo-LaunchOptions-MirrorBasicCredentialsEnvironment
          - SpeechDemo-LaunchOptions-MirrorBearerTokenEnvironment
          - SpeechDemo-LaunchOptions-MirrorCredentialOptionPrecedence
          - SpeechDemo-LaunchOptions-MirrorEnvironmentEmptyIgnored
          - SpeechDemo-LaunchOptions-MirrorEnvironmentCredentialRequiresUrl
          - SpeechDemo-LaunchOptions-MirrorSecretsNotInErrors
          - SpeechDemo-LaunchOptions-MirrorEnvironmentHelp
          - SpeechDemo-MirrorOptions-Validation
          - SpeechDemo-MirrorOptions-BlankUrlNoMirror
          - SpeechDemo-MirrorOptions-CredentialWithoutUrl
          - SpeechDemo-MirrorOptions-HalfCredentialPair
          - SpeechDemo-MirrorOptions-InvalidUrl
          - SpeechDemo-MirrorOptions-InsecureCredentialRejected
          - SpeechDemo-Models-MirrorSettingsPrePopulation
        tests:
          - SpeechDemo_SystemIntegration_MirrorRedirection_AppliesAtLaunch

      - id: SpeechDemo-Models-MirrorRuntimeRedirection
        title: >-
          The demo application shall let a user redirect every subsequent model download to an
          internal mirror while the application is running, through the model catalog panel's
          mirror-settings fields, without a restart.
        tags: [system]
        justification: |
          Interactive use needs the same mirror redirection as a scripted launch without
          requiring the application to be restarted.
        children:
          - SpeechDemo-Models-MirrorRebuild
          - SpeechDemo-Models-MirrorRequiresFactory
          - SpeechDemo-Models-CatalogFactoryRequired
          - SpeechDemo-Models-MirrorCatalogOwnership
          - SpeechDemo-Models-MirrorSettingsUi
          - SpeechDemo-Models-MirrorSettingsBearerToken
          - SpeechDemo-Models-MirrorSettingsReloadsRows
          - SpeechDemo-Models-MirrorSettingsFaultContained
          - SpeechDemo-Models-MirrorBlockedDuringDownload
          - SpeechDemo-Models-MirrorDisposesCurrentCatalog
          - SpeechDemo-Models-ExternalCatalogNotDisposed
          - SpeechDemo-Models-MirrorSettingsInvalidReported
          - SpeechDemo-Models-MirrorSettingsRejectedReported
          - SpeechDemo-ModelCatalog-MirrorRedirection
          - SpeechDemo-ModelCatalog-MirrorApplyConfirmation
        tests:
          - SpeechDemo_SystemIntegration_MirrorRedirection_AppliesWhileRunning

      - id: SpeechDemo-Models-MirrorRevert
        title: >-
          The demo application shall let a user revert every subsequent model download to each
          model's own public URI by clearing the mirror while the application is running.
        tags: [system]
        justification: |
          A user who no longer needs a mirror must be able to return to each model's own
          public download location without restarting the application.
        children:
          - SpeechDemo-Models-MirrorSettingsBlankRevert
        tests:
          - SpeechDemo_SystemIntegration_MirrorRedirection_ClearingMirrorRevertsToPublicUris

      - id: SpeechDemo-Voices-ReferenceVoicePacks
        title: >-
          The demo application shall let a user install and remove the optional reference
          voice pack from the model catalog panel.
        tags: [system]
        justification: |
          Chatterbox Turbo clones a voice from a short reference recording. Without a voice
          the model has nothing to imitate, so the demo must make voices installable and
          removable from the same place models are managed. SpeechCli offers the same
          capability through its own voices commands.
        children:
          - SpeechDemo-Voices-PackService
          - SpeechDemo-Voices-UserVoicesFolder
          - SpeechDemo-Voices-PackPanel
          - SpeechDemo-Voices-PackUserFolderShown
          - SpeechDemo-Voices-PackBlockedDuringDownload
          - SpeechDemo-Voices-PackRemoveBlockedDuringDownload
          - SpeechDemo-Voices-DownloadBlockedDuringPackInstall
          - SpeechDemo-Voices-MirrorBlockedDuringPackInstall
          - SpeechDemo-Voices-PackBlockedDuringPackInstall
          - SpeechDemo-Voices-PackInitialEmotionLoadContained
          - SpeechDemo-Voices-PackRowPresentation
          - SpeechDemo-Voices-PackRowRequiresPack
          - SpeechDemo-Voices-PackEmotionOption
          - SpeechDemo-Voices-PackNoEmotionOption
          - SpeechDemo-ModelCatalog-VoicePackChangeRebuild
          - SpeechDemo-ModelCatalog-VoicePackChangeNotification
          - SpeechDemo-ModelCatalog-VoicePackRemovedRebuild
          - SpeechDemo-ModelCatalog-VoicePackRemovedNotification
          - SpeechDemo-ModelCatalog-VoicePackMirrorChangedRebuild
          - SpeechDemo-ModelCatalog-VoicePackMirrorChangedNotification
          - SpeechDemo-Voices-PackServiceCompositionRequired
          - SpeechDemo-Voices-PackServiceNoLibrary
          - SpeechDemo-Voices-PackServiceNoLibraryRefusal
          - SpeechDemo-Voices-PackServiceNoLibraryEmotionsRefusal
          - SpeechDemo-Voices-PackServiceNoLibraryUninstallRefusal
          - SpeechDemo-Voices-PackUninstallRebuild
          - SpeechDemo-Voices-PackUninstallAnnounce
          - SpeechDemo-Voices-PackInstallRebuild
          - SpeechDemo-Voices-PackInstallFailureAnnounce
          - SpeechDemo-Voices-PackInstallCanceledRebuild
          - SpeechDemo-Voices-PackInstallCanceledAnnounce
          - SpeechDemo-Voices-PackMirrorRebuild
          - SpeechDemo-Voices-PackMirrorAnnounce
          - SpeechDemo-Voices-PackUninstallWaitsForInstall
          - SpeechDemo-Voices-PackUninstallDefersRebuild
          - SpeechDemo-Voices-PackSectionHidden
          - SpeechDemo-Voices-PackInstalledEmotionsShown
          - SpeechDemo-Voices-PackInstall
          - SpeechDemo-Voices-PackInstallRowRefresh
          - SpeechDemo-Voices-PackEmotionChoiceForwarded
          - SpeechDemo-Voices-PackAddEmotionsIncluded
          - SpeechDemo-Voices-PackInstallFailureReported
          - SpeechDemo-Voices-PackInstallRollbackKeepsPack
          - SpeechDemo-Voices-PackInstallStateReadFallback
          - SpeechDemo-Voices-PackRemove
          - SpeechDemo-Voices-PackRemoveFaultReported
          - SpeechDemo-Voices-PackRemoveStoreErrorReported
          - SpeechDemo-Voices-PackRemoveCanceledReported
          - SpeechDemo-Voices-PackRowStatus
          - SpeechDemo-Voices-PackRowActionAvailability
          - SpeechDemo-Voices-PackRowChangeAnnouncement
          - SpeechDemo-Voices-PackRowFailureAnnouncement
          - SpeechDemo-Voices-PackRowEmotionsAnnouncement
          - SpeechDemo-Voices-PackEmotionSizeDisplay
          - SpeechDemo-Voices-PackAddEmotions
          - SpeechDemo-ModelCatalog-VoicePackRollbackStaysRemovable
          - SpeechDemo-ModelCatalog-VoicePackRemovalWaitsForInstall
          - SpeechDemo-ModelCatalog-VoicePackRemovalFailureExplained
        tests:
          - SpeechDemo_SystemIntegration_ReferenceVoicePack_InstallAndRemoveFromCatalogPanel

      - id: SpeechDemo-Voices-VoiceChoice
        title: >-
          The demo application shall offer the voices of a newly installed reference voice
          pack for Chatterbox Turbo synthesis immediately, keeping the voice the user already
          chose.
        tags: [system]
        justification: |
          Without a voice the model has nothing to imitate, so installing or removing a pack
          must refresh the voice choice at once without discarding what the user selected.
        children:
          - SpeechDemo-Voices-SynthesisRefresh
          - SpeechDemo-Voices-SynthesisVoiceChoiceKept
          - SpeechDemo-Voices-SynthesisRefreshAfterDispose
          - SpeechDemo-SynthesisPanel-ReferenceVoiceChangeHandling
          - SpeechDemo-Settings-RestoreValues
        tests:
          - SpeechDemo_SystemIntegration_ReferenceVoicePack_InstalledVoicesOfferedAndChoiceKept

      - id: SpeechDemo-Voices-OwnVoicesFolder
        title: >-
          The demo application shall let a user add their own reference voices from a folder
          given at launch with --voices-dir.
        tags: [system]
        justification: |
          A user with their own recordings needs a way to use them without installing the
          pack. SpeechCli offers the same capability through its --voices-dir option.
        children:
          - SpeechDemo-LaunchOptions-VoicesDir
          - SpeechDemo-LaunchOptions-VoicesDirHelp
          - SpeechDemo-LaunchOptions-VoicesDirValueRequired
          - SpeechDemo-LaunchOptions-VoicesDirMustExist
        tests:
          - SpeechDemo_SystemIntegration_LaunchOptions_VoicesDirOptionRecordsVoicesFolder

      - id: SpeechDemo-Voices-ConsentNote
        title: >-
          The demo application shall show the voice-cloning consent note in the model catalog
          panel where reference voice packs are managed.
        tags: [system]
        justification: |
          Cloning a real person's voice raises consent questions, so the note must be visible
          where a user chooses to install voices.
        children:
          - SpeechDemo-Voices-PackConsentNoteShown
        tests:
          - SpeechDemo_SystemIntegration_ReferenceVoicePack_CatalogPanelShowsConsentNote

      - id: SpeechDemo-Voices-SynthesisConsentNote
        title: >-
          The demo application shall show the voice-cloning consent note in the synthesis
          panel when the Chatterbox Turbo model is selected.
        tags: [system]
        justification: |
          Consent must be stated where the voice is chosen and used, not only where it is
          installed.
        children:
          - SpeechDemo-Voices-ConsentAndAttribution
          - SpeechDemo-Voices-NoNoticeForOtherModels
        tests:
          - SpeechDemo_SystemIntegration_ChatterboxSelected_ShowsConsentNote

      - id: SpeechDemo-Voices-SynthesisAttribution
        title: >-
          The demo application shall show the license attribution of the installed reference
          voice pack in the synthesis panel when the Chatterbox Turbo model is selected.
        tags: [system]
        justification: |
          The pack's license requires attribution where its voices are used.
        children:
          - SpeechDemo-Voices-ConsentAndAttribution
        tests:
          - SpeechDemo_SystemIntegration_ChatterboxSelected_ShowsPackAttribution

      - id: SpeechDemo-Settings-PerModelParameters
        title: >-
          The demo application shall let a user view and adjust a selected installed model's
          declared tunable parameters, using a generic control appropriate to each parameter's
          kind.
        tags: [system]
        justification: |
          The design calls for generic controls over a model's declared parameters -
          slider/numeric-updown for a numeric parameter, dropdown/radio for a choice parameter,
          checkbox/toggle for a boolean parameter - so that a new model with its own parameter
          set works with this panel unmodified. This panel is the demonstrable proof that a host
          can build such a page against the library's generic parameter contract alone.
        children:
          - SpeechDemo-Settings-GenericParameterRendering
          - SpeechDemo-Settings-ValueBag
          - SpeechDemo-Settings-ParameterConstructionGuards
          - SpeechDemo-Settings-NumericPresenter-DefaultInitialization
          - SpeechDemo-Settings-NumericPresenter-Clamping
          - SpeechDemo-Settings-NumericPresenter-IntegerRounding
          - SpeechDemo-Settings-NumericPresenter-ControlSelection
          - SpeechDemo-Settings-ChoicePresenter
          - SpeechDemo-Settings-RestoreIgnoresWrongTypedValues
          - SpeechDemo-Settings-ChoicePresenterDefaultSelection
          - SpeechDemo-Settings-ChoicePresenterSelectionNotification
          - SpeechDemo-Settings-BooleanPresenter
          - SpeechDemo-Settings-ModelSwitch
          - SpeechDemo-Settings-NumericPresenter-ContinuousPrecision
          - SpeechDemo-Settings-ChoicePresenterSelection
          - SpeechDemo-Settings-BooleanPresenterToggle
          - SpeechDemo-Settings-UnrecognizedParameterSkipped
          - SpeechDemo-Settings-ValueBagEmptyWithoutModel
          - SpeechDemo-Settings-ValueBagDuplicateIds
          - SpeechDemo-Settings-RestoreIgnoresStaleValues
        tests:
          - SpeechDemo_SystemIntegration_ModelParameters_RenderedAndForwardedToSynthesis

      - id: SpeechDemo-Settings-EmptyStateExplanation
        title: >-
          The demo application shall explain, rather than silently show nothing, when no model
          is selected.
        tags: [system]
        justification: |
          Consistent with the honest-empty-state precedent this demo already established for an
          empty known-model registry, an unexplained blank settings panel reads to a user as a
          broken application rather than an expected state.
        children:
          - SpeechDemo-Settings-HonestEmptyState
          - SpeechDemo-Settings-EmptyStateAfterModelCleared
          - SpeechDemo-Settings-EmptyStateNotifications
        tests:
          - SpeechDemo_SystemIntegration_RealCatalog_TtsAndSttPanelsReportEmptyStateHonestly

      - id: SpeechDemo-Settings-NoParametersExplanation
        title: >-
          The demo application shall explain, rather than silently show nothing, when the
          selected model declares no tunable parameters.
        tags: [system]
        justification: |
          A model with nothing to tune is an ordinary state; a blank settings panel beside it
          reads to a user as a broken application.
        children:
          - SpeechDemo-Settings-NoParametersExplained
        tests:
          - SpeechDemo_SystemIntegration_ModelWithoutParameters_SettingsPanelExplainsNoParameters

      - id: SpeechDemo-Synthesis-TextToSpeech
        title: >-
          The demo application shall let a user enter text - optionally containing inline
          Natural Language Audio Tags - and speak it through the selected playback device using
          a chosen installed synthesis model.
        tags: [system]
        justification: |
          Text-to-speech is one of the two capabilities this demo exists to prove is usable from
          a real host application.
        children:
          - SpeechDemo-Synthesis-ModelSelection
          - SpeechDemo-Synthesis-PlayLifecycle
          - SpeechDemo-Synthesis-SessionSeam
          - SpeechDemo-Synthesis-EngineSessionReuse
          - SpeechDemo-Synthesis-SessionReuse
          - SpeechDemo-Synthesis-VoiceSelectionForwarding
          - SpeechDemo-Synthesis-AutoRefreshOnInstall
          - SpeechDemo-Synthesis-ResourceLifetime
          - SpeechDemo-Synthesis-EngineLifetime
          - SpeechDemo-Synthesis-ModelSwitchGuard
          - SpeechDemo-Synthesis-DisposeIdempotent
          - SpeechDemo-Synthesis-ModelSwitchAllowedAfterError
          - SpeechDemo-Synthesis-IdleDeviceRefreshInert
          - SpeechDemo-Synthesis-SessionSeamModelValidation
          - SpeechDemo-SynthesisPanel-PlaybackThroughSeams
          - SpeechDemo-SynthesisPanel-LifecycleThroughSeams
          - SpeechDemo-SynthesisPanel-ExternalChangeHandling
          - SpeechDemo-SynthesisPanel-DeviceRefreshCoordination
          - SpeechDemo-Synthesis-DependencyValidation
          - SpeechDemo-Synthesis-SelectionPreservation
          - SpeechDemo-Synthesis-PlayWhileBusyRefused
          - SpeechDemo-Synthesis-EngineReloadOnChange
          - SpeechDemo-Synthesis-SessionRecreateOnDeviceChange
          - SpeechDemo-Synthesis-SessionSeamParameterBag
          - SpeechDemo-Synthesis-SessionSeamArgumentValidation
          - SpeechDemo-Synthesis-AutoRefreshRoleFilter
          - SpeechDemo-Synthesis-DisposeStopsPlayback
          - SpeechDemo-Synthesis-DisposeUnsubscribes
          - SpeechDemo-Synthesis-StopsBeforeDeviceRefresh
          - SpeechDemo-Synthesis-EmbeddedSettings
        tests:
          - SpeechDemo_SystemIntegration_TextToSpeech_SpeaksEnteredText

      - id: SpeechDemo-Synthesis-PlaybackStatus
        title: >-
          The demo application shall report the speech lifecycle - synthesizing, then playing,
          then idle - to the user while text is spoken.
        tags: [system]
        justification: |
          Reporting each lifecycle transition turns the library's synthesis contract into a
          usable demonstration rather than an opaque one-shot call.
        children:
          - SpeechDemo-Synthesis-LifecycleReporting
          - SpeechDemo-Synthesis-SessionStateMapping
        tests:
          - SpeechDemo_SystemIntegration_TextToSpeech_ReportsLifecycleStatus

      - id: SpeechDemo-Synthesis-StopPlayback
        title: >-
          The demo application shall let a user stop speech that is in progress and shall say
          that it was stopped.
        tags: [system]
        justification: |
          A long or mistaken utterance must be interruptible, and the panel must confirm the
          interruption rather than silently going quiet.
        children:
          - SpeechDemo-Synthesis-StopControl
          - SpeechDemo-SynthesisPanel-StopPlayback
        tests:
          - SpeechDemo_SystemIntegration_TextToSpeech_StopEndsUtteranceWithExplanation

      - id: SpeechDemo-Synthesis-AudioTagExamples
        title: >-
          The demo application shall show example Natural Language Audio Tags beside the text
          input.
        tags: [system]
        justification: |
          The tag vocabulary is closed and published by the library; showing examples lets a
          user discover what can be written without reading documentation.
        children:
          - SpeechDemo-Synthesis-AudioTagHints
        tests:
          - SpeechDemo_SystemIntegration_TextToSpeech_ShowsExampleAudioTags

      - id: SpeechDemo-Synthesis-UnavailableExplanation
        title: >-
          The demo application shall report an honest, explanatory outcome, rather than a crash,
          when no synthesis model is installed.
        tags: [system]
        justification: |
          A developer evaluating the library frequently runs the demo before downloading any
          model; the synthesis panel must say so plainly rather than fail silently or crash
          the application.
        children:
          - SpeechDemo-Synthesis-HonestEmptyCatalogState
          - SpeechDemo-Synthesis-NoModelSelectedState
        tests:
          - SpeechDemo_SystemIntegration_RealCatalog_TtsAndSttPanelsReportEmptyStateHonestly

      - id: SpeechDemo-Synthesis-NoPlaybackDeviceExplanation
        title: >-
          The demo application shall report an honest, explanatory outcome, rather than a crash,
          when no playback device is available and the user asks to speak text.
        tags: [system]
        justification: |
          A developer evaluating the library frequently runs the demo before connecting a
          speaker; the synthesis panel must say so plainly rather than fail silently.
        children:
          - SpeechDemo-Synthesis-NoPlaybackDeviceState
          - SpeechDemo-SynthesisPanel-UnavailableDeviceReporting
        tests:
          - SpeechDemo_SystemIntegration_TextToSpeech_NoPlaybackDeviceIsExplained

      - id: SpeechDemo-Synthesis-EngineFailureExplanation
        title: >-
          The demo application shall report an honest, explanatory outcome, rather than a crash,
          when the selected model's synthesizer engine is unavailable on the machine.
        tags: [system]
        justification: |
          An installed model can still be unusable on a machine, for example when its runtime
          is missing; the panel must say so plainly rather than crash.
        children:
          - SpeechDemo-Synthesis-HonestUnavailableStates
          - SpeechDemo-Synthesis-UnavailableEngineReleased
          - SpeechDemo-Synthesis-UnavailableSessionReleased
          - SpeechDemo-Synthesis-EngineBusyState
          - SpeechDemo-Synthesis-SessionFaultRecovery
          - SpeechDemo-Synthesis-SessionFaultReported
        tests:
          - SpeechDemo_SystemIntegration_TextToSpeech_UnavailableEngineIsExplained

      - id: SpeechDemo-Recognition-SpeechToText
        title: >-
          The demo application shall let a user start a live streaming transcription session
          through the selected capture device using a chosen installed recognition model.
        tags: [system]
        justification: |
          Speech-to-text is the other capability this demo exists to prove is usable from a real
          host application.
        children:
          - SpeechDemo-Recognition-ModelSelection
          - SpeechDemo-Recognition-StartStopLifecycle
          - SpeechDemo-Recognition-ResourceLifetime
          - SpeechDemo-Recognition-EngineLifetime
          - SpeechDemo-Recognition-SessionSeam
          - SpeechDemo-Recognition-AutoRefreshOnInstall
          - SpeechDemo-Recognition-ModelSwitchGuard
          - SpeechDemo-Recognition-ModelSelectionFallback
          - SpeechDemo-Recognition-FailedStartReleasesSession
          - SpeechDemo-Recognition-DisposeIdempotent
          - SpeechDemo-Recognition-ModelSwitchAllowedAfterError
          - SpeechDemo-Recognition-SessionSeamModelValidation
          - SpeechDemo-Recognition-StopsBeforeDeviceRefresh
          - SpeechDemo-Recognition-IdleDeviceRefreshInert
          - SpeechDemo-Recognition-PanelDependenciesRequired
          - SpeechDemo-Recognition-ModelSelectionPreserved
          - SpeechDemo-Recognition-AutoRefreshIgnoresOtherRoles
          - SpeechDemo-Recognition-AutoRefreshStopsAfterDispose
          - SpeechDemo-Recognition-EngineReuse
          - SpeechDemo-Recognition-ModelChangeInvalidatesEngine
          - SpeechDemo-Recognition-ModelChangeWhileListeningStopsFirst
          - SpeechDemo-Recognition-DeviceChangeInvalidatesSession
          - SpeechDemo-Recognition-DeviceChangeWhileListeningStopsFirst
          - SpeechDemo-Recognition-DeviceRefreshInvalidatesSession
          - SpeechDemo-Recognition-FailedAttemptReleasesResources
          - SpeechDemo-Recognition-SessionSeamWrongRole
          - SpeechDemo-Recognition-SessionSeamArgumentValidation
        tests:
          - SpeechDemo_SystemIntegration_SpeechToText_StartsStreaming

      - id: SpeechDemo-Recognition-PartialTranscript
        title: >-
          The demo application shall show each provisional transcript result as it streams,
          replacing the previous provisional text.
        tags: [system]
        justification: |
          Rendering the progressive partial result is what proves the library's streaming
          recognition contract is genuinely usable from a UI thread.
        children:
          - SpeechDemo-Recognition-TranscriptSequencing
        tests:
          - SpeechDemo_SystemIntegration_SpeechToText_ShowsPartialResult

      - id: SpeechDemo-Recognition-FinalTranscript
        title: >-
          The demo application shall commit each final transcript result as a finished line
          and clear the provisional text.
        tags: [system]
        justification: |
          A committed final line is the durable outcome of recognition; it must stay visible
          once the provisional text it replaces is gone.
        children:
          - SpeechDemo-Recognition-TranscriptFinalCommit
          - SpeechDemo-Recognition-TranscriptText
          - SpeechDemo-Recognition-TranscriptResetOnStart
        tests:
          - SpeechDemo_SystemIntegration_SpeechToText_CommitsFinalResult

      - id: SpeechDemo-Recognition-StopListening
        title: >-
          The demo application shall let a user stop a live transcription session and return to
          the idle state.
        tags: [system]
        justification: |
          A user must be able to end listening, releasing the capture device for other uses.
        children:
          - SpeechDemo-Recognition-StopSession
          - SpeechDemo-Recognition-StopLifecycle
          - SpeechDemo-Recognition-StopIdleSafe
          - SpeechDemo-Recognition-ConcurrentStopSafe
        tests:
          - SpeechDemo_SystemIntegration_SpeechToText_StopEndsSession

      - id: SpeechDemo-Recognition-UnavailableExplanation
        title: >-
          The demo application shall report an honest, explanatory outcome, rather than a crash,
          when no recognition model is installed.
        tags: [system]
        justification: |
          A developer evaluating the library frequently runs the demo before downloading any
          model; the recognition panel must say so plainly rather than fail silently or crash
          the application.
        children:
          - SpeechDemo-Recognition-HonestEmptyCatalogState
          - SpeechDemo-Recognition-NoModelSelectedReported
        tests:
          - SpeechDemo_SystemIntegration_RealCatalog_TtsAndSttPanelsReportEmptyStateHonestly

      - id: SpeechDemo-Recognition-NoCaptureDeviceExplanation
        title: >-
          The demo application shall report an honest, explanatory outcome, rather than a crash,
          when no capture device is available and the user starts listening.
        tags: [system]
        justification: |
          A developer evaluating the library frequently runs the demo before connecting a
          microphone; the recognition panel must say so plainly rather than fail silently.
        children:
          - SpeechDemo-Recognition-NoCaptureDeviceReported
        tests:
          - SpeechDemo_SystemIntegration_SpeechToText_NoCaptureDeviceIsExplained

      - id: SpeechDemo-Recognition-EngineFailureExplanation
        title: >-
          The demo application shall report an honest, explanatory outcome, rather than a crash,
          when the selected model's recognizer engine is unavailable on the machine.
        tags: [system]
        justification: |
          An installed model can still be unusable on a machine, for example when its runtime
          is missing; the panel must say so plainly rather than crash.
        children:
          - SpeechDemo-Recognition-HonestUnavailableStates
          - SpeechDemo-Recognition-SessionSeamUnavailableEngine
          - SpeechDemo-Recognition-SessionStartFailureReported
          - SpeechDemo-Recognition-EngineBusyReported
          - SpeechDemo-Recognition-SessionFaultedReported
          - SpeechDemo-Recognition-ResultStreamFaultReported
        tests:
          - SpeechDemo_SystemIntegration_SpeechToText_UnavailableEngineIsExplained
