---
# Software System Requirements for Speech
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.

sections:
  - title: Speech Requirements
    requirements:
      - id: Speech-Diagnostics-StructuralSink
        title: >-
          The library shall let a host supply a diagnostics sink that receives structural
          facts about library operation.
        tags: [system]
        justification: |
          Hosts embedding offline speech capabilities need visibility into structural
          library events (for example device selection and fallback decisions) for support and
          troubleshooting, without the library ever exposing user audio or text.
        children:
          - Speech-Diagnostics-Interface
          - Speech-Diagnostics-StructuralFactsOnly
        tests:
          - Speech_SystemIntegration_DiagnosticsSink_ReceivesStructuralEvents

      - id: Speech-Diagnostics-DefaultSink
        title: >-
          The library shall provide a working default diagnostics sink when a host supplies
          none.
        tags: [system]
        justification: |
          Per this library's "nothing throws at composition" decision, a host that has not
          yet wired up its own diagnostics must still be able to compose every library
          component successfully.
        children:
          - Speech-Diagnostics-NullSink
        tests:
          - Speech_SystemIntegration_NoDiagnosticsSupplied_UsesNullSpeechDiagnosticsSafely

      - id: Speech-Audio-DeviceFactory
        title: >-
          The library shall provide a factory that composes audio capture and playback
          devices without ever throwing.
        tags: [system]
        justification: |
          Composition happens at application start-up, where a missing backend or missing
          device is an ordinary machine state, not a programming error.
        children:
          - Speech-Audio-Factory
          - Speech-Audio-FactoryNeverThrows
          - Speech-Audio-FormatValue
          - Speech-Audio-PreferredFormat
          - Speech-Audio-NameOnlyIdentity
          - Speech-Audio-SelectionFallback
          - Speech-Audio-DeviceRefresh
          - Speech-Audio-DeviceRefreshRefusal
          - Speech-Audio-MockableContracts
          - Speech-Audio-PreferredHostApiEnumeration
          - Speech-Audio-RealCaptureDevice
          - Speech-Audio-RealPlaybackDevice
          - Speech-Audio-PortAudioInterop
        tests:
          - Speech_SystemIntegration_PortAudioInitialized_FactoryReturnsRealDevices

      - id: Speech-Audio-FileBackedDevices
        title: >-
          The library shall provide a file-backed playback device implementation that lets a host
          synthesize speech to a WAV file instead of real audio hardware.
        tags: [system]
        justification: |
          A host application - not only a command-line tool - needs a deterministic,
          hardware-independent way to synthesize speech to a file, for example for its own
          automated tests or for offline batch processing.
        children:
          - Speech-Audio-FileBackedPlaybackDevice
        tests:
          - Speech_SystemIntegration_FileBackedDevices_SynthesizedSpeechRoundTripsThroughWavFile
          - WavFileAudioPlaybackDevice_WriteThenDispose_RoundTripsSamplesWithinQuantizationTolerance

      - id: Speech-Audio-FileBackedCapture
        title: >-
          The library shall provide a file-backed capture device implementation that lets a host
          recognize speech from a pre-recorded WAV file instead of real audio hardware.
        tags: [system]
        justification: |
          A host application needs a deterministic, hardware-independent way to recognize
          speech from a pre-recorded file, for example for its own automated tests or for
          offline batch processing.
        children:
          - Speech-Audio-FileBackedCaptureDevice
        tests:
          - Speech_SystemIntegration_FileBackedDevices_SynthesizedSpeechRoundTripsThroughWavFile
          - WavFileAudioCaptureDevice_Start_FixtureFile_DeliversExpectedTotalSampleCount

      - id: Speech-Audio-ManagedAudioFileDecoding
        title: >-
          The library shall read WAV and FLAC audio files into floating-point clips with managed
          code only, so reference voices and test audio can be supplied in either format.
        tags: [system]
        justification: |
          Hosts store reference clips and recordings as WAV or FLAC. Decoding them in managed
          code removes any native decoder dependency and works on every supported platform.
        children:
          - Speech-Audio-AudioFileReading
          - Speech-Audio-ClipConversion
        tests:
          - Speech_SystemIntegration_ManagedAudioFileDecoding_FlacAndWavReadIdenticallyByContent

      - id: Speech-Audio-InitializationFailureFallback
        title: >-
          The library shall degrade to honest unavailable audio devices when the PortAudio
          runtime cannot initialize.
        tags: [system]
        justification: |
          A machine missing compatible native audio support is an expected deployment state.
          The library must degrade predictably rather than failing during composition.
        children:
          - Speech-Audio-AudioDeviceFactory-PortAudioInitializationFallback
        tests:
          - Speech_SystemIntegration_PortAudioInitializationFails_FactoryReturnsUnavailableDevices

      - id: Speech-Audio-UnavailableDeviceUsage
        title: >-
          The library shall throw a documented exception when a caller attempts to use an
          audio device the library has already reported as unavailable.
        tags: [system]
        justification: |
          Exceptions are reserved for first-use failures on an object that claimed to be
          available. A caller that ignores the honest unavailable signal and invokes an
          operational member anyway has made a programming error that must surface immediately.
        children:
          - Speech-Audio-UnavailableFallbacks
          - Speech-Audio-UnavailableFallbackOperationsThrow
        tests:
          - Speech_SystemValidation_NoResolvableCaptureDevice_StartThrowsAudioDeviceUnavailableException

      - id: Speech-Models-DownloadAndInstall
        title: >-
          The library shall download speech models, verify each against its declared SHA-256
          checksum, and install them into a per-user model store.
        tags: [system]
        justification: |
          The "download integrity and progress" decision requires that models download through
          one verified path with an explicit, hash-checked descriptor, so a host never installs
          unverified content. This requirement covers the download orchestration, the model
          descriptors, and the mockable HTTP seam.
        children:
          - Speech-Models-DownloadOrchestration
          - Speech-Models-PerModelDownloadSerialization
          - Speech-Models-CrossModelDownloadConcurrency
          - Speech-Models-DownloadDescriptors
          - Speech-Models-MockableHttpSeam
        tests:
          - Speech_SystemIntegration_ModelDownload_VerifiesAndAtomicallyInstallsModel

      - id: Speech-Models-InUseModelProtection
        title: >-
          The library shall never disturb an in-use model's current installation while a
          replacement download is in progress.
        tags: [system]
        justification: |
          The download-while-in-use concern requires that an in-use model is untouched until
          a verified replacement is fully staged, then swapped in atomically.
        children:
          - Speech-Models-AtomicInstall
        tests:
          - SpeechModelStore_CompleteInstall_ExistingCurrent_ReplacesContentAndCleansUpOldDirectory
          - SpeechModelStore_CompleteInstall_FirstInstall_CreatesCurrentAndManifest

      - id: Speech-Models-CorruptDownloadRejection
        title: >-
          The library shall never install a corrupted, partial, or checksum-mismatched
          download and shall report every non-installed outcome honestly.
        tags: [system]
        justification: |
          Never installing unverified content requires that a failed download leaves nothing
          installed and tells the host why, so a host can distinguish a blocked network path,
          an HTTP error response, and a local disk failure.
        children:
          - Speech-Models-HonestFailureStates
          - Speech-Models-PriorInstallProtected
          - Speech-Models-RicherFailureClassification
        tests:
          - SpeechModelDownloader_DownloadAsync_ChecksumMismatch_ReportsChecksumMismatchAndInstallsNothing
          - SpeechModelDownloader_DownloadAsync_CanceledMidDownload_ThrowsAndInstallsNothing

      - id: Speech-Models-DownloadProgressReporting
        title: >-
          The library shall let a host observe a model download's progress through a mockable,
          IProgress-compatible payload.
        tags: [system]
        justification: |
          A host builds progress UI from the reported progress without depending on a concrete
          download implementation.
        children:
          - Speech-Models-DownloadProgress
        tests:
          - SpeechModelDownloader_DownloadAsync_ValidPayload_InstallsModelAndReportsProgress
          - SpeechModelDownloadProgress_FractionComplete_KnownTotal_ComputesFraction

      - id: Speech-Models-InstalledModelManagement
        title: >-
          The library shall let a host query whether a model is installed, cheaply and without
          throwing.
        tags: [system]
        justification: |
          A host model-settings page needs an honest, inexpensive installed/not-installed
          answer that never reports a half-installed model as installed.
        children:
          - Speech-Models-InstallStateQuery
        tests:
          - SpeechModelStore_IsInstalled_NoInstall_ReturnsFalse
          - SpeechModelStore_IsInstalled_CurrentWithoutManifest_ReturnsFalse

      - id: Speech-Models-ConfigurableStorageRoot
        title: >-
          The library shall store models under a per-user location by default and under an
          explicit host-configured path when one is supplied.
        tags: [system]
        justification: |
          Hosts differ in where they allow large per-user data, so the storage root must be
          overridable while defaulting to a sensible per-user location.
        children:
          - Speech-Models-ConfigurableRoot
        tests:
          - SpeechModelStore_Constructor_NoOptions_ResolvesUnderLocalApplicationData
          - SpeechModelStore_Constructor_RootPathOverride_UsesOverrideVerbatim

      - id: Speech-Models-ExplicitUninstall
        title: >-
          The library shall let a host explicitly uninstall an installed model.
        tags: [system]
        justification: |
          A host model-settings page must be able to reclaim the disk space of a model the
          user no longer wants.
        children:
          - Speech-Models-Uninstall
        tests:
          - SpeechModelStore_UninstallAsync_InstalledModel_RemovesCurrentAndManifest

      - id: Speech-Models-DownloadMirror
        title: >-
          The library shall let a host redirect every model download through a single,
          optionally authenticated internal HTTP(S) mirror.
        tags: [system]
        justification: |
          Enterprise hosts often cannot reach public download hosts directly, so one mirror
          setting must apply uniformly to every model without changing any model's own
          declared download descriptor.
        children:
          - Speech-Models-MirrorRedirect
        tests:
          - DownloadMirror_Constructor_NonHttpScheme_ThrowsArgumentExceptionNamingScheme
          - ReferenceVoiceLibrary_InstallPack_WithMirror_RequestsMirrorUri

      - id: Speech-Models-ReferenceVoiceLibrary
        title: >-
          The library shall provide a model-agnostic reference-voice library that downloads a
          verified, licensed voice pack and lists all available voices merged and
          de-duplicated.
        tags: [system]
        justification: |
          Voice-cloning synthesis models need reference clips, and a hundred-plus permissively
          licensed clips are far more useful as an optional, verified download than as
          something every host must source itself.
        children:
          - Speech-Models-ReferenceVoicePack
          - Speech-Models-ReferenceVoicePackDescriptor
          - Speech-Models-ReferenceVoicePackInstall
          - Speech-Models-ReferenceVoicePackUninstall
          - Speech-Models-ReferenceVoiceEmotionInstall
          - Speech-Models-ReferenceVoiceEmotionUpgrade
          - Speech-Models-ReferenceVoiceMoodClips
          - Speech-Models-ReferenceVoiceUserFolder
          - Speech-Models-ReferenceVoiceListing
          - Speech-Models-ReferenceVoiceConsentNotice
        tests:
          - ReferenceVoiceLibrary_InstallPack_Success_InstallsVoicesAndUpdatesState
          - ReferenceVoiceLibrary_EnumerateVoices_MergesInPrecedenceOrderFirstIdWins

      - id: Speech-Models-CatalogAndContract
        title: >-
          The library shall describe each known model through a common, role-tagged contract
          (identity, declared tunable parameters, declared audio-tag support, download
          descriptor).
        tags: [system]
        justification: |
          This library's model-catalog decision requires a typed, self-describing model
          contract so a host can build UI (parameter controls, model lists) without knowing a
          specific model in advance. The library ships the generic contract machinery with
          zero built-in models; concrete recognition and synthesis models are supplied by
          separate packages that plug in through it.
        children:
          - Speech-Models-ContractDeclaration
          - Speech-Models-TunableParameters
          - Speech-Models-TunableParameterValueValidation
          - Speech-Models-TunableParameterUnrecognizedIdTolerance
        tests:
          - ISpeechModel_Parameters_DeclaresEveryDescriptorKind
          - ISpeechModel_AudioTagSupportAndDownloadDescriptor_AreExposed

      - id: Speech-Models-InstallStateCatalog
        title: >-
          The library shall enumerate every known model alongside its current install state
          through a catalog that never throws.
        tags: [system]
        justification: |
          An enumerable catalog exposing install state lets a host build a model-settings
          page. The library ships the generic catalog machinery with zero built-in models;
          concrete models are registered by separate packages.
        children:
          - Speech-Models-CatalogEnumeration
          - Speech-Models-CatalogStoreComposition
        tests:
          - Speech_SystemIntegration_ModelCatalog_EnumeratesAndTracksDownloadState

      - id: Speech-Recognition-StreamingRecognizer
        title: >-
          The library shall recognize speech from a configured audio input device using an
          installed recognition model, emitting progressive provisional and final text results
          while audio is arriving.
        tags: [system]
        justification: |
          This library's core promise includes "streaming speech-to-text, emitting progressive
          provisional and final results as audio arrives", built on the already-shipped audio
          capture and model management capabilities. The library ships the recognition
          infrastructure and the model-to-engine contract; concrete recognition models are
          supplied by separate packages, so system-level behavior is proven against a test
          model.
        children:
          - Speech-Recognition-MockableContract
          - Speech-Recognition-BackendIsolation
          - Speech-Recognition-EngineExclusivity
          - Speech-Recognition-StreamingPipeline
          - Speech-Recognition-StreamingResultDelivery
          - Speech-Recognition-FaultContainment
          - Speech-Recognition-FaultedSessionSurfacing
          - Speech-Audio-CaptureFormatDisclosure
        tests:
          - Speech_SystemIntegration_StreamingRecognition_CapturedAudioProducesRecognitionResults

      - id: Speech-Recognition-HonestComposition
        title: >-
          The library shall compose a recognizer without ever throwing when recognition is not
          possible on the machine.
        tags: [system]
        justification: |
          A model that has not been downloaded yet, a machine with no microphone, and a machine
          without the speech engine's native runtime are all ordinary deployment states, so
          composition must degrade honestly rather than failing application start-up.
        children:
          - Speech-Recognition-Composition
          - Speech-Recognition-UnrecognizedParameterIgnored
          - Speech-Recognition-InvalidParameterValueRejected
          - Speech-Recognition-UnavailableFallback
          - Speech-Recognition-UnavailableOperationsThrow
        tests:
          - SpeechRecognizerFactory_LoadAsync_ModelNotInstalled_ReturnsUnavailableEngine
          - UnavailableSpeechRecognizerEngine_IsAvailable_Read_ReturnsFalse

      - id: Speech-Synthesis-AudioTagVocabulary
        title: >-
          The library shall recognize a closed, fixed vocabulary of inline Natural Language
          Audio Tags in text intended for text-to-speech, grouped into kinds.
        tags: [system]
        justification: |
          This library's "Natural Language Audio Tags replace SSML" decision requires a fixed,
          model-independent vocabulary that a host can rely on across every model. This
          requirement covers the closed vocabulary; Layer 2 per-model rendering and the public
          ISynthesisSession chunked synthesis and playback are described by
          Speech-Synthesis-StreamingSynthesizer below.
        children:
          - Speech-Synthesis-ClosedVocabulary
        tests:
          - Speech_SystemIntegration_AudioTagVocabulary_KnownTagParsedAndUnknownBracketPassesThrough

      - id: Speech-Synthesis-UnrecognizedBracketPassThrough
        title: >-
          The library shall pass any unrecognized or malformed bracket content through as plain
          narration text rather than dropping or rejecting it.
        tags: [system]
        justification: |
          The "never worse than plain narration" reasoning requires that text a host did not
          intend as a tag (a typo, an unsupported bracket phrase, an unbalanced bracket) is
          never silently dropped or rejected. This is delivered by the model-independent Layer 1
          parser.
        children:
          - Speech-Synthesis-Layer1Parsing
          - Speech-Synthesis-Layer1AliasResolution
          - Speech-Synthesis-Layer1LiteralPassthrough
        tests:
          - Speech_SystemIntegration_AudioTagVocabulary_KnownTagParsedAndUnknownBracketPassesThrough
          - AudioTagParser_Parse_UnclosedOpeningBracket_PassesThroughAsLiteralText

      - id: Speech-Synthesis-StreamingSynthesizer
        title: >-
          The library shall synthesize speech for text containing Natural Language Audio Tags,
          using an installed synthesis model and a configured audio output device.
        tags: [system]
        justification: |
          This library's core promise includes synthesis and playback of text containing
          Natural Language Audio Tags, built on the already-shipped audio playback, model
          management, and Layer 1 tag-parsing capabilities. The library provides the mockable
          backend seam; real synthesis backends are supplied by sibling packages (for example
          DemaConsulting.Speech.Sherpa and the DemaConsulting.Speech.Onnx.* packages);
          end-to-end behavior is proven against a test model per the fakeable engine seam.
        children:
          - Speech-Synthesis-MockableContract
          - Speech-Synthesis-MockableSynthesisPlaybackContract
          - Speech-Synthesis-MockableCancellationContract
          - Speech-Synthesis-EngineExclusivity
          - Speech-Synthesis-EngineDisposalOrdering
          - Speech-Synthesis-VoiceSelection
          - Speech-Synthesis-SpeakerIdResolution
          - Speech-Synthesis-VoiceSelectionIndependentOfTagOverrides
          - Speech-Synthesis-SessionOverlapAndLifecycle
          - Speech-Synthesis-SessionStateMachine
          - Speech-Synthesis-FaultedSessionTerminal
          - Speech-Synthesis-FaultContainment
          - Speech-Synthesis-DeterministicCancellation
          - Speech-Synthesis-NonCooperativeCallAbandonment
          - Speech-Audio-PlaybackFormatDisclosure
        tests:
          - Speech_SystemIntegration_StreamingSynthesis_TextProducesPlayedAudio

      - id: Speech-Synthesis-PerModelTagRendering
        title: >-
          The library shall render each Natural Language Audio Tag according to the synthesis
          model's own declared capabilities.
        tags: [system]
        justification: |
          Models differ in which tags they can express, so rendering must follow each model's
          declared capability profile, never worse than plain narration.
        children:
          - Speech-Synthesis-Layer2Rendering
          - Speech-Synthesis-Layer2RenderingApproximation
          - Speech-Synthesis-Layer2RenderingStrip
          - Speech-Models-SpeechModelContract-SynthesisEngineConfigDeclaration
          - Speech-Models-SpeechModelContract-SynthesisCapabilityProfileDeclaration
        tests:
          - DefaultModelCapabilityProfile_Render_NoneSupport_StripsAllTags

      - id: Speech-Synthesis-ChunkedLowLatencyPlayback
        title: >-
          The library shall chunk text and play each synthesized chunk as soon as it is ready
          for low latency.
        tags: [system]
        justification: |
          Low-latency playback requires beginning playback of the first chunk while later
          chunks are still being synthesized.
        children:
          - Speech-Synthesis-ChunkedPipeline
          - Speech-Synthesis-SequentialSynthesis
          - Speech-Synthesis-StreamedPlayback
        tests:
          - SynthesisSession_SynthesizeAsync_LongMultiSentenceInput_ProducesOrderedSegmentsSequentially

      - id: Speech-Synthesis-HonestComposition
        title: >-
          The library shall compose a synthesizer without ever throwing when synthesis is not
          possible on the machine.
        tags: [system]
        justification: |
          A model that has not been downloaded yet, a machine with no speakers, and a machine
          without the speech engine's native runtime are all ordinary deployment states, so
          composition must degrade honestly rather than failing application start-up.
        children:
          - Speech-Synthesis-Composition
          - Speech-Synthesis-CompositionIgnoresUnrecognizedParameter
          - Speech-Synthesis-CompositionRejectsInvalidParameterValue
          - Speech-Synthesis-UnavailableFallback
          - Speech-Synthesis-UnavailableFallbackOperationsThrow
        tests:
          - SpeechSynthesizerFactory_LoadAsync_ModelNotInstalled_ReturnsUnavailableEngine
