---
# Software System Requirements for SpeechTextEn
#
# These requirements describe the externally visible behavior of the SpeechTextEn library
# (DemaConsulting.Speech.Text.En) from the perspective of a model package or host application
# consuming it. SpeechTextEn is a sibling system to Speech: it supplies an English implementation
# of the Speech library's ITextAnalyzer seam, ships as its own (preview) package and is versioned
# as part of this repository. The Speech library never depends on it. The analysis is delivered
# as annotations on spans of the unchanged text: part of speech, the spoken form of abbreviations,
# symbols, initialisms and en-US numbers (normalization), host pronunciation overrides, and the
# reading of heteronym words decided by a trained model that is embedded in the package.
#
# The requirements from SpeechTextEn-TrainingData-OpenLicenses onward describe the repository's
# training and evaluation data (data/text-en/) and the non-shipped Text.En trainer that checks it,
# trains the heteronym model from it, measures the model on the committed held-out data and on
# pinned external datasets, and induces the word-class table from a pinned public-domain corpus.
# They are tool behavior; the model they produce is the one the package
# embeds. The datasets are not part of the package.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests (the library) and test/DemaConsulting.Speech.Text.En.Trainer.Tests
# (the trainer; the trainer has no system-level test class, so its system requirements are evidenced
# by its subsystem-level tests), and by the FileAssert tests of the built package. The subsystem and
# unit requirements under docs/reqstream/speech-text-en/ decompose these.

sections:
  - title: SpeechTextEn Requirements
    requirements:
      - id: SpeechTextEn-Analysis-TextAnalyzer
        title: >-
          The library shall provide an English text analyzer that a synthesis model can supply to the
          Speech library's text-analysis seam, that supplies the sentence boundaries of the text, never
          treats an audio-tag placeholder as part of a word or covers it by an annotation, gives the same
          result for the same text however long or repetitive it is, is safe for concurrent use and
          stops when its request is canceled.
        tags: [system]
        justification: |
          A phoneme-driven model needs sentence-level English context that no chunk or tag-delimited
          fragment carries, and the language-neutral Speech library has to get it from a separate
          package through its analyzer seam. The seam runs one analyzer for many requests, drops any
          annotation that covers a tag placeholder, splits sentences where the analysis says instead of
          at every period ("Dr." does not end a sentence), and a stopped engine waits for a running
          analysis, so cancellation must end it. The analyzer also runs on text pasted from documents
          and data, which must be handled exactly like any other text.
        children:
          - SpeechTextEn-Analysis-AnalyzerContract
          - SpeechTextEn-Normalization-LongInputAndCancellation
        tests:
          - SpeechTextEn_SynthesisSession_EndToEnd_AnnotationsReachBackendAcrossChunksAndTags
          - SpeechTextEn_Analyze_MultipleSentencesAndTag_ReturnsAuthoritativeBreaks
          - SpeechTextEn_Analyze_TagPlaceholder_IsNeverCoveredByAnAnnotation
          - SpeechTextEn_Analyze_CanceledToken_ThrowsOperationCanceledException
          - SpeechTextEn_Analyze_ConcurrentRequestsWithDifferentTexts_EachGetsItsOwnResult
          - SpeechTextEn_Analyze_LargeRepetitiveTexts_AnnotatesEveryRepetitionAlike

      - id: SpeechTextEn-Analysis-PartOfSpeech
        title: >-
          The library shall annotate each word of an English text with its Universal Dependencies part
          of speech, as an annotation positioned on the word that a synthesis backend can read, and
          shall let a host switch the annotation off.
        tags: [system]
        justification: |
          The part of speech selects the pronunciation of many English words (for example "record" as a
          noun or a verb). A backend needs it attached to the word, in a form it can read without
          parsing strings, and a host that does not need it must get only the annotation families it
          selected.
        children:
          - SpeechTextEn-Analysis-PartOfSpeechAnnotations
          - SpeechTextEn-Analysis-AnalyzerContract
        tests:
          - SpeechTextEn_Analyze_Sentence_AnnotatesWordsWithReadablePartOfSpeech
          - SpeechTextEn_Analyze_PartOfSpeechDisabled_ProducesNoAnnotations
          - SpeechTextEn_SynthesisSession_EndToEnd_AnnotationsReachBackendAcrossChunksAndTags

      - id: SpeechTextEn-Analysis-Diagnostics
        title: >-
          The library shall report one aggregate-counts event per analyzed text, and one for the
          readings assigned, to a host-supplied diagnostics sink, counting sentences, tokens,
          annotations, normalizations, ambiguous readings, numeric fallbacks, overrides applied and
          ignored and readings by kind, shall never include text, a word, a reading id or dictionary
          content in an event, and shall not let a failing sink interrupt an analysis.
        tags: [system]
        justification: |
          The Speech library's diagnostics contract forbids synthesized text in any report, so the
          analyzer can tell a host only how much it did, never what it read. The counts show how often
          the analysis had to guess (an ambiguous abbreviation or number), give up (numeric text left
          as written) or was doubtful (a low-confidence reading), and whether a dictionary does
          anything, without revealing a word of it (a dictionary can hold names). A sink is an
          observer, and a fault in it must never stop speech.
        children:
          - SpeechTextEn-Analysis-DiagnosticsAggregation
        tests:
          - SpeechTextEn_Diagnostics_AnalyzedRequest_ReportsCountsOnlyAndSinkFailureIsContained
          - SpeechTextEn_Diagnostics_Readings_AreCountsOnly
          - SpeechTextEn_Diagnostics_Overrides_ReportCountsOnlyAndNeverDictionaryContent
          - SpeechTextEn_Analyze_AmbiguousNumbers_UseDocumentedDefaultsAndAreCounted
          - SpeechTextEn_Analyze_OversizedNumbers_AreBoundedAndCounted

      - id: SpeechTextEn-Normalization-ReplacementAnnotations
        title: >-
          The library shall deliver English text normalization as annotations that name the spoken form
          of an exact span of the analyzed text (as words, or as capital letters to spell), shall never
          rewrite the text or annotate text that needs no change, shall keep the spans in text order,
          disjoint and free of whitespace, shall lose no annotation when the Speech library chunks the
          text, and shall let a host switch normalization off without needing the part-of-speech tagger.
        tags: [system]
        justification: |
          A synthesis backend needs to know how written English is spoken (an abbreviation in full, a
          symbol or a number as words, an initialism letter by letter), but the Speech library's
          annotations are positions in the text it supplied: rewriting the text would move every
          position and lose the user's own words. The library re-bases annotations onto its chunks and
          drops one that is split by a chunk boundary or starts or ends on trimmed whitespace, so a span
          that breaks these rules would silently lose its normalization, and a consumer applies the
          spans as one ordered sequence. A host that wants only the part of speech must be able to
          leave normalization out, and normalization works on the tokens alone.
        children:
          - SpeechTextEn-Normalization-SpanContract
          - SpeechTextEn-Analysis-NormalizationAnnotations
          - SpeechTextEn-Normalization-AcronymHandling
          - SpeechTextEn-Normalization-TokenDirectives
        tests:
          - SpeechTextEn_SynthesisSession_EndToEnd_AnnotationsReachBackendAcrossChunksAndTags
          - SpeechTextEn_SynthesisSession_NumbersAndSymbolsAtChunkCuts_AreNeverSplitOrLost
          - SpeechTextEn_Analyze_Abbreviation_AnnotatesSpokenFormWithoutChangingText
          - SpeechTextEn_Analyze_NormalizationNotSelected_ProducesNoNormAnnotations
          - SpeechTextEn_Analyze_NumberNextToAudioTag_KeepsBothAnnotations
          - SpeechTextEn_Analyze_SpelledInitialisms_AreAnnotatedAsSpellOut
          - SpeechTextEn_Analyze_Meridiems_AreTypedSpellOutSpans
          - SpeechTextEn_Analyze_SayOverrideWithSingleLetterPayload_IsNotSpelled

      - id: SpeechTextEn-Normalization-Abbreviations
        title: >-
          The library shall give the spoken form of the common written English abbreviations (including
          month and weekday abbreviations, read from the date around them), shall resolve the ambiguous
          ones (St., Dr., Sr. and No.) from the words around them with a documented, counted default,
          and shall end a sentence after an abbreviation period only where the abbreviation is read as
          the last word of its sentence, keeping a name suffix and its credentials in one sentence.
        tags: [system]
        justification: |
          A phoneme-driven model cannot pronounce "Dr." or "St." from their letters, and "St. Louis"
          and "Main St." differ in meaning; the neighboring words decide most cases and a documented
          default, with a count of its use, covers the rest. The tokenizer cannot tell the period after
          "Dr." from the one after "Main St." without knowing how the abbreviation is read, and a wrong
          break gives a model a fragment without its context or cuts a name in two, so the sentence
          breaks must follow the reading chosen.
        children:
          - SpeechTextEn-Normalization-AbbreviationResolution
        tests:
          - SpeechTextEn_Analyze_Abbreviation_AnnotatesSpokenFormWithoutChangingText
          - SpeechTextEn_Analyze_ContextDependentAbbreviations_ResolveFromNeighbors
          - SpeechTextEn_Analyze_AbbreviationAtSentenceEnd_BreaksAfterItAndKeepsThePeriod
          - SpeechTextEn_Analyze_CredentialsAfterNameSuffix_StayInOneSentence
          - SpeechTextEn_Analyze_MonthAndWeekdayAbbreviations_ResolveFromDateContext

      - id: SpeechTextEn-Normalization-Numbers
        title: >-
          The library shall annotate en-US numbers (cardinals, decimals, ordinals, percentages,
          fractions, years, decades, digit groups), currency amounts, units, clock times and dates with
          their spoken words, in plain words that contain no digit, hyphen or comma, shall
          read a number the words around it do not decide by a documented, counted default, shall
          bound the numbers it reads (longer ones stay as written and are counted), and shall leave
          text that is not a number it reads unchanged.
        tags: [system]
        justification: |
          A phoneme-driven model cannot pronounce digits: it needs "1,234" as "one thousand two hundred
          thirty four" and "$5.50" as "five dollars and fifty cents". The spoken words must be plain
          words a backend can feed to its lexicon without a number parser. "1999" can be a year or a
          quantity and "3/4/2024" can be March or April, so a documented default makes the choice
          predictable and its count tells a host how often the analysis guessed. A text may contain
          digit runs of any length (hashes, serial numbers), and reading a million digits aloud or
          building an unbounded value would stall speech, so the numbers are bounded and the rest stay
          as written rather than being guessed.
        children:
          - SpeechTextEn-Normalization-NumberReading
          - SpeechTextEn-Normalization-CurrencyReading
          - SpeechTextEn-Normalization-TimeReading
          - SpeechTextEn-Normalization-AbbreviationResolution
          - SpeechTextEn-Analysis-DiagnosticsAggregation
        tests:
          - SpeechTextEn_Analyze_NumbersCurrencyUnitsDatesAndTimes_AreSpokenAsWordsWithoutChangingText
          - SpeechTextEn_Analyze_NumericSentenceBreaks_FollowTheSentenceEnd
          - SpeechTextEn_Analyze_AmbiguousNumbers_UseDocumentedDefaultsAndAreCounted
          - SpeechTextEn_Analyze_OversizedNumbers_AreBoundedAndCounted
          - SpeechTextEn_SynthesisSession_NumbersAndSymbolsAtChunkCuts_AreNeverSplitOrLost

      - id: SpeechTextEn-Normalization-AddressesAndIdentifiers
        title: >-
          The library shall annotate web addresses (URLs, e-mail addresses and bare domains with a known
          top-level domain) with the spoken form of their pieces, and identifiers of capital letters and
          digits and names joined to a number by a hyphen with their spelled letters and read numbers,
          shall leave file names and other dotted names unchanged, and shall never rewrite the text.
        tags: [system]
        justification: |
          A phoneme-driven model has no reading for "john.smith@example.com", "https://example.com/docs"
          or "A4": its text front end would drop the punctuation or run the pieces together. The words of
          an address stay words for the phonemizer, and only the separators and letters that are not
          words are spoken, so the library, not each model package, owns the reading. A name such as
          "report.pdf" or "Node.js" is not an address and must not be reworded.
        children:
          - SpeechTextEn-Normalization-AddressAndIdentifierReading
        tests:
          - SpeechTextEn_Analyze_WebAddressesAndIdentifiers_AreSpokenAsPiecesWithoutChangingText

      - id: SpeechTextEn-Normalization-SymbolsAndClitics
        title: >-
          The library shall give the spoken form of non-numeric symbols and of initialisms (spelled
          letter by letter, case-sensitively), shall canonicalize typographic apostrophes inside
          contractions, shall drop invisible formatting characters only as explicit annotated edits,
          shall keep a clause of only a symbol or an invisible character with its neighbor, and shall
          make the role of each clitic available to the caller.
        tags: [system]
        justification: |
          A model reads "&" and the copyright sign as nothing unless it is told the words, and a
          typographic apostrophe in "don't" can defeat a lexicon lookup that expects an ASCII one.
          Invisible characters would be heard as a break or as noise, so they are dropped, but never
          silently. A clause that holds only a symbol must neither be discarded with its
          normalization nor be spoken alone. Knowing whether "'s" is a possessive or a contraction lets
          a model package choose the pronunciation without re-parsing the text.
        children:
          - SpeechTextEn-Normalization-SymbolsAndMarks
          - SpeechTextEn-Normalization-AcronymHandling
        tests:
          - SpeechTextEn_SynthesisSession_NumbersAndSymbolsAtChunkCuts_AreNeverSplitOrLost
          - SpeechTextEn_Analyze_SpelledInitialisms_AreAnnotatedAsSpellOut
          - SpeechTextEn_AnalyzeDetailed_Clitics_RecordTheirRole

      - id: SpeechTextEn-Overrides-WordOverrides
        title: >-
          The library shall let a host supply a dictionary of pronunciation overrides, built from
          entries or from a tab-separated file, validated and bounded, each matching one whole word of
          the analyzed text and applied by annotation only (the word spoken as written, replaced by
          plain words, spelled letter by letter, or given a phoneme string), shall let an override win
          over every built-in rule and a case-sensitive entry over a case-insensitive one, shall leave a
          word consumed by an earlier multi-token match to that match and count the override as
          ignored, shall leave the sentence breaks unchanged, shall report a bad entry by its position
          and a fixed reason but never by its content, and shall keep the dictionary immutable and safe
          to share.
        tags: [system]
        justification: |
          No built-in table knows a product name, a brand or a person's name, and a model that
          mispronounces it cannot be fixed by editing the library. The host must be able to say how a
          word is spoken, and the override has to be an annotation like every other normalization. A
          host that asks for "US" to be spoken as written must not be overruled by the acronym table.
          "5 kg" is one construct that the number rules read as a whole, so an override for its unit
          cannot be applied to part of it; the override is ignored and counted rather than applied
          silently. An override changes how a word is spoken, never where a sentence ends. The
          dictionary is usually a text file kept by someone who is not a programmer, so an error needs a
          line number, may contain names that must not appear in a message, comes from a file the host
          does not control (so it is bounded) and serves many threads (so it cannot change).
        children:
          - SpeechTextEn-Analysis-OverrideAnnotations
          - SpeechTextEn-Normalization-TokenDirectives
        tests:
          - SpeechTextEn_SynthesisSession_EndToEnd_AnnotationsReachBackendAcrossChunksAndTags
          - SpeechTextEn_Analyze_Overrides_AnnotateWholeWordsPerAction
          - SpeechTextEn_Analyze_OverrideActions_ReadBackThroughTypedReaders
          - SpeechTextEn_Analyze_OverridePrecedence_UserOverridesBuiltInRules
          - SpeechTextEn_Analyze_OverrideOnConsumedToken_IsIgnoredAndCounted
          - SpeechTextEn_Analyze_OverrideOnAbbreviationWord_KeepsSentenceBreaksAndChunks
          - SpeechTextEn_Overrides_Dictionary_LoadsFromFileValidatesAndDrivesAnalysis
          - SpeechTextEn_Analyze_ConcurrentRequestsWithDifferentTexts_EachGetsItsOwnResult

      - id: SpeechTextEn-Heteronym-Readings
        title: >-
          The default analyzer shall, with no host configuration and from data in the package alone,
          annotate each word of the reading inventory that has more than one reading with the id of its
          reading in the sentence and a confidence, as two annotations on the word's exact span that
          coexist with its part-of-speech annotation, are never placed on text that is replaced,
          spelled or pronounced, survive the Speech library's chunking, and give the same result for
          concurrent requests; shall emit no reading for a text without such a word; and shall let a
          host fix the reading of a word with a validated reading entry of the dictionary, which beats
          the model with a confidence of 1.000.
        tags: [system]
        justification: |
          English spells different words alike ("record" the noun and "record" the verb), and a
          phoneme-driven model can pronounce them correctly only if something decides which one a
          sentence means. The reading id names the decision in a stable vocabulary, the confidence lets
          a backend judge it, and the embedded model and inventory make the analyzer work offline with
          no setup (the inventory is the vocabulary hosts name in overrides, so it cannot be a separate
          download). The annotations belong to the word and nothing else: a span another rule has
          already replaced, spelled or pronounced has a spoken form that a reading would contradict,
          and the Speech library re-bases the annotations of a long text onto its chunks. A classifier
          is right most of the time, not always, so a host that knows the reading of a name must be
          able to say so. How accurate the model is on held-out data is the subject of
          SpeechTextEn-Training-Evaluation.
        children:
          - SpeechTextEn-Analysis-ReadingAnnotations
          - SpeechTextEn-Heteronym-Classification
          - SpeechTextEn-Heteronym-ReadingIds
          - SpeechTextEn-Heteronym-ModelSupply
        tests:
          - SpeechTextEn_SynthesisSession_EndToEnd_AnnotationsReachBackendAcrossChunksAndTags
          - SpeechTextEn_Analyze_DefaultAnalyzerClearHeteronymSentences_EmitTheExpectedReading
          - SpeechTextEn_Analyze_DefaultAnalyzerTextWithoutHeteronym_EmitsNoReadingAnnotations
          - SpeechTextEn_Analyze_ReadingOverride_BeatsClassifier
          - SpeechTextEn_Analyze_ConcurrentRequestsWithDifferentTexts_EachGetsItsOwnResult

      - id: SpeechTextEn-Heteronym-ModelIntegrity
        title: >-
          The library shall load a heteronym model only from a file that passes strict validation and
          whose feature set and reading-inventory version it supports, shall continue without readings
          and report the problem once per analyzer when a model is damaged or incompatible, and shall
          derive the features of a reading decision and write the confidence identically on every
          operating system, runtime and current culture.
        tags: [system]
        justification: |
          A model file is data from outside the process: it can be truncated, corrupted, hostile or
          trained for another version of the reading inventory, and trusting it would risk wrong
          pronunciations, an out-of-memory failure or a crash on the speech path. A model that cannot
          be used must not break speech, so the analysis goes on without readings and the host is told
          once. The weights are indexed by hashed features, so a derivation that depends on the culture
          (a Turkish dotted I) or the platform would make a model decide differently from the one that
          was trained, which no test of the weights alone could reveal.
        children:
          - SpeechTextEn-Heteronym-SparseFormat
          - SpeechTextEn-Heteronym-Classification
          - SpeechTextEn-Analysis-ReadingAnnotations
        tests:
          - EnglishTextAnalyzer_Analyze_ModelWarning_OncePerAnalyzerOnlyForUnusableModel
          - HeteronymFeatureExtractor_Extract_GoldenVectors_MatchFileUnderEveryCulture
          - EnglishTextAnalyzer_Analyze_ConfidenceText_IsInvariantUnderTurkishAndFrenchCultures

      - id: SpeechTextEn-Isolation-RequestNoninterference
        title: >-
          The library shall give each analysis request a result and diagnostics that depend only on that
          request's own text and configuration, so that they never disclose text from any other request,
          also when requests run one after another or concurrently on one analyzer.
        tags: [system]
        justification: |
          The core ITextAnalyzer contract requires an analyzer not to retain the request text, which is
          the user's speech content, and one analyzer serves many requests. What a host or a backend can
          observe of that is noninterference: the result and the diagnostics of a request carry nothing
          of another request and equal what a fresh analyzer would give. The stronger design obligation
          that the library and its tagging dependency keep no reference to analyzed text in memory
          cannot be observed through the public interface; it is recorded in the system design and the
          PartOfSpeech verification document and is not claimed to be proven by test.
        tests:
          - SpeechTextEn_Analyze_AfterAnotherRequest_ResultAndDiagnosticsDiscloseNothingOfIt
          - SpeechTextEn_Analyze_ConcurrentRequestsWithDifferentTexts_EachGetsItsOwnResult

      - id: SpeechTextEn-Packaging-LicenseNotices
        title: >-
          The package shall declare the license of everything it embeds through a license file that
          starts with the SPDX expression MIT AND CC-BY-3.0-US and contains the MIT license text, shall
          state that its lexicon tables are under the MIT License, that its reading inventory is
          dedicated to the public domain under CC0-1.0, that its embedded heteronym model was trained on
          data adapted from the Manually Annotated Sub-Corpus and is provided under the terms of that
          license, and that the part-of-speech tagging package it requires is a separate dependency with
          its own license files, and shall carry a notice file that attributes the Manually Annotated
          Sub-Corpus with the changes made, dedicates the content generated or labeled for the model to
          the public domain under CC0 1.0 and reproduces the attribution of the dependency's embedded
          data; both files shall be packed at the package root.
        tags: [system]
        justification: |
          The package contains code, two small lexicon tables and a reading inventory that DEMA
          Consulting wrote from scratch, and a trained model whose weights were learned from sentences
          under three licenses: CC BY 3.0 US (sentences adapted from the Manually Annotated Sub-Corpus),
          public domain and CC0. The weights contain no sentence text, but the package takes the
          conservative course the tagging package already takes: the model is provided under the terms
          of the attribution license, with the attribution and the statement of changes, and the
          declaration names both licenses; declaring the MIT License only would misstate what a
          consumer receives. The required tagging package carries its own license files, but its
          embedded lexicon and weights come from Open English WordNet (CC BY 4.0) and the same corpus,
          so a consumer should be able to see what the dependency contains; the notice file, clearly
          scoped, does that. The built package is inspected by a FileAssert test: both files are at the
          package root of the .nupkg with the required content and the .nuspec names the license file.
          This is not legal advice; the declaration and notices are the owner's decision and are
          revisited if the data or the model changes.
        tests:
          - TextEn_PackageLicenseFiles_Content

      - id: SpeechTextEn-Packaging-PinnedDependency
        title: >-
          The package shall depend on the part-of-speech tagging package pinned to one exact version and
          on no speech-engine inference runtime.
        tags: [system]
        justification: |
          The tagging package is a pre-release package whose results can change between versions, so a
          floating version would silently change the analysis a model builds on. The analysis is plain
          managed text processing and must stay usable by any model package, so it must not drag an
          inference runtime into every consumer. The built package is inspected by a FileAssert test of
          its .nuspec, not the text of the project file, and only when a package exists: NuGet does not
          allow a stable package to depend on a pre-release package (NU5104), so while the tagging
          package is a pre-release the project is packable only for a pre-release version (a temporary
          guard recorded in the system design, which goes with the pre-release pin; the build script's
          pack verification checks that a package is produced).
        tests:
          - TextEn_PackageDependencies_Nuspec

      - id: SpeechTextEn-TrainingData-OpenLicenses
        title: >-
          The repository shall hold the Text.En training and evaluation data only under the open
          licenses CC0-1.0, Public-Domain and CC-BY-3.0-US, shall record for every row where it came from
          (a source document with its license, or how it was generated) and carry the attribution its
          licenses require, shall state that the content generated or labeled for it by DEMA Consulting
          is dedicated to the public domain under CC0 1.0, and shall fail its checks for a row under
          another license, a restricted-license or Misaki row, or a row without a record or a record
          without a row.
        tags: [system]
        justification: |
          The data is meant to be reused and redistributed, including commercially, and to train weights
          that ship with the package. A single row under a share-alike, non-commercial or no-derivatives
          license would taint all of it, and the owner decided that no Misaki data is used and that the
          content generated by DEMA Consulting, including text labeled by language models, is released
          under CC0 1.0. A license claim is only as good as the record behind it, so every harvested row
          needs its source document and every generated row the template or labeling it came from, and
          the license of every row is checked on every change.
        children:
          - SpeechTextEn-TrainingData-LicenseGate
          - SpeechTextEn-TrainingData-SchemaValidation
        tests:
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks

      - id: SpeechTextEn-TrainingData-Integrity
        title: >-
          The repository shall provide a command that fails when the committed Text.En training data is
          malformed, differs from its committed manifest, contains a row whose label, lemma, source,
          license or target-word offsets are inconsistent with the reading inventory, or shares a
          sentence, a document or a template between the training, development and holdout sets (and,
          when an operator supplies local copies of the evaluation sets, repeats or nearly repeats an
          evaluation sentence), and the repository shall never hold the evaluation-only corpora.
        tags: [system]
        justification: |
          The data is far too large to review by reading, and a silent defect in it (a shifted offset, a
          wrong label, an altered file) would only show up later as a worse classifier. A classifier is
          only measured honestly on sentences it did not train on, and the evaluation corpora are
          licensed for evaluation only, so they are never committed. A command that checks every file
          and every row, and that the lint script and the build pipeline run, keeps the committed data
          what its reviewed manifest says it is; the comparison with the external sets can only be run
          by someone who has them, so it is optional.
        children:
          - SpeechTextEn-TrainingData-CheckCommand
          - SpeechTextEn-TrainingData-FileFormat
          - SpeechTextEn-TrainingData-SchemaValidation
          - SpeechTextEn-TrainingData-LeakageGate
        tests:
          - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_ManifestDrift_NamesFileAndPassesAfterRegeneration
          - TrainingDataSubsystem_CheckData_ExternalOverlap_IsReportedWhenSetsSupplied
          - TrainingDataSubsystem_CheckData_ValidFixture_PassesAllChecks

      - id: SpeechTextEn-TrainingData-EvaluationOverlays
        title: >-
          The repository shall keep, beside the Text.En training data, a regression overlay that refers to
          owner-flagged sentences, golden test sentences and existing examples and marks each as seen or unseen
          in training, and a generalization test set written blind, and its data check shall fail when an
          overlay row is malformed, refers to an example it does not match or to a holdout, repeats a holdout
          sentence or carries a wrong seen-in-training mark, or when a generalization row repeats a committed
          sentence or is not new for its word in its designated cue words or in the words around it, or the
          written set lacks the required number of rows of each kind, of families and of rows that the
          hand-written cues cannot solve; a staged copy of the set shall be checkable before it is committed,
          with reasons that reveal no training sentence.
        tags: [system]
        justification: |
          Hand-written cues and new features are only worth keeping when they help on sentences the model
          has never seen; the flagged sentences show where the model failed, and a set written blind,
          before any model that uses it is trained, shows whether a change generalizes. Both sets only mean
          something while they stay what they claim to be: the overlay must not touch the holdouts and must
          say honestly which sentences were trained on, and the generalization set must stay new against the
          training and development data as they change. The writer of the set may not see the training
          data, so the check of a staged copy may only say what is wrong, not which training sentence it
          resembles.
        children:
          - SpeechTextEn-TrainingData-OverlayChecks
        tests:
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_StagedGeneralization_ReportsGenericFindings
          - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks
          - TrainingDataSubsystem_CommittedRegression_GoldenAndTestReferencesResolve

      - id: SpeechTextEn-Training-Reproducible
        title: >-
          The repository shall provide a command that trains the heteronym model from the committed
          training and development data, the reading inventory and the committed settings alone (the
          holdout sets have no influence) with the same content on every run and on every supported
          operating system, together with a record of its settings, inputs and image hash, and a command
          that detects and reports by name a model, a record or an input that no longer matches what
          retraining produces.
        tags: [system]
        justification: |
          A model that ships in a package must be one the repository can rebuild, so that a reviewer can
          check where its weights came from, and a classifier is only measured honestly when nothing it
          was made from has seen the holdout sets (not the weights, the number of epochs or the
          confidence calibration). The identity across operating systems is evidenced by the
          continuous-integration build matrix, which runs the same test, with the hash of a model
          trained from a small fixture pinned in the test, on every supported operating system. A model
          that no longer matches its data, its tagger or its settings, or a record or model file edited
          by hand, would ship weights nobody can reproduce, so the check finds it and names the cause.
        children:
          - SpeechTextEn-Training-RepeatableModel
          - SpeechTextEn-Training-CommandContract
          - SpeechTextEn-Training-HoldoutFreeTraining
        tests:
          - TrainingSubsystem_Train_SameInputsTwice_ProduceIdenticalUncompressedImagesAndRecords
          - TrainingSubsystem_Train_FixtureImage_MatchesPinnedHash
          - TrainingSubsystem_Train_HoldoutFilesAbsentOrAltered_ImageUnchanged
          - TrainingSubsystem_TrainCheck_FreshModelIsCurrentAndChangesMakeItStale
          - TrainingSubsystem_TrainCheck_CommittedModelAndRecord_AreCurrent

      - id: SpeechTextEn-Training-RuntimeParity
        title: >-
          The heteronym model shall be trained on exactly what the analyzer sees at run time: a training
          row whose target is not a token of the analyzer's own tokenization shall be reported and
          counted, and the readings that the trainer's own scoring decides shall equal the readings the
          analyzer emits with the trained model.
        tags: [system]
        justification: |
          A model tuned on contexts that the analyzer never builds, or decided by a scoring that differs
          from the analyzer's, would look good in training and fail in use. Reporting the rows that
          cannot be used and comparing the trainer's decisions with the analyzer's on every row turns
          the match between training and use from an intention into a measured fact.
        children:
          - SpeechTextEn-Training-RuntimeAlignedTraining
        tests:
          - TrainingSubsystem_Train_TinyFixture_ProducesLoadableModelThatClassifiesTrainingPatterns
          - TrainingSubsystem_Train_UnalignedRow_SkippedAndCountedInRecord
          - TrainingSubsystem_Evaluate_TrainerAndAnalyzerPredictions_AgreeOnEveryFixtureRow

      - id: SpeechTextEn-Training-Evaluation
        title: >-
          The repository shall provide a command that reports, deterministically, the reading accuracy of
          the heteronym model on the development and holdout sets with always-default (majority) and
          own-part-of-speech baselines, a paired document-clustered confidence interval of the
          improvement, the readings with the lowest accuracy and the variation between seeds, and that
          decides the quality gate from them: the embedded model shall choose the labeled reading for at
          least 93.0 percent of the words of the committed natural holdout, end to end through the
          analyzer, and improve on the part of speech alone by an amount whose 95 percent confidence
          interval lies above zero.
        tags: [system]
        justification: |
          Whether a model is worth shipping depends on what it adds beyond what the tagger already gives
          for free, how certain that improvement is, and where the model fails. The owner fixed the gate
          before any model was measured: a model that does not clearly beat the tagger is not worth its
          size and licensing burden. The decision is made by a command from the recorded thresholds,
          through the same analyzer a host uses, on data that took part in neither training nor any
          choice, and a result that is the same on every run can be committed and checked. The committed
          evaluation record carries the numbers and the honest limits of the measure (labels chosen by
          rule or by language models, tagger exposure to part of the natural set, and a separate
          synthetic set written by another model family).
        children:
          - SpeechTextEn-Training-EvaluationReport
        tests:
          - TrainingSubsystem_Evaluate_FixtureSets_ComputesAccuracyBaselinesAndCoverage
          - TrainingSubsystem_Evaluate_Gate_ExitCodeFollowsThresholds
          - TrainingSubsystem_Evaluate_WriteThenCheck_MatchesAndDetectsEditedRecord
          - TrainingSubsystem_Evaluate_CommittedModelAndData_PassesGate

      - id: SpeechTextEn-Training-OverlayEvaluation
        title: >-
          The evaluation command shall report the reading accuracy of the heteronym model with and without the
          hand-written cue priors, with clustered confidence intervals of both and of their difference, on a
          regression overlay of owner-flagged sentences and golden targets, each marked as seen or unseen in
          training, and on a generalization set written blind, which the data check proves new against the
          training and development data, by origin and seen or unseen rows of the overlay and by family, kind and
          whether the curated cues can solve a row of the generalization set, resampling the generalization rows
          by family; it shall treat a generalization row marked as not solvable by the curated cues on which a
          curated cue can act as a data error, and shall add these results to the evaluation record without
          changing its earlier lines.
        tags: [system]
        justification: |
          The cue priors were written for single flagged sentences, and later features (word classes) are only
          worth keeping when they help on sentences the model has never seen. Measuring the shipped model with
          and without its cue priors, on the flagged sentences and on a set written blind, shows how much the
          priors do and where the model alone fails; this is the baseline that the pre-registered criterion
          for word classes is judged against. The rows of a family share one cue or template idea, so they are
          resampled together and the interval is not overstated. A row that claims the curated cues cannot
          solve it, but on which a cue acts, would misstate that subset, so it stops the evaluation rather than
          count. The new results are appended so the record of the gate stays exactly as it was.
        children:
          - SpeechTextEn-Training-OverlayReport
        tests:
          - TrainingSubsystem_Evaluate_Overlays_ReportedWithAndWithoutCuesAndAppendedToRecord
          - TrainingSubsystem_Evaluate_CommittedModelAndData_PassesGate

      - id: SpeechTextEn-Training-WordClasses
        title: >-
          The repository shall provide a command that induces a table of hierarchical word classes only from a
          pinned list of US public-domain books obtained from an official Project Gutenberg mirror and verified
          against their pins, that excludes every passage repeating or nearly repeating a sentence of the
          development, holdout, regression or generalization data and reports the removals, that keys every
          table word exactly as the analyzer looks a word up and leaves out every word whose lookup key is
          shared, and that produces the same table on every run, for any number of threads and on every
          supported operating system, together with a record of its settings, input hashes and table hash and a
          way to re-verify the table against a fresh induction.
        tags: [system]
        justification: |
          Word classes induced from a large public-domain corpus let a later model generalize from the words
          it was trained on to words of the same kind. The table can only ship when its origin is clean and
          checkable: the books must be in the public domain in the USA and fetched politely from an official
          mirror, each pinned so the corpus cannot drift, and no evaluation sentence may reach the corpus,
          because a class learned from a test sentence would inflate every later measurement. A word whose
          lookup key collides with another word's would silently take that word's class, so such keys are
          left out. A table that differs between machines or thread counts could not be reviewed or
          reproduced, so the induction is deterministic, its inputs are recorded by hash, and a full
          re-induction can show that the committed table is exactly what the recorded inputs produce.
        children:
          - SpeechTextEn-Clustering-PinnedCorpus
          - SpeechTextEn-Clustering-LeakageAudit
          - SpeechTextEn-Clustering-RuntimeKeys
          - SpeechTextEn-Clustering-Deterministic
          - SpeechTextEn-Clustering-RecordAndCheck
        tests:
          - ClusteringSubsystem_Cluster_FetchAuditWriteCheck_EndToEnd
          - ClusteringSubsystem_Cluster_BookQuotingEvaluation_SentenceRemoved
          - ClusteringSubsystem_Cluster_TableWords_AreRuntimeKeys
          - ClusteringSubsystem_Cluster_DifferentThreadCounts_IdenticalFiles
          - ClusteringSubsystem_Cluster_FixtureCorpus_GoldenTable

      - id: SpeechTextEn-Evaluation-ExternalFetchOnly
        title: >-
          The repository shall obtain evaluation-only external datasets only into a local cache that is
          not committed, shall use exactly the pinned upstream revision and files of each dataset and
          never evaluate content that fails verification against its pin, shall commit and embed nothing
          of them, and shall never use them to train a heteronym model or to choose any setting of one.
        tags: [system]
        justification: |
          The external datasets are licensed for evaluation, and a model trained or tuned on them could
          no longer be measured on them, so they are fetched at evaluation time into a folder that
          version control ignores and nothing of them can reach a commit, a package or a model. A figure
          is only comparable between runs, and only reviewable, when the data behind it is the same
          data: the pins fix the revision and every file by size and hash, so a changed or damaged copy
          is refused instead of silently measured.
        children:
          - SpeechTextEn-ExternalEvaluation-FetchAndVerify
          - SpeechTextEn-ExternalEvaluation-SeedVariance
        tests:
          - ExternalEvaluationSubsystem_Evaluate_FetchConvertEvaluateAndRecord_EndToEnd
          - ExternalEvaluationSubsystem_Evaluate_TamperedCache_IsRefusedWithNoFigures
          - ExternalEvaluationSubsystem_Seeds_ReportSpreadAndIntervals

      - id: SpeechTextEn-Evaluation-ExternalReport
        title: >-
          The external evaluation shall report, for each external set, the accuracy of the embedded
          heteronym model with always-default, majority and own-part-of-speech baselines, the results for
          each reading, the rows that were skipped with the reason, and the variation of the accuracy
          across training seeds with clustered confidence intervals, and the committed external record
          shall be deterministic, hold only numbers, pins and the repository's own identifiers, and be
          verifiable against a fresh evaluation.
        tags: [system]
        justification: |
          A single accuracy on a dataset of another domain says little. The baselines show what the model
          adds, the per-reading results show where it fails, the skipped rows show how much of the
          dataset the figure does not cover, and the seeds with their intervals show how much of the
          result is the model and how much is luck. The record is the reviewable evidence of the figures:
          it has to come out the same on every run so that it can be compared, it must carry nothing of
          the licensed datasets, and a record nobody can check against a fresh evaluation would be a
          claim and not evidence.
        children:
          - SpeechTextEn-ExternalEvaluation-LabelMapping
          - SpeechTextEn-ExternalEvaluation-SeedVariance
          - SpeechTextEn-ExternalEvaluation-CommandContract
        tests:
          - ExternalEvaluationSubsystem_Evaluate_SkippedRows_AreReportedNotFatal
          - ExternalEvaluationSubsystem_CommittedBenchMapping_ResolvesToInventoryReadings
          - ExternalEvaluationSubsystem_Seeds_ReportSpreadAndIntervals
          - ExternalEvaluationSubsystem_Failures_ExitTwoWithNoFigures
          - ExternalEvaluationSubsystem_CommittedRecord_HasExpectedFilesAndNumericGrammar
          - ExternalEvaluationSubsystem_Output_HoldsNoDatasetText
