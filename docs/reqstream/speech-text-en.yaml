---
# Software System Requirements for SpeechTextEn
#
# These requirements describe the externally visible behavior of the SpeechTextEn library
# (DemaConsulting.Speech.Text.En) from the perspective of a model package or host application
# consuming it, without specifying implementation details. SpeechTextEn is a sibling system to
# Speech: it supplies an English implementation of the Speech library's ITextAnalyzer seam,
# ships as its own package, and is versioned as part of this repository. The Speech library never
# depends on it. This is a preview: part-of-speech annotation, sentence boundaries and the
# normalization of English text (abbreviations including month and weekday abbreviations, symbols,
# apostrophes and initialisms, and en-US numbers, ordinals, years, currency, percent, units, times and
# dates, delivered as annotations that never rewrite the text), host-supplied pronunciation overrides
# (whole words spoken as written, replaced by plain words, spelled letter by letter or given a
# phoneme string) and the spell-out annotation for letter sequences are provided. The heteronym
# reading runtime is provided as well (SpeechTextEn-Heteronym-*): a reading inventory embedded in the
# package, a deterministic feature extractor, a strict loader for the sparse model format and a
# classifier that annotates the words of the inventory with a reading id and a confidence when a
# model is available. This release embeds no model, so by default no reading is emitted; a host
# override can still fix a reading. Each requirement
# states one observable behavior.
#
# The training-data requirements at the end of this file (SpeechTextEn-TrainingData-*) describe the
# repository's Text.En training and evaluation data (data/text-en/) and the check-data command of the
# non-shipped Text.En trainer that verifies it; nothing from that data is part of the package.
#
# Covered by test/DemaConsulting.Speech.Text.En.Tests (and, for the training-data requirements, by
# test/DemaConsulting.Speech.Text.En.Trainer.Tests) - see the subsystem/unit-level reqstream
# files under docs/reqstream/speech-text-en/ for the full tests: lists these system requirements
# decompose into.

sections:
  - title: SpeechTextEn Requirements
    requirements:
      - id: SpeechTextEn-Analysis-TextAnalyzer
        title: >-
          The library shall provide an English text analyzer that a synthesis model can supply
          to the Speech library's text-analysis seam, that is safe for concurrent use, and that
          honors cancellation.
        tags: [system]
        justification: |
          A phoneme-driven model needs sentence-level English context that no chunk or
          tag-delimited fragment carries. The Speech library is language-neutral, so an English
          analyzer has to be supplied by a separate package through the library's analyzer seam;
          that seam runs one analyzer instance for many requests and expects cancellation to stop
          it.
        children:
          - SpeechTextEn-Analysis-AnalyzerContract
        tests:
          - SpeechTextEn_SynthesisSession_AnnotatedBackend_ReceivesPartOfSpeechAnnotationsThatSurviveChunking
          - SpeechTextEn_Analyze_CanceledToken_ThrowsOperationCanceledException
          - SpeechTextEn_Analyze_ConcurrentRequestsOnSharedAnalyzer_ReturnIdenticalResults

      - id: SpeechTextEn-Analysis-PartOfSpeech
        title: >-
          The library shall annotate each word of an English text with its Universal Dependencies
          part of speech, as an annotation positioned on the word that a synthesis backend can
          read, and shall let a host switch this annotation off.
        tags: [system]
        justification: |
          The part of speech is the context that selects the pronunciation of many English words
          (for example "record" as a noun or a verb). A backend needs it attached to the word, in
          a form it can read without parsing strings itself, and a host that does not need it
          must be able to switch it off and get only the annotation families it selected.
        children:
          - SpeechTextEn-Analysis-PartOfSpeechAnnotations
          - SpeechTextEn-Analysis-SelectedAnnotationsAndRecovery
        tests:
          - SpeechTextEn_Analyze_Sentence_AnnotatesWordsWithReadablePartOfSpeech
          - SpeechTextEn_Analyze_PartOfSpeechDisabled_ProducesNoAnnotations
          - SpeechTextEn_SynthesisSession_AnnotatedBackend_ReceivesPartOfSpeechAnnotationsThatSurviveChunking

      - id: SpeechTextEn-Analysis-SentenceBreaks
        title: >-
          The library shall supply the sentence boundaries of the analyzed text so that the Speech
          library splits sentences where the analysis says, rather than at every period.
        tags: [system]
        justification: |
          A period after an abbreviation such as "Dr." does not end a sentence, and splitting
          there would give a model a fragment without its context. The analysis knows English
          sentence structure; the library's own punctuation heuristic does not.
        children:
          - SpeechTextEn-Analysis-SentenceBoundaries
          - SpeechTextEn-Analysis-NormalizationAnnotations
        tests:
          - SpeechTextEn_Analyze_MultipleSentencesAndTag_ReturnsAuthoritativeBreaks
          - SpeechTextEn_SynthesisSession_AnalyzerSentenceBreaks_DriveChunkBoundaries

      - id: SpeechTextEn-Analysis-PlaceholderHandling
        title: >-
          The library shall treat the Speech library's audio-tag placeholder as an opaque
          separator that is never part of a word or covered by an annotation, while still
          analyzing the words on both sides of it as one running text.
        tags: [system]
        justification: |
          The Speech library replaces each recognized audio tag with one placeholder character
          before analysis, and drops any annotation that covers a placeholder. An analysis that
          treated the placeholder as text would lose annotations, and one that cut the text at
          every tag would lose the context that tags such as "[whispers]" sit in the middle of.
        children:
          - SpeechTextEn-Analysis-PlaceholderNeutrality
        tests:
          - SpeechTextEn_Analyze_TagPlaceholder_IsNeverCoveredByAnAnnotation
          - SpeechTextEn_SynthesisSession_TextWithAudioTag_AnnotatesWordsAroundTheTag

      - id: SpeechTextEn-Analysis-Diagnostics
        title: >-
          The library shall report one aggregate-counts analysis event per analyzed text to a
          host-supplied diagnostics sink (readings assigned are reported by their own event, see
          SpeechTextEn-Heteronym-Diagnostics), counting sentences, tokens, annotations, unknown
          words, normalizations,
          ambiguous readings, numeric fallbacks, overrides applied and overrides ignored, shall
          never include any text content or any content of a pronunciation dictionary in it, and
          shall not let a failing sink interrupt an analysis.
        tags: [system]
        justification: |
          The Speech library's diagnostics contract forbids synthesized text in any report, so
          the analyzer can tell a host only how much it did, never what it read. The counts of
          normalizations, of readings chosen by default where the words around an abbreviation or
          a number did not decide (an abbreviation, a bare year, a month-first date) and of
          numeric text left as written tell a host how much the normalization changed and how
          often it had to guess or give up, which is the evidence for tuning it. The counts of
          overrides applied and ignored tell a host whether its dictionary is doing anything and
          whether an entry is shadowed by a number or unit rule, without revealing a word of the
          dictionary, which can hold names. A diagnostics sink is an observer, and a fault in it
          must never stop speech.
        children:
          - SpeechTextEn-Analysis-DiagnosticsAggregation
        tests:
          - SpeechTextEn_Diagnostics_AnalyzedRequest_ReportsCountsOnlyAndSinkFailureIsContained
          - SpeechTextEn_Diagnostics_Overrides_ReportCountsOnlyAndNeverDictionaryContent

      - id: SpeechTextEn-Normalization-ReplacementAnnotations
        title: >-
          The library shall deliver English text normalization as annotations that name the
          spoken form of a span of the analyzed text, shall never rewrite the analyzed text or
          annotate text that needs no change, and shall let a host switch normalization off
          without needing the part-of-speech tagger for it.
        tags: [system]
        justification: |
          A synthesis backend needs to know how written English is spoken (an abbreviation in
          full, a symbol as words), but the Speech library's annotations are positions in the
          text it supplied, so rewriting the text would move every position and lose the user's
          own words. Annotating only what changes keeps the cost proportional to the work done,
          a host that wants only the part of speech must be able to leave normalization out, and
          normalization works on the tokens alone, so it must not load the tagger.
        children:
          - SpeechTextEn-Normalization-SpanContract
          - SpeechTextEn-Analysis-NormalizationAnnotations
        tests:
          - SpeechTextEn_Analyze_Abbreviation_AnnotatesSpokenFormWithoutChangingText
          - SpeechTextEn_Analyze_NormalizationNotSelected_ProducesNoNormAnnotations

      - id: SpeechTextEn-Normalization-Abbreviations
        title: >-
          The library shall give the spoken form of the common written English abbreviations,
          shall resolve the ambiguous ones (St., Dr., Sr. and No.) from the words around them,
          and shall use a documented default, counted in the diagnostics, where the words around
          an ambiguous abbreviation do not decide.
        tags: [system]
        justification: |
          A phoneme-driven model cannot pronounce "Dr." or "St." from their letters, and the two
          readings of "St. Louis" and "Main St." differ in meaning. The neighboring words decide
          most cases; where they do not, a documented default is predictable and a count of such
          cases tells a host how often the normalization had to guess.
        children:
          - SpeechTextEn-Normalization-AbbreviationResolution
        tests:
          - SpeechTextEn_Analyze_Abbreviation_AnnotatesSpokenFormWithoutChangingText
          - SpeechTextEn_Analyze_ContextDependentAbbreviations_ResolveFromNeighbors
          - SpeechTextEn_Diagnostics_AnalyzedRequest_ReportsCountsOnlyAndSinkFailureIsContained

      - id: SpeechTextEn-Normalization-Numbers
        title: >-
          The library shall annotate cardinal numbers, negative numbers, thousands-separated
          numbers, decimals, ordinals, percentages, fractions, years, decades and digit groups
          (ranges, phone numbers, identifiers and dotted numbers) of en-US text with their spoken
          words, in plain lowercase words that contain no digit, hyphen or comma, shall never
          rewrite the text, and shall leave text that is not a number it reads unchanged.
        tags: [system]
        justification: |
          A phoneme-driven model cannot pronounce digits: it needs "1,234" as "one thousand two
          hundred thirty four" and "1990s" as "nineteen nineties". The spoken words must be plain
          words that a backend can feed to its lexicon without a number parser, so the value
          holds no digit, hyphen or comma that would change how the text is split into clauses.
          Numbers inside identifiers, compounds and other scripts are not numbers the library can
          read safely, so they stay as written rather than being guessed.
        children:
          - SpeechTextEn-Normalization-NumberReading
          - SpeechTextEn-Normalization-YearsAndDecades
          - SpeechTextEn-Normalization-DigitGroupReading
          - SpeechTextEn-Normalization-NumericCultureInvariance
        tests:
          - SpeechTextEn_Analyze_Numbers_AreSpokenAsWordsWithoutChangingText
          - SpeechTextEn_Analyze_NumericSentenceBreaks_FollowTheSentenceEnd

      - id: SpeechTextEn-Normalization-CurrencyAndUnits
        title: >-
          The library shall annotate currency amounts written with the symbols $, euro, pound and
          yen or the codes USD, EUR, GBP and JPY (with cents, singular and plural, and magnitude
          words), percentages and the listed units of measure after a number with their spoken
          words, singular for exactly one and plural otherwise.
        tags: [system]
        justification: |
          "$5.50" is "five dollars and fifty cents" and "1 kg" is "one kilogram"; a model that
          reads the symbols and the letters of the units as written would say neither. The
          singular and plural agree with the amount, and a closed, documented table of units
          keeps ambiguous letters such as "m" and "in" from being reworded.
        children:
          - SpeechTextEn-Normalization-CurrencyReading
          - SpeechTextEn-Normalization-UnitsReading
        tests:
          - SpeechTextEn_Analyze_CurrencyAndUnits_AreSpokenAsWords

      - id: SpeechTextEn-Normalization-DatesAndTimes
        title: >-
          The library shall annotate clock times (with or without a meridiem), numeric dates and
          dates written with a month name with their spoken words, shall give the spoken form of
          the month and weekday abbreviations from the date context around them, and shall report
          the sentence breaks that follow from those abbreviations.
        tags: [system]
        justification: |
          "5:30pm" is "five thirty P M" and "12/25/2024" is a date, not a fraction; the day and the
          year next to a month name are read as an ordinal and a year. "Jan. 5" and "Sat. 5 Jan.
          2024" contain periods that do not end a sentence, whereas "He left Mon. He came Tue."
          contains two that do, so the abbreviation's reading must set the sentence breaks the
          tokenizer gets wrong. "We finished in May. 5 people stayed." keeps its sentence end and
          reads the number as a cardinal, while "Jan. 5" stays one date.
        children:
          - SpeechTextEn-Normalization-TimeReading
          - SpeechTextEn-Normalization-DateReading
          - SpeechTextEn-Normalization-AbbreviationResolution
        tests:
          - SpeechTextEn_Analyze_DatesAndTimes_AreSpokenAsWords
          - SpeechTextEn_Analyze_MonthAndWeekdayAbbreviations_ResolveFromDateContext
          - SpeechTextEn_Analyze_FullMonthPeriod_EndsTheSentenceAndGivesNoDateContext

      - id: SpeechTextEn-Normalization-NumericAmbiguity
        title: >-
          The library shall read a number whose reading the words around it do not decide (a
          four-digit year or quantity, a month-first or day-first numeric date, a fraction that
          could be a date) by a documented default, shall count each such reading in the
          diagnostics, and shall never guess silently.
        tags: [system]
        justification: |
          "1999" can be a year or a quantity and "3/4/2024" can be March or April; no rule is
          right for all text. A documented default makes the choice predictable, and the count of
          defaults tells a host how often the normalization had to guess, which is the evidence
          for refining the rules.
        children:
          - SpeechTextEn-Normalization-NumberAmbiguity
          - SpeechTextEn-Analysis-DiagnosticsAggregation
        tests:
          - SpeechTextEn_Analyze_AmbiguousNumbers_UseDocumentedDefaultsAndAreCounted
          - SpeechTextEn_Diagnostics_NumericCounts_AreReportedAsCountsOnly

      - id: SpeechTextEn-Normalization-NumericLimits
        title: >-
          The library shall bound the numbers it reads (at most 15 digits as a cardinal, a longer
          digit run read digit by digit up to 64 digits, a longer one or one outside the supported
          shapes left as written), shall count each number it could not read as written in the
          diagnostics, and shall keep every spoken value to a fixed maximum size.
        tags: [system]
        justification: |
          A text may contain digit runs of any length, such as hashes, serial numbers or pasted
          data. Reading a million digits aloud, or building a spoken value of unbounded size, would
          stall speech and exhaust memory, so the numbers are bounded by documented limits, the
          ones beyond them are left as they were written, and the count tells a host that it
          happened.
        children:
          - SpeechTextEn-Normalization-NumberLimits
        tests:
          - SpeechTextEn_Analyze_OversizedNumbers_AreBoundedAndCounted

      - id: SpeechTextEn-Normalization-SentenceBoundaries
        title: >-
          The library shall end a sentence after an abbreviation period only where the
          abbreviation is read as the last word of its sentence, shall keep a name suffix and
          its credentials ("John Smith Jr. Ph.D.") in one sentence, and shall report the
          sentence breaks accordingly.
        tags: [system]
        justification: |
          A period after "Dr." does not end a sentence, but the period after "Main St." in "I
          live on Main St. It is nice." does. The tokenizer cannot tell them apart without
          knowing how the abbreviation is read, and a wrong break gives a model a fragment
          without its context or a run-on sentence, so the reported breaks must follow the
          reading chosen for the abbreviation. A break between a name suffix and its credential
          would cut a name in two.
        children:
          - SpeechTextEn-Normalization-SentenceBoundaryReconciliation
          - SpeechTextEn-Analysis-NormalizationAnnotations
        tests:
          - SpeechTextEn_Analyze_AbbreviationAtSentenceEnd_BreaksAfterItAndKeepsThePeriod
          - SpeechTextEn_SynthesisSession_AbbreviationBreaks_DriveChunkBoundaries
          - SpeechTextEn_Analyze_CredentialsAfterNameSuffix_StayInOneSentence
          - SpeechTextEn_SynthesisSession_NameWithCredentials_IsOneChunk

      - id: SpeechTextEn-Normalization-SymbolsAndClitics
        title: >-
          The library shall give the spoken form of non-numeric symbols that stand for words
          (speaking adjacent symbols as separate words),
          shall canonicalize typographic apostrophes inside contractions and elisions, shall
          drop invisible formatting characters only as explicit annotated edits, and shall make
          the role of each clitic available to the caller.
        tags: [system]
        justification: |
          A model reads "&" and the copyright sign as nothing unless it is told the words, and a
          typographic apostrophe in "don't" can defeat a lexicon lookup that expects an ASCII one.
          Invisible characters such as a soft hyphen or a zero-width space would be heard as a
          break or as
          noise, so they are dropped, but never silently. Knowing whether "'s" is a possessive or
          a contraction of "is" or "has" lets a model package choose the pronunciation without
          re-parsing the text.
        children:
          - SpeechTextEn-Normalization-SymbolsAndMarks
          - SpeechTextEn-Normalization-ApostropheAndClitics
        tests:
          - SpeechTextEn_Analyze_Symbols_AreSpokenAsWords
          - SpeechTextEn_Analyze_AdjacentMarks_AreSpokenAsSeparateWords
          - SpeechTextEn_Analyze_TypographicApostrophes_AreCanonicalized
          - SpeechTextEn_Analyze_InvisibleCharacters_AreDroppedExplicitly
          - SpeechTextEn_AnalyzeDetailed_Clitics_RecordTheirRole

      - id: SpeechTextEn-Normalization-AcronymsAndInitialisms
        title: >-
          The library shall recognize acronyms and initialisms case-sensitively, shall speak the
          initialisms letter by letter, and shall leave acronyms that are spoken as words, and
          the ordinary words that merely resemble an initialism, unchanged.
        tags: [system]
        justification: |
          "FBI" is spelled out and "NASA" is a word; "US" is the country and "us" is a pronoun.
          Only the exact capitalization carries that information, so matching must be
          case-sensitive and must not treat every capitalized word as an acronym.
        children:
          - SpeechTextEn-Normalization-AcronymHandling
        tests:
          - SpeechTextEn_Analyze_AcronymsAndInitialisms_AreCaseSensitive

      - id: SpeechTextEn-Normalization-SpelledInitialisms
        title: >-
          The library shall annotate every replacement that is a sequence of single capital
          letters (an initialism, a dotted initialism, a single-letter initial, a credential such
          as Ph.D., the letters of a meridiem and a word a host asked to spell out) with a
          spell-out annotation instead of a normalization annotation, shall give it a value of
          capital letters separated by single spaces that a backend speaks by letter name and
          never as a word, shall give the meridiem letters of a number glued to a meridiem
          ("5pm", "5:30pm") a spell-out annotation of their own, adjacent to and not overlapping
          the annotation of the number or time words, shall speak every normalization annotation
          value as words (a host's "Say" payload of "I" included), shall decompose an ampersand
          initialism into letter spans and an "and" span, and shall leave the spoken text of
          every such replacement unchanged.
        tags: [system]
        justification: |
          A phoneme backend that receives the replacement "A" or "I" as plain text cannot tell
          the letter from the article or the pronoun, so a letter sequence has to carry its own
          annotation kind that promises letter names. The kind is the only signal: a backend
          that inferred spelling from the content of a normalization value would spell a host's
          "Say" payload of "I", so a glued meridiem is split into a words span and a letters
          span instead of being left inside one normalization value. The ampersand of "AT&T" is
          the word "and",
          not a letter, so such a token is split into spans that each keep that promise. Moving
          initialisms to the new kind changes only the annotation kind, never the words a
          consumer that applies both kinds speaks, so the earlier golden spoken texts hold.
        children:
          - SpeechTextEn-Analysis-SpelledInitialismAnnotations
          - SpeechTextEn-Normalization-SpelledReplacements
        tests:
          - SpeechTextEn_Analyze_SpelledInitialisms_AreAnnotatedAsSpellOut
          - SpeechTextEn_Analyze_AmpersandInitialisms_AreDecomposedIntoLetterSpans
          - SpeechTextEn_Analyze_Meridiems_AreTypedSpellOutSpans
          - SpeechTextEn_Analyze_SayOverrideWithSingleLetterPayload_IsNotSpelled

      - id: SpeechTextEn-Overrides-WordOverrides
        title: >-
          The library shall let a host supply a dictionary of pronunciation overrides, each
          matching one whole word of the analyzed text, and shall apply the matching entry to that
          word by annotation only, without rewriting the text: speaking the word as written,
          replacing it with plain words (a normalization annotation), spelling it letter by letter
          (a spell-out annotation) or giving a backend a phoneme string for it (a pronunciation
          annotation, which replaces nothing), and shall reject a dictionary when normalization
          is not selected.
        tags: [system]
        justification: |
          No built-in table knows a product name, a brand or a person's name, and a model that
          mispronounces it cannot be fixed by editing the library. A host must be able to say
          how a word is spoken, as written, as other words, letter by letter or with exact
          phonemes, and the Speech library's annotations are positions in the text it supplied, so
          the override has to be an annotation like every other normalization. Overrides are applied
          by the normalization pass, so accepting a dictionary and silently ignoring it would hide a
          configuration mistake.
        children:
          - SpeechTextEn-Analysis-OverrideAnnotations
          - SpeechTextEn-Normalization-TokenDirectives
        tests:
          - SpeechTextEn_Analyze_Overrides_AnnotateWholeWordsPerAction
          - SpeechTextEn_Analyze_OverrideActions_ReadBackThroughTypedReaders

      - id: SpeechTextEn-Overrides-Precedence
        title: >-
          The library shall let an override win over every built-in normalization rule for the
          spoken form of its word, a case-sensitive entry over a case-insensitive one, shall leave
          a word that an
          earlier multi-token match has already consumed (the unit of "5 kg", the magnitude of
          "$5 million", the meridiem of "5 pm") to that match, shall count such an override as
          ignored, and shall leave the sentence breaks, and so the chunks, exactly as they are
          without the override, even for an abbreviation word whose period the tokenizer separates
          ("Fig" in "See Fig. 5 for details.").
        tags: [system]
        justification: |
          A host that asks for "US" to be spoken as written must not be overruled by the
          acronym table, and a name that differs from a common word only in case needs the exact
          spelling to win. A number with its unit or magnitude is one construct that the number
          rules read as a whole, so an override for the unit word cannot be applied to part of it;
          doing so silently would be a surprise, so the override is ignored and the count says
          that it happened. An override changes how a word is spoken, never where a sentence
          ends: a changed break would split "See Fig." from "5 for details." in synthesis.
        children:
          - SpeechTextEn-Analysis-OverrideAnnotations
          - SpeechTextEn-Normalization-TokenDirectives
        tests:
          - SpeechTextEn_Analyze_OverridePrecedence_UserOverridesBuiltInRules
          - SpeechTextEn_Analyze_OverrideOnConsumedToken_IsIgnoredAndCounted
          - SpeechTextEn_Analyze_OverrideOnAbbreviationWord_KeepsSentenceBreaksAndChunks

      - id: SpeechTextEn-Overrides-Dictionary
        title: >-
          The library shall build a pronunciation dictionary from entries or from a tab-separated
          file, validating every entry and bounding its size, shall report a bad entry or line by
          its position and a fixed reason but never by its content, and shall keep the dictionary
          immutable and safe to share across analyzers, requests and threads.
        tags: [system]
        justification: |
          A dictionary is host configuration, usually a text file kept by someone who is not a
          programmer, so a mistake must be reported with its line number; it may contain names that
          must never appear in an error message or log; it comes from a file the host does not
          control, so its size is bounded; and one instance serves every request of a model on
          many threads, so it cannot change after it was validated.
        children:
          - SpeechTextEn-Analysis-OverrideDictionary
        tests:
          - SpeechTextEn_Overrides_SampleDictionaryFile_LoadsAndDrivesAnalysis
          - SpeechTextEn_Overrides_SharedAnalyzerConcurrentRequests_ReturnIdenticalResults

      - id: SpeechTextEn-Normalization-AlignmentContract
        title: >-
          The library shall place every normalization, every spell-out and every pronunciation
          on exact spans of the analyzed text. The normalizations and spell-outs together shall be
          in text order and not overlap, the pronunciations shall be in text order and overlap
          neither each other nor a normalization or spell-out, and every span shall start and end
          on non-whitespace characters and contain no whitespace and no semicolon (a comma or colon
          only between two digits of a number); spell-out values shall be capital letters separated
          by single spaces. The library shall leave case and punctuation outside the spans
          untouched, shall drop no
          character of the text silently, shall give each token of a multi-token numeric
          construct (a date, an amount with a magnitude word, a mixed number) its own span, and
          shall lose no annotation when the Speech library chunks the text, including a chunk
          that consists only of symbols and a sentence or clause cut between the tokens of a
          date or an overridden word.
        tags: [system]
        justification: |
          The Speech library re-bases annotations onto its chunks and discards one that starts
          or ends on trimmed whitespace, covers a placeholder or is split by a chunk boundary, so
          a span that breaks these rules would silently lose its normalization. A reader must
          also be able to trust that the only differences between the original text and its
          spoken form are the annotated spans, which is what makes the normalization auditable;
          a consumer applies the normalizations and the spell-outs as one sequence, so they cannot
          overlap each other, and a pronunciation is attached to a word that is not also replaced.
          A text such as "&" has no letter or digit, so chunking that treated it as punctuation
          would discard the word it was normalized to. A numeric construct such as "January 5,
          2024" or "$5 million" crosses spaces and a comma that the chunker may cut at, so each
          of its tokens carries its own span rather than one span across the gap, and the only
          comma or colon inside a span is the one inside a number ("1,234.50", "5:30"), which the
          chunker never cuts.
        children:
          - SpeechTextEn-Normalization-SpanContract
          - SpeechTextEn-Normalization-ChunkSafeSpans
          - SpeechTextEn-Normalization-DecomposedAnnotations
          - SpeechTextEn-Normalization-SpelledReplacements
          - SpeechTextEn-Normalization-TokenDirectives
        tests:
          - SpeechTextEn_Analyze_NormalizedText_AnnotationsSatisfyAlignmentContract
          - SpeechTextEn_SynthesisSession_NormalizedText_AnnotationsSurviveChunking
          - SpeechTextEn_SynthesisSession_NormalizedTextWithAudioTag_KeepsBothAnnotations
          - SpeechTextEn_SynthesisSession_SymbolOnlyText_KeepsItsNormalization
          - SpeechTextEn_SynthesisSession_SymbolBeforeClausePunctuation_KeepsItsNormalization
          - SpeechTextEn_SynthesisSession_InvisibleOnlyClause_KeepsDroppedAnnotationWithItsNeighbor
          - SpeechTextEn_SynthesisSession_InvisibleOnlyClauseWithPartOfSpeech_IsMergedIntoItsNeighbor
          - SpeechTextEn_SynthesisSession_BareSymbolClauseWithPartOfSpeech_IsMergedIntoItsNeighbor
          - SpeechTextEn_Analyze_NumericText_AnnotationsSatisfyAlignmentContract
          - SpeechTextEn_SynthesisSession_NumericText_AnnotationsSurviveChunking
          - SpeechTextEn_SynthesisSession_DateAcrossClauseCut_KeepsEveryTokenAnnotation
          - SpeechTextEn_SynthesisSession_PercentSymbolChunk_KeepsItsNormalization
          - SpeechTextEn_SynthesisSession_NumbersAtBudgetCut_AreNeverSplit
          - SpeechTextEn_Analyze_NumberNextToAudioTag_KeepsBothAnnotations
          - SpeechTextEn_Analyze_Overrides_AnnotationsSatisfyAlignmentContract
          - SpeechTextEn_SynthesisSession_OverrideAnnotations_SurviveChunking
          - SpeechTextEn_SynthesisSession_OverridesAroundAudioTag_KeepEveryAnnotation

      - id: SpeechTextEn-Normalization-LargeInputAndCancellation
        title: >-
          The library shall return correct annotations and sentence breaks for large, repetitive,
          adversarial and digit-heavy texts, shall give the same result for the same text however
          long or repetitive it is, and shall stop analyzing when the request is canceled.
        tags: [system]
        justification: |
          The analyzer runs on every synthesis request, including texts pasted from documents
          and data, so a pathological text (a megabyte of numbers, or one enormous digit run)
          must be handled exactly like any other text, and a stopped or disposed engine waits
          for the analyzer to return, so a canceled request must end promptly. How the scan is
          kept linear is a design matter (see the normalization subsystem design); here the
          behavior is the contract.
        children:
          - SpeechTextEn-Normalization-LongInputAndCancellation
        tests:
          - SpeechTextEn_Analyze_LargeRepetitiveTexts_AnnotatesEveryRepetitionAlike
          - SpeechTextEn_Analyze_CanceledToken_ThrowsOperationCanceledException
          - SpeechTextEn_Analyze_LargeRepetitiveNumericTexts_AnnotatesEveryRepetitionAlike

      - id: SpeechTextEn-Heteronym-Readings
        title: >-
          The library shall, when the reading annotation family is selected and a heteronym model
          is available, annotate each word of an English text that has more than one reading in
          the reading inventory (and each single-reading form of the inventory) with the id of its
          reading and a confidence, as two annotations on the word's exact span that coexist with
          the part-of-speech annotation, are never placed on text that carries a normalization,
          a spell-out or a pronunciation, and survive the Speech library's chunking of the text.
        tags: [system]
        justification: |
          English spells different words alike ("record" the noun and "record" the verb), and a
          phoneme-driven model can only pronounce them correctly if something decides which one a
          sentence means. The reading id names the decision in a stable vocabulary and the
          confidence lets a backend or a host judge it. The annotations belong to the word and
          nothing else: a span that is already replaced, spelled or pronounced by another rule has
          a spoken form, so a reading there would contradict it, and the Speech library re-bases
          the annotations of a long text onto its chunks, so they have to hold up in whichever
          chunk the word lands.
        children:
          - SpeechTextEn-Analysis-ReadingAnnotations
          - SpeechTextEn-Heteronym-Classification
          - SpeechTextEn-Heteronym-Confidence
        tests:
          - SpeechTextEn_SynthesisSession_AnnotatedBackend_ReceivesReadingsThatSurviveChunking
          - EnglishTextAnalyzer_Analyze_MixedCorpus_ReadingNeverOverlapsReplacementOrPronunciation

      - id: SpeechTextEn-Heteronym-ModelAvailability
        title: >-
          The library shall emit no reading for a text when no heteronym model is available, as
          is the case for the default analyzer of this release, which embeds none, so that a host
          that does nothing sees the same annotations as before, shall give concurrent requests
          that use a valid, compatible model the same readings as sequential requests, and shall
          continue without readings, with one warning per analyzer, when a model is damaged or
          incompatible.
        tags: [system]
        justification: |
          The reading runtime ships before the first trained weights do, and a host must be able
          to upgrade without any change in behavior: nothing is emitted until a model is
          supplied. When a model is supplied, every request that contains a word of the inventory
          gets the same readings however many requests run at once, and a model that cannot be
          used must not break speech, so the analysis goes on as if there were none and the host
          is told once. (When the model is loaded, and that it is loaded once and shared, is a
          design choice recorded in the heteronym subsystem design, not a requirement.)
        children:
          - SpeechTextEn-Analysis-ReadingModelAvailability
          - SpeechTextEn-Heteronym-ModelSupply
        tests:
          - SpeechTextEn_Analyze_DefaultAnalyzerWithoutModel_EmitsNoReadingAnnotations
          - SpeechTextEn_Analyze_ReadingsOnSharedAnalyzerConcurrentRequests_ReturnIdenticalResults

      - id: SpeechTextEn-Heteronym-ModelIntegrity
        title: >-
          The library shall load a heteronym model only from a file that passes strict
          validation of its header, payload, checksum and compression and whose feature set and
          reading-inventory version the runtime supports, shall reject every other file with a
          clear error rather than a crash, and shall never apply a
          model to the wrong readings.
        tags: [system]
        justification: |
          A model file is data from outside the process: it can be truncated, corrupted, hostile
          or trained for another version of the reading inventory. Trusting it would risk wrong
          pronunciations of common words, an out-of-memory failure or a crash on the speech path,
          so every defect is detected before any weight is used, and a model is bound to reading
          ids so that an inventory that adds or reorders readings cannot silently change what a
          weight means.
        children:
          - SpeechTextEn-Heteronym-SparseFormat
          - SpeechTextEn-Heteronym-InventoryModelCompatibility
          - SpeechTextEn-Analysis-ReadingModelAvailability
        tests:
          - EnglishTextAnalyzer_Analyze_ModelWarning_OncePerAnalyzerOnlyForUnusableModel
          - EnglishTextAnalyzer_Analyze_IncompatibleModel_NoReadingsAndOneWarning

      - id: SpeechTextEn-Heteronym-Determinism
        title: >-
          The library shall derive the features of a reading decision, and shall write the
          confidence of a reading, identically on every operating system, runtime and current
          culture, so that a model trained on one machine decides the same way on every other.
        tags: [system]
        justification: |
          The weights are indexed by hashed features. A feature derivation that depends on the
          culture (a Turkish dotted I), the platform or the runtime would make a model decide
          differently from the one that was trained, which no test of the weights alone could
          reveal. The feature encoding is therefore specified exactly for each feature-set
          version (see the heteronym subsystem design for the encoding and its hash functions) and
          checked against golden vectors, and the confidence is written
          with the invariant culture so that a backend can always parse it.
        children:
          - SpeechTextEn-Heteronym-FeatureDeterminism
          - SpeechTextEn-Analysis-ReadingAnnotations
        tests:
          - HeteronymFeatureExtractor_Extract_GoldenVectors_MatchFileUnderEveryCulture
          - EnglishTextAnalyzer_Analyze_ConfidenceText_IsInvariantUnderTurkishAndFrenchCultures

      - id: SpeechTextEn-Heteronym-OverridesFirst
        title: >-
          The library shall let a host fix the reading of a word with a reading entry of the
          pronunciation dictionary (validated against the reading inventory), shall emit that
          reading with a confidence of 1.000 without any model, shall let it beat the classifier,
          and shall never classify a word that carries any other override.
        tags: [system]
        justification: |
          A classifier is right most of the time, not always, and a host that knows the reading
          of a product name or a recurring phrase must be able to say so, with the same
          dictionary it already uses for pronunciations. An override is the host's decision, so
          it needs no model and no confidence below certainty, and a word the host has replaced,
          spelled, skipped or pronounced has been decided by the host and must not be overruled
          by a guess.
        children:
          - SpeechTextEn-Analysis-ReadingOverrides
        tests:
          - SpeechTextEn_Analyze_ReadingOverride_BeatsClassifierAndNeedsNoModel

      - id: SpeechTextEn-Heteronym-Diagnostics
        title: >-
          The library shall report the readings assigned to an analyzed text as one aggregate
          event of counts only (readings classified, single-candidate, set by override and below
          the confidence threshold) to the host's diagnostics sink, shall never include any text,
          word or reading id in it, shall report an unusable model once per analyzer, and shall
          not let a failing sink interrupt an analysis.
        tags: [system]
        justification: |
          The Speech library's diagnostics contract forbids synthesized text in any report, so a
          host can learn how many readings were decided and how many were doubtful, which is the
          evidence for tuning the threshold or fixing a word with an override, but never which
          words they were. An unusable model is the one condition a host can act on, so it is
          reported, but once, not on every request.
        children:
          - SpeechTextEn-Analysis-ReadingDiagnostics
        tests:
          - SpeechTextEn_Diagnostics_Readings_AreCountsOnly
          - EnglishTextAnalyzer_Analyze_ModelWarning_OncePerAnalyzerOnlyForUnusableModel
          - EnglishTextAnalyzer_Analyze_ThrowingSink_IsContained

      - id: SpeechTextEn-Packaging-LicenseNotices
        title: >-
          The package shall declare the MIT License only, through a license file that starts with
          the SPDX expression MIT and contains the MIT license text, shall state that it embeds
          two lexicon tables of its own (abbreviations and initialisms) under that license and
          no third-party data, and that the part-of-speech tagging package it requires is a
          separate dependency with its own license files, and shall carry a dependency notice that
          reproduces the attribution of that dependency's embedded data; both files shall be
          packed at the package root.
        tags: [system]
        justification: |
          What the package contains is code and two small lexicon tables that DEMA Consulting
          wrote from scratch, all under the MIT License, so that is all it may declare; claiming
          the licenses of a dependency's data would misstate what a consumer receives, and saying
          nothing of the tables would hide that the package now embeds data. The required
          package, DemaConsulting.PartOfSpeech, is restored separately and carries its own
          license files, but its embedded lexicon and weights come from Open English WordNet
          (CC BY 4.0, derived from Princeton WordNet) and the Manually Annotated Sub-Corpus
          (CC BY 3.0 US), so a consumer of this package should be able to see what the
          dependency contains and under which licenses. The dependency notice (clearly scoped as
          such) does that, and will be revisited if a later increment embeds third-party data in
          this package.
          The built package is inspected: the FileAssert test checks that both files are at the
          package root of the .nupkg with the required content and that the .nuspec names the
          license file, and the project-file and file-content tests check the same properties
          against the repository files.
        tests:
          - SpeechTextEn_PackageLicense_ProjectFile_NamesLicenseFileAtPackageRoot
          - SpeechTextEn_PackageLicense_File_DeclaresMitOnlyAndPointsToDependencyNotice
          - SpeechTextEn_ThirdPartyNotices_File_AttributesDependencyData
          - TextEn_PackageLicenseFiles_Content

      - id: SpeechTextEn-Isolation-RequestNoninterference
        title: >-
          The library shall give each analysis request a result and diagnostics that depend only
          on that request's own text and configuration, so that the results and diagnostics of a
          request never disclose text from any other request, also when requests run one after
          another or concurrently on one analyzer.
        tags: [system]
        justification: |
          The core ITextAnalyzer contract requires an analyzer not to retain the request text,
          which is the user's speech content, and one analyzer serves many requests. What a host
          or a backend can observe of that is noninterference: the result and the diagnostics of
          a request carry nothing of another request and equal what a fresh analyzer would give.
          That is what this requirement states and the tests prove. The stronger design obligation
          that the library and its tagging dependency keep no reference to analyzed text in
          memory (the dependency's working buffers, the repository's pin of a version that
          clears them, and the analyzer's own state) cannot be observed through the public
          interface; it is recorded in the system design and in the PartOfSpeech verification
          document and is not claimed to be proven by test.
        tests:
          - SpeechTextEn_Analyze_AfterAnotherRequest_ResultAndDiagnosticsDiscloseNothingOfIt
          - SpeechTextEn_Analyze_ConcurrentRequestsWithDifferentTexts_EachGetsItsOwnResult

      - id: SpeechTextEn-Packaging-PrereleaseOnly
        title: >-
          While the part-of-speech tagging package it depends on is a pre-release, the package
          shall be packed only for a pre-release package version, so that a stable version packs
          every other package and neither fails nor publishes a stable package that depends on a
          pre-release one.
        tags: [system]
        justification: |
          NuGet does not allow a stable package to depend on a pre-release package (NU5104).
          The shared build and release workflows pack every packable project with one version,
          and the release version can be stable, so the project is packable only when the
          effective package version (PackageVersion when given, otherwise Version, ignoring
          build metadata) has a prerelease label. A stable version then skips this project
          and still packs the other packages, and a pre-release version, including the
          versions of the push build and of the pack verification, packs it. This is a
          temporary guard: the requirement and the guard are removed once
          DemaConsulting.PartOfSpeech ships a stable release and the pin moves to it, and the
          test fails if the guard outlives a pre-release pin. The test evaluates the project
          through the dotnet command line tool for stable, prerelease and build-metadata
          versions, so it checks the packing outcome and not how the project file spells the
          condition; the build script's pack verification checks that a package is actually
          produced.
        tests:
          - SpeechTextEn_PackageVersion_EvaluatedProject_PacksOnlyPrereleaseWhileTaggerIsPrerelease

      - id: SpeechTextEn-Packaging-PinnedDependency
        title: >-
          The package shall depend on exactly one version of the part-of-speech tagging package
          and on no speech-engine inference runtime.
        tags: [system]
        justification: |
          The tagging package is a pre-release package whose results can change between
          versions, so a floating version would silently change the analysis a model builds on.
          The analysis is plain managed text processing and must stay usable by any model
          package, so it must not drag an inference runtime into every consumer. The test
          inspects the evaluated package and project references of the project (through the
          dotnet command line tool), not the text of the project file. The minimum acceptable
          version of the tagging package is a dependency policy recorded in the system design.
        tests:
          - SpeechTextEn_Dependencies_EvaluatedReferences_PinTaggerExactlyAndReferenceNoInferenceRuntime

      - id: SpeechTextEn-Packaging-ReadingInventory
        title: >-
          The package shall supply the documented heteronym reading inventory (the readings, the
          forms and the candidate readings of each form) from the package itself, with no
          separate download or file, and shall include no heteronym model in this release.
        tags: [system]
        justification: |
          The reading ids that hosts name in overrides and that backends receive in annotations
          are defined by this inventory, so it must travel with the code that validates them and
          cannot be a separate download. The data is CC0 data written by DEMA Consulting. No
          model is included until trained weights are reviewed and released, and a test fails if
          one appears before the release is meant to carry it. How the tables are embedded
          (linked from the repository's Text.En data so the trainer and the runtime share one
          source, under resource names the loader asks for) is a design matter recorded in the
          heteronym subsystem design.
        children:
          - SpeechTextEn-Heteronym-ReadingIds
        tests:
          - SpeechTextEn_Analyze_ReadingInventoryInPackage_ValidatesReadingOverridesOfflineAndShipsNoModel
          - SpeechTextEn_Analyze_DefaultAnalyzerWithoutModel_EmitsNoReadingAnnotations

      # The training data of the heteronym reading classifier (data/text-en/) is a tool input of the
      # non-shipped Text.En trainer; the requirements below are verified by its check-data command.
      - id: SpeechTextEn-TrainingData-OpenLicenses
        title: >-
          The repository shall hold the Text.En training and evaluation data only under the open
          licenses CC0-1.0, Public-Domain and CC-BY-3.0-US, shall fail its checks for any row under another
          license and for any restricted-license or Misaki data, and shall state that the content
          generated or labeled for it by DEMA Consulting is dedicated to the public domain under CC0 1.0.
        tags: [system]
        justification: |
          The data is meant to be reused and redistributed, including commercially, and to train
          weights that ship with the package in a later release. A single row under a share-alike,
          non-commercial or no-derivatives license would taint all of it, and the owner decided that no
          Misaki data is used and that the content generated by DEMA Consulting, including text
          labeled by language models, is released under CC0 1.0. The license of every row is
          therefore checked on every change.
        children:
          - SpeechTextEn-TrainingData-LicenseGate
        tests:
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks

      - id: SpeechTextEn-TrainingData-Integrity
        title: >-
          The repository shall provide a command that fails when the committed Text.En training
          data is malformed, differs from its committed manifest, or contains a row whose label,
          lemma, source, license or target-word offsets are inconsistent with the reading inventory.
        tags: [system]
        justification: |
          The data is far too large to review by reading, and a silent defect in it (a shifted
          offset, a wrong label, an altered file) would only show up later as a worse classifier.
          A command that checks every file and every row, and that the lint script and the build
          pipeline run, keeps the committed data what its reviewed manifest says it is.
        children:
          - SpeechTextEn-TrainingData-CheckCommand
          - SpeechTextEn-TrainingData-FileFormat
          - SpeechTextEn-TrainingData-ManifestVerification
          - SpeechTextEn-TrainingData-SchemaValidation
        tests:
          - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_ManifestDrift_NamesFileAndPassesAfterRegeneration

      - id: SpeechTextEn-TrainingData-EvaluationIsolation
        title: >-
          The repository shall never hold the evaluation-only corpora used to measure heteronym
          resolution, shall fail its checks when the committed training, development and holdout
          data share a sentence, a document or a template, and, when an operator supplies local copies of
          the evaluation sets, shall also fail when a row repeats or nearly repeats an evaluation sentence.
        tags: [system]
        justification: |
          A classifier is only measured honestly on sentences it did not train on, and the evaluation
          corpora are licensed for evaluation only, so the owner decided that they are never committed
          and never trained on. The separation of the committed splits is a build gate; the comparison
          with the external sets can only be run by someone who has them, so it is optional.
        children:
          - SpeechTextEn-TrainingData-LeakageGate
        tests:
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_ExternalOverlap_IsReportedWhenSetsSupplied
          - TrainingDataSubsystem_CheckData_NoEvaluationSets_PassesAndSaysSkipped

      - id: SpeechTextEn-TrainingData-Provenance
        title: >-
          The repository shall record for every committed training row where it came from (a source
          document with its license, or the record of how it was generated), shall carry the attribution
          that its licenses require, and shall fail its checks when a row has no record or a record has
          no row.
        tags: [system]
        justification: |
          A license claim is only as good as the record behind it. Every harvested row needs
          its source document, every generated row the template or the language-model labeling it came
          from, and the attribution that the CC-BY-3.0-US rows require must travel with the data, so
          that the claims can be checked and later audited.
        children:
          - SpeechTextEn-TrainingData-ProvenanceGate
        tests:
          - TrainingDataSubsystem_CheckData_SingleViolation_ExitsOneNamingTheCheck
          - TrainingDataSubsystem_CheckData_CommittedData_PassesAllChecks
