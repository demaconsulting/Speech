---
# Software Unit Requirements for SherpaOnnxRecognitionEngine
#
# These requirements describe the design-level behavior of the SherpaOnnxRecognitionEngine unit,
# the real sherpa-onnx implementation of the Speech library's public IRecognitionBackend seam,
# decomposing the parent SpeechSherpa RecognitionSubsystem requirements. These requirements moved
# here, renamed from Speech-Recognition-RecognitionBackend-*, when the engine moved out of the
# Speech library into SpeechSherpa; the seam-level MockableSeam and ModelOwnedConfiguration
# requirements remain with the Speech library's RecognitionSubsystem.

sections:
  - title: SpeechSherpa Requirements
    sections:
      - title: RecognitionSubsystem Requirements
        sections:
          - title: SherpaOnnxRecognitionEngine Requirements
            requirements:
              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-SessionEndResetDiscardsBufferedAudio
                title: >-
                  The SherpaOnnxRecognitionEngine class's session-end Reset() shall discard audio already
                  accepted but not yet decoded, not just the decoder's current hypothesis, so an
                  abandoned utterance cannot bleed into the next session's decoding.
                justification: |
                  A streaming transducer buffers accepted audio pending future context that the
                  native Reset(stream) call does not discard; left undiscarded, that buffered
                  audio decodes into the next session as soon as any audio - even silence -
                  supplies the missing future context, so an abandoned utterance (for example a
                  push-to-talk release with no trailing silence) would otherwise bleed into the
                  next StartAsync().
                tests:
                  - SherpaOnnxRecognitionEngine_Reset_AbandonedUtteranceWithNoTrailingSilence_DoesNotBleedIntoNextSession

              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-TryFlushRecoversTrailingAudio
                title: >-
                  The SherpaOnnxRecognitionEngine class's TryFlush() shall finalize and decode audio
                  already accepted but not yet decoded, delivering it as a final result rather
                  than losing it, before a session-end Reset() discards whatever remains.
                justification: |
                  A streaming transducer sometimes cannot decode the tail of an utterance without
                  more audio a caller who has just stopped will never supply - for example a
                  push-to-talk release with no trailing silence. Without a way to finalize that
                  tail, the only alternative is to discard it unread (see
                  SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-SessionEndResetDiscardsBufferedAudio),
                  silently losing the last word a user spoke. The native engine's own
                  InputFinished mechanism exists precisely to force a decode of buffered audio
                  without needing genuine future context, so this recovers that audio instead of
                  losing it.
                tests:
                  - SherpaOnnxRecognitionEngine_TryFlush_AbandonedUtteranceWithNoTrailingSilence_RecoversTrailingWords

              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-PostEndpointSpeechPreserved
                title: >-
                  For a model that declares a positive post-reset warm-up interval
                  (IRecognitionModel.PostEndpointWarmupWindowMs), the SherpaOnnxRecognitionEngine
                  class shall not lose words of speech delivered across an endpoint because of that
                  interval.
                justification: |
                  SherpaOnnxNemotronStreamingEnRecognitionModel's endpoint detector was confirmed,
                  on two real user recordings, to fire as a false positive mid-utterance; the
                  resulting reset exposes a measured ~550ms encoder warm-up blackout that
                  silently drops genuinely spoken audio landing in that window (for example "that
                  is" dropped from "To be or not to be... that is the question"). The user-visible
                  defect is the loss of genuinely spoken words, so the outcome is that speech
                  resuming immediately after an endpoint is transcribed completely. (The design
                  recovers the audio by buffering a rolling window of pre-endpoint audio and
                  replaying it into the freshly reset stream; see the SherpaOnnxRecognitionEngine
                  design.)
                tests:
                  - SherpaOnnxRecognitionEngine_Transcribe_NemotronPausesBetweenPhrases_LosesAndDuplicatesNoWords
                  - SherpaOnnxRecognitionEngine_Transcribe_RealCrossingTheBarRecording_NemotronWordErrorRateBelowTolerance

              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-PostEndpointNoDuplicateResults
                title: >-
                  The SherpaOnnxRecognitionEngine class shall not report a recognition result for
                  speech it has already reported, so no words are duplicated across an endpoint,
                  and shall report nothing further when asked for results with no new audio.
                justification: |
                  Recovering audio lost to a model's warm-up interval must never show the host
                  duplicated words; a forced replay on a model that did not need it produced
                  genuinely duplicated text, so duplicate-free output is the observable contract
                  for every model.
                tests:
                  - SherpaOnnxRecognitionEngine_Transcribe_NemotronPausesBetweenPhrases_LosesAndDuplicatesNoWords
                  - SherpaOnnxRecognitionEngine_TryDecodeAndTryFlush_NemotronNoNewAudioAfterEndpoint_ReportNothing

              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-SilenceHandling
                title: >-
                  Silence-only input shall not make the SherpaOnnxRecognitionEngine class report
                  any recognized text, and silence preceding speech shall not cause the beginning
                  of that speech to be lost.
                justification: |
                  An endpoint that fires on leading or inter-utterance silence must not corrupt
                  the first genuinely recognized segment that follows it (a regression found by an
                  independent quality review of the original unconditional warm-up handling), and
                  a quiet room must never produce phantom text.
                tests:
                  - SherpaOnnxRecognitionEngine_Transcribe_NemotronSilenceOnly_ReportsNoText
                  - SherpaOnnxRecognitionEngine_Transcribe_NemotronQuietNoiseBeforeSpeech_KeepsOpeningWords

              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-NoWarmupIntervalUnchanged
                title: >-
                  For a model that declares no post-reset warm-up interval, the
                  SherpaOnnxRecognitionEngine class shall transcribe real speech with unchanged
                  results and endpoint sequencing, as if warm-up handling did not exist.
                justification: |
                  Warm-up handling is opt-in per model, because forcing it onto a model that does
                  not exhibit the word-loss defect produced genuine duplicated text; a model that
                  does not opt in must therefore behave exactly as it did before the handling was
                  added.
                tests:
                  - SherpaOnnxRecognitionEngine_Transcribe_ZipformerNoWarmupInterval_ReportsStableFinalResults
                  - SherpaOnnxRecognitionEngine_Transcribe_RealCrossingTheBarRecording_WordErrorRateBelowTolerance
              - id: SpeechSherpa-Recognition-SherpaOnnxRecognitionEngine-RealSpeechAccuracy
                title: >-
                  The SherpaOnnxRecognitionEngine class shall transcribe a clear, single-speaker,
                  studio-quality real human speech recording into text whose Word Error Rate
                  against the recording's known-correct ground-truth transcript does not exceed a
                  documented tolerance, for every real, installed recognition model.
                justification: |
                  Every other automated test for the recognition-backend seam either replaces the real engine with
                  a fake, or drives the real engine with silence and a synthesized sine-wave tone
                  purely to exercise buffer/bookkeeping logic (see the requirements above) - none
                  of them ever assert on actual transcribed text content. That left a genuine,
                  previously unaddressed coverage gap: nothing proved the real, shipped models
                  transcribe real speech correctly. A tolerant Word-Error-Rate comparison, not an
                  exact string match, is required because a real model's raw output legitimately
                  differs from the ground truth in ways that do not reflect a transcription
                  failure - for example Tennyson's archaic spelling "crost" (for "crossed") in the
                  "Crossing the Bar" fixture recording may be rendered as either spelling by a
                  modern model's vocabulary.
                tests:
                  - SherpaOnnxRecognitionEngine_Transcribe_RealCrossingTheBarRecording_WordErrorRateBelowTolerance
                  - SherpaOnnxRecognitionEngine_Transcribe_RealCrossingTheBarRecording_NemotronWordErrorRateBelowTolerance
