---
# Software Subsystem Requirements for the SpeechSherpa SynthesisSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechSherpa
# SynthesisSubsystem, decomposing the system-level requirements in
# docs/reqstream/speech-sherpa.yaml. This subsystem contains a single unit,
# SherpaOnnxSynthesisEngine, the real sherpa-onnx implementation of the Speech library's public
# ISynthesisBackend seam; all synthesis policy above that seam (Layer 2 rendering, chunking,
# session state machine, cancellation, fault containment) remains in the Speech library's own
# SynthesisSubsystem.
#
# Unit-level content lives in
# docs/reqstream/speech-sherpa/synthesis-subsystem/sherpa-onnx-synthesis-engine.yaml, including
# the tests that exercise SherpaOnnxSynthesisEngine (test/DemaConsulting.Speech.Sherpa.Tests/
# SynthesisSubsystem/SherpaOnnxSynthesisEngineTests.cs), documented in
# docs/verification/speech-sherpa/synthesis-subsystem.md.

sections:
  - title: SpeechSherpa Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        requirements:
          - id: SpeechSherpa-Synthesis-OfflineBackend
            title: >-
              The SpeechSherpa SynthesisSubsystem shall implement the Speech library's
              ISynthesisBackend seam over sherpa-onnx's offline text-to-speech engine, loading the
              engine from a synthesis model's own configuration.
            justification: |
              The Speech library confines every speech-synthesis interop call behind
              its public ISynthesisBackend seam so its own synthesis policy is verifiable
              without a native runtime. A real, native-backed implementation of that seam is
              what turns that policy into audible speech for the sherpa-onnx synthesis models
              this package ships.
            children:
              - SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-LoadFromConfig
            tests:
              - SherpaOnnxSynthesisEngine_Construct_ReportsModelSampleRate

          - id: SpeechSherpa-Synthesis-OfflineBackendSampleRate
            title: >-
              The SpeechSherpa SynthesisSubsystem shall report the loaded sherpa-onnx engine's
              true output sample rate through the ISynthesisBackend seam.
            justification: |
              The loaded engine's own declared rate is the authoritative rate the Speech
              library's synthesis session must resample from.
            children:
              - SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-SampleRate
            tests:
              - SherpaOnnxSynthesisEngine_Construct_ReportsModelSampleRate

          - id: SpeechSherpa-Synthesis-OfflineBackendGeneration
            title: >-
              The SpeechSherpa SynthesisSubsystem shall generate audio for a given text, speed,
              and speaker id through the ISynthesisBackend seam, rejecting a null text.
            justification: |
              The Speech library's synthesis session drives the backend one rendered segment at
              a time and needs the generated samples to play them through the configured audio
              output device.
            children:
              - SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-Generate
              - SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-ArgumentValidation
            tests:
              - SherpaOnnxSynthesisEngine_Generate_NonEmptyText_ReturnsNonEmptyAudio
              - SherpaOnnxSynthesisEngine_Generate_NullText_ThrowsArgumentNullException

          - id: SpeechSherpa-Synthesis-OfflineBackendLifecycle
            title: >-
              The SpeechSherpa SynthesisSubsystem shall release the loaded sherpa-onnx engine
              deterministically on disposal.
            justification: |
              The loaded engine holds native memory sized to a multi-hundred-megabyte model, so
              it must be released deterministically when the owning synthesizer engine is
              disposed, and idempotent disposal keeps teardown paths safe.
            children:
              - SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-Dispose
              - SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-DisposeIdempotent
            tests:
              - SherpaOnnxSynthesisEngine_Generate_AfterDispose_ThrowsObjectDisposedException
              - SherpaOnnxSynthesisEngine_Dispose_CalledTwice_IsIdempotent
