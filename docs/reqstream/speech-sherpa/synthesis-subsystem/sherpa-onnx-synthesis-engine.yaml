---
# Software Unit Requirements for SherpaOnnxSynthesisEngine
#
# These requirements describe the design-level behavior of the SherpaOnnxSynthesisEngine unit,
# the real sherpa-onnx implementation of the Speech library's internal ISynthesisBackend seam,
# decomposing the parent SpeechSherpa SynthesisSubsystem requirements.
#
# KNOWN GAP: no automated test exercises SherpaOnnxSynthesisEngine anywhere in this repository.
# This gap pre-dates the SpeechSherpa package split and is carried forward unchanged, not
# introduced by the move; it is disclosed in
# docs/verification/speech-sherpa/synthesis-subsystem/sherpa-onnx-synthesis-engine.md. The
# requirements below therefore deliberately list no tests rather than citing evidence that does
# not exist. Real, non-silent audio through this unit was proven only by one-time manual spikes
# recorded in the synthesis models' own verification documents.

sections:
  - title: SpeechSherpa Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        sections:
          - title: SherpaOnnxSynthesisEngine Requirements
            requirements:
              - id: SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-LoadFromConfig
                title: >-
                  The SherpaOnnxSynthesisEngine class shall load a sherpa-onnx offline
                  text-to-speech engine from the OfflineTtsConfig supplied by a synthesis
                  model's own CreateBackend implementation.
                justification: |
                  Each synthesis model owns the engine configuration for its own architecture;
                  the engine must load exactly that configuration so that adding a synthesis
                  model never requires changing the synthesis backend.

              - id: SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-SampleRate
                title: >-
                  The SherpaOnnxSynthesisEngine class shall report the loaded engine's declared
                  output sample rate through ISynthesisBackend.SampleRate.
                justification: |
                  A synthesis model's PreferredAudioFormat is only a best-effort hint; the loaded
                  engine's own declared rate is the authoritative rate the Speech library's
                  synthesis session must resample from.

              - id: SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-Generate
                title: >-
                  The SherpaOnnxSynthesisEngine class shall generate one audio buffer for a given
                  text, speed, and speaker id, returning the generated samples together with
                  their sample rate.
                justification: |
                  The Speech library's synthesis session drives the backend one rendered segment
                  at a time and needs the generated samples and their rate to resample and play
                  them through the configured audio output device.

              - id: SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-ArgumentValidation
                title: >-
                  The SherpaOnnxSynthesisEngine class's Generate method shall throw
                  ArgumentNullException for a null text argument and ObjectDisposedException
                  after the engine has been disposed.
                justification: |
                  A programming error (null text or use after disposal) should surface
                  immediately with a clear exception, matching this repository's existing
                  argument-validation convention, rather than an opaque failure inside the
                  native engine.

              - id: SpeechSherpa-Synthesis-SherpaOnnxSynthesisEngine-Dispose
                title: >-
                  The SherpaOnnxSynthesisEngine class shall release the loaded native engine on
                  Dispose, and a second Dispose call shall be a no-op.
                justification: |-
                  The loaded engine holds native memory sized to a multi-hundred-megabyte model,
                  so it must be released deterministically when the owning synthesizer engine is
                  disposed, and idempotent disposal keeps teardown paths safe.
