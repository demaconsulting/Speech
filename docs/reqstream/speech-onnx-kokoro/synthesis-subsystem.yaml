---
# Software Subsystem Requirements for the SpeechOnnxKokoro SynthesisSubsystem
#
# These requirements describe the subsystem-level behavior of the SpeechOnnxKokoro
# SynthesisSubsystem, decomposing the system-level requirements in
# docs/reqstream/speech-onnx-kokoro.yaml. This subsystem contains two units: KokoroPhonemePipeline,
# which turns the text of a segment (with the annotations of the English text analysis when there
# are any) into Kokoro's phoneme token ids, and OnnxKokoroSynthesisEngine, the real raw-ONNX
# implementation of the Speech library's public ISynthesisBackend seam (and of its annotated
# derivative IAnnotatedSynthesisBackend) that runs the Kokoro graph once for every part of a
# segment. All synthesis policy above that seam (Layer 2 rendering, chunking, session state
# machine, cancellation, fault containment) remains in the Speech library's own SynthesisSubsystem.
# Each requirement states one observable behavior.
#
# Covered by the SynthesisSubsystem_* tests in test/DemaConsulting.Speech.Onnx.Kokoro.Tests/
# SynthesisSubsystem/OnnxKokoroSynthesisEngineTests.cs, which drive the engine and the real
# pipeline together over a tiny hand-built ONNX fixture (the engine is the way into the subsystem),
# and by the unit tests listed in the per-unit files under
# docs/reqstream/speech-onnx-kokoro/synthesis-subsystem/ (kokoro-phoneme-pipeline.yaml and
# onnx-kokoro-synthesis-engine.yaml).

sections:
  - title: SpeechOnnxKokoro Requirements
    sections:
      - title: SynthesisSubsystem Requirements
        requirements:
          - id: SpeechOnnxKokoro-Synthesis-OnnxBackend
            title: >-
              The SpeechOnnxKokoro SynthesisSubsystem shall implement the Speech library's
              ISynthesisBackend seam so that, for a given text and speaker id, it returns audio
              samples synthesized by the Kokoro v1.0 ONNX graph, returning empty audio for text
              that produces no phonemes and rejecting invalid arguments.
            justification: |
              The Speech library confines every speech-synthesis interop call behind its public
              ISynthesisBackend seam so its own synthesis policy is verifiable without a native
              runtime. A real, ONNX-Runtime-backed implementation of that seam is what turns that
              policy into audible speech for the Kokoro synthesis model this package ships.
            children:
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-Construction
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-ConstructionNullArguments
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-ConstructionEmptyVoiceStyles
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-Generate
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-EmptyPhonemeShortCircuit
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-ArgumentValidation
            tests:
              - SynthesisSubsystem_TextWithoutSounds_ReturnsEmptyAudio

          - id: SpeechOnnxKokoro-Synthesis-TextToPhonemes
            title: >-
              The SynthesisSubsystem shall convert the text of a segment into Kokoro's phoneme
              token ids itself, through the shared English phonemizer: every word of the text is
              spoken, a word that is not in the pronunciation dictionary included (pronounced from
              its spelling), the small function words are spoken in their weak forms as in running
              speech, and text without any sound produces no tokens.
            justification: |
              Unlike sherpa-onnx's native library (used by the sibling SpeechSherpa system), which
              bundles phonemization internally, the bare ONNX export leaves text-to-phoneme
              conversion entirely to the caller. Nothing may be silently omitted: a word that the
              dictionary does not have is pronounced by the letter-to-sound model of the
              phonemizer instead of being dropped. Kokoro was trained on phonemes whose function
              words are reduced, and rendering them that way measured closer to those phonemes
              (phone error rate 1.99 percent with weak forms against 4.88 percent with full forms
              on the tuning sentences, see docs/evaluation/phonemes-en/kokoro-adoption.md), so weak
              forms are the default for this model.
            children:
              - SpeechOnnxKokoro-Synthesis-KokoroPhonemePipeline-PhonemeTokenIds
              - SpeechOnnxKokoro-Synthesis-KokoroPhonemePipeline-WeakForms
              - SpeechOnnxKokoro-Synthesis-KokoroPhonemePipeline-ArgumentValidation
            tests:
              - SynthesisSubsystem_UnknownWord_IsStillSpoken
              - SynthesisSubsystem_TextWithoutSounds_ReturnsEmptyAudio

          - id: SpeechOnnxKokoro-Synthesis-AnnotatedSpeech
            title: >-
              The SynthesisSubsystem shall speak a segment with the annotations of the English text
              analysis when it is given them, speaking the spoken replacement of a number or an
              abbreviation instead of its written text and the reading chosen for a heteronym, and
              shall speak a segment without annotations as written, with the default reading of
              every word and no normalization.
            justification: |
              The session analyzes the whole request and hands each segment's annotations to the
              backend that can use them; the engine is such an annotated backend. The plain
              generation call has no analysis, and its behavior (default readings, no
              normalization) is the documented one for that path, so a caller that wants analyzed
              speech goes through a session.
            children:
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-AnnotatedGeneration
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-PlainGeneration
              - SpeechOnnxKokoro-Synthesis-KokoroPhonemePipeline-ReadingSelection
            tests:
              - SynthesisSubsystem_AnnotatedReplacement_IsSpokenAsReplaced
              - SynthesisSubsystem_AnnotatedHeteronym_IsSpokenWithTheChosenReading

          - id: SpeechOnnxKokoro-Synthesis-LongTextParts
            title: >-
              The SynthesisSubsystem shall speak a segment that has more phoneme tokens than the
              model accepts in one run as several parts, each within the limit, cut between words
              after a clause mark where there is one and losing none of the text, with one run of
              the graph per part, the style row of the voice chosen for each part by its own token
              count, and the audio of the parts joined in order.
            justification: |
              The graph accepts at most 510 phoneme tokens per run and Kokoro's style rows are
              indexed by the token count of the utterance. A longer stretch of text (a long number
              written out, a long run of words without a break) must be spoken whole instead of
              being truncated, and each part is its own utterance with its own style row.
            children:
              - SpeechOnnxKokoro-Synthesis-KokoroPhonemePipeline-LongText
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-GenerationInParts
            tests:
              - SynthesisSubsystem_TextBeyondTokenLimit_IsSpokenInSeveralParts

          - id: SpeechOnnxKokoro-Synthesis-OnnxBackendSampleRate
            title: >-
              The SynthesisSubsystem shall report the model's true fixed output sample rate
              (24000 Hz) to the Speech library.
            justification: |
              The Speech library's synthesis session must resample from the backend's actual
              rate, not a hint.
            children:
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-SampleRate

          - id: SpeechOnnxKokoro-Synthesis-OnnxBackendVoiceSelection
            title: >-
              The SynthesisSubsystem shall synthesize with the style vector of the requested
              voice, chosen by the utterance's length, and fall back to the first available
              voice for an unrecognized speaker id.
            justification: |
              Kokoro's voices are style vectors indexed by utterance length, and a host-selected
              voice must be audibly honored without failing on stale selections.
            children:
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-VoiceSelection
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-StyleVectorSelection
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-StyleVectorRowClamp
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-UnknownSpeakerFallback

          - id: SpeechOnnxKokoro-Synthesis-OnnxBackendLifecycle
            title: >-
              The SynthesisSubsystem shall release the loaded ONNX Runtime session when the
              backend is disposed, tolerate repeated disposal, and reject use after disposal.
            justification: |
              The session holds native memory sized to a multi-hundred-megabyte model, so it must
              be released deterministically and safely.
            children:
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-Dispose
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-DisposeIdempotent
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-UseAfterDispose

          - id: SpeechOnnxKokoro-Synthesis-OnnxBackendProbe
            title: >-
              The SynthesisSubsystem shall provide a probe inference that confirms an ONNX
              Runtime session can run the Kokoro graph, so an unusable accelerated execution
              provider can be rejected before real synthesis.
            justification: |
              Some execution providers load a Kokoro session yet fail at Run() time; session
              construction alone cannot detect that.
            children:
              - SpeechOnnxKokoro-Synthesis-OnnxKokoroSynthesisEngine-ProbeInference
