---
# Software Unit Requirements for OnnxKokoroEnglishSynthesisModel
#
# These requirements describe the design-level behavior of the OnnxKokoroEnglishSynthesisModel
# unit, decomposing the parent SpeechOnnxKokoro ModelManagementSubsystem requirements. Each
# requirement states one observable behavior.
#
# Covered by test/DemaConsulting.Speech.Onnx.Kokoro.Tests/ModelManagementSubsystem/
# OnnxKokoroEnglishSynthesisModelTests.cs.

sections:
  - title: SpeechOnnxKokoro Requirements
    sections:
      - title: ModelManagementSubsystem Requirements
        sections:
          - title: OnnxKokoroEnglishSynthesisModel Requirements
            requirements:
              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-Identity
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall declare a stable catalog
                  identity (Id, DisplayName, Role = Synthesis, AudioTagSupport = None).
                justification: |
                  SpeechModelCatalog and SpeechModelDownloader depend only on the generic
                  ISpeechModel/ISynthesisModel contract; this model must declare its own fixed
                  identity for the catalog and downloader to enumerate and fetch it correctly.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_Identity_DeclaresExpectedValues

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-License
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall declare
                  LicenseName = "Apache-2.0" with a canonical LicenseUrl to the Apache-2.0 full
                  text.
                justification: |
                  This model's license must be discoverable programmatically, not only via
                  DisplayName prose or XML documentation.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_License_DeclaresApache2

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-VoiceOptions
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall declare a single voice
                  ChoiceParameter offering its 29 confirmed American and British English voices,
                  with "af_heart" as the default.
                justification: |
                  A host needs the real, enumerable voice list to offer voice selection, and the
                  model must declare only the voices its embedded English-only phonemizer can
                  correctly serve.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_VoiceParameter_Declares29VoicesWithDefault

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-DownloadDescriptor
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall declare 30 individual download
                  files (the ONNX model graph and 29 voice style-vector files), each with its own
                  relative install path, requiring no post-download archive extraction.
                justification: |
                  SpeechModelDownloader depends only on the generic ISpeechModel download
                  descriptor; this model must declare every individual file its engine
                  construction needs, and since none of its files are archived, it needs no
                  InstallAsync override.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_DownloadDescriptor_DeclaresModelGraphAndEveryVoiceFile

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-DownloadIntegrity
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall declare every download file
                  with an HTTPS address, a well-formed SHA-256 checksum, and a unique relative
                  install path.
                justification: |
                  Checksum-verified HTTPS downloads protect a host against tampered or corrupted
                  model files, and unique install paths prevent files overwriting each other.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_DownloadDescriptor_FilesHaveHttpsChecksumAndUniquePaths

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-EngineConstruction
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class's CreateBackend method shall
                  construct a loaded synthesis engine from the ONNX model graph and every
                  declared voice's style-vector file found in the installed-model directory.
                justification: |
                  The SynthesisSubsystem depends on this model constructing a correctly
                  configured, loaded engine from the files its download descriptor installed.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_CreateBackend_ValidModelAndVoices_GeneratesUsingSelectedVoiceStyle

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-EngineConstructionArgumentValidation
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class's CreateBackend method shall throw
                  ArgumentException for a null or empty installed-model directory.
                justification: |
                  A programming error (empty installed-model directory) should surface
                  immediately with a clear exception, before any model or voice file is loaded.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_CreateBackend_EmptyDirectory_ThrowsArgumentException

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-SessionDisposedOnFailure
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class's CreateBackend method shall release
                  the ONNX Runtime session it already created if a later failure while loading a
                  voice style-vector file prevents the engine from being constructed.
                justification: |
                  The session is created before any voice-style file is read, so a missing or
                  unreadable voice file can fail after the session already holds a native
                  OrtSession handle; without release that handle would leak on every such failure.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_CreateBackend_MissingVoiceFile_DisposesSessionAndThrows

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-PreferredAudioFormat
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall declare a mono
                  PreferredAudioFormat hint of 24000 Hz, matching the model's own fixed output
                  sample rate.
                justification: |
                  A host can use this hint to open playback nearer the model's actual rate
                  before loading the engine.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_PreferredAudioFormat_IsMono24000

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-ResolveSpeakerId
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class shall map each of its 29 declared
                  voice values to that voice's ordinal index within the model's declared voice
                  order via ISynthesisModel.ResolveSpeakerId.
                justification: |-
                  ISynthesisModel.ResolveSpeakerId lets SynthesisSession turn a selected voice
                  name into the real speaker id this model's engine needs.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_ResolveSpeakerId_KnownVoice_ReturnsDeclarationOrderIndex

              - id: SpeechOnnxKokoro-Models-OnnxKokoroEnglishSynthesisModel-ResolveSpeakerIdDefaultFallback
                title: >-
                  The OnnxKokoroEnglishSynthesisModel class's ResolveSpeakerId method shall return
                  the declared default voice's index, rather than throwing, for a null value bag,
                  a missing key, or an unrecognized voice value.
                justification: |-
                  Never throwing on a missing or unrecognized selection keeps synthesis available
                  even for a malformed or stale caller-supplied value bag.
                tests:
                  - OnnxKokoroEnglishSynthesisModel_ResolveSpeakerId_UnknownVoice_ReturnsDefaultId
                  - OnnxKokoroEnglishSynthesisModel_ResolveSpeakerId_NullBag_ReturnsDefaultId
                  - OnnxKokoroEnglishSynthesisModel_ResolveSpeakerId_MissingKey_ReturnsDefaultId
