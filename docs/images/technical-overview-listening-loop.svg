<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Segoe UI, Arial, sans-serif">
  <!-- The listening-improvement loop of the DEMA English front end (Text.En and Phonemes.En): listen in the
       Proofreader, flag, triage by category, fix in the owning component, add the sentence to the regression
       overlay, run the gates, ship, and listen again. A white card with a thin border, so the figure reads the
       same on a light and a dark page. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="880" height="520" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="44" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">The listening-improvement loop of the DEMA English front end</text>

  <!-- Row 1: listen, flag, triage -->
  <rect x="60" y="66" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="92" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Listen</text>
  <text x="180" y="112" font-size="12.5" fill="#1e40af" text-anchor="middle">Proofreader plays a text</text>
  <text x="180" y="128" font-size="12.5" fill="#1e40af" text-anchor="middle">sentence by sentence</text>
  <line x1="300" y1="101" x2="328" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="330" y="66" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="92" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">2. Flag and export</text>
  <text x="450" y="112" font-size="12.5" fill="#1e40af" text-anchor="middle">TSV row: category, readings with</text>
  <text x="450" y="128" font-size="12.5" fill="#1e40af" text-anchor="middle">confidence, phonemes</text>
  <line x1="570" y1="101" x2="598" y2="101" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="66" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="92" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">3. Triage by category</text>
  <text x="720" y="112" font-size="12.5" fill="#1e40af" text-anchor="middle">the category names the</text>
  <text x="720" y="128" font-size="12.5" fill="#1e40af" text-anchor="middle">component that is fixed</text>

  <!-- Fan out from triage to the four fixes -->
  <path d="M720,136 L720,156 L135,156" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="765" y1="156" x2="720" y2="156" stroke="#475569" stroke-width="2"/>
  <line x1="135" y1="156" x2="135" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="156" x2="345" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="555" y1="156" x2="555" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="765" y1="156" x2="765" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row 2: the fix for each category -->
  <rect x="40" y="178" width="190" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="135" y="202" font-size="13" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">wrong-heteronym</text>
  <text x="135" y="226" font-size="12.5" fill="#92400e" text-anchor="middle">Text.En heteronym</text>
  <text x="135" y="244" font-size="12.5" fill="#92400e" text-anchor="middle">classifier: training</text>
  <text x="135" y="262" font-size="12.5" fill="#92400e" text-anchor="middle">data or a cue prior</text>

  <rect x="250" y="178" width="190" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="202" font-size="13" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">normalization</text>
  <text x="345" y="226" font-size="12.5" fill="#92400e" text-anchor="middle">number, unit or symbol:</text>
  <text x="345" y="244" font-size="12.5" fill="#92400e" text-anchor="middle">Text.En normalization</text>
  <text x="345" y="262" font-size="12.5" fill="#92400e" text-anchor="middle">rules</text>

  <rect x="460" y="178" width="190" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="555" y="202" font-size="13" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">mispronounced-word</text>
  <text x="555" y="226" font-size="12.5" fill="#92400e" text-anchor="middle">Phonemes.En lexicon</text>
  <text x="555" y="244" font-size="12.5" fill="#92400e" text-anchor="middle">additions and</text>
  <text x="555" y="262" font-size="12.5" fill="#92400e" text-anchor="middle">corrections tables</text>

  <rect x="670" y="178" width="190" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="765" y="202" font-size="13" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">prosody-or-pause</text>
  <text x="765" y="226" font-size="12.5" fill="#92400e" text-anchor="middle">pause or stress:</text>
  <text x="765" y="244" font-size="12.5" fill="#92400e" text-anchor="middle">Phonemes.En</text>
  <text x="765" y="262" font-size="12.5" fill="#92400e" text-anchor="middle">rendering rules</text>

  <!-- Fan in from the fixes to the regression overlay -->
  <line x1="135" y1="270" x2="135" y2="292" stroke="#475569" stroke-width="2"/>
  <line x1="345" y1="270" x2="345" y2="292" stroke="#475569" stroke-width="2"/>
  <line x1="555" y1="270" x2="555" y2="292" stroke="#475569" stroke-width="2"/>
  <line x1="765" y1="270" x2="765" y2="292" stroke="#475569" stroke-width="2"/>
  <line x1="135" y1="292" x2="765" y2="292" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="292" x2="180" y2="314" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Row 3: lock in, gates, ship -->
  <rect x="60" y="316" width="240" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="342" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">4. Lock it in</text>
  <text x="180" y="366" font-size="12.5" fill="#1e40af" text-anchor="middle">add the flagged sentence to the</text>
  <text x="180" y="384" font-size="12.5" fill="#1e40af" text-anchor="middle">regression overlay (or a golden</text>
  <text x="180" y="402" font-size="12.5" fill="#1e40af" text-anchor="middle">test) so it cannot come back</text>
  <line x1="300" y1="368" x2="328" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="330" y="316" width="240" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="342" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">5. Run the gates</text>
  <text x="450" y="364" font-size="12.5" fill="#166534" text-anchor="middle">quality gate on the natural holdout</text>
  <text x="450" y="381" font-size="12.5" fill="#166534" text-anchor="middle">golden tests and regression overlay</text>
  <text x="450" y="398" font-size="12.5" fill="#166534" text-anchor="middle">--check: data, model and record</text>
  <text x="450" y="414" font-size="12.5" fill="#166534" text-anchor="middle">are reproduced byte for byte</text>
  <line x1="570" y1="368" x2="598" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="316" width="240" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="342" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">6. Ship</text>
  <text x="720" y="366" font-size="12.5" fill="#1e40af" text-anchor="middle">the fixed front end goes out</text>
  <text x="720" y="384" font-size="12.5" fill="#1e40af" text-anchor="middle">with the Piper and Kokoro</text>
  <text x="720" y="402" font-size="12.5" fill="#1e40af" text-anchor="middle">model packages</text>

  <!-- Back to the start -->
  <path d="M720,420 L720,450 L32,450 L32,101 L58,101" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="376" y="442" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">listen again, with new text</text>

  <!-- Scope -->
  <text x="450" y="484" font-size="12.5" fill="#334155" text-anchor="middle">Applies to the voices that speak through the DEMA English front end (Text.En and Phonemes.En):</text>
  <text x="450" y="504" font-size="12.5" fill="#334155" text-anchor="middle">today the direct-ONNX Piper and Kokoro models. Other synthesis models and speech-to-text are not part of it.</text>
</svg>
