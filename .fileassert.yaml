---
# FileAssert document validation tests for Speech.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: api-docs, build-notes, code-quality, code-review, design, verification, user-guide,
# requirements.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.

tests:

  # --- API DOCUMENTATION ---

  - name: ApiMark_NuGetPackageContainsDocs
    description: "NuGet package contains API documentation generated by ApiMark"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Speech/bin/Release/DemaConsulting.Speech.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
            - pattern: "api/**/*.md"
              min: 50

  - name: Kokoro_Package_LicenseFilesPackaged
    description: "Kokoro NuGet package ships its combined license file and third-party notices at the package root"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Speech.Onnx.Kokoro/bin/Release/DemaConsulting.Speech.Onnx.Kokoro.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "PACKAGE-LICENSE.md"
              min: 1
              max: 1
              text:
                - contains: "SPDX-License-Identifier: MIT AND Apache-2.0\n"
                - contains: "THIRD-PARTY-NOTICES.md"
            - pattern: "THIRD-PARTY-NOTICES.md"
              min: 1
              max: 1
              text:
                - contains: "Kokoro-82M"
                - contains: "Apache License"
            - pattern: "DemaConsulting.Speech.Onnx.Kokoro.nuspec"
              min: 1
              max: 1
              text:
                - contains: 'type="file">PACKAGE-LICENSE.md</license>'

  - name: PhonemesEn_PackageLicenseFiles_Content
    description: "Phonemes.En NuGet package, when it is packed (only for a pre-release version), ships its license file (MIT AND LicenseRef-CMUdict with the CMUdict license text) and its third-party notices at the package root and names the license file in its nuspec"
    tags: [api-docs]
    files:
      # Phonemes.En is packed only for a pre-release version (its Text.En dependency chain is pre-release), so no
      # package at all (min: 0) is valid for a stable version; when a package exists it must be exactly one and
      # satisfy every check below.
      - pattern: "src/DemaConsulting.Speech.Phonemes.En/bin/Release/DemaConsulting.Speech.Phonemes.En.*.nupkg"
        min: 0
        max: 1
        zip:
          files:
            - pattern: "PACKAGE-LICENSE.md"
              min: 1
              max: 1
              text:
                # The line break makes the match exact: the declaration is exactly MIT AND LicenseRef-CMUdict.
                - contains: "SPDX-License-Identifier: MIT AND LicenseRef-CMUdict\n\n# License of the DemaConsulting.Speech.Phonemes.En Package"
                - contains: "THIRD-PARTY-NOTICES.md"
                - contains: "CMU Pronouncing Dictionary"
                - contains: "Carnegie Mellon University"
            - pattern: "THIRD-PARTY-NOTICES.md"
              min: 1
              max: 1
              text:
                - contains: "CMU Pronouncing Dictionary (CMUdict)"
                - contains: "Copyright (C) 1993-2015 Carnegie Mellon University"
                - contains: "cmudict-en.bin.gz"
                - contains: "lts-en.bin.gz"
            - pattern: "DemaConsulting.Speech.Phonemes.En.nuspec"
              min: 1
              max: 1
              text:
                - contains: 'type="file">PACKAGE-LICENSE.md</license>'

  - name: PhonemesEn_PackagePublicApi_Surface
    description: "Phonemes.En NuGet package, when it is packed (only for a pre-release version), exposes as public API only the phonemizer with its result types and the two renderers with their profiles (the lexicon, morphology, letter-to-sound and reading tables are internal) and declares no speech-engine inference runtime as a dependency"
    tags: [api-docs]
    files:
      - pattern: "src/DemaConsulting.Speech.Phonemes.En/bin/Release/DemaConsulting.Speech.Phonemes.En.*.nupkg"
        min: 0
        max: 1
        zip:
          files:
            # The nine public types: the phonemizer and its result types, the two renderers and their profiles
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.PhonemizerSubsystem/EnglishPhonemizer.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.PhonemizerSubsystem/PhonemizedText.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.PhonemizerSubsystem/PhonemizedItem.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.PhonemizerSubsystem/PhonemizedItemKind.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.PhonemizerSubsystem/PronunciationSource.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.RenderingSubsystem/EspeakIpaRenderer.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.RenderingSubsystem/EspeakIpaProfile.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.RenderingSubsystem/MisakiRenderer.md"
              min: 1
              max: 1
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.RenderingSubsystem/MisakiProfile.md"
              min: 1
              max: 1
            # Nothing of the internal subsystems is documented as API
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.LexiconSubsystem*"
              max: 0
            - pattern: "api/DemaConsulting.Speech.Phonemes.En.LetterToSoundSubsystem*"
              max: 0
            - pattern: "DemaConsulting.Speech.Phonemes.En.nuspec"
              min: 1
              max: 1
              text:
                # No inference runtime (ONNX Runtime, sherpa-onnx) is pulled into the consumers of the phonemizer.
                - does-not-contain-regex: '(?i)dependency id="[^"]*(onnx|sherpa)'

  - name: TextEn_PackageLicenseFiles_Content
    description: "Text.En NuGet package, when it is packed (only for a pre-release version), ships its license file (MIT AND CC-BY-3.0-US, naming the embedded heteronym model) and its notices (MASC attribution, dependency notice) at the package root and names the license file in its nuspec"
    tags: [api-docs]
    files:
      # Text.En is packed only for a pre-release version while its DemaConsulting.PartOfSpeech
      # dependency is pre-release, so no package at all (min: 0) is valid for a stable version;
      # when a package exists it must be exactly one and satisfy every check below.
      - pattern: "src/DemaConsulting.Speech.Text.En/bin/Release/DemaConsulting.Speech.Text.En.*.nupkg"
        min: 0
        max: 1
        zip:
          files:
            - pattern: "PACKAGE-LICENSE.md"
              min: 1
              max: 1
              text:
                # The line break makes the match exact: the declaration is exactly MIT AND CC-BY-3.0-US (the embedded model is provided under the terms of the license of the MASC-derived data it was trained on), never a longer expression that merely starts with it.
                - contains: "SPDX-License-Identifier: MIT AND CC-BY-3.0-US\n\n# License of the DemaConsulting.Speech.Text.En Package"
                - contains: "THIRD-PARTY-NOTICES.md"
                - contains: "heteronyms.bin"
                - contains: "Manually Annotated Sub-Corpus"
                - contains: "CC0"
            - pattern: "THIRD-PARTY-NOTICES.md"
              min: 1
              max: 1
              text:
                - contains: "Dependency Notice"
                - contains: "Princeton University"
                - contains: "Manually Annotated Sub-Corpus (MASC)"
                - contains: "https://creativecommons.org/licenses/by/3.0/us/"
                - contains: "heteronyms.bin"
                - contains: "CC0 1.0"
                - contains: "do not endorse"
            - pattern: "DemaConsulting.Speech.Text.En.nuspec"
              min: 1
              max: 1
              text:
                - contains: 'type="file">PACKAGE-LICENSE.md</license>'

  - name: TextEn_PackageDependencies_Nuspec
    description: "Text.En NuGet package, when it is packed (only for a pre-release version), declares the DemaConsulting.PartOfSpeech tagger as a dependency pinned to one exact version and declares no speech-engine inference runtime"
    tags: [api-docs]
    files:
      # As for the license test: a stable version packs no Text.En package at all (min: 0), and a package
      # that exists must satisfy every check below. A pre-release package is also what makes a stable
      # package that depends on the pre-release tagger impossible (NuGet refuses it, NU5104).
      - pattern: "src/DemaConsulting.Speech.Text.En/bin/Release/DemaConsulting.Speech.Text.En.*.nupkg"
        min: 0
        max: 1
        zip:
          files:
            - pattern: "DemaConsulting.Speech.Text.En.nuspec"
              min: 1
              max: 1
              text:
                # The tagger is a dependency, and every declaration of it uses the exact-version range [x.y.z].
                - matches: 'dependency id="DemaConsulting\.PartOfSpeech" version="\[[^\],]+\]"'
                - does-not-contain-regex: 'dependency id="DemaConsulting\.PartOfSpeech" version="(?!\[[^\],]+\]")'
                # No inference runtime (ONNX Runtime, sherpa-onnx) is pulled into the consumers of the text analysis.
                - does-not-contain-regex: '(?i)dependency id="[^"]*(onnx|sherpa)'

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
